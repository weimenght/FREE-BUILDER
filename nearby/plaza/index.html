      if (Math.abs(x - G.cx) < G.rx + 6 && Math.abs(y - G.cy) < G.ry + 8 && b.fly === 0) y = G.cy + G.ry + 10;
      b.px = x; b.py = y;
      var pk = b.peck > 0 ? 1 : 0, d = b.d;
      R(x - 3, y - 3, 6, 3, "#8a8a96"); R(x + (d > 0 ? 2 : -4), y - 5 + pk * 2, 2, 2, "#6a6a7a"); R(x + (d > 0 ? 4 : -5), y - 4 + pk * 2, 1, 1, "#e0a040");
      R(x - 2, y - 3, 3, 1, "#7a9a8a"); if (b.fly) { R(x - 5, y - 5 - (f % 6 < 3 ? 2 : 0), 3, 1, "#9a9aa6"); R(x + 2, y - 5 - (f % 6 < 3 ? 2 : 0), 3, 1, "#9a9aa6"); } else { R(x - 1, y, 1, 1, "#c86a5a"); R(x + 1, y, 1, 1, "#c86a5a"); }
    });
    /* the coin you're tossing */
    if (toss) { var p = toss.p; R(p.x - 1, p.y - 1, 3, 3, "#f6c84a"); R(p.x, p.y - 1, 1, 1, "#fffbe0"); }
    /* weather */
    if (wet) drops.forEach(function (d) { R(d.x, d.y, 1, 3, "rgba(200,220,255,.55)"); });
    if (snow) flakes.forEach(function (d) { R(d.x, d.y, 1, 1, "#ffffff"); });
    if (wx === "fog") { g.fillStyle = "rgba(220,224,230,.28)"; g.fillRect(0, 0, PW, PH); }
    if (lit) { g.fillStyle = night ? "rgba(10,10,40,.28)" : "rgba(60,30,60,.12)"; g.fillRect(0, 0, PW, PH); }
  }

  function step() {
    var wx = W.weather(), cx0 = G.cx, colTop = G.cy - G.col;
    var bw = Math.round(G.rx * .38), T0 = 2 * 1 / .06;
    if (wx !== "snow" && (!reduce || f % 3 === 0)) for (var j = 0; j < 3; j++) { var a = (hash(f + j * 13) - .5) * 2; jets.push({ x: cx0, y: colTop - 9, vx: a * bw / T0, vy: -.8 - hash(f + j) * .25, big: j === 0 }); }
    jets = jets.filter(function (p) {
      p.x += p.vx; p.y += p.vy; p.vy += p.drip ? .04 : .06;
      if (!p.drip && p.vy > 0 && p.y >= colTop - 1) { if (Math.abs(p.x - cx0) > bw * .55 || hash(p.x * 7 + f) < .4) { p.drip = 1; p.x = cx0 + (p.x < cx0 ? -1 : 1) * (bw - 1 - hash(f + p.y) * 2); p.y = colTop + 1; p.vx = (p.x < cx0 ? -1 : 1) * .12; p.vy = .2; } else return false; }
      if (p.drip && p.y > G.cy - 1) { if (hash(f + p.x) < .15) splash.push({ x: p.x, y: p.y - 1, a: .8 }); return false; }
      return p.y < PH;
    });
    splash = splash.filter(function (s) { s.y -= .2; s.a -= .08; return s.a > 0; });
    rings = rings.filter(function (r) { r.r += .35; r.a -= .02; return r.a > 0; });
    if (f % 40 === 0 && !reduce && wx !== "snow") rings.push({ x: cx0 + (hash(f) - .5) * G.rx * .9, y: G.cy + (hash(f + 1) - .5) * G.ry * .8, r: 1, a: .5 });
    if (wx === "rain" || wx === "storm") { for (var d = 0; d < (wx === "storm" ? 4 : 2); d++) drops.push({ x: Math.random() * PW, y: -3 }); drops = drops.filter(function (q) { q.y += 4; q.x -= .4; if (q.y > G.cy - G.ry && q.y < G.cy + G.ry && Math.abs(q.x - G.cx) < G.rx * .9 && Math.random() < .03) rings.push({ x: q.x, y: q.y, r: 1, a: .35 }); return q.y < PH; }); } else drops = [];
    if (wx === "snow") { if (Math.random() < .5) flakes.push({ x: Math.random() * PW, y: -2, s: Math.random() }); flakes = flakes.filter(function (q) { q.y += .4 + q.s * .4; q.x += Math.sin((f + q.s * 99) / 20) * .3; return q.y < PH; }); } else flakes = [];
    birds.forEach(function (b) {
      if (b.gone > 0) { b.gone--; if (!b.gone) { b.fx = b.fy = null; b.fly = 0; b.x = hash(f + 3); b.y = hash(f + 4); } return; }
      if (b.fly) { b.fx += b.vx; b.fy += b.vy; b.vy -= .02; if (b.fy < -10 || b.fx < -10 || b.fx > PW + 10) { b.gone = 600 + (hash(f) * 900 | 0); } return; }
      if (b.peck > 0) b.peck--; else if (Math.random() < .015) b.peck = 10;
      if (Math.random() < .01) { b.x = Math.max(0, Math.min(1, b.x + (Math.random() - .5) * .06)); b.d = Math.random() < .5 ? -1 : 1; }
    });
    if (toss) {
      var k = toss, t = Math.min(1, (Date.now() - k.t0) / k.dur), e = t; k.p = { x: k.a.x + (k.b.x - k.a.x) * e, y: k.a.y + (k.b.y - k.a.y) * e - Math.sin(e * Math.PI) * k.h };
      if (t >= 1 && W.weather() === "snow") { toss = null; for (var s2 = 0; s2 < 6; s2++) splash.push({ x: k.b.x + (Math.random() - .5) * 4, y: k.b.y - Math.random() * 2, a: .9 }); plink(true); if (k.done) k.done(); return; }
      if (t >= 1) { toss = null; for (var s = 0; s < 14; s++) splash.push({ x: k.b.x + (Math.random() - .5) * 6, y: k.b.y - Math.random() * 6, a: 1 }); rings.push({ x: k.b.x, y: k.b.y, r: 1, a: 1 }); rings.push({ x: k.b.x, y: k.b.y, r: 3, a: .7 }); plink(); if (k.done) k.done(); }
    }
  }
  function loop(ts) { if (!document.hidden) { if (!loop.l || ts - loop.l > 33) { loop.l = ts; f++; step(); draw(); } } requestAnimationFrame(loop); }
  requestAnimationFrame(loop);

  /* a small synthesised plink and splash when the coin lands */
  var AC = null;
  function plink(ice) {
    try {
      AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === "suspended") AC.resume();
      var t0 = AC.currentTime, o = AC.createOscillator(), gg = AC.createGain(); o.type = "sine"; o.frequency.setValueAtTime(ice ? 2900 : 1900, t0); o.frequency.exponentialRampToValueAtTime(ice ? 2600 : 1300, t0 + .25);
      gg.gain.setValueAtTime(.0001, t0); gg.gain.exponentialRampToValueAtTime(.12, t0 + .005); gg.gain.exponentialRampToValueAtTime(.0001, t0 + .5); o.connect(gg); gg.connect(AC.destination); o.start(t0); o.stop(t0 + .55);
      var n = AC.createBufferSource(), b = AC.createBuffer(1, AC.sampleRate * .4, AC.sampleRate), d = b.getChannelData(0); for (var i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);
      var bp = AC.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 2400; bp.Q.value = .7; var ng = AC.createGain(); ng.gain.value = .09; n.buffer = b; n.connect(bp); bp.connect(ng); ng.connect(AC.destination); n.start(t0 + .02);
    } catch (e) {}
  }

  function at(e) { var r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * PW, y: (e.clientY - r.top) / r.height * PH }; }
  function pickCoin(p) { var best = null, bd = 64; coinsAll().forEach(function (k) { if (k.kept) return; var d = (k.x - p.x) * (k.x - p.x) + (k.y - p.y) * (k.y - p.y) * 2; if (d < bd) { bd = d; best = k; } }); return best; }
  cv.addEventListener("pointerdown", function (e) {
    var p = at(e), k = pickCoin(p); if (k) { openCoin(k); return; }
    birds.forEach(function (b) { if (!b.fly && !b.gone && b.px != null && Math.abs(b.px - p.x) < 24 && Math.abs(b.py - p.y) < 18) { b.fly = 1; b.fx = b.px; b.fy = b.py; b.vx = (b.px < p.x ? -1 : 1) * (.8 + Math.random() * .6); b.vy = -1.2; } });
    if (Math.abs(p.x - G.cx) < G.rx && Math.abs(p.y - G.cy) < G.ry) rings.push({ x: p.x, y: p.y, r: 1, a: .8 });
  });
  cv.addEventListener("pointermove", function (e) { cv.style.cursor = pickCoin(at(e)) ? "pointer" : ""; });

  /* ---------- the wish ---------- */
  function sb() { return new Promise(function (res) { if (window.FB_SUPABASE && FB_SUPABASE.url) return res(FB_SUPABASE); var sc = document.createElement("script"); sc.src = "/config.js"; sc.onload = sc.onerror = function () { res(window.FB_SUPABASE || {}); }; document.head.appendChild(sc); }); }
  function rpc(fn, body) { return sb().then(function (c) { if (!c.url) throw new Error("offline"); return fetch(c.url + "/rest/v1/rpc/" + fn, { method: "POST", headers: { apikey: c.anonKey, Authorization: "Bearer " + c.anonKey, "Content-Type": "application/json" }, body: JSON.stringify(body || {}) }).then(function (r) { return r.text().then(function (x) { var j = null; try { j = x ? JSON.parse(x) : null; } catch (e) {} if (!r.ok) throw new Error((j && j.message) || "error"); return j; }); }); }); }
  /* the town's device key, hashed with this place: a wish can't be linked to what this device made anywhere else */
  var secretP = null;
  function secret() {
    if (secretP) return secretP;
    var k = null; try { k = localStorage.getItem("fb_device_key"); } catch (e) {}
    if (!k) { var a = new Uint8Array(32); crypto.getRandomValues(a); k = btoa(String.fromCharCode.apply(null, a)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); try { localStorage.setItem("fb_device_key", k); } catch (e) {} }
    secretP = crypto.subtle.digest("SHA-256", new TextEncoder().encode("plaza:" + k)).then(function (b) { return Array.prototype.map.call(new Uint8Array(b), function (x) { return ("0" + x.toString(16)).slice(-2); }).join(""); });
    return secretP;
  }
  function note(text, icon) { try { if (window.FBG && FBG.note) { FBG.note({ icon: icon || "⛲", text: text }); return; } } catch (e) {} }
  function refresh() { return rpc("wish_list", { p_limit: 40 }).then(function (l) { shared = Array.isArray(l) ? l : []; }).catch(function () {}); }
  setTimeout(refresh, 600); addEventListener("fbback", refresh);
  /* once a visit: if someone hoped with one of your wishes, you hear it once */
  if (mine.length) setTimeout(function () {
    try { if (sessionStorage.getItem("fb_plaza_news")) return; sessionStorage.setItem("fb_plaza_news", "1"); } catch (e) {}
    secret().then(function (s) { return rpc("wish_mine", { p_secret: s }); }).then(function (l) {
      if (!Array.isArray(l)) return; mine = l.map(function (w) { return w.id; }); keep("fb_plaza_mine", mine);
      if (l.some(function (w) { return w.news; })) note(t("news"), "🤞");
    }).catch(function () {});
  }, 2500);

  var sheetFor = null;
  function show(id) { ["ask", "coin"].forEach(function (s) { $(s).hidden = s !== id; }); $("dock").hidden = !!id; sheetFor = id; }
  [].forEach.call(document.querySelectorAll("[data-close]"), function (b) { b.onclick = function () { show(null); }; });
  addEventListener("keydown", function (e) { if (e.key === "Escape" && sheetFor) show(null); });
  var inp = $("wishIn");
  function lim() { $("lim").textContent = inp.value.length > 60 ? (80 - inp.value.length) : ""; }
  inp.addEventListener("input", lim);
  $("wishBtn").onclick = function () { inp.value = ""; lim(); show("ask"); setTimeout(function () { try { inp.focus({ preventScroll: true }); } catch (e) {} }, 60); };
  function throwCoin(target, done) {
    var r = cv.getBoundingClientRect(), b = $("wishBtn").getBoundingClientRect();
    var a = { x: (b.left + b.width / 2 - r.left) / r.width * PW, y: (b.top - r.top) / r.height * PH };
    toss = { a: a, b: target, h: G.col * 1.1 + 20, t0: Date.now(), dur: reduce ? 300 : 900, p: a, done: done };
  }
  $("keepBtn").onclick = function () {
    show(null); var seed = Date.now() % 1e6; kept.push(seed); kept = kept.slice(-30);
    throwCoin(spot(seed + 1e5), function () { keep("fb_plaza_kept", kept); });
  };
  $("floatBtn").onclick = function () {
    var w = inp.value.replace(/\s+/g, " ").trim().slice(0, 80);
    if (!w) { inp.classList.remove("fbhop"); void inp.offsetWidth; inp.animate && inp.animate([{ transform: "translateX(0)" }, { transform: "translateX(-6px)" }, { transform: "translateX(6px)" }, { transform: "translateX(0)" }], { duration: 260 }); inp.focus(); return; }
    show(null);
    var land = spot(Date.now() % 1e6 + 2e5), sent = secret().then(function (s) { return rpc("wish_add", { p_secret: s, p_wish: w }); });
    throwCoin(land, function () {
      sent.then(function (id) { if (id == null) throw new Error("x"); mine.push(id); keep("fb_plaza_mine", mine); shared.unshift({ id: id, wish: w, at: new Date().toISOString().slice(0, 10) }); })
        .catch(function (e) { var seed = Date.now() % 1e6; kept.push(seed); keep("fb_plaza_kept", kept); note(/rest/.test(e && e.message) ? t("rest") : t("away"), "🪙"); });
    });
  };
  var cur = null;
  function openCoin(k) {
    cur = k; var w = k.w; $("coinW").textContent = "“" + w.wish + "”"; $("coinAt").textContent = (k.mine ? t("yours") + " · " : "") + (w.at || "");
    var hb = $("hopeBtn"), did = hoped.indexOf(w.id) >= 0;
    hb.innerHTML = ""; var ic = document.createElement("span"); ic.setAttribute("aria-hidden", "true"); ic.textContent = k.mine ? "↩ " : "🤞 "; hb.appendChild(ic); hb.appendChild(document.createTextNode(k.mine ? t("back") : did ? t("hoped") : t("hope")));
    hb.disabled = !k.mine && did; hb.className = "fbb" + (k.mine ? "" : " fbb-pri");
    $("repBtn").hidden = !!k.mine; $("repBtn").textContent = t("rep"); $("repBtn").disabled = false;

    if (k.mine) { secret().then(function (s) { return rpc("wish_forget", { p_secret: s, p_id: id }); }).then(function () { shared = shared.filter(function (w) { return w.id !== id; }); mine = mine.filter(function (x) { return x !== id; }); keep("fb_plaza_mine", mine); }).catch(function () {}); show(null); return; }
    hoped.push(id); keep("fb_plaza_hoped", hoped); rings.push({ x: k.x, y: k.y, r: 1, a: 1 }); rings.push({ x: k.x, y: k.y, r: 4, a: .6 });
    secret().then(function (s) { return rpc("wish_hope", { p_secret: s, p_id: id }); }).catch(function () {});
    show(null);
  };
  $("repBtn").onclick = function () {
    var k = cur; if (!k) return; var id = k.w.id; this.disabled = true; this.textContent = t("repd");
    secret().then(function (s) { return rpc("wish_report", { p_secret: s, p_id: id }); }).catch(function () {});
    setTimeout(function () { show(null); }, 1200);
  };
})();
