          for (let i = 0; i < 8; i++) {
            const bx = x1 + 8 + Math.random() * (x2 - x1 - 16);
            const dur = (1.6 + Math.random() * 1.8).toFixed(2);
            bubbles += `<circle cx="${bx}" cy="${y2 - 4}" r="1.6" fill="rgba(255,255,255,.75)"><animate attributeName="cy" from="${y2 - 4}" to="${lvl + 2}" dur="${dur}s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="${dur}s" repeatCount="indefinite"/></circle>`;
          }
        }
        const foamLayer = (foam && vol) ? `<rect x="${x1 - 10}" y="${lvl - 1}" width="${x2 - x1 + 20}" height="9" fill="#fbf4e6" opacity=".95"/>` : '';
        const garn = this.garnish !== 'none' ? `<text x="${s.rim[1] - 14}" y="${s.rim[2] + 4}" font-size="22">${GARNISHES[this.garnish]}</text>` : '';

        wrap.innerHTML = `
          <svg viewBox="0 0 170 200" width="170" height="200" xmlns="http://www.w3.org/2000/svg">
            <defs><clipPath id="glass-clip"><path d="${s.inner}"/></clipPath>
              <linearGradient id="liq" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".92"/><stop offset="1" stop-color="${color}" stop-opacity="1"/></linearGradient></defs>
            <ellipse cx="85" cy="192" rx="56" ry="6" fill="rgba(0,0,0,.35)"/>
            <g clip-path="url(#glass-clip)">
              ${vol ? `<rect x="0" y="${lvl}" width="170" height="200" fill="url(#liq)"><animate attributeName="y" from="${y2}" to="${lvl}" dur=".35s" fill="freeze"/></rect>` : ''}
              ${foamLayer}${ice}${bubbles}
              <rect x="${x1 + 6}" y="${y1}" width="6" height="${y2 - y1}" fill="rgba(255,255,255,.18)"/>
            </g>
            <path d="${s.path}" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="3" stroke-linejoin="round"/>
            ${s.stem}
            ${garn}
          </svg>`;
      },

      profile() {
        const V = this.volume();
        const dilMethod = { shake: this.ice === 'crushed' ? 0.32 : 0.25, stir: 0.18, build: { none: 0, rock: 0.06, cubes: 0.1, crushed: 0.18 }[this.ice] }[this.method];
        const Vf = V * (1 + dilMethod) || 1;
        let alc = 0, sweet = 0, sour = 0, bitter = 0, aroma = 0;
        const ids = Object.keys(this.pours);
        ids.forEach(id => {
          const ing = ING[id];
          const vol = this.pours[id] * ing.step;
          alc += vol * ing.abv;
          sweet += vol * ing.sweet;
          sour += vol * ing.sour;
          bitter += vol * ing.bitter;
          aroma += vol * ing.aroma;
        });
        const k = 100 / Vf;
        const p = {
          volume: V,
          abv: Math.round(alc / Vf * 1000) / 10,
          sweet: Math.round(sweet * k * 10) / 10,
          sour: Math.round(sour * k * 10) / 10,
          bitter: Math.round(bitter * k * 10) / 10,
          aroma: Math.round(aroma * k * 10) / 10,
          has: ids
        };
        if (alc === 0) p.abv = 0;

        // judgement
        const notes = [];
        let score = 74;
        const citrus = ids.some(id => ING[id].cat === 'sour' && !ING[id].foam);
        const fizz = ids.some(id => ING[id].fizz);
        if (V < 30) { notes.push('tiny'); score = 20; }
        else {
          if (p.abv > 38) { notes.push('tooStrong'); score -= 30; }
          else if (p.abv > 0 && p.abv < 4) { notes.push('watery'); score -= 22; }
          if (p.sweet > 28 && p.sour < p.sweet * 0.5) { notes.push('tooSweet'); score -= 24; }
          if (p.sour > 26 && p.sweet < p.sour * 0.45) { notes.push('tooSour'); score -= 24; }
          if (p.bitter > 32 && p.sweet < 10) { notes.push('tooBitter'); score -= 18; }
          const balanced = p.sour >= 8 && p.sweet >= 6 && p.sour / p.sweet >= 0.7 && p.sour / p.sweet <= 1.9;
          if (balanced) { score += 12; }
          if (!citrus && p.bitter >= 8 && p.sweet >= 6 && p.bitter <= 30) score += 8; // stirred, spirit-forward balance
          if (p.sweet < 5 && p.sour < 5 && p.bitter < 5 && p.aroma < 12 && p.abv < 15) { notes.push('flat'); score -= 12; }
          if (p.aroma >= 14 && p.aroma <= 45) score += 5;
          if (this.garnish !== 'none') score += 3;
          if (citrus && this.method === 'shake') score += 5;
          if (citrus && this.method === 'stir') score -= 6;
          if (!citrus && !fizz && this.method === 'stir') score += 5;
          if (fizz && this.method === 'shake') score -= 10;
          if (ids.includes('egg_white') && this.method === 'shake') score += 4;
          if (ids.length >= 7) score -= 6;
          if (balanced && !notes.length) notes.push('balanced');
        }
        p.score = Math.max(5, Math.min(99, Math.round(score)));
        if (p.score >= 88 && !notes.some(n => n.startsWith('too'))) notes.unshift('great');

        // classic detection
        const h = {
          n: ids.length,
          has: id => ids.includes(id),
          only: list => ids.length === list.length && list.every(x => ids.includes(x)),
          ratio: (list, min) => {
            const v = list.map(x => (this.pours[x] || 0) * ING[x].step);
            return Math.min(...v) / Math.max(...v) >= min;
          }
        };
        p.classic = null;
        for (const [k2, c] of Object.entries(CLASSICS)) { if (c.test(h)) { p.classic = k2; break; } }
        p.notes = notes;
        return p;
      },

      verdictText(p) {
        const V = WeiPlus.verdict;
        const parts = [];
        if (p.notes.includes('tiny')) return L(V.tiny);
        const main = p.notes.find(n => n !== 'balanced' && n !== 'great') || (p.notes.includes('great') ? 'great' : p.notes.includes('balanced') ? 'balanced' : null);
        if (p.abv === 0 && !p.notes.some(n => n.startsWith('too'))) parts.push(L(V.mocktail));
        if (main && V[main]) parts.push(L(V[main]));
        if (p.notes.includes('great') && main !== 'great') parts.push(L(V.great));
        if (p.classic) parts.push(fmt(L(V.classic), { text: L(CLASSICS[p.classic].name) }));
        if (p.has.includes('baijiu')) parts.push(L(V.baijiu));
        if (p.has.some(h => ['espresso', 'coldbrew', 'coffee_liq'].includes(h)) && p.abv > 0) parts.push(L(V.coffee));
        if (!parts.length) parts.push(L(V.balanced));
        return parts.join(' ');
      },

      mix() {
        if (!this.volume()) { showToast(T('lab.needMix')); return; }
        const wrap = document.getElementById('lab-glass-wrap');
        wrap.classList.remove('shaking');
        void wrap.offsetWidth;
        if (this.method === 'shake') { wrap.classList.add('shaking'); SoundEngine.playShaker(); setTimeout(() => SoundEngine.playShaker(), 350); }
        else SoundEngine.playChiptune(520, 'sine', 0.2);
        setTimeout(() => SoundEngine.playClink(), 700);

        const p = this.profile();
        this.last = p;
        const res = document.getElementById('lab-result');
        res.classList.remove('hidden');
        const bars = [
          ['strength', Math.min(100, p.abv / 40 * 100), '#e0826a', p.abv + '%'],
          ['sweet', Math.min(100, p.sweet / 35 * 100), '#ffd08a', Math.round(p.sweet)],
          ['sour', Math.min(100, p.sour / 35 * 100), '#c7d86a', Math.round(p.sour)],
          ['bitter', Math.min(100, p.bitter / 35 * 100), '#b07a55', Math.round(p.bitter)],
          ['aroma', Math.min(100, p.aroma / 60 * 100), '#9cc29a', Math.round(p.aroma)]
        ];
        document.getElementById('lab-bars').innerHTML = bars.map(([k, w, c, v]) =>
          `<div class="bar-row"><span class="text-[var(--muted)]">${esc(T('lab.b.' + k))}</span><span class="bar-track"><span class="bar-fill block" style="width:${w}%;background:${c}"></span></span><span class="text-right text-[var(--amber-2)]">${v}</span></div>`).join('');
        setText('lab-verdict', 'Wei: ' + this.verdictText(p));
        if (window.innerWidth < 1240) setTimeout(() => res.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 250);

        DB.log('lab_mix', { pours: this.pours, glass: this.glass, method: this.method, score: p.score });
        this.checkChallenge(p);
      },

      record() {
        const p = this.last || this.profile();
        return {
          name: Patron.clean(document.getElementById('lab-name').value).slice(0, 40),
          note: String(document.getElementById('lab-note').value || '').trim().slice(0, 120),
          glass: this.glass, ice: this.ice, method: this.method, garnish: this.garnish,
          pours: Object.entries(this.pours).map(([id, n]) => ({ id, ml: n * ING[id].step })),
          color: this.mixColor(),
          profile: { abv: p.abv, sweet: p.sweet, sour: p.sour, bitter: p.bitter, aroma: p.aroma }
        };
      },

      async save() {
        const rec = this.record();
        if (!rec.pours.length) { showToast(T('lab.needMix')); return; }
        if (!rec.name) { showToast(T('lab.needName')); document.getElementById('lab-name').focus(); return; }
        const btn = document.getElementById('lab-save-btn');
        btn.disabled = true;
        const row = await DB.insert('cocktails', Object.assign({ patron: Patron.name, likes: 0, lang: AppState.lang }, rec));
        btn.disabled = false;
        showToast(T('lab.saved'));
        SoundEngine.playSparkle(true);
        WeiMemory.note('lab', rec.name);
        this.lastSaved = row;
      },

      serveHere() {
        const rec = this.record();
        if (!rec.pours.length) { showToast(T('lab.needMix')); return; }
        if (!rec.name) rec.name = T('lab.tabMix');
        Lab.serveRecord(Object.assign({ patron: Patron.name }, rec));
      },

      describe(rec) {
        return rec.pours.map(p => `${ING[p.id] ? (ING[p.id].unit === 'dash' ? Math.round(p.ml / ING[p.id].step) + ' dash ' : p.ml + 'ml ') + L(ING[p.id].name) : p.id}`).join(' • ');
      },

      serveRecord(rec) {
        go('counter');
        const awake = AppState.weiState === 'awake';
        const glassLbl = T('lab.g.' + (rec.glass || 'coupe'));
        showServed({
          icon: GARNISHES[rec.garnish] && rec.garnish !== 'none' ? GARNISHES[rec.garnish] : '🍸',
          name: rec.name,
          sub: `${T('lab.by')} ${rec.patron || '—'} · ${glassLbl} · ${T('lab.m.' + (rec.method || 'shake'))}`,
          desc: rec.note ? `"${rec.note}"` : (rec.profile ? `${rec.profile.abv}%` : ''),
          formula: this.describe(rec),
          reactable: awake
        });
        if (awake) animateWei('wei-wiggle');
        DB.log('order_guest', { name: rec.name, by: rec.patron });
      },

      remix(rec) {
        this.pours = {};
        rec.pours.forEach(p => { if (ING[p.id]) this.pours[p.id] = Math.max(1, Math.round(p.ml / ING[p.id].step)); });
        this.glass = rec.glass || 'coupe'; this.ice = rec.ice || 'none'; this.method = rec.method || 'shake'; this.garnish = rec.garnish || 'none';
        document.getElementById('lab-name').value = '';
        this.tab('mix');
        this.renderControls(); this.renderShelf(); this.renderPours(); this.renderGlass();
      },

      async loadBook(sort) {
        this.bookSort = sort;
        document.querySelectorAll('[data-booksort]').forEach(b => b.classList.toggle('active', b.dataset.booksort === sort));
        const list = document.getElementById('lab-book-list');
        list.innerHTML = `<p class="label">${esc(T('common.loading'))}</p>`;
        let rows = await DB.list('cocktails', sort === 'mine' ? { eq: { patron: Patron.name }, limit: 60 } : { limit: 60 });
        if (!rows.length && sort !== 'mine') rows = SEEDS.cocktails.slice();
        list.innerHTML = '';
        if (!rows.length) { list.innerHTML = `<p class="label">${esc(T('lab.bookEmpty'))}</p>`; return; }
        rows.forEach(rec => list.appendChild(this.bookCard(rec)));
      },

      bookCard(rec) {
        const card = document.createElement('div');
        card.className = 'panel p-3 flex flex-col gap-2';
        const p = rec.profile || {};
        card.innerHTML = `
          <div class="flex items-start gap-3">
            <span class="shrink-0 w-10 h-12 rounded-b-lg rounded-t-sm border-2 border-black" style="background:linear-gradient(180deg,transparent 18%,${esc(rec.color || '#d9e6ea')} 18%)"></span>
            <div class="min-w-0 flex-1">
              <div class="font-semibold text-[var(--amber-2)] truncate">${esc(rec.name)} <span class="text-[16px]">${GARNISHES[rec.garnish] && rec.garnish !== 'none' ? GARNISHES[rec.garnish] : ''}</span></div>
              <div class="label">${esc(T('lab.by'))} ${esc(rec.patron)} · ${esc(timeAgo(rec.created_at))}</div>
              <div class="font-retro text-[15px] text-[#e8d6b4] mt-0.5">${p.abv ?? '?'}% · ${esc(T('lab.b.sweet'))} ${Math.round(p.sweet || 0)} · ${esc(T('lab.b.sour'))} ${Math.round(p.sour || 0)} · ${esc(T('lab.b.bitter'))} ${Math.round(p.bitter || 0)}</div>
            </div>
          </div>
          ${rec.note ? `<p class="text-[13px] italic text-[#e8d6b4]">"${esc(rec.note)}"</p>` : ''}
          <p class="text-[12px] text-[var(--muted)] leading-snug">${esc(this.describe(rec))}</p>`;
        const row = document.createElement('div');
        row.className = 'flex gap-1.5 mt-auto';
        const like = document.createElement('button');
        like.className = 'chip';
        like.innerHTML = '♥';   /* a heart, never a count */
        try { if (localStorage.getItem('weis-liked:' + rec.id)) like.classList.add('active'); } catch (e) {}
        like.onclick = async () => {
          const k = 'weis-liked:' + rec.id;
          try { if (localStorage.getItem(k)) return; localStorage.setItem(k, '1'); } catch (e) {}
          rec.likes = (rec.likes || 0) + 1;
          like.classList.add('active');
          SoundEngine.playSparkle(false);
          DB.bump('cocktails', rec.id, 'likes');
          DB.log('like', { cocktail: rec.name, by: rec.patron });
        };
        const order = document.createElement('button');
        order.className = 'chip';
        order.textContent = '🍸 ' + T('lab.order');
        order.onclick = () => this.serveRecord(rec);
        const remix = document.createElement('button');
        remix.className = 'chip';
        remix.textContent = '🧪 Remix';
        remix.onclick = () => this.remix(rec);
        row.append(like, order, remix);
        card.appendChild(row);
        return card;
      },

      /* Challenges from Wei */
      setChallenge(ch) {
        this.challenge = ch;
        try { localStorage.setItem('weis-challenge:' + Patron.name, ch ? ch.id : ''); } catch (e) {}
        this.renderChallenge();
      },
      loadChallenge() {
        try {
          const id = localStorage.getItem('weis-challenge:' + Patron.name);
          this.challenge = WeiPlus.challenges.concat([WeiPlus.fizz], WeiPlus.holidays).find(c => c.id === id) || null;
        } catch (e) { this.challenge = null; }
        this.renderChallenge();
      },
      renderChallenge() {
        const el = document.getElementById('lab-challenge');
        if (!el) return;
        if (!this.challenge) { el.classList.add('hidden'); return; }
        el.classList.remove('hidden');
        el.innerHTML = `<span class="text-[18px]">🎯</span><span><b>${esc(T('lab.challenge'))}:</b> ${esc(L(this.challenge.ask))}</span>`;
      },
      checkChallenge(p) {
        if (!this.challenge) return;
        if (this.challenge.check(p)) {
          const id = this.challenge.id;
          this.setChallenge(null);
          showToast('🎯 ' + T('lab.challengeDone'));
          SoundEngine.playSparkle(true);
          WeiMemory.note('challenge', id);
          DB.log('challenge_done', { id, score: p.score });
        }
      }
    };
  </script>



  <script>
    /* ===================== APP SHELL ===================== */
    let currentRoom = 'counter';

    // Wei remembers what you did elsewhere and mentions it back at the counter
    const WeiMemory = {
      pending: null,
      note(kind, text) { this.pending = { kind, text }; },
      flush() {
        const p = this.pending;
        if (!p || AppState.weiState !== 'awake') return;
        this.pending = null;
        let line = null;
        if (p.kind === 'lab') line = fmt(L(WeiPlus.afterLab), { text: p.text });
        else if (p.kind === 'challenge') { line = L(WeiPlus.challengeDone).replace(/"/g, ''); setExpression('grin', 3000); animateWei('wei-hop'); }
        if (line) setTimeout(() => { if (AppState.uiMode !== 'topic' || (window.NDChat && NDChat.busy())) return; showBubble(line); setExpression('grin', 1800); }, 450);
      }
    };

    /* the rooms: the counter, the Lab (behind it), the jukebox (where the studio was) and the Wall */
    function go(room) {
      if (!document.getElementById('room-' + room)) return;
      /* the Lab is behind the counter: you only get in while nobody's watching and you sneak round (openSneakMixer) */
      if (room === 'lab' && !(AppState.weiState === 'asleep' && document.body.classList.contains('lab-open'))) room = 'counter';
      currentRoom = room;
      document.querySelectorAll('.room').forEach(r => r.classList.toggle('hidden', r.id !== 'room-' + room));
      SoundEngine.playClick();
      if (room === 'counter') { WeiMemory.flush(); Cats.renderAll(); }
      if (room === 'lab') { Lab.renderControls(); Lab.renderShelf(); Lab.renderGlass(); }
      if (room === 'wall') Wall.onEnter();
      DB.log('room', { room });
      try { history.replaceState(null, '', '#' + room); } catch (e) {}
    }
    function openSneakMixer() { SoundEngine.playClick(); document.body.classList.add('lab-open'); go('lab'); }
    /* whoever was asleep wakes up: back to your side of the counter */
    setInterval(() => {
      if (!document.body.classList.contains('lab-open') || AppState.weiState === 'asleep') return;
      document.body.classList.remove('lab-open');
      if (currentRoom === 'lab') { go('counter'); showToast(L(lx(["Wei woke up — back to your side of the counter!", "Wei 醒了，快回到吧台外面！", "Wei 醒了，快回到吧台外面！", "Wei 醒咗！快啲返出吧枱！", "¡Wei se ha despertado! Vuelve a tu lado de la barra.", "En Wei s'ha despertat! Torna al teu costat de la barra."]))); }
    }, 1000);

    /* ---------------- Language ---------------- */
    function langPref() {
      try { return localStorage.getItem('weis-lang'); } catch (e) { return null; }
    }

    function openLangMenu(anchor) {
      const m = document.getElementById('lang-menu');
      if (!m.classList.contains('hidden')) { m.classList.add('hidden'); return; }
      m.innerHTML = '';
      const auto = document.createElement('button');
      auto.innerHTML = `<span>🌐 Auto · ${esc(LANG_META[detectBrowserLang()].name)}</span><span>${langPref() ? '' : '✓'}</span>`;
      auto.className = langPref() ? '' : 'active';
      auto.onclick = () => { try { localStorage.removeItem('weis-lang'); } catch (e) {} setLanguage(detectBrowserLang()); m.classList.add('hidden'); };
      m.appendChild(auto);
      LANGS.forEach(lg => {
        const b = document.createElement('button');
        b.className = (langPref() === lg) ? 'active' : '';
        b.innerHTML = `<span>${esc(LANG_META[lg].name)}</span><span class="font-retro">${LANG_META[lg].short}</span>`;
        b.onclick = () => { try { localStorage.setItem('weis-lang', lg); } catch (e) {} setLanguage(lg); m.classList.add('hidden'); };
        m.appendChild(b);
      });
      const r = anchor.getBoundingClientRect();
      m.classList.remove('hidden');
      const mw = m.offsetWidth;
      m.style.top = (r.bottom + 6) + 'px';
      m.style.left = Math.max(8, Math.min(window.innerWidth - mw - 8, r.right - mw)) + 'px';
      m.style.position = 'fixed';
    }
    document.addEventListener('click', (e) => {
      const m = document.getElementById('lang-menu');
      if (m && !m.classList.contains('hidden') && !e.target.closest('#lang-menu') && !e.target.closest('[aria-haspopup="menu"]')) m.classList.add('hidden');
    });

    function setLanguage(lg) {
      if (!LANGS.includes(lg)) lg = 'en';
      AppState.lang = lg;
      if (lg === 'tw' || lg === 'yue') Zh.ensure();
      applyLanguage();
      DB.log('lang', { lang: lg });
    }

    function applyLanguage(soft) {
      const lg = AppState.lang;
      document.documentElement.lang = LANG_META[lg].html;
      document.querySelectorAll('.lang-short').forEach(el => { el.textContent = LANG_META[lg].short; });
      document.querySelectorAll('[data-t]').forEach(el => { el.textContent = T(el.dataset.t); });
      document.querySelectorAll('[data-tp]').forEach(el => { el.placeholder = T(el.dataset.tp); });
      document.querySelectorAll('[data-ta]').forEach(el => { el.setAttribute('aria-label', T(el.dataset.ta)); el.title = T(el.dataset.ta); });
      const t = i18n[lg];
      ['resBtnReorder:res-btn-reorder', 'resBtnCheers:res-btn-cheers']
        .forEach(pair => { const [k, id] = pair.split(':'); setText(id, t[k]); });
      DB.badge();
      updateClockHands(AppState.hour);
      Cats.renderAll();
      if (typeof Lab !== 'undefined' && Lab.renderControls) { Lab.renderControls(); Lab.renderShelf(); Lab.renderPours(); }
      if (AppState.inSanctuary && !soft) {
        AppState.currentTopic = AppState.currentTopic || null;
        if (!document.getElementById('rpg-dialogue-screen').classList.contains('hidden') || AppState.weiState === 'asleep') renderCurrentDialogue();
      }
      if (AppState.inSanctuary && currentRoom === 'wall') Wall.onEnter();
    }

    /* ---------------- Walking in (no door: you're in) ---------------- */
    function nickname() {
      const NICK = { en: ['Night Owl', 'Rain Walker', 'Lantern', 'Stray Cat', 'Tea Ghost'], zh: ['夜猫子', '雨中人', '灯笼', '流浪猫', '茶客'], tw: ['夜貓子', '雨中人', '燈籠', '流浪貓', '茶客'], yue: ['夜貓子', '雨中人', '燈籠', '流浪貓', '茶客'], es: ['Búho', 'Paseante', 'Farol', 'Gato callejero', 'Fantasma del té'], ca: ['Mussol', 'Passejant', 'Fanal', 'Gat del carrer', 'Fantasma del te'] };
      const list = NICK[AppState.lang] || NICK.en;
      return list[Math.floor(Math.random() * list.length)] + ' ' + (10 + Math.floor(Math.random() * 90));
    }
    async function enterSanctuary() {
      const name = Patron.clean(Patron.name) || nickname();

      Patron.name = name;
      Bond.load();
      Lab.loadChallenge();
      /* walk in at once: saying hello to the server happens behind you (it used to hold the door until the network answered) */
      Patron.enter(name).catch(() => {});

      AppState.inSanctuary = true;
      setText('patron-chip-name', name);

      if (window.FBWorld) setWeather(FBWorld.weather(), false);   // Nearby's weather, same in every place

      AppState.weiEnergy = Math.floor(Math.random() * 2) + 3;

      Bond.visits++;
      Bond.giftsTonight = 0;
      Bond.save();

      document.getElementById('view-sanctuary').classList.remove('hidden');

      const hashRoom = (location.hash || '').slice(1).split('-')[0];
      go(['counter', 'studio', 'wall'].includes(hashRoom) ? hashRoom : 'counter');   /* #studio is the jukebox, #wall the postcards */

      evaluateWeiState();
      Cats.syncSleep();
      Cats.renderAll();
      setExpression('smile');
      AppState.currentTopic = null;

    cats: [["*Yuzu sits on an empty coaster with your name on it, very pleased. Someone came for the {d}.*", "*柚子坐在一张写着你名字的空杯垫上，很得意。有人来取走了那杯{d}。*", "*柚子坐在一張寫著你名字的空杯墊上，很得意。有人來取走了那杯{d}。*", "*柚子坐咗喺一張寫住你個名嘅空杯墊度，好得意。有人嚟攞咗杯{d}。*", "*Yuzu se sienta en un posavasos vacío con tu nombre, muy satisfecha. Alguien vino por el {d}.*", "*La Yuzu s'asseu en un sotagot buit amb el teu nom, molt satisfeta. Algú ha vingut pel {d}.*"],
      ["*Miso pushes an empty glass towards you, then taps it. Your {d} was raised back. Clink.*", "*味噌把一只空杯推到你面前，又碰了碰它。你请的{d}被回敬了。叮。*", "*味噌把一隻空杯推到你面前，又碰了碰它。你請的{d}被回敬了。叮。*", "*味噌推隻空杯埋嚟，再掂一掂佢。你請嗰杯{d}有人回敬咗。叮。*", "*Miso te acerca un vaso vacío y le da un toque. Te devolvieron el brindis por el {d}. Chin.*", "*La Miso t'acosta un got buit i hi dona un copet. T'han tornat el brindis pel {d}. Xin.*"]],
    mantou: [["*Mantou brings you the coaster from your {d}, a little chewed. Someone picked it up.* Woof.", "*馒头把你那杯{d}的杯垫叼过来，有点被咬过。有人来取走了。* 汪。", "*饅頭把你那杯{d}的杯墊叼過來，有點被咬過。有人來取走了。* 汪。", "*饅頭擔咗你杯{d}張杯墊過嚟，有少少咬過。有人嚟攞咗。* 汪。", "*Mantou te trae el posavasos de tu {d}, un poco mordido. Alguien lo recogió.* Guau.", "*En Mantou et porta el sotagot del teu {d}, una mica mossegat. Algú l'ha recollit.* Bup."],
      ["*Mantou's tail goes round and round. Your {d} was raised back.* Woof!", "*馒头的尾巴转个不停。你请的{d}被回敬了。* 汪！", "*饅頭的尾巴轉個不停。你請的{d}被回敬了。* 汪！", "*饅頭條尾轉個不停。你請嗰杯{d}有人回敬咗。* 汪！", "*La cola de Mantou da vueltas y vueltas. Te devolvieron el brindis por el {d}.* ¡Guau!", "*La cua d'en Mantou fa voltes i voltes. T'han tornat el brindis pel {d}.* Bup!"]]
  };
  const q = new URLSearchParams(location.search);
  const GIFT = (q.get('gift') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
  let pendingKey = null, lastServed = null, friend = { n: '', i: '' }, myClink = 0, theirClink = 0;
  function myName() { return (typeof Patron !== 'undefined' && Patron.name) || (function () { try { return localStorage.getItem('fb_nick') || ''; } catch (e) { return ''; } })(); }
  function key() { let k = null; try { k = localStorage.getItem('fb_device_key'); } catch (e) {} if (!k) { const a = new Uint8Array(32); crypto.getRandomValues(a); k = btoa(String.fromCharCode.apply(null, a)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); try { localStorage.setItem('fb_device_key', k); } catch (e) {} } return k; }
  function rpc(fn, args) { if (!DB.sb) return Promise.reject(new Error('offline')); return DB.sb.rpc(fn, args).then(r => { if (r.error) throw r.error; return r.data; }); }
  function drinkName(d) { const m = d && d.k && DrinkManifest[d.k]; return m ? L(m.name) : (d && d.n) || ''; }
  function drinkIcon(d) { const m = d && d.k && DrinkManifest[d.k]; return (m && m.icon) || (d && d.i) || '🍸'; }
  const awake = () => AppState.weiState === 'awake' && !(window.WeiAway && WeiAway.on());

  /* ---- the seat ---- */
  let duo = null;
  duo = window.FBDuo ? FBDuo({
    topic: 'fbbar', name: myName,
    onNote() {},   /* Wei and the stool at the counter say it here */
    onPeer(here) { if (here && duo) { duo.send('me', { n: myName(), i: lastServed ? lastServed.i : '' }); } else friend = { n: '', i: '' }; paintSeat(); },
    onMsg(ev, p) {
      if (ev === 'me') {
        const first = !friend.n && !friend.i; friend = { n: String(p.n || '').slice(0, 24), i: String(p.i || '').slice(0, 8) }; paintSeat();
        if (first) { SoundEngine.playClick(); if (awake()) { showBubble(X(T.hi).replace('{n}', friend.n || X(T.friend))); animateWei('wei-hop'); } }
      } else if (ev === 'clink') {
        theirClink = Date.now(); SoundEngine.playClink(); bump();
        if (Date.now() - myClink < 4000) together(); else showBubble(X(T.theyClink).replace('{n}', friend.n || X(T.friend)), 2600);
      }
    },
    onState() { paintSeat(); }
  }) : null;
  function paintSeat() {
    const el = document.getElementById('friend-seat'); if (!el || !duo) return;
    const code = duo.code(), here = duo.peer();
    el.hidden = !code; el.classList.toggle('on', here);
    el.querySelector('.fs-drink').textContent = here ? (friend.i || '') : '';
    el.querySelector('.fs-name').textContent = here ? (friend.n || '👥') : code;
    el.setAttribute('aria-label', here ? (friend.n || X(T.friend)) : '👥 ' + code);
  }
  function bump() { const el = document.getElementById('friend-seat'); if (!el) return; el.classList.remove('hop'); void el.offsetWidth; el.classList.add('hop'); }
  function together() {
    myClink = theirClink = 0;
    setTimeout(() => SoundEngine.playClink(), 120); setTimeout(() => SoundEngine.playClink(), 260);
    showBubble('🥂 ' + X(T.clink), 3000);
    if (awake()) { setExpression('grin', 2200); animateWei('wei-hop'); }
    const st = document.getElementById('friend-seat'); if (st) { const h = document.createElement('span'); h.className = 'fs-heart'; h.textContent = '♥'; st.appendChild(h); setTimeout(() => h.remove(), 1600); }
  }

  /* ---- remember what was just served; tell the friend at the seat ---- */
  const _serve = serveItemByKey;
  serveItemByKey = function (k, o) { pendingKey = k; try { return _serve.apply(this, arguments); } finally { pendingKey = null; } };
  const _show = showServed;
  showServed = function (o) {
    _show.apply(this, arguments);
    lastServed = { k: pendingKey || null, i: o.icon, n: String(o.name || '').replace(/ 🎁$/, '').slice(0, 60) };
    if (o.pick) lastServed.pk = { s: o.pick.shop, a: o.pick.area, f: o.pick.find || '', m: o.pick.map || '' };   /* a neighbour's pick travels with the gift: where to find the real one */
    const g = document.getElementById('res-btn-gift'); if (g) { g.title = X(T.gift); g.setAttribute('aria-label', X(T.gift)); }
    if (duo && duo.peer()) duo.send('me', { n: myName(), i: o.icon });
    document.getElementById('gift-row') && !o.gift && document.getElementById('gift-row').remove();
  };
  const _cheers = doCheers;
  doCheers = function () {
    _cheers.apply(this, arguments);
    if (duo && duo.peer()) { myClink = Date.now(); duo.send('clink', {}); if (Date.now() - theirClink < 4000) together(); }
  };

  /* ---- the sheet: sign it, a line, send ---- */
  function sheet() {
    let m = document.getElementById('gift-sheet'); if (m) m.remove();
    if (!lastServed) return;
    m = document.createElement('div'); m.id = 'gift-sheet'; m.setAttribute('role', 'dialog');
    m.innerHTML = '<div class="gs-top"><span class="gs-i" aria-hidden="true"></span><b class="gs-n"></b><button type="button" class="gs-x" aria-label="✕">✕</button></div>' +
      '<label class="label"><span class="gs-lf"></span><input class="field gs-from" maxlength="24" autocomplete="nickname"></label>' +
      '<label class="label"><span class="gs-ll"></span><input class="field gs-line" maxlength="80" autocomplete="off"></label>' +
      '<button type="button" class="btn btn-amber gs-send"></button><button type="button" class="opt-btn gs-seat"></button><p class="gs-st" aria-live="polite"></p>';
    document.body.appendChild(m);
    m.querySelector('.gs-i').textContent = lastServed.i; m.querySelector('.gs-n').textContent = lastServed.n;
    m.querySelector('.gs-lf').textContent = X(T.from); m.querySelector('.gs-ll').textContent = X(T.line);
    m.querySelector('.gs-from').value = myName();
    m.querySelector('.gs-send').textContent = X(T.send); m.querySelector('.gs-seat').textContent = X(T.seat);
    m.querySelector('.gs-x').onclick = () => m.remove();
    m.querySelector('.gs-seat').onclick = () => { m.remove(); if (duo) duo.open(); };
    const st = m.querySelector('.gs-st'), btn = m.querySelector('.gs-send');
    btn.onclick = () => {
      btn.disabled = true; st.textContent = '…';
      const from = m.querySelector('.gs-from').value.trim(), line = m.querySelector('.gs-line').value.trim();
      rpc('bar_gift_send', { p_secret: key(), p_drink: lastServed, p_from: from, p_note: line }).then(code => {
        const seat = duo ? duo.ensure() : '';
        const u = location.origin + '/nearby/next-door/?gift=' + code + (seat ? '&with=' + seat : '');
        try { const mine = JSON.parse(localStorage.getItem('fb_gifts_sent') || '[]'); mine.unshift(code); localStorage.setItem('fb_gifts_sent', JSON.stringify(mine.slice(0, 20))); } catch (e) {}
        const done = () => { st.textContent = X(T.copied); setTimeout(() => m.remove(), 1400); };
        if (navigator.share) navigator.share({ title: lastServed.i + ' ' + lastServed.n, url: u }).then(() => m.remove(), () => { if (navigator.clipboard) navigator.clipboard.writeText(u).then(done, () => { st.textContent = u; }); else st.textContent = u; });
        else if (navigator.clipboard) navigator.clipboard.writeText(u).then(done, () => { st.textContent = u; });
        else st.textContent = u;
        if (awake()) { showBubble(X(T.wrap)); animateWei('wei-wiggle'); }
        SoundEngine.playClick();
      }).catch(e => { btn.disabled = false; st.textContent = /rest/.test(String(e && e.message)) ? X(T.rest) : X(T.off); });
    };
    setTimeout(() => m.querySelector('.gs-from').focus(), 50);
  }

  /* ---- arriving with a gift ---- */
  function land() {
    rpc('bar_gift_open', { p_code: GIFT }).then(g => {
      if (!g || !g.drink) { showBubble(X(T.gone), 3600); return; }
      const d = g.drink, m = d.k && DrinkManifest[d.k];
      SoundEngine.playClink();
      showServed({ icon: drinkIcon(d), name: drinkName(d) + ' 🎁', sub: g.from ? X(T.fromX).replace('{n}', g.from) : X(T.fromAnon), desc: g.note ? '"' + g.note + '"' : (m ? L(m.desc) : ''), formula: m ? m.formula : (d.pk ? '📍 ' + d.pk.s + ' · ' + d.pk.a : ''), reactable: false, gift: true, pick: d.pk ? { shop: d.pk.s, area: d.pk.a, find: d.pk.f, map: d.pk.m } : null, real: d.k || null });
      if (awake()) { showBubble(X(T.paid), 3200); animateWei('wei-wiggle'); } else showBubble(X(T.catsPaid), 3600);
      const desc = document.getElementById('res-description');
      const row = document.createElement('div'); row.id = 'gift-row'; row.className = 'flex gap-1.5 mb-2';
      const b = document.createElement('button'); b.type = 'button'; b.className = 'btn btn-amber btn-sm'; b.textContent = X(T.raise);
      if (g.raised) b.disabled = true;
      b.onclick = () => {
        b.disabled = true; doCheers(); rpc('bar_gift_raise', { p_code: GIFT }).catch(() => {});
        setTimeout(() => showBubble(awake() ? X(T.raised) : '🐾 ♥', 3000), 900);
      };
      row.appendChild(b); desc.after(row);
    }).catch(() => showBubble(X(T.off), 3000));
  }
  /* ---- you come back: how did your drinks go? (once each) ---- */
  function report() {
    let sent = []; try { sent = JSON.parse(localStorage.getItem('fb_gifts_sent') || '[]'); } catch (e) {}
    if (!sent.length) return;
    rpc('bar_gift_mine', { p_secret: key() }).then(list => {
      let told = {}; try { told = JSON.parse(localStorage.getItem('fb_gifts_told') || '{}'); } catch (e) {}
      const st = x => x.raised ? 2 : x.opened ? 1 : 0;
      const it = (list || []).find(x => st(x) > (told[x.code] || 0)); if (!it) return;
      /* whoever is behind the counter tells you, in their own way, once the counter is quiet; it's marked told only then */
      let tries = 0;
      const tell = () => {
        const k = window.NDChat ? NDChat.who() : (awake() ? 'wei' : null);
        if (!k) return;   /* nobody to tell you: next visit */
        if (AppState.uiMode !== 'topic' || NDChat.busy()) { if (++tries < 24) setTimeout(tell, 5000); return; }
        const tl = TOLD[k] || TOLD.wei;
        if (!(window.NDSay && NDSay(X(it.raised ? tl[1] : tl[0]).replace('{d}', drinkName(it.drink) || X(T.yours))))) return;
        if (k !== 'cats' && k !== 'mantou') setExpression('grin', 1800);
        (list || []).forEach(x => { if (st(x)) told[x.code] = st(x); });
        try { localStorage.setItem('fb_gifts_told', JSON.stringify(told)); } catch (e) {}
      };
      tell();
    }).catch(() => {});
  }
  function whenIn(f, ms) { const t = setInterval(() => { if (AppState.inSanctuary) { clearInterval(t); setTimeout(f, ms); } }, 300); }
  if (GIFT.length === 6) whenIn(land, 1400); else whenIn(report, 5200);
  window.BarGift = { open: sheet, seat() { if (duo) duo.open(); }, last() { return lastServed; } };
})();

<script>

      body: ["One cup rice, wash two times. Ten cups water. A little oil, a little salt on the rice before. Boil, then small fire, one and a half hour. Stir sometimes, not always. Ginger in thin strips, spring onion at the end. White pepper. Sit with them while they eat. That is the medicine part.", "米一杯，洗两次。水十杯。下锅前米拌一点油、一点盐。大火煮开，转小火，一个半钟头。有时候搅一下，不要一直搅。姜切细丝，最后放葱，白胡椒。他们吃的时候陪着坐。这才是药。", "米一杯，洗兩次。水十杯。落鍋之前啲米撈少少油、少少鹽。大火滾起，收細火，一個半鐘。間中攪吓，唔使成日攪。薑切幼絲，最後先落蔥，白胡椒粉。佢食嘅時候坐喺隔籬陪住佢。嗰樣先係藥。", "米一杯，洗兩次。水十杯。落鍋之前啲米撈少少油、少少鹽。大火滾起，收細火，一個半鐘。間中攪吓，唔使成日攪。薑切幼絲，最後先落蔥，白胡椒粉。佢食嘅時候坐喺隔籬陪住佢。嗰樣先係藥。", "Una taza arroz, lavar dos veces. Diez tazas agua. Un poco aceite, un poco sal en el arroz antes. Hervir, luego fuego pequeño, hora y media. Remover a veces, no siempre. Jengibre en tiras finas, cebolleta al final. Pimienta blanca. Siéntate con ellos mientras comen. Esa es la parte medicina.", "Una tassa d'arròs, rentat dues vegades. Deu tasses d'aigua. Abans, una mica d'oli i de sal per sobre l'arròs. Que bulli, després foc baix una hora i mitja. Remena de tant en tant, no tota l'estona. Gingebre a tiretes fines i ceba tendra al final. Pebre blanc. Seu amb ells mentre mengen: aquesta és la part que cura."] },
    { dish: ["Escudella for a cold Sunday", "冷天星期日的 escudella", "凍嘅禮拜日煲嘅 escudella", "凍嘅禮拜日煲嘅 escudella", "Escudella para un domingo frío", "Escudella per a un diumenge de fred"],
      whose: ["Josep's mother's, taught to Popo in 1970", "Josep 妈妈的，1970 年教给婆婆", "Josep 阿媽嘅，1970 年教俾婆婆", "Josep 阿媽嘅，1970 年教俾婆婆", "De la madre de Josep, se la enseñó a Popo en 1970", "De la mare d'en Josep, que la va ensenyar a la Popo el 1970"],
      forwho: ["the whole family round one pot", "围着一锅的全家人", "成家人圍住一煲", "成家人圍住一煲", "toda la familia alrededor de una olla", "tota la família al voltant d'una olla"],
      body: ["Big pot. Chicken, a bone of ham, beef bone, chickpeas from the night before. Cold water, slow, take the foam. Two hours. Then carrot, potato, cabbage, celery. The pilota: minced meat, egg, garlic, parsley, breadcrumb, one big ball. Thirty minutes more. First the soup with big pasta, galets. Then the meat on a plate. Josep always say his mama put more salt. I never put more salt.", "大锅。鸡、一块火腿骨、牛骨、前一晚泡好的鹰嘴豆。冷水，慢慢煮，撇掉浮沫。两个钟头。再放胡萝卜、土豆、包菜、芹菜。肉丸 pilota：肉碎、鸡蛋、蒜、香芹、面包屑，搓一个大的。再煮三十分钟。先喝汤，汤里放大的贝壳面 galets。肉再装盘。Josep 总说他妈妈放的盐多。我从来不多放。", "大煲。雞、一嚿火腿骨、牛骨、隔晚浸好嘅雞心豆。凍水落，慢慢煲，撇走啲泡。兩個鐘。之後落紅蘿蔔、薯仔、椰菜、西芹。個肉丸 pilota：免治肉、雞蛋、蒜、番荽、麵包糠，搓一個大嘅。再煲三十分鐘。先飲湯，湯入面落大大粒嘅 galets。啲肉再上碟。Josep 成日話佢阿媽落多啲鹽。我從來唔落多。", "大煲。雞、一嚿火腿骨、牛骨、隔晚浸好嘅雞心豆。凍水落，慢慢煲，撇走啲泡。兩個鐘。之後落紅蘿蔔、薯仔、椰菜、西芹。個肉丸 pilota：免治肉、雞蛋、蒜、番荽、麵包糠，搓一個大嘅。再煲三十分鐘。先飲湯，湯入面落大大粒嘅 galets。啲肉再上碟。Josep 成日話佢阿媽落多啲鹽。我從來唔落多。", "Olla grande. Pollo, un hueso de jamón, hueso de ternera, garbanzos de la noche antes. Agua fría, despacio, quitar espuma. Dos horas. Luego zanahoria, patata, col, apio. La pilota: carne picada, huevo, ajo, perejil, pan rallado, una bola grande. Treinta minutos más. Primero la sopa con pasta grande, galets. Luego la carne en plato. Josep siempre decía su mamá ponía más sal. Yo nunca pongo más sal.", "Olla gran. Pollastre, un os de pernil, os de vedella i els cigrons en remull de la nit abans. Aigua freda, a poc a poc, i treu l'escuma. Dues hores. Després pastanaga, patata, col i api. La pilota: carn picada, ou, all, julivert i pa ratllat, una bola grossa. Mitja hora més. Primer la sopa amb galets, després la carn al plat. En Josep sempre deia que sa mare hi posava més sal. Jo no n'hi poso mai més."] }
  ];
  const POPO = () => POPO_RAW.map(r => ({ host: true, dish: X(r.dish), whose: X(r.whose), forwho: X(r.forwho), body: X(r.body), nick: L(lx(["Popo", "婆婆", "婆婆", "婆婆", "Popo", "la Popo"])) }));
  let sheetEl = null, q = '', timer = null;
  function close() { document.querySelectorAll('#picks-sheet').forEach(e => e.remove()); sheetEl = null; }
  function top(title, back) { const t = el('div', 'ps-top'); t.appendChild(el('b', '', '📖 ' + title)); const x = el('button', 'btn ps-x', '✕'); x.type = 'button'; x.setAttribute('aria-label', '✕'); x.onclick = back || close; t.appendChild(x); return t; }
  function open() {
    close(); sheetEl = el('div', ''); sheetEl.id = 'picks-sheet'; sheetEl.setAttribute('role', 'dialog');
    const s = el('input', 'field ps-q'); s.placeholder = X(T.q); s.value = q; s.setAttribute('aria-label', X(T.q)); s.oninput = () => { q = s.value; clearTimeout(timer); timer = setTimeout(fill, 350); };
    const list = el('div', 'ps-list'); list.setAttribute('aria-live', 'polite');
    const add = el('button', 'btn btn-amber ps-add', X(T.add)); add.type = 'button'; add.onclick = write;
    [top(X(T.title)), s, list, add].forEach(n => sheetEl.appendChild(n));
    document.body.appendChild(sheetEl); fill();
    function fill() {
      list.textContent = '…';
      secret().then(k => rpc('recipe_list', { p_secret: k, p_q: q.trim() || null })).then(rows => {
        list.innerHTML = '';
        const qq = q.trim().toLowerCase(); rows = POPO().filter(r => !qq || (r.dish + ' ' + r.whose + ' ' + r.body).toLowerCase().indexOf(qq) >= 0).concat(rows || []);
        if (!rows || !rows.length) { list.appendChild(el('p', 'ps-none', X(T.none))); return; }
        rows.forEach(r => { const b = el('button', 'opt-btn ps-item'); b.type = 'button'; const t = el('span', 'ps-t'); t.appendChild(el('b', '', r.dish)); t.appendChild(el('small', '', [r.whose, r.forwho ? X(T.forX).replace('{f}', r.forwho) : ''].filter(Boolean).join(' · '))); b.appendChild(t); b.onclick = () => card(r); list.appendChild(b); });
      }).catch(() => { list.innerHTML = ''; POPO().forEach(r => { const b = el('button', 'opt-btn ps-item'); b.type = 'button'; b.appendChild(el('b', '', r.dish)); b.onclick = () => card(r); list.appendChild(b); }); list.appendChild(el('p', 'ps-none', X(T.off))); });
    }
  }
  function card(r) {
    close(); sheetEl = el('div', ''); sheetEl.id = 'picks-sheet'; sheetEl.setAttribute('role', 'dialog');
    sheetEl.appendChild(top(r.dish, open));
    const meta = [r.whose, r.forwho ? X(T.forX).replace('{f}', r.forwho) : '', r.nick ? X(T.by).replace('{n}', r.nick) : ''].filter(Boolean).join(' · ');
    if (meta) sheetEl.appendChild(el('p', 'ps-none', meta));
    const body = el('p', ''); body.style.cssText = 'white-space:pre-wrap;margin:8px 2px 12px;font-size:17px;line-height:1.35'; body.textContent = r.body; sheetEl.appendChild(body);
    const row = el('div', 'flex gap-1.5 flex-wrap');
    const c = el('button', 'btn btn-amber', X(T.cook)); c.type = 'button'; c.onclick = () => { close(); serve(r); }; row.appendChild(c);
    if (r.host) {} else if (r.mine) { const f = el('button', 'btn btn-sm', X(T.mineX)); f.type = 'button'; f.onclick = () => { f.disabled = true; secret().then(k => rpc('recipe_forget', { p_secret: k, p_id: r.id })).then(open).catch(() => { f.disabled = false; }); }; row.appendChild(f); }
    else { const rp = el('button', 'btn btn-sm', '⚑'); rp.type = 'button'; rp.title = X(T.report); rp.setAttribute('aria-label', rp.title); rp.onclick = () => { rp.disabled = true; secret().then(k => rpc('recipe_report', { p_secret: k, p_id: r.id })).then(() => { rp.textContent = '✓'; }).catch(() => { rp.disabled = false; }); }; row.appendChild(rp); }
    sheetEl.appendChild(row); document.body.appendChild(sheetEl);
  }
  function write() {
    close(); sheetEl = el('form', ''); sheetEl.id = 'picks-sheet'; sheetEl.setAttribute('role', 'dialog');
    sheetEl.appendChild(top(X(T.add).replace('＋ ', ''), open));
    const fld = (label, max, req, area, val) => { const l = el('label', 'label ps-f'); l.appendChild(el('span', '', label)); const i = el(area ? 'textarea' : 'input', 'field'); i.maxLength = max; if (req) i.required = true; if (area) { i.rows = 6; i.style.resize = 'vertical'; } if (val) i.value = val; i.autocomplete = 'off'; l.appendChild(i); sheetEl.appendChild(l); return i; };
    const d = fld(X(T.dish), 40, true), w = fld(X(T.whose), 40), f = fld(X(T.forwho), 80), b = fld(X(T.body), 800, true, true);
    const by = fld(X(T.sign), 24, false, false, (function () { try { return localStorage.getItem('fb_nick') || ''; } catch (e) { return ''; } })()); by.setAttribute('data-fb-nick', '');
    const go = el('button', 'btn btn-amber ps-add', X(T.send)); go.type = 'submit'; sheetEl.appendChild(go);
    const st = el('p', 'ps-none'); st.setAttribute('aria-live', 'polite'); sheetEl.appendChild(st);
    sheetEl.onsubmit = e => {
      e.preventDefault(); go.disabled = true; st.textContent = '…';
      secret().then(k => rpc('recipe_add', { p_secret: k, p_dish: d.value, p_whose: w.value, p_for: f.value, p_body: b.value, p_nick: by.value, p_lang: LANG() }))
        .then(() => { try { SoundEngine.playClick(); } catch (e) {} close(); try { showBubble(X(T.thanks), 4200); } catch (e) {} try { if (window.FBG && FBG.made) FBG.made('bar', d.value); } catch (e) {} })
        .catch(err => { go.disabled = false; st.textContent = /rest/.test(String(err && err.message)) ? X(T.rest) : X(T.off); });
    };
    document.body.appendChild(sheetEl); setTimeout(() => d.focus(), 30);
  }
  function serve(r) {
    const who = window.NDChat ? NDChat.who() : 'wei';
    const sub = [r.whose, r.forwho ? X(T.forX).replace('{f}', r.forwho) : ''].filter(Boolean).join(' · ');
    try { showServed({ icon: '', name: r.dish, sub: sub, desc: r.body.length > 220 ? r.body.slice(0, 220) + '…' : r.body, formula: r.nick ? X(T.by).replace('{n}', r.nick) : '', reactable: false, food: true }); } catch (e) { return; }
    const ic = window.FBWorld && FBWorld.pix ? FBWorld.pix('bowl') : ''; ['res-icon', 'served-item-plate'].forEach(id => { const e = document.getElementById(id); if (e) e.innerHTML = ic; });
    try { SoundEngine.playClink(); } catch (e) {}
    if (T.served[who]) setTimeout(() => { try { showBubble(X(T.served[who])); } catch (e) {} }, 800);
  }
  function cook() {
    secret().then(k => rpc('recipe_get', { p_secret: k, p_lang: LANG() })).then(r => { if (Array.isArray(r)) r = r[0]; if (r && r.dish) serve(r); else { const h = POPO(); if (h && h.length) serve(h[(Math.random() * h.length) | 0]); else { try { showBubble(X(T.empty), 3600); } catch (e) {} write(); } } })   /* nobody else's yet: Popo's own cards are always in the box */
      .catch(() => { const h = POPO(); if (h && h.length) serve(h[(Math.random() * h.length) | 0]); else try { showBubble(X(T.off), 3000); } catch (e) {} });   /* offline: Popo's own cards are always in the box */
  }
  window.PopoRecipes = { open, write, cook };
})();
</script>

<script>
/* ===== The Wall: postcards sent to Next Door from Say Hello, newest first; it keeps going as you scroll =====
   (📌 Find a friend, the Wall's own board, is NDFriend below) */
(function () {
  const PAGE = 18;
  let cBefore = null, cDone = false, busy = false, first = true, P = null;
  const one = () => document.getElementById('wall-one');
  async function cardPage() {
    if (cDone || !SUPABASE_CONFIG.url) { cDone = true; return []; }
    try {
      const u = SUPABASE_CONFIG.url + '/rest/v1/rpc/postcard_wall_page?p_limit=' + PAGE + (cBefore ? '&p_before=' + encodeURIComponent(cBefore) : '');
      const r = await fetch(u, { headers: { apikey: SUPABASE_CONFIG.anonKey, Authorization: 'Bearer ' + SUPABASE_CONFIG.anonKey } });
      const rows = r.ok ? await r.json() : [];
      if (!Array.isArray(rows) || rows.length < PAGE) cDone = true; if (rows.length) cBefore = rows[rows.length - 1].sent;
      return rows || [];
    } catch (e) { cDone = true; return []; }
  }
  function card(c) {
    const W = window.WallCards; const b = document.createElement('button'); b.type = 'button'; b.className = 'pcm hang' + (c.sealed ? ' sealed' : ''); b.style.setProperty('--r', W ? W.rot(c.id) : '0deg');
    const cv = document.createElement('canvas'); b.appendChild(cv); if (P) P.draw(cv, c.scene, c.id);
    const cap = document.createElement('span'); cap.className = 'cap'; cap.textContent = c.sealed ? '🔒 ' + T('wall.opens').replace('{d}', W ? W.when(c.open_at) : '') : (c.place ? c.place + ' · ' : '') + c.from; b.appendChild(cap);
    b.onclick = () => { SoundEngine.playClick(); if (W) W.show(c, P); };
    return b;
  }
  async function more() {
    if (busy || cDone) return; busy = true;
    if (!P && window.WallCards) { try { P = await WallCards.scenes(); } catch (e) {} }
    const items = (await cardPage()).map(x => () => card(x));
    const el = one();
    if (first) { el.innerHTML = ''; first = false; if (!items.length) el.innerHTML = `<p class="font-hand text-[22px] text-[#fff3dc] p-3" style="grid-column:1/-1;text-shadow:1px 1px 0 #000">${esc(T('wall.emptyWall'))}</p>`; }
    items.forEach(n => el.appendChild(n()));
    busy = false;
    const s = document.getElementById('wall-more'); if (s && s.getBoundingClientRect().top < innerHeight + 200 && !cDone) more();
  }
  function reload() { cBefore = null; cDone = false; first = true; one().innerHTML = '<p class="label">' + esc(T('common.loading')) + '</p>'; more(); }
  try { new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) more(); }, { rootMargin: '300px' }).observe(document.getElementById('wall-more')); } catch (e) {}
  /* the bricks fill the room down to the bottom, however few postcards hang on them */
  function fit() { const el = one(); if (!el || !el.getClientRects().length) return;
    el.style.minHeight = Math.max(200, Math.round(innerHeight - 16 - (el.getBoundingClientRect().top + scrollY) - 12)) + 'px'; }
  addEventListener('resize', fit); addEventListener('orientationchange', () => setTimeout(fit, 300));
  window.Wall = { reload: reload, onEnter() { if (first || !one().children.length) reload(); requestAnimationFrame(fit); setTimeout(fit, 400); } };
})();
</script>

<script>

    woke: M("*lifts her head, an earbud falls out* …ugh. Fine. I'm up. What do you want?", "*抬起头，一只耳机掉了出来* ……烦。行吧，我醒了。要什么？", "*抬起頭，一隻耳機掉了出來* ……煩。好啦，我醒了。要什麼？", "*levanta la cabeza, se le cae un auricular* …uf. Vale. Ya estoy. ¿Qué quieres?", "*aixeca el cap, li cau un auricular* …uf. Vale. Ja estic. Què vols?"),
    scroll: M("*doesn't look up from her phone* …one sec. Literally one.", "*头也不抬地刷着手机* ……等一下。真的就一下。", "*頭也不抬地滑著手機* ……等一下。真的就一下。", "*no levanta la vista del móvil* …un segundo. Literalmente uno.", "*no aixeca la vista del mòbil* …un segon. Literalment un."),
    sorry: M("*phone face down* Okay. Sorry. I'm here. What do you want?", "*把手机扣下* 好，抱歉，我在。要什么？", "*把手機扣下* 好，抱歉，我在。要什麼？", "*móvil boca abajo* Vale. Perdón. Aquí estoy. ¿Qué quieres?", "*mòbil cap per avall* D'acord. Perdó. Sóc aquí. Què vols?"),
    ask: M("Ask Mei for something", "找 Mei 要点喝的", "找 Mei 要點喝的", "Pídele algo a Mei", "Demana-li alguna cosa a la Mei"),
    booze: M("A cocktail", "来杯鸡尾酒", "來杯雞尾酒", "Un cóctel", "Un còctel"),
    noBooze: M("Wei pours those. I'm sixteen, not stupid. Coffee, tea, or something without?", "那些得 Wei 来调。我十六岁，又不傻。咖啡、茶，还是无酒精的？", "那些得 Wei 來調。我十六歲，又不傻。咖啡、茶，還是無酒精的？", "Eso lo sirve Wei. Tengo dieciséis, no soy tonta. ¿Café, té o algo sin alcohol?", "Això ho serveix en Wei. Tinc setze anys, no sóc tonta. Cafè, te o alguna cosa sense alcohol?"),
    nap: [M("*Mei, asleep on the counter, one earbud still in. Her phone buzzes face down beside her. Miso is asleep on her sleeve.*", "*Mei 趴在吧台上睡着了，一只耳机还戴着。手机扣在旁边嗡嗡震。Miso 枕着她的袖子睡着了。*", "*Mei 趴在吧台上睡著了，一隻耳機還戴著。手機扣在旁邊嗡嗡震。Miso 枕著她的袖子睡著了。*", "*Mei, dormida sobre la barra, con un auricular puesto. El móvil vibra boca abajo a su lado. Miso duerme sobre su manga.*", "*La Mei, adormida damunt la barra, amb un auricular posat. El mòbil vibra cap per avall al seu costat. En Miso dorm damunt la seva màniga.*"),
      M("*Mei's asleep with her cheek on the bar and a note taped to the till: 'WEI'S AWAY. BACK AT NOON. DON'T.'*", "*Mei 脸贴着吧台睡着了，收银机上贴着纸条：“WEI 出门了。中午回来。别吵。”*", "*Mei 臉貼著吧台睡著了，收銀機上貼著紙條：「WEI 出門了。中午回來。別吵。」*", "*Mei duerme con la mejilla en la barra y una nota en la caja: 'WEI DE VIAJE. VUELVO A MEDIODÍA. NI LO INTENTES.'*", "*La Mei dorm amb la galta a la barra i una nota a la caixa: 'EN WEI ÉS FORA. TORNO A MIGDIA. NI HO PROVIS.'*")],
    napHead: M("MEI'S ASLEEP", "MEI 睡着了", "MEI 睡著了", "MEI DUERME", "LA MEI DORM"),
  };
  function on() {
    var d = W.host();
    return d.who === "mei" && !d.asleep && !(window.WeiAway && WeiAway.on());   /* she's here only on her visits (FBWorld.host: one host per visit), and not while she's out */
  }
  /* Wei's travelling and it's Mei's night (02:00–12:00): the top bar shows her asleep, so the bar does too: head on the counter */
  function napping() { try { var d = W.host(); return d.who === "mei" && d.asleep && !(window.WeiAway && WeiAway.on()); } catch (e) { return false; } }
  var css = document.createElement("style");
  css.textContent = "#mei-avatar{display:none;width:66px;height:74px;image-rendering:pixelated}body.mei-on #mei-avatar{display:block}body.mei-on #svg-wei-avatar,body.mei-on:not(.mei-nap) #wei-zzz-particles{display:none!important}body.mei-on:not(.wei-away) #wei-anchor{visibility:visible!important}@media (min-width:768px){#mei-avatar{width:92px;height:104px}}";
  document.head.appendChild(css);
  var cv = document.createElement("canvas"); cv.id = "mei-avatar"; cv.width = 32; cv.height = 36; cv.setAttribute("role", "img"); cv.setAttribute("aria-label", "Mei");
  var holder = document.getElementById("sprite-wei-container"); if (holder) holder.appendChild(cv);
  var phoneUntil = 0;
  function paint() { var g = cv.getContext("2d"); g.clearRect(0, 0, 32, 36); W.drawMei(g, 0, 3, 1, { phone: Date.now() < phoneUntil, asleep: document.body.classList.contains("mei-nap") }); }
  function say(t) { try { if (!(window.NDSay && NDSay(t))) setText("sleep-story-text", t); } catch (e) {} }
  var napT = -1, napShown = -2;
  function dress() {
    var z = !on() && napping(); document.body.classList.toggle("mei-nap", z);
    if (z) { document.body.classList.add("mei-on"); paint(); var hn0 = document.getElementById("host-name"); if (hn0) hn0.textContent = "Mei";
      try { setText("sleep-header-title", L(T.napHead)); setText("sleep-header-badge", ""); var w0 = document.getElementById("sleep-wake"); if (w0) w0.style.display = "none"; if (napT < 0) napT = (Math.random() * T.nap.length) | 0; if (napShown !== napT) { napShown = napT; setText("sleep-story-text", L(T.nap[napT])); } } catch (e) {}
      return; }
    var x = on(); document.body.classList.toggle("mei-on", x); var hn = document.getElementById("host-name"); if (hn && (x || W.host().who === "wei")) hn.textContent = x ? "Mei" : "Wei"; if (!x) return;
    paint();
    try { setText("sleep-header-title", L(T.head)); setText("sleep-header-badge", ""); var w = document.getElementById("sleep-wake"); if (w) w.style.display = "none";
      setText("sleep-btn-cats", L(T.ask)); } catch (e) {}
  }
  /* Mei makes the coffee herself, and her coffee is very bad: the card says what actually arrived */
  T.tried = M("Mei's attempt: ", "Mei 尝试的", "Mei 嘗試的", "Intento de Mei: ", "Intent de la Mei: ");
  T.bad = [M("\"It's lukewarm, somehow also burnt, and there's a pink hair tie in the saucer.\"", "\"温吞吞的，却又有股焦味，碟子里还躺着一根粉色发圈。\"", "\"溫吞吞的，卻又有股焦味，碟子裡還躺著一根粉紅色髮圈。\"", "\"Está tibio, de algún modo también quemado, y hay una goma de pelo rosa en el platito.\"", "\"És tebi, i d'alguna manera també cremat, i hi ha una goma de cabell rosa al platet.\""),
    M("\"The foam was supposed to be a heart. It is a potato.\"", "\"奶泡本来要拉成一颗心。结果是个土豆。\"", "\"奶泡本來要拉成一顆心。結果是個馬鈴薯。\"", "\"La espuma debía ser un corazón. Es una patata.\"", "\"L'escuma havia de ser un cor. És una patata.\""),
    M("\"Three sugars. You didn't ask for sugar.\"", "\"放了三块糖。你没要糖。\"", "\"放了三顆糖。你沒要糖。\"", "\"Tres azúcares. No pediste azúcar.\"", "\"Tres sucres. No n'has demanat.\""),
    M("\"It tastes like the bottom of the machine. Mei is watching your face.\"", "\"喝起来像咖啡机的底。Mei 正盯着你的表情。\"", "\"喝起來像咖啡機的底。Mei 正盯著你的表情。\"", "\"Sabe al fondo de la máquina. Mei te mira la cara.\"", "\"Té gust del fons de la màquina. La Mei t'observa la cara.\""),
    M("\"Mostly ice. She says that's how they do it in New York.\"", "\"大部分是冰。她说纽约都是这么做的。\"", "\"大部分是冰。她說紐約都是這樣做的。\"", "\"Casi todo hielo. Dice que así se hace en Nueva York.\"", "\"Gairebé tot gel. Diu que a Nova York es fa així.\""),
    M("\"The tea bag is still in. So is the label. So is, briefly, her phone.\"", "\"茶包还在里面。标签也在。她的手机也短暂地掉进去过。\"", "\"茶包還在裡面。標籤也在。她的手機也短暫地掉進去過。\"", "\"La bolsita sigue dentro. La etiqueta también. Su móvil, por un momento, también.\"", "\"La bossa de te encara hi és. L'etiqueta també. El seu mòbil, per un moment, també.\"")];
  T.served = M("*slides it over and watches you* …Well? Be nice. Wei makes it look easy.", "*把杯子推过来，盯着你* ……怎样？说点好听的。Wei 做起来看着很简单。", "*把杯子推過來，盯著你* ……怎樣？說點好聽的。Wei 做起來看著很簡單。", "*te lo desliza y te mira* …¿Y bien? Sé amable. Wei hace que parezca fácil.", "*te'l llisca i et mira* …I bé? Sigues amable. En Wei fa que sembli fàcil.");
  window.NDMeiMenu = function () { return Object.keys(DrinkManifest).filter(function (k) { return DrinkManifest[k].type === "cafe"; }).map(function (k) { var d = DrinkManifest[k]; return { ic: d.icon || "", name: L(d.name), desc: L(d.desc).replace(/^"|"$/g, ""), real: k, go: function () { NDMeiMake(k); } }; }).concat([{ ic: "", name: L(T.booze), desc: "", go: function () { say(L(T.noBooze)); } }]); };
  window.NDMeiMake = function (k) { var d = DrinkManifest[k]; if (!d || d.type === "bar") { say(L(T.noBooze)); return; } serveItemByKey(k); badCoffee(); setTimeout(function () { say(L(T.served)); }, 900); };
  function badCoffee() { try { var n = document.getElementById("res-name"), d = document.getElementById("res-description"); if (n && n.textContent.indexOf(L(T.tried)) !== 0) n.textContent = L(T.tried) + n.textContent; if (d) d.textContent = L(T.bad[(Math.random() * T.bad.length) | 0]); } catch (e) {} }
  /* tap her: hello, or (sometimes) she's on her phone and you wait a beat */
  var tap0 = window.tapBartender;
  window.tapBartender = function () {
    if (napping() && !on()) {   /* the second tap wakes her (grumpily); she stays up a while, like Wei */
      if (napT >= 0 && W.wake && W.wake()) { dress(); try { renderCurrentDialogue(); } catch (e) {} say(L(T.woke)); return; }
      napShown = napT = (napT + 1) % T.nap.length; say(L(T.nap[napT])); return; }
    if (!on()) return tap0.apply(this, arguments);
    phoneUntil = Date.now() + 2600; paint(); say(L(T.scroll)); setTimeout(function () { phoneUntil = 0; paint(); say(L(T.sorry)); }, 2600);
  };
  /* Wei travelling (FBWorld.host says Mei's day): behind the counter it's as if he were out, whatever the hour */
  T.trav = M("WEI'S TRAVELLING", "WEI 出门旅行了", "WEI 出門旅行了", "WEI ESTÁ DE VIAJE", "EN WEI ÉS DE VIATGE");
  var eval1 = window.evaluateWeiState;
  window.evaluateWeiState = function () { var r = eval1.apply(this, arguments); try { if (W.weiTravelling() && AppState.weiState !== "asleep") { AppState.weiState = "asleep"; if (typeof Cats !== "undefined" && Cats.st) Cats.syncSleep(); } } catch (e) {} return r; };
  try { if (W.weiTravelling()) evaluateWeiState(); } catch (e) {}
  var render0 = window.renderCurrentDialogue;
  window.renderCurrentDialogue = function () { var r = render0.apply(this, arguments); if (!on() && W.weiTravelling() && !(window.WeiAway && WeiAway.on())) { try { setText("sleep-header-title", L(T.trav)); setText("sleep-header-badge", ""); } catch (e) {} } if (on()) { dress(); say(L(T.hi[(Math.random() * T.hi.length) | 0])); } else if (napping()) { napShown = -2; dress(); } return r; };
  /* now and then, between visitors, she checks her phone */
  setInterval(function () { if (!on() || document.hidden) return; if (Math.random() < .25) { phoneUntil = Date.now() + 5000 + Math.random() * 6000; paint(); setTimeout(paint, phoneUntil - Date.now() + 50); } }, 15000);
  setInterval(dress, 5000); setTimeout(function () { dress(); try { if (on() && AppState.inSanctuary) renderCurrentDialogue(); } catch (e) {} }, 800);
})();
</script>
<script>
/* Popo and the cats behind the counter. Each visit meets one host (FBWorld.host): on Popo's visits Wei's grandmother keeps
   the bar. She knows nothing about coffee or cocktails, she cooks (Cantonese and Catalan home food, her own two languages;
   her English, Spanish and Mandarin are broken on purpose). On the cats' visits nobody stands behind the bar: Miso and Yuzu
   run it and only say meow. Both keep their hours: Popo sleeps 21:00–05:00 in the armchair by the stove, the cats at night. */
(function () {
  var W = window.FBWorld; if (!W || !W.host || !W.drawPopo) return;
  var M = function (en, zh, yue, es, ca) { return lx([en, zh, yue, yue, es, ca]); };
  var who = function () { try { return W.host(); } catch (e) { return { who: "wei" }; } };
  var P = {
    head: M("POPO'S IN THE KITCHEN", "婆婆在厨房", "婆婆喺廚房", "POPO EN LA COCINA", "LA POPO ÉS A LA CUINA"),
    napHead: M("POPO'S ASLEEP", "婆婆睡着了", "婆婆瞓著咗", "POPO DUERME", "LA POPO DORM"),
    hi: [M("*stirring a pot* Ah, you come! Sit. Wei is travelling. Coffee I don't know, but I have soup.", "*搅着锅* 啊，你来啦！坐。阿Wei去旅行了。咖啡我不懂，汤就有。", "*攪緊煲嘢* 啊，你嚟啦！坐低。阿Wei去咗旅行。咖啡我唔識，湯就有。", "*remueve la olla* ¡Ah, tú vienes! Siéntate. Wei de viaje. Café no sé, pero tengo sopa.", "*remena l'olla* Ah, ja ets aquí! Seu. En Wei és de viatge. De cafè no en sé, però tinc sopa."),
      M("*wipes the counter with a tea towel* Sit, sit. You look hungry. Popo cooks.", "*用茶巾擦吧台* 坐，坐。你看起来饿了。婆婆煮给你吃。", "*用條毛巾抹吧枱* 坐啦坐啦。你個樣好肚餓喎。婆婆煮俾你食。", "*limpia la barra con un trapo* Siéntate, siéntate. Pareces hambre. Popo cocina.", "*eixuga la barra amb un drap* Seu, seu. Fas cara de gana. La Popo cuina."),
      M("*tastes from a wooden spoon, nods* Good timing. Everything is hot now.", "*用木勺尝了一口，点点头* 来得正好。现在什么都是热的。", "*用木羹試咗啖，點點頭* 嚟得啱。而家樣樣都熱辣辣。", "*prueba de la cuchara, asiente* Buen momento. Todo caliente ahora.", "*tasta de la cullera de fusta i assenteix* Arribes a temps. Ara tot és calent.")],
    ask: M("Ask Popo what's cooking", "问婆婆煮了什么", "問婆婆煮咗乜", "Pregunta a Popo qué hay", "Pregunta-li a la Popo què hi ha"),
    coffeeNo: M("Coffee? Aiya, too strong, bad for the heart. Have soup.", "咖啡？哎呀，太浓了，伤心脏。喝汤吧。", "咖啡？哎呀，太濃喇，傷心㗎。飲碗湯啦。", "¿Café? Ay, muy fuerte, malo para corazón. Toma sopa.", "Cafè? Ai, massa fort, no va bé per al cor. Pren sopa."),
    boozeNo: M("Cocktail? I don't know these things. Wei comes back, you ask him. Now: eat.", "鸡尾酒？这些我不懂的。等阿Wei回来你问他。现在：吃饭。", "雞尾酒？呢啲嘢我唔識㗎。等阿Wei返嚟你問佢。而家：食飯。", "¿Cóctel? Yo no sabe de esto. Wei vuelve, tú preguntas. Ahora: comer.", "Un còctel? D'això no en sé res. Quan torni en Wei, li ho demanes. Ara: a menjar."),
    served: M("*watches you take the first spoon* Good? Good. Eat slowly.", "*看着你吃第一口* 好吃吗？好。慢慢吃。", "*望住你食第一啖* 好唔好食？好。慢慢食。", "*te mira comer la primera cucharada* ¿Bueno? Bueno. Come despacio.", "*et mira menjar la primera cullerada* Bo? Bé. Menja a poc a poc."),
    nap: [M("*Popo asleep in the armchair by the stove, a blanket on her knees, the radio playing Cantonese opera very quietly. A pot is keeping warm.*", "*婆婆在炉边的扶手椅上睡着了，膝上盖着毯子，收音机小声放着粤曲。锅里的汤还温着。*", "*婆婆喺爐邊張梳化椅度瞓著咗，膝頭冚住張氈，收音機細細聲播緊粵曲。煲湯仲溫住。*", "*Popo duerme en el sillón junto a la cocina, con una manta en las rodillas y la radio con ópera cantonesa muy bajita. Una olla se mantiene caliente.*", "*La Popo dorm a la butaca vora els fogons, amb una manta als genolls i la ràdio amb òpera cantonesa molt fluixet. Una olla es manté calenta.*"),
      M("*Popo dozes with her glasses on her head. A note on the counter, in three languages: 'SOUP ON THE STOVE. TAKE.'*", "*婆婆眼镜架在头上打瞌睡。吧台上有张三种语言写的纸条：“炉上有汤。自己拿。”*", "*婆婆副眼鏡擺咗喺頭頂，瞌緊眼瞓。吧枱有張三種文字嘅紙仔：「爐頭有湯。自己攞。」*", "*Popo dormita con las gafas en la cabeza. Una nota en la barra, en tres idiomas: 'SOPA EN EL FUEGO. COGE.'*", "*La Popo fa una becaina amb les ulleres al cap. Una nota a la barra, en tres llengües: 'HI HA SOPA AL FOC. AGAFA'N.'*")]
  };
  var DISH = [
    { k: "congee", ic: "bowl", name: M("Congee with ginger & scallion", "姜葱白粥", "薑蔥白粥", "Congee de jengibre y cebolleta", "Congee amb gingebre i ceba tendra"), sub: M("Rice, slowly, since six this morning", "大米，从早上六点慢慢熬", "由朝早六點慢慢煲", "Arroz, a fuego lento desde las seis", "Arròs a foc lent des de les sis del matí"), desc: M("\"Hot, hot. Blow first. Good for the stomach.\"", "\"烫，烫。先吹吹。对胃好。\"", "\"熱㗎，熱㗎。吹吓先。對個胃好。\"", "\"Caliente, caliente. Primero soplar. Bueno para estómago.\"", "\"Crema, crema. Bufa primer. Va bé per a l'estómac.\"") },
    { k: "wonton", ic: "bowl", name: M("Wonton noodle soup", "云吞面", "雲吞麵", "Sopa de wonton con fideos", "Sopa de wonton amb fideus"), sub: M("Shrimp wontons, thin egg noodles", "鲜虾云吞，细蛋面", "鮮蝦雲吞，幼蛋麵", "Wontons de gamba, fideos finos de huevo", "Wontons de gamba, fideus fins d'ou"), desc: M("\"Noodles under, wontons on top, so noodles don't get soft. My mother's way.\"", "\"面在下面，云吞在上面，面才不会烂。我妈妈的做法。\"", "\"麵喺底，雲吞喺面，啲麵先唔會腍。我阿媽嘅做法。\"", "\"Fideos abajo, wontons arriba, así fideos no blandos. Manera de mi madre.\"", "\"Els fideus a sota i els wontons a sobre, perquè no s'estovin. Com ho feia ma mare.\"") },
    { k: "pa", ic: "bread", name: M("Pa amb tomàquet", "番茄面包", "番茄麵包", "Pan con tomate", "Pa amb tomàquet"), sub: M("Toasted bread, ripe tomato, olive oil, salt", "烤面包，熟番茄，橄榄油，盐", "烘麵包，熟番茄，橄欖油，鹽", "Pan tostado, tomate maduro, aceite, sal", "Pa torrat, tomàquet madur, oli i sal"), desc: M("\"Rub the tomato hard. Oil, a lot. In Barcelona, everybody knows.\"", "\"番茄要用力擦。油，多一点。在巴塞罗那，大家都知道。\"", "\"番茄要大力擦。油，多啲。喺巴塞隆拿，個個都識。\"", "\"Frota el tomate fuerte. Aceite, mucho. En Barcelona, todos saben.\"", "\"Frega bé el tomàquet. Oli, que no en falti. A Barcelona ho sap tothom.\"") },

<script>

  const T_LAMP = H("The lamp", "吊灯", "吊燈", "吊燈", "La lámpara", "El llum");
  const STAND = '<svg viewBox="0 0 17 20" shape-rendering="crispEdges" aria-hidden="true"><path fill="#1a1410" d="M2 0h13v1H2zM1 1h1v13H1zM15 1h1v13h-1zM2 14h13v1H2zM3 15h1v5H3zM13 15h1v5h-1z"/><path fill="#7a4a24" d="M2 1h13v1H2zM2 13h13v1H2zM2 2h1v11H2zM14 2h1v11h-1z"/><path fill="#26302a" d="M3 2h11v11H3z"/><path fill="#f3ead8" fill-opacity=".55" d="M4 8h6v1H4zM4 10h8v1H4zM11 8h2v1h-2z"/><path fill="#f2a541" d="M4 12h1v1H4z"/><path fill="#5a3519" d="M4 15h9v1H4z"/></svg><b></b>';
  const JUKE = '<svg viewBox="0 0 16 20" shape-rendering="crispEdges" aria-hidden="true"><path fill="#1a1410" d="M4 0h8v1H4zM2 1h2v1H2zM12 1h2v1h-2zM1 2h1v2H1zM14 2h1v2h-1zM0 4h1v15H0zM15 4h1v15h-1zM1 19h14v1H1z"/><path fill="#8a3a1c" d="M4 1h8v1H4zM2 2h12v2H2zM1 4h14v15H1z"/><path fill="#c2412d" d="M3 3h10v1H3z"/><path class="jl" fill="#f2a541" d="M2 5h1v6H2zM13 5h1v6h-1z"/><path class="jl" fill="#e86a92" d="M4 4h8v1H4z"/><path fill="#1a1410" d="M4 6h8v5H4z"/><path fill="#ffd08a" d="M5 7h6v1H5z"/><path fill="#7db2a8" d="M5 9h6v1H5z"/><path fill="#3a2111" d="M3 12h10v6H3z"/><path fill="#6b4426" d="M4 13h8v1H4zM4 15h8v1H4zM4 17h8v1H4z"/><path fill="#f3ead8" d="M7 11h2v1H7z"/></svg><i aria-hidden="true">♪</i><i aria-hidden="true">♫</i>';
  const CARDS = '<svg viewBox="0 0 24 21" shape-rendering="crispEdges" aria-hidden="true"><path fill="#1a1410" d="M1 3h10v1H1zM0 4h1v8H0zM11 4h1v8h-1zM1 12h10v1H1z"/><path fill="#f6ecd2" d="M1 4h10v8H1z"/><path fill="#7db2a8" d="M2 5h4v4H2z"/><path fill="#b39a7c" d="M7 6h3v1H7zM7 8h3v1H7zM2 10h8v1H2z"/><path fill="#1a1410" d="M12 1h11v1H12zM11 2h1v9h-1zM23 2h1v9h-1zM12 11h11v1H12z"/><path fill="#f3d9a8" d="M12 2h11v9H12z"/><path fill="#e0826a" d="M13 3h5v4h-5z"/><path fill="#b39a7c" d="M19 4h3v1h-3zM19 6h3v1h-3zM13 8h9v1h-9z"/><path fill="#1a1410" d="M6 12h12v1H6zM5 13h1v7H5zM18 13h1v7h-1zM6 20h12v1H6z"/><path fill="#fff6e3" d="M6 13h12v7H6z"/><path fill="#9cc29a" d="M7 14h4v3H7z"/><path fill="#b39a7c" d="M12 15h5v1h-5zM12 17h5v1h-5z"/><path fill="#c2412d" d="M5 2h2v2H5zM17 0h2v2h-2zM11 11h2v2h-2z"/></svg>';

        a: () => [[H("*unfold it*", "*打开它*", "*打開它*", "*打開佢*", "*desdoblarla*", "*desplegar-lo*"), () => BarPicks.open()], [H("*good boy*", "*好狗狗*", "*好狗狗*", "*乖狗狗*", "*buen chico*", "*bon gos*"), () => reply(H("*Mantou's whole back half wags.* Woof!", "*馒头整个后半身都在摇。* 汪！", "*饅頭整個後半身都在搖。* 汪！", "*饅頭成個後半截都喺度擰。* 汪！", "*A Mantou le menea toda la parte de atrás.* ¡Guau!", "*A en Mantou se li belluga tota la part del darrere.* Bup!"))]] },
      { id: 'recipe', q: H("*Mantou noses Popo's recipe box along the counter towards you.*", "*馒头用鼻子把婆婆的食谱盒沿着吧台拱到你面前。*", "*饅頭用鼻子把婆婆的食譜盒沿著吧檯拱到你面前。*", "*饅頭用個鼻將婆婆個食譜盒沿住吧枱拱過嚟你面前。*", "*Mantou empuja con el hocico la caja de recetas de Popo por la barra hacia ti.*", "*En Mantou empeny amb el morro la capsa de receptes de la Popo per la barra cap a tu.*"),
        a: () => [[H("*open it*", "*打开*", "*打開*", "*打開佢*", "*abrirla*", "*obrir-la*"), () => PopoRecipes.cook()], [H("*look inside*", "*往里看看*", "*往裡看看*", "*睇吓入面*", "*mirar dentro*", "*mirar-hi a dins*"), () => PopoRecipes.open()], [H("*pat him*", "*拍拍他*", "*拍拍他*", "*掃吓佢*", "*acariciarle*", "*acariciar-lo*"), () => reply(H("*Mantou leans his whole weight against your leg.* Hrrmf.", "*馒头把整个身子靠在你腿上。* 呼。", "*饅頭把整個身子靠在你腿上。* 呼。", "*饅頭成個身挨晒落你隻腳度。* 呼。", "*Mantou se apoya con todo su peso en tu pierna.* Hrrmf.", "*En Mantou es recolza amb tot el pes a la teva cama.* Hrrmf."))]] }
    ]
  };
  const usedO = {};
  window.NDOffer = function (k, after) {
    const list = (O[k] || []).filter(o => (!o.ok || o.ok()) && !(after && o.id === 'usual'));
    let free = list.filter(o => !usedO[k + o.id]);
    if (!free.length) { list.forEach(o => { delete usedO[k + o.id]; }); free = list; }
    if (!free.length) return false;
    /* the usual comes first for a regular */
    const o = free.find(x => x.id === 'usual') || one(free); usedO[k + o.id] = 1;
    try { if (o.run) return o.run(); } catch (e) { return false; }
    const q = typeof o.q === 'function' ? o.q() : L(o.q); if (!q) return false;
    try { if (k === 'cats') ['miso', 'yuzu'].forEach(id => Cats.anim && Cats.anim(id, 'hop')); else if (k !== 'mantou') setExpression('grin', 1400); } catch (e) {}
    try { if (k === 'cats') SoundEngine.playMeow(1.1); else SoundEngine.playClick(); } catch (e) {}
    renderWei(q, o.a().map(([label, fn]) => ({ label: L(label), onClick: () => { idle(); try { fn(); } catch (e) { backToOrder(); } } })), COMPACT_GRID, 'chat');
    return true;
  };

  /* ---------- an awake host's panel has no buttons ---------- */
  function tidy() {
    const h = hostNow(), up = h.who !== 'wei' && !h.asleep && !away();
    document.body.classList.toggle('nd-host-up', up);
  }
  setInterval(tidy, 800); tidy();

  /* ---------- waking, sleeping and the snore ---------- */
  /* Wei's energy shows on his face (heavy lids when he's tired); it never sends him to sleep: only the town's hour does */
  const svgAwake = $('avatar-layer-awake');
  if (svgAwake && !$('avatar-lids')) {
    const NS = 'http://www.w3.org/2000/svg', g = document.createElementNS(NS, 'g'); g.id = 'avatar-lids'; g.setAttribute('class', 'hidden');
    [[10, 10, 4, 2, '#e9be78'], [18, 10, 4, 2, '#e9be78'], [10, 12, 4, 1, '#6b3a1b'], [18, 12, 4, 1, '#6b3a1b']].forEach(([x, y, w, hh, f]) => { const r = document.createElementNS(NS, 'rect'); r.setAttribute('x', x); r.setAttribute('y', y); r.setAttribute('width', w); r.setAttribute('height', hh); r.setAttribute('fill', f); r.setAttribute('class', 'lid-' + (hh === 2 ? 'skin' : 'lash')); g.appendChild(r); });
    svgAwake.appendChild(g);
  }
  function face() {
    const g = $('avatar-lids'), c = $('sprite-wei-container'), e = AppState.weiEnergy;
    if (g) { g.classList.toggle('hidden', !(e <= 2)); g.querySelectorAll('.lid-skin').forEach(r => r.setAttribute('height', e <= 1 ? 2 : 1)); g.querySelectorAll('.lid-lash').forEach(r => r.setAttribute('y', e <= 1 ? 12 : 11)); }
    if (c) c.classList.toggle('nd-tired', e <= 1);
  }
  const weiWant = () => { const h = hostNow(); if (h.who !== 'wei' || away()) return null; return h.asleep ? 'asleep' : 'awake'; };
  function weiUp() {
    AppState.weiState = 'awake';
    const a = $('avatar-layer-awake'), s = $('avatar-layer-sleeping'), z = $('wei-zzz-particles'), c = $('sprite-wei-container');
    if (a) a.classList.remove('hidden'); if (s) s.classList.add('hidden'); if (z) z.classList.add('hidden');
    if (c) { c.classList.add('sway-idle'); c.classList.remove('sleep-breathing'); }
  }
  const ev0 = window.evaluateWeiState;
  if (ev0) evaluateWeiState = function () {
    const r = ev0.apply(this, arguments);
    if (AppState.weiState === 'asleep' && weiWant() === 'awake') { weiUp(); try { Cats.syncSleep(); } catch (e) {} }
    face(); return r;
  };
  /* waking Wei here doesn't move the town's clock: he's simply up for a while (FBWorld.wake), in the top bar too */
  const wk0 = window.wakeUpBartender;
  if (wk0) wakeUpBartender = function () {
    try { if (W.wake) W.wake(); } catch (e) {}
    const r = wk0.apply(this, arguments);
    try { if (W.hour) { const was = AppState.isBarOpen; updateClockHands(W.hour()); if (was !== AppState.isBarOpen) { AppState.currentTopic = null; } evaluateWeiState(); } } catch (e) {}
    SoundEngine.stopSnore && SoundEngine.stopSnore();
    /* his first word ("…?") stands for a moment, then the question he was about to ask comes back */
    setTimeout(() => { if (AppState.uiMode === 'topic' && AppState.weiState === 'awake') { try { renderCurrentDialogue(); } catch (e) {} } }, 2600);
    return r;
  };
  /* on the cats' own visit the cats are behind the counter: tapping one is tapping the host (a sleeping one wakes, an awake one
     starts something); on anyone else's visit a cat gets a reaction (catTap) */
  if (stage) stage.addEventListener('click', e => {
    const c = e.target.closest && e.target.closest('.cat'); if (!c) return;
    const h = hostNow(); if (h.who !== 'cats') return;
    e.stopPropagation(); idle(); try { tapBartender(); } catch (x) {}
  }, true);
  /* the top bar and the counter agree: whoever woke Wei (here or in the guide), and when his 15 minutes are up */
  setInterval(() => {
    const want = weiWant(); if (!want || want === AppState.weiState) return;
    if (AppState.uiMode === 'served' && want === 'asleep') return;   /* he finishes pouring first */
    try { evaluateWeiState(); if (AppState.weiState === want) { AppState.currentTopic = null; renderCurrentDialogue(); Cats.syncSleep(); } } catch (e) {}
  }, 2000);
  /* a tired Wei gets his breath back slowly */
  setInterval(() => { if (AppState.weiState === 'awake' && AppState.weiEnergy < 4) { AppState.weiEnergy++; face(); } }, 240000);
  setTimeout(face, 1000);

  /* the snore: only while the one behind the counter is shown asleep, and it stops the moment they wake */
  const SE = SoundEngine;
  function shownAsleep() {
    if (away() || (typeof currentRoom !== 'undefined' && currentRoom !== 'counter')) return false;
    const h = hostNow();
    if (h.who === 'wei') return AppState.weiState === 'asleep';
    return !!h.asleep;
  }
  let zz = [];
  SE.stopSnore = function () { const t = this.ctx ? this.ctx.currentTime : 0; zz.forEach(([o, g]) => { try { g.gain.cancelScheduledValues(t); g.gain.setTargetAtTime(0.0001, t, 0.03); o.stop(t + 0.12); } catch (e) {} }); zz = []; };
  SE.playSnore = function () {
    if (!shownAsleep()) return;
    this.init(); if (!this.ctx) return;
    const cat = hostNow().who === 'cats', now = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    if (cat) {   /* the cats purr in their sleep */
      o.type = 'sawtooth'; o.frequency.setValueAtTime(26, now);
      g.gain.setValueAtTime(0.0001, now); g.gain.linearRampToValueAtTime(0.03, now + 0.3); g.gain.linearRampToValueAtTime(0.012, now + 0.6); g.gain.linearRampToValueAtTime(0.028, now + 0.9); g.gain.exponentialRampToValueAtTime(0.001, now + 1.4);
      o.connect(g); g.connect(this.ctx.destination); o.start(now); o.stop(now + 1.5);
    } else {
      const lo = hostNow().who === 'mantou' ? 0.8 : hostNow().who === 'mei' || hostNow().who === 'popo' ? 1.25 : 1;
      o.type = 'sawtooth'; o.frequency.setValueAtTime(85 * lo, now); o.frequency.linearRampToValueAtTime(130 * lo, now + 0.35); o.frequency.linearRampToValueAtTime(75 * lo, now + 0.7);
      g.gain.setValueAtTime(0.02, now); g.gain.linearRampToValueAtTime(0.045, now + 0.35); g.gain.exponentialRampToValueAtTime(0.001, now + 0.75);
      o.connect(g); g.connect(this.ctx.destination); o.start(now); o.stop(now + 0.8);
    }
    zz.push([o, g]); o.onended = () => { zz = zz.filter(x => x[0] !== o); };
  };
  let nextZ = 0, wasZ = false;
  setInterval(() => {
    const z = shownAsleep();
    if (!z) { if (wasZ) SE.stopSnore(); wasZ = false; return; }
    if (!wasZ) { nextZ = Date.now() + 2500; wasZ = true; }
    if (document.hidden || !SE.ctx || SE.ctx.state !== 'running' || Date.now() < nextZ) return;
    nextZ = Date.now() + 6000 + Math.random() * 3000; SE.playSnore();
  }, 500);
  addEventListener('fbhostwake', () => SE.stopSnore());
})();
