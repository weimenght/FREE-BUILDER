    wheat: ["Wheat Beer", "小麦啤酒", "小麥啤酒", "Cerveza de trigo", "Cervesa de blat"], sour: ["Sour", "酸啤", "酸啤", "Sour", "Sour"], saison: ["Saison", "赛松", "賽松", "Saison", "Saison"], tripel: ["Tripel", "三料", "三料", "Tripel", "Tripel"], dubbel: ["Dubbel", "双料", "雙料", "Dubbel", "Dubbel"] };
  var NOTE = { body: [["Light and crisp", "清爽轻盈", "清爽輕盈", "Ligera y fresca", "Lleugera i fresca"], ["Smooth", "顺滑", "順滑", "Suave", "Suau"], ["Rich", "醇厚", "醇厚", "Intensa", "Intensa"], ["Deep and roasty", "深沉焦香", "深沉焦香", "Profunda y tostada", "Profunda i torrada"]],
    bitter: [["barely bitter", "几乎不苦", "幾乎不苦", "apenas amarga", "gens amarga"], ["gently bitter", "微苦", "微苦", "ligeramente amarga", "lleugerament amarga"], ["nicely bitter", "苦得恰好", "苦得恰好", "con buen amargor", "amb bona amargor"], ["boldly bitter", "苦味浓烈", "苦味濃烈", "muy amarga", "molt amarga"]],
    yeast: { lager: ["clean finish", "收口干净", "收口乾淨", "final limpio", "final net"], ale: ["a fruity edge", "带果香", "帶果香", "toque afrutado", "toc afruitat"], wheat: ["banana and clove", "香蕉和丁香味", "香蕉和丁香味", "plátano y clavo", "plàtan i clau"], wild: ["bright and tart", "酸得明亮", "酸得明亮", "ácida y viva", "àcida i viva"], belgian: ["spicy and dry", "辛香干爽", "辛香乾爽", "especiada y seca", "especiada i seca"] } };
  var LBG = ["#c8402a", "#2c4a86", "#2f6a3a", "#e8a030", "#5a3a6e", "#1c1a1f", "#e870a8", "#3a8a8a"], LPAT = ["plain", "stripes", "dots"];

  var R = { malt: "pale", hops: 2, aroma: "citrus", yeast: "ale", extras: [], abv: 5, label: { bg: "#c8402a", icon: "cat", pattern: "stripes" } };
  function styleKey() {
    var m = R.malt, y = R.yeast, h = R.hops, a = R.abv;
    if (y === "wild") return "sour"; if (y === "wheat" || m === "wheat") return "wheat";
    if (y === "belgian") return a >= 8 ? (m === "amber" || m === "choc" || m === "roast" ? "dubbel" : "tripel") : "saison";
    if (y === "lager") return m === "pils" ? "pilsner" : m === "amber" ? "amberlager" : (m === "choc" || m === "roast") ? "darklager" : "lager";
    if (m === "roast") return a >= 8 ? "imperial" : "stout"; if (m === "choc") return a >= 6 ? "porter" : "brown"; if (m === "amber") return "amber";
    return h >= 3 ? (h >= 4 && a >= 7 ? "dipa" : "ipa") : "pale";
  }
  function styleName(k, extras, aroma, hops, lang) {
    var li = lang == null ? L() : lang, base = STYLE[k][li], pre = extras.map(function (e) { return EXTRA[e][li]; });
    if (!pre.length && (k === "ipa" || k === "dipa") && aroma) pre = [AROMA[aroma][li]];
    if (li === 1 || li === 2) return pre.join("") + base; return (pre.length ? pre.join(li === 0 ? " & " : " + ") + " " : "") + base;
  }
  function color() { var c = MALT[R.malt][1]; if (R.extras.indexOf("cherry") >= 0 && R.malt !== "roast") c = "#b8302a"; return c; }
  function note() { var b = MALT[R.malt][2], body = NOTE.body[b <= 1 ? 0 : b <= 2 ? 1 : b <= 3 ? 2 : 3], bit = NOTE.bitter[Math.min(3, Math.floor(R.hops * .9))]; var s = tr(body) + (L() >= 1 && L() <= 2 ? "，" : ", ") + tr(bit) + (L() >= 1 && L() <= 2 ? "，" : ", ") + tr(NOTE.yeast[R.yeast]); if (R.hops && R.aroma) s += " · " + tr(AROMA[R.aroma]); if (R.extras.length) s += " · " + R.extras.map(function (e) { return tr(EXTRA[e]); }).join(" · "); return s + (L() >= 1 && L() <= 2 ? "。" : "."); }

  /* ---------- chips ---------- */
  function chip(box, label, on, onclick, sw) { var b = document.createElement("button"); b.type = "button"; b.className = "chip"; if (sw) { var i = document.createElement("i"); i.style.background = sw; b.appendChild(i); } b.appendChild(document.createTextNode(label)); b.setAttribute("aria-pressed", !!on); b.onclick = onclick; box.appendChild(b); return b; }
  function paint() {
    ["malt", "hops", "aroma", "yeast", "extras", "bg", "icon", "sort"].forEach(function (id) { $(id).innerHTML = ""; });
    Object.keys(MALT).forEach(function (k) { chip($("malt"), tr(MALT[k][0]), R.malt === k, function () { R.malt = k; paint(); }, MALT[k][1]); });
    [0, 1, 2, 3, 4].forEach(function (n) { chip($("hops"), n ? "🌿".repeat(n) : "∅", R.hops === n, function () { R.hops = n; paint(); }); });
    if (R.hops) Object.keys(AROMA).forEach(function (k) { chip($("aroma"), tr(AROMA[k]), R.aroma === k, function () { R.aroma = k; paint(); }); });
    Object.keys(YEAST).forEach(function (k) { chip($("yeast"), tr(YEAST[k]), R.yeast === k, function () { R.yeast = k; paint(); }); });
    Object.keys(EXTRA).forEach(function (k) { chip($("extras"), tr(EXTRA[k]), R.extras.indexOf(k) >= 0, function () { var i = R.extras.indexOf(k); if (i >= 0) R.extras.splice(i, 1); else { R.extras.push(k); if (R.extras.length > 2) R.extras.shift(); } paint(); }); });
    LBG.forEach(function (c) { chip($("bg"), "", R.label.bg === c, function () { R.label.bg = c; paint(); }, c).setAttribute("aria-label", c); });
    LPAT.forEach(function (p) { chip($("bg"), { plain: "▢", stripes: "≡", dots: "⁘" }[p], R.label.pattern === p, function () { R.label.pattern = p; paint(); }); });
    BeerArt.ICONS.forEach(function (ic) { chip($("icon"), { cat: "🐈", dog: "🐕", dragon: "🐉", lantern: "🏮", wave: "🌊", mountain: "⛰️", star: "⭐", flower: "🌸" }[ic], R.label.icon === ic, function () { R.label.icon = ic; paint(); }); });
    /* no ranking: the tap list is simply newest first */
    $("abvOut").textContent = R.abv.toFixed(1) + "%";
    $("style").textContent = styleName(styleKey(), R.extras, R.aroma, R.hops) + " · " + R.abv.toFixed(1) + "%";
    $("note").textContent = note();
    BeerArt.glass($("glass"), color(), true, 1); BeerArt.can($("can"), { color: color(), label: R.label });
  }
  $("abv").oninput = function () { R.abv = +this.value / 10; paint(); };

  /* ---------- the brewhouse: kettle, fermenters, a bottle line ---------- */
  var hc = $("house"), hg = hc.getContext("2d"), f = 0, brewing = 0;
  function H(x, y, w, h, c) { hg.fillStyle = c; hg.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
  function house() {
    f++; H(0, 0, 160, 64, "#3a2214"); for (var x = 0; x < 160; x += 8) for (var y = (x / 8 % 2) * 3; y < 50; y += 6) H(x, y, 7, 5, "#4a2c18");
    H(0, 50, 160, 14, "#2a1a10"); for (var s = 0; s < 160; s += 10) H(s, 50, 1, 14, "#22140c");
    // the copper kettle
    H(14, 22, 34, 28, "#c8783a"); H(16, 18, 30, 4, "#e8a060"); H(28, 8, 6, 10, "#a8582a"); H(18, 24, 4, 22, "rgba(255,230,180,.35)"); H(12, 44, 38, 6, "#8a4a20");
    var bub = brewing ? 6 : 2; for (var b = 0; b < bub; b++) { var by = 18 - ((f * (brewing ? 1.2 : .3) + b * 7) % 18); H(29 + Math.sin((f + b * 9) / 6) * 3, by - 6, 2, 2, "rgba(255,255,255," + (by / 18 * .7) + ")"); }
    // fermenters filled with the beer you're designing
    [[60, 1], [84, .7], [108, .45]].forEach(function (tk, i) { H(tk[0], 12, 18, 38, "#a8a8b0"); H(tk[0] + 2, 14, 2, 34, "rgba(255,255,255,.4)"); var lv = brewing && i === 0 ? Math.min(1, (f % 120) / 100) : tk[1]; H(tk[0] + 6, 46 - 30 * lv, 6, 30 * lv, color()); H(tk[0] + 5, 15, 8, 32, "rgba(0,0,0,.15)"); H(tk[0] + 4, 50, 2, 4, "#6a6a70"); H(tk[0] + 12, 50, 2, 4, "#6a6a70"); });
    // a little conveyor of cans
    H(132, 44, 28, 2, "#6a6a70"); for (var c = 0; c < 3; c++) { var cx = 132 + ((f * .25 + c * 10) % 30); H(cx, 36, 5, 8, R.label.bg); H(cx, 41, 5, 2, color()); }
    // a cat (Miso, probably) asleep on a sack of malt
    H(136, 22, 16, 8, "#c8a878"); H(138, 20, 8, 3, "#231b17"); H(144, 19, 3, 3, "#231b17"); H(146, 20, 1, 1, "#f2c94c");
    requestAnimationFrame(house);
  }

  /* ---------- the database ---------- */
  var cfg = { url: "", key: "" };
  function ready() { return new Promise(function (res) { if (window.FB_SUPABASE && FB_SUPABASE.url) { cfg.url = FB_SUPABASE.url; cfg.key = FB_SUPABASE.anonKey; return res(); } var sc = document.createElement("script"); sc.src = "/config.js"; sc.onload = sc.onerror = function () { var c = window.FB_SUPABASE || {}; cfg.url = c.url || ""; cfg.key = c.anonKey || ""; res(); }; document.head.appendChild(sc); }); }
  function api(fn, args, get) {
    return ready().then(function () {
      if (!cfg.url) throw new Error("offline");
      var u = cfg.url + "/rest/v1/rpc/" + fn, h = { apikey: cfg.key, Authorization: "Bearer " + cfg.key, "Content-Type": "application/json" };
      if (get) u += "?" + Object.keys(args).map(function (k) { return k + "=" + encodeURIComponent(args[k]); }).join("&");
      return fetch(u, get ? { headers: h } : { method: "POST", headers: h, body: JSON.stringify(args) }).then(function (r) { return r.text().then(function (x) { var j = null; try { j = x ? JSON.parse(x) : null; } catch (e) {} if (!r.ok) throw new Error((j && j.message) || "HTTP " + r.status); return j; }); });
    });
  }
  function key() { var k = null; try { k = localStorage.getItem("fb_device_key"); } catch (e) {} if (!k) { var a = new Uint8Array(32); crypto.getRandomValues(a); k = btoa(String.fromCharCode.apply(null, a)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); try { localStorage.setItem("fb_device_key", k); } catch (e) {} } return k; }

  function clink() { try { var A = new (window.AudioContext || window.webkitAudioContext)(), n = A.currentTime; [1568, 2093].forEach(function (q, i) { var o = A.createOscillator(), g = A.createGain(); o.type = "sine"; o.frequency.value = q; g.gain.setValueAtTime(.06, n + i * .05); g.gain.exponentialRampToValueAtTime(.0001, n + .6); o.connect(g); g.connect(A.destination); o.start(n + i * .05); o.stop(n + .65); }); } catch (e) {} }
  $("brew").onclick = function () {
    var name = $("name").value.trim(), brewer = $("brewer").value.trim(); if (!name || !brewer) { toast(t("need")); return; }
    var btn = this, sk = styleKey(); btn.disabled = true; brewing = 1;
    var body = { name: name, brewer: brewer, style: styleName(sk, R.extras, R.aroma, R.hops, 0), color: color(), label: R.label, bar: $("toBar").checked, club: $("toClub").checked,
      recipe: { malt: R.malt, hops: R.hops, aroma: R.hops ? R.aroma : null, yeast: R.yeast, extras: R.extras, abv: R.abv, style: sk } };
    setTimeout(function () {
      api("beer_brew", { p_secret: key(), p_beer: body }).then(function () {
        clink(); var v = [body.bar && t("bar"), body.club && t("club")].filter(Boolean);
        toast("🍺 " + (v.length ? t("shipped").replace("{v}", v.join(t("and"))) : t("shippedNone"))); $("name").value = ""; sort = "new"; paint(); load(); if (window.FBG && FBG.made) setTimeout(function () { FBG.made("brewery", body.name); }, 1800);
      }).catch(function (e) { var m = String(e && e.message || e); toast(/rest|fast/.test(m) ? t("rest") : /privacy/i.test(m) ? t("privacy") : t("offline")); })
        .then(function () { btn.disabled = false; brewing = 0; });
    }, 1600);
  };

  /* ---------- the tap list ---------- */
  var sort = "new", rows = [];
  function load() { api("beer_list", { p_venue: "", p_sort: sort }, true).then(function (r) { rows = r || []; taps(); }).catch(function () { $("taps").innerHTML = '<p class="empty">' + t("offline") + "</p>"; }); }
  function localStyle(b) { var r = b.recipe || {}; return STYLE[r.style] ? styleName(r.style, r.extras || [], r.aroma, r.hops) : b.style; }
  function taps() {
    var box = $("taps"); box.innerHTML = "";
    if (!rows.length) { box.innerHTML = '<p class="empty">' + t("empty") + "</p>"; return; }
    rows.forEach(function (b) {
      var d = document.createElement("article"); d.className = "tap"; var c = document.createElement("canvas"); BeerArt.can(c, b); d.appendChild(c);
      d.insertAdjacentHTML("beforeend", "<b></b><small></small><small></small><span class='ven'></span><div class='row'><button type='button' class='ch'></button><button type='button' class='flag'></button></div>");
      var sm = d.querySelectorAll("small"); d.querySelector("b").textContent = b.name; sm[0].textContent = localStyle(b) + " · " + ((b.recipe && b.recipe.abv) || 5).toFixed(1) + "%"; sm[1].textContent = t("by").replace("{b}", b.brewer);
      d.querySelector(".ven").textContent = (b.bar ? "🍸 " : "") + (b.club ? "🎧" : "");
      var ch = d.querySelector(".ch"); ch.textContent = "🍻 " + t("cheers");
      ch.onclick = function () { api("beer_cheers", { p_secret: key(), p_id: b.id }).then(function (n) { if (n < 0) toast(t("again")); else { ch.textContent = "🍻 ✓"; ch.disabled = true; clink(); toast(t("cheered")); } }).catch(function () { toast(t("offline")); }); };
      var fl = d.querySelector(".flag"); fl.textContent = "⚑ " + t("report"); fl.onclick = function () { api("beer_report", { p_id: b.id }).then(function () { fl.remove(); toast(t("reported")); }); };
      box.appendChild(d);
    });
  }

  function words() {
    document.documentElement.lang = ["en", "zh-Hans", "zh-Hant", "es", "ca"][L()];
    document.querySelectorAll("[data-t]").forEach(function (e) { e.textContent = t(e.getAttribute("data-t")); });
    document.title = (window.FBWorld && FBWorld.name) ? FBWorld.name("brewery") + " · " + FBWorld.name("map") : document.title;
    var lab = document.querySelector("[data-fbl-label]"); if (lab && window.FBL && FBL.SHORT) lab.textContent = FBL.SHORT[FBL.get() || "en"];
    paint(); if (rows.length) taps();
  }
  window.FBL_GET = function () { return (window.FBL && FBL.get()) || "en"; };
  window.FBL_SET = function (l) { if (window.FBL) FBL.set(l); words(); };
  try { var nk = localStorage.getItem("fb_nick"); if (nk) $("brewer").value = nk.slice(0, 24); } catch (e) {}
  words(); load(); requestAnimationFrame(house);
})();
