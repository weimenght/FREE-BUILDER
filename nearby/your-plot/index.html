<!DOCTYPE html>
<html lang="en" class="fbt">
<head>
<meta charset="UTF-8" /><meta name="referrer" content="same-origin" data-fbr><script data-fbl data-mode="full" src="/fbkit/fb.js?v=615d6db739"></script><link rel="stylesheet" href="/fbkit/fbb.css?v=3b720d5e4b" data-fbb><script data-fbg src="/fbkit/fbg.js?v=f380e76602" defer></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Your Plot · Nearby</title>
<meta name="description" content="A piece of land below the railway that's yours: build whatever you like, in any shape and colour, and say what it's for. It stays on your device unless you keep a copy.">
<meta name="theme-color" content="#1d130d">
<link rel="icon" href="/nearby/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/nearby/townkit.css">
<style>
.tk-scene{height:56vh;height:56dvh;background:#1a1420}
@media (min-aspect-ratio:6/5){.tk-scene{width:64%;height:auto}}
#cv{touch-action:none;cursor:crosshair}
.yp-row{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.yp-row .fbb{min-width:44px;padding:4px 8px}
.yp-t canvas{width:28px;height:28px;image-rendering:pixelated;display:block}
.yp-c{width:36px;height:36px;min-width:36px!important;padding:0!important;border:3px solid #000!important}
.yp-row [aria-pressed="true"]{outline:3px solid #f6b73c;outline-offset:1px}
.yp-k{display:block;font:400 9px/1.5 'Press Start 2P',monospace;letter-spacing:.06em;color:#f6b73c;margin:2px 0 6px}
.yp-name{width:100%;box-sizing:border-box;font:400 22px/1.2 'VT323',monospace;padding:6px 8px;background:#2a1d14;color:#fbeedd;border:3px solid #000}
.sheet[hidden]{display:none}
.sheet{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;width:min(420px,calc(100vw - 20px));max-height:70vh;overflow:auto;padding:14px;background:#2a1d14;color:#fbeedd;border:3px solid #000;box-shadow:6px 6px 0 #000;font:400 20px/1.3 'VT323',monospace}
.sheet .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;margin:8px 0}
.sheet .x{position:absolute;right:8px;top:6px;background:none;border:0;color:#fbeedd;font:20px monospace;cursor:pointer}
.sheet p{margin:0 26px 8px 0}
.yp-view{position:absolute;left:8px;bottom:8px;right:8px;display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 10px;background:rgba(20,14,10,.85);border:3px solid #000;color:#fbeedd;font:400 20px/1.2 'VT323',monospace}
.yp-view[hidden]{display:none}
</style>
<link rel="manifest" href="/nearby/manifest.webmanifest" data-fbapp><meta name="apple-mobile-web-app-capable" content="yes" data-fbapp><meta name="mobile-web-app-capable" content="yes" data-fbapp><meta name="apple-mobile-web-app-title" content="Nearby" data-fbapp></head>
<body>
<h1 class="sr" id="h1">Your Plot</h1>
<div class="tk">
  <div class="tk-scene"><canvas id="cv" role="img" aria-label="Your plot of land"></canvas><div class="yp-view" id="view" hidden><span id="viewT"></span><button class="fbb fbb-pri" type="button" id="viewMine"></button></div></div>
  <main class="tk-panel" id="panel">
    <span class="yp-k" id="kBuild">BUILD</span>
    <div class="yp-row" id="types" role="group"></div>
    <div class="yp-row" id="cols" role="group"></div>
    <div class="yp-row">
      <button class="fbb" type="button" id="sign"><span aria-hidden="true">🪧</span> <span id="signL">Sign</span></button>
      <button class="fbb" type="button" id="undo" aria-label="Undo">↩</button>
      <button class="fbb" type="button" id="share"><span aria-hidden="true">↗</span> <span id="shareL">Show someone</span></button>
      <button class="fbb" type="button" id="cloud"><span aria-hidden="true">☁️</span> <span id="cloudL">A copy</span></button>
      <button class="fbb" type="button" id="room" hidden><span aria-hidden="true">🖼️</span> <span id="roomL">Keepsakes</span></button>
      <button class="fbb fbb-glass" type="button" id="clear"><span aria-hidden="true">🧹</span> <span id="clearL">Clear</span></button>
    </div>
    <span class="yp-k" id="kName">NAME YOUR PLACE</span>
    <input class="yp-name" id="name" maxlength="28" autocomplete="off" />
  </main>
</div>
<section class="sheet" id="sheet" hidden role="dialog"><button class="x" type="button" data-close aria-label="Close">✕</button><div id="sheetB"></div></section>
