main{max-width:640px;margin:0 auto;padding:4px 16px 100px}
.room{position:relative;border:4px solid #000;box-shadow:6px 6px 0 #000;background:#000;touch-action:none;user-select:none;-webkit-user-select:none}
.room canvas{display:block;width:100%;aspect-ratio:160/110;image-rendering:pixelated;cursor:grab}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.on{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:.9}100%{opacity:0}}
.tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0 4px}
.tool{width:56px;height:56px;border:3px solid #000;background:#3a2214;font-size:26px;cursor:pointer;display:grid;place-items:center;box-shadow:inset -3px -3px 0 rgba(0,0,0,.45),inset 3px 3px 0 rgba(255,220,170,.15),3px 3px 0 #000}

.mood{text-align:center;color:var(--dim);min-height:24px;font-size:19px}

.board .pola{padding-bottom:8px}.board .pola::before{content:"📌";position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-size:16px;filter:drop-shadow(1px 1px 0 rgba(0,0,0,.4))}
.board .pola.mine{outline:2px dashed #fff3c0;outline-offset:2px}.board .empty{grid-column:1/-1;margin:0;font:400 20px/1.3 var(--vt,monospace);color:#3a2214;text-align:center;align-self:center}

.big .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}.big .acts button{padding:6px 10px;border:2px solid #000;background:#fbf6ea;color:#3a2a1c;font:400 16px var(--vt,monospace);cursor:pointer}
.scrim{position:fixed;inset:0;z-index:50;background:rgba(10,6,4,.8);display:grid;place-items:center;padding:16px}
.big{width:min(520px,100%);padding:12px 12px 16px;background:#fbf6ea;color:#3a2a1c;box-shadow:6px 6px 0 #000;animation:up .3s steps(4)}
.big canvas,.big img{display:block;width:100%;aspect-ratio:160/110;image-rendering:pixelated}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
