.sheet{width:100%;max-width:460px;max-height:86vh;overflow:auto;background:#2a1810;border:4px solid #000;box-shadow:6px 6px 0 #000,inset 0 0 0 3px #4a2c1a;padding:18px 16px 16px;position:relative;animation:up .35s steps(5)}

<body>
<header class="top">
  <div class="sign" data-t="title">SAY HELLO</div>
  <div class="tools">
    <button class="pill" type="button" id="sentBtn" aria-label="Sent">📮<span class="n" id="sentN" hidden></span></button>
    <button class="pill" type="button" data-fbl-btn aria-label="Language"><span aria-hidden="true">🌐</span><span data-fbl-label>EN</span></button>

</header>

<main>
  <h1 class="sr" data-t="title">Postcard</h1>
  <div class="stage">
    <div class="card" id="card" role="group">
      <div class="face front">
        <canvas id="scene" width="160" height="110"></canvas>
        <div class="greet"><b data-t="greet">Greetings from</b><input id="place" maxlength="40" autocomplete="off" data-tp="placePh"></div>
      </div>
      <div class="face back">
        <div class="l"><textarea id="msg" class="msg" maxlength="300" data-tp="msgPh"></textarea><span class="count" id="count"></span></div>
        <div class="r">
          <button class="stamp" id="stamp" type="button"><i id="stampI">🐈</i></button>
          <div class="pm" id="pm"></div>
          <div class="lines">
            <label class="ln"><b data-t="to">To</b><input id="to" maxlength="32" autocomplete="off" data-tp="toPh"></label>
            <label class="ln"><b data-t="from">From</b><input id="from" maxlength="32" autocomplete="off" data-tp="fromPh"></label>
          </div>
        </div>
      </div>

  <!-- writing -->
  <section id="write">
    <div class="row" id="scenes" role="group"></div>
    <div class="row"><button class="chip t" type="button" id="flipBtn">↻ <span data-t="flip">Turn over</span></button><span id="inks" class="row" style="margin:0"></span></div>
    <div class="lbl">🔒 <span data-t="when">Opens</span></div>

      <button class="big" type="button" id="toFriend"><span class="e">✉️</span><span data-t="friend">Send to a friend</span></button>
      <button class="big alt" type="button" id="toBar"><span class="e">🍸</span><span data-t="bar">Hang in Next Door</span></button>
    </div>
  </section>

  <!-- reading -->
  <section id="read" hidden>
    <div class="clock" id="clock"></div>
    <div class="when" id="readWhen"></div>
    <div class="row" id="readBtns"></div>
  </section>

  <p class="foot"><a href="/nearby/next-door/#wall-cards" data-t="seeWall">The Wall in Next Door →</a> · <a href="/say-hello/" target="_top" rel="noopener" data-t="app">Say Hello on its own ↗</a></p>

<script id="pc-scenes">
/* Postcard pictures, drawn as pixels so every card is light (Next Door borrows this block to draw the Wall). */
window.PCScenes = (function () {
  var W = 160, H = 110;
  function rng(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return function () { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 10000) / 10000; }; }

  function bands(p, cols, y0, y1) { var n = cols.length, hh = (y1 - y0) / n; cols.forEach(function (c, i) { p.r(0, y0 + i * hh, W, hh + 1, c); }); }
  function cloud(p, x, y, s, c) { p.r(x, y + 2 * s, 12 * s, 3 * s, c); p.r(x + 2 * s, y, 5 * s, 3 * s, c); p.r(x + 6 * s, y + s, 4 * s, 2 * s, c); }
  function ridge(p, R, y, amp, c, step) { var h = y; for (var x = 0; x < W; x += step) { h += (R() - .5) * amp; h = Math.max(y - amp * 2, Math.min(y + amp, h)); p.r(x, h, step, H - h, c); } }
  function ell(p, cx, cy, rx, ry, c, top) { for (var y = -ry; y <= ry; y++) { if (top === 1 && y < 0) continue; var w = Math.round(rx * Math.sqrt(1 - (y * y) / (ry * ry))); p.r(cx - w, cy + y, w * 2, 1, c); } }
  /* small people for the pictures where two are together: standing, sitting (dir 1 faces right, -1 left, 0 front) and lying */
  function head(p, x, y, o) { p.r(x + 1, y, 5, 5, o.s); p.r(x + 1, y - 1, 5, 2, o.h); p.r(x, y, 1, 3, o.h); p.r(x + 6, y, 1, 2, o.h); if (o.hl) { p.r(x, y, 1, 7, o.h); p.r(x + 6, y, 1, 7, o.h); } if (o.bun) p.r(x + 2, y - 3, 3, 2, o.h);
    if (o.hood) { p.r(x, y - 2, 7, 3, o.c); p.r(x, y, 1, 4, o.c); p.r(x + 6, y, 1, 4, o.c); } p.r(x + 2, y + 2, 1, 1, "#2a1a14"); p.r(x + 4, y + 2, 1, 1, "#2a1a14"); }

    if (o.k) { p.r(x, y - 10, 7, 4, o.k); p.r(x + 1, y - 6, 2, 6, "#3a2a2a"); p.r(x + 4, y - 6, 2, 6, "#3a2a2a"); } else { p.r(x + 1, y - 9, 2, 9, pt); p.r(x + 4, y - 9, 2, 9, pt); }
    p.r(x, y - 1, 3, 1, "#1a1010"); p.r(x + 4, y - 1, 3, 1, "#1a1010"); p.r(x, y - 18, 7, o.k ? 8 : 9, o.c); if (o.sc) p.r(x, y - 18, 7, 2, o.sc); if (o.apr) p.r(x + 1, y - 16, 5, 8, o.apr); head(p, x, y - 23, o); }

      e.stopPropagation(); var ks = Object.keys(P.STAMPS); card.stamp = ks[(ks.indexOf(card.stamp) + 1) % ks.length]; save(); paintCard(card);
      var s = $("#stamp"); s.classList.remove("thud"); void s.offsetWidth; s.classList.add("thud"); blip(160, .12, "triangle", .12);
    };
    $("#card").addEventListener("click", function (e) { if (e.target.closest("input,textarea,.stamp")) return; flip(); });
    $("#flipBtn").onclick = function () { flip(); };
    $("#toFriend").onclick = function () { send(false); };
    $("#toBar").onclick = function () { send(true); };
    if (q.get("to") === "bar" || q.get("wall")) { card.to = ""; $("#to").value = ""; $("#toBar").style.outline = "3px solid #fff"; }
    count(); setWhen("now"); paintChips();
  }
  function count() { var n = card.msg.length; $("#count").textContent = n > 220 ? (300 - n) : ""; }
  function paintChips() {
    document.querySelectorAll("#scenes .chip").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.k === card.scene); b.setAttribute("aria-label", t("scenes")[b.dataset.k] ? T.scenes[b.dataset.k][L()] : b.dataset.k); b.title = b.getAttribute("aria-label"); });
    document.querySelectorAll("#inks .chip").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.k === card.ink); b.setAttribute("aria-label", b.dataset.k); });
    document.querySelectorAll("#whens .chip").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.k === when); b.querySelector("span").textContent = t(b.dataset.k); });
  }
  function setWhen(w) {
    when = w; var n = new Date();
    if (w === "now") at = n;
    else if (w === "tomorrow") { at = new Date(n); at.setDate(at.getDate() + 1); at.setHours(9, 0, 0, 0); }
    else if (w === "week") { at = new Date(n.getTime() + 7 * 864e5); at.setSeconds(0, 0); }
    else if (w === "year") { at = new Date(n); at.setFullYear(at.getFullYear() + 1); at.setSeconds(0, 0); }
    else if (w === "pick") { if (at <= n) { at = new Date(n.getTime() + 3 * 864e5); at.setHours(20, 0, 0, 0); } var pad = function (x) { return String(x).padStart(2, "0"); }; $("#pickAt").value = at.getFullYear() + "-" + pad(at.getMonth() + 1) + "-" + pad(at.getDate()) + "T" + pad(at.getHours()) + ":" + pad(at.getMinutes()); $("#pickAt").min = new Date(n.getTime() - n.getTimezoneOffset() * 6e4).toISOString().slice(0, 16); }
    $("#pickRow").hidden = w !== "pick"; paintWhen(); paintChips();
  }
  function paintWhen() { $("#opens").textContent = when === "now" || at <= new Date() ? "🔓 " + t("rightAway") : "🔒 " + t("sealedTill", { d: fmt(at) }); }

  function send(wall, again) {
    if (!card.msg.trim()) { flip(true); setTimeout(function () { $("#msg").focus(); }, 500); toast(t("needMsg")); return; }
    if (!card.from.trim()) { flip(true); setTimeout(function () { $("#from").focus(); }, 500); toast(t("needFrom")); return; }
    var btns = [$("#toFriend"), $("#toBar")]; btns.forEach(function (b) { b.disabled = true; });
    var body = { scene: card.scene, stamp: card.stamp, ink: card.ink, msg: card.msg.trim(), from: card.from.trim(), to: wall ? "" : card.to.trim(), place: card.place.trim(), lang: (window.FBL && FBL.get()) || "en", open_at: (when === "now" ? new Date() : at).toISOString(), wall: !!wall };
    api("postcard_send", { p_secret: key(), p_card: body }).then(function (id) {
      var l = sentList(); l.unshift({ id: id, to: body.to, wall: !!wall, open_at: body.open_at, scene: body.scene }); ls("postcard_sent", JSON.stringify(l.slice(0, 60)));
      blip(220, .2, "triangle", .15); setTimeout(function () { blip(880, .12); }, 160);
      card.msg = ""; card.to = ""; $("#msg").value = ""; $("#to").value = ""; save(); count(); paintSent();
      done(id, wall, body);
    }).catch(function (e) {
      var m = String(e && e.message || e);
      if (/privacy|offline/i.test(m) && !again && window.FBC && FBC.reask && FBC.choice("postcard") === false) { FBC.reask("postcard"); btns.forEach(function (b) { b.disabled = false; }); return send(wall, true); }   /* pressing Send means they want it sent: ask once more */
      toast(/privacy/i.test(m) ? t("privacy") : /rest|too fast|a day/i.test(m) ? t("rest") : t("offline"));
    }).then(function () { btns.forEach(function (b) { b.disabled = false; }); });
  }
  function link(id) { return window.FBApps ? FBApps.link("postcard", "?c=" + id) : location.origin + "/nearby/say-hello/?c=" + id; }   /* the card goes out as the Say Hello app's address; the town's own ?c= still opens it */
  /* these cards are only to look at: a tap outside (or Esc) puts one away, no ✕; the tap that opened it never closes it */
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") { var l = document.querySelectorAll(".scrim"); if (l.length) l[l.length - 1].remove(); } });
  function sheet(html) {
    var s = document.createElement("div"), at0 = Date.now(); s.className = "scrim"; s.innerHTML = '<div class="sheet" role="dialog" aria-modal="true">' + html + '</div>';
    s.onclick = function (e) { if (e.target === s && Date.now() - at0 > 450) s.remove(); };
    document.body.appendChild(s); return s;
  }
  function done(id, wall, body) {
    var sealed = new Date(body.open_at) > new Date(Date.now() + 6e4);
    if (wall) {
      sheet('<div class="fly">🍸</div><h2>' + esc(t("onWall")) + '</h2>' + (sealed ? '<p class="when">🔒 ' + esc(t("opensOn", { d: fmt(new Date(body.open_at)) })) + '</p>' : "") +
        '<a class="big alt" href="/nearby/next-door/#wall-cards" style="margin-top:12px">' + esc(t("seeBar")) + '</a>');
      return;
    }
    var s = sheet('<div class="fly">✉️</div><h2>' + esc(t("posted")) + '</h2>' + (sealed ? '<p class="when">🔒 ' + esc(t("opensOn", { d: fmt(new Date(body.open_at)) })) + '</p>' : "") +
      '<div class="link"><input readonly value="' + esc(link(id)) + '"><button class="pill" type="button" id="cp">📋 ' + esc(t("copy")) + '</button></div>' +
      (navigator.share ? '<button class="big" type="button" id="sh" style="width:100%">↗ ' + esc(t("share")) + '</button>' : ""));
    var inp = s.querySelector("input"); inp.onclick = function () { inp.select(); };
    s.querySelector("#cp").onclick = function () { copy(link(id), this); };
    var sh = s.querySelector("#sh"); if (sh) sh.onclick = function () { navigator.share({ title: t("shareText"), text: t("shareText"), url: link(id) }).catch(function () {}); };
  }
  function copy(text, btn) {
    var ok = function () { if (btn) btn.textContent = t("copied"); toast(t("copied")); };
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(ok, function () { fallback(); }); else fallback();
    function fallback() { var i = document.createElement("textarea"); i.value = text; document.body.appendChild(i); i.select(); try { document.execCommand("copy"); ok(); } catch (e) {} i.remove(); }
  }
  function paintSent() { var n = sentList().length, e = $("#sentN"); e.hidden = !n; e.textContent = n; }
  $("#sentBtn").onclick = function () {
    var l = sentList(), now = new Date();
    var html = '<h2>📮 ' + esc(t("sent")) + '</h2>' + (l.length ? '<ul class="list">' + l.map(function (c) {
      var o = new Date(c.open_at), sealed = o > now;
      return '<li><span>' + (P.ICON[c.scene] || "✉️") + '</span><a href="' + esc(c.wall ? "/nearby/next-door/#wall-cards" : "/nearby/say-hello/?c=" + c.id) + '">' + (c.wall ? "🍸 " + esc(t("bar")) : "→ " + esc(c.to || t("toPh"))) + '</a><small>' + (sealed ? "🔒 " + esc(fmt(o)) : "🔓") + '</small>' + (c.wall ? "" : '<button class="pill" type="button" data-cp="' + esc(c.id) + '" aria-label="' + esc(t("copy")) + '">📋</button>') + '</li>';
    }).join("") + '</ul>' : '<p class="when">' + esc(t("none")) + '</p>');
    var s = sheet(html);
    s.querySelectorAll("[data-cp]").forEach(function (b) { b.onclick = function () { copy(link(b.dataset.cp)); }; });
  };

  /* ---------- reading a card someone sent ---------- */
  var got = null, tick = null;
  function buildRead() {
    $("#write").hidden = true; $("#read").hidden = false;
    ["#place", "#msg", "#to", "#from"].forEach(function (s) { var e = $(s); e.readOnly = true; e.tabIndex = -1; });
    $("#stamp").onclick = null; $("#stamp").tabIndex = -1;
    api("postcard_get", { p_id: reading }, true).then(function (c) {
      if (!c) { $("#clock").textContent = "✉️"; $("#readWhen").textContent = t("lost"); readButtons(false); return; }
      got = c; paintRead();
    }).catch(function () { $("#readWhen").textContent = t("offline"); });
  }
  function paintRead() {
    var c = got; card = { scene: c.scene, stamp: c.stamp, ink: c.ink, place: c.place || "", msg: c.msg || "", to: c.to || "", from: c.from, id: c.id, sent: c.sent };
    paintCard(card);
    $("#place").value = card.place; $("#to").value = card.to; $("#from").value = card.from;
    var l = $(".back .l"); l.innerHTML = '<div class="readmsg"></div>'; l.firstChild.textContent = card.msg;
    var o = new Date(c.open_at), env = $(".env");
    if (!env) {
      env = document.createElement("div"); env.className = "env";
      env.innerHTML = '<button class="stamp" type="button" tabindex="-1"><i></i></button><button class="seal" type="button">✉</button><div class="addr"></div>';
      $("#card").parentNode.style.position = "relative"; $("#card").appendChild(env);
      env.addEventListener("click", function (e) { e.stopPropagation(); });
      env.querySelector(".seal").onclick = openIt;
    }
    var st = P.STAMPS[c.stamp] || P.STAMPS.cat, ei = env.querySelector(".stamp i"); ei.textContent = st[0]; env.querySelector(".stamp").style.setProperty("--sc", st[1]);
    env.querySelector(".addr").innerHTML = (c.to ? "<small>" + esc(t("forYou")) + "</small>" + esc(c.to) : "") + "<small>" + esc(t("fromW")) + " " + esc(c.from) + "</small>";
    if (c.sealed) {
      env.querySelector(".seal").disabled = true; env.querySelector(".seal").setAttribute("aria-label", t("opensOn", { d: fmt(o) }));
      $("#readWhen").innerHTML = esc("🔒 " + t("opensOn", { d: fmt(o) })) + '<br><small style="font-size:17px;opacity:.8">' + esc(t("bell")) + "</small>";
      clearInterval(tick); tick = setInterval(countdown, 1000); countdown(); readButtons(true);
      try { var wl = JSON.parse(ls("postcard_waiting") || "[]"); if (!wl.some(function (x) { return x.id === c.id; })) { wl.unshift({ id: c.id, from: c.from, open_at: c.open_at }); ls("postcard_waiting", JSON.stringify(wl.slice(0, 40))); } } catch (e) {}
    } else {
      clearInterval(tick); $("#clock").textContent = "";
      var seal = env.querySelector(".seal"); seal.disabled = false; seal.classList.add("ready"); seal.setAttribute("aria-label", t("tapSeal")); seal.title = t("tapSeal");
      $("#readWhen").textContent = "🔓 " + t("tapSeal"); readButtons(false);
    }
  }
  function countdown() {
    var ms = new Date(got.open_at) - new Date();
    if (ms <= 0) { clearInterval(tick); $("#clock").textContent = "00:00:00"; setTimeout(function () { api("postcard_get", { p_id: reading }, true).then(function (c) { if (c) { got = c; paintRead(); blip(660, .2, "triangle", .1); } }); }, 1200); return; }
    var s = Math.floor(ms / 1000), dd = Math.floor(s / 86400), hh = Math.floor(s % 86400 / 3600), mm = Math.floor(s % 3600 / 60), ss = s % 60, p2 = function (x) { return String(x).padStart(2, "0"); };
    $("#clock").textContent = (dd ? dd + t("day") + " " : "") + p2(hh) + ":" + p2(mm) + ":" + p2(ss);
  }
  function openIt() {
    if (!got || got.sealed) return;
    var env = $(".env"); swish(); blip(300, .15, "triangle", .12);
    env.classList.add("gone"); setTimeout(function () { env.remove(); flip(false); setTimeout(function () { flip(true); }, 1300); }, 700);
    $("#readWhen").textContent = "";
    try { ls("postcard_waiting", JSON.stringify(JSON.parse(ls("postcard_waiting") || "[]").filter(function (x) { return x.id !== got.id; }))); } catch (e) {}
    try { var box = JSON.parse(ls("postcard_box") || "[]"); if (!box.some(function (b) { return b.id === got.id; })) { box.unshift({ id: got.id, from: got.from, scene: got.scene, open_at: got.open_at }); ls("postcard_box", JSON.stringify(box.slice(0, 60))); } } catch (e) {}
  }
  function readButtons(sealed) {
    var r = $("#readBtns"); r.innerHTML = "";
    function a(label, href, cls) { var e = document.createElement("a"); e.className = cls || "chip t"; e.href = href; e.textContent = label; r.appendChild(e); return e; }
    if (sealed && got) {
      var b = document.createElement("button"); b.type = "button"; b.className = "chip t"; b.textContent = "⏰ " + t("remind"); b.onclick = ics; r.appendChild(b);
    }
    if (got && !sealed) a("✍️ " + t("reply"), "/nearby/say-hello/?to=" + encodeURIComponent(got.from) + "&scene=" + encodeURIComponent(got.scene));
    a("✉️ " + t("own"), "/nearby/say-hello/");
  }
  function ics() {
    var o = new Date(got.open_at), z = function (d) { return d.toISOString().replace(/[-:]/g, "").replace(/\.\d+/, ""); };
    var txt = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//FREE//BUILDER//Postcard//EN", "BEGIN:VEVENT", "UID:" + got.id + "@freebuilder.net", "DTSTAMP:" + z(new Date()), "DTSTART:" + z(o), "DTEND:" + z(new Date(o.getTime() + 9e5)),
      "SUMMARY:" + t("calTitle", { n: got.from }).replace(/[,;]/g, " "), "URL:" + link(got.id), "DESCRIPTION:" + link(got.id), "BEGIN:VALARM", "TRIGGER:PT0M", "ACTION:DISPLAY", "DESCRIPTION:📮", "END:VALARM", "END:VEVENT", "END:VCALENDAR"].join("\r\n");
    var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([txt], { type: "text/calendar" })); a.download = "postcard.ics"; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }

  /* ---------- language ---------- */
  function words() {
    document.documentElement.lang = ["en", "zh-Hans", "zh-Hant", "es", "ca"][L()];
    document.title = (window.FBWorld && FBWorld.name) ? FBWorld.name("postcard") + " · " + FBWorld.name("map") : document.title;
    document.querySelectorAll("[data-t]").forEach(function (e) { e.textContent = t(e.getAttribute("data-t")); });
    document.querySelectorAll("[data-tp]").forEach(function (e) { e.placeholder = t(e.getAttribute("data-tp")); });
    $("#stamp").setAttribute("aria-label", t("stamp")); $("#stamp").title = reading ? "" : t("stamp");
    $("#sentBtn").setAttribute("aria-label", t("sent")); $("[data-fbl-btn]").setAttribute("aria-label", t("lang"));
    var lab = $("[data-fbl-label]"); if (lab && window.FBL && FBL.SHORT) lab.textContent = FBL.SHORT[FBL.get() || "en"];
    paintCard(card); if (!reading) { paintChips(); paintWhen(); } else if (got) paintRead();
  }
  window.FBL_GET = function () { return (window.FBL && FBL.get()) || "en"; };
  window.FBL_SET = function (l) { if (window.FBL) FBL.set(l); words(); };

  paintSent();
  if (reading) buildRead(); else buildWrite();
  paintCard(card); words();
})();
