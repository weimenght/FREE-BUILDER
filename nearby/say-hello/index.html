<style>
:root{--bg:#1d130d;--ink:#fbeedd;--dim:rgba(251,238,221,.62);--a:#f6b73c;--paper:#f6ecd2;--paper2:#ecdfbf;--pen:#2c4a86;
  --px:'Press Start 2P',ui-monospace,monospace;--vt:'VT323',ui-monospace,'PingFang SC','Microsoft YaHei',monospace;--hand:'Caveat','Kaiti SC','STKaiti','KaiTi',cursive;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 20px/1.1 var(--vt);-webkit-tap-highlight-color:transparent}
body{min-height:100vh;overflow-x:hidden;background:repeating-conic-gradient(rgba(0,0,0,.2) 0 25%,transparent 0 50%) 0 0/4px 4px,radial-gradient(120% 70% at 50% 0,#3a2416,#1d130d 70%);image-rendering:pixelated}

.sign{font:400 18px/1 var(--px);letter-spacing:.06em;color:#fff3c0;text-shadow:3px 3px 0 #b3261e;padding:8px 10px;border:3px solid #ffd27a;box-shadow:inset 0 0 0 3px #b3261e,4px 4px 0 #000;background:#2a140b;white-space:nowrap}
.tools{display:flex;gap:8px}

main{max-width:620px;margin:0 auto;padding:10px 16px 110px}
/* ---- the card ---- */
.stage{perspective:1400px;margin:8px auto 14px;max-width:560px}
.card{position:relative;width:100%;aspect-ratio:4/3;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,1.3,.5,1);cursor:pointer}

.front{background:#000}
.front canvas{display:block;width:100%;height:100%;image-rendering:pixelated}

.greet input,.greet span{pointer-events:auto;max-width:100%;font:600 34px/1 var(--hand);color:#fff7dc;text-shadow:3px 3px 0 #000,-1px -1px 0 #000;background:transparent;border:0;outline:0;padding:0;width:100%}
.greet input::placeholder{color:rgba(255,247,220,.55)}
.back{transform:rotateY(180deg);background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(120,90,40,.05) 3px 4px),var(--paper);color:var(--pen);display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:0}
.back .l{position:relative;padding:12px 12px 10px 14px;border-right:2px solid rgba(60,40,20,.35)}
.back .r{position:relative;padding:12px 12px 10px 12px;display:flex;flex-direction:column}
.msg{width:100%;height:100%;resize:none;border:0;outline:0;background:repeating-linear-gradient(transparent 0 25px,rgba(60,90,140,.25) 25px 26px);font:600 21px/26px var(--hand);color:var(--pen);padding:0}
.msg::placeholder{color:rgba(44,74,134,.45)}
.stamp{align-self:flex-end;position:relative;width:62px;height:74px;padding:6px;border:0;cursor:pointer;
  background:radial-gradient(circle at 50% 50%,transparent 2.6px,#fffaf0 3px) -4px -4px/8px 8px;filter:drop-shadow(1px 1px 0 rgba(0,0,0,.35))}
.stamp i{display:grid;place-items:center;width:100%;height:100%;font-style:normal;font-size:28px;background:var(--sc,#c8402a);box-shadow:inset 0 0 0 2px rgba(255,255,255,.55)}
.stamp i::after{content:attr(data-v);position:absolute;bottom:9px;right:10px;font:400 10px/1 var(--vt);color:#fff}
.stamp.thud{animation:thud .35s steps(3)}
@keyframes thud{0%{transform:scale(1.25) rotate(8deg)}100%{transform:none}}
.pm{position:absolute;top:30px;right:52px;width:70px;height:70px;border-radius:50%;border:2px solid currentColor;color:rgba(160,40,30,.55);display:grid;place-items:center;text-align:center;font:400 13px/1 var(--vt);transform:rotate(-14deg);pointer-events:none;padding:6px}
.pm::after{content:"";position:absolute;left:62px;top:24px;width:58px;height:20px;background:repeating-linear-gradient(0deg,currentColor 0 2px,transparent 2px 6px);opacity:.8}
.lines{margin-top:auto;display:grid;gap:8px}
.ln{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid rgba(60,40,20,.4)}
.ln b{font:400 15px/1 var(--vt);color:rgba(60,40,20,.7);text-transform:uppercase}
.ln input,.ln span{flex:1;min-width:0;border:0;outline:0;background:transparent;font:600 22px/1.1 var(--hand);color:var(--pen);padding:0}

/* ---- envelope for sealed cards ---- */
.env{position:absolute;inset:-4px;z-index:5;background:linear-gradient(160deg,#d8b98a,#c9a575);border:4px solid #000;box-shadow:6px 6px 0 #000;display:grid;place-items:center;transition:transform .8s cubic-bezier(.5,-.3,.6,1),opacity .8s;cursor:default}
.env::before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom right,transparent 49.5%,rgba(0,0,0,.18) 50%,transparent 51%),linear-gradient(to bottom left,transparent 49.5%,rgba(0,0,0,.18) 50%,transparent 51%);background-size:100% 62%;background-repeat:no-repeat}
.env .addr{position:absolute;left:16px;bottom:14px;color:#3a2a1c;font:600 26px/1.05 var(--hand)}
.env .addr small{display:block;font:400 15px/1 var(--vt);opacity:.7}
.env .stamp{position:absolute;top:12px;right:12px;cursor:default}
.seal{position:relative;z-index:1;width:84px;height:84px;border-radius:50%;border:4px solid #000;background:radial-gradient(circle at 35% 35%,#e05a46,#9c2418 70%);box-shadow:inset -4px -4px 0 rgba(0,0,0,.3),4px 4px 0 #000;font:400 30px/1 var(--px);color:#ffd9c9;display:grid;place-items:center;cursor:pointer}
.seal:disabled{cursor:default;filter:saturate(.75)}
.seal.ready{animation:beat 1.1s infinite}
@keyframes beat{50%{transform:scale(1.08)}}
.env.gone{transform:translateY(110%) rotate(6deg);opacity:0;pointer-events:none}
.clock{text-align:center;margin:4px 0 2px;font:400 15px/1.5 var(--px);color:var(--a);letter-spacing:.06em}
.when{text-align:center;color:var(--dim);font-size:20px}
/* ---- controls ---- */
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:center;margin:10px 0}
.chip{min-width:46px;height:46px;padding:0 9px;border:3px solid #000;background:#3a2214;color:var(--ink);text-decoration:none;font-size:22px;cursor:pointer;display:inline-grid;place-items:center;box-shadow:inset -3px -3px 0 rgba(0,0,0,.45),inset 3px 3px 0 rgba(255,220,170,.15)}
.chip[aria-pressed="true"]{background:var(--a);color:#1d130d;box-shadow:inset -3px -3px 0 rgba(0,0,0,.35),inset 3px 3px 0 rgba(255,255,255,.4),0 0 0 3px #fff}
.chip.t{font-size:19px;padding:0 12px}
.ink{width:34px;height:34px;min-width:34px;padding:0;border-radius:0}
.ink::after{content:"";width:18px;height:18px;background:var(--c);box-shadow:inset -2px -2px 0 rgba(0,0,0,.35)}
.lbl{display:flex;align-items:center;gap:8px;justify-content:center;color:var(--dim);font-size:19px;margin-top:16px}
.lbl::before,.lbl::after{content:"";flex:1;max-width:80px;height:3px;background:repeating-linear-gradient(90deg,rgba(251,238,221,.25) 0 6px,transparent 6px 10px)}
#pickAt{height:46px;border:3px solid #000;background:#2a1810;color:var(--ink);padding:0 8px;font:400 19px/1 var(--vt);color-scheme:dark}
.opens{text-align:center;font-size:20px;color:var(--a);min-height:24px}
.send{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.big{display:flex;align-items:center;justify-content:center;gap:10px;min-height:60px;padding:8px 12px;border:4px solid #000;background:var(--a);color:#1d130d;font:400 22px/1 var(--vt);cursor:pointer;box-shadow:inset -4px -4px 0 rgba(0,0,0,.25),inset 4px 4px 0 rgba(255,255,255,.35),5px 5px 0 #000;text-decoration:none;text-align:center}
.big.alt{background:#7affc1}
.big .e{font-size:26px}
.big[disabled]{filter:grayscale(.7) brightness(.7);cursor:wait}
/* ---- sheets ---- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(10,6,4,.72);display:grid;place-items:end center;padding:16px}
@media (min-width:620px){.scrim{place-items:center}}
.sheet{width:100%;max-width:460px;max-height:86vh;overflow:auto;background:#2a1810;border:4px solid #000;box-shadow:6px 6px 0 #000,inset 0 0 0 3px #4a2c1a;padding:18px 16px 16px;position:relative;animation:up .35s steps(5)}
@keyframes up{0%{transform:translateY(40px);opacity:0}}
.sheet h2{margin:0 0 10px;font:400 14px/1.5 var(--px);color:var(--a)}
.sheet .x{position:absolute;top:8px;right:8px}
.link{display:flex;gap:8px;margin:12px 0}
.link input{flex:1;min-width:0;height:46px;border:3px solid #000;background:#140b07;padding:0 10px;font:400 18px/1 var(--vt);color:#fff3c0}
.fly{font-size:54px;text-align:center;animation:fly 1.4s steps(8) both}
@keyframes fly{0%{transform:translate(-40px,20px) rotate(-20deg)}60%{transform:translate(20px,-10px) rotate(8deg)}100%{transform:none}}
.list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.list li{display:flex;align-items:center;gap:10px;padding:8px 10px;background:#3a2214;border:3px solid #000}
.list li a{color:inherit;flex:1;min-width:0;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list li small{color:var(--dim);white-space:nowrap}
.foot{text-align:center;margin-top:22px;color:var(--dim);font-size:18px}
.foot a{color:var(--a);display:inline-block;margin:4px 0;line-height:1.4}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;transition:.25s;z-index:60;background:#000;color:#fff3c0;border:3px solid var(--a);padding:10px 14px;font-size:19px;max-width:calc(100vw - 32px);text-align:center;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>
<header class="top">
  <div class="sign" data-t="title">POSTCARD</div>
  <div class="tools">
    <button class="pill" type="button" id="sentBtn" aria-label="Sent">📮<span class="n" id="sentN" hidden></span></button>
    <button class="pill" type="button" data-fbl-btn aria-label="Language"><span aria-hidden="true">🌐</span><span data-fbl-label>EN</span></button>
  </div>
</header>

<main>
  <h1 class="sr" data-t="title">Postcard</h1>
  <div class="stage">
    <div class="card" id="card" role="group">
      <div class="face front">
        <canvas id="scene" width="160" height="110"></canvas>
        <div class="greet"><b data-t="greet">Greetings from</b><input id="place" maxlength="40" autocomplete="off" data-tp="placePh"></div>
      </div>
      <div class="face back">
        <div class="l"><textarea id="msg" class="msg" maxlength="300" data-tp="msgPh"></textarea><span class="count" id="count"></span></div>
        <div class="r">
          <button class="stamp" id="stamp" type="button"><i id="stampI">🐈</i></button>
          <div class="pm" id="pm"></div>
          <div class="lines">
            <label class="ln"><b data-t="to">To</b><input id="to" maxlength="32" autocomplete="off" data-tp="toPh"></label>
            <label class="ln"><b data-t="from">From</b><input id="from" maxlength="32" autocomplete="off" data-tp="fromPh"></label>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- writing -->
  <section id="write">
    <div class="row" id="scenes" role="group"></div>
    <div class="row"><button class="chip t" type="button" id="flipBtn">↻ <span data-t="flip">Turn over</span></button><span id="inks" class="row" style="margin:0"></span></div>
    <div class="lbl">🔒 <span data-t="when">Opens</span></div>
    <div class="row" id="whens" role="group"></div>
    <div class="row" id="pickRow" hidden><input type="datetime-local" id="pickAt"></div>
    <div class="opens" id="opens"></div>
    <div class="send">
      <button class="big" type="button" id="toFriend"><span class="e">✉️</span><span data-t="friend">Send to a friend</span></button>
      <button class="big alt" type="button" id="toBar"><span class="e">🍸</span><span data-t="bar">Hang in Wei's Bar</span></button>
    </div>
  </section>

  <!-- reading -->
  <section id="read" hidden>
    <div class="clock" id="clock"></div>
    <div class="when" id="readWhen"></div>
    <div class="row" id="readBtns"></div>
  </section>

  <p class="foot"><a href="/nearby/next-door/#wall-cards" data-t="seeWall">The Wall in Wei's Bar →</a><br><a href="/nearby/handoff/">🕰️ <span data-t="handoff">Next counter: Handoff, for two people apart</span></a></p>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script id="pc-scenes">
/* Postcard pictures, drawn as pixels so every card is light (Wei's Bar borrows this block to draw the Wall). */
window.PCScenes = (function () {

  var S = {
    hutong: function (p, R) {
      bands(p, ["#3b2a5a", "#5b3a6e", "#8a4a6a", "#c46a5a", "#e8996a"], 0, 60);

      for (var y = 62; y < 108; y += 5) for (var x = (y / 5 % 2) * 6; x < W; x += 12) p.r(x, y, 11, 4, R() < .5 ? "#7d7873" : "#75706b");

      for (var i = 0; i < 52; i += 6) { p.r(i, 36, 5, 8, "#3a3a40"); p.r(108 + i, 36, 5, 8, "#3a3a40"); }

      p.r(64, 52, 32, 58, "#2a1a14"); p.r(66, 54, 13, 56, "#9c2418"); p.r(81, 54, 13, 56, "#9c2418"); p.r(77, 78, 2, 3, "#f6b73c"); p.r(81, 78, 2, 3, "#f6b73c");
      p.r(60, 46, 40, 6, "#3a3a40"); p.r(58, 44, 44, 3, "#2a2a30");
      [[24, 50], [134, 50]].forEach(function (l) { p.r(l[0], l[1] - 6, 1, 6, "#2a1a14"); p.r(l[0] - 5, l[1], 11, 12, "#e0402a"); p.r(l[0] - 4, l[1] + 1, 9, 10, "#ff6a4a"); p.r(l[0] - 2, l[1] + 12, 5, 3, "#f6b73c"); p.r(l[0] - 9, l[1] - 3, 19, 18, "rgba(255,160,90,.12)"); });
      p.r(118, 28, 8, 6, "#111"); p.r(119, 26, 2, 2, "#111"); p.r(124, 26, 2, 2, "#111"); p.r(126, 31, 6, 2, "#111");
      for (var s = 0; s < 14; s++) p.r(R() * W, R() * 26, 1, 1, "rgba(255,255,230,.7)");

      b.onclick = function () { card.ink = k; save(); paintCard(card); paintChips(); flip(true); blip(700, .05); };
      $("#inks").appendChild(b);
    });
    [["now", "🔓"], ["tomorrow", "🌅"], ["week", "📅"], ["year", "🎁"], ["pick", "✏️"]].forEach(function (w) {
      var b = document.createElement("button"); b.type = "button"; b.className = "chip t"; b.dataset.k = w[0];
      b.innerHTML = w[1] + ' <span></span>'; b.onclick = function () { setWhen(w[0]); blip(440, .06); };
      $("#whens").appendChild(b);
    });
    $("#place").oninput = function () { card.place = this.value; save(); paintCard(card); };
    $("#msg").oninput = function () { card.msg = this.value; save(); count(); };
    $("#to").oninput = function () { card.to = this.value; save(); };
    $("#from").oninput = function () { card.from = this.value; ls("postcard_name", this.value.trim()); save(); };
    $("#pickAt").onchange = function () { var v = new Date(this.value); if (!isNaN(v)) { at = v; paintWhen(); } };
    $("#stamp").onclick = function (e) {
      e.stopPropagation(); var ks = Object.keys(P.STAMPS); card.stamp = ks[(ks.indexOf(card.stamp) + 1) % ks.length]; save(); paintCard(card);
      var s = $("#stamp"); s.classList.remove("thud"); void s.offsetWidth; s.classList.add("thud"); blip(160, .12, "triangle", .12);
    };
    $("#card").addEventListener("click", function (e) { if (e.target.closest("input,textarea,.stamp")) return; flip(); });
    $("#flipBtn").onclick = function () { flip(); };
    $("#toFriend").onclick = function () { send(false); };
    $("#toBar").onclick = function () { send(true); };
    if (q.get("to") === "bar" || q.get("wall")) { card.to = ""; $("#to").value = ""; $("#toBar").style.outline = "3px solid #fff"; }
    count(); setWhen("now"); paintChips();
  }
  function count() { var n = card.msg.length; $("#count").textContent = n > 220 ? (300 - n) : ""; }
  function paintChips() {
    document.querySelectorAll("#scenes .chip").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.k === card.scene); b.setAttribute("aria-label", t("scenes")[b.dataset.k] ? T.scenes[b.dataset.k][L()] : b.dataset.k); b.title = b.getAttribute("aria-label"); });
    document.querySelectorAll("#inks .chip").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.k === card.ink); b.setAttribute("aria-label", b.dataset.k); });
    document.querySelectorAll("#whens .chip").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.k === when); b.querySelector("span").textContent = t(b.dataset.k); });
  }
  function setWhen(w) {
    when = w; var n = new Date();
    if (w === "now") at = n;
    else if (w === "tomorrow") { at = new Date(n); at.setDate(at.getDate() + 1); at.setHours(9, 0, 0, 0); }
    else if (w === "week") { at = new Date(n.getTime() + 7 * 864e5); at.setSeconds(0, 0); }
    else if (w === "year") { at = new Date(n); at.setFullYear(at.getFullYear() + 1); at.setSeconds(0, 0); }
    else if (w === "pick") { if (at <= n) { at = new Date(n.getTime() + 3 * 864e5); at.setHours(20, 0, 0, 0); } var pad = function (x) { return String(x).padStart(2, "0"); }; $("#pickAt").value = at.getFullYear() + "-" + pad(at.getMonth() + 1) + "-" + pad(at.getDate()) + "T" + pad(at.getHours()) + ":" + pad(at.getMinutes()); $("#pickAt").min = new Date(n.getTime() - n.getTimezoneOffset() * 6e4).toISOString().slice(0, 16); }
    $("#pickRow").hidden = w !== "pick"; paintWhen(); paintChips();
  }
  function paintWhen() { $("#opens").textContent = when === "now" || at <= new Date() ? "🔓 " + t("rightAway") : "🔒 " + t("sealedTill", { d: fmt(at) }); }

  function send(wall) {
    if (!card.msg.trim()) { flip(true); setTimeout(function () { $("#msg").focus(); }, 500); toast(t("needMsg")); return; }
    if (!card.from.trim()) { flip(true); setTimeout(function () { $("#from").focus(); }, 500); toast(t("needFrom")); return; }
    var btns = [$("#toFriend"), $("#toBar")]; btns.forEach(function (b) { b.disabled = true; });
    var body = { scene: card.scene, stamp: card.stamp, ink: card.ink, msg: card.msg.trim(), from: card.from.trim(), to: wall ? "" : card.to.trim(), place: card.place.trim(), lang: (window.FBL && FBL.get()) || "en", open_at: (when === "now" ? new Date() : at).toISOString(), wall: !!wall };
    api("postcard_send", { p_secret: key(), p_card: body }).then(function (id) {
      var l = sentList(); l.unshift({ id: id, to: body.to, wall: !!wall, open_at: body.open_at, scene: body.scene }); ls("postcard_sent", JSON.stringify(l.slice(0, 60)));
      blip(220, .2, "triangle", .15); setTimeout(function () { blip(880, .12); }, 160);
      card.msg = ""; card.to = ""; $("#msg").value = ""; $("#to").value = ""; save(); count(); paintSent();
      done(id, wall, body);
    }).catch(function (e) {
      var m = String(e && e.message || e);
      toast(/privacy/i.test(m) ? t("privacy") : /rest|too fast|a day/i.test(m) ? t("rest") : t("offline"));
    }).then(function () { btns.forEach(function (b) { b.disabled = false; }); });
  }
  function link(id) { return location.origin + "/nearby/say-hello/?c=" + id; }
  function sheet(html) {
    var s = document.createElement("div"); s.className = "scrim"; s.innerHTML = '<div class="sheet" role="dialog" aria-modal="true">' + html + '<button class="pill x" type="button" aria-label="' + esc(t("close")) + '">✕</button></div>';
    s.onclick = function (e) { if (e.target === s || e.target.closest(".x")) s.remove(); };
    document.body.appendChild(s); return s;
  }
  function done(id, wall, body) {
    var sealed = new Date(body.open_at) > new Date(Date.now() + 6e4);
    if (wall) {
      sheet('<div class="fly">🍸</div><h2>' + esc(t("onWall")) + '</h2>' + (sealed ? '<p class="when">🔒 ' + esc(t("opensOn", { d: fmt(new Date(body.open_at)) })) + '</p>' : "") +
        '<a class="big alt" href="/nearby/next-door/#wall-cards" style="margin-top:12px">' + esc(t("seeBar")) + '</a>');
      return;
    }
    var s = sheet('<div class="fly">✉️</div><h2>' + esc(t("posted")) + '</h2>' + (sealed ? '<p class="when">🔒 ' + esc(t("opensOn", { d: fmt(new Date(body.open_at)) })) + '</p>' : "") +
      '<div class="link"><input readonly value="' + esc(link(id)) + '"><button class="pill" type="button" id="cp">📋 ' + esc(t("copy")) + '</button></div>' +
      (navigator.share ? '<button class="big" type="button" id="sh" style="width:100%">↗ ' + esc(t("share")) + '</button>' : ""));
    var inp = s.querySelector("input"); inp.onclick = function () { inp.select(); };
    s.querySelector("#cp").onclick = function () { copy(link(id), this); };
    var sh = s.querySelector("#sh"); if (sh) sh.onclick = function () { navigator.share({ title: t("shareText"), text: t("shareText"), url: link(id) }).catch(function () {}); };
  }
  function copy(text, btn) {
    var ok = function () { if (btn) btn.textContent = t("copied"); toast(t("copied")); };
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(ok, function () { fallback(); }); else fallback();
    function fallback() { var i = document.createElement("textarea"); i.value = text; document.body.appendChild(i); i.select(); try { document.execCommand("copy"); ok(); } catch (e) {} i.remove(); }
  }
  function paintSent() { var n = sentList().length, e = $("#sentN"); e.hidden = !n; e.textContent = n; }
  $("#sentBtn").onclick = function () {
    var l = sentList(), now = new Date();
    var html = '<h2>📮 ' + esc(t("sent")) + '</h2>' + (l.length ? '<ul class="list">' + l.map(function (c) {
      var o = new Date(c.open_at), sealed = o > now;
      return '<li><span>' + (P.ICON[c.scene] || "✉️") + '</span><a href="' + esc(c.wall ? "/nearby/next-door/#wall-cards" : link(c.id)) + '">' + (c.wall ? "🍸 " + esc(t("bar")) : "→ " + esc(c.to || t("toPh"))) + '</a><small>' + (sealed ? "🔒 " + esc(fmt(o)) : "🔓") + '</small>' + (c.wall ? "" : '<button class="pill" type="button" data-cp="' + esc(c.id) + '" aria-label="' + esc(t("copy")) + '">📋</button>') + '</li>';
    }).join("") + '</ul>' : '<p class="when">' + esc(t("none")) + '</p>');
    var s = sheet(html);
    s.querySelectorAll("[data-cp]").forEach(function (b) { b.onclick = function () { copy(link(b.dataset.cp)); }; });
  };

  /* ---------- reading a card someone sent ---------- */
  var got = null, tick = null;
  function buildRead() {
    $("#write").hidden = true; $("#read").hidden = false;
    ["#place", "#msg", "#to", "#from"].forEach(function (s) { var e = $(s); e.readOnly = true; e.tabIndex = -1; });
    $("#stamp").onclick = null; $("#stamp").tabIndex = -1;
    api("postcard_get", { p_id: reading }, true).then(function (c) {
      if (!c) { $("#clock").textContent = "✉️"; $("#readWhen").textContent = t("lost"); readButtons(false); return; }
      got = c; paintRead();
    }).catch(function () { $("#readWhen").textContent = t("offline"); });
  }
  function paintRead() {
    var c = got; card = { scene: c.scene, stamp: c.stamp, ink: c.ink, place: c.place || "", msg: c.msg || "", to: c.to || "", from: c.from, id: c.id, sent: c.sent };
    paintCard(card);
    $("#place").value = card.place; $("#to").value = card.to; $("#from").value = card.from;
    var l = $(".back .l"); l.innerHTML = '<div class="readmsg"></div>'; l.firstChild.textContent = card.msg;
    var o = new Date(c.open_at), env = $(".env");
    if (!env) {
      env = document.createElement("div"); env.className = "env";
      env.innerHTML = '<button class="stamp" type="button" tabindex="-1"><i></i></button><button class="seal" type="button">✉</button><div class="addr"></div>';
      $("#card").parentNode.style.position = "relative"; $("#card").appendChild(env);
      env.addEventListener("click", function (e) { e.stopPropagation(); });
      env.querySelector(".seal").onclick = openIt;
    }
    var st = P.STAMPS[c.stamp] || P.STAMPS.cat, ei = env.querySelector(".stamp i"); ei.textContent = st[0]; env.querySelector(".stamp").style.setProperty("--sc", st[1]);
    env.querySelector(".addr").innerHTML = (c.to ? "<small>" + esc(t("forYou")) + "</small>" + esc(c.to) : "") + "<small>" + esc(t("fromW")) + " " + esc(c.from) + "</small>";
    if (c.sealed) {
      env.querySelector(".seal").disabled = true; env.querySelector(".seal").setAttribute("aria-label", t("opensOn", { d: fmt(o) }));
      $("#readWhen").innerHTML = esc("🔒 " + t("opensOn", { d: fmt(o) })) + '<br><small style="font-size:17px;opacity:.8">' + esc(t("bell")) + "</small>";
      clearInterval(tick); tick = setInterval(countdown, 1000); countdown(); readButtons(true);
      try { var wl = JSON.parse(ls("postcard_waiting") || "[]"); if (!wl.some(function (x) { return x.id === c.id; })) { wl.unshift({ id: c.id, from: c.from, open_at: c.open_at }); ls("postcard_waiting", JSON.stringify(wl.slice(0, 40))); } } catch (e) {}
    } else {
      clearInterval(tick); $("#clock").textContent = "";
      var seal = env.querySelector(".seal"); seal.disabled = false; seal.classList.add("ready"); seal.setAttribute("aria-label", t("tapSeal")); seal.title = t("tapSeal");
      $("#readWhen").textContent = "🔓 " + t("tapSeal"); readButtons(false);
    }
  }
  function countdown() {
    var ms = new Date(got.open_at) - new Date();
    if (ms <= 0) { clearInterval(tick); $("#clock").textContent = "00:00:00"; setTimeout(function () { api("postcard_get", { p_id: reading }, true).then(function (c) { if (c) { got = c; paintRead(); blip(660, .2, "triangle", .1); } }); }, 1200); return; }
    var s = Math.floor(ms / 1000), dd = Math.floor(s / 86400), hh = Math.floor(s % 86400 / 3600), mm = Math.floor(s % 3600 / 60), ss = s % 60, p2 = function (x) { return String(x).padStart(2, "0"); };
    $("#clock").textContent = (dd ? dd + t("day") + " " : "") + p2(hh) + ":" + p2(mm) + ":" + p2(ss);
  }
  function openIt() {
    if (!got || got.sealed) return;
    var env = $(".env"); swish(); blip(300, .15, "triangle", .12);
    env.classList.add("gone"); setTimeout(function () { env.remove(); flip(false); setTimeout(function () { flip(true); }, 1300); }, 700);
    $("#readWhen").textContent = "";
    try { ls("postcard_waiting", JSON.stringify(JSON.parse(ls("postcard_waiting") || "[]").filter(function (x) { return x.id !== got.id; }))); } catch (e) {}
    try { var box = JSON.parse(ls("postcard_box") || "[]"); if (!box.some(function (b) { return b.id === got.id; })) { box.unshift({ id: got.id, from: got.from, scene: got.scene, open_at: got.open_at }); ls("postcard_box", JSON.stringify(box.slice(0, 60))); } } catch (e) {}
  }
  function readButtons(sealed) {
    var r = $("#readBtns"); r.innerHTML = "";
    function a(label, href, cls) { var e = document.createElement("a"); e.className = cls || "chip t"; e.href = href; e.textContent = label; r.appendChild(e); return e; }
    if (sealed && got) {
      var b = document.createElement("button"); b.type = "button"; b.className = "chip t"; b.textContent = "⏰ " + t("remind"); b.onclick = ics; r.appendChild(b);
    }
    if (got && !sealed) a("✍️ " + t("reply"), "/nearby/say-hello/?to=" + encodeURIComponent(got.from) + "&scene=" + encodeURIComponent(got.scene));
    a("✉️ " + t("own"), "/nearby/say-hello/");
  }
  function ics() {
    var o = new Date(got.open_at), z = function (d) { return d.toISOString().replace(/[-:]/g, "").replace(/\.\d+/, ""); };
    var txt = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//FREE//BUILDER//Postcard//EN", "BEGIN:VEVENT", "UID:" + got.id + "@freebuilder.net", "DTSTAMP:" + z(new Date()), "DTSTART:" + z(o), "DTEND:" + z(new Date(o.getTime() + 9e5)),
      "SUMMARY:" + t("calTitle", { n: got.from }).replace(/[,;]/g, " "), "URL:" + link(got.id), "DESCRIPTION:" + link(got.id), "BEGIN:VALARM", "TRIGGER:PT0M", "ACTION:DISPLAY", "DESCRIPTION:📮", "END:VALARM", "END:VEVENT", "END:VCALENDAR"].join("\r\n");
    var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([txt], { type: "text/calendar" })); a.download = "postcard.ics"; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }

  /* ---------- language ---------- */
  function words() {
    document.documentElement.lang = ["en", "zh-Hans", "zh-Hant", "es", "ca"][L()];
    document.title = (L() ? t("title") : "Postcard") + " — FREE//BUILDER";
    document.querySelectorAll("[data-t]").forEach(function (e) { e.textContent = t(e.getAttribute("data-t")); });
    document.querySelectorAll("[data-tp]").forEach(function (e) { e.placeholder = t(e.getAttribute("data-tp")); });
    $("#stamp").setAttribute("aria-label", t("stamp")); $("#stamp").title = reading ? "" : t("stamp");
    $("#sentBtn").setAttribute("aria-label", t("sent")); $("[data-fbl-btn]").setAttribute("aria-label", t("lang"));
    var lab = $("[data-fbl-label]"); if (lab && window.FBL && FBL.SHORT) lab.textContent = FBL.SHORT[FBL.get() || "en"];
    paintCard(card); if (!reading) { paintChips(); paintWhen(); } else if (got) paintRead();
  }
  window.FBL_GET = function () { return (window.FBL && FBL.get()) || "en"; };
  window.FBL_SET = function (l) { if (window.FBL) FBL.set(l); words(); };

  paintSent();
  if (reading) buildRead(); else buildWrite();
  paintCard(card); words();
})();
</script>
