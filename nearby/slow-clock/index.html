*{box-sizing:border-box}

.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}

.big{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;min-height:58px;border:4px solid #000;background:var(--a);color:#14101e;font:400 22px/1 var(--vt);cursor:pointer;box-shadow:inset -4px -4px 0 rgba(0,0,0,.25),inset 4px 4px 0 rgba(255,255,255,.35),5px 5px 0 #000;text-decoration:none}

.ring{animation:ring .6s steps(4)}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
