<style>

.over .card{width:min(380px,100%);padding:18px 18px 14px;background:#2a1d14;border:3px solid #000;box-shadow:6px 6px 0 #000,inset 0 0 0 2px #5a3a22;text-align:center}

<body>
<h1 class="sr" id="h1">Last Coin</h1>
<div class="cab">
  <div class="marq"><i>●</i> LAST COIN <i>●</i></div>
  <div class="bezel"><iframe id="tv" title="MEMEX-68" src="/nearby/memex.html?cabinet=1"></iframe></div>

  </div>
</div>
<script>
/* Last Coin: the town's games on one old cabinet (MEMEX-68). Pick a tape and the game opens in town; come back to the
   cabinet and it's GAME OVER, with the next level waiting in real life: chosen by your own clock, never scored. */
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  function li() { return ({ en: 0, zh: 1, "zh-Hant": 2, es: 3, ca: 4 })[(window.FBL && FBL.get && FBL.get()) || "en"] || 0; }
  function t(a) { return a[li()] || a[0]; }
  var W = {
    lv: ["NEXT LEVEL · OUT THE DOOR", "下一关 · 在门外", "下一關 · 在門外", "SIGUIENTE NIVEL · AFUERA", "SEGÜENT NIVELL · A FORA"],
    done: ["✓ Did it", "✓ 做到了", "✓ 做到了", "✓ Hecho", "✓ Fet"], later: ["Later", "等会儿", "等一下", "Luego", "Després"],
    thanks: ["🪙 A coin for the next round, whenever.", "🪙 下一局的硬币，随时来拿。", "🪙 下一局的硬幣，隨時來拿。", "🪙 Una moneda para la próxima, cuando quieras.", "🪙 Una moneda per a la propera, quan vulguis."]
  };
  /* the next level, by your real hour: something small, off the screen, with or for someone if possible */
  var LV = {
    morning: [["🪟", "Open a window and take ten slow breaths.", "打开窗，慢慢呼吸十次。", "打開窗，慢慢呼吸十次。", "Abre una ventana y respira despacio diez veces.", "Obre una finestra i respira a poc a poc deu vegades."],
              ["☕", "Make a drink for someone else first.", "先给别人泡一杯。", "先給別人泡一杯。", "Prepárale algo de beber a otra persona primero.", "Prepara-li alguna cosa per beure a algú altre primer."],
              ["🚶", "Walk around the block. No phone in your hand.", "绕着街区走一圈，手里不拿手机。", "繞著街區走一圈，手裡不拿手機。", "Da una vuelta a la manzana. Sin el móvil en la mano.", "Fes una volta a l'illa. Sense el mòbil a la mà."]],
    day: [["☁️", "Go outside and look up for one whole minute.", "出门，抬头看一整分钟。", "出門，抬頭看一整分鐘。", "Sal y mira hacia arriba un minuto entero.", "Surt i mira amunt un minut sencer."],
          ["📞", "Call someone you haven't heard in a while.", "给一个很久没联系的人打个电话。", "給一個很久沒聯絡的人打個電話。", "Llama a alguien con quien no hablas hace tiempo.", "Truca a algú amb qui no parles fa temps."],
          ["🍎", "Eat something slowly, away from the screen.", "离开屏幕，慢慢吃点东西。", "離開螢幕，慢慢吃點東西。", "Come algo despacio, lejos de la pantalla.", "Menja alguna cosa a poc a poc, lluny de la pantalla."],
          ["👋", "Say hello to a neighbour, or the person at the shop.", "跟邻居或者店里的人打个招呼。", "跟鄰居或店裡的人打個招呼。", "Saluda a un vecino, o a quien te atienda en la tienda.", "Saluda un veí, o qui t'atengui a la botiga."]],
    evening: [["🍳", "Cook one thing, and share it.", "做一道菜，分给别人。", "做一道菜，分給別人。", "Cocina una cosa y compártela.", "Cuina una cosa i comparteix-la."],
              ["📞", "Call someone and ask how their day really was.", "打给一个人，问问他今天到底过得怎样。", "打給一個人，問問他今天到底過得怎樣。", "Llama a alguien y pregúntale cómo le ha ido de verdad.", "Truca a algú i pregunta-li com li ha anat de debò."],
              ["🌇", "Go out and watch the light change for five minutes.", "出去看五分钟光线怎么变。", "出去看五分鐘光線怎麼變。", "Sal y mira cómo cambia la luz cinco minutos.", "Surt i mira com canvia la llum cinc minuts."]],
    night: [["🌙", "Look out of the window and find the moon, or one star.", "看看窗外，找到月亮，或者一颗星。", "看看窗外，找到月亮，或者一顆星。", "Mira por la ventana y busca la luna, o una estrella.", "Mira per la finestra i busca la lluna, o un estel."],
            ["✍️", "Write one line on paper about today.", "在纸上写一句关于今天的话。", "在紙上寫一句關於今天的話。", "Escribe en papel una línea sobre hoy.", "Escriu en paper una línia sobre avui."],
            ["🛏️", "Put the phone in another room. Sleep.", "把手机放到另一个房间。睡吧。", "把手機放到另一個房間。睡吧。", "Deja el móvil en otra habitación. A dormir.", "Deixa el mòbil en una altra habitació. A dormir."]]
  };
  function part() { var h = new Date().getHours(); return h < 5 ? "night" : h < 11 ? "morning" : h < 17 ? "day" : h < 22 ? "evening" : "night"; }
  var KEY = "fb_arcade_out";
  function out() { try { return JSON.parse(sessionStorage.getItem(KEY) || "null"); } catch (e) { return null; } }
  function gameOver() {
    var o = out(); if (!o) return;
    try { sessionStorage.removeItem(KEY); } catch (e) {}
    var list = LV[part()], c = list[(Math.random() * list.length) | 0];
    $("ovL").textContent = t(W.lv); $("ovC").innerHTML = "<b></b><span></span>"; $("ovC").firstChild.textContent = c[0]; $("ovC").lastChild.textContent = c[1 + li()] || c[1];
    $("done").textContent = t(W.done); $("later").textContent = t(W.later); $("over").hidden = false;
    try { $("done").focus({ preventScroll: true }); } catch (e) {}
  }
  $("done").onclick = function () { $("over").hidden = true; try { if (window.FBG && FBG.note) FBG.note({ icon: "🪙", text: t(W.thanks), ms: 5000 }); } catch (e) {} };
  $("later").onclick = function () { $("over").hidden = true; };
  /* the cabinet hands each tape to the town instead of leaving it */
  window.FBArcade = {
    play: function (url) {
      try { sessionStorage.setItem(KEY, JSON.stringify({ t: Date.now(), url: url })); } catch (e) {}
      try { if (window.parent !== window && window.parent.FBShell) { window.parent.FBShell.open(url); return; } } catch (e) {}
      location.href = url;
    }
  };
  addEventListener("fbback", gameOver);
  addEventListener("pageshow", function () { setTimeout(gameOver, 400); });
  function words() { document.documentElement.lang = ["en", "zh-Hans", "zh-Hant", "es", "ca"][li()]; }
  window.FBL_GET = function () { return (window.FBL && FBL.get()) || "en"; };
  window.FBL_SET = function (l) { if (window.FBL) FBL.set(l); words(); };
  words();
})();
</script>
