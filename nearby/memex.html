àgines, demana un llibre i passa'l de mà en mà. Els gats s'escapen del bar."], "SLEEPER CAR DAYDREAM": ["卧铺车厢里的白日梦", "臥鋪車廂裡的白日夢", "ENSOÑACIÓN EN COCHE CAMA", "SOMNI DESPERT EN COTXE LLIT"], "Board a night sleeper and just look out. Hours pass, the weather drifts, tunnels open onto new landscapes. Write on the fogged glass, and share your cabin so friends ride the same window, live.": ["登上夜行卧铺，只管望向窗外。时辰流转，天气变幻，穿过隧道便是新的风景。在起雾的玻璃上写字，把包厢分享出去，朋友们就能实时同看这一扇窗。", "登上夜行臥舖，只管望向窗外。時辰流轉，天氣變幻，穿過隧道便是新的風景。在起霧的玻璃上寫字，把包廂分享出去，朋友們就能即時同看這一扇窗。", "Sube a un tren nocturno y limítate a mirar. Pasan las horas, cambia el tiempo, los túneles se abren a paisajes nuevos. Escribe en el cristal empañado y comparte tu compartimento para que tus amigos vean la misma ventana, en directo.", "Puja a un tren nocturn i limita't a mirar. Passen les hores, canvia el temps, els túnels s'obren a paisatges nous. Escriu al vidre entelat i comparteix el compartiment perquè els amics vegin la mateixa finestra, en directe."], "GOLDEN JOINERY, SLOW CRAFT": ["金缮：慢工细活", "金繕：慢工細活", "UNIÓN DORADA, OFICIO LENTO", "UNIÓ DAURADA, OFICI LENT"], "Pick a broken bowl and mend it the old way. Fit the shards, seal the cracks with lacquer, then dust the seams with gold until the break becomes the best part. Finished pieces rest on your tokonoma shelf.": ["挑一只碎碗，用老法子修好它。拼合碎片，以漆封缝，再在接缝上撒金，直到裂痕成了最美的部分。修好的器物陈列在你的床之间。", "挑一隻碎碗，用老法子修好它。拼合碎片，以漆封縫，再在接縫上撒金，直到裂痕成了最美的部分。修好的器物陳列在你的床之間。", "Elige un cuenco roto y repáralo a la antigua. Encaja los fragmentos, sella las grietas con laca y espolvorea oro en las juntas hasta que la rotura sea lo más bello. Las piezas terminadas descansan en tu estante tokonoma.", "Tria un bol trencat i adoba'l a l'antiga. Encaixa els fragments, segella les esquerdes amb laca i empolsina d'or les juntes fins que el trencament sigui el més bonic. Les peces acabades reposen al teu prestatge tokonoma."], "CLOUD WATCHING FOR A BLANK MIND": ["看云，放空", "看雲，放空", "MIRAR NUBES PARA VACIAR LA MENTE", "MIRAR NÚVOLS PER BUIDAR LA MENT"], "Lie back under an open sky that keeps your own time. Draw on it and watch your scribble puff into a cloud and drift off, hold still to breathe, double-tap and the clouds take a shape.": ["躺在一片跟着你时间走的天空下。在天上随手画，看涂鸦化成一朵云飘走；静静按住，跟着呼吸；双击，云就聚成一个形状。", "躺在一片跟著你時間走的天空下。在天上隨手畫，看塗鴉化成一朵雲飄走；靜靜按住，跟著呼吸；雙擊，雲就聚成一個形狀。", "Túmbate bajo un cielo que sigue tu propia hora. Dibuja en él y mira cómo tu garabato se vuelve nube y se aleja; mantén el dedo quieto para respirar; toca dos veces y las nubes toman forma.", "Estira't sota un cel que segueix la teva pròpia hora. Dibuixa-hi i mira com el gargot es torna núvol i se'n va; mantén el dit quiet per respirar; toca dues vegades i els núvols prenen forma."], "LIGHT-UP TUNES, ONE SHARED RECORD PLAYER": ["点亮的小曲，一台共享唱机", "點亮的小曲，一台共享唱機", "MELODÍAS DE LUCES, UN TOCADISCOS COMPARTIDO", "MELODIES DE LLUMS, UN TOCADISCOS COMPARTIT"], "Light up a few bulbs and you have a tune. Press it into a record, sign it, then drop a coin: it plays in Next Door and the book corner at the same second, with your name on it.": ["点亮几颗灯泡，就有了一段旋律。把它压成唱片、签上名，再投一枚硬币：它会在同一秒钟于 “隔壁”和书角响起，署着你的名字。", "點亮幾顆燈泡，就有了一段旋律。把它壓成唱片、簽上名，再投一枚硬幣：它會在同一秒鐘於 “隔壁”和書角響起，署著你的名字。", "Enciende unas bombillas y ya tienes una melodía. Grábala en un disco, fírmala y echa una moneda: sonará a la vez en Al Lado y en el rincón de libros, con tu nombre.", "Encén unes bombetes i ja tens una melodia. Grava-la en un disc, signa-la i tira una moneda: sonarà alhora a Al Costat i al racó de llibres, amb el teu nom."], "NEW": ["新", "新", "NUEVO", "NOU"], "Board a night sleeper and just look out. Stations from Kyoto to Sitges roll by, each in its own style and announced in its own language. Write on the fogged glass, and share your cabin so friends ride the same window, live.": ["登上夜行卧铺，只管望向窗外。从京都到锡切斯的车站一一驶过，各有各的模样，并用当地语言报站。在起雾的玻璃上写字，把包厢分享出去，朋友们就能实时同看这一扇窗。", "登上夜行臥鋪，只管望向窗外。從京都到錫切斯的車站一一駛過，各有各的模樣，並用當地語言報站。在起霧的玻璃上寫字，把包廂分享出去，朋友們就能即時同看這一扇窗。", "Sube a un tren nocturno y limítate a mirar. Pasan estaciones de Kioto a Sitges, cada una con su estilo y anunciada en su idioma. Escribe en el cristal empañado y comparte tu compartimento para que tus amigos vean la misma ventana, en directo.", "Puja a un tren nocturn i limita't a mirar. Passen estacions de Kyoto a Sitges, cadascuna amb el seu estil i anunciada en la seva llengua. Escriu al vidre entelat i comparteix el compartiment perquè els amics vegin la mateixa finestra, en directe."], "A tiny hutong counter: coffee by day, cocktails by night. Chat with Wei, mix a drink, pet the cats, drop a coin in the jukebox and leave a note for the next guest.": ["胡同里的小吧台：白天咖啡，晚上鸡尾酒。和 Wei 聊天、调一杯酒、摸摸猫、往点唱机里投枚硬币，再给下一位客人留张便条。", "胡同裡的小吧檯：白天咖啡，晚上雞尾酒。和 Wei 聊天、調一杯酒、摸摸貓、往點唱機裡投枚硬幣，再給下一位客人留張便條。", "Una barra diminuta en un hutong: café de día, cócteles de noche. Charla con Wei, prepara una copa, acaricia a los gatos, echa una moneda en la gramola y deja una nota al siguiente cliente.", "Una barra petita en un hutong: cafè de dia, còctels de nit. Xerra amb en Wei, prepara una copa, acaricia els gats, tira una moneda a la gramola i deixa una nota al proper client."], "Pick a broken bowl and mend it the old way. Fit the shards, seal the cracks with lacquer, then dust the seams with gold. Sign the finished piece into a book every visitor can leaf through.": ["挑一只碎碗，用老法子修好它。拼合碎片，以漆封缝，再在接缝上撒金。最后署上名字，把作品放进一本所有访客都能翻看的书里。", "挑一隻碎碗，用老法子修好它。拼合碎片，以漆封縫，再在接縫上撒金。最後署上名字，把作品放進一本所有訪客都能翻看的書裡。", "Elige un cuenco roto y repáralo a la antigua. Encaja los fragmentos, sella las grietas con laca y espolvorea oro en las juntas. Firma la pieza terminada en un libro que cualquier visitante puede hojear.", "Tria un bol trencat i adoba'l a l'antiga. Encaixa els fragments, segella les esquerdes amb laca i empolsina d'or les juntes. Signa la peça acabada en un llibre que qualsevol visitant pot fullejar."], "Read the wall, plan your hands, then commit. Ten real crags from Montserrat to El Capitan, {#} to {#}d. Clip every bolt, chalk at the rests, and tie in with a friend to swap leads up a multi-pitch.": ["先读岩壁，规划手序，然后果断出发。从蒙特塞拉特到酋长岩的十个真实岩场，难度 {#} 到 {#}d。每个挂片都要挂，在休息点擦粉，还能和朋友结成绳队，轮流先锋攀多段路线。", "先讀岩壁，規劃手序，然後果斷出發。從蒙特塞拉特到酋長岩的十個真實岩場，難度 {#} 到 {#}d。每個掛片都要掛，在休息點擦粉，還能和朋友結成繩隊，輪流先鋒攀多段路線。", "Lee la pared, planifica tus manos y comprométete. Diez escuelas reales de Montserrat a El Capitan, de {#} a {#}d. Chapa cada chapa, ponte magnesio en los reposos y encórdate con un amigo para turnaros de primero en una vía de varios largos.", "Llegeix la paret, planifica les mans i compromet-t'hi. Deu escoles reals de Montserrat a El Capitan, de {#} a {#}d. Xapa cada xapa, posa't magnesi als reposos i encorda't amb un amic per alternar-vos de primer en una via de diversos llargs."], "A tiny hutong counter: coffee by day, cocktails by night. Chat with Wei, pet the cats, drop a coin in the jukebox and leave a note for the next guest. If Wei's out, sneak behind the bar and mix your own.": ["胡同里的小吧台：白天咖啡，晚上鸡尾酒。和 Wei 聊天、摸摸猫、往点唱机里投枚硬币，再给下一位客人留张便条。Wei 不在的时候，就溜进吧台自己调一杯。", "胡同裡的小吧檯：白天咖啡，晚上雞尾酒。和 Wei 聊天、摸摸貓、往點唱機裡投枚硬幣，再給下一位客人留張便條。Wei 不在的時候，就溜進吧檯自己調一杯。", "Una barra diminuta en un hutong: café de día, cócteles de noche. Charla con Wei, acaricia a los gatos, echa una moneda en la gramola y deja una nota al siguiente cliente. Si Wei no está, cuélate tras la barra y prepárate tu copa.", "Una barra petita en un hutong: cafè de dia, còctels de nit. Xerra amb en Wei, acaricia els gats, posa una moneda a la gramola i deixa una nota al proper client. Si en Wei no hi és, esmunyeix-te darrere la barra i fes-te la teva copa."], "SLOW MAIL WITH A SEALED DATE": ["寄出前先封存的慢邮件", "寄出前先封存的慢郵件", "CORREO LENTO CON FECHA SELLADA", "CORREU LENT AMB DATA SEGELLADA"], "Pick a picture and a stamp, write on the back, and seal it until the day you choose. Send the link to a friend, who can't open it a minute early, or hang it on the wall in Next Door.": ["选一幅图、一张邮票，在背面写几句话，封存到你选的那一天。把链接发给朋友，早一分钟都拆不开；或者挂到 “隔壁”的墙上。", "選一幅圖、一張郵票，在背面寫幾句話，封存到你選的那一天。把連結發給朋友，早一分鐘都拆不開；或者掛到 “隔壁”的牆上。", "Elige una imagen y un sello, escribe por detrás y ciérrala hasta el día que quieras. Envía el enlace a un amigo, que no podrá abrirla ni un minuto antes, o cuélgala en la pared de Al Lado.", "Tria una imatge i un segell, escriu pel darrere i tanca-la fins al dia que vulguis. Envia l'enllaç a un amic, que no la podrà obrir ni un minut abans, o penja-la a la paret d'Al Costat."], "TWO CATS, UP CLOSE": ["近距离的两只猫", "近距離的兩隻貓", "DOS GATOS, DE CERCA", "DOS GATS, DE PROP"], "The little room where Miso and Yuzu live. Stroke them till they purr, wave a feather, shake the treat tin, dim the lamp, and take photos for their album. The closer you get, the more of their story opens.": ["味噌和柚子住的小房间。摸到它们打呼噜，晃晃逗猫棒，摇摇零食罐，调暗台灯，再给它们的相册拍几张照片。越亲近，它们的故事就解锁得越多。", "味噌和柚子住的小房間。摸到它們打呼嚕，晃晃逗貓棒，搖搖零食罐，調暗檯燈，再給它們的相簿拍幾張照片。越親近，它們的故事就解鎖得越多。", "La habitación donde viven Miso y Yuzu. Acarícialos hasta que ronroneen, mueve una pluma, agita la lata de premios, baja la luz y hazles fotos para su álbum. Cuanto más te acerques, más de su historia se abre.", "L'habitació on viuen Miso i Yuzu. Acarona'ls fins que facin el ronc, mou una ploma, sacseja la llauna de premis, abaixa la llum i fes-los fotos per a l'àlbum. Com més a prop, més de la seva història s'obre."], "A DOG'S HOME, AND REAL ADOPTIONS": ["一只狗的家，和真实的领养", "一隻狗的家，和真實的領養", "EL HOGAR DE UN PERRO Y ADOPCIONES REALES", "LA LLAR D'UN GOS I ADOPCIONS REALS"], "Mantou the dog lives here, by the meadow. Throw his ball, follow his story to the station and back, and help real animals find a home: put up a notice for one you're caring for, or ask to adopt.": ["小狗馒头住在草甸边的庇护所。给它扔球，跟着它的故事去火车站再回来，也帮真实的动物找个家：为你照顾的动物贴一张启事，或者申请领养。", "小狗饅頭住在草甸邊的庇護所。給它扔球，跟著它的故事去火車站再回來，也幫真實的動物找個家：為你照顧的動物貼一張啟事，或者申請領養。", "Mantou, el perro, vive aquí, junto al prado. Lánzale la pelota, sigue su historia hasta la estación y de vuelta, y ayuda a animales reales a encontrar hogar: publica un anuncio de uno que cuides o pide adoptar.", "En Mantou, el gos, viu aquí, vora el prat. Llança-li la pilota, segueix la seva història fins a l'estació i de tornada, i ajuda animals reals a trobar llar: publica un anunci d'un que cuidis o demana adoptar."], "ONE ENDLESS GARDEN, PLANTED TOGETHER": ["一座大家一起种的无尽花园", "一座大家一起種的無盡花園", "UN JARDÍN SIN FIN, PLANTADO ENTRE TODOS", "UN JARDÍ SENSE FI, PLANTAT ENTRE TOTS"], "Pick a seed and plant it next to someone else's: cherry trees, sunflowers, peonies, ponds and stone lanterns. Everything grows over days, faster when people water it, and the garden keeps spreading.": ["选一颗种子，种在别人的植物旁边：樱花树、向日葵、牡丹、池塘和石灯笼。一切都会随着日子慢慢长大，有人浇水就长得更快，花园也一直向外蔓延。", "選一顆種子，種在別人的植物旁邊：櫻花樹、向日葵、牡丹、池塘和石燈籠。一切都會隨著日子慢慢長大，有人澆水就長得更快，花園也一直向外蔓延。", "Elige una semilla y plántala junto a la de otra persona: cerezos, girasoles, peonías, estanques y faroles de piedra. Todo crece con los días, más rápido si alguien lo riega, y el jardín no deja de extenderse.", "Tria una llavor i planta-la al costat de la d'una altra persona: cirerers, gira-sols, peònies, basses i fanals de pedra. Tot creix amb els dies, més de pressa si algú ho rega, i el jardí no para d'estendre's."], "BREW A BEER, SHIP IT TO THE BAR": ["酿一桶啤酒，送去酒吧", "釀一桶啤酒，送去酒吧", "ELABORA UNA CERVEZA Y LLÉVALA AL BAR", "ELABORA UNA CERVESA I PORTA-LA AL BAR"], "Pick the malt, hops and yeast, add a twist like osmanthus or Sichuan pepper, and design the can. Ship it to Next Door and Late Light, where everyone can order it and raise a glass.": ["选麦芽、啤酒花和酵母，加一点桂花或花椒之类的特别风味，再设计罐子。把它送去 “隔壁”和夜灯，大家都能点上一杯，举杯同饮。", "選麥芽、啤酒花和酵母，加一點桂花或花椒之類的特別風味，再設計罐子。把它送去 “隔壁”和夜燈，大家都能點上一杯，舉杯同飲。", "Elige la malta, el lúpulo y la levadura, añade un toque como osmanto o pimienta de Sichuan y diseña la lata. Envíala a Al Lado y a Luz Tardía, donde cualquiera puede pedirla y brindar.", "Tria la malta, el llúpol i el llevat, afegeix-hi un toc com osmant o pebre de Sichuan i dissenya la llauna. Envia-la a Al Costat i a Llum Tardana, on tothom la pot demanar i brindar."], "A TABLE FOR TWO, MILES APART": ["相隔千里的双人桌", "相隔千里的雙人桌", "UNA MESA PARA DOS, A KILÓMETROS", "UNA TAULA PER A DOS, A QUILÒMETRES"], "A candlelit restaurant by Mirror Lake for two people who live apart. Sit down from anywhere and your candles light up together; cook the same dinner step by step, raise a glass, draw table-talk cards and slide a note across on a napkin.": ["镜湖边一家点着蜡烛的小餐馆，给相隔两地的两个人。无论身在何处都能入座，两支蜡烛一起亮起；一步一步做同一顿晚饭，举杯，抽餐桌话题卡，再把写在餐巾上的话推到对面。", "鏡湖邊一家點著蠟燭的小餐館，給相隔兩地的兩個人。無論身在何處都能入座，兩支蠟燭一起亮起；一步一步做同一頓晚飯，舉杯，抽餐桌話題卡，再把寫在餐巾上的話推到對面。", "Un restaurante a la luz de las velas junto al Lago Espejo para dos personas que viven lejos. Sentaos desde donde estéis y vuestras velas se encienden juntas; cocinad la misma cena paso a paso, brindad, sacad cartas de conversación y pasad una nota en una servilleta.", "Un restaurant a la llum de les espelmes vora el Llac Mirall per a dues persones que viuen lluny. Seieu des d'on sigueu i les vostres espelmes s'encenen juntes; cuineu el mateix sopar pas a pas, brindeu, traieu cartes de conversa i passeu una nota en un tovalló."], "Pick the malt, hops and yeast, add a twist like osmanthus or Sichuan pepper, and design the can. Send it to Next Door and Late Light, where everyone can order it and raise a glass.": ["选麦芽、啤酒花和酵母，加一点桂花或花椒之类的特别风味，再设计罐子。把它送去“隔壁”和“夜灯”，大家都能点上一杯，举杯同饮。", "選麥芽、啤酒花和酵母，加一點桂花或花椒之類的特別風味，再設計罐子。把它送去“隔壁”和“夜燈”，大家都能點上一杯，舉杯同飲。", "Elige la malta, el lúpulo y la levadura, añade un toque como osmanto o pimienta de Sichuan y diseña la lata. Envíala a Al Lado y a Luz Tardía, donde cualquiera puede pedirla y brindar.", "Tria la malta, el llúpol i el llevat, afegeix-hi un toc com osmant o pebre de Sichuan i dissenya la llauna. Envia-la a Al Costat i a Llum Tardana, on tothom la pot demanar i brindar."], "Light up a few bulbs and you have a tune. Press it into a record, sign it, then drop a coin: it plays Next Door and in Borrowed Pages at the same second, with your name on it.": ["点亮几颗灯泡，就有了一段旋律。把它压成唱片，签上名，再投一枚硬币：它会在“隔壁”和“借来的书”同一秒响起，署着你的名字。", "點亮幾顆燈泡，就有了一段旋律。把它壓成唱片，簽上名，再投一枚硬幣：它會在“隔壁”和“借來的書”同一秒響起，署著你的名字。", "Enciende unas bombillas y ya tienes una melodía. Grábala en un disco, fírmala y echa una moneda: suena en Al Lado y en Páginas Prestadas en el mismo segundo, con tu nombre.", "Encén unes bombetes i ja tens una melodia. Grava-la en un disc, signa-la i tira una moneda: sona a Al Costat i a Pàgines Manllevades al mateix segon, amb el teu nom."], "Pick a picture and a stamp, write on the back, and seal it until the day you choose. Send the link to a friend, who can't open it a minute early, or hang it on the Wall at Next Door.": ["选一张图和一枚邮票，在背面写几句，封存到你选的那一天。把链接发给朋友，早一分钟都打不开；或者把它挂在“隔壁”的墙上。", "選一張圖和一枚郵票，在背面寫幾句，封存到你選的那一天。把連結發給朋友，早一分鐘都打不開；或者把它掛在“隔壁”的牆上。", "Elige una imagen y un sello, escribe detrás y ciérrala hasta el día que elijas. Manda el enlace a alguien, que no podrá abrirla ni un minuto antes, o cuélgala en el muro de Al Lado.", "Tria una imatge i un segell, escriu al darrere i tanca-la fins al dia que triïs. Envia l'enllaç a algú, que no la podrà obrir ni un minut abans, o penja-la al mur d'Al Costat."], "A tiny hutong counter: coffee by day, cocktails by night. Wei knows everyone and everywhere in town: ask him where to go, read the postcards on the Wall, pet the cats. If he's out, sneak behind the bar and mix your own.": ["胡同里的小吧台：白天咖啡，晚上鸡尾酒。镇上的人和地方 Wei 都熟：问问他该去哪儿，看看墙上的明信片，摸摸猫。他不在的话，溜进吧台自己调一杯。", "胡同裡的小吧檯：白天咖啡，晚上雞尾酒。鎮上的人和地方 Wei 都熟：問問他該去哪兒，看看牆上的明信片，摸摸貓。他不在的話，溜進吧檯自己調一杯。", "Una barra diminuta en un hutong: café de día, cócteles de noche. Wei conoce a todo el mundo y cada rincón del pueblo: pregúntale adónde ir, lee las postales del muro, acaricia a los gatos. Si no está, cuélate tras la barra y prepárate algo.", "Una barra petitíssima en un hutong: cafè de dia, còctels de nit. En Wei coneix tothom i cada racó del poble: pregunta-li on anar, llegeix les postals del mur, acaricia els gats. Si no hi és, cola't darrere la barra i prepara't alguna cosa."], "A four-room book house next door to the bar. Wander the attic, parlour, garden and basement, read the notes tucked into books, borrow one and pass it on by hand. The cats come over from the bar.": ["就在酒吧隔壁的四间书屋。逛逛阁楼、客厅、花园和地下室，读读夹在书里的纸条，借一本，再亲手传下去。猫会从酒吧那边溜过来。", "就在酒吧隔壁的四間書屋。逛逛閣樓、客廳、花園和地下室，讀讀夾在書裡的紙條，借一本，再親手傳下去。貓會從酒吧那邊溜過來。", "Una casa de libros de cuatro estancias junto al bar. Recorre el desván, el salón, el jardín y el sótano, lee las notas dentro de los libros, pide uno prestado y pásalo en mano. Los gatos vienen desde el bar.", "Una casa de llibres de quatre estances al costat del bar. Recorre les golfes, el saló, el jardí i el soterrani, llegeix les notes dins dels llibres, manlleva'n un i passa'l de mà en mà. Els gats vénen des del bar."], "A CABIN WITH A VIEW, AND NOTHING TO DO": ["一间看得见风景的小屋，什么都不用做", "一間看得見風景的小屋，什麼都不用做", "UNA CABAÑA CON VISTAS, Y NADA QUE HACER", "UNA CABANA AMB VISTES, I RES A FER"], "A small cabin on the high pasture with one big window. Clouds drift, cows wander, the weather does what it does. There is nothing to win and nothing to finish. Stay as long as you like.": ["高山牧场上的小屋，有一扇大窗。云在飘，牛在走，天气想怎样就怎样。没有要赢的，也没有要完成的。想待多久就待多久。", "高山牧場上的小屋，有一扇大窗。雲在飄，牛在走，天氣想怎樣就怎樣。沒有要贏的，也沒有要完成的。想待多久就待多久。", "Una cabaña pequeña en el pasto alto con una gran ventana. Las nubes pasan, las vacas pasean, el tiempo hace lo suyo. No hay nada que ganar ni que terminar. Quédate el tiempo que quieras.", "Una cabana petita a la pastura alta amb un finestral. Els núvols passen, les vaques passegen, el temps fa la seva. No hi ha res a guanyar ni a acabar. Queda't tant com vulguis."], "Light one bulb per beat and you have a tune; tap the drum for a groove. Press it into a record and sign it: it plays Next Door, in Borrowed Pages and here at the same second, with your name on it.": ["每一拍点亮一个灯泡，就有了一段旋律；点一下鼓，换个节奏。压成唱片、签上名字：它会在隔壁、借来的书和这里同一秒响起，署着你的名字。", "每一拍點亮一個燈泡，就有了一段旋律；點一下鼓，換個節奏。壓成唱片、簽上名字：它會在隔壁、借來的書和這裡同一秒響起，署著你的名字。", "Enciende una luz por pulso y ya tienes melodía; toca el tambor para el ritmo. Grábala en un disco y fírmala: suena en Al Lado, en Páginas Prestadas y aquí en el mismo segundo, con tu nombre.", "Encén un llum per pols i ja tens melodia; toca el tambor per al ritme. Grava-la en un disc i signa-la: sona a Al Costat, a Pàgines Manllevades i aquí al mateix segon, amb el teu nom."], "Hit the records as they cross the line, scratch through the bars and drop the bass when the hype is full. Tour city to city, each with its own twist. Better with a friend: send a link, take a deck each.": ["唱片越过线时击中它，遇到条纹就搓碟，热度满了就引爆低音。逐城巡演，每座城市都有新花样。和朋友一起更好玩：发个链接，一人一台唱机。", "唱片越過線時擊中它，遇到條紋就搓碟，熱度滿了就引爆低音。逐城巡演，每座城市都有新花樣。和朋友一起更好玩：發個連結，一人一臺唱機。", "Toca los discos al cruzar la línea, haz scratch en las barras y suelta el bajo cuando el hype esté lleno. Gira de ciudad en ciudad, cada una con su giro. Mejor con un amigo: mándale un enlace y cada uno a su plato.", "Toca els discos quan creuen la línia, fes scratch a les barres i deixa anar el baix quan el hype sigui ple. Gira de ciutat en ciutat, cadascuna amb el seu gir. Millor amb un amic: envia-li un enllaç i cadascú al seu plat."], "ROW OUT, GATHER LANTERNS, LET THEM GO": ["划船出海，收灯笼，再放它们走", "划船出海，收燈籠，再放它們走", "REMA, RECOGE FAROLILLOS, SUÉLTALOS", "REMA, RECULL FANALETS, DEIXA'LS ANAR"], "Row a little boat around the cove. Lanterns drift on the water; row through one and it follows you on a string. Drop anchor and they rise into the sky. With a friend, their boat rows beside yours.": ["划一条小船在海湾里转转。灯笼漂在水上，划过一只它就用绳子跟着你。抛下锚，它们就升上天空。和朋友一起时，朋友的船就划在你旁边。", "劃一條小船在海灣裡轉轉。燈籠漂在水上，劃過一隻它就用繩子跟著你。拋下錨，它們就升上天空。和朋友一起時，朋友的船就劃在你旁邊。", "Rema en una barquita por la cala. Los farolillos flotan en el agua; pasa por uno y te sigue atado a una cuerda. Echa el ancla y suben al cielo. Con un amigo, su barca rema junto a la tuya.", "Rema amb una barqueta per la cala. Els fanalets suren a l'aigua; passa per un i et segueix lligat a una corda. Tira l'àncora i pugen al cel. Amb un amic, la seva barca rema al costat de la teva."], "FRESH SNOW, YOUR OWN LINE": ["新雪，自己的线", "新雪，自己的線", "NIEVE FRESCA, TU PROPIA LÍNEA", "NEU FRESCA, LA TEVA PRÒPIA LÍNIA"], "Lean left and right and carve down a long, quiet slope. Brush a pine and you tumble into the powder, then get up and go on. No metres, no best. Mantou sometimes runs alongside; a friend skis the same slope.": ["向左向右倾斜，在一条安静的长坡上划出弧线。碰到松树就摔进粉雪里，再爬起来继续。不计米数，没有最好成绩。馒头有时会在旁边跑；朋友也在同一面坡上滑。", "向左向右傾斜，在一條安靜的長坡上劃出弧線。碰到松樹就摔進粉雪裡，再爬起來繼續。不計米數，沒有最好成績。饅頭有時會在旁邊跑；朋友也在同一面坡上滑。", "Inclínate a izquierda y derecha y traza curvas por una ladera larga y tranquila. Roza un pino y caes en la nieve polvo; te levantas y sigues. Sin metros, sin récords. Mantou a veces corre a tu lado; un amigo esquía la misma ladera.", "Inclina't a esquerra i dreta i traça corbes per un pendent llarg i tranquil. Frega un pi i caus a la neu pols; t'aixeques i continues. Sense metres, sense rècords. En Mantou de vegades corre al teu costat; un amic esquia el mateix pendent."], "FISHING FROM THE DOCK": ["在栈桥上钓鱼", "在棧橋上釣魚", "PESCAR DESDE EL MUELLE", "PESCAR DES DEL MOLL"], "Cast from a wooden dock, wait for the float to dip, and reel in. Then let the fish go, give it to the cat on the dock, or send it to Next Door, where Wei cooks it. A friend can sit beside you.": ["从木栈桥上抛竿，等浮漂一沉，就收线。然后把鱼放回湖里、送给栈桥上的猫，或者送去“隔壁”让 Wei 下厨。朋友可以坐在你旁边。", "從木棧橋上拋竿，等浮漂一沉，就收線。然後把魚放回湖裡、送給棧橋上的貓，或者送去“隔壁”讓 Wei 下廚。朋友可以坐在你旁邊。", "Lanza desde un muelle de madera, espera a que el flotador se hunda y recoge. Luego suelta el pez, dáselo al gato del muelle o mándalo a Al Lado, donde Wei lo cocina. Un amigo puede sentarse a tu lado.", "Llança des d'un moll de fusta, espera que el suro s'enfonsi i recull. Després deixa anar el peix, dona'l al gat del moll o envia'l a Al Costat, on en Wei el cuina. Un amic pot seure al teu costat."], "A WALK UNDER THE PINES": ["在松树下散步", "在松樹下散步", "UN PASEO BAJO LOS PINOS", "UNA PASSEJADA SOTA ELS PINS"], "Hold a side of the screen and walk a path that never ends. Stone lanterns glow as you pass them at dusk; mist, fireflies, and sometimes Mantou or a cat falls in step beside you. A friend walks the same path.": ["按住屏幕一侧，走一条走不完的小路。黄昏时你走过的石灯笼会亮起来；有雾，有萤火虫，有时馒头或一只猫会跟上来。朋友也走在同一条路上。", "按住螢幕一側，走一條走不完的小路。黃昏時你走過的石燈籠會亮起來；有霧，有螢火蟲，有時饅頭或一隻貓會跟上來。朋友也走在同一條路上。", "Mantén un lado de la pantalla y recorre un sendero sin fin. Los faroles de piedra se encienden al pasar al atardecer; niebla, luciérnagas y a veces Mantou o un gato se ponen a tu lado. Un amigo camina el mismo sendero.", "Mantén un costat de la pantalla i recorre un camí sense fi. Els fanals de pedra s'encenen quan hi passes al capvespre; boira, cuques de llum i de vegades en Mantou o un gat se't posa al costat. Un amic camina el mateix camí."], "WALK MANTOU, THE SHEEP GO HOME": ["带馒头散步，羊儿回家", "帶饅頭散步，羊兒回家", "PASEA A MANTOU, LAS OVEJAS VUELVEN", "PASSEJA EN MANTOU, LES OVELLES TORNEN"], "Mantou follows your finger; a tap is a woof. The sheep drift away from him and flowers open where they walk. When the flock is home in the pen they settle, and later wander out again. At night everyone sleeps. A friend can be the second shepherd.": ["馒头跟着你的手指走，点一下就是一声汪。羊会躲开它，走过的地方花就开了。羊群都回到圈里就安顿下来，过一会儿又会走出来。夜里大家都睡了。朋友可以当第二个牧羊人。", "饅頭跟著你的手指走，點一下就是一聲汪。羊會躲開它，走過的地方花就開了。羊群都回到圈裡就安頓下來，過一會兒又會走出來。夜裡大家都睡了。朋友可以當第二個牧羊人。", "Mantou sigue tu dedo; un toque es un guau. Las ovejas se apartan de él y las flores se abren a su paso. Cuando el rebaño está en el redil se calma, y más tarde vuelve a salir. De noche todos duermen. Un amigo puede ser el segundo pastor.", "En Mantou segueix el teu dit; un toc és un bub. Les ovelles s'aparten d'ell i les flors s'obren al seu pas. Quan el ramat és al corral s'assossega, i més tard torna a sortir. A la nit tothom dorm. Un amic pot ser el segon pastor."], "THE FLOCK GOES HOME": ["羊群回家", "羊群回家", "EL REBAÑO VUELVE A CASA", "EL RAMAT TORNA A CASA"], "Walk the dog; a tap is a woof. The flock drifts away from him toward the pen: four to fourteen sheep, and some days a goat, a cow or an alpaca came up too. When everyone is home they settle, and later wander out again. At night everyone sleeps. A friend can be the second shepherd.": ["带着狗走走，点一下就是一声汪。羊群会躲开它，往羊圈走：四到十四只羊，有时还有一只山羊、一头牛或一只羊驼跟了上来。大家都回家了就安顿下来，过一会儿又会走出来。夜里大家都睡了。朋友可以当第二个牧羊人。", "帶著狗走走，點一下就是一聲汪。羊群會躲開它，往羊圈走：四到十四隻羊，有時還有一隻山羊、一頭牛或一隻羊駝跟了上來。大家都回家了就安頓下來，過一會兒又會走出來。夜裡大家都睡了。朋友可以當第二個牧羊人。", "Pasea al perro; un toque es un guau. El rebaño se aparta de él hacia el redil: de cuatro a catorce ovejas, y algunos días también subió una cabra, una vaca o una alpaca. Cuando todos están en casa se calman, y más tarde vuelven a salir. De noche todos duermen. Un amigo puede ser el segundo pastor.", "Passeja el gos; un toc és un bub. El ramat s'aparta d'ell cap al corral: de quatre a catorze ovelles, i alguns dies també hi ha pujat una cabra, una vaca o una alpaca. Quan tothom és a casa s'assossega, i més tard torna a sortir. A la nit tothom dorm. Un amic pot ser el segon pastor."], "LIE IN THE FLOWERS": ["躺在花丛里", "躺在花叢裡", "TÚMBATE ENTRE LAS FLORES", "ESTIRA'T ENTRE LES FLORS"], "Lie down in the wildflowers and watch the sky go by. Tap a flower by your face and breathe it in; sometimes a bee comes to see what you found. Nothing to do but that.": ["躺在野花里，看天空慢慢经过。点一下脸边的花，深深吸一口；有时会有一只蜜蜂过来看看你发现了什么。除此之外，什么都不用做。", "躺在野花裡，看天空慢慢經過。點一下臉邊的花，深深吸一口；有時會有一隻蜜蜂過來看看你發現了什麼。除此之外，什麼都不用做。", "Túmbate entre las flores silvestres y mira pasar el cielo. Toca una flor junto a tu cara y respírala; a veces viene una abeja a ver qué has encontrado. Nada más que eso.", "Estira't entre les flors silvestres i mira passar el cel. Toca una flor al costat de la cara i respira-la; de vegades ve una abella a veure què has trobat. Res més que això."], "A different broken piece waits on the bench each visit. Fit the shards, trace the cracks with lacquer, and the gold fills them. Sign the finished piece into a book every visitor can leaf through.": ["每次来，工作台上都有一件不同的碎器在等你。拼合碎片，用漆描过裂缝，金就会填满它们。把修好的器物签进一本每位访客都能翻阅的书里。", "每次來，工作台上都有一件不同的碎器在等你。拼合碎片，用漆描過裂縫，金就會填滿它們。把修好的器物簽進一本每位訪客都能翻閱的書裡。", "Cada visita, una pieza rota distinta te espera en el banco. Encaja los fragmentos, repasa las grietas con laca y el oro las llena. Firma la pieza terminada en un libro que cualquier visitante puede hojear.", "Cada visita, una peça trencada diferent t'espera al banc. Encaixa els fragments, repassa les esquerdes amb laca i l'or les omple. Signa la peça acabada en un llibre que qualsevol visitant pot fullejar."], "A FOUNTAIN, A COIN, A WISH": ["一座喷泉，一枚硬币，一个愿望", "一座噴泉，一枚硬幣，一個願望", "UNA FUENTE, UNA MONEDA, UN DESEO", "UNA FONT, UNA MONEDA, UN DESIG"], "The square in the middle of town: a fountain, benches, lamps and pigeons. Toss a coin and make a wish. Keep it to yourself, or let it float: it lies in the basin for a month, without a name, and anyone can read it and hope with you. At the flower stall, tie a bouquet and send it to someone you love: it travels inside the link, stored nowhere.": ["小镇正中的广场：一座喷泉，几张长椅，几盏路灯，一群鸽子。投一枚硬币，许个愿。留在心里，或者让它漂着：它会在池底躺一个月，不留名字，谁都可以读到，和你一起盼着。在花摊扎一束花，送给你爱的人：花束就藏在链接里，哪儿都不存。", "小鎮正中的廣場：一座噴泉，幾張長椅，幾盞路燈，一群鴿子。投一枚硬幣，許個願。留在心裡，或者讓它漂著：它會在池底躺一個月，不留名字，誰都可以讀到，和你一起盼著。在花攤紮一束花，送給你愛的人：花束就藏在連結裡，哪兒都不存。", "La plaza en el centro del pueblo: una fuente, bancos, farolas y palomas. Lanza una moneda y pide un deseo. Guárdatelo, o deja que flote: se queda en la fuente un mes, sin nombre, y cualquiera puede leerlo y desearlo contigo. En el puesto de flores, haz un ramo y envíaselo a alguien que quieras: viaja dentro del enlace y no se guarda en ningún sitio.", "La plaça al mig del poble: una font, bancs, fanals i coloms. Llança una moneda i demana un desig. Guarda-te'l, o deixa que suri: es queda a la font un mes, sense nom, i qualsevol el pot llegir i desitjar-lo amb tu. A la parada de flors, fes un ram i envia'l a algú que estimis: viatja dins de l'enllaç i no es guarda enlloc."], "THE TOWN'S LITTLE CINEMA CLUB": ["小镇的小电影俱乐部", "小鎮的小電影俱樂部", "EL PEQUEÑO CINECLUB DEL PUEBLO", "EL PETIT CINECLUB DEL POBLE"], "A NOTICE BOARD FOR THE TOWN": ["小镇的告示板", "小鎮的告示板", "UN TABLÓN DE ANUNCIOS PARA EL PUEBLO", "UN TAULER D'ANUNCIS PER AL POBLE"], "INVITATIONS TO REAL GET-TOGETHERS": ["真实聚会的邀请", "真實聚會的邀請", "INVITACIONES A ENCUENTROS DE VERDAD", "INVITACIONS A TROBADES DE DEBÒ"], "Nominate a film with a line on why, and say which of the others you'd watch. The one most people want is on this week. No counts, no rankings: just a screen, red seats, and someone to watch it with.": ["提名一部电影，写一句为什么，再说说其他片子里你想看哪些。最多人想看的那部本周放映。没有计数，没有排名：只有一块银幕、几排红椅子，和一个陪你看的人。", "提名一部電影，寫一句為什麼，再說說其他片子裡你想看哪些。最多人想看的那部本週放映。沒有計數，沒有排名：只有一塊銀幕、幾排紅椅子，和一個陪你看的人。", "Propón una película con una frase sobre por qué y di cuáles de las demás verías. La que más gente quiere ver es la de esta semana. Sin recuentos ni rankings: una pantalla, butacas rojas y alguien con quien verla.", "Proposa una pel·lícula amb una frase sobre per què i digues quines de les altres veuries. La que més gent vol veure és la d'aquesta setmana. Sense recomptes ni rànquings: una pantalla, butaques vermelles i algú amb qui veure-la."], "Plan an evening with real people: what, when, where, and things people could bring. Send the link; see who's coming and what they'll bring. Only people with the link can see it, and it's gone a week after the day.": ["和真实的人约一个晚上：什么聚会、什么时候、在哪里、大家可以带什么。发出链接，看看谁会来、带什么。只有拿到链接的人看得到，聚会后一周就会消失。", "和真實的人約一個晚上：什麼聚會、什麼時候、在哪裡、大家可以帶什麼。傳出連結，看看誰會來、帶什麼。只有拿到連結的人看得到，聚會後一週就會消失。", "Planea una tarde con gente de verdad: qué, cuándo, dónde y qué puede traer la gente. Envía el enlace y mira quién viene y qué trae. Solo lo ve quien tiene el enlace, y desaparece una semana después del día.", "Planeja un vespre amb gent de debò: què, quan, on i què pot portar la gent. Envia l'enllaç i mira qui ve i què porta. Només ho veu qui té l'enllaç, i desapareix una setmana després del dia."], "Pin an idea for the town, your own news, or a word about a place you love here, and answer each other. Inside, stitch one square into the town quilt; it only grows. No votes, no counts.": ["钉上一个给小镇的点子、你自己的消息，或者说说你喜欢的一个地方，再互相回一句。里面还挂着小镇的百衲被，缝上你的一块；它只会越来越大。不投票，不计数。", "釘上一個給小鎮的點子、你自己的消息，或者說說你喜歡的一個地方，再互相回一句。裡面還掛著小鎮的百衲被，縫上你的一塊；它只會越來越大。不投票，不計數。", "Clava una idea para el pueblo, tus propias noticias o unas palabras sobre un lugar que te gusta, y respondeos. Dentro, cose un cuadrado en la colcha del pueblo; solo crece. Sin votos, sin cuentas.", "Clava una idea per al poble, les teves notícies o unes paraules sobre un lloc que t'agrada, i responeu-vos. A dins, cus un quadrat a la colxa del poble; només creix. Sense vots, sense comptes."], "A CARD A DAY FROM TWO CATS": ["两只猫，一天一张牌", "兩隻貓，一天一張牌", "DOS GATOS, UNA CARTA AL DÍA", "DOS GATS, UNA CARTA AL DIA"], "Miso and Yuzu keep a little stall by the Plaza with the Nearby deck. Tap it and one of them paws a card over: what it says you'll do, somewhere real, today. One card a day. When they're out or asleep, cut the deck yourself.": ["味噌和柚子在广场边摆了个小摊，用的是近邻的扑克牌。点一下，其中一只会用爪子推一张牌给你：上面说的是你今天要在真实世界里做的事。一天一张。它们出门或睡着了，就自己切牌。", "味噌和柚子在廣場邊擺了個小攤，用的是近鄰的撲克牌。點一下，其中一隻會用爪子推一張牌給你：上面說的是你今天要在真實世界裡做的事。一天一張。牠們出門或睡著了，就自己切牌。", "Miso y Yuzu tienen un puestito junto a la Plaza con la baraja de Cerca. Tócala y una de ellas te acerca una carta con la pata: lo que dice que harás hoy, en algún sitio de verdad. Una carta al día. Si han salido o duermen, corta tú la baraja.", "La Miso i la Yuzu tenen una parada al costat de la Plaça amb la baralla d'A Prop. Toca-la i una d'elles t'acosta una carta amb la pota: el que diu que faràs avui, en algun lloc de veritat. Una carta al dia. Si són fora o dormen, talla tu la baralla."]};</script><link rel="stylesheet" href="/fbkit/fbb.css?v=3b720d5e4b" data-fbb><script data-fbg src="/fbkit/fbg.js?v=7d22821bac" defer></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#060906">
  <title>GAME REPERTORY</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="stylesheet" href="/fonts/g/fonts.css">

  <style>
    :root {
      --bg-color: #060906;
      --term-green: #33ff66;
      --term-dim: #1a8c38;
      --term-glow: rgba(51, 255, 102, 0.45);
      --cursor-color: #33ff66;
      --paper-line: rgba(51, 255, 102, 0.12);
      --hi-color: #ffffff;
      --hi-glow: 0 0 10px #ffffff;
      --interrupt: #facc15;
      --interrupt-glow: 0 0 8px rgba(250, 204, 21, 0.7);
      --error: #ff4d4d;
      --btn-bg: rgba(0, 0, 0, 0.4);

      --fs: 19px;
      --input-fs: 21px;
      --pad-x: 18px;
      --app-h: 100dvh;
    }

    body.amber-theme {
      --bg-color: #0c0802;
      --term-green: #ffb000;
      --term-dim: #996a00;
      --term-glow: rgba(255, 176, 0, 0.45);
      --cursor-color: #ffb000;
      --paper-line: rgba(255, 176, 0, 0.12);
      --hi-color: #fff4dc;
      --hi-glow: 0 0 10px rgba(255, 220, 160, 0.9);
    }

    body.paper-theme {
      --bg-color: #e6dfcf;
      --term-green: #1f1d18;
      --term-dim: #605948;
      --term-glow: transparent;
      --cursor-color: #1f1d18;
      --paper-line: rgba(0, 0, 0, 0.08);
      --hi-color: #8b0000;
      --hi-glow: none;
      --interrupt: #b45309;
      --interrupt-glow: none;
      --error: #b91c1c;
      --btn-bg: #d8d0be;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: var(--app-h);
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--term-green);
      font-family: 'VT323', 'Share Tech Mono', monospace;
      font-size: var(--fs);
      line-height: 1.25;
      letter-spacing: 0.5px;
      text-shadow: 0 0 6px var(--term-glow);
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    ::selection {
      background: var(--term-green);
      color: var(--bg-color);
      text-shadow: none;
    }

    .crt-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%,
        rgba(0, 0, 0, 0.35) 50%
      ), linear-gradient(
        90deg,
        rgba(255, 0, 0, 0.03),
        rgba(0, 255, 0, 0.01),
        rgba(0, 0, 255, 0.03)
      );
      background-size: 100% 3px, 6px 100%;
      box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.85);
    }

    .paper-theme .crt-overlay { display: none; }

    /* Faint ruled lines on teleprinter paper */
    .paper-theme #screenBuffer {
      background-image: linear-gradient(var(--paper-line) 1px, transparent 1px);
      background-size: 100% 1.25em;
      background-attachment: local;
    }

    #terminalFrame {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 980px;
      height: 100%;
      margin: 0 auto;
      padding:
        calc(12px + env(safe-area-inset-top))
        calc(var(--pad-x) + env(safe-area-inset-right))
        calc(10px + env(safe-area-inset-bottom))
        calc(var(--pad-x) + env(safe-area-inset-left));
      position: relative;
    }

    header {
      border-bottom: 2px solid var(--term-green);
      padding-bottom: 6px;
      margin-bottom: 10px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 4px 12px;
      font-size: 15px;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .brand { white-space: nowrap; }

    .hardware-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .hardware-tags span {
      padding: 1px 6px;
      border: 1px solid var(--term-dim);
      white-space: nowrap;
      transition: border-color 0.15s, color 0.15s;
    }

    .hardware-tags span.ping {
      border-color: var(--term-green);
    }

    .hardware-tags span.warn {
      color: var(--interrupt);
      border-color: var(--interrupt);
      text-shadow: var(--interrupt-glow);
    }

    #screenBuffer {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      padding-right: 8px;
      white-space: pre-wrap;
      word-break: break-word;
      scrollbar-width: thin;
      scrollbar-color: var(--term-dim) transparent;
    }

    #screenBuffer::-webkit-scrollbar { width: 6px; }
    #screenBuffer::-webkit-scrollbar-thumb { background: var(--term-dim); }
    #screenBuffer::-webkit-scrollbar-track { background: transparent; }

    .log-line { margin: 1.5px 0; min-height: 1.25em; }
    .log-line.system { color: var(--term-green); }
    .log-line.dim { color: var(--term-dim); }
    .log-line.highlight { color: var(--hi-color); text-shadow: var(--hi-glow); }
    .paper-theme .log-line.highlight { font-weight: bold; }
    .log-line.interrupt { color: var(--interrupt); text-shadow: var(--interrupt-glow); }
    .paper-theme .log-line.interrupt { font-weight: bold; }
    .log-line.error { color: var(--error); text-shadow: 0 0 8px rgba(255, 77, 77, 0.6); }
    .paper-theme .log-line.error { text-shadow: none; }
    .log-line.echo { color: var(--hi-color); text-shadow: var(--hi-glow); margin-top: 6px; }

    /* Tappable program codes inside the printout */
    .cmd-link {
      cursor: pointer;
      color: inherit;
      text-decoration: underline;
      text-decoration-style: dotted;
      text-underline-offset: 3px;
      outline: none;
    }
    .cmd-link:focus-visible,
    .cmd-link:active {
      background: var(--term-green);
      color: var(--bg-color);
      text-shadow: none;
      text-decoration: none;
    }
    @media (hover: hover) {
      .cmd-link:hover {
        background: var(--term-green);
        color: var(--bg-color);
        text-shadow: none;
        text-decoration: none;
      }
    }

    .ascii-box {
      border: 1px solid var(--term-dim);
      padding: 8px 12px;
      margin: 6px 0;
      background: rgba(0, 0, 0, 0.2);
      white-space: normal;
    }
    .paper-theme .ascii-box { background: rgba(0, 0, 0, 0.04); }

    .launch-link {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 10px;
      border: 1px solid var(--term-green);
      color: inherit;
      font-weight: bold;
      text-decoration: none;
      touch-action: manipulation;
    }
    .launch-link:focus-visible,
    .launch-link:active {
      background: var(--term-green);
      color: var(--bg-color);
      text-shadow: none;
      outline: none;
    }
    @media (hover: hover) {
      .launch-link:hover {
        background: var(--term-green);
        color: var(--bg-color);
        text-shadow: none;
      }
    }

    #inputRow {
      display: flex;
      align-items: center;
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px dashed var(--term-dim);
      flex-shrink: 0;
      cursor: text;
    }

    .prompt-label {
      font-weight: bold;
      margin-right: 6px;
      user-select: none;
      -webkit-user-select: none;
      font-size: var(--input-fs);
    }

    .input-wrap {
      position: relative;
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      font-size: var(--input-fs);
    }

    #commandInput {
      width: 100%;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      border-radius: 0;
      -webkit-appearance: none;
      appearance: none;
      font-family: inherit;
      font-size: 1em;
      letter-spacing: inherit;
      color: inherit;
      text-transform: uppercase;
      caret-color: transparent;
      text-shadow: inherit;
      padding: 0;
      line-height: 1.3;
    }

    #commandInput::placeholder {
      color: var(--term-dim);
      opacity: 1;
      text-shadow: none;
    }

    function parseGameText(text) {
      const clean = text.trim();
      if (!clean) return [];

      if (clean.startsWith('[') || clean.startsWith('{')) {
        try {
          const parsed = JSON.parse(clean);
          const list = Array.isArray(parsed) ? parsed : [parsed];
          return list.map((e, i) => normalizeGameEntry(e, i));
        } catch (e) {}
      }

      const lines = clean.split(/\r?\n/);
      const games = [];
      let current = null;

      lines.forEach(line => {
        const trimmed = line.trim();
        if (!trimmed || trimmed.startsWith('#') || trimmed.startsWith('//')) return;

        const colonIdx = trimmed.indexOf(':');
        if (colonIdx === -1) return;

        const key = trimmed.slice(0, colonIdx).trim().toUpperCase();
        const val = trimmed.slice(colonIdx + 1).trim();

        if (key === 'CODE' || key === 'GAME' || key === 'PROGRAM') {
          if (current && (current.code || current.title)) {
            games.push(normalizeGameEntry(current, games.length));
          }
          current = { code: val.toUpperCase() };
        } else if (current) {
          if (key === 'TITLE' || key === 'NAME') current.title = val;
          else if (key === 'ID' || key === 'ALT' || key === 'SECTOR') current.altCode = val;
          else if (key === 'DESC' || key === 'INTRO' || key === 'SUMMARY') current.desc = val;
          else if (key === 'URL' || key === 'LINK' || key === 'FILE' || key === 'PATH') current.url = val;
          else if (key === 'GENRE' || key === 'TYPE') current.genre = val;
          else if (key === 'AUTHOR' || key === 'DEV') current.author = val;
        }
      });

      if (current && (current.code || current.title)) {
        games.push(normalizeGameEntry(current, games.length));
      }

      return games;

    function normalizeGameEntry(entry, idx = 0) {
      const seq = String(idx + 1).padStart(2, '0');
      const code = String(entry.code || entry.id || `GAME${idx + 1}`).toUpperCase().replace(/\s+/g, '');
      return {
        code: code,
        altCode: String(entry.altCode || entry.id || `TAPE-${seq}`).toUpperCase(),
        title: String(entry.title || entry.name || code).toUpperCase(),
        genre: String(entry.genre || 'INTERACTIVE SIMULATION').toUpperCase(),
        author: String(entry.author || 'MAINFRAME ARCHIVE').toUpperCase(),
        desc: String(entry.desc || entry.intro || 'No telemetry dossier logged on magnetic tape.'),
        url: safeUrl(entry.url || entry.link || '#')

      const s = String(u || '').trim();

      return s;

          || (loose ? GAME_CATALOG.find(g => g.title.includes(raw)) : null)

      pingWatcher();

      try {
        const response = await fetch('./game.txt?t=' + Date.now(), { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const rawText = await response.text();

        if (srcState === 'lost') {
          print("[DAEMON] CARRIER RESTORED ON ./game.txt.", "dim");
        }
        if (srcState !== 'rom' || rawText.trim()) {
          srcState = 'live';
          setSrcTag('SRC: [GAME.TXT LIVE]');
        }

        // Skip if content has not changed
        if (rawText.trim() === lastLoadedRawContent.trim()) {
          return { success: true, count: GAME_CATALOG.length, unchanged: true };
        }

        const freshCatalog = parseGameText(rawText);
        if (freshCatalog.length === 0) {
          return { success: false, error: 'NO VALID PROGRAM ENTRIES FOUND' };
        }

        // Detect new, updated and removed games compared to current catalog
        const prevCodes = new Set(GAME_CATALOG.map(g => g.code));
        const freshCodes = new Set(freshCatalog.map(g => g.code));
        const newEntries = freshCatalog.filter(g => !prevCodes.has(g.code));
        const removedEntries = GAME_CATALOG.filter(g => !freshCodes.has(g.code));
        const updatedEntries = freshCatalog.filter(g => {
          const old = GAME_CATALOG.find(o => o.code === g.code);
          return old && (old.url !== g.url || old.title !== g.title);
        });

        GAME_CATALOG = freshCatalog;
        lastLoadedRawContent = rawText;
        updateQuickDialButtons();

        // Autonomous update after boot: mechanical teleprinter interrupt
        if (!isInitialBoot && (newEntries.length || updatedEntries.length || removedEntries.length)) {
          sound.playTapeMotor();
          sound.playBell();

          print(" ");
          print(rule('='), "interrupt");
          print(center(fit("[DAEMON INTERRUPT: MAGNETIC TAPE HEAD SENSES NEW DIRECTORY]", "[DAEMON INTERRUPT: NEW DIRECTORY]")), "interrupt");
          print(rule('='), "interrupt");

          newEntries.forEach(g => {
            printParts(["+ MOUNTED NEW PROGRAM: [", cmdLink(g.code, `RUN ${g.code}`), `] "${g.title}" -> ${g.url}`], "highlight");
          });
          updatedEntries.forEach(g => {
            printParts(["* RE-ALIGNED SECTOR [", cmdLink(g.code, `INFO ${g.code}`), `]: NEW TARGET -> ${g.url}`], "system");
          });
          removedEntries.forEach(g => {
            print(`- UNMOUNTED PROGRAM: [${g.code}] "${g.title}"`, "dim");
          });

          print(`TOTAL ACTIVE APPLICATIONS IN CORE: ${GAME_CATALOG.length}`, "dim");
          print(`TYPE "CATALOG" TO INSPECT, OR USE "RUN <CODE>" IMMEDIATELY.`, "dim");
          print(" ");
        }

        return { success: true, count: freshCatalog.length };
      } catch (err) {
        if (isInitialBoot || srcState === 'rom') {
          srcState = 'rom';
          setSrcTag('SRC: [ROM STANDBY]');
          if (isInitialBoot) updateQuickDialButtons();
        } else if (srcState === 'live') {
          srcState = 'lost';
          setSrcTag('SRC: [LINK LOST]', true);
          print("[DAEMON] ./game.txt CARRIER LOST. HOLDING LAST KNOWN DIRECTORY.", "dim");
        }
        return { success: false, error: err.message };
      } finally {
        pollBusy = false;
      }
    }

    /* =========================================================================
       DYNAMIC BUTTON REGENERATOR
       ========================================================================= */
    function updateQuickDialButtons() {
      const container = document.getElementById('quickDialBar');
      const keepScroll = container.scrollLeft;
      container.innerHTML = '';

      const coreActions = [
        { label: 'HELP', cmd: 'HELP' },
        { label: 'CATALOG', cmd: 'CATALOG' },
        { label: 'CLEAR', cmd: 'CLEAR' },
        { label: 'THEME', cmd: 'THEME' },
        { label: 'AUDIO', cmd: 'AUDIO' }
      ];

      const addBtn = (label, cmd, cls, title) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = cls;
        b.textContent = label;
        if (title) b.title = title;
        b.addEventListener('click', () => {
          executeCmd(cmd);
          if (!isCoarse) focusInput();
        });
        container.appendChild(b);
      };

      // Game keys first: each one is a tape cartridge. Hover decrypts its label, tap loads it.
      const GLYPHS = '#$%&@*+=?/\\<>[]{}01';
      const REELS = ['◐', '◓', '◑', '◒'];
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const scramble = (el, text, ms = 260) => {
        if (reduceMotion) { el.textContent = text; return; }
        const t0 = performance.now();
        (function tick(now) {
          const k = Math.min(1, (now - t0) / ms), keep = Math.floor(k * text.length);
          el.textContent = text.split('').map((c, i) => i < keep || c === ' ' ? c : GLYPHS[(Math.random() * GLYPHS.length) | 0]).join('');
          if (k < 1) requestAnimationFrame(tick);
        })(t0);
      };
      const loadTape = (b, cmd) => {
        if (b.classList.contains('loading')) return;
        b.classList.add('loading');
        try { sound.playTapeMotor && sound.playTapeMotor(); } catch (e) {}
        const reel = b.querySelector('.reel'); let r = 0;
        const spin = reduceMotion ? null : setInterval(() => { reel.textContent = REELS[r++ % 4]; }, 70);
        setTimeout(() => { clearInterval(spin); b.classList.remove('loading'); reel.textContent = '▶'; executeCmd(cmd); if (!isCoarse) focusInput(); }, reduceMotion ? 0 : 560);
      };
      const addTape = (game) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'btn-key game-btn tape';
        b.title = `${game.title} · ${game.genre}`;
        b.setAttribute('aria-label', `Run ${game.title}`);
        b.innerHTML = '<span class="led" aria-hidden="true"></span><span class="reel" aria-hidden="true">▶</span><span class="lbl"></span><span class="sector" aria-hidden="true"></span><span class="bar" aria-hidden="true"></span>';
        const lbl = b.querySelector('.lbl'); lbl.textContent = game.code; b.querySelector('.sector').textContent = game.altCode;
        const ghost = () => { scramble(lbl, game.code); if (!isCoarse) input.placeholder = `RUN ${game.code}`; };
        b.addEventListener('mouseenter', ghost); b.addEventListener('focus', ghost);
        b.addEventListener('mouseleave', () => { input.placeholder = ''; }); b.addEventListener('blur', () => { input.placeholder = ''; });
        b.addEventListener('click', () => loadTape(b, `RUN ${game.code}`));
        container.appendChild(b);
      };
      // (one key per game used to live here; the catalog and RUN ??? cover it now)
      // A wildcard tape: spins through the catalog, then loads whatever it lands on
      if (GAME_CATALOG.length > 1) {
        const w = document.createElement('button');
        w.type = 'button'; w.className = 'btn-key wild'; w.textContent = 'RUN ???'; w.title = 'Random tape';
        w.addEventListener('click', () => {
          if (w.disabled) return; w.disabled = true;
          const pick = GAME_CATALOG[(Math.random() * GAME_CATALOG.length) | 0];
          let n = 0; const steps = reduceMotion ? 0 : 12;
          (function spin() {
            if (n++ < steps) { w.textContent = 'RUN ' + GAME_CATALOG[n % GAME_CATALOG.length].code; try { sound.playKeyClick(); } catch (e) {} setTimeout(spin, 40 + n * 9); return; }
            w.textContent = 'RUN ' + pick.code; setTimeout(() => { w.textContent = 'RUN ???'; w.disabled = false; }, 900);
            executeCmd(`RUN ${pick.code}`); if (!isCoarse) focusInput();
          })();
        });
        container.appendChild(w);
      }
      const sep = document.createElement('span'); sep.className = 'dial-sep'; sep.setAttribute('aria-hidden', 'true'); container.appendChild(sep);
      coreActions.forEach(a => addBtn(a.label, a.cmd, 'btn-key'));

      container.scrollLeft = keepScroll;
    }

    /* =========================================================================
       TELEPRINTER OUTPUT: line queue, responsive column width
       ========================================================================= */
    const screen = document.getElementById('screenBuffer');
    const input = document.getElementById('commandInput');
    const inputWrap = document.getElementById('inputWrap');
    const inputRow = document.getElementById('inputRow');
    const mirror = document.getElementById('inputMirror');
    const cursorEl = document.getElementById('customCursor');
    const audioTag = document.getElementById('audioTag');

    const isCoarse = window.matchMedia('(pointer: coarse)').matches;
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const LINE_DELAY = reduceMotion ? 0 : 14;

    let COLS = 65;

    function measureCols() {
      const probe = document.createElement('span');
      probe.textContent = 'M'.repeat(20);
      probe.style.cssText = 'position:absolute;visibility:hidden;white-space:pre;';
      screen.appendChild(probe);
      const charW = probe.getBoundingClientRect().width / 20 || 9;
      probe.remove();
      const avail = screen.clientWidth - 12;
      COLS = Math.max(24, Math.min(65, Math.floor(avail / charW)));
    }

    const rule = (ch = '-') => ch.repeat(COLS);
    const fit = (long, short) => (long.length <= COLS ? long : short);
    function center(text) {
      if (text.length >= COLS) return text;
      return ' '.repeat(Math.floor((COLS - text.length) / 2)) + text;
    }
    function pad(s, n) {
      s = String(s);
      if (s.length > n) return s.slice(0, Math.max(0, n - 1)) + '~';
      return s + ' '.repeat(n - s.length);
    }

    const outQueue = [];
    let drainTimer = null;
    let forceScroll = false;

    function nearBottom() {
      return screen.scrollHeight - screen.scrollTop - screen.clientHeight < 60;
    }

    function emit(node) {
      outQueue.push(node);
      if (!drainTimer) drainStep();
    }

    function drainStep() {
      if (!outQueue.length) { drainTimer = null; forceScroll = false; return; }
      const stick = forceScroll || nearBottom();
      const batch = LINE_DELAY === 0 ? outQueue.length : (outQueue.length > 30 ? 6 : 1);
      for (let i = 0; i < batch && outQueue.length; i++) screen.appendChild(outQueue.shift());
      if (stick) screen.scrollTop = screen.scrollHeight;
      drainTimer = setTimeout(drainStep, LINE_DELAY);
    }

    function flushOutput() {
      while (outQueue.length) screen.appendChild(outQueue.shift());
      screen.scrollTop = screen.scrollHeight;
    }

    function makeLine(cls) {
      const d = document.createElement('div');
      d.className = `log-line ${cls}`;
      return d;
    }

    function print(text = ' ', className = 'system') {
      const d = makeLine(className);
      d.textContent = text === '' ? ' ' : text;
      emit(d);
    }

    function printParts(parts, className = 'system') {
      const d = makeLine(className);
      parts.forEach(p => d.append(typeof p === 'string' ? document.createTextNode(p) : p));
      emit(d);
    }

    function cmdLink(label, cmd) {
      const s = document.createElement('span');
      s.className = 'cmd-link';
      s.textContent = label;
      s.setAttribute('role', 'button');
      s.tabIndex = 0;
      s.addEventListener('click', e => { e.stopPropagation(); executeCmd(cmd); });
      s.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); executeCmd(cmd); }
      });
      return s;
    }

    let launchTimer = null;

    function clearScreen() {
      outQueue.length = 0;
      clearTimeout(launchTimer);
      screen.innerHTML = '';
    }

    function focusInput() {
      input.focus({ preventScroll: true });
    }

    /* =========================================================================
       BLOCK CURSOR THAT FOLLOWS THE CARET
       ========================================================================= */
    function updateCursor() {
      const pos = input.selectionStart == null ? input.value.length : input.selectionStart;
      mirror.textContent = input.value.slice(0, pos);
      const textW = mirror.getBoundingClientRect().width;
      const maxX = Math.max(0, input.clientWidth - cursorEl.offsetWidth);
      const x = Math.max(0, Math.min(textW - input.scrollLeft, maxX));
      cursorEl.style.transform = `translateX(${x}px)`;
    }

    function restartBlink() {
      cursorEl.style.animation = 'none';
      void cursorEl.offsetWidth;
      cursorEl.style.animation = '';
    }

    /* =========================================================================
       INTERPRETER
       ========================================================================= */
    let cmdHistory = [];
    let historyIdx = -1;
    let themeIndex = 0;
    const themes = ['', 'amber-theme', 'paper-theme'];
    const themeNames = ['P1-GREEN PHOSPHOR', 'P3-AMBER PHOSPHOR', 'TTY-33 TELEPRINTER PAPER'];
    const themeColors = ['#060906', '#0c0802', '#e6dfcf'];
    const COMMANDS = ['HELP', 'CATALOG', 'RUN', 'INFO', 'OPEN', 'RELOAD', 'CLEAR', 'THEME', 'AUDIO', 'BELL'];
    const ARG_COMMANDS = ['RUN', 'LOAD', 'PLAY', 'GO', 'INFO', 'DESC'];

    const exampleCode = () => (GAME_CATALOG[0] && GAME_CATALOG[0].code) || 'CLIMB';

    async function executeCmd(rawCmd) {
      sound.init();
      const fromInput = rawCmd === undefined;
      const cmdStr = (fromInput ? input.value : rawCmd).trim();
      if (!cmdStr) return;

      flushOutput();
      forceScroll = true;
      print(`EXEC> ${cmdStr.toUpperCase()}`, 'echo');
      sound.playKeyClick();

      if (fromInput) {
        if (cmdHistory[cmdHistory.length - 1] !== cmdStr) cmdHistory.push(cmdStr);
        historyIdx = cmdHistory.length;
        input.value = '';
        updateCursor();
      }

      const tokens = cmdStr.toUpperCase().split(/\s+/);
      const action = tokens[0];
      const arg = tokens.slice(1).join(' ');

      switch (action) {
        case 'HELP':
        case '?':
          displayHelp();
          break;

        case 'CATALOG':
        case 'DIR':
        case 'LIST':
        case 'LS':
          displayCatalog();
          break;

        case 'RUN':
        case 'LOAD':
        case 'PLAY':
        case 'GO':
          if (!arg) {
            print(`ERROR: PARAMETER MISSING. SPECIFY PROGRAM CODE (E.G., RUN ${exampleCode()})`, "error");
            sound.playBell();
          } else {
            launchProgram(arg);
          }
          break;

        case 'OPEN':
        case 'ENGAGE':
          openProgram(arg);
          break;

        case 'RELOAD':
        case 'REFRESH':
        case 'SYNC': {
          sound.playTapeMotor();
          print("FORCING IMMEDIATE HARDWARE SCAN OF ./game.txt...", "dim");
          lastLoadedRawContent = ""; // Reset cache to force refresh
          const res = await inspectGameFileForUpdates({ force: true });
          if (res.success) {
            print(`[COMPLETE] CURRENT DIRECTORY CONTAINS ${GAME_CATALOG.length} MOUNTED PROGRAMS.`, "highlight");
          } else {
            print(`[FAULT] SCAN FAILED: ${String(res.error).toUpperCase()}`, "error");
            print(`[RESERVE] ${GAME_CATALOG.length} PROGRAMS REMAIN IN CORE.`, "dim");
          }
          sound.playBell();
          break;
        }

        case 'INFO':
        case 'DESC':
          if (!arg) {
            print(`ERROR: SPECIFY PROGRAM CODE (E.G., INFO ${exampleCode()})`, "error");
          } else {
            displayGameInfo(arg);
          }
          break;

        case 'CLEAR':
        case 'CLS':
          clearScreen();
          break;

        case 'THEME':
        case 'COLOR':
        case 'PALETTE':
          cycleTheme();
          break;

        case 'AUDIO':
        case 'SOUND':
          toggleAudio();
          break;

        case 'BELL':
          sound.playBell();
          print("[TELEX CHIME: 2048 HZ AUDIBLE SIGNAL TRANSMITTED]", "dim");
          break;

        default: {
          // Directly typed a known game code (e.g. "CLIMB", "DJ", "BAR")
          const directMatch = findGame(cmdStr, false);
          if (directMatch) {
            launchProgram(directMatch.code);
          } else {
            print(`UNKNOWN OPERATOR COMMAND: "${action}". TYPE "HELP" OR "CATALOG".`, "error");
            sound.playBell();
          }
          break;
        }
      }
    }

    function displayCatalog() {
      sound.playTapeMotor();
      print(" ");
      print(center(fit("TAPE ARCHIVE SOFTWARE CATALOG", "SOFTWARE CATALOG")), "highlight");
      print(rule('-'), "dim");

      const wide = COLS >= 56;
      if (wide) {
        const titleW = Math.min(26, Math.max(12, ...GAME_CATALOG.map(g => g.title.length)));
        const genreW = Math.max(8, COLS - 7 - 1 - 8 - 1 - titleW - 1);
        print(`${pad('CODE', 7)} ${pad('ID', 8)} ${pad('TITLE', titleW)} ${pad('GENRE', genreW).trimEnd()}`, "dim");
        print(rule('-'), "dim");
        GAME_CATALOG.forEach(g => {
          const code = g.code.length > 7 ? g.code.slice(0, 6) + '~' : g.code;
          printParts([
            cmdLink(code, `RUN ${g.code}`),
            ' '.repeat(Math.max(1, 8 - code.length)),
            `${pad(g.altCode, 8)} ${pad(g.title, titleW)} ${pad(g.genre, genreW).trimEnd()}`
          ], 'system');
        });
      } else {
        // Stacked record layout for phone-width paper
        GAME_CATALOG.forEach(g => {
          printParts(['[', cmdLink(g.code, `RUN ${g.code}`), `] ${g.title}`], 'system');
          print(`   ${g.altCode} / ${g.genre}`, 'dim');
        });
      }

      print(rule('-'), "dim");
      print(`TOTAL PROGRAM TAPES REGISTERED: ${GAME_CATALOG.length}`, "dim");
      print(`TO LAUNCH : TYPE  RUN <CODE>   (OR TAP A CODE)`, "highlight");
      print("TO EXAMINE: TYPE  INFO <CODE>", "dim");
      print(" ");
    }

    function launchProgram(codeQuery) {
      const match = findGame(codeQuery, true);

      if (!match) {
        print(`PROGRAM "${codeQuery}" NOT FOUND ON MAGNETIC TAPE.`, "error");
        print(`CHECK MOUNTED REPERTORY VIA "CATALOG" COMMAND.`, "dim");
        sound.playBell();
        return;
      }

      sound.playTapeMotor();
      print(" ");
      print(`[SEEKING MAGNETIC TAPE SECTOR: ${match.code} // ${match.altCode}]...`, "dim");

      clearTimeout(launchTimer);
      launchTimer = setTimeout(() => {
        sound.playBell();
        lastLaunch = match;
        forceScroll = true;
        print(" ");
        print(rule('='), "highlight");
        print(`  PROGRAM: ${match.title}`, "highlight");
        print(`  CLASS  : ${match.genre}`, "system");
        print(`  ORIGIN : ${match.author}`, "dim");
        print(rule('='), "highlight");
        print(match.desc);
        print(" ");
        print(`[+] TTY DATA CARRIER ESTABLISHED TO: ${match.url}`, "highlight");

        const box = document.createElement('div');
        box.className = 'log-line ascii-box';
        const head = document.createElement('div');
        head.textContent = '>>> HOST READY FOR IMMEDIATE LAUNCH <<<';
        const link = document.createElement('a');
        link.className = 'launch-link';
        link.href = match.url;
        link.target = CABINET ? '_top' : '_blank';
        link.rel = 'noopener';
        link.textContent = `[ ENGAGE PROGRAM: ${match.title} ]`;
        link.addEventListener('click', () => sound.playKeyClick());
        const hint = document.createElement('div');
        hint.className = 'dim';
        hint.style.cssText = 'margin-top:6px;color:var(--term-dim);';
        hint.textContent = 'OR TYPE "OPEN" TO ENGAGE FROM THE KEYBOARD.';
        box.append(head, link, hint);
        emit(box);
      }, 450);
    }

    function openProgram(arg) {
      const target = arg ? findGame(arg, true) : lastLaunch;
      if (!target) {
        print('ERROR: NO PROGRAM ARMED. USE "RUN <CODE>" FIRST.', 'error');
        sound.playBell();
        return;
      }
      if (target.url === '#') {
        print(`ERROR: PROGRAM ${target.code} HAS NO TARGET ADDRESS ON TAPE.`, 'error');
        return;
      }
      if (CABINET && window.parent !== window && window.parent.FBArcade) { try { const u = new URL(target.url, location.href); window.parent.FBArcade.play(u.pathname + u.search + u.hash); return; } catch (e) {} }   /* Last Coin: the tape opens in town, and the cabinet waits with the next level */
      if (CABINET && window.top !== window) { try { window.top.location.href = new URL(target.url, location.href).href; return; } catch (e) {} }
      const win = window.open(target.url, '_blank', 'noopener');
      print(win === null && !isCoarse
        ? '[BLOCKED] HOST REFUSED POP-OUT. USE THE ENGAGE LINK ABOVE.'
        : `[ENGAGED] ${target.title} -> ${target.url}`, win === null && !isCoarse ? 'error' : 'highlight');
    }

    function displayGameInfo(codeQuery) {
      const match = findGame(codeQuery, true);

      if (!match) {
        print(`FILE "${codeQuery}" NOT FOUND IN FILE REGISTRY.`, "error");
        return;
      }

      print(" ");
      print(`--- TECHNICAL DOSSIER: ${match.code} // ${match.altCode} ---`, "highlight");
      print(`TITLE   : ${match.title}`);
      print(`GENRE   : ${match.genre}`);
      print(`DEV     : ${match.author}`);
      print(`TARGET  : ${match.url}`);
      print(`SUMMARY : ${match.desc}`);
      printParts(['EXECUTE : ', cmdLink(`RUN ${match.code}`, `RUN ${match.code}`)]);
      print(" ");
    }

    function displayHelp() {
      const ex = exampleCode();
      print(" ");
      print(center(fit("OPERATOR COMMAND GLOSSARY", "COMMANDS")), "highlight");
      print(rule('='), "highlight");
      const rows = [
        ['CATALOG / DIR', 'DISPLAY DIRECTORY OF MOUNTED GAMES'],
        ['RUN <CODE>', `LOAD & LAUNCH GAME (E.G. RUN ${ex})`],
        ['OPEN', 'ENGAGE THE LAST ARMED PROGRAM'],
        ['INFO <CODE>', 'RETRIEVE GAME DOSSIER & LINK INFO'],
        ['RELOAD', 'FORCE IMMEDIATE DISK POLL ON ./game.txt'],
        ['CLEAR / CLS', 'CLEAR TERMINAL SCREEN BUFFER'],
        ['THEME', 'CYCLE CRT PHOSPHORS (GREEN / AMBER / PAPER)'],
        ['AUDIO', 'TOGGLE MECHANICAL TELETYPE NOISE'],
        ['BELL', 'RING PHYSICAL TELEPRINTER BELL']
      ];
      if (COLS >= 56) {
        rows.forEach(([c, d]) => print(`  ${pad(c, 17)}- ${d}`));
      } else {
        rows.forEach(([c, d]) => { print(`  ${c}`); print(`    ${d}`, 'dim'); });
      }
      print(rule('='), "highlight");
      if (!isCoarse) print("KEYS: TAB COMPLETE / UP-DOWN HISTORY / ESC CLEAR LINE / CTRL+L CLS", "dim");
      const parts = ['ACTIVE PROGRAM CODES: '];
      GAME_CATALOG.forEach((g, i) => {
        if (i) parts.push(', ');
        parts.push(cmdLink(g.code, `RUN ${g.code}`));
      });
      printParts(parts);
      print(" ");
    }

    /* =========================================================================
       PREFERENCES (theme / audio survive a reload)
       ========================================================================= */
    function savePrefs() {
      try {
        localStorage.setItem('memex68', JSON.stringify({ theme: themeIndex, muted: sound.muted }));
      } catch (e) {}
    }

    function loadPrefs() {
      try {
        const p = JSON.parse(localStorage.getItem('memex68') || '{}');
        if (Number.isInteger(p.theme) && p.theme >= 0 && p.theme < themes.length) themeIndex = p.theme;
        sound.muted = !!p.muted;
      } catch (e) {}
      applyTheme();
      audioTag.textContent = `AUDIO: [${sound.muted ? 'MUTED' : 'ON'}]`;
    }

    function applyTheme() {
      document.body.className = themes[themeIndex];
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', themeColors[themeIndex]);
    }

    function cycleTheme() {
      themeIndex = (themeIndex + 1) % themes.length;
      applyTheme();
      savePrefs();
      print(`PHOSPHOR EMISSION PALETTE SWITCHED: [${themeNames[themeIndex]}]`, "highlight");
    }

    function toggleAudio() {
      sound.init();
      sound.muted = !sound.muted;
      audioTag.textContent = `AUDIO: [${sound.muted ? 'MUTED' : 'ON'}]`;
      savePrefs();
      print(`TELETYPE AUDIO HARDWARE IS NOW ${sound.muted ? 'OFFLINE' : 'ONLINE'}.`, 'system');
      if (!sound.muted) setTimeout(() => sound.playBell(), 30);
    }

    /* =========================================================================
       TAB COMPLETION
       ========================================================================= */
    function tabComplete() {
      const v = input.value.toUpperCase().replace(/^\s+/, '');
      const parts = v.split(/\s+/);
      let pool, prefix;
      if (parts.length === 1) {
        pool = [...COMMANDS, ...GAME_CATALOG.map(g => g.code)];
        prefix = parts[0];
      } else if (parts.length === 2 && ARG_COMMANDS.includes(parts[0])) {
        pool = GAME_CATALOG.map(g => g.code);
        prefix = parts[1];
      } else {
        return;
      }
      const hits = [...new Set(pool)].filter(c => c.startsWith(prefix));
      if (hits.length === 1) {
        parts[parts.length - 1] = hits[0];
        const needsArg = parts.length === 1 && (hits[0] === 'RUN' || hits[0] === 'INFO');
        input.value = parts.join(' ') + (needsArg ? ' ' : '');
      } else if (hits.length > 1) {
        print(hits.join('  '), 'dim');
      } else {
        sound.playBell();
      }
      updateCursor();
    }

    /* =========================================================================
       INPUT WIRING
       ========================================================================= */
    // Unlock audio on the first real gesture (required by mobile browsers)
    ['pointerdown', 'keydown'].forEach(evt =>
      window.addEventListener(evt, () => sound.init(), { passive: true })
    );

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        executeCmd();
      } else if (e.key === 'ArrowUp') {
        if (cmdHistory.length > 0 && historyIdx > 0) {
          historyIdx--;
          input.value = cmdHistory[historyIdx];
        }
        e.preventDefault();
        requestAnimationFrame(() => {
          input.setSelectionRange(input.value.length, input.value.length);
          updateCursor();
        });
      } else if (e.key === 'ArrowDown') {
        if (historyIdx < cmdHistory.length - 1) {
          historyIdx++;
          input.value = cmdHistory[historyIdx];
        } else {
          historyIdx = cmdHistory.length;
          input.value = '';
        }
        e.preventDefault();
        requestAnimationFrame(updateCursor);
      } else if (e.key === 'Tab' && input.value.trim()) {
        e.preventDefault();
        tabComplete();
      } else if (e.key === 'Escape') {
        input.value = '';
        historyIdx = cmdHistory.length;
        updateCursor();
      } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'l') {
        e.preventDefault();
        clearScreen();
      }
    });

    // 'input' fires for physical and on-screen keyboards alike
    input.addEventListener('input', () => {
      sound.playKeyClick();
      restartBlink();
      updateCursor();
    });

    ['keyup', 'click', 'select', 'scroll'].forEach(evt => input.addEventListener(evt, updateCursor));
    document.addEventListener('selectionchange', () => {
      if (document.activeElement === input) updateCursor();
    });
    input.addEventListener('focus', () => { inputWrap.classList.add('focused'); updateCursor(); });
    input.addEventListener('blur', () => inputWrap.classList.remove('focused'));

    // Tapping the prompt row always brings up the keyboard
    inputRow.addEventListener('click', (e) => {
      if (e.target !== input) focusInput();
    });

    // On desktop, clicking the paper focuses the prompt (unless selecting text
    // or clicking a link). On touch, tapping the paper just scrolls/reads.
    screen.addEventListener('click', (e) => {
      if (isCoarse) return;
      if (e.target.closest('a, button, .cmd-link')) return;
      if (String(window.getSelection() || '')) return;
      focusInput();
    });

    // Typing anywhere on desktop lands in the prompt
    document.addEventListener('keydown', (e) => {
      if (document.activeElement === input) return;
      if (e.target.closest && e.target.closest('button, a, .cmd-link')) {
        if (e.key === 'Enter' || e.key === ' ' || e.key === 'Tab') return;
      }
      if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) focusInput();
    });

    /* =========================================================================
       VIEWPORT: keep the prompt above on-screen keyboards, re-flow on resize
       ========================================================================= */
    function syncViewport() {
      const stick = nearBottom();
      const vv = window.visualViewport;
      if (vv) {
        document.documentElement.style.setProperty('--app-h', `${Math.round(vv.height)}px`);
        // iOS scrolls the whole page when the keyboard opens; pin it back
        if (window.scrollY !== 0) window.scrollTo(0, 0);
      }
      measureCols();
      updateCursor();
      if (stick) screen.scrollTop = screen.scrollHeight;
    }

    let resizeTimer = null;
    const onResize = () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(syncViewport, 60);
    };
    window.addEventListener('resize', onResize);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', onResize);
      window.visualViewport.addEventListener('scroll', () => {
        if (window.scrollY !== 0) window.scrollTo(0, 0);
      });
    }

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && !isInitialBoot) inspectGameFileForUpdates();
    });

    /* =========================================================================
       BOOT
       ========================================================================= */
    const CABINET = new URLSearchParams(location.search).has('cabinet');   /* running inside the cabinet at Last Coin */
    if (CABINET) { const st = document.createElement('style'); st.textContent = '[data-fbl-btn],.mx-btn.fbl-has{display:none!important}'; document.head.appendChild(st); }   /* in the cabinet the town already knows your language */
    async function bootSequence() {
      clearScreen();
      measureCols();
      sound.playTapeMotor();
      print("INITIALIZING MEMEX-68 SUPERVISORY SYSTEM...", "dim");
      print("CORE STORAGE: 32,768 WORDS VERIFIED [PARITY CHECK OK]", "dim");
      print("ENGAGING AUTO-SENSING TAPE DAEMON ON [./game.txt]...", "dim");

      const loadRes = await inspectGameFileForUpdates({ force: true });
      isInitialBoot = false;

      if (loadRes && loadRes.success) {
        print(`[OK] ./game.txt MOUNTED: ${loadRes.count} APPLICATION SECTORS VERIFIED.`, "highlight");
      } else {
        print(`[STANDBY] ACCESS TO ./game.txt UNREACHABLE VIA CURRENT PROTOCOL.`, "dim");
        print(`[RESERVE] ENGAGED CORE ROM REGISTRY (${GAME_CATALOG.map(g => g.code).join(', ')}).`, "system");
      }

      print(" ");
      print(rule('='), "highlight");
      print(center(fit("MEMEX-68 // INTERACTIVE TIME-SHARING REPERTORY TERMINAL", "MEMEX-68 // TIME-SHARING TERMINAL")), "highlight");
      print(center(fit("AUTO-DETECTING EXPEDITION GAME REPERTORY", "EXPEDITION GAME REPERTORY")), "system");
      print(rule('='), "highlight");
      print(" ");
      print("COMMANDS:");
      const ex = exampleCode();
      const cmds = [
        ['CATALOG', 'LIST ALL MOUNTED PROGRAMS'],
        ['RUN <CODE>', `EXECUTE PROGRAM (E.G. 'RUN ${ex}')`],
        ['INFO <CODE>', 'VIEW SYNOPSIS & INSTRUCTIONS'],
        ['RELOAD', 'FORCE DISK POLL ON ./game.txt'],
        ['HELP', 'DISPLAY OPERATOR COMMAND GLOSSARY']
      ];
      if (COLS >= 50) {
        cmds.forEach(([c, d]) => print(`  ${pad(c, 14)}- ${d}`));
      } else {
        cmds.forEach(([c, d]) => { print(`  ${c}`); print(`    ${d}`, 'dim'); });
      }
      print(" ");
      print(fit("[DAEMON ACTIVE: NEW ENTRIES IN GAME.TXT WILL AUTO-MOUNT IN REAL-TIME]",
                "[DAEMON ACTIVE: GAME.TXT AUTO-MOUNTS LIVE]"), "dim");
      if (isCoarse) print("[TAP A KEY BELOW, OR TAP THE EXEC> LINE TO TYPE]", "dim");
      print(" ");
      sound.playBell();
      if (CABINET) setTimeout(displayCatalog, 900);   /* in the bar's cabinet, the list of tapes comes up straight away */

      // Continuous background tape inspection
      setInterval(inspectGameFileForUpdates, POLL_MS);
    }

    window.addEventListener('load', () => {
      loadPrefs();
      syncViewport();
      bootSequence();
      // Don't pop the on-screen keyboard uninvited on phones
      if (!isCoarse) focusInput();
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => { measureCols(); updateCursor(); });
      }
    });
  </script>
<script src="./deck.js"></script>
</body>
