      function build() {

        for (let i = 0; i < 60; i++) { const x = (r() - 0.5) * 2 * R, y = (r() - 0.5) * R * 0.22, w = 80 + r() * 160; const gr = g.createRadialGradient(x, y, 0, x, y, w); gr.addColorStop(0, "rgba(205,212,255,0.1)"); gr.addColorStop(1, "rgba(200,210,255,0)"); g.fillStyle = gr; g.fillRect(x - w, y - w, w * 2, w * 2); }
        for (let i = 0; i < 5200; i++) { const x = (r() - 0.5) * 2 * R, y = (r() + r() + r() - 1.5) * R * 0.12; g.fillStyle = `rgba(235,240,255,${0.3 + r() * 0.6})`; g.fillRect(x, y, r() < 0.85 ? 1 : 2, r() < 0.85 ? 1 : 2); }
        g.restore();

        const n = Math.round(S.fw * S.fh / 900);
        for (let i = 0; i < n; i++) { const a = r() * 0.7 + 0.25; g.fillStyle = `rgba(${230 + r() * 25 | 0},${230 + r() * 25 | 0},255,${a})`; g.fillRect(r() * S.fw, r() * S.fh, 1, 1); }
        S.field = c;

        S.shapes = SHAPES.map(sh => { const k = Math.min(cw, ch) * 1.3; return { n: sh.n, pts: sh.p.map(q => ({ x: (sh.at[0] + q[0]) * k, y: (sh.at[1] + q[1]) * k + ch * 0.3 })), e: sh.e }; });

          sh.pts.forEach(q => { ctx.fillStyle = "rgba(255,252,240,0.95)"; ctx.beginPath(); ctx.arc(q.x, q.y, 1.8, 0, 6.283); ctx.fill(); });

          }

        if (S.sat) { S.sat.x += S.sat.vx * dt; S.sat.y += S.sat.vy * dt; ctx.fillStyle = `rgba(255,255,255,${0.8 * alpha})`; ctx.fillRect(S.sat.x, S.sat.y, 1.6, 1.6); if (S.sat.x > cw + 10) S.sat = null; }

    function initSkyEntities() {
      // 1. Stars for Dusk & Night
      state.stars = [];
      for (let i = 0; i < 120; i++) {
        state.stars.push({
          x: Math.random() * 2000,
          y: Math.random() * 600,
          r: 0.6 + Math.random() * 1.4,
          phase: Math.random() * Math.PI * 2,
          speed: 0.015 + Math.random() * 0.03
        });
      }

      // 2. High-Altitude Cirrus Streaks
      state.cirrusStreaks = [];
      for (let i = 0; i < 7; i++) {
        state.cirrusStreaks.push({
          x: Math.random() * cw,
          y: ch * (0.08 + Math.random() * 0.28),
          len: 180 + Math.random() * 220,
          curve: (Math.random() - 0.5) * 35,
          speed: 0.08 + Math.random() * 0.06,
          alpha: 0.12 + Math.random() * 0.14
        });
      }

      // 3. Volumetric Cumulus Clouds across 3 Parallax Depth Layers
      state.clouds = [];
      const counts = [6, 6, 4];
      counts.forEach((cnt, layer) => {
        for (let i = 0; i < cnt; i++) {
          const sx = (i / cnt) * (cw + 480) - 240 + (Math.random() - 0.5) * 90;
          state.clouds.push(createCloudEntity(layer, sx));
        }
      });

      // 4. Floating Dandelion Pappus Seeds
      state.dandelions = [];
      for (let i = 0; i < 16; i++) {
        state.dandelions.push(createDandelionSeed(Math.random() * cw, ch * (0.45 + Math.random() * 0.5)));
      }

      // 5. Distant Gliding Swallows
      state.swallows = [];
      spawnSwallowFlock();

      // 6. Meadow Grass Silhouette
      initMeadowGrass();
    }

    function createDandelionSeed(x, y) {
      return {
        x,
        y,
        vx: 0.35 + Math.random() * 0.55,
        vy: -0.15 - Math.random() * 0.25,
        angle: (Math.random() - 0.5) * 0.4,
        va: 0,
        size: 7 + Math.random() * 5,
        phase: Math.random() * Math.PI * 2
      };
    }

    function initMeadowGrass() {
      state.meadowBlades = [];
      const bladeCount = Math.min(180, Math.floor(cw / 9));
      for (let i = 0; i <= bladeCount; i++) {
        const bx = (i / bladeCount) * cw + (Math.random() - 0.5) * 8;
        const h = 24 + Math.random() * 44;
        const hasFlower = i % 14 === 0;
        state.meadowBlades.push({
          x: bx,
          h,
          baseLean: (Math.random() - 0.3) * 14,
          currentLean: 0,
          velLean: 0,
          layer: i % 2,
          hasFlower,
          phase: Math.random() * Math.PI * 2
        });
      }
    }

    function spawnSwallowFlock() {
      const startLeft = Math.random() > 0.25;
      const baseX = startLeft ? -80 : cw + 80;
      const baseY = ch * (0.14 + Math.random() * 0.28);
      const dir = startLeft ? 1 : -1;
      const count = 3 + Math.floor(Math.random() * 4);
      state.swallows = [];
      for (let i = 0; i < count; i++) {
        state.swallows.push({
          x: baseX - i * 28 * dir + (Math.random() - 0.5) * 14,
          y: baseY + i * 12 + (Math.random() - 0.5) * 10,
          vx: dir * (0.9 + Math.random() * 0.35),
          vy: (Math.random() - 0.5) * 0.15,
          wingPhase: Math.random() * Math.PI * 2,
          wingSpeed: 0.11 + Math.random() * 0.04,
          size: 4.5 + Math.random() * 2.5
        });
      }
    }

    /*************************************************************************
     * 5. VOLUMETRIC CLOUD RENDERING & PAREIDOLIA MORPHING
     *************************************************************************/
    function drawSingleVolumetricPuff(px, py, radius, sunVecX, sunVecY, alphaMultiplier = 1.0) {
      if (px + radius < -60 || px - radius > cw + 60 || py + radius < -60 || py - radius > ch + 60) return;

      // 1. Soft Ambient Base Shadow (shifted away from sun toward cloud bottom)
      const shX = px - sunVecX * radius * 0.22;
      const shY = py + radius * 0.24;
      const shGrad = ctx.createRadialGradient(shX, shY, radius * 0.1, shX, shY, radius * 1.05);
      shGrad.addColorStop(0, rgbStr(activeColors.cloudShadow, 0.42 * alphaMultiplier));
      shGrad.addColorStop(0.6, rgbStr(activeColors.cloudShadow, 0.18 * alphaMultiplier));
      shGrad.addColorStop(1, rgbStr(activeColors.cloudShadow, 0));
      ctx.fillStyle = shGrad;
      ctx.beginPath();
      ctx.arc(shX, shY, radius * 1.05, 0, Math.PI * 2);
      ctx.fill();

      // 2. Core Creamy Cumulus Volume
      const midGrad = ctx.createRadialGradient(px, py, radius * 0.12, px, py, radius);
      midGrad.addColorStop(0, rgbStr(activeColors.cloudMid, 0.82 * alphaMultiplier));
      midGrad.addColorStop(0.58, rgbStr(activeColors.cloudMid, 0.46 * alphaMultiplier));
      midGrad.addColorStop(1, rgbStr(activeColors.cloudMid, 0));
      ctx.fillStyle = midGrad;
      ctx.beginPath();
      ctx.arc(px, py, radius, 0, Math.PI * 2);
      ctx.fill();

      // 3. Sunlit Top Crest & Silver Lining (shifted toward sun vector)
      const hiX = px + sunVecX * radius * 0.26;
      const hiY = py + sunVecY * radius * 0.26 - radius * 0.14;
      const hiRadius = radius * 0.86;
      const hiGrad = ctx.createRadialGradient(hiX, hiY, hiRadius * 0.08, hiX, hiY, hiRadius);
      hiGrad.addColorStop(0, rgbStr(activeColors.cloudHighlight, 0.92 * alphaMultiplier));
      hiGrad.addColorStop(0.52, rgbStr(activeColors.cloudHighlight, 0.45 * alphaMultiplier));
      hiGrad.addColorStop(1, rgbStr(activeColors.cloudHighlight, 0));
      ctx.fillStyle = hiGrad;
      ctx.beginPath();
      ctx.arc(hiX, hiY, hiRadius, 0, Math.PI * 2);
      ctx.fill();
    }

    function updateAndDrawClouds(dt, sunVecX, sunVecY) {
      const windPush = state.breezeSpeed + Math.sin(performance.now() * 0.0005) * 0.18;

      state.clouds.forEach(cloud => {
        cloud.x += cloud.speed * windPush * dt;
        const wrapMargin = cloud.widthSpan + 160;
        if (cloud.x > cw + wrapMargin) {
          cloud.x = -wrapMargin;
        }

        // Update each puff with organic billowing + tactile cursor breeze repulsion
        cloud.puffs.forEach(puff => {
          puff.phase += puff.breatheSpeed * dt;
          const billowX = Math.cos(puff.phase) * 3.5;
          const billowY = Math.sin(puff.phase * 1.2) * 2.8;

          const worldX = cloud.x + puff.ox + billowX;
          const worldY = cloud.y + puff.oy + billowY;

          // Tactile Wind Cursor Physics: gently part and billow puffs when cursor sweeps through
          if (state.pointer.active) {
            const dx = worldX - state.pointer.x;
            const dy = worldY - state.pointer.y;
            const dist = Math.hypot(dx, dy);
            const influenceRadius = puff.r + 75;
            if (dist < influenceRadius && dist > 1) {
              const force = Math.pow(1 - dist / influenceRadius, 2);
              puff.vx += ((dx / dist) * 0.45 + state.pointer.vx * 0.06) * force * dt;
              puff.vy += ((dy / dist) * 0.45 + state.pointer.vy * 0.06) * force * dt;

              // Spawn delicate detached cloud wisp if cursor moves briskly through a cloud
              if (Math.hypot(state.pointer.vx, state.pointer.vy) > 6 && Math.random() < 0.08) {
                state.wispParticles.push({
                  x: state.pointer.x + (Math.random() - 0.5) * 24,
                  y: state.pointer.y + (Math.random() - 0.5) * 24,
                  vx: state.pointer.vx * 0.18 + (Math.random() - 0.5) * 0.6,
                  vy: state.pointer.vy * 0.18 - 0.25,
                  r: 14 + Math.random() * 18,
                  alpha: 0.65
                });
              }
            }
          }

          // Soft spring return toward home offset within the cloud cluster
          puff.vx += (puff.homeOx - puff.ox) * 0.012 * dt;
          puff.vy += (puff.homeOy - puff.oy) * 0.012 * dt;
          puff.vx *= 0.92;
          puff.vy *= 0.92;
          puff.ox += puff.vx * dt;
          puff.oy += puff.vy * dt;

          const layerAlpha = cloud.layer === 0 ? 0.62 : cloud.layer === 1 ? 0.84 : 0.96;
          drawSingleVolumetricPuff(worldX, worldY, puff.r, sunVecX, sunVecY, layerAlpha * STARGAZE.veil * STARGAZE.veil);   /* a clear night thins the clouds (puffs overlap, so squared) */
        });
      });

      // Draw Pareidolia Daydream Cloud Formation if active
      if (state.pareidolia.active) {
        updateAndDrawPareidoliaCloud(dt, sunVecX, sunVecY);
      }

      // Draw Detached Cursor Wisp Puffs
      for (let i = state.wispParticles.length - 1; i >= 0; i--) {
        const w = state.wispParticles[i];
        w.x += (w.vx + state.breezeSpeed * 0.25) * dt;
        w.y += w.vy * dt;
        w.r += 0.12 * dt;
        w.alpha -= 0.009 * dt;
        if (w.alpha <= 0.01) {
          state.wispParticles.splice(i, 1);
          continue;
        }
        drawSingleVolumetricPuff(w.x, w.y, w.r, sunVecX, sunVecY, w.alpha);
      }
    }

    /*************************************************************************
     * 6. PAREIDOLIA CLOUD-SHAPING ENGINE ("DAYDREAM A SHAPE")
     *************************************************************************/
    const SHAPE_KEYS = Object.keys(PAREIDOLIA_SHAPES);
    let lastShapeIdx = -1;

    function triggerRandomPareidolia(customX, customY) {
      lastShapeIdx = (lastShapeIdx + 1) % SHAPE_KEYS.length;
      triggerPareidoliaShape(SHAPE_KEYS[lastShapeIdx], customX, customY);
    }

    function triggerPareidoliaShape(shapeKey, customX, customY) {
      const template = PAREIDOLIA_SHAPES[shapeKey] || PAREIDOLIA_SHAPES.whale;
      const cx = customX !== undefined ? customX : cw * (0.42 + (Math.random() - 0.5) * 0.16);
      const cy = customY !== undefined ? customY : ch * (0.34 + (Math.random() - 0.5) * 0.12);
      const responsiveScale = Math.min(1.15, Math.max(0.68, Math.min(cw, ch) / 760));

      state.pareidolia.active = true;
      state.pareidolia.shapeKey = shapeKey;
      state.pareidolia.centerX = cx;
      state.pareidolia.centerY = cy;
      state.pareidolia.timer = 0;

      // Spawn puffs scattered around the sky that softly coalesce into the silhouette
      state.pareidolia.puffs = template.points.map((pt, idx) => {
        const angle = (idx / template.points.length) * Math.PI * 2 + Math.random() * 0.5;
        const startDist = 140 + Math.random() * 140;
        return {
          targetOx: pt.x * responsiveScale,
          targetOy: pt.y * responsiveScale,
          ox: Math.cos(angle) * startDist,
          oy: Math.sin(angle) * startDist,
          vx: 0,
          vy: 0,
          r: pt.r * responsiveScale,
          phase: Math.random() * Math.PI * 2
        };
      });

      // Show poetic whisper caption
      const whisper = $id("pareidoliaWhisper");
      const text = $id("pareidoliaWhisperText");
      text.textContent = template.caption;
      whisper.style.opacity = "1";
      clearTimeout(whisper._timer);
      whisper._timer = setTimeout(() => {
        whisper.style.opacity = "0";
      }, 5200);

      // Hide picker panel if open & chime softly
      $id("pareidoliaPickerPanel").classList.add("hidden");
      triggerSingleWindChime(0);
    }

    function updateAndDrawPareidoliaCloud(dt, sunVecX, sunVecY) {
      const p = state.pareidolia;
      p.timer += dt;
      p.centerX += state.breezeSpeed * 0.22 * dt;

      // Envelope: 0-120 coalescing, 120-700 holding silhouette, 700-880 dissolving into breeze
      let alpha = 1.0;
      if (p.timer < 90) {
        alpha = p.timer / 90;
      } else if (p.timer > 680) {
        alpha = Math.max(0, 1 - (p.timer - 680) / 180);
      }

      if (p.timer >= 860) {
        p.active = false;
        return;
      }

      const dissolving = p.timer > 680;

      p.puffs.forEach(puff => {
        puff.phase += 0.015 * dt;
        const breatheX = Math.cos(puff.phase) * 2.5;
        const breatheY = Math.sin(puff.phase) * 2.5;

        if (!dissolving) {
          // Coalesce smoothly toward target silhouette point
          puff.ox += (puff.targetOx - puff.ox) * 0.042 * dt;
          puff.oy += (puff.targetOy - puff.oy) * 0.042 * dt;
        } else {
          // Drift apart gently into natural cumulus wisps
          puff.ox += (Math.cos(puff.phase) * 0.6 + 0.35) * dt;
          puff.oy -= 0.25 * dt;
          puff.r += 0.08 * dt;
        }

        const worldX = p.centerX + puff.ox + breatheX;
        const worldY = p.centerY + puff.oy + breatheY;

        // Cursor breeze nudge on pareidolia puffs
        if (state.pointer.active) {
          const dx = worldX - state.pointer.x;
          const dy = worldY - state.pointer.y;
          const dist = Math.hypot(dx, dy);
          if (dist < puff.r + 60 && dist > 1) {
            const push = (1 - dist / (puff.r + 60)) * 1.4;
            puff.ox += (dx / dist) * push * dt;
            puff.oy += (dy / dist) * push * dt;
          }
        }

        drawSingleVolumetricPuff(worldX, worldY, puff.r, sunVecX, sunVecY, alpha * 0.96);
      });
    }

    /*************************************************************************
     * 7. "RELEASE A THOUGHT" (BLANK MIND EVAPORATION ANIMATION)
     *************************************************************************/
    function openThoughtReleasePanel() {
      const panel = $id("thoughtReleasePanel");
      panel.classList.remove("hidden");
      $id("pareidoliaPickerPanel").classList.add("hidden");
      setTimeout(() => {
        $id("thoughtInput").focus();
      }, 60);
    }

    function handleReleaseThoughtSubmit(e) {
      e.preventDefault();
      const input = $id("thoughtInput");
      const text = input.value.trim();
      if (!text) return;

      // Convert each character of the thought into a floating particle that rises & morphs into a cloud puff
      const startY = ch * 0.72;
      const charSpacing = Math.min(18, (cw * 0.7) / Math.max(1, text.length));
      const totalW = text.length * charSpacing;
      const startX = (cw - totalW) * 0.5;

      for (let i = 0; i < text.length; i++) {
        const chChar = text[i];
        if (chChar === " ") continue;
        state.thoughtParticles.push({
          char: chChar,
          x: startX + i * charSpacing,
          y: startY + (Math.random() - 0.5) * 6,
          vx: (Math.random() - 0.5) * 0.4 + 0.15,
          vy: -0.65 - Math.random() * 0.45,
          age: -i * 2.5, // Staggered liftoff
          puffRadius: 16 + Math.random() * 16,
          phase: Math.random() * Math.PI * 2
        });
      }

      input.value = "";
      $id("thoughtReleasePanel").classList.add("hidden");
      triggerSingleWindChime(-0.3);
      setTimeout(() => triggerSingleWindChime(0.35), 240);
    }

    function updateAndDrawThoughtParticles(dt, sunVecX, sunVecY) {
      for (let i = state.thoughtParticles.length - 1; i >= 0; i--) {
        const tp = state.thoughtParticles[i];
        tp.age += dt;
        if (tp.age < 0) continue;

        tp.phase += 0.03 * dt;
        tp.x += (tp.vx + Math.sin(tp.phase) * 0.35 + state.breezeSpeed * 0.25) * dt;
        tp.y += tp.vy * dt;

        // Stage 1 (age 0..110): Floating serif character rising into sky
        // Stage 2 (age 60..220): Morphs into a miniature volumetric cloud puff & evaporates
        const textAlpha = Math.max(0, 1 - tp.age / 105);
        const puffAlpha = tp.age < 50
          ? 0
          : tp.age < 120
          ? ((tp.age - 50) / 70) * 0.75
          : Math.max(0, (1 - (tp.age - 120) / 130) * 0.75);

        if (puffAlpha > 0.01) {
          drawSingleVolumetricPuff(tp.x, tp.y, tp.puffRadius * (0.7 + tp.age * 0.005), sunVecX, sunVecY, puffAlpha);
        }

        if (textAlpha > 0.01) {
          ctx.save();
          ctx.font = "italic 24px 'Instrument Serif', Georgia, serif";
          ctx.fillStyle = `rgba(255, 255, 255, ${textAlpha})`;
          ctx.shadowColor = "rgba(255, 255, 255, 0.65)";
          ctx.shadowBlur = 10;
          ctx.textAlign = "center";
          ctx.fillText(tp.char, tp.x, tp.y);
          ctx.restore();
        }

        if (tp.age > 255) {
          state.thoughtParticles.splice(i, 1);
        }
      }
    }

    /*************************************************************************
     * 8. FOREGROUND MEADOW WHISPER, DANDELION SEEDS & DISTANT SWALLOWS
     *************************************************************************/
    function updateAndDrawSwallows(dt) {
      let allOffscreen = true;
      ctx.save();
      ctx.strokeStyle = targetPaletteKey === "night"
        ? "rgba(210, 225, 245, 0.45)"
        : "rgba(35, 58, 88, 0.42)";
      ctx.lineWidth = 1.6;
      ctx.lineCap = "round";

      state.swallows.forEach(b => {
        b.x += b.vx * dt;
        b.y += (b.vy + Math.sin(b.wingPhase * 0.25) * 0.12) * dt;
        b.wingPhase += b.wingSpeed * dt;

        if (b.x > -140 && b.x < cw + 140) allOffscreen = false;

        const wingY = Math.sin(b.wingPhase) * b.size * 0.75;
        ctx.beginPath();
        ctx.moveTo(b.x - b.size, b.y - wingY);
        ctx.quadraticCurveTo(b.x - b.size * 0.3, b.y - b.size * 0.3, b.x, b.y);
        ctx.quadraticCurveTo(b.x + b.size * 0.3, b.y - b.size * 0.3, b.x + b.size, b.y - wingY);
        ctx.stroke();
      });
      ctx.restore();

      if (allOffscreen && Math.random() < 0.005) {
        spawnSwallowFlock();
      }
    }

    function updateAndDrawDandelions(dt) {
      state.dandelions.forEach(d => {
        d.phase += 0.025 * dt;
        const gustX = state.breezeSpeed * 0.55 + Math.sin(d.phase) * 0.22;
        const gustY = Math.cos(d.phase * 0.8) * 0.18 - 0.05;

        // Cursor breeze interaction on dandelion seeds
        if (state.pointer.active) {
          const dx = d.x - state.pointer.x;
          const dy = d.y - state.pointer.y;
          const dist = Math.hypot(dx, dy);
          if (dist < 110 && dist > 1) {
            const push = (1 - dist / 110) * 0.35;
            d.vx += (dx / dist) * push + state.pointer.vx * 0.02;
            d.vy += (dy / dist) * push + state.pointer.vy * 0.02;
          }
        }

        d.vx += (gustX - d.vx) * 0.03 * dt;
        d.vy += (gustY - d.vy) * 0.03 * dt;
        d.x += d.vx * dt;
        d.y += d.vy * dt;

        const targetAngle = Math.atan2(d.vx, 1.5) * 0.5;
        d.angle += (targetAngle - d.angle) * 0.08 * dt;

        // Wrap around screen
        if (d.x > cw + 40) { d.x = -30; d.y = ch * (0.5 + Math.random() * 0.45); }
        if (d.y < -40) { d.y = ch - 20; d.x = Math.random() * cw; }
        if (d.y > ch + 30) { d.y = ch * 0.75; }

        // Draw delicate dandelion pappus filament umbrella & seed achene
        ctx.save();
        ctx.translate(d.x, d.y);
        ctx.rotate(d.angle);

        ctx.strokeStyle = "rgba(255, 255, 255, 0.68)";
        ctx.lineWidth = 0.85;
        // Stem
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(0, d.size);
        ctx.stroke();

        // radiating parachute filaments
        for (let f = -3; f <= 3; f++) {
          const fa = (f / 3) * 0.75 - Math.PI / 2;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(Math.cos(fa) * d.size * 0.85, Math.sin(fa) * d.size * 0.85);
          ctx.stroke();
        }

        // Glow tip at center of pappus
        ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
        ctx.beginPath();
        ctx.arc(0, 0, 1.4, 0, Math.PI * 2);
        ctx.fill();

        // Tiny seed grain at bottom
        ctx.fillStyle = "rgba(220, 210, 190, 0.85)";
        ctx.beginPath();
        ctx.arc(0, d.size, 1.1, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      });
    }

    function spawnDandelionGust() {
      for (let i = 0; i < 8; i++) {
        const seed = state.dandelions[i % state.dandelions.length];
        seed.x = cw * (0.2 + Math.random() * 0.6);
        seed.y = ch - 25 - Math.random() * 20;
        seed.vx = 0.8 + Math.random() * 1.2;
        seed.vy = -1.2 - Math.random() * 0.9;
      }
      triggerSingleWindChime(0.2);
    }

    function updateAndDrawMeadowWhisper(dt, now) {
      const windWave = now * 0.0018;

      state.meadowBlades.forEach(b => {
        const naturalSway = Math.sin(windWave + b.x * 0.012 + b.phase) * (8 + state.breezeSpeed * 9) + b.baseLean;
        let cursorForce = 0;
        if (state.pointer.active && state.pointer.y > ch - 130) {
          const dx = b.x - state.pointer.x;
          if (Math.abs(dx) < 90) {
            cursorForce = ((90 - Math.abs(dx)) / 90) * state.pointer.vx * 1.3;
          }
        }

        const targetLean = naturalSway + cursorForce;
        b.velLean += (targetLean - b.currentLean) * 0.08 * dt;
        b.velLean *= 0.86;
        b.currentLean += b.velLean * dt;

        const tipX = b.x + b.currentLean;
        const tipY = ch - b.h;

        ctx.beginPath();
        ctx.moveTo(b.x, ch + 2);
        ctx.quadraticCurveTo(b.x + b.currentLean * 0.35, ch - b.h * 0.5, tipX, tipY);
        ctx.strokeStyle = b.layer === 0
          ? rgbStr(activeColors.meadowFar, 0.55)
          : rgbStr(activeColors.meadowNear, 0.78);
        ctx.lineWidth = b.layer === 0 ? 1.4 : 2.0;
        ctx.lineCap = "round";
        ctx.stroke();

        // Delicate dandelion puff head on select stems
        if (b.hasFlower) {
          ctx.fillStyle = "rgba(255, 255, 255, 0.45)";
          ctx.beginPath();
          ctx.arc(tipX, tipY, 3.8, 0, Math.PI * 2);
          ctx.fill();
        }
      });
    }

    /*************************************************************************
     * 9. MAIN 60FPS SKY ANIMATION LOOP
     *************************************************************************/
    let lastFrameMs = performance.now();

    function animateSky(now) {
      const dt = Math.min((now - lastFrameMs) / 16.667, 2.5);
      lastFrameMs = now;

      // 1. Smoothly interpolate sky & cloud colors toward target palette
      const targetPal = SKY_PALETTES[targetPaletteKey];
      const lerpRate = 0.03 * dt;
      lerpColorArray(activeColors.skyTop, targetPal.skyTop, lerpRate);
      lerpColorArray(activeColors.skyMid, targetPal.skyMid, lerpRate);
      lerpColorArray(activeColors.skyHorizon, targetPal.skyHorizon, lerpRate);
      lerpColorArray(activeColors.sunColor, targetPal.sunColor, lerpRate);
      lerpColorArray(activeColors.cloudHighlight, targetPal.cloudHighlight, lerpRate);
      lerpColorArray(activeColors.cloudMid, targetPal.cloudMid, lerpRate);
      lerpColorArray(activeColors.cloudShadow, targetPal.cloudShadow, lerpRate);
      lerpColorArray(activeColors.meadowFar, targetPal.meadowFar, lerpRate);
      lerpColorArray(activeColors.meadowNear, targetPal.meadowNear, lerpRate);
      activeColors.starAlpha += (targetPal.starAlpha - activeColors.starAlpha) * lerpRate;
      activeColors.sunPos.x += (targetPal.sunPos.x - activeColors.sunPos.x) * lerpRate;
      activeColors.sunPos.y += (targetPal.sunPos.y - activeColors.sunPos.y) * lerpRate;

      // 2. Render Atmospheric Sky Gradient
      const skyGrad = ctx.createLinearGradient(0, 0, 0, ch);
      skyGrad.addColorStop(0, rgbStr(activeColors.skyTop));
      skyGrad.addColorStop(0.58, rgbStr(activeColors.skyMid));
      skyGrad.addColorStop(1, rgbStr(activeColors.skyHorizon));
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, cw, ch);

      // 3. Stars. On a clear night the clouds thin out and the whole sky turns slowly overhead: the Milky Way,
      //    bright stars that twinkle, a satellite now and then, and if you lie still a while, the old shapes join up.
      STARGAZE.veil += ((STARGAZE.on() ? 0.1 : 1) - STARGAZE.veil) * 0.01 * dt;
      if (STARGAZE.on() || STARGAZE.veil < 0.95) STARGAZE.draw(now, dt, activeColors.starAlpha * (1 - STARGAZE.veil) / 0.9);
      if (activeColors.starAlpha > 0.02 && STARGAZE.veil > 0.5) {
        state.stars.forEach(s => {
          s.phase += s.speed * dt;
          const twinkle = (0.35 + 0.65 * Math.sin(s.phase)) * activeColors.starAlpha;
          ctx.fillStyle = `rgba(255, 255, 255, ${twinkle})`;
          const sx = s.x % cw;
          const sy = s.y % (ch * 0.65);
          ctx.beginPath();
          ctx.arc(sx, sy, s.r, 0, Math.PI * 2);
          ctx.fill();
        });
      }

      // 4. Render Sun Halo or Crescent Moon
      const sunX = cw * activeColors.sunPos.x;
      const sunY = ch * activeColors.sunPos.y;
      const sunHalo = ctx.createRadialGradient(sunX, sunY, 8, sunX, sunY, Math.max(cw, ch) * 0.36);
      sunHalo.addColorStop(0, rgbStr(activeColors.sunColor, 0.55));
      sunHalo.addColorStop(0.25, rgbStr(activeColors.sunColor, 0.18));
      sunHalo.addColorStop(1, rgbStr(activeColors.sunColor, 0));
      ctx.fillStyle = sunHalo;
      ctx.fillRect(0, 0, cw, ch);

      if (targetPaletteKey === "night") {
        // Delicate Crescent Moon
        ctx.save();
        ctx.beginPath(); ctx.arc(sunX, sunY, 20, 0, Math.PI * 2); ctx.clip();   /* a true crescent: the shadow is cut out, not painted over */
        ctx.fillStyle = "rgba(240, 248, 255, 0.92)";
        ctx.beginPath(); ctx.rect(sunX - 22, sunY - 22, 44, 44); ctx.arc(sunX - 7, sunY - 5, 18, 0, Math.PI * 2, true);
        ctx.fill("evenodd");
        ctx.restore();
      }

      // 5. Render High-Altitude Cirrus Wisps
      ctx.save();
      state.cirrusStreaks.forEach(c => {
        c.x += c.speed * state.breezeSpeed * dt;
        if (c.x - c.len > cw) c.x = -c.len;
        /* mare's tails: a few fine feathered strands instead of one thick bar; barely there at night */
        const wa = c.alpha * (targetPaletteKey === "night" ? 0.35 : 0.8) * STARGAZE.veil;
        for (let k = 0; k < 5; k++) {
          const off = (k - 2) * 4, l = c.len * (0.75 + ((k * 37) % 10) / 40);
          const cGrad = ctx.createLinearGradient(c.x - l, c.y, c.x + l, c.y);
          cGrad.addColorStop(0, rgbStr(activeColors.cloudHighlight, 0));
          cGrad.addColorStop(0.5, rgbStr(activeColors.cloudHighlight, wa * (k === 2 ? 0.9 : 0.5)));
          cGrad.addColorStop(1, rgbStr(activeColors.cloudHighlight, 0));
          ctx.strokeStyle = cGrad; ctx.lineWidth = k === 2 ? 3.5 : 1.6; ctx.lineCap = "round";
          ctx.beginPath(); ctx.moveTo(c.x - l, c.y + off); ctx.quadraticCurveTo(c.x, c.y + c.curve + off * 1.6, c.x + l, c.y + off - c.curve * 0.2); ctx.stroke();
        }
      });
      ctx.restore();

      // 6. Render Distant Gliding Swallows (they roost at night)
      if (targetPaletteKey !== "night") updateAndDrawSwallows(dt);

      // Sun direction vector for volumetric cloud crests
      const sunVecX = (sunX - cw * 0.5) / (cw * 0.6);
      const sunVecY = (sunY - ch * 0.5) / (ch * 0.6);

      // 7. Render Multi-Layered Volumetric Cumulus & Pareidolia Clouds
      updateAndDrawClouds(dt, sunVecX, sunVecY);

      // 8. Render Floating "Release a Thought" Letters & Evaporating Puffs
      updateAndDrawThoughtParticles(dt, sunVecX, sunVecY);

      // 9. Render Floating Dandelion Pappus Seeds
      updateAndDrawDandelions(dt);

      // 10. Render Bottom Foreground Meadow Grass Whisper
      updateAndDrawMeadowWhisper(dt, now);

      // Decay pointer velocity
      state.pointer.vx *= 0.88;
      state.pointer.vy *= 0.88;

      // Modulate real-time wind audio with pointer speed
      modulateWindSoundWithPointer();

      requestAnimationFrame(animateSky);
    }

    /*************************************************************************
     * 10. SPATIAL NATURAL SOUNDSCAPE (WEB AUDIO API + BINAURAL STEREO PANNING)
     *************************************************************************/
    let audioCtx = null;
    let isAudioPlaying = false;

    const soundVolumes = {
      wind: 0.70,
      birds: 0.65,
      chimes: 0,   /* Lie Back Park is nature and animals only: no chimes, no pad */
      pad: 0
    };

    let windLeftFilter = null, windRightFilter = null;
    let windMasterGain = null, padMasterGain = null;
    let birdLoopTimer = null, chimeLoopTimer = null;

    function initSpatialAudioEngine() {
      if (audioCtx) return;
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContextClass();

      // -------------------------------------------------------------------
      // 1. HIGH MEADOW WIND (Dual Stereo-Panned Pink Noise + Resonant Sweep)
      // -------------------------------------------------------------------
      windMasterGain = audioCtx.createGain();
      windMasterGain.gain.value = soundVolumes.wind * 0.32;
      windMasterGain.connect(audioCtx.destination);

      const createStereoWindBranch = (panVal, baseFreq) => {
        const bufSize = audioCtx.sampleRate * 4;
        const noiseBuf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
        const data = noiseBuf.getChannelData(0);
        let b0 = 0, b1 = 0, b2 = 0;
        for (let i = 0; i < bufSize; i++) {
          const white = Math.random() * 2 - 1;
          b0 = 0.997 * b0 + white * 0.029;
          b1 = 0.985 * b1 + white * 0.032;
          b2 = 0.950 * b2 + white * 0.048;
          data[i] = (b0 + b1 + b2) * 0.35;
        }
        const src = audioCtx.createBufferSource();
        src.buffer = noiseBuf;
        src.loop = true;

        const filter = audioCtx.createBiquadFilter();
        filter.type = "bandpass";
        filter.frequency.value = baseFreq;
        filter.Q.value = 1.6;

        const panner = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;
        if (panner) {
          panner.pan.value = panVal;
          src.connect(filter);
          filter.connect(panner);
          panner.connect(windMasterGain);
        } else {
          src.connect(filter);
          filter.connect(windMasterGain);
        }
        src.start();
        return filter;
      };

      windLeftFilter = createStereoWindBranch(-0.65, 320);
      windRightFilter = createStereoWindBranch(0.65, 410);

      // -------------------------------------------------------------------
      // 2. HORIZON BREATH PAD (Warm Open-Ninth Harmonic Air Drone)
      // -------------------------------------------------------------------
      padMasterGain = audioCtx.createGain();
      padMasterGain.gain.value = soundVolumes.pad * 0.14;
      padMasterGain.connect(audioCtx.destination);

      const padFreqs = [146.83, 220.00, 293.66, 329.63, 440.00]; // D major 9th open air chord
      padFreqs.forEach((f, idx) => {
        const osc = audioCtx.createOscillator();
        osc.type = "sine";
        osc.frequency.value = f;

        const lfo = audioCtx.createOscillator();
        lfo.frequency.value = 0.08 + idx * 0.03;
        const lfoGain = audioCtx.createGain();
        lfoGain.gain.value = 0.03;

        const voiceGain = audioCtx.createGain();
        voiceGain.gain.value = 0.06 / (idx * 0.4 + 1);
        lfo.connect(voiceGain.gain);

        const panner = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;
        if (panner) {
          panner.pan.value = (idx % 2 === 0 ? -1 : 1) * 0.45;
          osc.connect(voiceGain);
          voiceGain.connect(panner);
          panner.connect(padMasterGain);
        } else {
          osc.connect(voiceGain);
          voiceGain.connect(padMasterGain);
        }
        osc.start();
        lfo.start();
      });
    }

    function modulateWindSoundWithPointer() {
      if (!isAudioPlaying || !audioCtx || !windLeftFilter || !windRightFilter) return;
      const pointerSpeed = Math.min(25, Math.hypot(state.pointer.vx, state.pointer.vy));
      const t = performance.now() * 0.0004;
      const freqL = 260 + Math.sin(t) * 90 + pointerSpeed * 14 * state.breezeSpeed;
      const freqR = 320 + Math.cos(t * 0.85) * 110 + pointerSpeed * 16 * state.breezeSpeed;
      windLeftFilter.frequency.setTargetAtTime(freqL, audioCtx.currentTime, 0.12);
      windRightFilter.frequency.setTargetAtTime(freqR, audioCtx.currentTime, 0.12);
    }

    // -------------------------------------------------------------------
    // 3. DISTANT SKYLARKS (Melodic Stereo-Panned Bird Calls)
    // -------------------------------------------------------------------
    function startSkylarkLoop() {
      if (birdLoopTimer) clearTimeout(birdLoopTimer);
      const loop = () => {
        if (!isAudioPlaying) return;
        if (soundVolumes.birds > 0.02 && targetPaletteKey !== "night") {
          triggerStereoSkylarkCall();
        }
        birdLoopTimer = setTimeout(loop, 3200 + Math.random() * 4800);
      };
      birdLoopTimer = setTimeout(loop, 1200);
    }

    function triggerStereoSkylarkCall() {
      if (!audioCtx || !isAudioPlaying) return;
      const now = audioCtx.currentTime;
      const panPos = (Math.random() * 1.6) - 0.8; // -0.8 (Left) to +0.8 (Right)
      const panner = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;
      const callGain = audioCtx.createGain();
      callGain.gain.value = soundVolumes.birds * 0.05;

      if (panner) {
        panner.pan.setValueAtTime(panPos, now);
        callGain.connect(panner);
        panner.connect(audioCtx.destination);
      } else {
        callGain.connect(audioCtx.destination);
      }

      // 3- to 5-note skylark melodic phrase
      const notesCount = 3 + Math.floor(Math.random() * 3);
      const baseNote = 1760 + Math.random() * 680;
      let offset = 0;

      for (let i = 0; i < notesCount; i++) {
        const dur = 0.08 + Math.random() * 0.09;
        const startF = baseNote * (1 + (i % 2) * 0.18);
        const endF = startF * (Math.random() > 0.4 ? 1.22 : 0.86);

        const osc = audioCtx.createOscillator();
        const env = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(startF, now + offset);
        osc.frequency.exponentialRampToValueAtTime(endF, now + offset + dur);

        env.gain.setValueAtTime(0.0001, now + offset);
        env.gain.linearRampToValueAtTime(0.65, now + offset + dur * 0.25);
        env.gain.exponentialRampToValueAtTime(0.0001, now + offset + dur);

        osc.connect(env);
        env.connect(callGain);
        osc.start(now + offset);
        osc.stop(now + offset + dur + 0.02);

        offset += dur + 0.04 + Math.random() * 0.05;
      }
    }

    // -------------------------------------------------------------------
    // 4. SUNLIT WIND CHIMES (Sparse Acoustic Pentatonic Stereo Chimes)
    // -------------------------------------------------------------------
    function startWindChimeLoop() {
      if (chimeLoopTimer) clearTimeout(chimeLoopTimer);
      const loop = () => {
        if (!isAudioPlaying) return;
        if (soundVolumes.chimes > 0.02) {
          const pan = (Math.random() - 0.5) * 1.4;
          triggerSingleWindChime(pan);
        }
        chimeLoopTimer = setTimeout(loop, 2800 + Math.random() * 4400);
      };
      chimeLoopTimer = setTimeout(loop, 1800);
    }

    function triggerSingleWindChime(panPos = 0) {
      if (!audioCtx || !isAudioPlaying || soundVolumes.chimes <= 0.02) return;
      const now = audioCtx.currentTime;
      const scale = [587.33, 659.25, 739.99, 880.00, 987.77, 1174.66, 1318.51]; // D Major Pentatonic
      const freq = scale[Math.floor(Math.random() * scale.length)];

      const panner = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;
      const outNode = panner || audioCtx.destination;
      if (panner) {
        panner.pan.setValueAtTime(panPos, now);
        panner.connect(audioCtx.destination);
      }

      // Fundamental + metallic shimmer harmonic
      [1, 2.756].forEach((mult, idx) => {
        const osc = audioCtx.createOscillator();
        const env = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq * mult, now);

        const peak = (idx === 0 ? 0.08 : 0.022) * soundVolumes.chimes;
        const decay = idx === 0 ? 2.6 : 0.9;

        env.gain.setValueAtTime(0.0001, now);
        env.gain.linearRampToValueAtTime(peak, now + 0.015);
        env.gain.exponentialRampToValueAtTime(0.0001, now + decay);

        osc.connect(env);
        env.connect(outNode);
        osc.start(now);
        osc.stop(now + decay + 0.05);
      });
    }

    (window.FB_SOUND_ON = window.FB_SOUND_ON || []).push(function () { if (!isAudioPlaying) toggleAudioEngine(); });   /* in town: the soundscape starts with your first tap; 🔈 in the top bar is the switch */
    function toggleAudioEngine() {
      initSpatialAudioEngine();
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
      isAudioPlaying = !isAudioPlaying;

      const label = $id("audioMasterLabel");
      const dot = $id("audioPulseDot");
      const btn = $id("audioMasterBtn");

      if (isAudioPlaying) {
        windMasterGain.gain.setTargetAtTime(soundVolumes.wind * 0.32, audioCtx.currentTime, 0.3);
        padMasterGain.gain.setTargetAtTime(soundVolumes.pad * 0.14, audioCtx.currentTime, 0.3);
        startSkylarkLoop();
        startWindChimeLoop();
        label.textContent = "Soundscape: On";
        dot.className = "w-2 h-2 rounded-full bg-emerald-300 animate-ping";
        btn.classList.add("bg-white/30");
      } else {
        windMasterGain.gain.setTargetAtTime(0.0001, audioCtx.currentTime, 0.25);
        padMasterGain.gain.setTargetAtTime(0.0001, audioCtx.currentTime, 0.25);
        if (birdLoopTimer) clearTimeout(birdLoopTimer);
        if (chimeLoopTimer) clearTimeout(chimeLoopTimer);
        label.textContent = "Soundscape: Off";
        dot.className = "w-2 h-2 rounded-full bg-white/60";
        btn.classList.remove("bg-white/30");
      }
    }

    function setSoundChannelVolume(channel, val) {
      soundVolumes[channel] = Number(val) / 100;
      const lbl = $id(`volLabel-${channel}`);
      if (lbl) lbl.textContent = `${val}%`;

      if (!audioCtx || !isAudioPlaying) return;
      if (channel === "wind" && windMasterGain) {
        windMasterGain.gain.setTargetAtTime(soundVolumes.wind * 0.32, audioCtx.currentTime, 0.1);
      } else if (channel === "pad" && padMasterGain) {
        padMasterGain.gain.setTargetAtTime(soundVolumes.pad * 0.14, audioCtx.currentTime, 0.1);
      }
    }

    function setBreezeSpeed(val) {
      state.breezeSpeed = Number(val) / 100;
      const lbl = $id("breezeSpeedLabel");
      if (state.breezeSpeed < 0.5) lbl.textContent = "Still";
      else if (state.breezeSpeed < 1.0) lbl.textContent = "Gentle";
      else if (state.breezeSpeed < 1.4) lbl.textContent = "Breezy";
      else lbl.textContent = "Brisk";
    }

    /*************************************************************************
     * 11. MINIMALIST UI CONTROLS, BREATHING GUIDE & AUTO-FADE ZEN TIMER
     *************************************************************************/
    function setSkyPalette(key) {
      targetPaletteKey = key;
      document.body.setAttribute("data-theme", key);
      ["morning", "noon", "dusk", "night"].forEach(k => {
        const btn = $id(`paletteBtn-${k}`);
        if (k === key) {
          btn.className = "palette-btn px-3 py-1.5 rounded-full text-xs font-medium transition-all cursor-pointer flex items-center gap-1.5 bg-white/30 text-white shadow-sm";
        } else {
          btn.className = "palette-btn px-3 py-1.5 rounded-full text-xs font-medium transition-all cursor-pointer flex items-center gap-1.5 text-white/80 hover:text-white";
        }
      });
    }

    function togglePanel(panelId) {
      const panels = ["soundMixerPanel", "thoughtReleasePanel", "pareidoliaPickerPanel"];
      panels.forEach(id => {
        const el = $id(id);
        if (id === panelId) {
          el.classList.toggle("hidden");
        } else {
          el.classList.add("hidden");
        }
      });
    }

    // 4-2-6 Mindful Breathing Guide Loop
    let breathInterval = null;
    function toggleBreathingGuide() {
      state.breathingActive = !state.breathingActive;
      const container = $id("breathingGuideContainer");
      const btn = $id("breathingToggleBtn");
      const label = $id("breathingToggleLabel");

      if (state.breathingActive) {
        container.classList.remove("hidden");
        container.classList.add("flex");
        btn.classList.add("bg-white/30");
        label.textContent = "Breathing";
        runBreathingCycle();
      } else {
        container.classList.add("hidden");
        container.classList.remove("flex");
        btn.classList.remove("bg-white/30");
        label.textContent = "Breathe";
        if (breathInterval) clearTimeout(breathInterval);
      }
    }

    function runBreathingCycle() {
      if (!state.breathingActive) return;
      const outer = $id("breathCircleOuter");
      const inner = $id("breathCircleInner");
      const text = $id("breathPhaseText");

      // Phase 1: Inhale (4 seconds)
      text.textContent = "Inhale slowly with the clouds...";
      outer.style.transitionDuration = "4000ms";
      inner.style.transitionDuration = "4000ms";
      outer.style.transform = "scale(1.28)";
      inner.style.transform = "scale(1.45)";

      breathInterval = setTimeout(() => {
        if (!state.breathingActive) return;
        // Phase 2: Hold (2 seconds)
        text.textContent = "Hold gently...";
        breathInterval = setTimeout(() => {
          if (!state.breathingActive) return;
          // Phase 3: Exhale (6 seconds)
          text.textContent = "Exhale and let the mind go blank...";
          outer.style.transitionDuration = "6000ms";
          inner.style.transitionDuration = "6000ms";
          outer.style.transform = "scale(0.85)";
          inner.style.transform = "scale(0.75)";

          breathInterval = setTimeout(runBreathingCycle, 6000);
        }, 2000);
      }, 4000);
    }

    function toggleFullscreenZen() {
      const icon = $id("fullscreenIcon");
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen?.().catch(() => {});
        icon.className = "fa-solid fa-compress text-xs";
      } else {
        document.exitFullscreen?.().catch(() => {});
        icon.className = "fa-solid fa-expand text-xs";
      }
    }

    // Auto-Hide HUD after 4 seconds of pointer inactivity
    let idleHudTimer = null;
    function resetHudIdleTimer() {
      document.body.classList.remove("hud-hidden");
      clearTimeout(idleHudTimer);
      idleHudTimer = setTimeout(() => {
        const anyPanelOpen =
          !$id("soundMixerPanel").classList.contains("hidden") ||
          !$id("thoughtReleasePanel").classList.contains("hidden") ||
          !$id("pareidoliaPickerPanel").classList.contains("hidden") ||
          document.activeElement?.id === "thoughtInput";
        if (!anyPanelOpen) {
          document.body.classList.add("hud-hidden");
        }
      }, 4000);
    }

    function setupInteractions() {
      window.addEventListener("pointermove", e => {
        resetHudIdleTimer();
        const prevX = state.pointer.x < -500 ? e.clientX : state.pointer.x;
        const prevY = state.pointer.y < -500 ? e.clientY : state.pointer.y;
        state.pointer.vx = e.clientX - prevX;
        state.pointer.vy = e.clientY - prevY;
        state.pointer.x = e.clientX;
        state.pointer.y = e.clientY;
        state.pointer.active = true;
      });

      window.addEventListener("pointerdown", e => {
        resetHudIdleTimer();
        state.pointer.x = e.clientX;
        state.pointer.y = e.clientY;
        state.pointer.isDown = true;
        state.pointer.active = true;
      });

      window.addEventListener("pointerup", () => {
        state.pointer.isDown = false;
      });

      // Double-click anywhere on the sky canvas to coalesce clouds into a pareidolia shape right there
      canvas.addEventListener("dblclick", e => {
        triggerRandomPareidolia(e.clientX, e.clientY);
      });

      window.addEventListener("keydown", e => {
        resetHudIdleTimer();
        if (e.target.tagName === "INPUT") return;
        if (e.code === "Space") {
          e.preventDefault();
          toggleAudioEngine();
        } else if (e.key.toLowerCase() === "d") {
          triggerRandomPareidolia();
        } else if (e.key.toLowerCase() === "b") {
          toggleBreathingGuide();
        } else if (e.key.toLowerCase() === "t") {
          openThoughtReleasePanel();
        }
      });
    }

    /*************************************************************************
     * 12. BOOTSTRAP ON WINDOW LOAD
     *************************************************************************/
    window.onload = function () {
      resizeCanvas();
      window.addEventListener("resize", resizeCanvas);

      initSkyEntities();
      setupInteractions();
      resetHudIdleTimer();

      // Start the 60FPS volumetric cloud & meadow animation loop
      requestAnimationFrame(animateSky);
    };
  </script>
<script src="./sky.js" defer></script>
<script src="./land.js" defer></script>
<script src="./flowers.js" defer></script>
</body>
</html>
