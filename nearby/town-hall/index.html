<title>Town Hall · Nearby</title>

<style>
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.filters .fbb{min-height:40px;font-size:17px;padding:0 10px}
.filters .fbb[aria-pressed=true]{background:var(--fbb-amber,#f6b73c);color:#1d130d}
.rep{margin:8px 0 0;padding:8px 0 0;border-top:1px dashed rgba(255,255,255,.18)}
.rep p{margin:0 0 6px;font-size:17px;overflow-wrap:anywhere}
.rep p i{font-style:normal;color:var(--dim)}
.place{background:none;border:0;padding:0;color:var(--a);font:inherit;text-decoration:underline;cursor:pointer}
.ans{display:flex;gap:6px;margin-top:8px}.ans input{flex:1;margin:0}.ans .fbb{min-height:44px;padding:0 12px}
.views{display:flex;gap:8px;margin:0 0 12px}.views .fbb{flex:1;min-height:44px;font-size:18px}.views .fbb[aria-pressed=true]{background:var(--fbb-amber,#f6b73c);color:#1d130d}
#quilt canvas{display:block;width:100%;image-rendering:pixelated;border:3px solid #000;box-shadow:4px 4px 0 #000;background:#2a1a10;cursor:pointer;touch-action:manipulation}
.qsel{margin-top:10px}
#qEdit{display:block;width:min(100%,256px);aspect-ratio:1;margin:0 auto 10px;image-rendering:pixelated;border:3px solid #000;touch-action:none;cursor:crosshair;background:#f3ead8}
.swatch{width:34px;height:34px;min-width:34px;border:3px solid #000;padding:0;cursor:pointer;box-shadow:2px 2px 0 #000}.swatch[aria-pressed=true]{outline:3px solid #f6b73c;outline-offset:1px}
.presets .fbb{min-height:38px;font-size:16px;padding:0 8px}
</style>

<body>

</div>

      if (opened[n.id]) {
        var ans = el("div", "ans"), inp = el("input"); inp.maxLength = 140; inp.setAttribute("aria-label", t(T.answer)); var go = el("button", "fbb fbb-pri", t(T.send)); go.type = "button";
        go.onclick = function () { var v = inp.value.trim(); if (!v) return; go.disabled = true; K.secret("hall").then(function (s) { return K.rpc("hall_reply", { p_secret: s, p_id: n.id, p_body: v, p_nick: K.nick() }); }).then(function () { opened[n.id] = 0; return load(); }).catch(function (e) { go.disabled = false; K.note(t(e && e.rest ? T.rest : T.off), "📌"); }); };
        inp.addEventListener("keydown", function (e) { if (e.key === "Enter") go.click(); });
        ans.appendChild(inp); ans.appendChild(go); c.appendChild(ans); setTimeout(function () { try { inp.focus({ preventScroll: true }); } catch (e) {} }, 30);
      } else { var ab = el("button", "fbb", t(T.answer)); ab.type = "button"; ab.onclick = function () { opened = {}; opened[n.id] = 1; paint(); }; row.appendChild(ab); }
      if (n.mine) { row.appendChild(el("span", "tk-tag", t(T.mine))); var d = el("button", "tk-link", t(T.down)); d.type = "button"; d.onclick = function () { K.secret("hall").then(function (s) { return K.rpc("hall_forget", { p_secret: s, p_what: "notice", p_id: n.id }); }).then(load).catch(function () {}); }; row.appendChild(d); }
      else { var rep = el("button", "tk-link", "⚑"); rep.type = "button"; rep.title = t(T.rep); rep.setAttribute("aria-label", t(T.rep)); rep.onclick = function () { rep.disabled = true; rep.textContent = t(T.repd); K.secret("hall").then(function (s) { return K.rpc("hall_report", { p_secret: s, p_what: "notice", p_id: n.id }); }).catch(function () {}); }; row.appendChild(rep); }
      c.appendChild(row); list.appendChild(c);
    });
  }

  /* ---------- the town quilt: every visitor stitches one square (8×8 stitches, eight fabrics); it only grows ---------- */
  var QPAL = ["#f3ead8", "#c8303a", "#3a6ab0", "#4a8a44", "#f4c84a", "#f4a0b8", "#8a5a33", "#2a2a4a"], qSel = null;
  function showView() { $("boardV").hidden = view !== "board"; $("quiltV").hidden = view !== "quilt"; $("pinBtn").style.display = view !== "board" ? "none" : ""; $("stitchBtn").style.display = view !== "quilt" ? "none" : ""; if (view === "quilt") paintQuilt(); }
  function loadQuilt() { return K.secret("quilt").then(function (s) { return K.rpc("quilt_list", { p_secret: s }); }).then(function (d) { quilt = Array.isArray(d) ? d : []; paintQuilt(); }).catch(function () { if (!quilt) paintQuilt(true); }); }
  var QC = 0;   /* squares per row, set when painting */
  function paintQuilt(off) {
    var cvq = $("qCv"), sel = $("qSel"), qs = quilt || [];
    if (off || !qs.length) { cvq.style.display = "none"; sel.innerHTML = ""; sel.appendChild(el("p", "tk-empty", t(off ? T.off : T.qEmpty))); return; }
    cvq.style.display = ""; var w = cvq.parentNode.clientWidth || 300; QC = Math.max(4, Math.min(12, Math.floor(w / 44)));
    var rows = Math.ceil(qs.length / QC), u = 10, sq = 8 * u + 2; cvq.width = QC * sq + 2; cvq.height = rows * sq + 2;
    var c = cvq.getContext("2d"); c.fillStyle = "#2a1a10"; c.fillRect(0, 0, cvq.width, cvq.height);
    qs.forEach(function (q, i) { var x0 = 1 + (i % QC) * sq, y0 = 1 + Math.floor(i / QC) * sq;
      for (var k = 0; k < 64; k++) { c.fillStyle = QPAL[+q.p[k]]; c.fillRect(x0 + 1 + (k % 8) * u, y0 + 1 + Math.floor(k / 8) * u, u, u); }
      c.fillStyle = "rgba(255,255,255,.55)"; for (var d = 0; d < 8 * u; d += 4) { c.fillRect(x0 + 1 + d, y0 + 2, 2, 1); c.fillRect(x0 + 1 + d, y0 + 8 * u - 1, 2, 1); c.fillRect(x0 + 2, y0 + 1 + d, 1, 2); c.fillRect(x0 + 8 * u - 1, y0 + 1 + d, 1, 2); }   /* the stitches round each square */
      if (qSel && qSel.id === q.id) { c.strokeStyle = "#f6b73c"; c.lineWidth = 3; c.strokeRect(x0 + 1.5, y0 + 1.5, 8 * u - 1, 8 * u - 1); } });
    cvq.onclick = function (e) { var r = cvq.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * cvq.width, y = (e.clientY - r.top) / r.height * cvq.height, i = Math.floor(y / sq) * QC + Math.floor(x / sq); qSel = qs[i] || null; paintQuilt(); };
    sel.innerHTML = "";
    if (qSel) { var line = [qSel.note ? t(T.qFor, { f: qSel.note }) : "", qSel.nick ? t(T.by, { n: qSel.nick }) : "", qSel.at].filter(Boolean).join(" · "); sel.appendChild(el("p", "tk-p", line));
      var row = el("div", "tk-row");
      if (qSel.mine) { var u2 = el("button", "tk-link", t(T.unpick)); u2.type = "button"; u2.onclick = function () { K.secret("quilt").then(function (s) { return K.rpc("quilt_forget", { p_secret: s, p_id: qSel.id }); }).then(function () { qSel = null; return loadQuilt(); }).catch(function () {}); }; row.appendChild(u2); }
      else { var rq = el("button", "tk-link", "⚑"); rq.type = "button"; rq.title = t(T.rep); rq.setAttribute("aria-label", t(T.rep)); rq.onclick = function () { rq.disabled = true; rq.textContent = t(T.repd); K.secret("quilt").then(function (s) { return K.rpc("quilt_report", { p_secret: s, p_id: qSel.id }); }).catch(function () {}); }; row.appendChild(rq); }
      sel.appendChild(row); }
  }
  addEventListener("resize", function () { if (view === "quilt") paintQuilt(); });
  /* the square you're stitching: tap or drag to stitch with the chosen fabric; a few patterns to start from */
  var mineSq = "0".repeat(64).split(""), brush = 1, ed = $("qEdit"), eg = ed.getContext("2d");
  function paintEdit() { for (var k = 0; k < 64; k++) { eg.fillStyle = QPAL[+mineSq[k]]; eg.fillRect(k % 8, Math.floor(k / 8), 1, 1); } }
  function at(e) { var r = ed.getBoundingClientRect(), x = Math.floor((e.clientX - r.left) / r.width * 8), y = Math.floor((e.clientY - r.top) / r.height * 8); if (x < 0 || y < 0 || x > 7 || y > 7) return; mineSq[y * 8 + x] = String(brush); paintEdit(); }
  var down = false; ed.addEventListener("pointerdown", function (e) { down = true; try { ed.setPointerCapture(e.pointerId); } catch (x) {} at(e); }); ed.addEventListener("pointermove", function (e) { if (down) at(e); }); ed.addEventListener("pointerup", function () { down = false; });
  var PRE = {
    pClear: function (x, y) { return 0; }, pStripe: function (x, y) { return y % 2 ? 1 : 0; }, pCheck: function (x, y) { return ((x >> 1) + (y >> 1)) % 2 ? 1 : 0; },
    pHeart: function (x, y) { return [".XX..XX.", "XXXXXXXX", "XXXXXXXX", "XXXXXXXX", ".XXXXXX.", "..XXXX..", "...XX...", "........"][y][x] === "X" ? 1 : 0; },
    pStar: function (x, y) { return ["...XX...", "...XX...", "XXXXXXXX", ".XXXXXX.", "..XXXX..", ".XX..XX.", "XX....XX", "........"][y][x] === "X" ? 1 : 0; },
    pFrame: function (x, y) { return x === 0 || y === 0 || x === 7 || y === 7 ? 1 : 0; } };
  function tools() {
    var sw = $("swatches"); sw.innerHTML = ""; QPAL.forEach(function (c, i) { var b = el("button", "swatch"); b.type = "button"; b.style.background = c; b.setAttribute("aria-label", c); b.setAttribute("aria-pressed", i === brush ? "true" : "false"); b.onclick = function () { brush = i; tools(); }; sw.appendChild(b); });
    var pr = $("presets"); pr.innerHTML = ""; Object.keys(PRE).forEach(function (k) { var b = el("button", "fbb", t(T[k])); b.type = "button"; b.onclick = function () { for (var y = 0; y < 8; y++) for (var x = 0; x < 8; x++) mineSq[y * 8 + x] = PRE[k](x, y) ? String(brush) : (k === "pClear" ? String(brush) : "0"); paintEdit(); }; pr.appendChild(b); });
  }
  $("stitchBtn").onclick = function () { tools(); paintEdit(); show("stitch"); };
  $("qGo").onclick = function () {
    var btn = this; btn.disabled = true;
    K.secret("quilt").then(function (s) { return K.rpc("quilt_add", { p_secret: s, p_pattern: mineSq.join(""), p_note: $("qNote").value.trim(), p_nick: K.nick() }); })
      .then(function () { btn.disabled = false; show(null); $("qNote").value = ""; try { if (window.FBG && FBG.made) FBG.made("hall"); } catch (e) {} return loadQuilt(); })
      .catch(function (e) { btn.disabled = false; show(null); K.note(t(e && e.rest ? T.qRest : T.off), "🧵"); });
  };
  /* ---------- pin a notice ---------- */
  function show(id) { $("pin").hidden = id !== "pin"; $("stitch").hidden = id !== "stitch"; $("dock").hidden = !!id; }
  [].forEach.call(document.querySelectorAll("[data-close]"), function (b) { b.onclick = function () { show(null); }; });
  addEventListener("keydown", function (e) { if (e.key === "Escape") show(null); });
  $("pinBtn").onclick = function () { $("pHead").value = ""; $("pBody").value = ""; words(); show("pin"); };
  $("pGo").onclick = function () {
    var h = $("pHead").value.trim(); if (!h) { $("pHead").classList.remove("hop"); void $("pHead").offsetWidth; $("pHead").classList.add("hop"); return; }
    var btn = this; btn.disabled = true;
    K.secret("hall").then(function (s) { return K.rpc("hall_add", { p_secret: s, p_kind: kind, p_place: kind === "place" ? $("pPlace").value : null, p_head: h, p_body: $("pBody").value.trim(), p_nick: K.nick() }); })
      .then(function () { btn.disabled = false; show(null); filter = "all"; words(); return load(); })
      .catch(function (e) { btn.disabled = false; show(null); K.note(t(e && e.rest ? T.rest : T.off), "📌"); });
  };
  load(); loadQuilt(); showView(); setInterval(function () { if (!document.hidden && !document.activeElement.matches("input,textarea")) { load(); loadQuilt(); } }, 60000);
})();
