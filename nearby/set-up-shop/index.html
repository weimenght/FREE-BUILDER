.tk-scene{height:48vh;height:48dvh;background:#1a1420}
@media (min-aspect-ratio:6/5){.tk-scene{width:60%;height:auto}}
#cv{cursor:pointer;touch-action:manipulation}
.ss-k{display:block;font:400 9px/1.5 'Press Start 2P',monospace;letter-spacing:.06em;color:#f6b73c;margin:4px 0 6px}
.ss-row{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 10px;align-items:center}
.swatch{width:32px;height:32px;min-width:32px;border:3px solid #000;padding:0;cursor:pointer;box-shadow:2px 2px 0 #000}
.swatch[aria-pressed=true]{outline:3px solid #f6b73c;outline-offset:1px}
.ss-row .fbb{min-height:40px;font-size:17px;padding:0 10px}
.ss-row .fbb[aria-pressed=true]{background:var(--fbb-amber,#f6b73c);color:#1d130d}
.ss-sub{font-size:15px;color:var(--dim);margin:0 2px 0 0;min-width:46px}
.slots{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:0 0 10px}
.slots .fbb{min-height:52px;padding:2px!important;display:grid;place-items:center}
.slots canvas,.goods canvas{width:40px;height:32px;image-rendering:pixelated;display:block}
.goods{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;margin:6px 0 10px}
.goods .fbb{flex-direction:column;align-items:center;gap:2px;min-height:64px;padding:4px;font-size:16px;line-height:1.05}
.ss-in{display:block;width:100%;box-sizing:border-box;margin:0 0 10px;padding:7px 10px;border:3px solid #000;background:#fbf3e2;color:#1d130d;font:400 20px/1.25 var(--vt);border-radius:0}
.ss-in:focus{outline:2px solid #f6c84a;outline-offset:1px}
.ss-view{position:absolute;left:8px;bottom:8px;right:8px;display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 10px;background:rgba(20,14,10,.88);border:3px solid #000;color:#fbeedd;font:400 20px/1.2 var(--vt)}
.ss-view[hidden]{display:none}
.ss-view .fbb{min-height:40px;padding:0 12px;font-size:18px}
html.ss-viewing .tk-panel{display:none}html.ss-viewing .tk-scene{flex:1;height:auto;width:auto;border:0}

  /* ---------- tapping the scene: a slot opens the goods, the sign and the board go to their field ---------- */
