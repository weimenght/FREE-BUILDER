    var nm = el("input"); nm.maxLength = 24; nm.placeholder = t(T.name); nm.setAttribute("aria-label", t(T.name)); nm.value = ans.name || K.nick(); nm.autocomplete = "nickname"; c.appendChild(nm);
    var yn = el("div", "yn"); [[true, T.yes], [false, T.no]].forEach(function (o) { var b = el("button", "fbb", t(o[1])); b.type = "button"; b.setAttribute("aria-pressed", ans.going === o[0] ? "true" : "false"); b.onclick = function () { ans.going = o[0]; ans.name = nm.value; ans.note = nt.value; paint(); }; yn.appendChild(b); }); c.appendChild(yn);
    if (ans.going && ev.items && ev.items.length) { c.appendChild(el("p", "tk-dim", t(T.bring))); var ch = el("div", "choice"); ev.items.forEach(function (i) { var b = el("button", "fbb", i); b.type = "button"; b.setAttribute("aria-pressed", ans.items.indexOf(i) >= 0 ? "true" : "false"); b.onclick = function () { var k = ans.items.indexOf(i); if (k >= 0) ans.items.splice(k, 1); else ans.items.push(i); b.setAttribute("aria-pressed", k >= 0 ? "false" : "true"); }; ch.appendChild(b); }); c.appendChild(ch); }
    var nt = el("textarea"); nt.maxLength = 140; nt.rows = 2; nt.placeholder = t(T.note); nt.setAttribute("aria-label", t(T.note)); nt.value = ans.note || ""; c.appendChild(nt);
    var go = el("button", "fbb fbb-pri", t(ans.had ? T.change : T.answer)); go.type = "button";
    go.onclick = function () { var n = nm.value.trim(); if (!n) { nm.classList.remove("hop"); void nm.offsetWidth; nm.classList.add("hop"); return; } go.disabled = true; K.setNick(n);
      K.secret("party").then(function (s) { return K.rpc("party_rsvp", { p_secret: s, p_code: code, p_name: n, p_going: ans.going, p_items: ans.going ? ans.items : [], p_note: nt.value.trim() }); }).then(load).catch(function () { go.disabled = false; K.note(t(T.off), "🎈"); }); };
    c.appendChild(go); panel.appendChild(c);
  }
  function ics() {
    var d = (ev.date || "").replace(/-/g, ""), m = /^(\d{1,2})[:.h](\d{2})/.exec(ev.time || ""), start = m ? d + "T" + ("0" + m[1]).slice(-2) + m[2] + "00" : d;
    var lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Nearby//Come Over//EN", "BEGIN:VEVENT", "UID:" + code + "@nearby", "DTSTAMP:" + new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, ""),
      (m ? "DTSTART:" : "DTSTART;VALUE=DATE:") + start, "SUMMARY:" + ev.title.replace(/[,;\n]/g, " "), ev.place ? "LOCATION:" + ev.place.replace(/[,;\n]/g, " ") : "", "URL:" + location.origin + "/nearby/come-over/#p=" + code, "END:VEVENT", "END:VCALENDAR"].filter(Boolean);
    var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([lines.join("\r\n")], { type: "text/calendar" })); a.download = "come-over.ics"; document.body.appendChild(a); a.click(); setTimeout(function () { a.remove(); }, 500);
  }

  /* ---------- plan or change one ---------- */
  function show(id) { $("plan").hidden = id !== "plan"; $("dock").hidden = !!id || !!code; }
  [].forEach.call(document.querySelectorAll("[data-close]"), function (b) { b.onclick = function () { show(null); }; });
  addEventListener("keydown", function (e) { if (e.key === "Escape") show(null); });
  function openForm(edit) {
    editing = !!edit; var e = edit && ev ? ev : {}; $("eTitle").value = e.title || ""; $("eHosts").value = e.hosts || K.nick(); $("eAbout").value = e.about || ""; $("eDate").value = e.date || ""; $("eTime").value = e.time || ""; $("ePlace").value = e.place || "";
    picked = (e.items || []).slice(); var pre = T.PRESET.map(function (p) { return t(p); }); extra = picked.filter(function (i) { return pre.indexOf(i) < 0; }); $("eNew").value = "";
    words(); show("plan");
  }
  $("planBtn").onclick = function () { openForm(false); };
  $("eAdd").onclick = function () { var v = $("eNew").value.trim().slice(0, 30); if (!v) return; if (extra.indexOf(v) < 0) extra.push(v); if (picked.indexOf(v) < 0 && picked.length < 12) picked.push(v); $("eNew").value = ""; chips(); };
  $("eNew").addEventListener("keydown", function (e) { if (e.key === "Enter") $("eAdd").click(); });
  $("eGo").onclick = function () {

      .then(function (c) { btn.disabled = false; show(null); if (!editing) { code = c; remember(c, ti, true); history.replaceState(null, "", location.pathname + location.search + "#p=" + c); } return load(); })
      .catch(function (e) { btn.disabled = false; show(null); K.note(t(e && e.rest ? T.rest : T.off), "🎈"); });
  };
  addEventListener("hashchange", function () { code = (/[#&]p=([A-Za-z0-9]{6,16})/.exec(location.hash) || [])[1] || null; ev = null; ans = { going: true, items: [] }; load(); });
  words(); paint(); load();
})();
