/* Sound: soft, short, optional */
const sound = {
  ctx: null, muted: store.get("fb_muted", false),
  init() { if (!this.ctx) { const A = window.AudioContext || window.webkitAudioContext; if (A) this.ctx = new A(); } if (this.ctx && this.ctx.state === "suspended") this.ctx.resume(); },
  tone(f, d = .3, g = .06, type = "sine", at = 0) {

  },
  tap() { this.tone(520, .12, .04, "triangle"); },
  chime() { [659.25, 880, 1318.5].forEach((f, i) => this.tone(f, 1.2, .05, "sine", i * .12)); },

/* Keep the screen awake while a timer runs (where supported) */
let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && "wakeLock" in navigator && !wakeLock) wakeLock = await navigator.wakeLock.request("screen");
    if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) { wakeLock = null; }
}

/* Timer ring */
function ringSVG() {
  return `<svg viewBox="0 0 120 120" aria-hidden="true"><circle class="bg" cx="60" cy="60" r="54" fill="none" stroke-width="6"/><circle class="fg" id="ring" cx="60" cy="60" r="54" fill="none" stroke-width="6" stroke-linecap="round" stroke-dasharray="339.29" stroke-dashoffset="0"/></svg>`;
}
const timer = {
  total: 90, left: 90, running: false, raf: 0, last: 0, onEnd: null, ended: false,
  start(total, onEnd) { this.stop(); this.total = this.left = total; this.onEnd = onEnd; this.ended = false; this.resume(); },
  resume() { if (this.running || this.ended) return; this.running = true; this.last = performance.now(); keepAwake(true); this.tick(); },
  pause() { this.running = false; cancelAnimationFrame(this.raf); keepAwake(false); this.paint(); },
  stop() { this.running = false; cancelAnimationFrame(this.raf); keepAwake(false); },
  tick() {
    if (!this.running) return;
    const now = performance.now(); this.left = Math.max(0, this.left - (now - this.last) / 1000); this.last = now;
    this.paint();
    if (this.left <= 0) { this.running = false; this.ended = true; keepAwake(false); sound.chime(); buzz([60, 80, 60]); this.onEnd && this.onEnd(); return; }
    this.raf = requestAnimationFrame(() => this.tick());
  },
  paint() {
    const ring = $("ring"), num = $("tnum"), lbl = $("tlbl"), wrap = $("timer");
    if (!ring) return;
    ring.setAttribute("stroke-dashoffset", String(339.29 * (1 - this.left / this.total)));
    const s = Math.ceil(this.left);
    num.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
    lbl.textContent = this.ended ? "" : (this.running ? T().left : T().paused);
    wrap.classList.toggle("done", this.ended);
  }
};

function curtainHTML(title, lead, btnLabel, act) {
  return `<div class="curtain">
    <svg class="hand" viewBox="0 0 84 84" aria-hidden="true"><rect x="27" y="10" width="30" height="52" rx="7" fill="none" stroke="#fff" stroke-width="2.5"/><circle cx="42" cy="54" r="2.5" fill="#E2553F"/><path d="M14 54c6 0 10 4 13 9M70 54c-6 0-10 4-13 9" stroke="rgba(255,255,255,.5)" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M34 72h16" stroke="#E2553F" stroke-width="2.5" stroke-linecap="round"/></svg>
    <h2>${title}</h2><p>${lead}</p>
    <button class="btn pri" data-act="${act}" style="width:100%;margin-top:6px">${btnLabel} →</button></div>`;
}



/* =====================================================================
   DISCOVERY DUET
   ===================================================================== */
const S = { screen: "intro", names: ["", ""], round: 0, card: [0, 0], guess: "", found: [null, null], bells: [0, 0], tipIdx: 0 };
const FLOW = ["brief", "talk", "guess", "reveal"];
const nameOf = i => S.names[i].trim() || I18N[lang][i ? "nameB" : "nameA"];
const asker = () => nameOf(S.round), client = () => nameOf(1 - S.round);
const card = () => CLIENTS[lang][S.card[S.round]];

function deal() {
  const n = CLIENTS.en.length, prev = S.round ? S.card[0] : -1;
  let i, g = 0; do { i = Math.floor(Math.random() * n); g++; } while (i === prev && g < 40);
  S.card[S.round] = i;
}
function go(screen) {
  if (screen !== "talk") timer.stop();
  S.screen = screen; render(); window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
  if (screen === "talk") startTalk();
}
function paintStepsBar() {
  const at = FLOW.indexOf(S.screen === "pass" ? "brief" : S.screen);
  $("steps").innerHTML = at < 0 ? "" : FLOW.map((_, i) => `<span class="${i < at ? "done" : i === at ? "now" : ""}"></span>`).join("");
}
function rolesHTML() {
  const t = T();
  return `<div class="roles">
    <div class="role speak"><div class="k">${esc(t.roleAsk)}</div><div class="n">${esc(asker())}</div></div>
    <div class="role"><div class="k">${esc(t.roleClient)}</div><div class="n">${esc(client())}</div></div>
  </div>`;
}
function duetArt() {
  return `<svg viewBox="0 0 320 150" style="width:100%;max-width:420px;height:auto;margin:4px 0" aria-hidden="true">
    <rect x="30" y="30" width="170" height="90" rx="18" fill="#fff" stroke="#E5E2DA"/>
    <text x="50" y="70" font-family="Instrument Serif, Georgia, serif" font-style="italic" font-size="21" fill="#17171A">“We need…”</text>
    <rect x="50" y="84" width="84" height="6" rx="3" fill="#E5E2DA"/>
    <g transform="translate(186 50)"><rect width="104" height="70" rx="16" fill="#17171A"/>
      <circle cx="40" cy="34" r="16" fill="none" stroke="#E2553F" stroke-width="4"/><path d="M52 46l14 14" stroke="#E2553F" stroke-width="5" stroke-linecap="round"/>
      <text x="40" y="40" text-anchor="middle" font-family="Instrument Serif, Georgia, serif" font-style="italic" font-size="18" fill="#fff">?</text></g>
  </svg>`;
}
const BELL = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>';
const FOUND_ICONS = [
  '<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="var(--good)"/></svg>',
  '<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="8.25" fill="none" stroke="var(--ink)" stroke-width="1.5"/><path d="M11 2.75a8.25 8.25 0 0 1 0 16.5z" fill="var(--ink)"/></svg>',
  '<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="8.25" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="3 3"/></svg>'
];

function render() {
  const t = T(), stage = $("stage");
  paintStepsBar();
  let h = "";
  switch (S.screen) {
  case "intro":
    h = `<section class="screen">
      <span class="kicker">${t.introKicker}</span><h1>${t.introTitle}</h1>
      <p class="lead">${esc(t.introLead)}</p>
      <div class="pills">${t.introMeta.map(m => `<span class="pill">${esc(m)}</span>`).join("")}</div>
      ${duetArt()}
      <div class="spacer"></div>
      <div class="btns"><button class="btn pri" data-act="toSetup" data-focus>${esc(t.start)} →</button></div>
    </section>`; break;

  case "setup":
    h = `<section class="screen">
      <h2>${esc(t.setupTitle)}</h2>
      <div class="row2">
        <label class="field"><span>${esc(t.nameA)}</span><input id="nA" maxlength="20" autocomplete="off" placeholder="${esc(t.phA)}" value="${esc(S.names[0])}"></label>
        <label class="field"><span>${esc(t.nameB)}</span><input id="nB" maxlength="20" autocomplete="off" placeholder="${esc(t.phB)}" value="${esc(S.names[1])}"></label>
      </div>
      <p style="margin:0;font-size:13.5px;color:var(--muted)">${esc(t.setupNote)}</p>
      <div class="spacer"></div>
      <div class="btns"><button class="btn pri" data-act="toPass" data-focus>${esc(t.next)} →</button></div>
    </section>`; break;

  case "pass":
    h = `<section class="screen">${curtainHTML(fmt(t.passTitle, { c: client() }), fmt(t.passLead, { c: client(), a: asker() }), fmt(t.passGo, { c: client() }), "toBrief")}</section>`; break;

  case "brief": {
    const c = card();
    h = `<section class="screen">
      <div class="card" style="display:grid;gap:14px;background:var(--inkbg,var(--ink));color:#fff;border-color:var(--inkbd,var(--ink))">
        <span class="kicker" style="color:rgba(255,255,255,.55)">${esc(t.briefKicker)}</span>
        <div><span class="kicker" style="color:rgba(255,255,255,.45)">${esc(t.briefTitle)}</span><div style="font-family:var(--syne);font-weight:700;font-size:19px;margin-top:4px">${esc(c.who)}</div></div>
        <div><span class="kicker" style="color:rgba(255,255,255,.45)">${esc(t.sayFirst)}</span><div style="font-family:var(--serif);font-style:italic;font-size:21px;margin-top:4px">${esc(c.req)}</div></div>
        <div style="padding:14px;border-radius:14px;background:rgba(226,85,63,.16);border:1px solid rgba(226,85,63,.5)"><span class="kicker" style="color:#F2A091">${esc(t.hidden)}</span><div style="margin-top:6px;font-size:15.5px;line-height:1.5">${esc(c.need)}</div></div>
        <div><span class="kicker" style="color:rgba(255,255,255,.45)">${esc(t.clues)}</span><ul style="margin:6px 0 0;padding-left:18px;display:grid;gap:6px;font-size:14.5px;line-height:1.5">${c.clues.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
      </div>
      <p style="margin:0;font-size:13.5px;color:var(--muted)">${esc(t.briefNote)}</p>
      <div class="spacer"></div>
      <div class="btns"><button class="btn pri" data-act="toTalk" data-focus>${esc(t.hide)} →</button></div>
    </section>`; break; }

  case "talk":
    h = `<section class="screen">
      ${rolesHTML()}
      <h2>${fmt(t.talkTitle, { a: asker() })}</h2>
      <div class="prompt" style="min-height:0"><div class="q" style="font-size:clamp(19px,5vw,23px)">${esc(card().req)}</div><div class="meta"><span>${esc(t.talkLead)}</span><span>${esc(client())}</span></div></div>
      <p style="margin:0;font-size:14px">${esc(t.talkGoal)}</p>
      <div style="display:flex;align-items:center;gap:14px">
        <div class="timer" id="timer" style="width:min(36vw,140px);margin:0">${ringSVG()}<div class="num"><div><b id="tnum" style="font-size:clamp(26px,8vw,34px)">4:00</b><small id="tlbl"></small></div></div></div>
        <div style="flex:1;display:grid;gap:6px;justify-items:start">
          <button class="btn" data-act="bell" id="bellBtn" style="flex:none;background:var(--accent);color:#fff;border-color:var(--accent);gap:8px">${BELL} ${esc(t.bell)} <span id="bellN" style="opacity:.8">${S.bells[S.round] ? fmt(t.bellCount, { n: S.bells[S.round] }) : ""}</span></button>
          <small style="font-size:12px;color:var(--muted);line-height:1.4">${fmt(t.bellHint, { c: client(), a: asker() })}</small>
        </div>
      </div>
      <div class="tip" id="ltip"><i>?</i><span>${esc(t.starters[S.tipIdx % t.starters.length])}</span></div>
      <div class="spacer"></div>
      <div class="btns"><button class="btn" data-act="pause" id="pauseBtn">${esc(timer.running || timer.ended ? t.pause : t.resume)}</button><button class="btn pri" data-act="toGuess" data-focus>${esc(t.doneTalk)} →</button></div>
    </section>`; break;

  case "guess":
    h = `<section class="screen">
      <h2>${fmt(t.guessTitle, { a: asker() })}</h2>
      <p class="lead">${fmt(t.guessLead, { c: client() })}</p>
      <label class="field"><textarea id="guessIn" maxlength="240" placeholder="${esc(t.guessPh)}" style="min-height:120px">${esc(S.guess)}</textarea></label>
      <div class="spacer"></div>
      <div class="btns"><button class="btn pri" data-act="toReveal" id="nextBtn" ${S.guess.trim().length > 3 ? "" : "disabled"}>${esc(t.revealBtn)} →</button></div>
    </section>`; break;

  case "reveal": {
    const c = card(), f = S.found[S.round];
    h = `<section class="screen">
      <span class="kicker" style="color:var(--accent-ink)">${esc(t.revealKicker)}</span>
      <div class="sum" style="grid-template-columns:1fr">
        <div><span class="kicker">${esc(asker())}</span><p class="serif" style="margin:6px 0 0;font-size:18px">“${esc(S.guess.trim())}”</p></div>
        <div style="background:var(--inkbg,var(--ink));color:#fff;border-color:var(--inkbd,var(--ink))"><span class="kicker" style="color:rgba(255,255,255,.55)">${esc(c.who)}</span><p style="margin:6px 0 0;font-size:16px;line-height:1.5">${esc(c.need)}</p></div>
      </div>
      ${f == null ? `<h3 style="margin:0;font-family:var(--syne);font-size:20px">${fmt(t.foundQ, { c: client(), a: asker() })}</h3>
      <div class="heard">
        <button data-found="0" data-focus><span class="e">${FOUND_ICONS[0]}</span><span><b>${esc(t.yes)}</b><small>${esc(t.yesSub)}</small></span></button>
        <button data-found="1"><span class="e">${FOUND_ICONS[1]}</span><span><b>${esc(t.partly)}</b><small>${esc(t.partlySub)}</small></span></button>
        <button data-found="2"><span class="e">${FOUND_ICONS[2]}</span><span><b>${esc(t.no)}</b><small>${esc(t.noSub)}</small></span></button>
      </div>` : `
      <div><span class="kicker">${esc(t.reflectLbl)}</span>
        <ol style="margin:10px 0 0;padding-left:20px;display:grid;gap:8px;font-size:15px;line-height:1.5">${t.reflect.map(q => `<li>${fmt(q, { c: client() })}</li>`).join("")}</ol></div>
      <p style="margin:0;font-size:12.5px;color:var(--muted)">${fmt(t.bellNote, { n: S.bells[S.round] })}</p>
      <div class="spacer"></div>
      <div class="btns">${S.round === 0 ? `<button class="btn pri" data-act="toSwap" data-focus>⇄ ${esc(t.swapBtn)}</button>` : `<button class="btn pri" data-act="toEnd" data-focus>${esc(t.finish)} →</button>`}</div>`}
    </section>`; break; }

  case "swap":
    h = `<section class="screen">${curtainHTML(esc(t.swapTitle), fmt(t.swapLead, { a: nameOf(1), c: nameOf(0) }), esc(t.swapGo), "afterSwap")}</section>`; break;

  case "end":
    h = `<section class="screen">
      <span class="kicker" style="color:var(--good)">✓ ${esc(t.endKicker)}</span>
      <h2>${esc(t.endTitle)}</h2>
      <p class="serif">${esc(t.endLead)}</p>
      <div class="monday"><b>${esc(t.monday)}</b>${esc(t.mondayTxt)}</div>
      <div class="spacer"></div>
      <div class="btns"><button class="btn" data-act="again">↻ ${esc(t.again)}</button><button class="btn pri" data-act="teach" data-focus>${esc(t.passOn)} →</button></div>
    </section>`; break;

  case "teach": h = teachHTML("discovery"); break;
  }
  const hadFocus = stage.contains(document.activeElement);
  stage.innerHTML = h;
  const f = stage.querySelector("[data-focus]");
  if (f && hadFocus) f.focus({ preventScroll: true });
}

function teachHTML(demo) {
  const t = T(), chain = store.get("fb_teachback", []).filter(c => c.demo === demo);
  return `<section class="screen">
    <span class="kicker" style="color:var(--accent-ink)">${esc(t.teachKicker)}</span>
    <h2>${esc(t.teachTitle)}</h2>
    <p class="lead">${esc(t.teachLead)}</p>
    <div class="steps3">${t.t3.map((s, i) => `<div><b>0${i + 1}</b><span>${esc(s)}</span><small style="display:block;font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.4">${esc(t.t3sub[i])}</small></div>`).join("")}</div>
    <div class="card" style="display:grid;gap:12px">
      <label class="field"><span>${esc(t.learnerName)}</span><input id="lName" maxlength="30" autocomplete="off" placeholder="${esc(t.learnerPh)}"></label>
      <label class="field"><span>${esc(t.learned)}</span><textarea id="lText" maxlength="280" placeholder="${esc(t.learnedPh)}"></textarea></label>
      <button class="btn pri" data-act="saveTeach" style="flex:none">${esc(t.save)}</button>
    </div>
    <div><span class="kicker">${esc(t.chainTitle)}</span>
      <ul class="chain" style="margin-top:10px">${chain.length ? chain.slice().reverse().map(c => `<li>${esc(c.text)}<small>${c.name ? esc(c.name) + " · " : ""}${esc(new Date(c.at).toLocaleDateString((/*i18n*/lang === "zh" ? "zh-CN" : (lang === "zh-Hant" ? "zh-TW" : lang))))}</small></li>`).join("") : `<li style="color:var(--muted)">${esc(t.chainEmpty)}</li>`}</ul></div>
    <a class="link" href="/teachback">⊂⊃ ${esc((/*i18n*/lang === "zh" ? "教回去链条 ↗" : (lang === "zh-Hant" ? "教回去鏈條 ↗" : (/*i18n*/lang === "es" ? "Cadena de Enseñar de Vuelta ↗" : (lang === "ca" ? "Cadena d'Ensenyar de Tornada ↗" : "Teach-Back Chain ↗")))))}</a>
    <button class="link" data-act="restart">${esc(t.restart)}</button>
  </section>`;
}

function startTalk() {
  timer.start(240, () => toast(T().timeUp));
  const pb = $("pauseBtn"); if (pb) pb.textContent = T().pause;
  const iv = setInterval(() => {
    if (S.screen !== "talk") { clearInterval(iv); return; }
    S.tipIdx++; const el = $("ltip"); if (el) el.querySelector("span").textContent = T().starters[S.tipIdx % T().starters.length];
  }, 20000);
}

$("stage").addEventListener("input", e => {
  const id = e.target.id, v = e.target.value;
  if (id === "nA") S.names[0] = v;
  if (id === "nB") S.names[1] = v;
  if (id === "guessIn") { S.guess = v; const nb = $("nextBtn"); if (nb) nb.disabled = !(v.trim().length > 3); }
});
$("stage").addEventListener("click", e => {
  sound.init();
  const fd = e.target.closest("[data-found]"), a = e.target.closest("[data-act]");
  if (fd) { S.found[S.round] = +fd.dataset.found; if (S.found[S.round] === 0) sound.warm(); else sound.tap(); render(); return; }
  if (!a) return;
  const k = a.dataset.act;
  if (k === "bell") {
    S.bells[S.round]++; sound.tone(1568, .5, .06, "sine"); sound.tone(2093, .7, .03, "sine", .02); buzz(40);
    const n = $("bellN"); if (n) n.textContent = fmt(T().bellCount, { n: S.bells[S.round] });
    a.animate && !reduceMotion && a.animate([{ transform: "rotate(0)" }, { transform: "rotate(-6deg)" }, { transform: "rotate(6deg)" }, { transform: "rotate(0)" }], { duration: 300 });
    toast(T().bellToast); return;
  }
  sound.tap();
  switch (k) {
    case "toSetup": go("setup"); break;
    case "toPass": deal(); go("pass"); break;
    case "toBrief": go("brief"); break;
    case "toTalk": go("talk"); break;
    case "pause":
      if (timer.ended) return;
      if (timer.running) { timer.pause(); a.textContent = T().resume; } else { timer.resume(); a.textContent = T().pause; }
      break;
    case "toGuess": go("guess"); break;
    case "toReveal": go("reveal"); break;
    case "toSwap": go("swap"); break;
    case "afterSwap": S.round = 1; S.guess = ""; deal(); go("pass"); break;
    case "toEnd": sound.warm(); go("end"); break;
    case "again": Object.assign(S, { round: 0, guess: "", found: [null, null], bells: [0, 0] }); S.names = [S.names[1], S.names[0]]; deal(); go("pass"); break;
    case "teach": go("teach"); break;
    case "saveTeach": {
      const text = ($("lText").value || "").trim(), name = ($("lName").value || "").trim();
      if (!text) { $("lText").focus(); return; }
      const chain = store.get("fb_teachback", []); chain.push({ demo: "discovery", text, name, at: Date.now() }); store.set("fb_teachback", chain.slice(-50));
      sound.warm(); toast(T().saved); render(); break; }
    case "restart": Object.assign(S, { round: 0, guess: "", found: [null, null], bells: [0, 0] }); go("intro"); break;
  }
});

window.__app = { S, go, render, timer };

/* ---------- facilitator guide ---------- */
const drawer = $("drawer");
function openGuide() {
  const t = T();
  $("panel").innerHTML = `
    <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start">
      <div><span class="kicker">${esc(t.gKicker)}</span><h3 id="g-title">${esc(t.gTitle)}</h3></div>
      <button class="x" data-close aria-label="${esc(t.close)}">✕</button>
    </div>
    <h4>${esc(t.gWhy)}</h4><p>${esc(t.gWhyTxt)}</p>
    <h4>${esc(t.gSteps)}</h4><ol>${t.gStepList.map(s => `<li>${esc(s)}</li>`).join("")}</ol>
    <h4>${esc(t.gDebrief)}</h4><ul>${t.gDebriefList.map(s => `<li>${esc(s)}</li>`).join("")}</ul>
    <h4>${esc(t.gNotes)}</h4><ul>${t.gNotesList.map(s => `<li>${esc(s)}</li>`).join("")}</ul>`;
  drawer.classList.add("show");
  setTimeout(() => drawer.querySelector("[data-close]").focus({ preventScroll: true }), 60);
}
function closeGuide() { drawer.classList.remove("show"); $("btn-guide").focus({ preventScroll: true }); }
drawer.addEventListener("click", e => { if (e.target === drawer || e.target.closest("[data-close]")) closeGuide(); });
$("btn-guide").addEventListener("click", openGuide);
window.addEventListener("keydown", e => { if (e.key === "Escape" && drawer.classList.contains("show")) closeGuide(); });

/* ---------- language + sound ---------- */
function paintSound() {
  const b = $("btn-sound"), t = T();
  b.innerHTML = sound.muted
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m22 9-6 6M16 9l6 6"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>';
  b.setAttribute("aria-label", sound.muted ? t.soundOff : t.soundOn); b.title = b.getAttribute("aria-label");
}
$("btn-sound").addEventListener("click", () => { sound.muted = !sound.muted; store.set("fb_muted", sound.muted); sound.init(); paintSound(); if (!sound.muted) sound.tap(); });

function applyLang(l) {
  lang = LANGS.includes(l) ? l : "en";
  document.documentElement.lang = (/*i18n*/lang === "zh" ? "zh-CN" : (lang === "zh-Hant" ? "zh-TW" : lang));
  document.title = T().title;
  $("lang-lbl").textContent = LANG_LBL[lang];
  $("btn-guide").setAttribute("aria-label", T().guide); drawer.setAttribute("aria-label", T().guide);
  document.querySelectorAll("[data-t]").forEach(el => { const v = T()[el.dataset.t]; if (typeof v === "string") el.textContent = v; });
  paintSound();
  render();               // the clock object survives a re-render
  timer.paint();
  const pb = $("pauseBtn"); if (pb && !timer.running && !timer.ended) pb.textContent = T().resume;
  if (drawer.classList.contains("show")) openGuide();
  try { localStorage.setItem("wm_preferred_lang", lang); localStorage.setItem("wm_cases_lang", lang); } catch (e) {}
}
$("btn-lang").addEventListener("click", () => applyLang(LANGS[(LANGS.indexOf(lang) + 1) % LANGS.length]));
window.FBL_SET = l => applyLang(l); window.FBL_GET = () => lang;

/* ---------- boot ---------- */
let saved = null;
try { saved = localStorage.getItem("wm_preferred_lang") || localStorage.getItem("wm_cases_lang"); } catch (e) {}
const nav = (navigator.language || "").toLowerCase();
applyLang(LANGS.includes(saved) ? saved : nav.startsWith("zh") ? "zh" : nav.startsWith("es") ? "es" : "en");
document.addEventListener("visibilitychange", () => { if (!document.hidden && timer.running) keepAwake(true); });
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("/sw.js", { scope: "/" }).catch(() => {}); // offline cache
})();
</script>
</body>
