ts"], "why": "La seguretat psicològica creix amb petits moments repetits de sentir-se vist. Una sola pregunta, triar la profunditat i la llibertat de passar fan que sigui segur dir una mica més cada setmana.", "stepsH": "Com fer-ho (≈ 5 minuts)", "steps": ["La primera vegada, acordeu les tres regles bàsiques.", "Deixeu que l'equip triï la profunditat. Amb equips nous, comenceu per Lleugera.", "Llegiu la carta en veu alta. Una volta; qualsevol pot passar.", "No comenteu les respostes: n'hi ha prou amb donar les gràcies.", "Tanqueu anomenant alguna cosa que se us ha quedat."], "debrief": ["Què sabem ara els uns dels altres que abans no sabíem?", "És moment de provar una carta més profunda?", "Qui podria dirigir la ronda la setmana vinent?"], "notes": ["Feu rotació de qui llegeix la carta: és un ritual de tothom, no del cap.", "Equips remots: feu servir la carta del dia amb una paraula d'equip per veure la mateixa pregunta.", "No es guarda ni s'envia res. Les respostes es queden a la sala."], "monday": "Obre la reunió del dilluns amb una carta. Cinc minuts n'hi ha prou."}}, "thanks": {"en": {"product": "Specific Thanks", "kicker": "Free tool · Recognition", "lead": "“Great job!” fades by lunch. A thank-you that names what someone did — and what it meant — stays with them for weeks. This helps you write one. Then you say it yourself.", "meta": ["1 person", "1 colleague", "≈ 2 minutes"], "why": "Generic praise is easy to give and easy to forget. Naming a concrete action and its effect shows someone they were truly seen — and tells them what to do again.", "stepsH": "Running it (≈ 10 minutes)", "steps": ["Ask everyone to think of one person who helped them recently.", "Give two minutes to write a thank-you with the tool.", "Share one or two examples aloud, with permission.", "Ask each person to deliver theirs today, in person if they can.", "Next meeting, ask: how did they react?"], "debrief": ["What was harder: naming the action, or naming what it meant?", "How did it feel to receive one?", "Where could this replace a “thanks, all!” email?"], "notes": ["Keep it voluntary. Forced gratitude backfires.", "Thank effort and care, not only outcomes.", "Nothing is stored or sent — people deliver their own words."], "monday": "Start one meeting this week with one specific thank-you."}, "zh": {"product": "具体的感谢", "kicker": "免费工具 · 认可", "lead": "“辛苦了！”到午饭时就忘了。一句说清对方做了什么、对你意味着什么的感谢，会被记住好几周。这个工具帮你写一句——然后由你亲自去说。", "meta": ["1 个人", "1 位同事", "约 2 分钟"], "why": "笼统的表扬容易说，也容易忘。说出具体的行动和它带来的影响，会让人感到自己真正被看见——也让 TA 知道下次该继续做什么。", "stepsH": "怎么带（约 10 分钟）", "steps": ["请每个人想一位最近帮过自己的人。", "给两分钟，用这个工具写一句感谢。", "征得同意后，请一两位读出来。", "请每个人今天亲自去说，能当面就当面。", "下次开会时问：对方有什么反应？"], "debrief": ["哪一步更难：说出行动，还是说出意义？", "收到一句具体的感谢是什么感觉？", "哪些“谢谢大家！”的群发邮件可以被它替代？"], "notes": ["保持自愿。被要求的感谢会适得其反。", "感谢用心和付出，而不只是结果。", "不存储、不发送——由每个人亲自说出自己的话。"], "monday": "这周找一个会议，用一句具体的感谢开场。"}, "es": {"product": "Gracias Concretas", "kicker": "Herramienta gratis · Reconocimiento", "lead": "“¡Buen trabajo!” se olvida antes del almuerzo. Un agradecimiento que nombra lo que alguien hizo —y lo que significó— se recuerda durante semanas. Esto te ayuda a escribirlo. Luego lo dices tú.", "meta": ["1 persona", "1 colega", "≈ 2 minutos"], "why": "El elogio genérico es fácil de dar y fácil de olvidar. Nombrar una acción concreta y su efecto muestra a alguien que de verdad fue visto, y le dice qué repetir.", "stepsH": "Cómo hacerlo (≈ 10 minutos)", "steps": ["Pide a cada persona que piense en alguien que le ayudó hace poco.", "Dad dos minutos para escribir un agradecimiento con la herramienta.", "Compartid uno o dos ejemplos en voz alta, con permiso.", "Pide que cada uno lo entregue hoy, en persona si puede.", "En la siguiente reunión, preguntad: ¿cómo reaccionó?"], "debrief": ["¿Qué costó más: nombrar la acción o lo que significó?", "¿Qué se siente al recibir uno?", "¿Dónde podría sustituir a un correo de “¡gracias a todos!”?"], "notes": ["Que sea voluntario. La gratitud forzada sale al revés.", "Agradece el esfuerzo y el cuidado, no solo los resultados.", "No se guarda ni se envía nada: cada persona entrega sus propias palabras."], "monday": "Empieza una reunión esta semana con un agradecimiento concreto."}, "zh-Hant": {"product": "具體的感謝", "kicker": "免費工具 · 認可", "lead": "“辛苦了！”到午飯時就忘了。一句說清對方做了什麼、對你意味著什麼的感謝，會被記住好幾周。這個工具幫你寫一句——然後由你親自去說。", "meta": ["1 個人", "1 位同事", "約 2 分鐘"], "why": "籠統的表揚容易說，也容易忘。說出具體的行動和它帶來的影響，會讓人感到自己真正被看見——也讓 TA 知道下次該繼續做什麼。", "stepsH": "怎麼帶（約 10 分鐘）", "steps": ["請每個人想一位最近幫過自己的人。", "給兩分鐘，用這個工具寫一句感謝。", "徵得同意後，請一兩位讀出來。", "請每個人今天親自去說，能當面就當面。", "下次開會時問：對方有什麼反應？"], "debrief": ["哪一步更難：說出行動，還是說出意義？", "收到一句具體的感謝是什麼感覺？", "哪些“謝謝大家！”的群發郵件可以被它替代？"], "notes": ["保持自願。被要求的感謝會適得其反。", "感謝用心和付出，而不只是結果。", "不儲存、不傳送——由每個人親自說出自己的話。"], "monday": "這周找一個會議，用一句具體的感謝開場。"}, "ca": {"product": "Gràcies Concretes", "kicker": "Eina gratuïta · Reconeixement", "lead": "“Bona feina!” s'oblida abans de dinar. Un agraïment que anomena el que algú ha fet —i el que ha significat— es recorda durant setmanes. Això t'ajuda a escriure'l. Després el dius tu.", "meta": ["1 persona", "1 col·lega", "≈ 2 minuts"], "why": "L'elogi genèric és fàcil de donar i fàcil d'oblidar. Anomenar una acció concreta i el seu efecte mostra a algú que l'han vist de veritat, i li diu què repetir.", "stepsH": "Com fer-ho (≈ 10 minuts)", "steps": ["Demana a cada persona que pensi en algú que l'ha ajudat fa poc.", "Doneu dos minuts per escriure un agraïment amb l'eina.", "Compartiu un o dos exemples en veu alta, amb permís.", "Demana que cadascú el lliuri avui, en persona si pot.", "A la reunió següent, pregunteu: com ha reaccionat?"], "debrief": ["Què ha costat més: anomenar l'acció o el que ha significat?", "Què se sent en rebre'n un?", "On podria substituir un correu de “gràcies a tothom!”?"], "notes": ["Que sigui voluntari. La gratitud forçada surt al revés.", "Agraeix l'esforç i la cura, no només els resultats.", "No es guarda ni s'envia res: cada persona lliura les seves pròpies paraules."], "monday": "Comença una reunió aquesta setmana amb un agraïment concret."}}, "swap": {"en": {"product": "Perspective Swap", "kicker": "Human skills · Pairs", "lead": "Two colleagues. One awkward moment. Each of you knows only your half of the story. Talk until you find a way forward — then see what the other person was carrying all along.", "meta": ["2 people", "1 or 2 phones", "≈ 12 minutes"], "why": "Information asymmetry is how most real conflict feels: each side is reasonable with what they know. Hiding half the story makes people ask, not assume — and the reveal turns frustration into curiosity.", "stepsH": "Running it (≈ 15 minutes)", "steps": ["Pair people up — ideally across teams, regions or seniority.", "One phone per pair, or two phones with a shared code.", "Each reads their brief privately (1 minute).", "Talk for 5 minutes toward the shared goal.", "Reveal both sides and discuss the three questions.", "Swap roles and run it once more."], "debrief": ["When did your view of the other person change?", "Which question unlocked the conversation?", "Where in our real work does this hidden difference show up?"], "notes": ["Two phones can use different languages — the code keeps the same situation.", "Stress that the differences are learned habits, not personality or nationality.", "Pairs go deeper with the Intercultural Atlas as pre-work."], "monday": "Next time someone's reaction surprises you, ask one question before you explain yourself."}, "zh": {"product": "视角互换", "kicker": "人的能力 · 两人一组", "lead": "两位同事，一个尴尬的瞬间。你们每人只知道一半的故事。一起聊，直到找到前进的方向——然后看看对方一直在承受什么。", "meta": ["2 个人", "1 或 2 部手机", "约 12 分钟"], "why": "信息不对称正是大多数真实冲突的感觉：每一方根据自己知道的都很合理。藏起一半故事，让人们去问而不是去猜——而最后的揭晓，会把不满变成好奇。", "stepsH": "怎么带（约 15 分钟）", "steps": ["两两配对——最好跨团队、跨地区或跨层级。", "每组一部手机，或两部手机共用一个代码。", "各自私下阅读角色卡（1 分钟）。", "围绕共同目标聊 5 分钟。", "揭晓两边的故事，讨论三个问题。", "交换角色，再来一次。"], "debrief": ["你对对方的看法在什么时候改变了？", "哪个问题打开了对话？", "在我们的真实工作中，这个隐藏差异出现在哪里？"], "notes": ["两部手机可以用不同语言——代码保证情境相同。", "强调差异是习得的习惯，不是性格或国籍。", "先用跨文化图鉴做预习，对话会更深入。"], "monday": "下次别人的反应让你意外时，先问一个问题，再解释自己。"}, "es": {"product": "Cambio de Perspectiva", "kicker": "Habilidades humanas · Parejas", "lead": "Dos colegas. Un momento incómodo. Cada uno conoce solo su mitad de la historia. Hablad hasta encontrar una salida y luego descubrid lo que la otra persona llevaba consigo.", "meta": ["2 personas", "1 o 2 móviles", "≈ 12 minutos"], "why": "La asimetría de información es como se vive casi todo conflicto real: cada parte es razonable con lo que sabe. Ocultar media historia hace que la gente pregunte en vez de suponer, y la revelación convierte la frustración en curiosidad.", "stepsH": "Cómo hacerlo (≈ 15 minutos)", "steps": ["Formad parejas, mejor de equipos, regiones o niveles distintos.", "Un móvil por pareja, o dos con un código compartido.", "Cada uno lee su ficha en privado (1 minuto).", "Hablad 5 minutos hacia el objetivo común.", "Revelad los dos lados y comentad las tres preguntas.", "Cambiad de papel y repetid."], "debrief": ["¿Cuándo cambió tu visión de la otra persona?", "¿Qué pregunta abrió la conversación?", "¿Dónde aparece esta diferencia oculta en nuestro trabajo real?"], "notes": ["Los dos móviles pueden ir en idiomas distintos: el código mantiene la misma situación.", "Subraya que las diferencias son hábitos aprendidos, no personalidad ni nacionalidad.", "Las parejas profundizan más si usan antes el Atlas Intercultural."], "monday": "La próxima vez que una reacción te sorprenda, haz una pregunta antes de explicarte."}, "zh-Hant": {"product": "視角互換", "kicker": "人的能力 · 兩人一組", "lead": "兩位同事，一個尷尬的瞬間。你們每人只知道一半的故事。一起聊，直到找到前進的方向——然後看看對方一直在承受什麼。", "meta": ["2 個人", "1 或 2 部手機", "約 12 分鐘"], "why": "資訊不對稱正是大多數真實衝突的感覺：每一方根據自己知道的都很合理。藏起一半故事，讓人們去問而不是去猜——而最後的揭曉，會把不滿變成好奇。", "stepsH": "怎麼帶（約 15 分鐘）", "steps": ["兩兩配對——最好跨團隊、跨地區或跨層級。", "每組一部手機，或兩部手機共用一個程式碼。", "各自私下閱讀角色卡（1 分鐘）。", "圍繞共同目標聊 5 分鐘。", "揭曉兩邊的故事，討論三個問題。", "交換角色，再來一次。"], "debrief": ["你對對方的看法在什麼時候改變了？", "哪個問題開啟了對話？", "在我們的真實工作中，這個隱藏差異出現在哪裡？"], "notes": ["兩部手機可以用不同語言——程式碼保證情境相同。", "強調差異是習得的習慣，不是性格或國籍。", "先用跨文化圖鑑做預習，對話會更深入。"], "monday": "下次別人的反應讓你意外時，先問一個問題，再解釋自己。"}, "ca": {"product": "Canvi de Perspectiva", "kicker": "Habilitats humanes · Parelles", "lead": "Dos col·legues. Un moment incòmode. Cadascú coneix només la seva meitat de la història. Parleu fins a trobar una sortida i després descobriu què portava a sobre l'altra persona.", "meta": ["2 persones", "1 o 2 mòbils", "≈ 12 minuts"], "why": "L'asimetria d'informació és com es viu gairebé tot conflicte real: cada part és raonable amb el que sap. Amagar mitja història fa que la gent pregunti en lloc de suposar, i la revelació converteix la frustració en curiositat.", "stepsH": "Com fer-ho (≈ 15 minuts)", "steps": ["Feu parelles, millor d'equips, regions o nivells diferents.", "Un mòbil per parella, o dos amb un codi compartit.", "Cadascú llegeix la seva fitxa en privat (1 minut).", "Parleu 5 minuts cap a l'objectiu comú.", "Reveleu els dos costats i comenteu les tres preguntes.", "Canvieu de paper i repetiu."], "debrief": ["Quan va canviar la teva visió de l'altra persona?", "Quina pregunta va obrir la conversa?", "On apareix aquesta diferència amagada en la nostra feina real?"], "notes": ["Els dos mòbils poden anar en idiomes diferents: el codi manté la mateixa situació.", "Subratlla que les diferències són hàbits apresos, no personalitat ni nacionalitat.", "Les parelles aprofundeixen més si abans fan servir l'Atles Intercultural."], "monday": "La propera vegada que una reacció et sorprengui, fes una pregunta abans d'explicar-te."}}, "repair": {"en": {"product": "Repair Kit", "kicker": "Human skills · Pairs", "lead": "Everyone gets it wrong at work sometimes. What builds trust is the repair. Practise one with a colleague — one of you repairs, the other says honestly how it landed — then swap.", "meta": ["2 people", "1 phone", "≈ 12 minutes"], "why": "Most people avoid repairs because they never practised one. A safe, made-up misstep and an honest partner make the words familiar — so the real repair is easier to start.", "stepsH": "Running it (≈ 15 minutes)", "steps": ["Pair people up. One phone per pair.", "A picks a misstep and repairs it in under a minute.", "B says honestly how it landed, using a sentence starter.", "If it didn't land, B picks one hint and A tries once more.", "Swap roles.", "Close with the optional real opening line."], "debrief": ["Which of the three moves was hardest to say?", "What did the receiver need that surprised the repairer?", "What gets in the way of repairs in our team?"], "notes": ["Keep missteps made-up unless people choose otherwise.", "There is no score — “not yet” is useful information, not failure.", "Repairs never require the other person to forgive."], "monday": "Make one small repair: name what you did, how it may have landed, and what you'll do next."}, "zh": {"product": "修复工具包", "kicker": "人的能力 · 两人一组", "lead": "工作中谁都会犯错。真正建立信任的，是修复。和一位同事练习一次——一人修复，另一人诚实地说出感受——然后交换。", "meta": ["2 个人", "1 部手机", "约 12 分钟"], "why": "大多数人回避修复，是因为从没练习过。一个安全的、虚构的失误，加上一位诚实的伙伴，会让这些话变得熟悉——真正的修复也就更容易开口。", "stepsH": "怎么带（约 15 分钟）", "steps": ["两两配对，每组一部手机。", "A 选一个失误，在一分钟内完成修复。", "B 用句子开头，诚实地说出感受。", "如果没有效果，B 选一个提示，A 再试一次。", "交换角色。", "最后可选：写下一句真实的开场白。"], "debrief": ["三个动作里，哪一个最难说出口？", "接受修复的一方需要什么，让修复的一方感到意外？", "在我们团队里，是什么在阻碍修复？"], "notes": ["除非大家愿意，失误都用虚构的。", "没有分数——“还没有”是有用的信息，不是失败。", "修复从不要求对方必须原谅。"], "monday": "做一次小小的修复：说出你做了什么、可能带来的影响、以及接下来会怎么做。"}, "es": {"product": "Kit de Reparación", "kicker": "Habilidades humanas · Parejas", "lead": "Todos nos equivocamos alguna vez en el trabajo. Lo que construye confianza es la reparación. Practica una con un colega: uno repara, el otro dice con honestidad cómo le llegó, y luego cambiáis.", "meta": ["2 personas", "1 móvil", "≈ 12 minutos"], "why": "Casi todos evitamos reparar porque nunca lo hemos practicado. Un error inventado y seguro, y una pareja honesta, hacen que las palabras resulten familiares, y así cuesta menos empezar la reparación real.", "stepsH": "Cómo hacerlo (≈ 15 minutos)", "steps": ["Formad parejas. Un móvil por pareja.", "A elige un error y lo repara en menos de un minuto.", "B dice con honestidad cómo le llegó, con un inicio de frase.", "Si no funcionó, B elige una pista y A lo intenta una vez más.", "Cambiad de papel.", "Cerrad con la frase real opcional."], "debrief": ["¿Cuál de los tres pasos costó más decir?", "¿Qué necesitaba quien recibía que sorprendió a quien reparaba?", "¿Qué frena las reparaciones en nuestro equipo?"], "notes": ["Usad errores inventados, salvo que la gente elija otra cosa.", "No hay puntuación: “todavía no” es información útil, no un fracaso.", "Reparar nunca exige que la otra persona perdone."], "monday": "Haz una pequeña reparación: di lo que hiciste, cómo pudo llegar y qué harás después."}, "zh-Hant": {"product": "修復工具包", "kicker": "人的能力 · 兩人一組", "lead": "工作中誰都會犯錯。真正建立信任的，是修復。和一位同事練習一次——一人修復，另一人誠實地說出感受——然後交換。", "meta": ["2 個人", "1 部手機", "約 12 分鐘"], "why": "大多數人迴避修復，是因為從沒練習過。一個安全的、虛構的失誤，加上一位誠實的夥伴，會讓這些話變得熟悉——真正的修復也就更容易開口。", "stepsH": "怎麼帶（約 15 分鐘）", "steps": ["兩兩配對，每組一部手機。", "A 選一個失誤，在一分鐘內完成修復。", "B 用句子開頭，誠實地說出感受。", "如果沒有效果，B 選一個提示，A 再試一次。", "交換角色。", "最後可選：寫下一句真實的開場白。"], "debrief": ["三個動作裡，哪一個最難說出口？", "接受修復的一方需要什麼，讓修復的一方感到意外？", "在我們團隊裡，是什麼在阻礙修復？"], "notes": ["除非大家願意，失誤都用虛構的。", "沒有分數——“還沒有”是有用的資訊，不是失敗。", "修復從不要求對方必須原諒。"], "monday": "做一次小小的修復：說出你做了什麼、可能帶來的影響、以及接下來會怎麼做。"}, "ca": {"product": "Kit de Reparació", "kicker": "Habilitats humanes · Parelles", "lead": "Tots ens equivoquem alguna vegada a la feina. El que construeix confiança és la reparació. Practica'n una amb un col·lega: un repara, l'altre diu amb honestedat com li ha arribat, i després canvieu.", "meta": ["2 persones", "1 mòbil", "≈ 12 minuts"], "why": "Gairebé tots evitem reparar perquè no ho hem practicat mai. Un error inventat i segur, i una parella honesta, fan que les paraules resultin familiars, i així costa menys començar la reparació real.", "stepsH": "Com fer-ho (≈ 15 minuts)", "steps": ["Formeu parelles. Un mòbil per parella.", "A tria un error i el repara en menys d'un minut.", "B diu amb honestedat com li ha arribat, amb un inici de frase.", "Si no ha funcionat, B tria una pista i A ho prova una vegada més.", "Canvieu de paper.", "Tanqueu amb la frase real opcional."], "debrief": ["Quin dels tres passos ha costat més de dir?", "Què necessitava qui rebia que ha sorprès qui reparava?", "Què frena les reparacions al nostre equip?"], "notes": ["Feu servir errors inventats, llevat que la gent triï una altra cosa.", "No hi ha puntuació: “encara no” és informació útil, no un fracàs.", "Reparar mai no exigeix que l'altra persona perdoni."], "monday": "Fes una petita reparació: digues què vas fer, com va poder arribar i què faràs després."}}, "teachback": {"en": {"product": "Teach-Back Chain", "kicker": "Learning by teaching", "lead": "The surest way to learn something is to teach it. Each time you pass a skill on — and your colleague says it back in their own words — it becomes a link in your chain.", "why": "Explaining something forces you to organise it; hearing it back in someone else's words shows what actually landed. It turns a training day into a ripple through the team.", "stepsH": "Running it (≈ 10 minutes)", "steps": ["At the end of a session, pair people with someone who wasn't in it — or across pairs.", "Each person teaches one idea in two minutes.", "The learner says it back in their own words on the teacher's phone.", "The teacher names one thing the learner added.", "Within a week, each learner teaches it on once more."], "debrief": ["What did you understand better by teaching it?", "What did your learner add that surprised you?", "Who else in your team should hear this — and who will tell them?"], "notes": ["The chain counts people helped, never compares people.", "Everything stays on this phone; nothing is uploaded.", "Every FREE//BUILDER demo on this phone adds to the same chain."], "monday": "After your next training, teach one idea to a colleague within 48 hours."}, "zh": {"product": "教回去链条", "kicker": "以教促学", "lead": "学会一件事最可靠的方法，就是把它教给别人。每当你把一项能力传下去——同事再用自己的话说回来——它就成为你链条上的一环。", "why": "讲解会逼你把知识理清楚；听别人用自己的话说回来，才知道什么真正被接住了。它让一天的培训，在团队里一圈圈传开。", "stepsH": "怎么带（约 10 分钟）", "steps": ["课程结束时，让每人找一位没参加的同事——或在组与组之间配对。", "每人用两分钟教一个想法。", "学的人在教的人手机上，用自己的话说回来。", "教的人说出一件对方补充的内容。", "一周内，每位学的人再往下教一次。"], "debrief": ["教的时候，你对哪部分理解得更深了？", "对方补充了什么让你意外的内容？", "团队里还有谁该听到——谁去告诉 TA？"], "notes": ["链条记录帮助过的人，从不比较人。", "一切只在这部手机上，不会上传。", "这部手机上的每个 FREE//BUILDER 练习，都汇入同一条链条。"], "monday": "下次培训后 48 小时内，把一个想法教给一位同事。"}, "es": {"product": "Cadena de Enseñar de Vuelta", "kicker": "Aprender enseñando", "lead": "La forma más segura de aprender algo es enseñarlo. Cada vez que transmites una habilidad —y tu colega te la devuelve con sus palabras— se convierte en un eslabón de tu cadena.", "why": "Explicar algo te obliga a ordenarlo; oírlo de vuelta con las palabras de otra persona muestra qué llegó de verdad. Convierte un día de formación en una onda que recorre el equipo.", "stepsH": "Cómo hacerlo (≈ 10 minutos)", "steps": ["Al final de una sesión, emparejad a cada persona con alguien que no estuvo, o entre parejas.", "Cada uno enseña una idea en dos minutos.", "Quien aprende la devuelve con sus palabras en el móvil de quien enseña.", "Quien enseña nombra algo que la otra persona añadió.", "En una semana, cada aprendiz la transmite una vez más."], "debrief": ["¿Qué entendiste mejor al enseñarlo?", "¿Qué añadió tu aprendiz que te sorprendió?", "¿Quién más del equipo debería oírlo, y quién se lo contará?"], "notes": ["La cadena cuenta personas ayudadas, nunca compara personas.", "Todo se queda en este móvil; no se sube nada.", "Todas las demos de FREE//BUILDER en este móvil suman a la misma cadena."], "monday": "Después de tu próxima formación, enseña una idea a un colega en menos de 48 horas."}, "zh-Hant": {"product": "教回去鏈條", "kicker": "以教促學", "lead": "學會一件事最可靠的方法，就是把它教給別人。每當你把一項能力傳下去——同事再用自己的話說回來——它就成為你鏈條上的一環。", "why": "講解會逼你把知識理清楚；聽別人用自己的話說回來，才知道什麼真正被接住了。它讓一天的培訓，在團隊裡一圈圈傳開。", "stepsH": "怎麼帶（約 10 分鐘）", "steps": ["課程結束時，讓每人找一位沒參加的同事——或在組與組之間配對。", "每人用兩分鐘教一個想法。", "學的人在教的人手機上，用自己的話說回來。", "教的人說出一件對方補充的內容。", "一週內，每位學的人再往下教一次。"], "debrief": ["教的時候，你對哪部分理解得更深了？", "對方補充了什麼讓你意外的內容？", "團隊裡還有誰該聽到——誰去告訴 TA？"], "notes": ["鏈條記錄幫助過的人，從不比較人。", "一切只在這部手機上，不會上傳。", "這部手機上的每個 FREE//BUILDER 練習，都匯入同一條鏈條。"], "monday": "下次培訓後 48 小時內，把一個想法教給一位同事。"}, "ca": {"product": "Cadena d'Ensenyar de Tornada", "kicker": "Aprendre ensenyant", "lead": "La manera més segura d'aprendre una cosa és ensenyar-la. Cada vegada que transmets una habilitat —i el teu col·lega te la retorna amb les seves paraules— es converteix en una baula de la teva cadena.", "why": "Explicar una cosa t'obliga a ordenar-la; sentir-la de tornada amb les paraules d'una altra persona mostra què ha arribat de veritat. Converteix un dia de formació en una ona que recorre l'equip.", "stepsH": "Com fer-ho (≈ 10 minuts)", "steps": ["Al final d'una sessió, aparelleu cada persona amb algú que no hi era, o entre parelles.", "Cadascú ensenya una idea en dos minuts.", "Qui aprèn la retorna amb les seves paraules al mòbil de qui ensenya.", "Qui ensenya anomena una cosa que l'altra persona ha afegit.", "En una setmana, cada aprenent la transmet una vegada més."], "debrief": ["Què vas entendre millor en ensenyar-ho?", "Què va afegir el teu aprenent que et va sorprendre?", "Qui més de l'equip ho hauria de sentir, i qui li ho explicarà?"], "notes": ["La cadena compta persones ajudades, mai no compara persones.", "Tot es queda en aquest mòbil; no es puja res.", "Totes les demos de FREE//BUILDER d'aquest mòbil sumen a la mateixa cadena."], "monday": "Després de la teva propera formació, ensenya una idea a un col·lega en menys de 48 hores."}}, "discovery": {"en": {"product": "Discovery Duet", "kicker": "Client conversations · Pairs", "lead": "Every client asks for something. Few ask for what they really need. One of you plays a client with a hidden need; the other asks — no pitching — until they find it. Then swap.", "meta": ["2 people", "1 phone", "≈ 15 minutes"], "why": "The stated request is rarely the real need. Hiding the need on a card makes curiosity the only way forward, and the pitch bell turns a bad habit into a shared joke instead of a judgment.", "stepsH": "Running it (≈ 20 minutes)", "steps": ["Pair people up. One phone per pair.", "The client reads their card in private (1 minute).", "The asker has 4 minutes: questions only. The client taps the bell on any pitch.", "The asker summarises the need aloud, then reveals the card.", "Discuss the three questions, then swap."], "debrief": ["Which kinds of questions surfaced the hidden need?", "What made it hard not to pitch?", "Which real client are we probably pitching to too early?"], "notes": ["Works for internal stakeholders too — HR, IT, finance.", "The bell count is never compared between people.", "The goal is understanding the client, not winning them over."], "monday": "In your next client or stakeholder call, ask two more questions before you suggest anything."}, "zh": {"product": "探询二重奏", "kicker": "客户对话 · 两人一组", "lead": "每个客户都会提要求，但很少有人直接说出真正的需求。一人扮演带着隐藏需求的客户，另一人只提问、不推销，直到找到它。然后交换。", "meta": ["2 个人", "1 部手机", "约 15 分钟"], "why": "表面的要求很少是真正的需求。把需求藏在卡片上，好奇心就成了唯一的出路；而“推销铃”把一个坏习惯变成大家一起笑的梗，而不是评判。", "stepsH": "怎么带（约 20 分钟）", "steps": ["两两配对，每组一部手机。", "客户私下阅读卡片（1 分钟）。", "提问者有 4 分钟：只能提问。客户一听到推销就按铃。", "提问者大声总结需求，然后揭晓卡片。", "讨论三个问题，然后交换。"], "debrief": ["哪类问题让隐藏需求浮出水面？", "是什么让你忍不住想推销？", "我们可能正在对哪位真实客户推销得太早？"], "notes": ["同样适用于内部相关方——HR、IT、财务。", "铃声次数从不在人与人之间比较。", "目标是理解客户，而不是拿下客户。"], "monday": "在下一次客户或相关方沟通中，提任何建议之前，多问两个问题。"}, "es": {"product": "Dúo de Descubrimiento", "kicker": "Conversaciones con clientes · Parejas", "lead": "Todo cliente pide algo. Pocos piden lo que de verdad necesitan. Uno hace de cliente con una necesidad oculta; el otro pregunta —sin vender— hasta encontrarla. Luego cambiáis.", "meta": ["2 personas", "1 móvil", "≈ 15 minutos"], "why": "La petición declarada rara vez es la necesidad real. Ocultarla en una tarjeta hace que la curiosidad sea el único camino, y la campana convierte un mal hábito en una broma compartida, no en un juicio.", "stepsH": "Cómo hacerlo (≈ 20 minutos)", "steps": ["Formad parejas. Un móvil por pareja.", "El cliente lee su tarjeta en privado (1 minuto).", "Quien pregunta tiene 4 minutos: solo preguntas. El cliente toca la campana ante cualquier venta.", "Quien pregunta resume la necesidad en voz alta y luego se revela la tarjeta.", "Comentad las tres preguntas y cambiad."], "debrief": ["¿Qué tipo de preguntas sacaron la necesidad oculta?", "¿Qué hizo difícil no vender?", "¿A qué cliente real le estamos vendiendo demasiado pronto?"], "notes": ["Funciona también con clientes internos: RR. HH., IT, finanzas.", "El número de campanas nunca se compara entre personas.", "El objetivo es entender al cliente, no ganárselo."], "monday": "En tu próxima llamada con un cliente o una parte interesada, haz dos preguntas más antes de sugerir nada."}, "zh-Hant": {"product": "探詢二重奏", "kicker": "客戶對話 · 兩人一組", "lead": "每個客戶都會提要求，但很少有人直接說出真正的需求。一人扮演帶著隱藏需求的客戶，另一人只提問、不推銷，直到找到它。然後交換。", "meta": ["2 個人", "1 部手機", "約 15 分鐘"], "why": "表面的要求很少是真正的需求。把需求藏在卡片上，好奇心就成了唯一的出路；而“推銷鈴”把一個壞習慣變成大家一起笑的梗，而不是評判。", "stepsH": "怎麼帶（約 20 分鐘）", "steps": ["兩兩配對，每組一部手機。", "客戶私下閱讀卡片（1 分鐘）。", "提問者有 4 分鐘：只能提問。客戶一聽到推銷就按鈴。", "提問者大聲總結需求，然後揭曉卡片。", "討論三個問題，然後交換。"], "debrief": ["哪類問題讓隱藏需求浮出水面？", "是什麼讓你忍不住想推銷？", "我們可能正在對哪位真實客戶推銷得太早？"], "notes": ["同樣適用於內部相關方——HR、IT、財務。", "鈴聲次數從不在人與人之間比較。", "目標是理解客戶，而不是拿下客戶。"], "monday": "在下一次客戶或相關方溝通中，提任何建議之前，多問兩個問題。"}, "ca": {"product": "Duo de Descobriment", "kicker": "Converses amb clients · Parelles", "lead": "Tot client demana alguna cosa. Pocs demanen el que de veritat necessiten. Un fa de client amb una necessitat oculta; l'altre pregunta —sense vendre— fins a trobar-la. Després canvieu.", "meta": ["2 persones", "1 mòbil", "≈ 15 minuts"], "why": "La petició declarada poques vegades és la necessitat real. Amagar-la en una targeta fa que la curiositat sigui l'únic cam if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("/sw.js", { scope: "/" }).catch(() => {});
