/* =====================================================================
   FB KIT · helpers (copy into every demo)
   ===================================================================== */
const LANGS = ["en", "zh", "zh-Hant", "es", "ca"], LANG_LBL = { en: "EN", zh: "中文", es: "ES", "zh-Hant": "繁中", "ca": "CA" };
let lang = "en";
const T = () => I18N[lang];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (s, v = {}) => String(s).replace(/\{(\w+)\}/g, (m, k) => (k in v ? esc(v[k]) : m));
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

/* Seeded random + pairing codes: the same code on two phones gives the same scenario, no server needed. */
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const CODE_CHARS = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
function newCode(n = 6) { let s = ""; for (let i = 0; i < n; i++) s += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]; return s; }
function seedFrom(code) { let h = 2166136261; for (const c of String(code).toUpperCase()) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

/* Sound: soft, short, optional */
const sound = {
  ctx: null, muted: store.get("fb_muted", false),
  init() { if (!this.ctx) { const A = window.AudioContext || window.webkitAudioContext; if (A) this.ctx = new A(); } if (this.ctx && this.ctx.state === "suspended") this.ctx.resume(); },
  tone(f, d = .3, g = .06, type = "sine", at = 0) {
    if (this.muted || !this.ctx) return;
    try { const t = this.ctx.currentTime + at, o = this.ctx.createOscillator(), a = this.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t); a.gain.setValueAtTime(.0001, t); a.gain.linearRampToValueAtTime(g, t + .02); a.gain.exponentialRampToValueAtTime(.0001, t + d);
      o.connect(a); a.connect(this.ctx.destination); o.start(t); o.stop(t + d + .05); } catch (e) {}
  },
  tap() { this.tone(520, .12, .04, "triangle"); },
  chime() { [659.25, 880, 1318.5].forEach((f, i) => this.tone(f, 1.2, .05, "sine", i * .12)); },
  warm() { [392, 493.88, 587.33].forEach((f, i) => this.tone(f, .9, .05, "sine", i * .1)); }
};
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

/* Keep the screen awake while a timer runs (where supported) */
let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && "wakeLock" in navigator && !wakeLock) wakeLock = await navigator.wakeLock.request("screen");
    if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) { wakeLock = null; }
}

/* Timer ring */
function ringSVG() {
  return `<svg viewBox="0 0 120 120" aria-hidden="true"><circle class="bg" cx="60" cy="60" r="54" fill="none" stroke-width="6"/><circle class="fg" id="ring" cx="60" cy="60" r="54" fill="none" stroke-width="6" stroke-linecap="round" stroke-dasharray="339.29" stroke-dashoffset="0"/></svg>`;
}
const timer = {
  total: 90, left: 90, running: false, raf: 0, last: 0, onEnd: null, ended: false,
  start(total, onEnd) { this.stop(); this.total = this.left = total; this.onEnd = onEnd; this.ended = false; this.resume(); },
  resume() { if (this.running || this.ended) return; this.running = true; this.last = performance.now(); keepAwake(true); this.tick(); },
  pause() { this.running = false; cancelAnimationFrame(this.raf); keepAwake(false); this.paint(); },
  stop() { this.running = false; cancelAnimationFrame(this.raf); keepAwake(false); },
  tick() {
    if (!this.running) return;
    const now = performance.now(); this.left = Math.max(0, this.left - (now - this.last) / 1000); this.last = now;
    this.paint();
    if (this.left <= 0) { this.running = false; this.ended = true; keepAwake(false); sound.chime(); buzz([60, 80, 60]); this.onEnd && this.onEnd(); return; }
    this.raf = requestAnimationFrame(() => this.tick());
  },
  paint() {
    const ring = $("ring"), num = $("tnum"), lbl = $("tlbl"), wrap = $("timer");
    if (!ring) return;
    ring.setAttribute("stroke-dashoffset", String(339.29 * (1 - this.left / this.total)));
    const s = Math.ceil(this.left);
    num.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
    lbl.textContent = this.ended ? "" : (this.running ? T().left : T().paused);
    wrap.classList.toggle("done", this.ended);
  }
};

/* Toast */
let toastT;
function toast(msg) { const el = $("toast"); el.textContent = msg; el.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 2600); }

/* Pass-the-phone curtain */
function curtainHTML(title, lead, btnLabel, act) {

}



/* =====================================================================
   COST CALCULATOR
   ===================================================================== */
const CUR = { CNY: { sym: "¥", salary: 250000 }, EUR: { sym: "€", salary: 45000 }, USD: { sym: "$", salary: 70000 } };
const L0 = (() => { let l = null; try { l = localStorage.getItem("wm_preferred_lang"); } catch (e) {} const n = (navigator.language || "").toLowerCase(); return l || (n.startsWith("zh") ? "zh" : n.startsWith("es") ? "es" : "en"); })();
const S = { cur: { zh: "CNY", es: "EUR", en: "USD", "zh-Hant": "CNY", "ca": "EUR" }[L0] || "USD", people: 60, hours: 16, salary: null, work: 1800, used: 20, touched: false };

function money(v) {
  try { return new Intl.NumberFormat((/*i18n*/lang === "zh" ? "zh-CN" : (lang === "zh-Hant" ? "zh-TW" : lang)), { style: "currency", currency: S.cur, maximumFractionDigits: 0 }).format(v); }
  catch (e) { return CUR[S.cur].sym + Math.round(v).toLocaleString(); }
}
function calc() {
  const salary = S.salary == null ? CUR[S.cur].salary : S.salary;
  const hourly = salary / Math.max(1, S.work);
  const time = S.people * S.hours * hourly;
  const wasted = time * (1 - S.used / 100);
  const sessions = Math.floor(S.hours * 3);
  return { salary, hourly, time, wasted, per: S.people ? wasted / S.people : 0, sessions, perMonth: Math.max(1, Math.round(sessions / 12)) };
}

function num(id, label, val, min, max, step, extra = "") {
  return `<label class="field"><span>${esc(label)}</span><input id="${id}" type="number" inputmode="decimal" min="${min}" max="${max}" step="${step}" value="${val}" ${extra}></label>`;
}

function render() {
  const t = T(), stage = $("stage"), c = calc();
  $("steps").innerHTML = "";
  const focusId = stage.contains(document.activeElement) ? document.activeElement.id : null;
  stage.innerHTML = `<section class="screen">
    <span class="kicker">${t.introKicker}</span><h1>${t.introTitle}</h1>
    <p class="lead">${esc(t.introLead)}</p>
    <div class="card" style="display:grid;gap:12px">
      <span class="kicker">${esc(t.inputs)}</span>
      <div><span class="kicker" style="font-size:10px">${esc(t.currency)}</span><div class="seg" role="group" style="margin-top:6px">${Object.keys(CUR).map(k => `<button type="button" data-cur="${k}" aria-pressed="${S.cur === k}">${CUR[k].sym} ${k}</button>`).join("")}</div></div>
      <div class="row2">${num("inPeople", t.people, S.people, 1, 100000, 1)}${num("inHours", t.hours, S.hours, 0, 500, 1)}</div>
      ${num("inSalary", t.salary, Math.round(c.salary), 0, 100000000, 1000)}
      ${num("inWork", t.workHours, S.work, 500, 3000, 10)}
      <label class="field"><span>${esc(t.used)} — <b id="usedOut" style="color:var(--ink)">${S.used}%</b></span><input id="inUsed" type="range" min="0" max="100" step="5" value="${S.used}" style="width:100%;accent-color:#E2553F"></label>
      <p style="margin:-4px 0 0;font-size:12.5px;color:var(--muted)">${esc(t.usedHint)}</p>
    </div>
    <div id="out">${outHTML(c)}</div>
  </section>`;
  if (focusId && $(focusId)) $(focusId).focus({ preventScroll: true });
}

function outHTML(c) {
  const t = T(), usedPct = S.used;
  return `<div class="card" style="display:grid;gap:14px;background:var(--inkbg,var(--ink));color:#fff;border-color:var(--inkbd,var(--ink))">
      <span class="kicker" style="color:rgba(255,255,255,.55)">${esc(t.outKicker)}</span>
      <div><span style="font-size:13px;color:rgba(255,255,255,.7)">${esc(t.timeCost)}</span><div style="font-family:var(--syne);font-weight:700;font-size:clamp(26px,7vw,36px)">${esc(money(c.time))}</div></div>
      <div role="img" aria-label="${esc(usedPct + "% " + t.usedLbl + ", " + (100 - usedPct) + "% " + t.notUsedLbl)}" style="display:flex;height:14px;border-radius:7px;overflow:hidden;background:rgba(255,255,255,.12)">
        <span style="width:${usedPct}%;background:#7FD1A4"></span><span style="width:${100 - usedPct}%;background:#E2553F"></span></div>
      <div style="display:flex;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.75)"><span><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#7FD1A4;margin-right:6px"></i>${usedPct}% ${esc(t.usedLbl)}</span><span><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#E2553F;margin-right:6px"></i>${100 - usedPct}% ${esc(t.notUsedLbl)}</span></div>
      <div><span style="font-size:13px;color:rgba(255,255,255,.7)">${esc(t.wasted)}</span><div style="font-family:var(--syne);font-weight:700;font-size:clamp(30px,8vw,44px);color:#F2A091">${esc(money(c.wasted))}</div>
        <span style="font-family:var(--mono);font-size:12px;color:rgba(255,255,255,.6)">${esc(money(c.per))} ${esc(t.perPerson)}</span></div>
    </div>
    <div class="tip" style="margin-top:14px"><i>✦</i><span><b>${esc(t.sameHours)}</b>${esc(fmt(t.sameHoursTxt, { h: S.hours, n: c.sessions, w: c.perMonth }).replace(/&amp;/g, "&"))}</span></div>
    <div class="card" style="margin-top:14px"><span class="kicker">${esc(t.talkLbl)}</span>
      <ol style="margin:10px 0 0;padding-left:20px;display:grid;gap:8px;font-family:var(--serif);font-style:italic;font-size:18px;line-height:1.35">${t.talkQs.map(q => `<li>${esc(q)}</li>`).join("")}</ol></div>
    <div class="monday" style="margin-top:14px"><b>${esc(t.monday)}</b>${esc(t.mondayTxt)}</div>
    <div class="btns" style="margin-top:14px"><button class="btn" data-act="copy">⧉ ${esc(t.copy)}</button></div>
    <a class="link" href="/tools/diagnose" style="display:inline-block;margin-top:12px">${esc(t.diagnose)}</a>`;
}

function paintOut() { const o = $("out"); if (o) o.innerHTML = outHTML(calc()); const u = $("usedOut"); if (u) u.textContent = S.used + "%"; }

function summaryText() {
  const t = T(), c = calc();
  return [t.summaryHead, `${t.people}: ${S.people} · ${t.hours}: ${S.hours} · ${t.salary}: ${money(c.salary)} · ${t.workHours}: ${S.work} · ${t.used}: ${S.used}%`, "",
    `${t.timeCost}: ${money(c.time)}`, `${t.wasted}: ${money(c.wasted)} (${money(c.per)} ${t.perPerson})`, "",
    fmt(t.sameHoursTxt, { h: S.hours, n: c.sessions, w: c.perMonth }).replace(/&amp;/g, "&"), "", ...t.talkQs.map(q => `? ${q}`), "", "freebuilder.net/tools/cost"].join("\n");
}

$("stage").addEventListener("input", e => {
  const v = parseFloat(e.target.value), ok = Number.isFinite(v) && v >= 0;
  switch (e.target.id) {
    case "inPeople": if (ok) S.people = Math.round(v); break;
    case "inHours": if (ok) S.hours = v; break;
    case "inSalary": if (ok) S.salary = v; break;
    case "inWork": if (ok && v > 0) S.work = v; break;
    case "inUsed": if (ok) S.used = Math.min(100, Math.round(v)); break;
    default: return;
  }
  paintOut();
});
$("stage").addEventListener("click", e => {
  sound.init();
  const cb = e.target.closest("[data-cur]"), a = e.target.closest("[data-act]");
  if (cb) { S.cur = cb.dataset.cur; S.salary = null; sound.tap(); render(); return; }
  if (a && a.dataset.act === "copy") {
    const text = summaryText(), ok = () => toast(T().copied);
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(ok).catch(fb); else fb();
    function fb() { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch (_) {} ta.remove(); ok(); }
  }
});

function teachHTML() { return ""; }
window.__app = { S, calc, render, summaryText };

/* ---------- facilitator guide ---------- */
const drawer = $("drawer");
function openGuide() {
  const t = T();
  $("panel").innerHTML = `
    <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start">
      <div><span class="kicker">${esc(t.gKicker)}</span><h3 id="g-title">${esc(t.gTitle)}</h3></div>

function closeGuide() { drawer.classList.remove("show"); $("btn-guide").focus({ preventScroll: true }); }

/* ---------- language + sound ---------- */
function paintSound() {
  const b = $("btn-sound"), t = T();
  b.innerHTML = sound.muted
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m22 9-6 6M16 9l6 6"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>';
  b.setAttribute("aria-label", sound.muted ? t.soundOff : t.soundOn); b.title = b.getAttribute("aria-label");
}
$("btn-sound").addEventListener("click", () => { sound.muted = !sound.muted; store.set("fb_muted", sound.muted); sound.init(); paintSound(); if (!sound.muted) sound.tap(); });

function applyLang(l) {
  lang = LANGS.includes(l) ? l : "en";
  document.documentElement.lang = (/*i18n*/lang === "zh" ? "zh-CN" : (lang === "zh-Hant" ? "zh-TW" : lang));
  document.title = T().title;
  $("lang-lbl").textContent = LANG_LBL[lang];
  $("btn-guide").setAttribute("aria-label", T().guide); drawer.setAttribute("aria-label", T().guide);
  document.querySelectorAll("[data-t]").forEach(el => { const v = T()[el.dataset.t]; if (typeof v === "string") el.textContent = v; });
  paintSound();
  render();               // the clock object survives a re-render
  timer.paint();
  const pb = $("pauseBtn"); if (pb && !timer.running && !timer.ended) pb.textContent = T().resume;
  if (drawer.classList.contains("show")) openGuide();
  try { localStorage.setItem("wm_preferred_lang", lang); localStorage.setItem("wm_cases_lang", lang); } catch (e) {}
}
$("btn-lang").addEventListener("click", () => applyLang(LANGS[(LANGS.indexOf(lang) + 1) % LANGS.length]));
window.FBL_SET = l => applyLang(l); window.FBL_GET = () => lang;

/* ---------- boot ---------- */
let saved = null;
try { saved = localStorage.getItem("wm_preferred_lang") || localStorage.getItem("wm_cases_lang"); } catch (e) {}
const nav = (navigator.language || "").toLowerCase();
applyLang(LANGS.includes(saved) ? saved : nav.startsWith("zh") ? "zh" : nav.startsWith("es") ? "es" : "en");
document.addEventListener("visibilitychange", () => { if (!document.hidden && timer.running) keepAwake(true); });
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("/sw.js", { scope: "/" }).catch(() => {}); // offline cache
})();
