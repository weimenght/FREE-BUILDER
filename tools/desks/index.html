/* Keep the screen awake while a timer runs (where supported) */
let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && "wakeLock" in navigator && !wakeLock) wakeLock = await navigator.wakeLock.request("screen");
    if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }

}

/* Timer ring */
function ringSVG() {
  return `<svg viewBox="0 0 120 120" aria-hidden="true"><circle class="bg" cx="60" cy="60" r="54" fill="none" stroke-width="6"/><circle class="fg" id="ring" cx="60" cy="60" r="54" fill="none" stroke-width="6" stroke-linecap="round" stroke-dasharray="339.29" stroke-dashoffset="0"/></svg>`;
}
const timer = {
  total: 90, left: 90, running: false, raf: 0, last: 0, onEnd: null, ended: false,
  start(total, onEnd) { this.stop(); this.total = this.left = total; this.onEnd = onEnd; this.ended = false; this.resume(); },
  resume() { if (this.running || this.ended) return; this.running = true; this.last = performance.now(); keepAwake(true); this.tick(); },
  pause() { this.running = false; cancelAnimationFrame(this.raf); keepAwake(false); this.paint(); },
  stop() { this.running = false; cancelAnimationFrame(this.raf); keepAwake(false); },
  tick() {
    if (!this.running) return;
    const now = performance.now(); this.left = Math.max(0, this.left - (now - this.last) / 1000); this.last = now;
    this.paint();
    if (this.left <= 0) { this.running = false; this.ended = true; keepAwake(false); sound.chime(); buzz([60, 80, 60]); this.onEnd && this.onEnd(); return; }
    this.raf = requestAnimationFrame(() => this.tick());
  },
  paint() {
    const ring = $("ring"), num = $("tnum"), lbl = $("tlbl"), wrap = $("timer");
    if (!ring) return;
    ring.setAttribute("stroke-dashoffset", String(339.29 * (1 - this.left / this.total)));
    const s = Math.ceil(this.left);
    num.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
    lbl.textContent = this.ended ? "" : (this.running ? T().left : T().paused);
    wrap.classList.toggle("done", this.ended);
  }
};
