   sit: "经理在规划会结尾问：“有没有异议？”——一片安静。一周后，经理从别人那里听说，资深工程师觉得这个计划有风险。",
   goal: "商量好风险怎样及时传到经理这里。",
   a: { r: "经理", b: ["你公开问了。没人说话就是同意——问这个问题就是为了这个。", "从别人那里听到，感觉像被绕过了。", "你是真心想早点听到坏消息。"] },
   b: { r: "资深工程师", b: ["当着全组的面反驳经理，你觉得非常不尊重。", "你通过一位信任的同事转达了——你以为这是得体的方式。", "会议最后那句“有没有异议？”听起来像走个形式。"] },
   diff: "低权力距离与高权力距离。有人在任何场合都会直接对任何人发言；有人表达尊重的方式，是私下或通过他人提出顾虑。开放的问题，不一定是敞开的门。" },
 { dim: "任务优先 ↔ 关系优先", title: "第一次通话",
   sit: "和新供应商的第一次视频会议。十分钟后，采购方就开始谈价格和合同条款。供应商明显变得拘谨起来。",
   goal: "一起规划下一次会议。",
   a: { r: "采购方", b: ["你时间很紧，直奔主题是一种礼貌。", "你对这个供应商印象很好——所以才直接谈条款。", "供应商突然变得拘谨，让你很困惑。"] },
   b: { r: "供应商", b: ["在稍微了解对方之前，你没法信任一个合作伙伴。", "一上来就谈价格，感觉像被当成了自动售货机。", "你准备好了要聊两个团队怎么合作。"] },
   diff: "基于任务的信任与基于关系的信任。有人先看到好的工作，才建立信任；有人先建立信任，才会有好的工作。寒暄可能才是真正的正事。" },
 { dim: "果断 ↔ 共识", title: "一纸通知",
   sit: "组长在周一全员会上宣布全组改用一个新工具。到了周三，分析师的小组悄悄换回了旧工具。",
   goal: "商量好下一个团队决定要怎么做。",
   a: { r: "组长", b: ["你决定得很快，因为上次等待让团队损失了好几周。", "你觉得清楚地宣布出来，才是尊重大家。", "悄悄换回旧工具，感觉像是在拆台。"] },
   b: { r: "分析师", b: ["你的团队期待：影响日常工作的改变，事先要征求意见。", "没有征求意见的决定，让你觉得自己的专业不被重视。", "你知道新工具有一个缺陷，但没人问过。"] },
   diff: "自上而下与共识决策。有的团队重视领导快速拍板；有的团队重视花时间让每个人一起走。快速的决定，落地可能很慢。" },
 { dim: "随时在线 ↔ 守护时间", title: "晚上 11 点的消息",
   sit: "晚上 11 点，一位同事发来消息：“能帮忙看下这个 PPT 吗？”另一位第二天早上 9 点才回。之后这位同事在站会上问为什么这么久才回。",
   goal: "商量出对你们俩都合适的消息规则。",
   a: { r: "发消息的同事", b: ["你习惯晚上工作，因为那时才能静下心来——通常你并不期待马上回复……", "但这一次，客户早上 8 点就要看这份 PPT。", "你没说很急，你以为这很明显。"] },
   b: { r: "回消息的同事", b: ["晚上属于家人，你是故意关掉手机的。", "晚上 11 点的消息让你觉得必须随时待命。", "在站会上被问起，感觉像被当众指责。"] },
   diff: "边界与紧急程度。团队对下班后的消息是否可以、是否被期待、是否打扰，看法各不相同。没说出口的紧急，才是真正的陷阱。" }
],
es: [
 { dim: "Feedback directo ↔ indirecto", title: "La revisión silenciosa",
   sit: "Revisión de diseño de ayer. Delante del equipo, la persona líder dijo: “Esto no funciona. Hay que repensarlo.” La diseñadora no volvió a hablar en toda la reunión.",
   goal: "Acordad cómo os daréis feedback antes de la próxima revisión.",
   a: { r: "líder del equipo", b: ["Decirlo claro es tu forma de mostrar respeto: no haces perder el tiempo.", "La diseñadora se quedó callada y supusiste que estaba de acuerdo.", "Te preocupa que el lanzamiento se retrase si los problemas no se nombran pronto."] },
   b: { r: "diseñadora", b: ["Donde aprendiste a trabajar, una crítica delante de otros es quedar en evidencia.", "Tu silencio era dolor, no acuerdo.", "Habrías agradecido el mismo comentario a solas."] },
   diff: "Comunicación directa frente a indirecta. En unos equipos, decirlo claro es respeto; en otros, el respeto es decirlo en privado y con suavidad. El silencio puede significar cosas muy distintas." },
 { dim: "Tiempo fijo ↔ flexible", title: "“Para el viernes”",
   sit: "El equipo socio prometió los datos “para el viernes”. Es lunes, no han llegado y la jefa de proyecto ha enviado dos mensajes cada vez más secos.",
   goal: "Acordad un nuevo plan, y cómo hablaréis de fechas a partir de ahora.",
   a: { r: "jefa de proyecto", b: ["“Viernes” significa viernes a las 17:00. Todo tu plan dependía de eso.", "Ya has tenido que explicar el retraso a tu directora.", "Nadie te avisó de que se retrasaba: eso es lo que más duele."] },
   b: { r: "responsable del equipo socio", b: ["Para ti, “viernes” era una estimación de buena fe, no un contrato.", "El miércoles un cliente clave tuvo una crisis; elegiste al cliente y lo volverías a hacer.", "Los mensajes secos te parecieron fríos, después de años trabajando bien juntos."] },
   diff: "Tiempo de reloj frente a tiempo de evento. Unos equipos tratan las fechas como promesas fijas; otros, como estimaciones que se adaptan a las relaciones y a las urgencias. Ninguno es descuidado." },
 { dim: "Plano ↔ jerárquico", title: "“¿Alguna objeción?”",
   sit: "El jefe cerró la reunión de planificación con “¿Alguna objeción?”: silencio. Una semana después, supo por otra persona que la ingeniera sénior cree que el plan es arriesgado.",
   goal: "Acordad cómo llegarán los riesgos al jefe a tiempo.",
   a: { r: "jefe", b: ["Preguntaste abiertamente. El silencio es un sí: para eso era la pregunta.", "Enterarte por otros se siente como si te hubieran esquivado.", "De verdad quieres oír las malas noticias pronto."] },
   b: { r: "ingeniera sénior", b: ["Contradecir a tu jefe delante de todo el equipo te parece una falta de respeto.", "Lo hiciste llegar a través de un colega de confianza: el canal respetuoso, pensabas.", "“¿Alguna objeción?” al final de la reunión sonó a mera formalidad."] },
   diff: "Distancia jerárquica baja frente a alta. Hay quien habla a cualquiera en cualquier sala; hay quien muestra respeto planteando sus dudas en privado o a través de otros. Una pregunta abierta no siempre es una puerta abierta." },
 { dim: "Tarea primero ↔ relación primero", title: "La primera llamada",
   sit: "Primera videollamada con un proveedor nuevo. A los diez minutos, la compradora pasó a precios y condiciones. El proveedor se volvió claramente más reservado.",
   goal: "Planificad juntos la próxima reunión.",
   a: { r: "compradora", b: ["Vas justa de tiempo; ir al grano es una cortesía.", "El proveedor te gustó: por eso pasaste directamente a las condiciones.", "Su repentina reserva te desconcertó."] },
   b: { r: "proveedor", b: ["No puedes confiar en un socio sin conocerlo un poco.", "Saltar al precio te hizo sentir como una máquina expendedora.", "Habías preparado una charla sobre cómo podrían trabajar juntos los dos equipos."] },
   diff: "Confianza basada en la tarea frente a la relación. Para unos, la confianza llega tras el buen trabajo; para otros, el buen trabajo llega tras la confianza. La charla previa puede ser el verdadero negocio." },
 { dim: "Decidir rápido ↔ por consenso", title: "El anuncio",
   sit: "La líder anunció en la reunión general del lunes una herramienta nueva para todo el equipo. El miércoles, el equipo del analista había vuelto en silencio a la antigua.",
   goal: "Acordad cómo se tomará la próxima decisión del equipo.",
   a: { r: "líder del equipo", b: ["Decidiste rápido porque la última vez esperar costó semanas.", "Pensaste que anunciarlo con claridad era lo respetuoso.", "La vuelta silenciosa a la herramienta antigua te parece un sabotaje."] },
   b: { r: "analista", b: ["Tu equipo espera que le consulten antes de un cambio que afecta al día a día.", "Una decisión sin consulta te hizo sentir que tu experiencia no contaba.", "Conoces un fallo de la nueva herramienta por el que nadie preguntó."] },
   diff: "Decisiones de arriba abajo frente a consenso. Unos equipos valoran una decisión rápida desde arriba; otros, el tiempo que cuesta sumar a todos. Las decisiones rápidas pueden tardar en aterrizar." },
 { dim: "Siempre conectado ↔ tiempo protegido", title: "El mensaje de las 23:00",
   sit: "A las 23:00, una colega envió un mensaje: “¿Puedes revisar la presentación?” El otro respondió a las 9:00. Luego ella preguntó en la reunión diaria por qué había tardado tanto.",
   goal: "Acordad normas de mensajes que os sirvan a los dos.",
   a: { r: "colega que escribió", b: ["Trabajas tarde porque es cuando puedes pensar; normalmente no esperas respuesta inmediata…", "Esta vez, un cliente esperaba la presentación a las 8:00.", "No dijiste que era urgente; supusiste que era obvio."] },
   b: { r: "colega que respondió", b: ["Las noches son para tu familia; apagaste el móvil a propósito.", "El mensaje de las 23:00 te pareció una presión para estar siempre disponible.", "Que te lo preguntaran en la reunión diaria se sintió como una crítica en público."] },
   diff: "Límites y urgencia. Los equipos difieren en si los mensajes fuera de horario son normales, esperados o invasivos. La urgencia no dicha es la verdadera trampa." }
], "zh-Hant": [
 { dim: "直接 ↔ 含蓄的反饋", title: "沉默的評審",
   sit: "昨天的設計評審上，組長當著全組的面說：“這個不行，得重新想。”之後設計師一句話也沒再說。",
   goal: "在下次評審前，商量好你們以後怎麼給彼此反饋。",
   a: { r: "組長", b: ["有話直說是對人的尊重——不浪費大家的時間。", "設計師沒說話，你以為 TA 同意了。", "你擔心問題不早點說出來，上線會延期。"] },
   b: { r: "設計師", b: ["在你習慣的工作環境裡，當眾批評會讓人丟面子。", "你的沉默是因為受傷，不是同意。", "如果是一對一說同樣的話，你會很歡迎。"] },
   diff: "直接溝通與含蓄溝通。有的團隊裡，直說是尊重；有的團隊裡，尊重是私下、溫和地說。沉默可能意味著完全不同的東西。" },
 { dim: "固定 ↔ 彈性的時間", title: "“週五前”",
   sit: "合作團隊答應“週五前”給資料。現在是週一，資料還沒到，專案經理已經發了兩條越來越簡短的訊息。",
   goal: "商量一個新計劃——以及以後怎麼談日期。",
   a: { r: "專案經理", b: ["“週五”就是週五下午五點，你的整個計劃都建立在它上面。", "你已經不得不向總監解釋延期。", "沒人告訴你會延期——這才最讓你難受。"] },
   b: { r: "合作團隊負責人", b: ["對你來說，“週五”是一個真誠的估計，而不是合同。", "週三一個重要客戶出了緊急狀況，你選擇了客戶，再來一次也會這樣選。", "那幾條簡短的訊息讓你覺得很冷——明明合作了好幾年。"] },
   diff: "鐘錶時間與事件時間。有的團隊把截止日期當作固定承諾；有的團隊把它當作估計，會因關係和緊急事件而調整。兩者都不是不負責。" },
 { dim: "扁平 ↔ 層級", title: "“有沒有異議？”",
   sit: "經理在規劃會結尾問：“有沒有異議？”——一片安靜。一週後，經理從別人那裡聽說，資深工程師覺得這個計劃有風險。",
   goal: "商量好風險怎樣及時傳到經理這裡。",
   a: { r: "經理", b: ["你公開問了。沒人說話就是同意——問這個問題就是為了這個。", "從別人那裡聽到，感覺像被繞過了。", "你是真心想早點聽到壞訊息。"] },
   b: { r: "資深工程師", b: ["當著全組的面反駁經理，你覺得非常不尊重。", "你透過一位信任的同事轉達了——你以為這是得體的方式。", "會議最後那句“有沒有異議？”聽起來像走個形式。"] },
   diff: "低權力距離與高權力距離。有人在任何場合都會直接對任何人發言；有人表達尊重的方式，是私下或透過他人提出顧慮。開放的問題，不一定是敞開的門。" },
 { dim: "任務優先 ↔ 關係優先", title: "第一次通話",
   sit: "和新供應商的第一次視訊會議。十分鐘後，採購方就開始談價格和合同條款。供應商明顯變得拘謹起來。",
   goal: "一起規劃下一次會議。",
   a: { r: "採購方", b: ["你時間很緊，直奔主題是一種禮貌。", "你對這個供應商印象很好——所以才直接談條款。", "供應商突然變得拘謹，讓你很困惑。"] },
   b: { r: "供應商", b: ["在稍微瞭解對方之前，你沒法信任一個合作伙伴。", "一上來就談價格，感覺像被當成了自動售貨機。", "你準備好了要聊兩個團隊怎麼合作。"] },
   diff: "基於任務的信任與基於關係的信任。有人先看到好的工作，才建立信任；有人先建立信任，才會有好的工作。寒暄可能才是真正的正事。" },
 { dim: "果斷 ↔ 共識", title: "一紙通知",
   sit: "組長在週一全員會上宣佈全組改用一個新工具。到了週三，分析師的小組悄悄換回了舊工具。",
   goal: "商量好下一個團隊決定要怎麼做。",
   a: { r: "組長", b: ["你決定得很快，因為上次等待讓團隊損失了好幾周。", "你覺得清楚地宣佈出來，才是尊重大家。", "悄悄換回舊工具，感覺像是在拆臺。"] },
   b: { r: "分析師", b: ["你的團隊期待：影響日常工作的改變，事先要徵求意見。", "沒有徵求意見的決定，讓你覺得自己的專業不被重視。", "你知道新工具有一個缺陷，但沒人問過。"] },
   diff: "自上而下與共識決策。有的團隊重視領導快速拍板；有的團隊重視花時間讓每個人一起走。快速的決定，落地可能很慢。" },
 { dim: "隨時線上 ↔ 守護時間", title: "晚上 11 點的訊息",
   sit: "晚上 11 點，一位同事發來訊息：“能幫忙看下這個 PPT 嗎？”另一位第二天早上 9 點才回。之後這位同事在站會上問為什麼這麼久才回。",
   goal: "商量出對你們倆都合適的訊息規則。",
   a: { r: "發訊息的同事", b: ["你習慣晚上工作，因為那時才能靜下心來——通常你並不期待馬上回復……", "但這一次，客戶早上 8 點就要看這份 PPT。", "你沒說很急，你以為這很明顯。"] },
   b: { r: "回訊息的同事", b: ["晚上屬於家人，你是故意關掉手機的。", "晚上 11 點的訊息讓你覺得必須隨時待命。", "在站會上被問起，感覺像被當眾指責。"] },
   diff: "邊界與緊急程度。團隊對下班後的訊息是否可以、是否被期待、是否打擾，看法各不相同。沒說出口的緊急，才是真正的陷阱。" }
], "ca": [
 { dim: "Feedback directe ↔ indirecte", title: "La revisió silenciosa",
   sit: "Revisió de disseny d'ahir. Davant de l'equip, la persona líder va dir: “Això no funciona. Cal repensar-ho.” La dissenyadora no va tornar a parlar en tota la reunió.",
   goal: "Acordeu com us donareu feedback abans de la propera revisió.",
   a: { r: "líder de l'equip", b: ["Dir-ho clar és la teva manera de mostrar respecte: no fas perdre el temps.", "La dissenyadora es va quedar callada i vas suposar que hi estava d'acord.", "Et preocupa que el llançament es retardi si els problemes no s'anomenen aviat."] },
   b: { r: "dissenyadora", b: ["On vas aprendre a treballar, una crítica davant d'altres és quedar en evidència.", "El teu silenci era dolor, no acord.", "Hauries agraït el mateix comentari a soles."] },
   diff: "Comunicació directa davant d'indirecta. En uns equips, dir-ho clar és respecte; en d'altres, el respecte és dir-ho en privat i amb suavitat. El silenci pot voler dir coses molt diferents." },
 { dim: "Temps fix ↔ flexible", title: "“Per a divendres”",
   sit: "L'equip soci va prometre les dades “per a divendres”. És dilluns, no han arribat i la cap de projecte ha enviat dos missatges cada vegada més secs.",
   goal: "Acordeu un nou pla, i com parlareu de dates a partir d'ara.",
   a: { r: "cap de projecte", b: ["“Divendres” vol dir divendres a les 17:00. Tot el teu pla en depenia.", "Ja has hagut d'explicar el retard a la teva directora.", "Ningú no et va avisar que es retardava: això és el que més dol."] },
   b: { r: "responsable de l'equip soci", b: ["Per a tu, “divendres” era una estimació de bona fe, no un contracte.", "Dimecres un client clau va tenir una crisi; vas triar el client i ho tornaries a fer.", "Els missatges secs et van semblar freds, després d'anys treballant bé junts."] },
   diff: "Temps de rellotge davant de temps d'esdeveniment. Uns equips tracten les dates com a promeses fixes; d'altres, com a estimacions que s'adapten a les relacions i a les urgències. Cap no és descurat." },
 { dim: "Pla ↔ jeràrquic", title: "“Alguna objecció?”",
   sit: "El cap va tancar la reunió de planificació amb “Alguna objecció?”: silenci. Una setmana després, va saber per una altra persona que l'enginyera sènior creu que el pla és arriscat.",
   goal: "Acordeu com arribaran els riscos al cap a temps.",
   a: { r: "cap", b: ["Vas preguntar obertament. El silenci és un sí: per això era la pregunta.", "Assabentar-te'n per altres se sent com si t'haguessin esquivat.", "De debò vols sentir les males notícies aviat."] },
   b: { r: "enginyera sènior", b: ["Contradir el teu cap davant de tot l'equip et sembla una falta de respecte.", "Ho vas fer arribar a través d'un col·lega de confiança: el canal respectuós, pensaves.", "“Alguna objecció?” al final de la reunió va sonar a mera formalitat."] },
   diff: "Distància jeràrquica baixa davant d'alta. Hi ha qui parla a qualsevol en qualsevol sala; hi ha qui mostra respecte plantejant els seus dubtes en privat o a través d'altres. Una pregunta oberta no sempre és una porta oberta." },
 { dim: "Primer la tasca ↔ primer la relació", title: "La primera trucada",
   sit: "Primera videotrucada amb un proveïdor nou. Als deu minuts, la compradora va passar a preus i condicions. El proveïdor es va tornar clarament més reservat.",
   goal: "Planifiqueu junts la propera reunió.",
   a: { r: "compradora", b: ["Vas justa de temps; anar al gra és una cortesia.", "El proveïdor et va agradar: per això vas passar directament a les condicions.", "La seva reserva sobtada et va desconcertar."] },
   b: { r: "proveïdor", b: ["No pots confiar en un soci sense conèixer-lo una mica.", "Saltar al preu et va fer sentir com una màquina expenedora.", "Havies preparat una xerrada sobre com podrien treballar junts els dos equips."] },
   diff: "Confiança basada en la tasca davant de la relació. Per a uns, la confiança arriba després de la bona feina; per a d'altres, la bona feina arriba després de la confiança. La xerrada prèvia pot ser el veritable negoci." },
 { dim: "Decidir ràpid ↔ per consens", title: "L'anunci",
   sit: "La líder va anunciar a la reunió general de dilluns una eina nova per a tot l'equip. Dimecres, l'equip de l'analista havia tornat en silenci a l'antiga.",
   goal: "Acordeu com es prendrà la propera decisió de l'equip.",
   a: { r: "líder de l'equip", b: ["Vas decidir ràpid perquè l'última vegada esperar va costar setmanes.", "Vas pensar que anunciar-ho amb claredat era el que era respectuós.", "La tornada silenciosa a l'eina antiga et sembla un sabotatge."] },
   b: { r: "analista", b: ["El teu equip espera que el consultin abans d'un canvi que afecta el dia a dia.", "Una decisió sense consulta et va fer sentir que la teva experiència no comptava.", "Coneixes un error de l'eina nova pel qual ningú no va preguntar."] },
   diff: "Decisions de dalt a baix davant de consens. Uns equips valoren una decisió ràpida des de dalt; d'altres, el temps que costa sumar-hi tothom. Les decisions ràpides poden trigar a aterrar." },
 { dim: "Sempre connectat ↔ temps protegit", title: "El missatge de les 23:00",
   sit: "A les 23:00, una col·lega va enviar un missatge: “Pots revisar la presentació?” L'altre va respondre a les 9:00. Després ella va preguntar a la reunió diària per què havia trigat tant.",
   goal: "Acordeu normes de missatges que us serveixin a tots dos.",
   a: { r: "col·lega que va escriure", b: ["Treballes tard perquè és quan pots pensar; normalment no esperes resposta immediata…", "Aquesta vegada, un client esperava la presentació a les 8:00.", "No vas dir que era urgent; vas suposar que era obvi."] },
   b: { r: "col·lega que va respondre", b: ["Les nits són per a la teva família; vas apagar el mòbil a propòsit.", "El missatge de les 23:00 et va semblar una pressió per estar sempre disponible.", "Que t'ho preguntessin a la reunió diària es va sentir com una crítica en públic."] },
   diff: "Límits i urgència. Els equips difereixen en si els missatges fora d'horari són normals, esperats o invasius. La urgència no dita és el veritable parany." }
]
};

/* Eight Intercultural Atlas corridors, played as pairs (from /labs/cq/) */
const CORRIDORS = {"en": [{"id": 1, "dim": "Bad news & hierarchy", "title": "The vanishing roadblock", "cities": ["San Francisco", "Bengaluru"], "sit": [["Alex · Engineering manager, San Francisco", "Shipping the auth service tomorrow. Any blockers?"], ["Rohan · Tech lead, Bengaluru (vendor team)", "The team is actively analysing the payload flows. All good on our side."], ["Alex · next day", "The build broke on a legacy schema dependency! Why wasn't this flagged yesterday?"], ["Rohan", "We worked through the night to fix it without alarming your leadership."]], "aName": "Alex", "bName": "Rohan", "aRole": "Alex · Engineering manager, San Francisco", "bRole": "Rohan · Tech lead, Bengaluru (vendor team)", "aBrief": "I asked directly about blockers. Raising risk early is the job, and bad news early is good news.", "bBrief": "Flagging a blocker in an open channel, to the client's manager, felt like failing in public. “Actively analysing” was my signal that something was wrong.", "lenses": {"culture": "Erin Meyer's Culture Map places India toward the hierarchical end of its “Leading” scale and the US toward the egalitarian end, on average. Taking an unsolved problem to someone senior can feel like a failure of duty.", "power": "Rohan works for a vendor. Admitting a blocker to the client's manager can feel like risking the contract, in any country.", "person": "Rohan is proud of his team's craft and didn't want his junior engineers blamed."}, "script": "Rohan, part of my job is clearing things your team can't control. What's one dependency I can push through for you this week?"}, {"id": 2, "dim": "Feedback & tone", "title": "The blunt code review", "cities": ["Amsterdam", "São Paulo"], "sit": [["Daan · Staff engineer, Amsterdam", "PR review: “This implementation is unacceptable. Scrap the ORM pattern and rewrite it.”"], ["Thiago · Senior developer, São Paulo", "Acknowledged."], ["Daan · later that week", "Why has Thiago gone quiet on every review since?"]], "aName": "Daan", "bName": "Thiago", "aRole": "Daan · Staff engineer, Amsterdam", "bRole": "Thiago · Senior developer, São Paulo", "aBrief": "Code isn't a person. Being clear saves everyone hours of back-and-forth.", "bBrief": "Not one word about what worked, in a public PR, with “unacceptable”. That isn't how you treat a colleague you respect.", "lenses": {"culture": "On Meyer's “Evaluating” scale, the Netherlands sits near the direct end for negative feedback, while Brazil sits further toward indirect, on average.", "power": "Written review comments lose tone, and Daan is more senior. Harsh words from above land harder.", "person": "Daan writes tersely to everyone, including his manager. Thiago had worked late to get this PR in."}, "script": "Thiago, the schema work is solid. One concern: the ORM query pattern will struggle at peak load. Got ten minutes to look at options together?"}, {"id": 3, "dim": "Silence & turn-taking", "title": "The four-second silence", "cities": ["London", "Tokyo"], "sit": [["Harry · Director, London", "Any objections to retiring the legacy schema next month?"], ["Kenji · Architect, Tokyo", "(unmutes… pauses)"], ["Harry", "Great, silence is consent! On to item two."], ["Three days later", "The Tokyo team flags a critical dependency on the legacy schema."]], "aName": "Harry", "bName": "Kenji", "aRole": "Harry · Director, London", "bRole": "Kenji · Architect, Tokyo", "aBrief": "On a video call, silence means agreement. If nobody objects in a couple of seconds, we move on.", "bBrief": "I was forming a disagreement in my second language, carefully, so it wouldn't embarrass anyone. He moved on before I could speak.", "lenses": {"culture": "Pausing before disagreeing with a senior person is often described in Japanese business settings. But research on everyday conversation finds turn-taking gaps are similar across languages (Stivers et al., 2009), so don't assume the pause was “cultural”.", "power": "Harry chairs the call and is the most senior person on it. Objecting to the chair, live and in front of others, is hard anywhere.", "person": "Kenji was working in his second language, at 9pm Tokyo time, on a technical point that needed precise wording."}, "script": "I'm going to pause here. Kenji, when you're ready, I'd love the Tokyo view on any edge cases."}, {"id": 4, "dim": "Trust & relationships", "title": "The cold ping", "cities": ["Munich", "Mexico City"], "sit": [["Stefan · Project manager, Munich", "09:02 · “Carlos, send the API documentation now. We're past the deadline.”"], ["Carlos · Engineering lead, Mexico City", "…"], ["Stefan · next day", "“Did you get my message? Why haven't you sent it?”"], ["Carlos", "“Hola Stefan. We're reviewing it.”"]], "aName": "Stefan", "bName": "Carlos", "aRole": "Stefan · Project manager, Munich", "bRole": "Carlos · Engineering lead, Mexico City", "aBrief": "Getting straight to the point respects his time. Deadlines are deadlines.", "bBrief": "Two messages, no hello, no question about how we're doing. It feels like I'm a ticket, not a colleague.", "lenses": {"culture": "Meyer's “Trusting” scale places Germany toward task-based trust (built through reliable work) and Mexico toward relationship-based trust (built through personal connection), on average.", "power": "Stefan sits at headquarters. Carlos's team are often the last to hear when priorities change, so curt demands land as orders.", "person": "Carlos's team had been fixing a production outage all night. Stefan didn't know because he hadn't asked."}, "script": "Hola Carlos, how's the team doing this week? I hear it's been busy. When could we realistically go through the API docs together?"}, {"id": 5, "dim": "Decoding “yes”", "title": "The yes that meant maybe", "cities": ["Sydney", "Hanoi"], "sit": [["Liam · Client project manager, Sydney", "Can you commit to 15 October? Is that possible?"], ["Linh · Engineering lead, Hanoi", "Yes… we will do our best."], ["Liam · 16 October", "It's not live? You said yes!"], ["Linh", "I said we would do our best. The scope needed services we didn't have."]], "aName": "Liam", "bName": "Linh", "aRole": "Liam · Client project manager, Sydney", "bRole": "Linh · Engineering lead, Hanoi", "aBrief": "Yes means yes. If the date was impossible, she should have said no.", "bBrief": "Saying “no” outright to a client is very hard. “We will do our best”, with a pause, was my warning.", "lenses": {"culture": "In many high-context settings, Vietnam among them, a direct “no” to a client may be avoided, and “we'll do our best” can signal real doubt. Plenty of low-context speakers hedge with the same words.", "power": "Liam controls the budget for Linh's team. Saying no to the person who pays you is hard everywhere.", "person": "Linh had just been promoted and wanted to show she could deliver."}, "script": "Linh, if we aim for 15 October, what are the three things that would have to go perfectly? What would you trade off to get there?"}, {"id": 6, "dim": "Disagreement", "title": "The heated debate", "cities": ["Paris", "Singapore"], "sit": [["Camille · Design lead, Paris", "I completely disagree with this user journey. It makes no logical sense!"], ["Jia Hui · Product manager, Singapore", "(goes quiet; one-word answers for the rest of the sprint)"], ["Camille · at drinks", "Coming? That was a great debate!"]], "aName": "Camille", "bName": "Jia Hui", "aRole": "Camille · Design lead, Paris", "bRole": "Jia Hui · Product manager, Singapore", "aBrief": "Arguing hard about ideas shows I take them seriously. It's not personal; we're still friends afterwards.", "bBrief": "Being told my work “makes no logical sense” in front of the team felt like a public attack. A drink doesn't undo that.", "lenses": {"culture": "Meyer's “Disagreeing” scale places France toward open confrontation as engagement, and many Southeast and East Asian workplaces toward avoiding open confrontation, on average.", "power": "Camille sits at headquarters and has informal influence over regional promotions, which raises the stakes of a public clash.", "person": "Jia Hui had spent two weeks on the journey while caring for a sick parent."}, "script": "Jia Hui, let's look at where our two journeys differ. If we tested both, what user behaviour would tell us which works better?"}, {"id": 7, "dim": "Time & scheduling", "title": "The elastic deadline", "cities": ["Zurich", "Rome"], "sit": [["Anna · Logistics planner, Zurich", "Our dock slot was locked for Friday 09:00. Your trucks arrived Tuesday at 14:00."], ["Matteo · Operations lead, Rome", "A key customer's plant broke down on Thursday. We moved everyone to fix it. We saved them, and delivered today!"], ["Anna", "You broke our whole schedule."]], "aName": "Anna", "bName": "Matteo", "aRole": "Anna · Logistics planner, Zurich", "bRole": "Matteo · Operations lead, Rome", "aBrief": "If slots are elastic, the supply chain collapses. Being on time is respect.", "bBrief": "A customer was in crisis. Protecting an internal slot over a real emergency isn't service.", "lenses": {"culture": "Meyer's “Scheduling” scale places Switzerland near the linear-time end and Italy toward flexible time, on average.", "power": "Anna's plant pays automated penalties for missed dock slots; Matteo's bonus is tied to customer satisfaction.", "person": "Matteo drove to the customer himself on Sunday to make sure the fix worked."}, "script": "Matteo, great work saving that customer. Dock changes here ripple into three other plants. When a crisis hits, can we agree a one-hour alert so we can move slots in time?"}, {"id": 8, "dim": "Persuading", "title": "The “why first” pushback", "cities": ["New York", "Paris"], "sit": [["Jordan · VP Product, New York", "Here's our new CRM! Three case studies show 40% higher close rates. Let's onboard by Friday!"], ["Elodie · Country lead, Paris", "Wait. Why this vendor? What's the reasoning behind its data model?"], ["Jordan · privately", "Why does Paris always want to philosophise?"]], "aName": "Jordan", "bName": "Elodie", "aRole": "Jordan · VP Product, New York", "bRole": "Elodie · Country lead, Paris", "aBrief": "Show results, skip the theory. People want proof that it works.", "bBrief": "If the reasoning is flawed, the case studies are luck. Convince me the method is sound first.", "lenses": {"culture": "Meyer's “Persuading” scale contrasts principles-first reasoning (often associated with France) with applications-first reasoning (often associated with the US). Both are rigorous; they start in different places.", "power": "The decision came from New York with little European input, so “why?” also means “we weren't consulted”.", "person": "Elodie has an engineering background and lived through a failed CRM migration."}, "script": "Elodie, before the demo, let me take five minutes on why we chose this data model over the alternatives. Then the results. I'd value your read on the evaluation."}], "zh": [{"id": 1, "dim": "坏消息与层级", "title": "消失的障碍", "cities": ["旧金山", "班加罗尔"], "sit": [["Alex · 工程经理，旧金山", "认证服务明天上线。有什么阻碍吗？"], ["Rohan · 技术负责人，班加罗尔（供应商团队）", "团队正在积极分析负载流程。我们这边一切正常。"], ["Alex · 第二天", "构建因为一个遗留数据结构依赖挂了！昨天为什么没提出来？"], ["Rohan", "我们通宵修复了它，以免惊动你们的领导层。"]], "aName": "Alex", "bName": "Rohan", "aRole": "Alex · 工程经理，旧金山", "bRole": "Rohan · 技术负责人，班加罗尔（供应商团队）", "aBrief": "我直接问了有没有阻碍。尽早暴露风险是本职工作，坏消息越早越好。", "bBrief": "在公开频道里、当着客户经理的面提出阻碍，感觉就像当众失败。“正在积极分析”是我在发出有问题的信号。", "lenses": {"culture": "Erin Meyer 的《文化地图》在“领导”维度上，平均而言把印度放在偏层级的一端，美国放在偏平等的一端。把一个未解决的问题交给上级，可能会让人觉得是失职。", "power": "Rohan 为供应商工作。在任何国家，向客户经理承认有阻碍，都可能感觉是在拿合同冒险。", "person": "Rohan 为团队的手艺感到自豪，不想让手下的初级工程师受责备。"}, "script": "Rohan，我工作的一部分就是清除你们团队控制不了的障碍。这周有哪一个依赖是我可以帮你推动的？"}, {"id": 2, "dim": "反馈与语气", "title": "直白的代码评审", "cities": ["阿姆斯特丹", "圣保罗"], "sit": [["Daan · 资深工程师，阿姆斯特丹", "PR 评审：“这个实现不可接受。放弃这个 ORM 模式，重写。”"], ["Thiago · 高级开发，圣保罗", "收到。"], ["Daan · 那周晚些时候", "为什么 Thiago 之后在每次评审里都不吭声了？"]], "aName": "Daan", "bName": "Thiago", "aRole": "Daan · 资深工程师，阿姆斯特丹", "bRole": "Thiago · 高级开发，圣保罗", "aBrief": "代码不是人。说清楚能为大家省下好几个小时的来回。", "bBrief": "在公开的 PR 里，一句肯定都没有，还用了“不可接受”。这不是对待一位你尊重的同事的方式。", "lenses": {"culture": "在 Meyer 的“评估”维度上，平均而言，荷兰在负面反馈上接近直接的一端，而巴西更偏向间接。", "power": "书面评审意见会丢失语气，而且 Daan 资历更深。来自上面的严厉措辞，分量更重。", "person": "Daan 对所有人都写得很简短，包括他的经理。Thiago 为了赶上这个 PR 加班到很晚。"}, "script": "Thiago，数据结构部分做得很扎实。有一个顾虑：这个 ORM 查询模式在高峰负载下会吃力。有十分钟一起看看方案吗？"}, {"id": 3, "dim": "沉默与轮流发言", "title": "四秒钟的沉默", "cities": ["伦敦", "东京"], "sit": [["Harry · 总监，伦敦", "下个月停用遗留数据结构，有人反对吗？"], ["Kenji · 架构师，东京", "（取消静音……停顿）"], ["Harry", "很好，沉默就是同意！进入第二项。"], ["三天后", "东京团队指出对遗留数据结构有一个关键依赖。"]], "aName": "Harry", "bName": "Kenji", "aRole": "Harry · 总监，伦敦", "bRole": "Kenji · 架构师，东京", "aBrief": "在视频会议上，沉默就是同意。如果几秒钟内没人反对，我们就继续。", "bBrief": "我正在用第二语言小心地组织反对意见，免得让任何人难堪。还没等我开口，他就继续了。", "lenses": {"culture": "在日本的商务场合中，常有人描述在反对上级之前会先停顿。但关于日常对话的研究发现，不同语言之间的话轮间隔其实相近（Stivers et al., 2009），所以不要假设这次停顿是“文化性的”。", "power": "Harry 主持会议，也是在场资历最深的人。在任何地方，当着别人的面实时反对主持人都很难。", "person": "Kenji 在用第二语言工作，当时是东京时间晚上 9 点，讨论的是一个需要精确措辞的技术问题。"}, "script": "我在这里停一下。Kenji，你准备好的时候，我很想听听东京对边界情况的看法。"}, {"id": 4, "dim": "信任与关系", "title": "冷冰冰的催促", "cities": ["慕尼黑", "墨西哥城"], "sit": [["Stefan · 项目经理，慕尼黑", "09:02 · “Carlos，现在就把 API 文档发过来。已经过截止日期了。”"], ["Carlos · 工程负责人，墨西哥城", "……"], ["Stefan · 第二天", "“收到我的消息了吗？为什么还没发？”"], ["Carlos", "“Hola Stefan。我们正在审阅。”"]], "aName": "Stefan", "bName": "Carlos", "aRole": "Stefan · 项目经理，慕尼黑", "bRole": "Carlos · 工程负责人，墨西哥城", "aBrief": "开门见山是尊重他的时间。截止日期就是截止日期。", "bBrief": "两条消息，没有问候，也没问我们怎么样。感觉我是一张工单，而不是一位同事。", "lenses": {"culture": "在 Meyer 的“信任”维度上，平均而言，德国偏向基于任务的信任（通过可靠的工作建立），墨西哥偏向基于关系的信任（通过个人联系建立）。", "power": "Stefan 在总部。Carlos 的团队常常是最后得知优先级变化的人，所以生硬的要求读起来就像命令。", "person": "Carlos 的团队整晚都在修复一次生产故障。Stefan 不知道，因为他没有问。"}, "script": "Hola Carlos，团队这周怎么样？听说挺忙的。我们什么时候可以比较现实地一起过一遍 API 文档？"}, {"id": 5, "dim": "解读“是”", "title": "意味着“也许”的“是”", "cities": ["悉尼", "河内"], "sit": [["Liam · 客户项目经理，悉尼", "你们能承诺 10 月 15 日吗？可能吗？"], ["Linh · 工程负责人，河内", "可以……我们会尽力。"], ["Liam · 10 月 16 日", "还没上线？你说了可以的！"], ["Linh", "我说的是我们会尽力。这个范围需要我们没有的服务。"]], "aName": "Liam", "bName": "Linh", "aRole": "Liam · 客户项目经理，悉尼", "bRole": "Linh · 工程负责人，河内", "aBrief": "“是”就是“是”。如果日期不可能，她就该说不。", "bBrief": "直接对客户说“不”非常难。“我们会尽力”，加上停顿，就是我的警告。", "lenses": {"culture": "在许多高语境环境中（越南是其中之一），人们可能会避免直接对客户说“不”，“我们会尽力”可能是真正的疑虑信号。不过，很多低语境的人也会用同样的话来含糊其辞。", "power": "Liam 掌握着 Linh 团队的预算。在任何地方，对付钱给你的人说不都很难。", "person": "Linh 刚刚升职，想证明自己能交付。"}, "script": "Linh，如果我们以 10 月 15 日为目标，有哪三件事必须完美进行？为了做到，你会做哪些取舍？"}, {"id": 6, "dim": "分歧", "title": "激烈的辩论", "cities": ["巴黎", "新加坡"], "sit": [["Camille · 设计负责人，巴黎", "我完全不同意这个用户旅程。它在逻辑上完全说不通！"], ["Jia Hui · 产品经理，新加坡", "（沉默下来；这个迭代剩下的时间里只回一两个字）"], ["Camille · 下班喝酒时", "来吗？刚才的辩论太棒了！"]], "aName": "Camille", "bName": "Jia Hui", "aRole": "Camille · 设计负责人，巴黎", "bRole": "Jia Hui · 产品经理，新加坡", "aBrief": "对想法激烈争论，说明我认真对待它们。这不是针对个人；之后我们还是朋友。", "bBrief": "当着团队的面被说我的工作“在逻辑上完全说不通”，感觉像是公开攻击。一杯酒抵消不了。", "lenses": {"culture": "在 Meyer 的“分歧”维度上，平均而言，法国偏向把公开对抗视为投入，而许多东南亚和东亚职场偏向避免公开对抗。", "power": "Camille 在总部，对区域晋升有非正式影响力，这提高了公开冲突的风险。", "person": "Jia Hui 一边照顾生病的父母，一边在这个旅程上花了两周时间。"}, "script": "Jia Hui，我们来看看两个旅程的不同之处。如果两个都测试，什么样的用户行为能告诉我们哪个更好？"}, {"id": 7, "dim": "时间与日程", "title": "有弹性的截止时间", "cities": ["苏黎世", "罗马"], "sit": [["Anna · 物流规划师，苏黎世", "我们的码头时段锁定在周五 09:00。你们的卡车周二 14:00 才到。"], ["Matteo · 运营负责人，罗马", "一个重要客户的工厂周四出了故障。我们调动所有人去修。我们救了他们，今天也送到了！"], ["Anna", "你们打乱了我们整个日程。"]], "aName": "Anna", "bName": "Matteo", "aRole": "Anna · 物流规划师，苏黎世", "bRole": "Matteo · 运营负责人，罗马", "aBrief": "如果时段是有弹性的，供应链就会崩溃。准时就是尊重。", "bBrief": "一个客户陷入了危机。为了保护一个内部时段而不顾真正的紧急情况，这不是服务。", "lenses": {"culture": "在 Meyer 的“日程”维度上，平均而言，瑞士接近线性时间的一端，意大利偏向灵活时间。", "power": "Anna 的工厂错过码头时段会被自动罚款；Matteo 的奖金与客户满意度挂钩。", "person": "Matteo 周日亲自开车去客户那里，确保修复有效。"}, "script": "Matteo，救下那个客户干得漂亮。这里的码头变更会波及另外三家工厂。危机发生时，我们能约定提前一小时预警，好让我们及时调整时段吗？"}, {"id": 8, "dim": "说服", "title": "“先讲为什么”的反推", "cities": ["纽约", "巴黎"], "sit": [["Jordan · 产品副总裁，纽约", "这是我们的新 CRM！三个案例研究显示成交率提高了 40%。周五前完成上线吧！"], ["Elodie · 国家负责人，巴黎", "等等。为什么是这家供应商？它的数据模型背后的逻辑是什么？"], ["Jordan · 私下", "为什么巴黎总想讲哲学？"]], "aName": "Jordan", "bName": "Elodie", "aRole": "Jordan · 产品副总裁，纽约", "bRole": "Elodie · 国家负责人，巴黎", "aBrief": "展示结果，跳过理论。人们想要的是有效的证据。", "bBrief": "如果逻辑有缺陷，那些案例研究就只是运气。先让我相信方法是可靠的。", "lenses": {"culture": "Meyer 的“说服”维度对比了原则优先的推理（常与法国联系在一起）和应用优先的推理（常与美国联系在一起）。两者都很严谨，只是起点不同。", "power": "这个决定来自纽约，欧洲几乎没有参与，所以“为什么？”也意味着“我们没被征求意见”。", "person": "Elodie 有工程背景，经历过一次失败的 CRM 迁移。"}, "script": "Elodie，在演示之前，我先花五分钟讲讲为什么我们选择这个数据模型而不是其他方案，然后再看结果。我很想听听你对评估的看法。"}], "es": [{"id": 1, "dim": "Malas noticias y jerarquía", "title": "El bloqueo que desapareció", "cities": ["San Francisco", "Bengaluru"], "sit": [["Alex · Manager de ingeniería, San Francisco", "Mañana lanzamos el servicio de autenticación. ¿Algún bloqueo?"], ["Rohan · Tech lead, Bengaluru (equipo proveedor)", "El equipo está analizando activamente los flujos de datos. Todo bien por nuestra parte."], ["Alex · al día siguiente", "¡La build se ha roto por una dependencia de un esquema antiguo! ¿Por qué no se avisó ayer?"], ["Rohan", "Trabajamos toda la noche para arreglarlo sin alarmar a vuestra dirección."]], "aName": "Alex", "bName": "Rohan", "aRole": "Alex · Manager de ingeniería, San Francisco", "bRole": "Rohan · Tech lead, Bengaluru (equipo proveedor)", "aBrief": "Pregunté directamente por bloqueos. Avisar pronto de los riesgos es el trabajo; las malas noticias pronto son buenas noticias.", "bBrief": "Señalar un bloqueo en un canal abierto, ante el manager del cliente, era como fallar en público. «Analizando activamente» era mi señal de que algo iba mal.", "lenses": {"culture": "El Culture Map de Erin Meyer sitúa a India hacia el extremo jerárquico de su escala de «Liderar» y a EE. UU. hacia el igualitario, de media. Llevar un problema sin resolver a alguien de más rango puede sentirse como faltar al deber.", "power": "Rohan trabaja para un proveedor. Admitir un bloqueo ante el manager del cliente puede sentirse como arriesgar el contrato, en cualquier país.", "person": "Rohan está orgulloso del oficio de su equipo y no quería que culparan a sus ingenieros júnior."}, "script": "Rohan, parte de mi trabajo es quitar de en medio lo que tu equipo no controla. ¿Qué dependencia puedo desbloquear por ti esta semana?"}, {"id": 2, "dim": "Feedback y tono", "title": "La revisión de código sin filtro", "cities": ["Ámsterdam", "São Paulo"], "sit": [["Daan · Staff engineer, Ámsterdam", "Revisión del PR: «Esta implementación es inaceptable. Descarta el patrón ORM y reescríbelo»."], ["Thiago · Desarrollador sénior, São Paulo", "Recibido."], ["Daan · esa misma semana, más tarde", "¿Por qué Thiago no ha vuelto a decir nada en ninguna revisión?"]], "aName": "Daan", "bName": "Thiago", "aRole": "Daan · Staff engineer, Ámsterdam", "bRole": "Thiago · Desarrollador sénior, São Paulo", "aBrief": "El código no es una persona. Ser claro ahorra horas de idas y venidas a todos.", "bBrief": "Ni una palabra sobre lo que funcionaba, en un PR público, con «inaceptable». Así no se trata a un compañero al que respetas.", "lenses": {"culture": "En la escala de «Evaluar» de Meyer, Países Bajos está cerca del extremo directo para el feedback negativo, mientras que Brasil está más hacia el indirecto, de media.", "power": "Los comentarios escritos pierden el tono, y Daan tiene más antigüedad. Las palabras duras desde arriba pesan más.", "person": "Daan escribe de forma escueta a todo el mundo, incluido su manager. Thiago se había quedado hasta tarde para entregar este PR."}, "script": "Thiago, el trabajo del esquema es sólido. Una duda: el patrón de consultas ORM sufrirá en los picos de carga. ¿Tienes diez minutos para ver opciones juntos?"}, {"id": 3, "dim": "Silencio y turnos de palabra", "title": "El silencio de cuatro segundos", "cities": ["Londres", "Tokio"], "sit": [["Harry · Director, Londres", "¿Alguna objeción a retirar el esquema antiguo el mes que viene?"], ["Kenji · Arquitecto, Tokio", "(activa el micro… hace una pausa)"], ["Harry", "¡Genial, quien calla otorga! Siguiente punto."], ["Tres días después", "El equipo de Tokio avisa de una dependencia crítica del esquema antiguo."]], "aName": "Harry", "bName": "Kenji", "aRole": "Harry · Director, Londres", "bRole": "Kenji · Arquitecto, Tokio", "aBrief": "En una videollamada, el silencio es acuerdo. Si nadie objeta en un par de segundos, seguimos.", "bBrief": "Estaba formulando un desacuerdo en mi segundo idioma, con cuidado, para no avergonzar a nadie. Siguió antes de que pudiera hablar.", "lenses": {"culture": "A menudo se describe que en entornos de negocio japoneses se hace una pausa antes de discrepar de alguien de más rango. Pero la investigación sobre la conversación cotidiana encuentra pausas entre turnos similares en todos los idiomas (Stivers et al., 2009), así que no des por hecho que la pausa era «cultural».", "power": "Harry preside la llamada y es la persona de más rango. Objetar al que preside, en directo y delante de otros, es difícil en cualquier sitio.", "person": "Kenji trabajaba en su segundo idioma, a las 21:00 hora de Tokio, sobre un punto técnico que exigía palabras precisas."}, "script": "Voy a hacer una pausa aquí. Kenji, cuando estés listo, me encantaría oír la visión de Tokio sobre los casos límite."}, {"id": 4, "dim": "Confianza y relaciones", "title": "El mensaje en frío", "cities": ["Múnich", "Ciudad de México"], "sit": [["Stefan · Project manager, Múnich", "09:02 · «Carlos, envía ya la documentación de la API. Vamos tarde.»"], ["Carlos · Líder de ingeniería, Ciudad de México", "…"], ["Stefan · al día siguiente", "«¿Recibiste mi mensaje? ¿Por qué no la has enviado?»"], ["Carlos", "«Hola Stefan. La estamos revisando.»"]], "aName": "Stefan", "bName": "Carlos", "aRole": "Stefan · Project manager, Múnich", "bRole": "Carlos · Líder de ingeniería, Ciudad de México", "aBrief": "Ir al grano respeta su tiempo. Un plazo es un plazo.", "bBrief": "Dos mensajes, sin un hola, sin preguntar cómo estamos. Siento que soy un ticket, no un compañero.", "lenses": {"culture": "La escala de «Confiar» de Meyer sitúa a Alemania hacia la confianza basada en la tarea (construida con trabajo fiable) y a México hacia la confianza basada en la relación (construida con conexión personal), de media.", "power": "Stefan está en la sede central. El equipo de Carlos suele ser el último en enterarse de los cambios de prioridad, así que las exigencias secas suenan a órdenes.", "person": "El equipo de Carlos había pasado la noche arreglando una caída en producción. Stefan no lo sabía porque no preguntó."}, "script": "Hola Carlos, ¿qué tal el equipo esta semana? Me dicen que ha sido intensa. ¿Cuándo podríamos repasar juntos la documentación de la API, de forma realista?"}, {"id": 5, "dim": "Descifrar el «sí»", "title": "El sí que significaba quizá", "cities": ["Sídney", "Hanói"], "sit": [["Liam · Project manager del cliente, Sídney", "¿Podéis comprometeros al 15 de octubre? ¿Es posible?"], ["Linh · Líder de ingeniería, Hanói", "Sí… haremos lo posible."], ["Liam · 16 de octubre", "¿No está en producción? ¡Dijiste que sí!"], ["Linh", "Dije que haríamos lo posible. El alcance necesitaba servicios que no teníamos."]], "aName": "Liam", "bName": "Linh", "aRole": "Liam · Project manager del cliente, Sídney", "bRole": "Linh · Líder de ingeniería, Hanói", "aBrief": "Sí es sí. Si la fecha era imposible, debería haber dicho que no.", "bBrief": "Decirle que no a un cliente sin rodeos es muy difícil. «Haremos lo posible», con una pausa, era mi aviso.", "lenses": {"culture": "En muchos entornos de alto contexto, entre ellos Vietnam, se puede evitar un «no» directo a un cliente, y «haremos lo posible» puede señalar una duda real. Mucha gente de bajo contexto se cubre con las mismas palabras.", "power": "Liam controla el presupuesto del equipo de Linh. Decir que no a quien te paga es difícil en todas partes.", "person": "A Linh acababan de ascenderla y quería demostrar que podía cumplir."}, "script": "Linh, si apuntamos al 15 de octubre, ¿cuáles son las tres cosas que tendrían que salir perfectas? ¿Qué sacrificarías para llegar?"}, {"id": 6, "dim": "Desacuerdo", "title": "El debate acalorado", "cities": ["París", "Singapur"], "sit": [["Camille · Líder de diseño, París", "No estoy nada de acuerdo con este recorrido de usuario. ¡No tiene ningún sentido lógico!"], ["Jia Hui · Product manager, Singapur", "(se queda callada; respuestas de una palabra durante el resto del sprint)"], ["Camille · en las cañas", "¿Vienes? ¡Qué buen debate!"]], "aName": "Camille", "bName": "Jia Hui", "aRole": "Camille · Líder de diseño, París", "bRole": "Jia Hui · Product manager, Singapur", "aBrief": "Discutir con fuerza las ideas demuestra que me las tomo en serio. No es personal; después seguimos siendo amigas.", "bBrief": "Que me dijeran delante del equipo que mi trabajo «no tiene ningún sentido lógico» fue un ataque público. Una copa no lo arregla.", "lenses": {"culture": "La escala de «Discrepar» de Meyer sitúa a Francia hacia la confrontación abierta como forma de implicación, y a muchos entornos de trabajo del sudeste y el este de Asia hacia evitar la confrontación abierta, de media.", "power": "Camille está en la sede central y tiene influencia informal en los ascensos regionales, lo que eleva lo que está en juego en un choque público.", "person": "Jia Hui había dedicado dos semanas al recorrido mientras cuidaba de un familiar enfermo."}, "script": "Jia Hui, veamos dónde difieren nuestros dos recorridos. Si probáramos ambos, ¿qué comportamiento de usuario nos diría cuál funciona mejor?"}, {"id": 7, "dim": "Tiempo y planificación", "title": "El plazo elástico", "cities": ["Zúrich", "Roma"], "sit": [["Anna · Planificadora logística, Zúrich", "Nuestra franja de muelle estaba fijada para el viernes a las 09:00. Vuestros camiones llegaron el martes a las 14:00."], ["Matteo · Líder de operaciones, Roma", "La planta de un cliente clave se averió el jueves. Movimos a todo el mundo para arreglarlo. ¡Les salvamos, y hoy hemos entregado!"], ["Anna", "Habéis roto toda nuestra planificación."]], "aName": "Anna", "bName": "Matteo", "aRole": "Anna · Planificadora logística, Zúrich", "bRole": "Matteo · Líder de operaciones, Roma", "aBrief": "Si las franjas son elásticas, la cadena de suministro se hunde. Ser puntual es respeto.", "bBrief": "Un cliente estaba en crisis. Proteger una franja interna frente a una emergencia real no es servicio.", "lenses": {"culture": "La escala de «Planificar» de Meyer sitúa a Suiza cerca del extremo del tiempo lineal y a Italia hacia el tiempo flexible, de media.", "power": "La planta de Anna paga penalizaciones automáticas por franjas perdidas; el bonus de Matteo depende de la satisfacción del cliente.", "person": "Matteo condujo él mismo hasta el cliente el domingo para asegurarse de que el arreglo funcionaba."}, "script": "Matteo, gran trabajo salvando a ese cliente. Aquí los cambios de muelle afectan a otras tres plantas. Cuando llegue una crisis, ¿acordamos un aviso con una hora de antelación para mover las franjas a tiempo?"}, {"id": 8, "dim": "Persuadir", "title": "El «primero, por qué»", "cities": ["Nueva York", "París"], "sit": [["Jordan · VP de producto, Nueva York", "¡Aquí está nuestro nuevo CRM! Tres casos de éxito muestran un 40 % más de cierres. ¡Implantación antes del viernes!"], ["Elodie · Country lead, París", "Un momento. ¿Por qué este proveedor? ¿Cuál es la lógica de su modelo de datos?"], ["Jordan · en privado", "¿Por qué París siempre quiere filosofar?"]], "aName": "Jordan", "bName": "Elodie", "aRole": "Jordan · VP de producto, Nueva York", "bRole": "Elodie · Country lead, París", "aBrief": "Enseña resultados y sáltate la teoría. La gente quiere pruebas de que funciona.", "bBrief": "Si el razonamiento falla, los casos de éxito son suerte. Convénceme primero de que el método es sólido.", "lenses": {"culture": "La escala de «Persuadir» de Meyer contrapone el razonamiento que empieza por los principios (a menudo asociado con Francia) al que empieza por las aplicaciones (a menudo asociado con EE. UU.). Ambos son rigurosos; solo empiezan en lugares distintos.", "power": "La decisión vino de Nueva York con poca participación europea, así que «¿por qué?» también significa «no nos consultasteis».", "person": "Elodie tiene formación de ingeniera y vivió una migración de CRM fallida."}, "script": "Elodie, antes de la demo, déjame dedicar cinco minutos a por qué elegimos este modelo de datos frente a las alternativas. Luego los resultados. Me interesa mucho tu opinión sobre la evaluación."}], "zh-Hant": [{"id": 1, "dim": "壞訊息與層級", "title": "消失的障礙", "cities": ["舊金山", "班加羅爾"], "sit": [["Alex · 工程經理，舊金山", "認證服務明天上線。有什麼阻礙嗎？"], ["Rohan · 技術負責人，班加羅爾（供應商團隊）", "團隊正在積極分析負載流程。我們這邊一切正常。"], ["Alex · 第二天", "構建因為一個遺留資料結構依賴掛了！昨天為什麼沒提出來？"], ["Rohan", "我們通宵修復了它，以免驚動你們的領導層。"]], "aName": "Alex", "bName": "Rohan", "aRole": "Alex · 工程經理，舊金山", "bRole": "Rohan · 技術負責人，班加羅爾（供應商團隊）", "aBrief": "我直接問了有沒有阻礙。儘早暴露風險是本職工作，壞訊息越早越好。", "bBrief": "在公開頻道里、當著客戶經理的面提出阻礙，感覺就像當眾失敗。“正在積極分析”是我在發出有問題的訊號。", "lenses": {"culture": "Erin Meyer 的《文化地圖》在“領導”維度上，平均而言把印度放在偏層級的一端，美國放在偏平等的一端。把一個未解決的問題交給上級，可能會讓人覺得是失職。", "power": "Rohan 為供應商工作。在任何國家，向客戶經理承認有阻礙，都可能感覺是在拿合同冒險。", "person": "Rohan 為團隊的手藝感到自豪，不想讓手下的初級工程師受責備。"}, "script": "Rohan，我工作的一部分就是清除你們團隊控制不了的障礙。這周有哪一個依賴是我可以幫你推動的？"}, {"id": 2, "dim": "反饋與語氣", "title": "直白的程式碼評審", "cities": ["阿姆斯特丹", "聖保羅"], "sit": [["Daan · 資深工程師，阿姆斯特丹", "PR 評審：“這個實現不可接受。放棄這個 ORM 模式，重寫。”"], ["Thiago · 高階開發，聖保羅", "收到。"], ["Daan · 那周晚些時候", "為什麼 Thiago 之後在每次評審裡都不吭聲了？"]], "aName": "Daan", "bName": "Thiago", "aRole": "Daan · 資深工程師，阿姆斯特丹", "bRole": "Thiago · 高階開發，聖保羅", "aBrief": "程式碼不是人。說清楚能為大家省下好幾個小時的來回。", "bBrief": "在公開的 PR 裡，一句肯定都沒有，還用了“不可接受”。這不是對待一位你尊重的同事的方式。", "lenses": {"culture": "在 Meyer 的“評估”維度上，平均而言，荷蘭在負面反饋上接近直接的一端，而巴西更偏向間接。", "power": "書面評審意見會丟失語氣，而且 Daan 資歷更深。來自上面的嚴厲措辭，分量更重。", "person": "Daan 對所有人都寫得很簡短，包括他的經理。Thiago 為了趕上這個 PR 加班到很晚。"}, "script": "Thiago，資料結構部分做得很紮實。有一個顧慮：這個 ORM 查詢模式在高峰負載下會吃力。有十分鐘一起看看方案嗎？"}, {"id": 3, "dim": "沉默與輪流發言", "title": "四秒鐘的沉默", "cities": ["倫敦", "東京"], "sit": [["Harry · 總監，倫敦", "下個月停用遺留資料結構，有人反對嗎？"], ["Kenji · 架構師，東京", "（取消靜音……停頓）"], ["Harry", "很好，沉默就是同意！進入第二項。"], ["三天後", "東京團隊指出對遺留資料結構有一個關鍵依賴。"]], "aName": "Harry", "bName": "Kenji", "aRole": "Harry · 總監，倫敦", "bRole": "Kenji · 架構師，東京", "aBrief": "在視訊會議上，沉默就是同意。如果幾秒鐘內沒人反對，我們就繼續。", "bBrief": "我正在用第二語言小心地組織反對意見，免得讓任何人難堪。還沒等我開口，他就繼續了。", "lenses": {"culture": "在日本的商務場合中，常有人描述在反對上級之前會先停頓。但關於日常對話的研究發現，不同語言之間的話輪間隔其實相近（Stivers et al., 2009），所以不要假設這次停頓是“文化性的”。", "power": "Harry 主持會議，也是在場資歷最深的人。在任何地方，當著別人的面實時反對主持人都很難。", "person": "Kenji 在用第二語言工作，當時是東京時間晚上 9 點，討論的是一個需要精確措辭的技術問題。"}, "script": "我在這裡停一下。Kenji，你準備好的時候，我很想聽聽東京對邊界情況的看法。"}, {"id": 4, "dim": "信任與關係", "title": "冷冰冰的催促", "cities": ["慕尼黑", "墨西哥城"], "sit": [["Stefan · 專案經理，慕尼黑", "09:02 · “Carlos，現在就把 API 文件發過來。已經過截止日期了。”"], ["Carlos · 工程負責人，墨西哥城", "……"], ["Stefan · 第二天", "“收到我的訊息了嗎？為什麼還沒發？”"], ["Carlos", "“Hola Stefan。我們正在審閱。”"]], "aName": "Stefan", "bName": "Carlos", "aRole": "Stefan · 專案經理，慕尼黑", "bRole": "Carlos · 工程負責人，墨西哥城", "aBrief": "開門見山是尊重他的時間。截止日期就是截止日期。", "bBrief": "兩條訊息，沒有問候，也沒問我們怎麼樣。感覺我是一張工單，而不是一位同事。", "lenses": {"culture": "在 Meyer 的“信任”維度上，平均而言，德國偏向基於任務的信任（透過可靠的工作建立），墨西哥偏向基於關係的信任（透過個人聯絡建立）。", "power": "Stefan 在總部。Carlos 的團隊常常是最後得知優先順序變化的人，所以生硬的要求讀起來就像命令。", "person": "Carlos 的團隊整晚都在修復一次生產故障。Stefan 不知道，因為他沒有問。"}, "script": "Hola Carlos，團隊這周怎麼樣？聽說挺忙的。我們什麼時候可以比較現實地一起過一遍 API 文件？"}, {"id": 5, "dim": "解讀“是”", "title": "意味著“也許”的“是”", "cities": ["悉尼", "河內"], "sit": [["Liam · 客戶專案經理，悉尼", "你們能承諾 10 月 15 日嗎？可能嗎？"], ["Linh · 工程負責人，河內", "可以……我們會盡力。"], ["Liam · 10 月 16 日", "還沒上線？你說了可以的！"], ["Linh", "我說的是我們會盡力。這個範圍需要我們沒有的服務。"]], "aName": "Liam", "bName": "Linh", "aRole": "Liam · 客戶專案經理，悉尼", "bRole": "Linh · 工程負責人，河內", "aBrief": "“是”就是“是”。如果日期不可能，她就該說不。", "bBrief": "直接對客戶說“不”非常難。“我們會盡力”，加上停頓，就是我的警告。", "lenses": {"culture": "在許多高語境環境中（越南是其中之一），人們可能會避免直接對客戶說“不”，“我們會盡力”可能是真正的疑慮訊號。不過，很多低語境的人也會用同樣的話來含糊其辭。", "power": "Liam 掌握著 Linh 團隊的預算。在任何地方，對付錢給你的人說不都很難。", "person": "Linh 剛剛升職，想證明自己能交付。"}, "script": "Linh，如果我們以 10 月 15 日為目標，有哪三件事必須完美進行？為了做到，你會做哪些取捨？"}, {"id": 6, "dim": "分歧", "title": "激烈的辯論", "cities": ["巴黎", "新加坡"], "sit": [["Camille · 設計負責人，巴黎", "我完全不同意這個使用者旅程。它在邏輯上完全說不通！"], ["Jia Hui · 產品經理，新加坡", "（沉默下來；這個迭代剩下的時間裡只回一兩個字）"], ["Camille · 下班喝酒時", "來嗎？剛才的辯論太棒了！"]], "aName": "Camille", "bName": "Jia Hui", "aRole": "Camille · 設計負責人，巴黎", "bRole": "Jia Hui · 產品經理，新加坡", "aBrief": "對想法激烈爭論，說明我認真對待它們。這不是針對個人；之後我們還是朋友。", "bBrief": "當著團隊的面被說我的工作“在邏輯上完全說不通”，感覺像是公開攻擊。一杯酒抵消不了。", "lenses": {"culture": "在 Meyer 的“分歧”維度上，平均而言，法國偏向把公開對抗視為投入，而許多東南亞和東亞職場偏向避免公開對抗。", "power": "Camille 在總部，對區域晉升有非正式影響力，這提高了公開衝突的風險。", "person": "Jia Hui 一邊照顧生病的父母，一邊在這個旅程上花了兩週時間。"}, "script": "Jia Hui，我們來看看兩個旅程的不同之處。如果兩個都測試，什麼樣的使用者行為能告訴我們哪個更好？"}, {"id": 7, "dim": "時間與日程", "title": "有彈性的截止時間", "cities": ["蘇黎世", "羅馬"], "sit": [["Anna · 物流規劃師，蘇黎世", "我們的碼頭時段鎖定在週五 09:00。你們的卡車週二 14:00 才到。"], ["Matteo · 運營負責人，羅馬", "一個重要客戶的工廠週四出了故障。我們調動所有人去修。我們救了他們，今天也送到了！"], ["Anna", "你們打亂了我們整個日程。"]], "aName": "Anna", "bName": "Matteo", "aRole": "Anna · 物流規劃師，蘇黎世", "bRole": "Matteo · 運營負責人，羅馬", "aBrief": "如果時段是有彈性的，供應鏈就會崩潰。準時就是尊重。", "bBrief": "一個客戶陷入了危機。為了保護一個內部時段而不顧真正的緊急情況，這不是服務。", "lenses": {"culture": "在 Meyer 的“日程”維度上，平均而言，瑞士接近線性時間的一端，義大利偏向靈活時間。", "power": "Anna 的工廠錯過碼頭時段會被自動罰款；Matteo 的獎金與客戶滿意度掛鉤。", "person": "Matteo 週日親自開車去客戶那裡，確保修復有效。"}, "script": "Matteo，救下那個客戶幹得漂亮。這裡的碼頭變更會波及另外三家工廠。危機發生時，我們能約定提前一小時預警，好讓我們及時調整時段嗎？"}, {"id": 8, "dim": "說服", "title": "“先講為什麼”的反推", "cities": ["紐約", "巴黎"], "sit": [["Jordan · 產品副總裁，紐約", "這是我們的新 CRM！三個案例研究顯示成交率提高了 40%。週五前完成上線吧！"], ["Elodie · 國家負責人，巴黎", "等等。為什麼是這家供應商？它的資料模型背後的邏輯是什麼？"], ["Jordan · 私下", "為什麼巴黎總想講哲學？"]], "aName": "Jordan", "bName": "Elodie", "aRole": "Jordan · 產品副總裁，紐約", "bRole": "Elodie · 國家負責人，巴黎", "aBrief": "展示結果，跳過理論。人們想要的是有效的證據。", "bBrief": "如果邏輯有缺陷，那些案例研究就只是運氣。先讓我相信方法是可靠的。", "lenses": {"culture": "Meyer 的“說服”維度對比了原則優先的推理（常與法國聯絡在一起）和應用優先的推理（常與美國聯絡在一起）。兩者都很嚴謹，只是起點不同。", "power": "這個決定來自紐約，歐洲幾乎沒有參與，所以“為什麼？”也意味著“我們沒被徵求意見”。", "person": "Elodie 有工程背景，經歷過一次失敗的 CRM 遷移。"}, "script": "Elodie，在演示之前，我先花五分鐘講講為什麼我們選擇這個資料模型而不是其他方案，然後再看結果。我很想聽聽你對評估的看法。"}], "ca": [{"id": 1, "dim": "Males notícies i jerarquia", "title": "El bloqueig que va desaparèixer", "cities": ["San Francisco", "Bengaluru"], "sit": [["Alex · Mànager d'enginyeria, San Francisco", "Demà llancem el servei d'autenticació. Algun bloqueig?"], ["Rohan · Tech lead, Bengaluru (equip proveïdor)", "L'equip està analitzant activament els fluxos de dades. Tot bé per la nostra banda."], ["Alex · l'endemà", "La build s'ha trencat per una dependència d'un esquema antic! Per què no es va avisar ahir?"], ["Rohan", "Vam treballar tota la nit per arreglar-ho sense alarmar la vostra direcció."]], "aName": "Alex", "bName": "Rohan", "aRole": "Alex · Mànager d'enginyeria, San Francisco", "bRole": "Rohan · Tech lead, Bengaluru (equip proveïdor)", "aBrief": "Vaig preguntar directament per bloquejos. Avisar aviat dels riscos és la feina; les males notícies d'hora són bones notícies.", "bBrief": "Assenyalar un bloqueig en un canal obert, davant del mànager del client, era com fallar en públic. «Analitzant activament» era el meu senyal que alguna cosa anava malament.", "lenses": {"culture": "El Culture Map d'Erin Meyer situa l'Índia cap a l'extrem jeràrquic de la seva escala de «Liderar» i els EUA cap a l'igualitari, de mitjana. Portar un problema sense resoldre a algú de més rang es pot sentir com faltar al deure.", "power": "En Rohan treballa per a un proveïdor. Admetre un bloqueig davant del mànager del client es pot sentir com arriscar el contracte, a qualsevol país.", "person": "En Rohan està orgullós de l'ofici del seu equip i no volia que culpessin els seus enginyers júnior."}, "script": "Rohan, part de la meva feina és treure del mig el que el teu equip no controla. Quina dependència puc desbloquejar per tu aquesta setmana?"}, {"id": 2, "dim": "Feedback i to", "title": "La revisió de codi sense filtre", "cities": ["Amsterdam", "São Paulo"], "sit": [["Daan · Staff engineer, Amsterdam", "Revisió del PR: «Aquesta implementació és inacceptable. Descarta el patró ORM i reescriu-la»."], ["Thiago · Desenvolupador sènior, São Paulo", "Rebut."], ["Daan · més tard, aquella mateixa setmana", "Per què en Thiago no ha tornat a dir res en cap revisió?"]], "aName": "Daan", "bName": "Thiago", "aRole": "Daan · Staff engineer, Amsterdam", "bRole": "Thiago · Desenvolupador sènior, São Paulo", "aBrief": "El codi no és una persona. Ser clar estalvia hores d'anades i vingudes a tothom.", "bBrief": "Ni una paraula sobre el que funcionava, en un PR públic, amb «inacceptable». Així no es tracta un company que respectes.", "lenses": {"culture": "A l'escala d'«Avaluar» de Meyer, els Països Baixos són a prop de l'extrem directe per al feedback negatiu, mentre que el Brasil és més cap a l'indirecte, de mitjana.", "power": "Els comentaris escrits perden el to, i en Daan té més antiguitat. Les paraules dures des de dalt pesen més.", "person": "En Daan escriu de manera escarida a tothom, inclòs el seu mànager. En Thiago s'havia quedat fins tard per lliurar aquest PR."}, "script": "Thiago, la feina de l'esquema és sòlida. Un dubte: el patró de consultes ORM patirà als pics de càrrega. Tens deu minuts per veure opcions junts?"}, {"id": 3, "dim": "Silenci i torns de paraula", "title": "El silenci de quatre segons", "cities": ["Londres", "Tòquio"], "sit": [["Harry · Director, Londres", "Alguna objecció a retirar l'esquema antic el mes que ve?"], ["Kenji · Arquitecte, Tòquio", "(activa el micro… fa una pausa)"], ["Harry", "Genial, qui calla atorga! Següent punt."], ["Tres dies després", "L'equip de Tòquio avisa d'una dependència crítica de l'esquema antic."]], "aName": "Harry", "bName": "Kenji", "aRole": "Harry · Director, Londres", "bRole": "Kenji · Arquitecte, Tòquio", "aBrief": "En una videotrucada, el silenci és acord. Si ningú no objecta en un parell de segons, continuem.", "bBrief": "Estava formulant un desacord en el meu segon idioma, amb cura, per no avergonyir ningú. Va continuar abans que pogués parlar.", "lenses": {"culture": "Sovint es descriu que en const timer = {
  total: 90, left: 90, running: false, raf: 0, last: 0, onEnd: null, ended: false,
  start(total, onEnd) { this.stop(); this.total = this.left = total; this.onEnd = onEnd; this.ended = false; this.resume(); },

  pause() { this.running = false; cancelAnimationFrame(this.raf); keepAwake(false); this.paint(); },
  stop() { this.running = false; cancelAnimationFrame(this.raf); keepAwake(false); },
  tick() {

};

      <a class="link" href="/labs/cq/" target="_blank" rel="noopener" style="align-self:flex-start">${esc(t.atlas)}</a>
      <div class="spacer"></div>
      <div class="btns"><button class="btn pri" data-act="toMode" data-focus>${esc(t.start)} →</button></div>
    </section>`; break;

  case "mode":
    h = `<section class="screen">
      <h2>${esc(t.modeTitle)}</h2>
      <div class="heard">${t.modes.map((m, i) => `<button data-mode="${i + 1}" ${i === 0 ? "data-focus" : ""}><span class="e">${i === 0 ? PHONE1 : PHONE2}</span><span><b>${esc(m[0])}</b><small>${esc(m[1])}</small></span></button>`).join("")}</div>
      <div class="spacer"></div>
      <div class="btns"><button class="btn" data-act="toIntro">← ${esc(t.backBtn)}</button></div>
    </section>`; break;

  case "code":
    h = `<section class="screen">
      <h2>${esc(t.codeTitle)}</h2><p class="lead">${esc(t.codeLead)}</p>
      <div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
        <div><span class="kicker">${esc(t.codeYours)}</span><div id="codeShow" style="font-family:var(--mono);font-size:clamp(30px,10vw,40px);font-weight:700;letter-spacing:.12em;margin-top:6px">${esc(S.code)}</div></div>
        <button class="btn" data-act="newCode" style="flex:none">↻ ${esc(t.codeNew)}</button>
      </div>
      <label class="field"><span>${esc(t.codeEnter)}</span><input id="codeIn" maxlength="6" autocapitalize="characters" autocomplete="off" spellcheck="false" style="font-family:var(--mono);letter-spacing:.2em;text-transform:uppercase"></label>
      <div><span class="kicker">${esc(t.rolePick)}</span>
        <div class="seg" role="group" style="margin-top:10px">${[0, 1].map(i => `<button type="button" data-role="${i}" aria-pressed="${S.role === i}">${esc(cap(roleObj(i).r))}</button>`).join("")}</div>
        <p style="margin:8px 0 0;font-size:12.5px;color:var(--muted)">${esc(t.roleHint)}</p></div>
      <div class="spacer"></div>
      <div class="btns"><button class="btn" data-act="toMode">← ${esc(t.backBtn)}</button><button class="btn pri" data-act="toSituation" data-focus>${esc(t.next)} →</button></div>
    </section>`; break;

  case "situation":
    h = `<section class="screen">
      <span class="kicker">${esc(sc.corridor ? t.fromAtlas + " · " + sc.dim : t.sitKicker)}${S.mode === 2 ? " · " + esc(S.code) : ""}</span>
      <h2>${esc(sc.title)}</h2>
      ${Array.isArray(sc.sit) ? `<div class="card" style="display:grid;gap:12px;padding:18px">${sc.sit.map(m => `<div><span style="display:block;font-family:var(--mono);font-size:11px;color:var(--muted)">${esc(m[0])}</span><span style="font-family:var(--serif);font-style:italic;font-size:18px;line-height:1.35">${/^[“"]/.test(m[1]) ? esc(m[1]) : "“" + esc(m[1]) + "”"}</span></div>`).join("")}</div>` : `<div class="prompt" style="min-height:0"><div class="q" style="font-size:clamp(19px,5vw,23px)">${esc(sc.sit)}</div></div>`}
      <div class="roles">
        <div class="role ${S.mode === 2 && myRole() === 0 ? "speak" : ""}"><div class="k">A${sc.a.role ? " · " + esc(sc.a.role.split(" · ").slice(1).join(" · ")) : ""}</div><div class="n">${esc(cap(sc.a.r))}</div></div>
        <div class="role ${S.mode === 2 && myRole() === 1 ? "speak" : ""}"><div class="k">B${sc.b.role ? " · " + esc(sc.b.role.split(" · ").slice(1).join(" · ")) : ""}</div><div class="n">${esc(cap(sc.b.r))}</div></div>
      </div>
      <div class="tip"><i>◎</i><span><b>${esc(t.goalLbl)}</b>${esc(sc.goal)}</span></div>
      <div class="spacer"></div>
      <div class="btns">
        ${S.mode === 1 && !S.swapped && S.fixed == null ? `<button class="btn" data-act="another">↻ ${esc(t.another)}</button>` : ""}
        <button class="btn pri" data-act="toBrief" data-focus>${esc(t.readBriefs)} →</button>
      </div>
    </section>`; break;

  case "pass0": case "pass1": {
    const i = S.screen === "pass0" ? 0 : 1, r = roleObj(i).r;
    h = `<section class="screen">${curtainHTML(fmt(t.passTo, { r: rn(r) }), fmt(t.passLead, { r: rn(r) }), fmt(t.ready, { r: rn(r) }), i === 0 ? "toBrief0" : "toBrief1")}</section>`; break; }

  case "brief0": case "brief1": case "brief": {
    const i = S.screen === "brief" ? myRole() : S.screen === "brief0" ? 0 : 1, r = roleObj(i).r;
    const nextAct = S.screen === "brief0" ? "toPass1" : "toTalk";
    h = `<section class="screen">
      ${briefHTML(i, { dark: true, kicker: fmt(t.briefKicker, { r: rn(r) }), title: esc(t.briefTitle) })}
      <p style="margin:0;font-size:13.5px;color:var(--muted)">${esc(t.briefNote)}</p>
      <div class="tip"><i>◎</i><span><b>${esc(t.goalLbl)}</b>${esc(sc.goal)}</span></div>
      <div class="spacer"></div>
      <div class="btns"><button class="btn pri" data-act="${nextAct}" data-focus>${esc(t.hide)} →</button></div>
    </section>`; break; }

  case "talk":
    h = `<section class="screen">
      <h2>${esc(t.talkTitle)}</h2>
      <p class="lead">${esc(t.talkLead)}</p>
      <div class="tip"><i>◎</i><span><b>${esc(t.goalLbl)}</b>${esc(sc.goal)}</span></div>
      <div class="timer" id="timer" style="width:min(56vw,210px)">${ringSVG()}<div class="num"><div><b id="tnum">5:00</b><small id="tlbl"></small></div></div></div>
      <div class="tip" id="ltip"><i>✦</i><span>${esc(t.talkTips[S.tipIdx % t.talkTips.length])}</span></div>
      <div class="spacer"></div>
      <div class="btns">
        <button class="btn" data-act="pause" id="pauseBtn">${esc(timer.running || timer.ended ? t.pause : t.resume)}</button>
        <button class="btn pri" data-act="toOutcome" data-focus>${esc(t.reached)} →</button>
      </div>
    </section>`; break;

  case "outcome":
    h = `<section class="screen">
      <h2>${esc(t.outcomeTitle)}</h2>
      <div class="heard">${t.outcomes.map((o, i) => `<button data-out="${i}" ${i === 0 ? "data-focus" : ""}><span class="e">${OUT_ICONS[i]}</span><span><b>${esc(o[0])}</b><small>${esc(o[1])}</small></span></button>`).join("")}</div>
      <p style="margin:0;font-size:13.5px;color:var(--muted)">${esc(t.outcomeNote)}</p>
    </section>`; break;

  case "reveal":
    h = `<section class="screen">
      <span class="kicker" style="color:var(--accent-ink)">${esc(t.revealKicker)} · ${esc(sc.dim)}</span>
      <h2>${esc(t.revealTitle)}</h2>
      <div style="display:grid;gap:10px">${briefHTML(0, { dark: myRole() === 0 && S.mode === 2, kicker: "A · " + esc(cap(sc.a.r)) })}${briefHTML(1, { dark: myRole() === 1 && S.mode === 2, kicker: "B · " + esc(cap(sc.b.r)) })}</div>
      ${sc.lenses ? `<div class="monday"><b>${esc(t.lensLbl)}</b><div style="display:grid;gap:8px;margin-top:6px">${["culture", "power", "person"].map(k => `<div><span style="font-family:var(--mono);font-size:11px;color:var(--muted)">${esc(t.lensNames[k])}</span><br>${esc(sc.lenses[k])}</div>`).join("")}</div></div>
      <div class="card" style="background:var(--inkbg,var(--ink));color:#fff;border-color:var(--inkbd,var(--ink))"><span class="kicker" style="color:rgba(255,255,255,.55)">${esc(t.lineLbl)}</span><p style="margin:6px 0 0;font-family:var(--serif);font-style:italic;font-size:20px;line-height:1.35">“${esc(sc.script)}”</p></div>` : `<div class="monday"><b>${esc(t.diffLbl)}</b>${esc(sc.diff)}</div>`}
      <p style="margin:0;font-size:12.5px;color:var(--muted)">${esc(t.dimNote)}</p>
      <div><span class="kicker">${esc(t.reflectLbl)}</span>
        <ol style="margin:10px 0 0;padding-left:20px;display:grid;gap:8px;font-size:15px;line-height:1.5">${t.reflect.map(q => `<li>${esc(q)}</li>`).join("")}</ol></div>
      <div class="spacer"></div>
      <div class="btns">
        ${S.rounds < 1 ? `<button class="btn" data-act="toSwap">⇄ ${esc(t.swapBtn)}</button>` : ""}
        <button class="btn pri" data-act="toEnd" ${S.rounds >= 1 ? "data-focus" : ""}>${esc(t.finish)} →</button>
      </div>
    </section>`; break;

  case "swap":
    h = `<section class="screen">${curtainHTML(esc(t.swapTitle), fmt(t.swapLead, { a: rn(sc.a.r), b: rn(sc.b.r) }) + (S.mode === 2 ? "<br><br>" + esc(t.swap2) : ""), esc(t.swapGo), "afterSwap")}</section>`; break;

  case "end":
    h = `<section class="screen">
      <span class="kicker" style="color:var(--good)">✓ ${esc(t.endKicker)}</span>
      <h2>${esc(t.endTitle)}</h2>
      <p class="serif">${esc(t.endLead)}</p>
      <div class="monday"><b>${esc(t.monday)}</b>${esc(t.mondayTxt)}</div>
      <div class="spacer"></div>
      <div class="btns"><button class="btn" data-act="again">↻ ${esc(t.again)}</button><button class="btn pri" data-act="teach" data-focus>${esc(t.passOn)} →</button></div>
    </section>`; break;

  case "teach": h = teachHTML("swap"); break;
  }
  const hadFocus = stage.contains(document.activeElement);
  stage.innerHTML = h;
  const f = stage.querySelector("[data-focus]");
  if (f && hadFocus) f.focus({ preventScroll: true });
}

const svgI = p => `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#17171A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const PHONE1 = svgI('<rect x="7" y="3" width="10" height="18" rx="2.5"/><path d="M11 18h2" stroke="#E2553F"/>');
const PHONE2 = svgI('<rect x="2.5" y="5" width="8" height="15" rx="2"/><rect x="13.5" y="5" width="8" height="15" rx="2"/><path d="M8.5 2.5c2-1.3 5-1.3 7 0" stroke="#E2553F"/>');
const OUT_ICONS = [
  '<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="var(--good)"/></svg>',
  '<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="8.25" fill="none" stroke="var(--ink)" stroke-width="1.5"/><path d="M11 2.75a8.25 8.25 0 0 1 0 16.5z" fill="var(--ink)"/></svg>',
  '<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="8.25" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="3 3"/></svg>'
];

function teachHTML(demo) {
  const t = T(), chain = store.get("fb_teachback", []).filter(c => c.demo === demo);
  return `<section class="screen">
    <span class="kicker" style="color:var(--accent-ink)">${esc(t.teachKicker)}</span>
    <h2>${esc(t.teachTitle)}</h2>
    <p class="lead">${esc(t.teachLead)}</p>
    <div class="steps3">${t.t3.map((s, i) => `<div><b>0${i + 1}</b><span>${esc(s)}</span><small style="display:block;font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.4">${esc(t.t3sub[i])}</small></div>`).join("")}</div>
    <div class="card" style="display:grid;gap:12px">
      <label class="field"><span>${esc(t.learnerName)}</span><input id="lName" maxlength="30" autocomplete="off" placeholder="${esc(t.learnerPh)}"></label>
      <label class="field"><span>${esc(t.learned)}</span><textarea id="lText" maxlength="280" placeholder="${esc(t.learnedPh)}"></textarea></label>
      <button class="btn pri" data-act="saveTeach" style="flex:none">${esc(t.save)}</button>
    </div>
    <div><span class="kicker">${esc(t.chainTitle)}</span>
      <ul class="chain" style="margin-top:10px">${chain.length ? chain.slice().reverse().map(c => `<li>${esc(c.text)}<small>${c.name ? esc(c.name) + " · " : ""}${esc(new Date(c.at).toLocaleDateString((/*i18n*/lang === "zh" ? "zh-CN" : (lang === "zh-Hant" ? "zh-TW" : lang))))}</small></li>`).join("") : `<li style="color:var(--muted)">${esc(t.chainEmpty)}</li>`}</ul></div>
    <a class="link" href="/tools/teachback">⊂⊃ ${esc((/*i18n*/lang === "zh" ? "教回去链条 ↗" : (lang === "zh-Hant" ? "教回去鏈條 ↗" : (/*i18n*/lang === "es" ? "Cadena de Enseñar de Vuelta ↗" : (lang === "ca" ? "Cadena d'Ensenyar de Tornada ↗" : "Teach-Back Chain ↗")))))}</a>
    <button class="link" data-act="restart">${esc(t.restart)}</button>
  </section>`;
}

function startTalk() {
  timer.start(300, () => toast(T().timeUp));
  const pb = $("pauseBtn"); if (pb) pb.textContent = T().pause;
  const tips = setInterval(() => {
    if (S.screen !== "talk") { clearInterval(tips); return; }
    S.tipIdx++; const el = $("ltip"); if (el) el.querySelector("span").textContent = T().talkTips[S.tipIdx % T().talkTips.length];
  }, 25000);
}

function reset(full) {
  Object.assign(S, { swapped: false, outcome: null, rounds: 0, tipIdx: 0 });
  if (full) { S.code = newCode(); pickFromCode(); }
}

$("stage").addEventListener("input", e => {
  if (e.target.id !== "codeIn") return;
  const v = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
  if (v !== e.target.value) e.target.value = v;
  if (v.length === 6) { S.code = v; pickFromCode(); const c = $("codeShow"); if (c) c.textContent = v; render(); toast("✓ " + v); }
});
$("stage").addEventListener("click", e => {
  sound.init();
  const m = e.target.closest("[data-mode]"), r = e.target.closest("[data-role]"), o = e.target.closest("[data-out]"), a = e.target.closest("[data-act]");
  if (m) { sound.tap(); S.mode = +m.dataset.mode; reset(true); go(S.mode === 2 ? "code" : "situation"); return; }
  if (r) { sound.tap(); S.role = +r.dataset.role; render(); return; }
  if (o) { sound.warm(); S.outcome = +o.dataset.out; go("reveal"); return; }
  if (!a) return;
  const k = a.dataset.act; sound.tap();
  switch (k) {
    case "toIntro": go("intro"); break;
    case "toMode": go("mode"); break;
    case "newCode": S.code = newCode(); pickFromCode(); render(); break;
    case "toSituation": go("situation"); break;
    case "another": { const prev = S.sc; let g = 0; do { S.code = newCode(); pickFromCode(); g++; } while (S.sc === prev && g < 40); render(); break; }
    case "toBrief": go(S.mode === 2 ? "brief" : "pass0"); break;
    case "toBrief0": go("brief0"); break;
    case "toPass1": go("pass1"); break;
    case "toBrief1": go("brief1"); break;
    case "toTalk": go("talk"); break;
    case "pause":
      if (timer.ended) return;
      if (timer.running) { timer.pause(); a.textContent = T().resume; } else { timer.resume(); a.textContent = T().pause; }
      break;
    case "toOutcome": timer.stop(); go("outcome"); break;
    case "toSwap": go("swap"); break;
    case "afterSwap": S.swapped = !S.swapped; S.rounds++; S.outcome = null; go(S.mode === 2 ? "brief" : "pass0"); break;
    case "toEnd": sound.warm(); go("end"); break;
    case "again": S.fixed = null; reset(true); go(S.mode === 2 ? "code" : "situation"); break;
    case "teach": go("teach"); break;
    case "saveTeach": {
      const text = ($("lText").value || "").trim(), name = ($("lName").value || "").trim();
      if (!text) { $("lText").focus(); return; }
      const chain = store.get("fb_teachback", []); chain.push({ demo: "swap", text, name, at: Date.now() }); store.set("fb_teachback", chain.slice(-50));
      sound.warm(); toast(T().saved); render(); break; }
    case "restart": reset(true); go("intro"); break;
  }
});

window.__app = { S, go, render, timer, pickFromCode, SCEN };

/* ---------- facilitator guide ---------- */
const drawer = $("drawer");
function openGuide() {
  const t = T();
  $("panel").innerHTML = `
    <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start">
      <div><span class="kicker">${esc(t.gKicker)}</span><h3 id="g-title">${esc(t.gTitle)}</h3></div>
      <button class="x" data-close aria-label="${esc(t.close)}">✕</button>
    </div>
    <h4>${esc(t.gWhy)}</h4><p>${esc(t.gWhyTxt)}</p>
    <h4>${esc(t.gSteps)}</h4><ol>${t.gStepList.map(s => `<li>${esc(s)}</li>`).join("")}</ol>
    <h4>${esc(t.gDebrief)}</h4><ul>${t.gDebriefList.map(s => `<li>${esc(s)}</li>`).join("")}</ul>
    <h4>${esc(t.gNotes)}</h4><ul>${t.gNotesList.map(s => `<li>${esc(s)}</li>`).join("")}</ul>`;
  drawer.classList.add("show");
  setTimeout(() => drawer.querySelector("[data-close]").focus({ preventScroll: true }), 60);
}
function closeGuide() { drawer.classList.remove("show"); $("btn-guide").focus({ preventScroll: true }); }
drawer.addEventListener("click", e => { if (e.target === drawer || e.target.closest("[data-close]")) closeGuide(); });
$("btn-guide").addEventListener("click", openGuide);
window.addEventListener("keydown", e => { if (e.key === "Escape" && drawer.classList.contains("show")) closeGuide(); });

/* ---------- language + sound ---------- */
function paintSound() {
  const b = $("btn-sound"), t = T();
  b.innerHTML = sound.muted
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m22 9-6 6M16 9l6 6"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>';
  b.setAttribute("aria-label", sound.muted ? t.soundOff : t.soundOn); b.title = b.getAttribute("aria-label");
}
$("btn-sound").addEventListener("click", () => { sound.muted = !sound.muted; store.set("fb_muted", sound.muted); sound.init(); paintSound(); if (!sound.muted) sound.tap(); });

function applyLang(l) {
  lang = LANGS.includes(l) ? l : "en";
  document.documentElement.lang = (/*i18n*/lang === "zh" ? "zh-CN" : (lang === "zh-Hant" ? "zh-TW" : lang));
  document.title = T().title;
  $("lang-lbl").textContent = LANG_LBL[lang];
  $("btn-guide").setAttribute("aria-label", T().guide); drawer.setAttribute("aria-label", T().guide);
  document.querySelectorAll("[data-t]").forEach(el => { const v = T()[el.dataset.t]; if (typeof v === "string") el.textContent = v; });
  paintSound();
  render();               // the clock object survives a re-render
  timer.paint();
  const pb = $("pauseBtn"); if (pb && !timer.running && !timer.ended) pb.textContent = T().resume;
  if (drawer.classList.contains("show")) openGuide();
  try { localStorage.setItem("wm_preferred_lang", lang); localStorage.setItem("wm_cases_lang", lang); } catch (e) {}
}
$("btn-lang").addEventListener("click", () => applyLang(LANGS[(LANGS.indexOf(lang) + 1) % LANGS.length]));
window.FBL_SET = l => applyLang(l); window.FBL_GET = () => lang;

/* ---------- boot ---------- */
let saved = null;
try { saved = localStorage.getItem("wm_preferred_lang") || localStorage.getItem("wm_cases_lang"); } catch (e) {}
const nav = (navigator.language || "").toLowerCase();
applyLang(LANGS.includes(saved) ? saved : nav.startsWith("zh") ? "zh" : nav.startsWith("es") ? "es" : "en");
document.addEventListener("visibilitychange", () => { if (!document.hidden && timer.running) keepAwake(true); });
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("/sw.js", { scope: "/" }).catch(() => {}); // offline cache
})();
</script>
</body>
</html>
