<link rel="stylesheet" href="/fonts/g/fonts.css">
<style>
  :root { --bg:#0b0a12; --ink:#efe9f7; --dim:rgba(239,233,247,.6); --pink:#ff5f8a; --cyan:#5fe3ff; --amber:#ffc65f; color-scheme:dark; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font:500 16px/1.5 "Plus Jakarta Sans", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { min-height:100vh; min-height:100dvh; overflow-x:hidden;
    background:radial-gradient(900px 420px at 50% -10%, rgba(255,95,138,.16), transparent 70%), radial-gradient(700px 380px at 90% 110%, rgba(95,227,255,.10), transparent 70%), var(--bg); }
  body::before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.5;
    background:repeating-linear-gradient(90deg, rgba(255,255,255,.018) 0 1px, transparent 1px 60px), repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0 1px, transparent 1px 60px); }
  main { position:relative; max-width:880px; margin:0 auto; padding:max(36px, env(safe-area-inset-top)) 18px 40px; }
  .sign { display:inline-block; margin:0 0 6px; font:400 clamp(30px, 9vw, 56px)/1 "Syne", "Plus Jakarta Sans", sans-serif; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
    color:#fff0f5; text-shadow:0 0 6px var(--pink), 0 0 18px var(--pink), 0 0 42px rgba(255,95,138,.6); animation:buzz 6s infinite; }
  .sign span { color:#e9fbff; text-shadow:0 0 6px var(--cyan), 0 0 18px var(--cyan), 0 0 42px rgba(95,227,255,.6); }
  @keyframes buzz { 0%, 91%, 100% { opacity:1 } 92% { opacity:.45 } 93% { opacity:1 } 95% { opacity:.7 } }
  .lead { margin:8px 0 30px; color:var(--dim); max-width:34em; font-size:17px; }
  .doors { display:grid; grid-template-columns:repeat(auto-fit, minmax(250px, 1fr)); gap:18px; }
  .door { position:relative; display:flex; flex-direction:column; gap:10px; padding:22px 20px 18px; border-radius:18px 18px 6px 6px; text-decoration:none; color:inherit; isolation:isolate;
    background:linear-gradient(#17141f, #100e17); border:1px solid rgba(255,255,255,.08); box-shadow:0 30px 60px -36px #000; transition:transform .25s cubic-bezier(.3,1.4,.5,1), box-shadow .25s; }
  .door::after { content:""; position:absolute; left:10%; right:10%; bottom:-14px; height:14px; z-index:-1; border-radius:50%; background:var(--glow); filter:blur(14px); opacity:.45; transition:opacity .25s; }
  a.door:hover, a.door:focus-visible { transform:translateY(-4px); box-shadow:0 0 0 1px var(--glow), 0 30px 60px -30px #000; }
  a.door:hover::after { opacity:.9; }
  a.door:focus-visible { outline:2px solid var(--glow); outline-offset:3px; }
  .door .ic { font-size:34px; line-height:1; filter:drop-shadow(0 0 10px var(--glow)); }
  .door h2 { margin:0; font:800 22px/1.15 "Syne", "Plus Jakarta Sans", sans-serif; color:#fff; text-shadow:0 0 14px var(--glow); }
  .door p { margin:0; color:var(--dim); font-size:15px; }
  .door .tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; }
  .door .tags span { padding:3px 9px; border-radius:999px; font-size:12px; font-weight:700; color:var(--glow); border:1px solid color-mix(in srgb, var(--glow) 45%, transparent); background:color-mix(in srgb, var(--glow) 10%, transparent); }
  .door .go { position:absolute; right:16px; top:18px; color:var(--glow); font-size:20px; }
  .door.soon { border-style:dashed; opacity:.55; }
  .door.soon .ic { filter:none; }
  .moon { position:fixed; right:8%; top:70px; width:46px; height:46px; border-radius:50%; box-shadow:-10px 4px 0 0 #f4e6c8; transform:rotate(-20deg); opacity:.85; pointer-events:none; }
  .back { display:inline-block; margin-top:34px; color:var(--dim); font-size:13px; text-decoration:none; border-bottom:1px solid transparent; }
  .back:hover { border-color:currentColor; }
  @media (prefers-reduced-motion: reduce) { .sign { animation:none; } .door { transition:none; } }
</style>
<meta name="theme-color" content="#F7F6F2" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#141416" media="(prefers-color-scheme: dark)"><style id="fb-dark">

<script>
(function () {
