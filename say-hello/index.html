<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="referrer" content="same-origin" data-fbr><script data-fbl data-mode="game" src="/fbkit/fb.js?v=dd71aaf8d6"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Say Hello · a postcard that opens on its day</title>
<meta name="description" content="Write a postcard today and seal it until the day it matters. Send the link with a line that says why, or print it and post it by hand. No account.">
<meta name="theme-color" content="#efe9dd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161f" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Say Hello">
<link rel="stylesheet" href="/fonts/g/fonts.css">
<style>
:root{
  --bg:#efe9dd;--bg2:#e5ddcc;--panel:#fbf8f1;--ink:#1d2436;--ink2:#5d6475;--line:#d8cfbd;--red:#c23b26;--blue:#26467f;--gold:#b8862e;
  --paper:#fcf8ef;--paper2:#f3ecdc;--kraft:#ead9b8;--pen:#26467f;--shadow:0 1px 0 rgba(255,255,255,.7) inset,0 22px 44px -26px rgba(29,36,54,.55);
  --serif:"Instrument Serif","Iowan Old Style",Georgia,"Songti SC","Noto Serif SC","Noto Serif TC",serif;
  --sans:"Figtree",system-ui,-apple-system,"Segoe UI","PingFang SC","PingFang TC","Microsoft YaHei",sans-serif;
  --hand:"Caveat","Bradley Hand","Kaiti SC","STKaiti","KaiTi","Kaiti TC",cursive;
  --type:"Special Elite","Courier New",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#14161f;--bg2:#1b1e2a;--panel:#1e2230;--ink:#ece6d8;--ink2:#a9abb6;--line:#30364a;--red:#e2674f;--blue:#8fb0ec;--gold:#d9ad5c;
  --shadow:0 24px 48px -24px #000;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;background-image:radial-gradient(rgba(90,80,60,.07) 1px,transparent 1.3px);background-size:6px 6px;z-index:0}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}
a{color:var(--red)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}
.wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left)) 0 max(16px,env(safe-area-inset-right))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar: airmail stripe under it */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:repeating-linear-gradient(-45deg,var(--red) 0 10px,transparent 10px 16px,var(--blue) 16px 26px,transparent 26px 32px);opacity:.85}
.top .wrap{display:flex;align-items:center;gap:8px;min-height:62px;padding-top:env(safe-area-inset-top)}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-decoration:none;color:inherit}
.brand svg{flex:none;width:36px;height:36px}
.brand b{font:400 clamp(24px,5.4vw,30px)/1 var(--serif);letter-spacing:.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;min-width:44px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font:600 14px var(--sans);white-space:nowrap}
.ib:hover{border-color:var(--gold)}
.ib svg{width:18px;height:18px;flex:none}
.ib .dot{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--panel)}
@media (max-width:560px){.ib .lbl{display:none}.ib{padding:0}}
.rel{position:relative}
.langm{position:absolute;right:0;top:calc(100% + 6px);display:grid;min-width:160px;padding:6px;border-radius:14px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);z-index:30}
.langm button{text-align:left;min-height:42px;padding:0 12px;border:0;border-radius:10px;background:none;font:500 15px var(--sans)}
.langm button[aria-current=true]{background:var(--bg2);font-weight:700}

/* hero */
.hero{padding:26px 0 6px}
.hero h1{margin:0;font:400 clamp(30px,6.6vw,52px)/1.04 var(--serif);letter-spacing:-.01em;max-width:17em}
.hero h1 em{font-style:italic;color:var(--red)}
.hero .popo{margin:10px 0 0;max-width:40em;color:var(--ink2);font:400 15.5px/1.5 var(--sans)}
.hero .popo::before{content:"";display:inline-block;width:18px;height:12px;margin:0 8px -1px 0;border-radius:2px;background:repeating-linear-gradient(-45deg,var(--red) 0 3px,var(--paper) 3px 5px,var(--blue) 5px 8px,var(--paper) 8px 10px);box-shadow:0 0 0 1px var(--line)}
.due{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:14px 0 0;padding:10px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.due span{flex:1;min-width:12em}

/* desk: the card beside the steps */
.desk{display:grid;gap:22px;padding:18px 0 30px;align-items:start}
@media (min-width:920px){.desk{grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:40px}.stage{position:sticky;top:86px}}
.stage{display:grid;gap:12px;justify-items:center}
.flipbar{display:flex;gap:6px;justify-content:center}
.seg{display:inline-flex;padding:4px;border-radius:999px;border:1px solid var(--line);background:var(--panel)}
.seg button{min-height:38px;padding:0 16px;border:0;border-radius:999px;background:none;font:600 14px var(--sans);color:var(--ink2)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}

/* the postcard: 148 × 105, like A6 */
.pc{position:relative;width:min(100%,560px);aspect-ratio:148/105;perspective:1400px;container-type:inline-size}
.pc .in{position:absolute;inset:0;transition:transform .8s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.pc.flip .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:6px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 18px 38px -18px rgba(20,22,32,.55),0 2px 6px rgba(20,22,32,.18)}
.face.back{transform:rotateY(180deg)}
@media (prefers-reduced-motion:reduce){.pc .in{transition:none}}
.front{background:#222}
.front canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.front .greet{position:absolute;left:4cqw;bottom:3.4cqw;max-width:78%;padding:1.4cqw 2.6cqw 1.6cqw;background:rgba(252,248,239,.92);border-radius:1cqw;color:#1d2436;box-shadow:0 .6cqw 1.6cqw rgba(0,0,0,.25);transform:rotate(-1.2deg)}
.front .greet small{display:block;font:600 1.9cqw/1.2 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:#7a5a3a}
.front .greet b{display:block;font:italic 400 5.6cqw/1.05 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.front .greet b.ph{opacity:.38}
.back{background:var(--paper);color:#1d2436}
.back::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-45deg,#c23b26 0 2.2cqw,transparent 2.2cqw 3.4cqw,#26467f 3.4cqw 5.6cqw,transparent 5.6cqw 6.8cqw);-webkit-mask:linear-gradient(#000,#000) content-box exclude,linear-gradient(#000,#000);mask:linear-gradient(#000,#000) content-box exclude,linear-gradient(#000,#000);padding:1.3cqw;opacity:.9}
.back .msg{position:absolute;left:5cqw;top:6cqw;width:44cqw;bottom:6cqw;font:500 4.3cqw/1.28 var(--hand);color:var(--pen);white-space:pre-wrap;overflow-wrap:anywhere;overflow:hidden}
.back .msg.ph{opacity:.35}
.back .div{position:absolute;left:52cqw;top:9cqw;bottom:9cqw;width:.25cqw;background:#cbbfa6}
.back .right{position:absolute;left:56cqw;right:5cqw;top:6cqw;bottom:6cqw}
.back .stp{position:absolute;right:0;top:0;width:15cqw;transform:rotate(3deg)}
.back .pm{position:absolute;right:9.5cqw;top:6.5cqw;width:19cqw;opacity:.82;transform:rotate(-12deg);pointer-events:none}
.back .lines{position:absolute;left:0;right:0;top:28cqw;display:grid;gap:3.6cqw}
.back .ln{display:flex;align-items:flex-end;gap:1.4cqw;min-height:5.6cqw;border-bottom:.22cqw solid #cbbfa6;font:500 4.1cqw/1 var(--hand);color:var(--pen);white-space:nowrap;overflow:hidden}
.back .ln small{font:600 1.8cqw/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:#8a7f6a;padding-bottom:.6cqw}
.back .ln .ph{opacity:.35}

/* the envelope a sealed card arrives in */
.env{position:absolute;inset:0;border-radius:6px;background:var(--kraft);color:#2a2418;overflow:hidden;box-shadow:0 18px 38px -18px rgba(20,22,32,.55),0 2px 6px rgba(20,22,32,.18);transition:transform .7s cubic-bezier(.5,0,.2,1),opacity .6s}
.env::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-45deg,#c23b26 0 2.2cqw,#fbf6ea 2.2cqw 3.4cqw,#26467f 3.4cqw 5.6cqw,#fbf6ea 5.6cqw 6.8cqw);-webkit-mask:linear-gradient(#000,#000) content-box exclude,linear-gradient(#000,#000);mask:linear-gradient(#000,#000) content-box exclude,linear-gradient(#000,#000);padding:1.6cqw}
.env::after{content:"";position:absolute;inset:1.6cqw;background:radial-gradient(120% 90% at 30% 20%,rgba(255,255,255,.35),transparent 60%),repeating-linear-gradient(90deg,rgba(120,90,40,.035) 0 2px,transparent 2px 5px);pointer-events:none}
.env .stp{position:absolute;right:6cqw;top:6cqw;width:15cqw;transform:rotate(3deg);z-index:1}
.env .pm{position:absolute;right:15cqw;top:10cqw;width:21cqw;opacity:.85;transform:rotate(-10deg);z-index:2}
.env .addr{position:absolute;left:12cqw;right:28cqw;top:34cqw;z-index:1;font:500 5.4cqw/1.2 var(--hand);color:#1d2436}
.env .addr small{display:block;font:500 3.6cqw/1.3 var(--hand);color:#5a4a30}
.env .when{position:absolute;left:12cqw;bottom:9cqw;z-index:1;font:400 2.5cqw/1.2 var(--type);letter-spacing:.06em;text-transform:uppercase;color:#7a2a1a}
.env .seal{position:absolute;right:9cqw;bottom:8cqw;width:15cqw;aspect-ratio:1;z-index:3;border:0;padding:0;background:none}
.env .seal svg{width:100%;height:100%;filter:drop-shadow(0 .6cqw .8cqw rgba(60,10,0,.35))}
.env .seal:disabled{cursor:default}
.env .seal.ready{animation:glint 3.2s ease-in-out 1}
@keyframes glint{0%,100%{filter:none}40%{filter:drop-shadow(0 0 2.4cqw rgba(246,183,60,.9))}}
.env.gone{transform:translateY(16%) rotate(-3deg);opacity:0;pointer-events:none}

/* steps */
.steps{display:grid;gap:14px}
.step{padding:16px 16px 18px;border-radius:18px;background:var(--panel);border:1px solid var(--line)}
.step h2{display:flex;align-items:baseline;gap:10px;margin:0 0 12px;font:400 23px/1.1 var(--serif)}
.step h2 i{font:600 12px/1 var(--sans);font-style:normal;letter-spacing:.12em;color:var(--red);padding:5px 7px;border:1px solid currentColor;border-radius:999px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tgrp{grid-column:1/-1;margin:4px 0 -2px;font:600 12px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.tgrp:not(:first-child){margin-top:10px}
.thumb{position:relative;padding:0;border:2px solid transparent;border-radius:8px;background:none;aspect-ratio:160/110;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.thumb canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.thumb[aria-pressed=true]{border-color:var(--red);box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--red)}
.stamps{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
@media (max-width:520px){.stamps{grid-template-columns:repeat(5,1fr)}}
.sbtn{padding:4px;border:2px solid transparent;border-radius:8px;background:none;min-height:44px}
.sbtn svg{width:100%;height:auto;display:block}
.sbtn[aria-pressed=true]{border-color:var(--red);background:var(--bg2)}
label.f{display:grid;gap:4px;font:600 13px var(--sans);color:var(--ink2);letter-spacing:.02em}
.f input,.f textarea,.f select,.why input{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font:400 16px/1.4 var(--sans);color:var(--ink)}
.f textarea{min-height:118px;resize:vertical;font:500 21px/1.3 var(--hand);color:var(--pen)}
@media (prefers-color-scheme:dark){.f textarea{color:#b9cdf3}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields{display:grid;gap:10px}
.left{min-height:1.2em;font-size:13px;color:var(--ink2);text-align:right}
.inks{display:flex;gap:8px;align-items:center}
.inks b{font:600 13px var(--sans);color:var(--ink2);margin-right:4px}
.inkb{width:34px;height:34px;border-radius:50%;border:3px solid var(--panel);box-shadow:0 0 0 1px var(--line);background:var(--c)}
.inkb[aria-pressed=true]{box-shadow:0 0 0 2px var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font:500 14.5px var(--sans);color:var(--ink)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:hover{border-color:var(--gold)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.opens{margin:10px 0 0;font:400 13px/1.3 var(--type);letter-spacing:.04em;color:var(--red)}
.why{display:grid;gap:8px}
.hint{margin:0;font-size:13.5px;color:var(--ink2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font:600 15.5px var(--sans);text-decoration:none;color:var(--ink);transition:transform .12s}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff8ef}
.btn.sm{min-height:42px;padding:0 16px;font-size:14px}
.btn svg{width:18px;height:18px;flex:none}
.btn:disabled{opacity:.55;cursor:default}
@media (prefers-color-scheme:dark){.btn.pri{color:#1a0e0a}}
.sendrow{display:grid;gap:10px}
.sendrow .btn.pri{min-height:56px;font-size:17px}
.quiet{border:0;background:none;padding:6px 0;font:500 14.5px var(--sans);color:var(--ink2);text-decoration:underline;text-underline-offset:3px;text-align:left}
.quiet:hover{color:var(--ink)}
.small{font-size:13.5px;color:var(--ink2)}

/* reading */
.read{display:grid;justify-items:center;gap:16px;padding:28px 0 34px}
.read .pc{width:min(100%,600px)}
.read .note{margin:0;text-align:center;max-width:32em;font:400 clamp(22px,4.6vw,30px)/1.2 var(--serif)}
.read .sub{margin:0;text-align:center;max-width:34em;color:var(--ink2)}
.acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* the town */
.town{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;margin:8px 0 34px;padding:16px 18px;border-radius:18px;background:#1d1526;color:#efe7ff}
.town svg{width:42px;height:42px}
.town b{display:block;font:400 21px/1.15 var(--serif)}
.town span{font-size:14.5px;opacity:.85}
.town a{color:#1d1526;background:#f6b73c;border-color:#f6b73c}
@media (max-width:520px){.town{grid-template-columns:auto 1fr}.town a{grid-column:1/-1}}
.foot{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;align-items:center;padding:22px 0 calc(28px + env(safe-area-inset-bottom));border-top:1px solid var(--line);color:var(--ink2);font-size:14px}
.foot a{color:var(--ink2);text-underline-offset:3px}
.foot .ah{color:var(--red)}

/* sheets */
.scrim{position:fixed;inset:0;z-index:60;display:grid;place-items:end center;background:rgba(14,14,22,.5);animation:fi .2s}
@media (min-width:700px){.scrim{place-items:center}}
@keyframes fi{from{opacity:0}}
.sheet{position:relative;width:min(100%,560px);max-height:min(92vh,880px);overflow:auto;padding:22px 20px calc(22px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0;background:var(--panel);box-shadow:var(--shadow);animation:up .25s cubic-bezier(.2,.8,.2,1)}
@media (min-width:700px){.sheet{border-radius:22px}}
.sheet.wide{width:min(100%,760px)}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.sheet h3{margin:0 44px 6px 0;font:400 28px/1.1 var(--serif)}
.sheet h3:focus{outline:none}
.sheet .x{position:absolute;right:12px;top:12px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:18px}
.sheet .sub{margin:0 0 14px;color:var(--ink2)}
.linkbox{display:flex;gap:8px;margin:8px 0 12px}
.linkbox input{flex:1;min-width:0;min-height:46px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font:500 14px var(--sans)}
.stack{display:grid;gap:10px}
.stack .btn{width:100%}
.ws{display:grid;gap:12px;margin:12px 0 18px;padding:0;list-style:none}
.ws li{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center}
.ws svg{width:52px;height:52px}
.ws b{display:block;font:400 21px/1.15 var(--serif)}
.ws span{color:var(--ink2);font-size:15px}
.tabs{display:flex;margin:6px 0 12px}
.list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.it{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;padding:8px;border-radius:14px;border:1px solid var(--line);background:var(--bg)}
.it canvas{width:62px;height:43px;border-radius:4px;image-rendering:pixelated;display:block}
.it a{color:var(--ink);text-decoration:none;font-weight:600}
.it .s{display:block;font:400 12.5px/1.3 var(--type);letter-spacing:.03em;color:var(--ink2)}
.it .s.r{color:var(--red)}
.it .ops{display:flex;gap:4px}
.ib.mini{min-height:38px;min-width:38px;padding:0}
.sec{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.sec h4{margin:0 0 6px;font:400 22px/1.1 var(--serif)}
.qr{display:grid;place-items:center;padding:12px;background:#fff;border-radius:10px;margin-top:10px}
.qr svg{max-width:100%;height:auto}
details summary{cursor:pointer;margin-top:10px;color:var(--ink2);font-size:14px}
.ir{display:flex;gap:8px;margin-top:8px}
.ir input{flex:1;min-width:0;min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:16px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));z-index:90;max-width:min(92vw,460px);transform:translate(-50%,20px);opacity:0;pointer-events:none;padding:12px 18px;border-radius:14px;background:var(--ink);color:var(--bg);font:500 15px/1.4 var(--sans);box-shadow:0 12px 30px -10px rgba(0,0,0,.5);transition:.25s}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* print preview + the printed card itself (148 × 105 mm, front then back) */
.ppv{display:grid;gap:12px;margin:12px 0}
.ppw{position:relative;width:100%;aspect-ratio:148/105;overflow:hidden;border-radius:4px;box-shadow:0 8px 20px -10px rgba(0,0,0,.4),0 0 0 1px var(--line)}
.ppw .pp{position:absolute;left:0;top:0;transform-origin:0 0}
.pp{width:148mm;height:105mm;position:relative;overflow:hidden;background:#fff;color:#1d2436;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pp .img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
.pp .greet{position:absolute;left:6mm;bottom:5mm;max-width:100mm;padding:2mm 4mm 2.4mm;background:rgba(252,248,239,.94);border-radius:1.4mm;transform:rotate(-1.2deg)}
.pp .greet small{display:block;font:600 2.7mm/1.2 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:#7a5a3a}
.pp .greet b{display:block;font:italic 400 8mm/1.05 var(--serif)}
.pp.bk{background:#fcf8ef}

  <button class="ib" id="howB" type="button" data-ia="how"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5V14"/><circle cx="12" cy="17.5" r=".6" fill="currentColor"/></svg></button>
  <div class="rel"><button class="ib" id="langB" type="button" data-ia="lang" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg><span class="lbl" id="langL">EN</span></button></div>
  <button class="ib" id="mineB" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="1.5"/><path d="m3.5 7 8.5 6.5L20.5 7"/></svg><span class="lbl" data-i="mine">My postcards</span><span class="dot" id="mineDot" hidden></span></button>
</div></header>

<main class="wrap" id="main">
  <!-- writing -->
  <div id="writeV">
    <section class="hero">
      <h1 id="tagH">Write it today. It opens on the day it matters.</h1>

      <div class="due" id="due" hidden></div>
    </section>
    <div class="desk">

        <div class="pc" id="card" role="img"><div class="in">

          <div class="face back"><div class="msg" id="bMsg"></div><div class="div"></div><div class="right"><div class="stp" id="bStamp"></div><div class="pm" id="bPm"></div>
            <div class="lines"><div class="ln"><small data-i="to">To</small><span id="bTo"></span></div><div class="ln"></div><div class="ln"><small data-i="from">From</small><span id="bFrom"></span></div></div></div></div>
        </div></div>
        <div class="flipbar"><div class="seg" role="group"><button type="button" id="sideF" aria-pressed="true" data-i="front">Front</button><button type="button" id="sideB" aria-pressed="false" data-i="back">Back</button></div></div>
      </div>

        <section class="step"><h2><i>1</i><span data-i="s1">The picture</span></h2><div class="thumbs" id="thumbs" role="group"></div>

        <section class="step"><h2><i>2</i><span data-i="s2">The stamp</span></h2><div class="stamps" id="stamps" role="group"></div></section>
        <section class="step"><h2><i>3</i><span data-i="s3">On the back</span></h2>
          <div class="fields">
            <label class="f"><span class="sr" data-i="s3"></span><textarea id="msg" maxlength="300" data-ip="msgPh"></textarea></label><div class="left" id="left"></div>
            <div class="grid2"><label class="f"><span data-i="to">To</span><input id="to" maxlength="32" autocomplete="off" data-ip="toPh"></label><label class="f"><span data-i="from">From</span><input id="from" maxlength="32" autocomplete="nickname" data-ip="fromPh"></label></div>
            <div class="inks" id="inks"><b data-i="ink">Ink</b></div>
          </div></section>
        <section class="step"><h2><i>4</i><span data-i="s4">When it opens</span></h2><div class="row" id="whens" role="group"></div>
          <div class="pick" id="pickRow" hidden><label class="f"><span data-i="dayL">Day</span><input type="date" id="pickD"></label><label class="f"><span data-i="timeL">Time</span><input type="time" id="pickT" step="900"></label></div>
          <p class="opens" id="opens"></p></section>
        <section class="step"><h2><i>5</i><span data-i="s5">Why you're sending it</span></h2>
          <div class="why"><input id="why" maxlength="120" autocomplete="off" data-ip="whyPh"><div class="row" id="whys"></div><p class="hint" data-i="whyHint"></p></div></section>
        <div class="sendrow">
          <button class="btn pri" id="sendB" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 11.5 21 4l-6.5 17-3.2-7.3z"/><path d="m11.3 13.7 4.2-4.2"/></svg><span id="sendL">Seal it and send</span></button>
          <button class="quiet" id="wallB" type="button"><span data-i="wallOr"></span> ↗</button>
        </div>
      </div>
    </div>
  </div>

  <!-- a card someone sent -->
  <section class="read" id="readV" hidden>
    <div class="pc" id="rcard"><div class="in">
      <div class="face front"><canvas id="rscene" width="160" height="110"></canvas><div class="greet"><small data-i="greet">Greetings from</small><b id="rPlace"></b></div></div>
      <div class="face back"><div class="msg" id="rMsg"></div><div class="div"></div><div class="right"><div class="stp" id="rStamp"></div><div class="pm" id="rPm"></div>
        <div class="lines"><div class="ln"><small data-i="to">To</small><span id="rTo"></span></div><div class="ln"></div><div class="ln"><small data-i="from">From</small><span id="rFrom"></span></div></div></div></div>
    </div></div>
    <div class="flipbar" id="rFlip" hidden><div class="seg" role="group"><button type="button" id="rsideF" aria-pressed="true" data-i="front">Front</button><button type="button" id="rsideB" aria-pressed="false" data-i="back">Back</button></div></div>
    <p class="note" id="rNote"></p>
    <p class="sub" id="rSub"></p>
    <div class="acts" id="rActs"></div>
  </section>

  <section class="town" id="town">
    <svg viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true"><rect x="2" y="6" width="12" height="9" fill="#8a2a1e"/><rect x="1" y="5" width="14" height="2" fill="#4a1a12"/><rect x="3" y="3" width="10" height="2" fill="#4a1a12"/><rect x="4" y="8" width="8" height="4" fill="#fcf8ef"/><rect x="4" y="8" width="8" height="1" fill="#26467f"/><rect x="10" y="9" width="1" height="2" fill="#c23b26"/><rect x="7" y="13" width="2" height="2" fill="#2a1a10"/></svg>
    <div><b data-i="inTown"></b><span data-i="same"></span></div>
    <a class="btn sm" id="walkA" href="/nearby/?at=%2Fnearby%2Fsay-hello%2F" data-i="walk">Walk there</a>
  </section>
</main>
<footer class="foot wrap" id="foot">
  <a href="/nearby/" data-i="nearbyLink">Nearby</a>
  <a class="ah" id="ahA" href="https://www.wei-meng.org/after-hours/" target="_blank" rel="noopener"><span data-i="ah">After hours</span> ↗</a>
</footer>

<script>

   looks the same wherever it's opened. Keep the two copies identical. */

  /* small people for the pictures where two are together: standing, sitting (dir 1 faces right, -1 left, 0 front) and lying */
  function head(p, x, y, o) { p.r(x + 1, y, 5, 5, o.s); p.r(x + 1, y - 1, 5, 2, o.h); p.r(x, y, 1, 3, o.h); p.r(x + 6, y, 1, 2, o.h); if (o.hl) { p.r(x, y, 1, 7, o.h); p.r(x + 6, y, 1, 7, o.h); } if (o.bun) p.r(x + 2, y - 3, 3, 2, o.h);
    if (o.hood) { p.r(x, y - 2, 7, 3, o.c); p.r(x, y, 1, 4, o.c); p.r(x + 6, y, 1, 4, o.c); } p.r(x + 2, y + 2, 1, 1, "#2a1a14"); p.r(x + 4, y + 2, 1, 1, "#2a1a14"); }
  function stand(p, x, y, o) { var pt = "#2a2a3a";

    p.r(x, y - 1, 3, 1, "#1a1010"); p.r(x + 4, y - 1, 3, 1, "#1a1010"); p.r(x, y - 18, 7, o.k ? 8 : 9, o.c); if (o.sc) p.r(x, y - 18, 7, 2, o.sc); if (o.apr) p.r(x + 1, y - 16, 5, 8, o.apr); head(p, x, y - 23, o); }

    if (dir > 0) { p.r(x + 4, y - 2, 8, 3, pt); p.r(x + 10, y + 1, 3, 8, pt); p.r(x + 10, y + 8, 4, 1, "#1a1010"); p.r(x + 6, y - 7, 5, 2, o.c); }
    else if (dir < 0) { p.r(x - 5, y - 2, 8, 3, pt); p.r(x - 6, y + 1, 3, 8, pt); p.r(x - 7, y + 8, 4, 1, "#1a1010"); p.r(x - 4, y - 7, 5, 2, o.c); }
    else { p.r(x + 1, y - 1, 2, 9, pt); p.r(x + 4, y - 1, 2, 9, pt); p.r(x, y + 7, 3, 1, "#1a1010"); p.r(x + 4, y + 7, 3, 1, "#1a1010"); }
    head(p, x, y - 15, o); }
  function lie(p, x, y, o) { p.r(x + 5, y - 3, 10, 4, o.c); p.r(x + 15, y - 2, 9, 2, "#2a2a3a"); p.r(x + 24, y - 3, 1, 3, "#1a1010"); p.r(x, y - 4, 5, 5, o.s); p.r(x - 1, y - 4, 2, 5, o.h); if (o.hl) p.r(x - 3, y - 3, 3, 6, o.h); p.r(x + 2, y - 3, 1, 1, "#2a1a14"); }

    /* people together, off the screen (Nov 6): the after-hours idea in eight pictures */

      for (var l = 0; l < 12; l++) p.r(R() * 80, 30 + R() * 60, 2, 1, R() < .5 ? "#e08a3a" : "#c8402a");

      p.r(52, 74, 56, 3, "#7a4f2c"); p.r(52, 68, 56, 2, "#8a5a33"); p.r(52, 64, 56, 2, "#8a5a33"); p.r(55, 77, 2, 10, "#3a2a1e"); p.r(103, 77, 2, 10, "#3a2a1e");
      sit(p, 66, 75, 0, { c: "#26467f", h: "#2a1a14", s: "#e8b48a" }); sit(p, 75, 75, 0, { c: "#c8a03a", h: "#7a3a1a", s: "#d8a070", hl: 1 });
          },

        addAct("📅 " + t("remind"), null, "btn pri", function () { ics(c, mineSent(c.id) ? "sender" : "recv"); });
        addAct("✉️ " + t("own"), "./");
        if (!mineSent(c.id)) remember("postcard_waiting", { id: c.id, from: c.from, open_at: c.open_at, scene: c.scene });
        clearTimeout(wakeT); var ms = o - new Date() + 1500;
        if (ms < 2147000000) wakeT = setTimeout(function () { api("postcard_get", { p_id: reading }, true).then(function (n) { if (n) { got = n; paintRead(); } }); }, ms);   /* quietly ready on the day if the page is still open; no ticking clock */
      } else {
        seal.disabled = false; seal.classList.add("ready"); seal.setAttribute("aria-label", t("breakSeal")); seal.title = t("breakSeal"); seal.onclick = openIt;
        $("#rNote").textContent = t("ready"); $("#rSub").textContent = "";
        addAct(t("breakSeal"), null, "btn pri", openIt);
      }
    } else opened();
  }
  function remember(k, entry) { var l = jget(k).filter(function (x) { return x && x.id !== entry.id; }); l.unshift(entry); jset(k, l, 60); paintDot(); }
  function openIt() {
    if (!got || got.sealed) return;
    var env = $(".env"); $("#rcard").dataset.opened = "1"; swish();
    if (env) { env.classList.add("gone"); setTimeout(function () { env.remove(); }, 700); }
    setTimeout(function () { side("r", true); }, matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 1400);
    jset("postcard_waiting", jget("postcard_waiting").filter(function (x) { return x && x.id !== got.id; }), 40);
    if (!mineSent(got.id)) remember("postcard_box", { id: got.id, from: got.from, scene: got.scene, open_at: got.open_at, to: got.to || "", place: got.place || "", stamp: got.stamp, ink: got.ink, msg: got.msg || "", sent: got.sent });
    opened();
  }
  function opened() {
    var c = got; $("#rFlip").hidden = false; $("#rNote").textContent = ""; $("#rSub").textContent = mineSent(c.id) ? "" : t("kept");
    var acts = $("#rActs"); acts.innerHTML = "";
    if (!mineSent(c.id)) addAct("✍️ " + t("reply"), "./?to=" + encodeURIComponent(c.from) + "&scene=" + encodeURIComponent(c.scene), "btn pri");
    addAct("🖨 " + t("printKeep"), null, "btn sm", function () { printSheet({ id: c.id, scene: c.scene, stamp: c.stamp, ink: c.ink, place: c.place || "", msg: c.msg || "", to: c.to || "", from: c.from, sent: c.sent, open_at: c.open_at, wall: c.wall }); });
    addAct("✉️ " + t("own"), "./");
  }
  var ac = null;
  function swish() { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); var len = ac.sampleRate * .3, b = ac.createBuffer(1, len, ac.sampleRate), dd = b.getChannelData(0); for (var i = 0; i < len; i++) dd[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * i / len) * .12; var s = ac.createBufferSource(), f = ac.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 1600; s.buffer = b; s.connect(f); f.connect(ac.destination); s.start(); } catch (e) {} }

  /* ---------- my postcards: what you sent and what came to you, on this device, never counted ---------- */
  var tab = "sent";
  function due() { var n = new Date(); return jget("postcard_waiting").filter(function (x) { return x && new Date(x.open_at) <= n; }); }
  function paintDot() { $("#mineDot").hidden = !due().length; }
  function mine() {
    var sent = jget("postcard_sent"), recv = jget("postcard_waiting").concat(jget("postcard_box")), now = new Date();
    var seen = {}; recv = recv.filter(function (x) { if (!x || seen[x.id]) return false; seen[x.id] = 1; return true; });
    recv.sort(function (a, b) { return new Date(b.open_at) - new Date(a.open_at); });
    function row(x, kind) {
      var o = new Date(x.open_at), sealed = o > now, opened = kind === "got" && jget("postcard_box").some(function (b) { return b.id === x.id; });
      var who = kind === "sent" ? (x.wall ? t("wallW") : x.to ? t("toW", { n: x.to }) : t("toPh")) : t("fromW", { n: x.from || t("someone") });
      var st = sealed ? t("opensOn", { d: fmt(o, true) }) : kind === "got" && !opened ? t("canOpen") : kind === "got" ? t("openedW") : fmt(new Date(x.sent || x.open_at), true);
      var href = x.wall ? "/nearby/next-door/#wall-cards" : "./?c=" + encodeURIComponent(x.id);
      return '<li class="it" data-id="' + esc(x.id) + '" data-kind="' + kind + '"><canvas data-scene="' + esc(x.scene || "hutong") + '" data-seed="' + esc(x.id) + '"></canvas><div><a href="' + esc(href) + '">' + esc(who) + '</a><span class="s' + (kind === "got" && !sealed && !opened ? " r" : "") + '">' + esc(st) + '</span></div><div class="ops">' +
        (kind === "sent" && !x.wall ? '<button class="ib mini" type="button" data-cp aria-label="' + esc(t("copy")) + '" title="' + esc(t("copy")) + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg></button>' : "") +
        (sealed ? '<button class="ib mini" type="button" data-cal aria-label="' + esc(t("remind")) + '" title="' + esc(t("remind")) + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg></button>' : "") +
        (kind === "sent" && x.msg ? '<button class="ib mini" type="button" data-pr aria-label="' + esc(t("printIt")) + '" title="' + esc(t("printIt")) + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 9V3h10v6M7 17H4v-7h16v7h-3"/><rect x="7" y="14" width="10" height="7"/></svg></button>' : "") +
        '<button class="ib mini" type="button" data-rm aria-label="' + esc(t("remove")) + '" title="' + esc(t("remove")) + '">✕</button></div></li>';
    }
    var list = tab === "sent" ? sent : recv;
    var s = sheet("<h3>" + esc(t("mine")) + '</h3><div class="tabs"><div class="seg" role="group"><button type="button" data-tab="sent" aria-pressed="' + (tab === "sent") + '">' + esc(t("sent")) + '</button><button type="button" data-tab="got" aria-pressed="' + (tab === "got") + '">' + esc(t("got")) + "</button></div></div>" +
      (list.length ? '<ul class="list">' + list.map(function (x) { return row(x, tab); }).join("") + "</ul>" : '<p class="sub">' + esc(t(tab === "sent" ? "noneSent" : "noneGot")) + "</p>") +
      '<p class="small" style="margin:12px 0 0">' + esc(t("onDevice")) + "</p>" + keysBlock(), "", mine);
    $$("canvas[data-scene]", s).forEach(function (cv) { P.draw(cv, cv.dataset.scene, cv.dataset.seed); });
    $$("[data-tab]", s).forEach(function (b) { b.onclick = function () { tab = b.dataset.tab; close(); mine(); }; });
    $(".list", s) && ($(".list", s).onclick = function (e) {
      var li = e.target.closest(".it"); if (!li) return; var id = li.dataset.id, kind = li.dataset.kind;
      var x = (kind === "sent" ? sent : recv).filter(function (y) { return y.id === id; })[0]; if (!x) return;
      if (e.target.closest("[data-cp]")) copyText(link(id), null);
      else if (e.target.closest("[data-cal]")) ics(x, kind === "sent" ? "sender" : "recv");
      else if (e.target.closest("[data-pr]")) printSheet(x);
      else if (e.target.closest("[data-rm]")) {
        if (kind === "sent") jset("postcard_sent", jget("postcard_sent").filter(function (y) { return y.id !== id; }));
        else { jset("postcard_waiting", jget("postcard_waiting").filter(function (y) { return y.id !== id; }), 40); jset("postcard_box", jget("postcard_box").filter(function (y) { return y.id !== id; })); }
        li.remove(); paintDot();
      }
    });
    bindKeys(s);
  }
  function keysBlock() {
    return '<div class="sec"><h4>🗝️ ' + esc(t("keysH")) + '</h4><p class="small" style="margin:0 0 10px">' + esc(t("keysP")) + '</p><div class="acts" style="justify-content:flex-start"><button class="btn sm" type="button" id="kc">' + esc(t("copyLink")) + '</button><button class="btn sm" type="button" id="kq">' + esc(t("showQr")) + '</button></div><div id="qrb"></div><p class="small" style="margin:10px 0 0">' + esc(t("keysWarn")) + "</p>" +
      '<details><summary>' + esc(t("haveKey")) + '</summary><div class="ir"><input id="pk" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="' + esc(t("keyPh")) + '"><button class="btn sm" type="button" id="pkb">' + esc(t("open")) + "</button></div></details>" +
      '<button class="quiet" type="button" id="kf" style="margin-top:10px">' + esc(t("fetchMine")) + "</button></div>";
  }
  function bindKeys(s) {
    $("#kc", s).onclick = function () { copyText(keyLink(), this); };
    $("#kq", s).onclick = function () { var box = $("#qrb", s); qr(keyLink(), function (svg) { box.innerHTML = svg ? '<div class="qr">' + svg + "</div>" : ""; }); };
    $("#pkb", s).onclick = function () { var inp = $("#pk", s); if (keyImport(inp.value)) { toast("🗝️ " + t("keyHere")); bringBack(true); } else toast(t("badKey")); };
    $("#kf", s).onclick = function () { bringBack(true); };
  }
  function bringBack(reopen) {   /* the cards this key sent, back onto this device's list (from the server, under this key's fingerprint) */
    var k = key(false); if (!k) { toast(t("fetchNone")); return; }
    api("postcard_mine", { p_secret: k }).then(function (rows) {
      rows = rows || []; if (!rows.length) { toast(t("fetchNone")); return; }
      var l = jget("postcard_sent"), have = {}; l.forEach(function (x) { if (x) have[x.id] = x; });
      rows.forEach(function (c) { if (have[c.id]) return; l.push({ id: c.id, to: c.to || "", wall: !!c.wall, open_at: c.open_at, scene: c.scene, stamp: c.stamp, ink: c.ink, place: c.place || "", msg: c.msg || "", from: c.from, sent: c.sent }); });
      l.sort(function (a, b) { return new Date(b.sent || b.open_at) - new Date(a.sent || a.open_at); }); jset("postcard_sent", l);
      toast(t("fetched")); if (reopen && $(".scrim")) { close(); tab = "sent"; mine(); }
    }).catch(function (e) { toast(friendly(e)); });
  }

  /* ---------- the welcome: three steps ---------- */
  var WS = [
    '<svg viewBox="0 0 56 56" aria-hidden="true"><rect width="56" height="56" rx="14" fill="#f3d9cf"/><rect x="9" y="15" width="38" height="27" rx="2" fill="#fcf8ef" stroke="#1d2436" stroke-width="1.6"/><path d="M28 18v21" stroke="#cbbfa6" stroke-width="1.4"/><path d="M12 22h12M12 27h10M12 32h11" stroke="#26467f" stroke-width="1.6" stroke-linecap="round"/><rect x="36" y="18" width="8" height="9" fill="#c23b26"/></svg>',
    '<svg viewBox="0 0 56 56" aria-hidden="true"><rect width="56" height="56" rx="14" fill="#e9dcc0"/><rect x="9" y="15" width="38" height="27" rx="2" fill="#ead9b8" stroke="#1d2436" stroke-width="1.6"/><path d="m10 16 18 13 18-13" fill="none" stroke="#1d2436" stroke-width="1.6"/><circle cx="28" cy="33" r="6.5" fill="#a8261a"/><path d="M28 36.4s-3.4-2-3.4-4.2a1.8 1.8 0 0 1 3.4-.9 1.8 1.8 0 0 1 3.4.9c0 2.2-3.4 4.2-3.4 4.2z" fill="#e07a6a"/></svg>',
    '<svg viewBox="0 0 56 56" aria-hidden="true"><rect width="56" height="56" rx="14" fill="#dfe6d3"/><rect x="20" y="20" width="16" height="26" rx="3" fill="#26467f"/><rect x="16" y="14" width="24" height="9" rx="4.5" fill="#26467f"/><rect x="22" y="24" width="12" height="2.5" fill="#fcf8ef"/><path d="M25 10 31 4M31 4h-5M31 4v5" stroke="#c23b26" stroke-width="2" fill="none" stroke-linecap="round"/></svg>'
  ];
  function welcome() {
    lsSet("sh_app_seen", "1");
    var s = sheet("<h3>" + esc(t("w_h")) + '</h3><ol class="ws">' + [1, 2, 3].map(function (i) { return "<li>" + WS[i - 1] + "<div><b>" + esc(t("w_" + i + "h")) + "</b><span>" + esc(t("w_" + i)) + "</span></div></li>"; }).join("") +
      '</ol><div class="stack"><button class="btn pri" type="button" data-go>' + esc(t("w_go")) + "</button></div>", "", welcome);
    $("[data-go]", s).onclick = function () { close(); if (!reading) setTimeout(function () { $("#thumbs").scrollIntoView({ behavior: "smooth", block: "center" }); }, 80); else location.href = "./"; };
  }

  /* ---------- words on the page ---------- */
  function paintWords() {
    document.documentElement.lang = lang(); document.title = t("docTitle");
    $$("[data-i]").forEach(function (e) { if (STR[e.dataset.i]) e.textContent = t(e.dataset.i); });
    $$("[data-ia]").forEach(function (e) { e.setAttribute("aria-label", t(e.dataset.ia)); e.title = t(e.dataset.ia); });
    $$("[data-ip]").forEach(function (e) { e.placeholder = t(e.dataset.ip); });
    var tg = t("tag"), dot = tg.search(/[.。]/);
    $("#tagH").innerHTML = dot > 0 && lang().indexOf("zh") !== 0 ? esc(tg.slice(0, dot + 1)) + " <em>" + esc(tg.slice(dot + 1).trim()) + "</em>" : esc(tg);
    $("#langL").textContent = SHORT[LANGS.indexOf(lang())];
    $("#mineB").setAttribute("aria-label", t("mine"));
    $("#ahA").href = "https://www.wei-meng.org/after-hours/?fbl=" + lang();
    var fx = $("#foot"); if (window.FBC && FBC.foot && !fx.querySelector(".fbf-row")) FBC.foot(fx, { extra: fx.innerHTML });   // the suite's one footer; Nearby and After hours on the line under it
    paintDue();
    if (!reading) { paintFace("", card); paintChoices(); paintWhen(); left(); } else if (got) paintRead();
  }
  function paintDue() {
    var l = reading ? [] : due(), box = $("#due");
    if (!l.length) { box.hidden = true; paintDot(); return; }
    var c = l[0]; box.hidden = false;
    box.innerHTML = "<span>📮 " + esc(t("dueNote", { n: c.from || t("someone") })) + '</span><a class="btn sm pri" href="./?c=' + encodeURIComponent(c.id) + '">' + esc(t("openIt")) + "</a>";
    paintDot();
  }
  function setLang(l) { if (window.FBL && FBL.set) FBL.set(l); else lsSet("wm_preferred_lang", l); paintWords(); var s = $(".scrim"); if (s && s._redo) { var r = s._redo; close(); r(); } }
  addEventListener("fbl:lang", paintWords);
  function closeLang() { var m = $(".langm"); if (m) m.remove(); $("#langB").setAttribute("aria-expanded", "false"); }
  $("#langB").onclick = function (e) {
    e.stopPropagation(); if ($(".langm")) return closeLang();
    var m = document.createElement("div"); m.className = "langm"; m.setAttribute("role", "menu");
    m.innerHTML = LANGS.map(function (l, i) { return '<button type="button" role="menuitem" data-l="' + l + '" aria-current="' + (l === lang()) + '" lang="' + l + '">' + NAMES[i] + "</button>"; }).join("");
    this.parentNode.appendChild(m); this.setAttribute("aria-expanded", "true"); m.querySelector("[aria-current=true]").focus();
    m.onclick = function (ev) { var b = ev.target.closest("[data-l]"); if (b) { closeLang(); setLang(b.dataset.l); } };
  };
  document.addEventListener("click", function (e) { if (!e.target.closest(".langm,#langB")) closeLang(); });
  $("#howB").onclick = welcome; $("#mineB").onclick = function () { tab = due().length ? "got" : tab; mine(); };

  /* arriving with a keychain link: the keys go on this device, and what this key sent comes back to the list */
  var keysIn = false;
  (function arriving() {
    var m = /[#&](keys=k1\.[A-Za-z0-9_-]+|key=[A-Za-z0-9_-]{32,128})/.exec(location.hash); if (!m) return;
    try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
    if (keyImport(m[1].replace(/^keys?=/, ""))) { keysIn = true; setTimeout(function () { toast("🗝️ " + t("keyHere"), 5000); bringBack(false); }, 700); }
  })();

  if (reading) buildRead(); else buildWrite();
  paintWords();
  if (!lsGet("sh_app_seen") && !reading && !keysIn) setTimeout(welcome, 500);
  window.SH = { card: card, send: send, ics: ics, printSheet: printSheet, mine: mine, keyLink: keyLink, keyImport: keyImport };   /* test hook */
})();
</script>
