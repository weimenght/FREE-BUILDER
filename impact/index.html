const f = (s, v) => String(s).replace(/\{(\w+)\}/g, (m, k) => (k in v ? v[k] : m));

/* ---------- charts (hand-built SVG, hover + focus tooltips, table view below each) ---------- */
function tipFor(box) {
  const tip = document.createElement("div"); tip.className = "tip"; box.appendChild(tip);
  const show = (el, html) => { const r = el.getBoundingClientRect(), b = box.getBoundingClientRect(); tip.innerHTML = html; tip.style.left = Math.min(b.width - 60, Math.max(60, r.left - b.left + r.width / 2)) + "px"; tip.style.top = (r.top - b.top) + "px"; tip.classList.add("on"); };
  const hide = () => tip.classList.remove("on");
  box.querySelectorAll(".hit").forEach(h => { const html = h.dataset.tip; h.addEventListener("mouseenter", () => show(h, html)); h.addEventListener("focus", () => show(h, html)); h.addEventListener("mouseleave", hide); h.addEventListener("blur", hide); h.addEventListener("click", () => show(h, html)); });
}

function heardChart(W) {
  const x = t(), H = 230, L = 34, R = 8, Tp = 10, B = 26, n = DATA.weeks, cw = (W - L - R) / n, bw = Math.min(24, cw * .55), ph = H - Tp - B;
  const keys = [["yes", "var(--c-yes)"], ["partly", "var(--c-partly)"], ["not", "var(--c-not)"]];
  let g = "";
  [0, 25, 50, 75, 100].forEach(v => { const y = Tp + ph * (1 - v / 100); g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="var(--grid)"/><text x="${L - 6}" y="${y + 4}" text-anchor="end">${v}%</text>`; });
  for (let i = 0; i < n; i++) {
    const cx = L + cw * i + cw / 2; let acc = 0;
    keys.forEach(([k, c], j) => {
      const v = DATA.heard[k][i], h = ph * v / 100, y = Tp + ph * (1 - (acc + v) / 100);
      const gap = j > 0 ? 2 : 0;
      g += j === keys.length - 1 ? `<path d="M${cx - bw / 2},${y + h - gap} V${y + 4} Q${cx - bw / 2},${y} ${cx - bw / 2 + 4},${y} H${cx + bw / 2 - 4} Q${cx + bw / 2},${y} ${cx + bw / 2},${y + 4} V${y + h - gap} Z" fill="${c}"/>` : `<rect x="${cx - bw / 2}" y="${y}" width="${bw}" height="${Math.max(0, h - gap)}" fill="${c}"/>`;
      acc += v;
    });
    g += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${esc(f(x.wk, { n: i + 1 }))}</text>`;
    g += `<rect class="hit" role="img" tabindex="0" x="${cx - cw / 2}" y="${Tp}" width="${cw}" height="${ph}" aria-label="${esc(f(x.wk, { n: i + 1 }) + ": " + x.yes + " " + DATA.heard.yes[i] + "%, " + x.partly + " " + DATA.heard.partly[i] + "%, " + x.not + " " + DATA.heard.not[i] + "%")}" data-tip="${esc(`<b>${f(x.wk, { n: i + 1 })}</b><br>${x.yes} ${DATA.heard.yes[i]}% · ${x.partly} ${DATA.heard.partly[i]}% · ${x.not} ${DATA.heard.not[i]}%`)}"/>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="group" aria-label="${esc(x.heardT)}">${g}</svg>`;
}

function lineChart(W) {
  const x = t(), H = 230, L = 34, R = 40, Tp = 14, B = 26, d = DATA.teachCum, n = d.length, max = 160, ph = H - Tp - B;
  const px = i => L + (W - L - R) * i / (n - 1), py = v => Tp + ph * (1 - v / max);
  let g = "";
  [0, 40, 80, 120, 160].forEach(v => { g += `<line x1="${L}" x2="${W - R}" y1="${py(v)}" y2="${py(v)}" stroke="var(--grid)"/><text x="${L - 6}" y="${py(v) + 4}" text-anchor="end">${v}</text>`; });
  g += `<path d="M${px(0)},${py(0) - 0} ${d.map((v, i) => `L${px(i)},${py(v)}`).join(" ")} L${px(n - 1)},${py(0)} Z" fill="var(--ink)" opacity=".06"/>`;
  g += `<path d="${d.map((v, i) => `${i ? "L" : "M"}${px(i)},${py(v)}`).join(" ")}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  d.forEach((v, i) => { g += `<text x="${px(i)}" y="${H - 8}" text-anchor="middle">${esc(f(x.wk, { n: i + 1 }))}</text>`; });
  g += `<circle cx="${px(n - 1)}" cy="${py(d[n - 1])}" r="5" fill="var(--accent)" stroke="var(--white)" stroke-width="2"/><text class="lab" x="${px(n - 1) + 8}" y="${py(d[n - 1]) + 4}">${d[n - 1]}</text>`;
  d.forEach((v, i) => { const cw = (W - L - R) / (n - 1); g += `<rect class="hit" role="img" tabindex="0" x="${px(i) - cw / 2}" y="${Tp}" width="${cw}" height="${ph}" aria-label="${esc(f(x.wk, { n: i + 1 }) + ": " + v)}" data-tip="${esc(`<b>${f(x.wk, { n: i + 1 })}</b><br>${v} ${x.total}`)}"/>`; });
  return `<svg viewBox="0 0 ${W} ${H}" role="group" aria-label="${esc(x.teachT)}">${g}</svg>`;
}

function hbar(W, rows, max, unit, title) {
  const rowH = 46, Tp = 2, H = rows.length * rowH + Tp, bw = 12, valW = 44, chartW = W - valW;
  let g = "";
  rows.forEach(([name, v], i) => {
    const y = Tp + i * rowH, len = Math.max(4, chartW * v / max), by = y + 22;
    g += `<text class="lab" x="0" y="${y + 14}">${esc(name)}</text>`;
    g += `<rect x="0" y="${by}" width="${chartW}" height="${bw}" rx="4" fill="var(--grid)"/>`;
    g += `<path d="M0,${by} H${len - 4} Q${len},${by} ${len},${by + 4} V${by + bw - 4} Q${len},${by + bw} ${len - 4},${by + bw} H0 Z" fill="var(--ink)"/>`;
    g += `<text class="lab" x="${chartW + 8}" y="${by + bw - 1}">${v}${unit}</text>`;
    g += `<rect class="hit" role="img" tabindex="0" x="0" y="${y}" width="${W}" height="${rowH}" aria-label="${esc(name + ": " + v + unit)}" data-tip="${esc(`<b>${name}</b><br>${v}${unit}`)}"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="group" aria-label="${esc(title)}">${g}</svg>`;
}

function panel(id, title, sub, legend, table) {
  return `<div class="panel"><span class="kicker">${esc(t().kicker.split("·")[0].trim())}</span><h2>${esc(title)}</h2><p class="sub">${esc(sub)}</p>${legend || ""}<div class="chart" id="${id}"></div>
    <details><summary>${esc(t().table)}</summary>${table}</details></div>`;
}

function drawCharts() {
  const x = t();
  const put = (id, fn) => { const box = document.getElementById(id); if (!box) return; const W = Math.max(260, Math.round(box.clientWidth)); box.innerHTML = fn(W); tipFor(box); };
  put("c-heard", heardChart);
  put("c-teach", lineChart);
  put("c-by", W => hbar(W, DATA.byPractice.map(([k, v]) => [x.P[k], v]), 45, "", x.byT));
  put("c-did", W => hbar(W, DATA.did.map(([k, v]) => [x.D[k], v]), 100, "%", x.didT));
}

        `<table><thead><tr><th>${esc(x.colWeek)}</th><th class="num">${esc(x.yes)}</th><th class="num">${esc(x.partly)}</th><th class="num">${esc(x.not)}</th></tr></thead><tbody>${D.heard.yes.map((v, i) => `<tr><td>${esc(wk(i))}</td><td class="num">${v}%</td><td class="num">${D.heard.partly[i]}%</td><td class="num">${D.heard.not[i]}%</td></tr>`).join("")}</tbody></table>`)}
      ${panel("c-teach", x.teachT, x.teachS, "",
        `<table><thead><tr><th>${esc(x.colWeek)}</th><th class="num">${esc(x.colN)}</th></tr></thead><tbody>${D.teachCum.map((v, i) => `<tr><td>${esc(wk(i))}</td><td class="num">${v}</td></tr>`).join("")}</tbody></table>`)}
      ${panel("c-by", x.byT, x.byS, "",
        `<table><thead><tr><th>${esc(x.colPractice)}</th><th class="num">${esc(x.colN)}</th></tr></thead><tbody>${D.byPractice.map(([k, v]) => `<tr><td>${esc(x.P[k])}</td><td class="num">${v}</td></tr>`).join("")}</tbody></table>`)}
      ${panel("c-did", x.didT, f(x.didS, { r: D.replied }), "",
        `<table><thead><tr><th>${esc(x.colAct)}</th><th class="num">${esc(x.colPct)}</th></tr></thead><tbody>${D.did.map(([k, v]) => `<tr><td>${esc(x.D[k])}</td><td class="num">${v}%</td></tr>`).join("")}</tbody></table>`)}
    </div>
    <section><span class="kicker">${esc(x.quotesT)}</span><div class="quotes" style="margin-top:12px">${x.quotes.map(q => `<div class="quote">“${esc(q[0])}”<small>${esc(q[1])}</small></div>`).join("")}</div>
      <p style="font-size:12.5px;color:var(--muted);margin:10px 0 0">${esc(x.quotesNote)}</p></section>
    <section class="grid2">
      <div class="panel"><h2 class="h2s" style="font-size:22px">${esc(x.levelsT)}</h2><div class="levels">${x.levels.map(l => `<div class="level"><b>${esc(l[0])}</b><span>${esc(f(l[1], { v: D.l4 }))}</span></div>`).join("")}</div></div>
      <div class="panel dark"><span class="kicker">${esc(x.notT)}</span><ul>${x.notList.map(n => `<li>${esc(n)}</li>`).join("")}</ul></div>
    </section>
    <section><h2 class="h2s">${esc(x.ctaT)}</h2><div class="cta"><a class="pri" href="/#contact">${esc(x.cta1)} ↗</a><a href="/diagnose">${esc(x.cta2)} ↗</a></div></section>`;
  drawCharts();
  try { localStorage.setItem("wm_preferred_lang", lang); localStorage.setItem("wm_cases_lang", lang); } catch (e) {}
}
document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => { lang = b.dataset.lang; render(); }));
window.FBL_SET = l => { lang = l; render(); }; window.FBL_GET = () => lang;
let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(drawCharts, 120); });
let saved = null; try { saved = localStorage.getItem("wm_preferred_lang") || localStorage.getItem("wm_cases_lang"); } catch (e) {}
const nav = (navigator.language || "").toLowerCase();
lang = ["en", "zh", "zh-Hant", "es", "ca"].includes(saved) ? saved : nav.startsWith("zh") ? "zh" : nav.startsWith("es") ? "es" : "en";
render();
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("/sw.js", { scope: "/" }).catch(() => {});
})();
</script>
</body>
</html>
