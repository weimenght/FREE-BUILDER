function tierMax(n) { return n >= 100 ? 3 : n >= 50 ? 2 : 1; }
function pool() { var m = tierMax(S.size); return THINGS.filter(function (t) { return t.t <= m; }); }
function doneIds() { var o = {}; S.done.forEach(function (d) { o[d.id] = 1; }); return o; }
function isFull() { var d = doneIds(); return S.size > 0 && pool().every(function (t) { return d[t.id]; }); }
function draw(except) {
  var d = doneIds(), today = day(), all = pool().filter(function (t) { return !d[t.id] && t.id !== except; });
  var a = all.filter(function (t) { return S.later[t.id] !== today; }); if (!a.length) a = all; if (!a.length) return null;
  var lo = Math.min.apply(null, a.map(function (t) { return t.t; })), low = a.filter(function (t) { return t.t === lo; });
  return (Math.random() < .75 ? pick(low) : pick(a)).id;
}
