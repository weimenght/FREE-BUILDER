  copyQ: ["*pats her apron pocket* Phone gets lost, papers get lost? No good. I can keep a copy in Nearby's safe box. Only your key opens it. You want?", "*拍拍围裙口袋* 手机丢了，纸条也丢了？不好。我可以在近邻的保险箱里放一份。只有你的钥匙能开。你要吗？", "*拍拍個圍裙袋* 部電話唔見咗，啲紙仔咪冇埋？唔得㗎。我可以喺近鄰個夾萬度留返一份，淨係你條鎖匙先開到。你要唔要呀？", "*se toca el bolsillo del delantal* ¿Móvil se pierde, papeles se pierden? No bueno. Puedo guardar copia en la caja fuerte de Cerca. Solo tu llave abre. ¿Quieres?", "*es toca la butxaca del davantal* Si perds el mòbil, perds els papers? Això no pot ser. En puc guardar una còpia a la caixa forta d'A Prop, i només la teva clau l'obre. La vols?"],

  keyBad: ["*squints* This is not a key. This is… a noodle?", "*眯起眼* 这不是钥匙。这是……面条？", "*瞇埋對眼* 呢條唔係鎖匙嚟㗎，係……麵嚟？", "*entorna los ojos* Esto no es llave. Esto es… ¿un fideo?", "*arruga els ulls* Això no és una clau. És… un fideu?"],

    ["See? Not so hard. *the jar goes clink*", "看？没那么难。*罐子叮的一声*", "睇？都唔係咁難啫。*個樽叮一聲*", "¿Ves? No tan difícil. *el tarro hace clinc*", "Ho veus? No era tan difícil. *el pot fa clinc*"]],
