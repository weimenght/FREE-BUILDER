<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="referrer" content="same-origin" data-fbr><script data-fbl data-mode="game" src="/fbkit/fb.js?v=810cd8f633"></script><meta name="referrer" content="same-origin">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nearby Station</title>
<meta name="description" content="A window seat on a slow train: change the record, have a drink from the trolley, get off at any stop, walk the platform and catch another train. Some stops lead into Nearby.">
<meta name="theme-color" content="#120f14">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Nearby Station">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  html, body { margin:0; height:100%; background:#120f14; overflow:hidden; overscroll-behavior:none; }
  iframe { position:fixed; inset:0; width:100%; height:100%; border:0; display:block; background:#120f14; }
  noscript p { color:#f5e6c8; font:16px/1.5 Georgia, serif; text-align:center; padding:40vh 24px 0; margin:0; }
</style>
</head>
<body>
<!-- Nearby Station on its own: the same train as in town (/nearby/station/), here with what a long ride has
     (journey.js: records, the trolley, getting off, the platform, another train, paths into Nearby). -->
<iframe id="ride" title="Nearby Station" allow="autoplay; fullscreen; screen-wake-lock; clipboard-write; web-share"></iframe>
<noscript><p>The train needs JavaScript to run.</p></noscript>
<script>
(function () {
  var NAME = { en: "Nearby Station", zh: "近邻站", "zh-Hant": "近鄰站", es: "Estación Cerca", ca: "Estació A Prop" };
  var qs = new URLSearchParams(location.search), lang = qs.get("fbl");
  try { if (lang && NAME[lang]) localStorage.setItem("wm_preferred_lang", lang); lang = lang || localStorage.getItem("wm_preferred_lang"); } catch (e) {}
  if (!NAME[lang]) { var n = (navigator.language || "en").toLowerCase(); lang = /^zh-(tw|hk|mo|hant)/.test(n) ? "zh-Hant" : /^zh/.test(n) ? "zh" : /^ca/.test(n) ? "ca" : /^es/.test(n) ? "es" : "en"; }
  document.documentElement.lang = lang === "zh" ? "zh-Hans" : lang; document.title = NAME[lang];
  /* the train itself; a friend's link (?with=CODE) seats you in their car */
  var src = "/nearby/station/?solo=1&app=1", w = (qs.get("with") || qs.get("cabin") || "").toUpperCase().replace(/[^A-Z]/g, "").slice(0, 4);
  if (w) src += "&with=" + w;
  var f = document.getElementById("ride"); f.src = src;
  f.addEventListener("load", function () { try { f.contentWindow.focus(); } catch (e) {} });
  /* the screen stays on while you ride, and lets go when you leave */
  var lock = null;
  function wake() { if (document.visibilityState !== "visible" || lock || !("wakeLock" in navigator)) return; navigator.wakeLock.request("screen").then(function (l) { lock = l; l.addEventListener("release", function () { lock = null; }); }, function () {}); }
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") wake(); });
  addEventListener("pointerdown", wake, { once: true }); f.addEventListener("load", function () { try { f.contentWindow.addEventListener("pointerdown", wake); } catch (e) {} wake(); });
})();
</script>
</body>
</html>
