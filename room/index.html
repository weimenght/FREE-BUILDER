const T = () => I18N[lang];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (s, v = {}) => String(s).replace(/\{(\w+)\}/g, (m, k) => (k in v ? esc(v[k]) : m));
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

      <div class="spacer"></div>
      <div class="btns"><button class="btn" data-act="host">▣ ${esc(t.host)}</button></div>
      ${!isLiveCfg() ? `<p style="margin:0;font-size:12.5px;color:var(--muted)">${esc(t.previewNote)}</p>` : ""}
    </section>`;
  } else if (S.role === "host") h = hostHTML();
  else h = guestHTML();
  const hadFocus = stage.contains(document.activeElement), focusId = hadFocus && document.activeElement.id;
  stage.innerHTML = h;
  paintNet();
  if (focusId && $(focusId)) { const el = $(focusId); el.focus({ preventScroll: true }); if (el.value != null && el.setSelectionRange) try { el.setSelectionRange(el.value.length, el.value.length); } catch (_) {} }
  else { const f = stage.querySelector("[data-focus]"); if (f && hadFocus) f.focus({ preventScroll: true }); }
}

function hostHTML() {
  const t = T();
  let body = "";
  switch (H.phase) {
  case "lobby":
    body = `<div class="card" style="display:grid;gap:12px">
        <span class="kicker">${esc(t.promptLbl)}</span>
        <div class="seg" role="group" style="flex-direction:column;align-items:stretch">${t.prompts.map((p, i) => `<button type="button" data-prompt="${i}" aria-pressed="${H.prompt === p}" style="text-align:left;border-radius:14px;padding:12px 14px;font-size:15px">${esc(p)}</button>`).join("")}</div>
        <label class="field"><input id="promptIn" maxlength="140" autocomplete="off" placeholder="${esc(t.promptPh)}" value="${esc(t.prompts.includes(H.prompt) ? "" : H.prompt)}"></label>
      </div>
      <div class="btns"><button class="btn pri" data-act="collect" ${H.prompt.trim() ? "" : "disabled"} id="collectBtn">${esc(t.startCollect)} →</button></div>`; break;
  case "collect":
    body = `<h2 style="font-size:clamp(26px,4vw,40px)">${esc(H.prompt)}</h2>
      <span class="kicker" style="color:var(--accent-ink)">${esc(fmt(t.answersN, { n: H.answers.length }))}</span>
      ${H.answers.length ? `<div class="board">${H.answers.map(a => `<div class="acard">${esc(a.text)}</div>`).join("")}</div>` : `<p style="color:var(--muted)">${esc(t.noAnswers)}</p>`}
      <div class="btns"><button class="btn pri" data-act="cluster" ${H.answers.length ? "" : "disabled"}>${esc(t.toCluster)} →</button></div>`; break;
  case "cluster": {
    const un = H.answers.filter(a => !a.theme);
    body = `<div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-end;flex-wrap:wrap"><div><h2 style="font-size:clamp(22px,3vw,30px)">${esc(H.prompt)}</h2><p style="margin:6px 0 0;color:var(--muted);font-size:14px">${esc(t.clusterLead)}</p></div><button class="btn" data-act="auto" style="flex:none">✦ ${esc(t.auto)}</button></div>
      ${un.length ? `<div><span class="kicker">${esc(t.unsorted)}</span><div class="board" style="margin-top:8px">${un.map(a => `<button class="acard" data-aid="${esc(a.aid)}">${esc(a.text)}</button>`).join("")}</div></div>` : ""}
      <div class="themes">${H.themes.map((th, i) => `<div class="theme" style="--c:${th.c}">
          <input data-theme="${th.id}" maxlength="40" placeholder="${esc(fmt(t.themePh, { n: i + 1 }))}" value="${esc(th.name)}">
          ${H.answers.filter(a => a.theme === th.id).map(a => `<button class="acard" data-aid="${esc(a.aid)}" style="--c:${th.c}">${esc(a.text)}</button>`).join("")}
        </div>`).join("")}</div>
      <div class="btns"><button class="btn pri" data-act="pair">${esc(t.toPairs)} →</button></div>`; break; }
  case "pair": {
    const groups = {}; Object.entries(H.pairs).forEach(([pid, n]) => { (groups[n] = groups[n] || []).push(pid); });
    const nPairs = Object.keys(groups).length;
    body = `<div style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap">
        <div><span class="kicker">${esc(t.talkQ)}</span><h2 style="font-size:clamp(22px,3vw,32px);margin-top:6px">${esc(t.pairQ)}</h2></div>
        <div style="text-align:right"><div class="bigclock" id="hclock">${fmtClock(H.endsAt - Date.now())}</div>
          <div class="seg" style="justify-content:flex-end;margin-top:8px">${[3, 5, 8].map(m => `<button type="button" data-talk="${m}" aria-pressed="${H.talk === m}">${m} ${esc(t.minutes)}</button>`).join("")}</div></div>
      </div>
      <span class="kicker">${esc(fmt(t.pairsN, { n: nPairs }))}</span>
      <div class="pairs">${Object.keys(groups).map(n => { const th = themeOf(H.pairTheme[n]); const c = COLORS[(n - 1) % COLORS.length]; return `<div style="--c:${c}"><b>${n}</b><span>${esc(th ? (th.name || fmt(t.themePh, { n: H.themes.indexOf(th) + 1 })) : "—")}${groups[n].length > 2 ? " · 3" : ""}</span></div>`; }).join("")}</div>
      <div class="btns"><button class="btn pri" data-act="share">${esc(t.toShare)} →</button></div>`; break; }
  case "share": case "close": {
    const nPairs = new Set(Object.values(H.pairs)).size, got = Object.keys(H.shares).length;
    const closing = H.phase === "close";
    body = `<span class="kicker" style="color:var(--accent-ink)">${closing ? esc(t.closeTitle) : esc(fmt(t.sharesN, { n: got, m: nPairs }))}</span>
      <h2 style="font-size:clamp(24px,3.4vw,36px)">${esc(closing ? t.closeLead : H.prompt)}</h2>
      <div class="shares">${Object.entries(H.shares).sort((a, b) => a[0] - b[0]).map(([n, s]) => `<div style="--c:${COLORS[(n - 1) % COLORS.length]}"><b>${n}</b><span>${esc(s)}</span></div>`).join("")}</div>
      ${closing ? `<div class="monday"><b>${esc(t.monday)}</b>${esc(t.mondayTxt)}</div>` : ""}
      <div class="btns">${closing ? `<button class="btn" data-act="copySum">⧉ ${esc(t.copyAll)}</button><button class="btn" data-act="newSession">↻ ${esc(t.newSession)}</button>` : `<button class="btn pri" data-act="close">${esc(t.toClose)} →</button>`}</div>`; break; }
  }
  return `<section class="screen">${hostHead()}${body}</section>`;
}

function guestHTML() {
  const t = T();
  if (G.lost) return `<section class="screen"><h2>${esc(t.lostTitle)}</h2><p class="lead">${esc(t.lostLead)}</p><div class="spacer"></div><div class="btns"><button class="btn pri" data-act="leave">← ${esc(t.joinGo)}</button></div></section>`;
  const head = `<div style="display:flex;justify-content:space-between;align-items:center"><span class="kicker">${esc(fmt(t.waitCode, { c: S.code }))}</span><span id="net" class="net"></span></div>`;
  let b = "";
  switch (G.phase) {
  case "lobby": b = `<h2>${esc(t.waitTitle)}</h2><p class="lead">${esc(t.waitLead)}</p>${roomArt()}`; break;
  case "collect":
    b = `<span class="kicker">${esc(t.ansTitle)}</span><div class="prompt" style="min-height:0"><div class="q" style="font-size:clamp(20px,5.4vw,25px)">${esc(G.prompt)}</div></div>
      ${G.sent >= 3 ? `<p class="lead">${esc(t.maxed)}</p>` : `<label class="field"><textarea id="ansIn" maxlength="200" placeholder="${esc(t.ansPh)}">${esc(G.draft)}</textarea></label>
      ${G.sent ? `<p style="margin:0;font-size:13.5px;color:var(--good)">${esc(fmt(t.sentN, { n: G.sent }))}</p>` : ""}
      <div class="btns"><button class="btn pri" data-act="send" id="sendBtn" ${G.draft.trim() ? "" : "disabled"}>${esc(t.send)} →</button></div>`}`; break;
  case "cluster": b = `<h2>${esc(t.groupTitle)}</h2><p class="lead">${esc(t.groupLead)}</p>${roomArt()}`; break;
  case "pair": {
    const c = COLORS[(G.myPair - 1 + COLORS.length) % COLORS.length] || COLORS[0];
    b = `<h2>${esc(fmt(t.pairTitle, { n: G.myPair || "…" }))}</h2><p class="lead" style="margin-top:-6px">${esc(t.pairLead)}</p>
      <div class="pairbig" style="--c:${c}">${G.myPair || "…"}</div>
      ${G.endsAt ? `<div style="text-align:center"><span class="bigclock" id="gclock" style="font-size:40px">${fmtClock(G.endsAt - Date.now())}</span></div>` : ""}
      ${G.theme ? `<div class="theme" style="--c:${G.theme.c}"><span class="kicker">${esc(t.yourTheme)}</span><b style="font-family:var(--syne);font-size:18px">${esc(G.theme.name || "—")}</b>${G.theme.items.map(x => `<div class="acard">${esc(x)}</div>`).join("")}</div>` : ""}
      <div class="tip"><i>?</i><span><b>${esc(t.talkQ)}</b>${esc(G.q || t.pairQ)}</span></div>`; break; }
  case "share":
    b = `<h2>${esc(t.shareTitle)}</h2><p class="lead">${esc(t.shareLead)}</p>
      ${G.shareSent ? `<p class="lead" style="color:var(--good)">✓ ${esc(t.shareSent)}</p>` : ""}
      <label class="field"><textarea id="shareIn" maxlength="200" placeholder="${esc(t.sharePh)}">${esc(G.shareDraft)}</textarea></label>
      <div class="btns"><button class="btn pri" data-act="sendShare" id="shareBtn" ${G.shareDraft.trim() ? "" : "disabled"}>${esc(t.send)} →</button></div>`; break;
  case "close":
    b = `<span class="kicker" style="color:var(--good)">✓</span><h2>${esc(t.endTitle)}</h2><p class="serif">${esc(t.endLead)}</p>
      <div class="monday"><b>${esc(t.monday)}</b>${esc(t.mondayTxt)}</div>
      <a class="link" href="/teachback">⊂⊃ ${esc(t.teachLink)}</a>`; break;
  }
  return `<section class="screen">${head}${b}</section>`;
}

function roomArt() {
  return `<svg viewBox="0 0 320 130" style="width:100%;max-width:420px;height:auto;margin:6px auto" aria-hidden="true">
    <rect x="70" y="10" width="180" height="70" rx="12" fill="#17171A"/><rect x="88" y="28" width="60" height="8" rx="4" fill="#E2553F"/><rect x="88" y="44" width="110" height="6" rx="3" fill="rgba(247,246,242,.35)"/><rect x="88" y="56" width="80" height="6" rx="3" fill="rgba(247,246,242,.35)"/>
    ${[40, 92, 144, 196, 248].map((x, i) => `<rect x="${x}" y="92" width="22" height="34" rx="5" fill="#fff" stroke="#E5E2DA"/><circle cx="${x + 11}" cy="120" r="2.5" fill="${COLORS[i]}"><animate attributeName="opacity" values="1;.3;1" dur="1.6s" begin="${i * .2}s" repeatCount="indefinite"/></circle>`).join("")}
  </svg>`;
}

/* clocks tick without re-rendering */
setInterval(() => {
  if (S.role === "host" && H.phase === "pair") { const el = $("hclock"); if (el) el.textContent = fmtClock(H.endsAt - Date.now()); if (H.endsAt && Date.now() > H.endsAt && !H.rang) { H.rang = true; sound.chime(); } }
  if (S.role === "guest" && G.phase === "pair") { const el = $("gclock"); if (el) el.textContent = fmtClock(G.endsAt - Date.now()); }
  // host: forget phones not seen for 3 minutes (only before pairing)
  if (S.role === "host" && (H.phase === "lobby" || H.phase === "collect")) { const now = Date.now(); let ch = false; for (const k in H.people) if (now - H.people[k] > 180000) { delete H.people[k]; ch = true; } if (ch) paintCounts(); }
}, 500);

/* ---------- events ---------- */
$("stage").addEventListener("input", e => {
  const el = e.target;
  if (el.id === "codeIn") { const v = el.value.toUpperCase().replace(/[^A-Z]/g, "").slice(0, 4); if (v !== el.value) el.value = v; S.codeIn = v; const b = $("joinBtn"); if (b) b.disabled = v.length !== 4; }
  if (el.id === "promptIn") { H.prompt = el.value; document.querySelectorAll("[data-prompt]").forEach(b => b.setAttribute("aria-pressed", "false")); const b = $("collectBtn"); if (b) b.disabled = !el.value.trim(); }
  if (el.dataset.theme) { const th = themeOf(el.dataset.theme); if (th) { th.name = el.value; pushState(); } }
  if (el.id === "ansIn") { G.draft = el.value; const b = $("sendBtn"); if (b) b.disabled = !el.value.trim(); }
  if (el.id === "shareIn") { G.shareDraft = el.value; const b = $("shareBtn"); if (b) b.disabled = !el.value.trim(); }
});
$("stage").addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id === "codeIn" && S.codeIn.length === 4) { e.preventDefault(); joinRoom(S.codeIn); }
});
function joinRoom(code) {
  Object.assign(G, { phase: "lobby", sent: 0, myPair: 0, theme: null, gotState: false, lost: false, draft: "", shareDraft: "", shareSent: false });
  S.screen = "room"; connect(code, "guest"); render();
  try { history.replaceState(null, "", location.pathname + "?c=" + code + (location.search.includes("local=1") ? "&local=1" : "")); } catch (e) {}
}
$("stage").addEventListener("click", e => {
  sound.init();
  const pr = e.target.closest("[data-prompt]"), ac = e.target.closest("[data-aid]"), tk = e.target.closest("[data-talk]"), a = e.target.closest("[data-act]");
  if (pr) { H.prompt = T().prompts[+pr.dataset.prompt]; sound.tap(); render(); return; }
  if (ac && S.role === "host" && H.phase === "cluster") {
    const ans = H.answers.find(x => x.aid === ac.dataset.aid); if (!ans) return;
    const i = ans.theme ? H.themes.findIndex(t => t.id === ans.theme) : -1;
    ans.theme = H.themes[(i + 1) % H.themes.length].id; sound.tap(); pushState(); render(); return;
  }
  if (tk) { H.talk = +tk.dataset.talk; H.endsAt = Date.now() + H.talk * 60000; H.rang = false; sound.tap(); pushState(); render(); return; }
  if (!a) return;
  const k = a.dataset.act; sound.tap();
  switch (k) {
    case "host": {
      S.screen = "room"; const code = newRoomCode(); Object.assign(H, { phase: "lobby", prompt: "", answers: [], themes: [], people: {}, pairs: {}, pairTheme: {}, shares: {}, talk: 5, endsAt: 0, rang: false });
      connect(code, "host"); render(); break; }
    case "join": if (S.codeIn.length === 4) joinRoom(S.codeIn); break;
    case "leave": if (S.tx) S.tx.close(); S.tx = null; S.role = null; S.screen = "intro"; document.body.classList.remove("host"); render(); break;
    case "collect": if (H.prompt.trim()) setPhase("collect"); break;
    case "cluster": setPhase("cluster"); break;
    case "auto": autoGroup(); pushState(); render(); break;
    case "pair": setPhase("pair"); break;
    case "share": setPhase("share"); break;
    case "close": setPhase("close"); break;
    case "copySum": {
      const t = T(), text = [`FREE//BUILDER — Room Mode · ${S.code}`, H.prompt, "",
        ...H.themes.filter(th => H.answers.some(x => x.theme === th.id)).map((th, i) => `${th.name || fmt(t.themePh, { n: i + 1 })}: ${H.answers.filter(x => x.theme === th.id).map(x => x.text).join(" / ")}`), "",
        t.closeTitle + ":", ...Object.entries(H.shares).map(([n, s]) => `${n}. ${s}`)].join("\n");
      const ok = () => toast(t.copied);
      if (navigator.clipboard) navigator.clipboard.writeText(text).then(ok).catch(fb); else fb();
      function fb() { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch (_) {} ta.remove(); ok(); }
      break; }
    case "newSession": if (S.tx) S.tx.close(); S.tx = null; S.role = null; S.screen = "intro"; document.body.classList.remove("host"); render(); break;
    case "send": {
      const v = G.draft.trim(); if (!v || G.sent >= 3) return;
      S.tx && S.tx.send("answer", { pid: S.pid, aid: uid(), text: v }); G.sent++; G.draft = ""; sound.warm(); render();
      const ta = $("ansIn"); if (ta && !matchMedia("(pointer: coarse)").matches) ta.focus(); break; }
    case "sendShare": {
      const v = G.shareDraft.trim(); if (!v) return;
      S.tx && S.tx.send("share", { pid: S.pid, text: v }); G.shareSent = true; sound.warm(); render(); break; }
  }
});

/* auto-join from a shared link: /room?c=KITE */
const qc = (new URLSearchParams(location.search).get("c") || "").toUpperCase().replace(/[^A-Z]/g, "");
if (qc.length === 4) { S.codeIn = qc; setTimeout(() => joinRoom(qc), 0); }

/* shared settings: /config.js fills in the Supabase keys for every live demo */
(() => {
  if (ROOM_CONFIG.supabaseUrl) return;
  const sc = document.createElement("script"); sc.src = "/config.js";
  sc.onload = () => { const c = window.FB_SUPABASE || {}; if (c.url && c.anonKey) { ROOM_CONFIG.supabaseUrl = c.url; ROOM_CONFIG.anonKey = c.anonKey; ROOM_CONFIG.realtimeUrl = c.realtimeUrl || ""; if (!S.tx) render(); } };
  document.head.appendChild(sc);
})();

window.__app = { S, H, G, render, setPhase, autoGroup, onMsg };

/* ---------- facilitator guide ---------- */
const drawer = $("drawer");
function openGuide() {
  const t = T();
  $("panel").innerHTML = `
    <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start">
      <div><span class="kicker">${esc(t.gKicker)}</span><h3 id="g-title">${esc(t.gTitle)}</h3></div>
      <button class="x" data-close aria-label="${esc(t.close)}">✕</button>
    </div>
    <h4>${esc(t.gWhy)}</h4><p>${esc(t.gWhyTxt)}</p>
    <h4>${esc(t.gSteps)}</h4><ol>${t.gStepList.map(s => `<li>${esc(s)}</li>`).join("")}</ol>
    <h4>${esc(t.gDebrief)}</h4><ul>${t.gDebriefList.map(s => `<li>${esc(s)}</li>`).join("")}</ul>
    <h4>${esc(t.gNotes)}</h4><ul>${t.gNotesList.map(s => `<li>${esc(s)}</li>`).join("")}</ul>`;
  drawer.classList.add("show");
  setTimeout(() => drawer.querySelector("[data-close]").focus({ preventScroll: true }), 60);
}
function closeGuide() { drawer.classList.remove("show"); $("btn-guide").focus({ preventScroll: true }); }
drawer.addEventListener("click", e => { if (e.target === drawer || e.target.closest("[data-close]")) closeGuide(); });
$("btn-guide").addEventListener("click", openGuide);
window.addEventListener("keydown", e => { if (e.key === "Escape" && drawer.classList.contains("show")) closeGuide(); });

/* ---------- language + sound ---------- */
function paintSound() {
  const b = $("btn-sound"), t = T();
  b.innerHTML = sound.muted
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m22 9-6 6M16 9l6 6"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>';
  b.setAttribute("aria-label", sound.muted ? t.soundOff : t.soundOn); b.title = b.getAttribute("aria-label");
}
$("btn-sound").addEventListener("click", () => { sound.muted = !sound.muted; store.set("fb_muted", sound.muted); sound.init(); paintSound(); if (!sound.muted) sound.tap(); });

function applyLang(l) {
  lang = LANGS.includes(l) ? l : "en";
  document.documentElement.lang = (/*i18n*/lang === "zh" ? "zh-CN" : (lang === "zh-Hant" ? "zh-TW" : lang));
  document.title = T().title;
  $("lang-lbl").textContent = LANG_LBL[lang];
  $("btn-guide").setAttribute("aria-label", T().guide); drawer.setAttribute("aria-label", T().guide);
  document.querySelectorAll("[data-t]").forEach(el => { const v = T()[el.dataset.t]; if (typeof v === "string") el.textContent = v; });
  paintSound();
  render();               // the clock object survives a re-render
  timer.paint();
  const pb = $("pauseBtn"); if (pb && !timer.running && !timer.ended) pb.textContent = T().resume;
  if (drawer.classList.contains("show")) openGuide();
  try { localStorage.setItem("wm_preferred_lang", lang); localStorage.setItem("wm_cases_lang", lang); } catch (e) {}
}
$("btn-lang").addEventListener("click", () => applyLang(LANGS[(LANGS.indexOf(lang) + 1) % LANGS.length]));
window.FBL_SET = l => applyLang(l); window.FBL_GET = () => lang;

/* ---------- boot ---------- */
let saved = null;
try { saved = localStorage.getItem("wm_preferred_lang") || localStorage.getItem("wm_cases_lang"); } catch (e) {}
const nav = (navigator.language || "").toLowerCase();
applyLang(LANGS.includes(saved) ? saved : nav.startsWith("zh") ? "zh" : nav.startsWith("es") ? "es" : "en");
document.addEventListener("visibilitychange", () => { if (!document.hidden && timer.running) keepAwake(true); });
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("/sw.js", { scope: "/" }).catch(() => {}); // offline cache
})();
</script>
</body>
</html>
