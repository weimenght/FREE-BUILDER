<style>
  /* Paw Reading on its own: the stall on top (left on wide screens), the reading under it. Paper by day on a light device,
     the town's night ink on a dark one; the stall itself follows the hour on the browser's clock either way. */
  :root {
    --page:#f3ead8; --ink:#2a1c14; --mut:#6e5440; --panel:#fbf3e2; --field:#fffaf0; --line:#1a1410; --amber:#f6b73c; --red:#c8303a;
    --wood:#c8955a; --woodD:#8a5a2c; --check:rgba(90,60,30,.06); --link:#a8401c; color-scheme:light;
    --pix:"VT323", ui-monospace, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", monospace;
    --sign:"Press Start 2P", "VT323", monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page:#14101e; --ink:#f3ead8; --mut:#b9a88e; --panel:#221a2c; --field:#1a1422; --wood:#7a4a28; --woodD:#3e2414; --check:rgba(255,255,255,.025); --link:#f6b73c; color-scheme:dark; } }
  :root[data-theme="dark"] { --page:#14101e; --ink:#f3ead8; --mut:#b9a88e; --panel:#221a2c; --field:#1a1422; --wood:#7a4a28; --woodD:#3e2414; --check:rgba(255,255,255,.025); --link:#f6b73c; color-scheme:dark; }
  :lang(zh) { --pix:"VT323", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
  :lang(zh-Hant) { --pix:"VT323", "PingFang HK", "PingFang TC", "Microsoft JhengHei", "Noto Sans CJK TC", sans-serif; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--page); color:var(--ink); }
  body { font:21px/1.25 var(--pix); min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; -webkit-text-size-adjust:100%;
    background-image:repeating-conic-gradient(var(--check) 0 25%, transparent 0 50%); background-size:8px 8px; transition:background-color .8s; }
  html:lang(zh) body, html:lang(zh-Hant) body { font-size:17px; line-height:1.55; }
  .wrap { width:100%; max-width:620px; margin:0 auto; flex:1; display:grid; align-content:start; gap:14px;
    padding:max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 20px max(16px, env(safe-area-inset-left)); }
  header { display:flex; align-items:center; gap:10px; }
  .brand { display:flex; align-items:center; gap:10px; flex:1; min-width:0; }
  .brand svg { width:28px; height:28px; flex:none; }
  .brand h1 { margin:0; font:12px/1.4 var(--sign); letter-spacing:.04em; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  html:lang(zh) .brand h1, html:lang(zh-Hant) .brand h1 { font:700 18px/1.2 var(--pix); letter-spacing:.1em; }
  .main { display:grid; gap:14px; align-content:start; }
  .stage { position:relative; border:3px solid var(--line); box-shadow:4px 4px 0 var(--line); background:#14101e; }
  #cv { display:block; width:100%; height:auto; aspect-ratio:192/120; image-rendering:pixelated; cursor:pointer; touch-action:manipulation; }
  .panel { background:var(--panel); border:3px solid var(--line); box-shadow:4px 4px 0 var(--line); padding:14px 16px 16px; display:grid; gap:12px; }
  .say { margin:0; }
  .say em { font-style:normal; color:var(--mut); }
  .say a, .panel a { color:var(--link); }
  .row { display:flex; flex-wrap:wrap; gap:10px; }
  .btn { font:21px/1 var(--pix); color:#1a1410; background:var(--wood); border:3px solid var(--line); box-shadow:3px 3px 0 var(--line), inset 0 2px 0 rgba(255,255,255,.25);
    min-height:46px; padding:8px 14px; cursor:pointer; display:inline-flex; align-items:center; gap:8px; text-decoration:none; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn { color:#f3ead8; } }
  :root[data-theme="dark"] .btn { color:#f3ead8; }
  .btn.pri { background:var(--amber); color:#1a1410; }
  .btn.sm { min-height:40px; padding:6px 10px; font-size:19px; }
  .btn:active { transform:translate(2px, 2px); box-shadow:1px 1px 0 var(--line); }
  .btn:focus-visible, .lk:focus-visible { outline:3px solid var(--amber); outline-offset:2px; }
  .btn[disabled] { opacity:.55; cursor:default; }
  html:lang(zh) .btn, html:lang(zh-Hant) .btn { font-size:17px; }
  .lk { font:inherit; color:var(--link); background:none; border:0; padding:4px 0; cursor:pointer; text-decoration:underline; text-underline-offset:3px; min-height:36px; }
  .card { display:grid; grid-template-columns:minmax(120px, 40%) 1fr; gap:16px; align-items:start; }
  .flip { perspective:900px; width:100%; aspect-ratio:300/419; }
  .flip .in { position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform .9s cubic-bezier(.3,.7,.3,1); }
  .flip .in.up { transform:rotateY(180deg); }
  .flip img { position:absolute; inset:0; width:100%; height:100%; backface-visibility:hidden; -webkit-backface-visibility:hidden; border:3px solid var(--line); box-shadow:4px 4px 0 var(--line); background:#f6ecd2; }
  .flip img.f { transform:rotateY(180deg); }
  .kick { display:block; font:9px/1.6 var(--sign); letter-spacing:.06em; color:var(--mut); margin-bottom:6px; text-transform:uppercase; }
  html:lang(zh) .kick, html:lang(zh-Hant) .kick { font:700 14px/1.4 var(--pix); letter-spacing:.12em; }
  .ask { margin:0; font-size:25px; line-height:1.25; }
  html:lang(zh) .ask, html:lang(zh-Hant) .ask { font-size:20px; line-height:1.6; }
  .sub { margin:0; color:var(--mut); font-size:19px; }
  html:lang(zh) .sub, html:lang(zh-Hant) .sub { font-size:15px; }
  .acts { display:grid; gap:10px; }
  .pocket { display:flex; gap:16px; align-items:center; }
  .pocket img { width:72px; flex:none; border:3px solid var(--line); box-shadow:3px 3px 0 var(--line); transform:rotate(-6deg); }
  .theirs { display:flex; gap:12px; align-items:flex-start; border-top:3px dashed color-mix(in srgb, var(--line) 30%, transparent); padding-top:12px; }
  .theirs img { width:64px; flex:none; border:2px solid var(--line); }
  .field { display:grid; gap:4px; }
  .field label { font-size:17px; color:var(--mut); }
  input[type=text], input[type=time] { font:21px var(--pix); color:var(--ink); background:var(--field); border:3px solid var(--line); padding:8px 10px; min-height:46px; width:100%; max-width:320px; }
  html:lang(zh) input, html:lang(zh-Hant) input { font-size:17px; }
  .ring { width:150px; height:150px; margin:4px auto; display:block; }
  .ring circle { fill:none; stroke-width:8; }
  .ring .bg { stroke:color-mix(in srgb, var(--mut) 30%, transparent); }
  .ring .fg { stroke:var(--amber); stroke-linecap:butt; transform:rotate(-90deg); transform-origin:50% 50%; transition:stroke-dashoffset 1s linear; }
  .morn { border-top:3px dashed color-mix(in srgb, var(--line) 30%, transparent); padding-top:10px; display:grid; gap:10px; }
  .pxi { display:inline-flex; } .pxi svg { width:18px; height:18px; display:block; image-rendering:pixelated; }
  .langmenu { position:absolute; right:16px; top:58px; z-index:30; background:var(--panel); border:3px solid var(--line); box-shadow:4px 4px 0 var(--line); display:flex; flex-direction:column; min-width:150px; }
  .langmenu button { font:20px/1.2 var(--pix); color:var(--ink); background:none; border:0; text-align:left; padding:10px 14px; min-height:44px; cursor:pointer; }
  .langmenu button[aria-checked="true"] { background:var(--amber); color:#1a1410; }
  .sheet { position:fixed; inset:0; z-index:40; display:grid; place-items:center; padding:16px; background:rgba(10,8,16,.55); }
  .sheet .panel { max-width:460px; width:100%; }
  .sheet ol { margin:0; padding:0 0 0 1.2em; display:grid; gap:8px; }
  footer { padding:10px 16px max(16px, env(safe-area-inset-bottom)); font-size:17px; color:var(--mut); }
  footer a { color:inherit; }
  /* off the screen: once the card is in your pocket the page dims and gets out of the way */
  body.away .stage { filter:saturate(.7) brightness(.85); }
  [hidden] { display:none !important; }
  @media (min-width: 880px) {
    .wrap { max-width:1060px; }
    .main { grid-template-columns:minmax(0, 1.15fr) minmax(0, 1fr); align-items:start; }
    .stage { position:sticky; top:16px; }
  }
  @media (prefers-reduced-motion: reduce) { .flip .in { transition:none; } .btn:active { transform:none; } body { transition:none; } }
</style>

<script>
/* Paw Reading, the app (freebuilder.net/paw-reading/): Miso & Yuzu's stall from Nearby, outside the town.

   stall and Your Plot's keepsakes read). The cats paw it over by day (whichever is at the stall, or one trots back from
   wherever FBWorld.cats() has her), doze behind the counter at night (FBWorld.sleeps), and you cut the deck quietly.
   The card asks one thing of you, somewhere real, and most carry one way to start it (a line to send, your own maps, a minute
   with the phone face down); then it goes in your pocket and the page gets out of the way. Draw with someone: the same card,
   today only, carried in the link (#with=i.Y-M-D&from=name), nothing stored. A card in the morning: optional, off unless asked,
   through Little Things' Web Push (lt_push with app 'paw', /little-things/sw.js at scope /little-things/paw/, lt-nudge).

function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

var W = {

/* ---------------- a card in the morning: Little Things' Web Push, reused ----------------
   Off unless asked. Same pieces as Little Things: the town's device key hashed as sha256("lt:" + fb_device_key) (so Nearby's

var KOK = /^[A-Za-z0-9_-]{32,128}$/, SCOPE = "/little-things/paw/";
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

    if (!c.url) throw new Error("offline");
    return fetch(c.url + "/rest/v1/rpc/" + fn, { method: "POST", headers: { apikey: c.anonKey, Authorization: "Bearer " + c.anonKey, "Content-Type": "application/json" }, body: JSON.stringify(body || {}) })
      .then(function (r) { return r.text().then(function (x) { var j = null; try { j = x ? JSON.parse(x) : null; } catch (e) {} if (!r.ok) throw new Error((j && j.message) || "error"); return j; }); });
  });
}
function newKey() { var a = new Uint8Array(32); crypto.getRandomValues(a); return btoa(String.fromCharCode.apply(null, a)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
function devKey() { var k = lsGet("fb_device_key"); if (!k || !KOK.test(k)) { k = newKey(); lsSet("fb_device_key", k); } return k; }
var secMemo = null;
function secret() { return secMemo || (secMemo = crypto.subtle.digest("SHA-256", new TextEncoder().encode("lt:" + devKey())).then(function (b) { return Array.prototype.map.call(new Uint8Array(b), function (x) { return ("0" + x.toString(16)).slice(-2); }).join(""); })); }
function consent() { try { if (window.FBC && FBC.ask) { var d = (FBC.DATA || []).filter(function (x) { return x.k === "paw"; })[0]; if (d) return FBC.ask(d); } } catch (e) {} return Promise.resolve(true); }
function pushCan() { try { return !!(window.isSecureContext && "serviceWorker" in navigator && "PushManager" in window && "Notification" in window); } catch (e) { return false; } }
var pushProbe = null, pushKey = null;
function probePush() {

  return pushProbe;
}
function pushState() { try { var o = JSON.parse(lsGet("paw_push") || "null"); return o && typeof o.h === "number" ? o : null; } catch (e) { return null; } }
function tz() { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC"; } catch (e) { return "UTC"; } }
function keyBytes(b) { b = b.replace(/-/g, "+").replace(/_/g, "/"); while (b.length % 4) b += "="; var r = atob(b), a = new Uint8Array(r.length); for (var i = 0; i < r.length; i++) a[i] = r.charCodeAt(i); return a; }

function swReg() { return navigator.serviceWorker.register("/little-things/sw.js", { scope: SCOPE }).then(function (reg) { return reg.active ? reg : new Promise(function (res) { var w = reg.installing || reg.waiting; if (!w) return res(reg); w.addEventListener("statechange", function () { if (w.state === "activated") res(reg); }); }); }); }
function sub(reg, k) { return reg.pushManager.getSubscription().then(function (s) { return s || reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: keyBytes(k) }); }); }
function sendSub(s, h, m) {

  return secret().then(function (k) { return rpc("lt_push_set", { p_secret: k, p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth, p_hour: h, p_minute: m, p_tz: tz(), p_lang: LANGS[li()], p_app: "paw" }); })
    .then(function () { lsSet("paw_push", JSON.stringify({ h: h, m: m, ep: j.endpoint, l: LANGS[li()] })); });
}
function pushOn(h, m) {
  return consent().then(function (yes) {
