<style>

  footer svg { width:14px; height:14px; }
  footer .line { width:100%; }
footer .fb-mk { width:16px; height:16px; }   /* the pixel marks from the kit (FBC.logo): one row of links on a phone */
@media (max-width:600px) { footer .mw { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; } footer .mw + a { margin-left:.3em; } footer { gap:4px 12px; } }

    border:3px solid #000; box-shadow:4px 4px 0 #000, inset 0 0 0 2px #5a3a22; padding:8px 12px 9px; font-size:20px; line-height:1.2; cursor:pointer; animation:pop .2s ease-out both; }

/* ---------------- taking your towns to another device (take.js) ----------------
   Every town on this device in one link's # (also drawn as a square to scan) or in one .json file, made here and sent nowhere.
   It arrives as { app, v: 1, towns: [{ t: packed town, me, seen }] } and goes in town by town through merge(): the newest
   version of each piece wins, lines only add, so nothing is lost and nothing comes twice. Each town's own #t= link still carries just that town. */

  bg.appendChild(c); document.body.appendChild(bg); tkEl = bg; tkCur = again; var t0 = Date.now();
  bg.addEventListener("click", function (e) { if (e.target === bg && Date.now() - t0 > 450) tkClose(); });
  setTimeout(function () { var b = c.querySelector("button"); try { if (b) b.focus({ preventScroll: true }); } catch (e) {} }, 30);
  return c;
}
document.addEventListener("keydown", function (e) { if (e.key === "Escape" && tkEl) tkClose(); });
function allTowns() { var sv = shelf(); return Object.keys(sv).sort(function (a, b) { return sv[b].seen - sv[a].seen; }).map(function (id) { return { s: sv[id], t: unpack(sv[id].t) }; }).filter(function (x) { return x.t; }); }

function tkRead(o) {
  if (!o || o.app !== TKAPP || !Array.isArray(o.towns)) return null; var out = [], seen = {};
  o.towns.slice(0, 24).forEach(function (r) { var t = r && unpack(r.t); if (t && !seen[t.i]) { seen[t.i] = 1; out.push({ t: t, me: clean(r.me, 24), seen: +r.seen || 0 }); } });
  return out.length ? out : null;
}

  sb.disabled = true;
  tkOpen(["<h2>" + esc(sg(T(W.takeAll))) + "</h2>", '<p class="d">' + F(esc(T(W.takeLead)), { n: "<b>" + esc(tkNames(list)) + "</b>" }) + "</p>", row("acts", [sb, fb]), qr, hint,
    TOWN ? '<p class="d">' + esc(F(W.oneTown, { s: T(W.share) })) + "</p>" : "",
    row("acts", [btn(T(W.openFile), tkFile, "sm quiet"), btn(T(W.back), tkClose, "sm quiet")])], takeView);

  });

  tkOpen(["<h2>" + esc(sg(T(W.arrive))) + "</h2>", '<p class="d"><b>' + esc(what) + "</b></p>", '<p class="d">' + esc(T(W.arriveHow)) + "</p>",
    row("acts", [btn(T(one ? W.bring1 : W.bring), function () { var ch = tkMerge(list); tkClose(); note(T(ch ? W.brought : W.same)); if (!TOWN) startView(); }, "fbb-pri"), btn(T(W.notNow), tkClose, "quiet")])], function () { tkAsk(list); });

  var sv = shelf(), ch = false, isOpen = false;
  list.forEach(function (x) {
    var cur = sv[x.t.i], a = TOWN && TOWN.i === x.t.i ? TOWN : cur && unpack(cur.t);
    if (a) {
      var before = JSON.stringify(pack(a)); merge(a, x.t); if (JSON.stringify(pack(a)) !== before) { ch = true; if (a === TOWN) isOpen = true; }
      sv[x.t.i] = { t: pack(a), me: (cur && cur.me) || x.me || "", seen: Math.max(cur && cur.seen || 0, x.seen) };
    } else { ch = true; sv[x.t.i] = { t: pack(x.t), me: x.me, seen: x.seen || Date.now() }; }
  });
  var ids = Object.keys(sv).sort(function (a, b) { return sv[b].seen - sv[a].seen; }); ids.slice(12).forEach(function (k) { if (!TOWN || k !== TOWN.i) delete sv[k]; });
  lsSet("cg_towns", JSON.stringify(sv));
