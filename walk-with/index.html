<style>
  /* one screen per state; warm paper by day, a lamplit street at night */
  :root {

    --body:"Figtree",ui-rounded,"Segoe UI",system-ui,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper:#1d1814; --paper2:#2e261f; --road:#3a3129; --ink:#f3ead8; --soft:#b9a88e; --field:#2a221c; --dot:rgba(255,255,255,.03); color-scheme:dark; } }
  :root[data-theme="dark"] { --paper:#1d1814; --paper2:#2e261f; --road:#3a3129; --ink:#f3ead8; --soft:#b9a88e; --field:#2a221c; --dot:rgba(255,255,255,.03); color-scheme:dark; }
  :lang(zh-Hant) { --hand:"Caveat","PingFang HK","PingFang TC","Microsoft JhengHei","Noto Sans CJK TC",sans-serif; --body:"Figtree",system-ui,"PingFang HK","PingFang TC","Microsoft JhengHei","Noto Sans CJK TC",sans-serif; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { background:var(--paper); color:var(--ink); }
  body { font:19px/1.4 var(--body); -webkit-tap-highlight-color:transparent; background-image:radial-gradient(var(--dot) 1px, transparent 1px); background-size:6px 6px; }
  header { max-width:380px; margin:0 auto; padding:10px 16px 0; display:flex; justify-content:flex-end; position:relative; }
  #app { max-width:380px; margin:0 auto; padding:0 16px; }
  .screen { min-height:calc(100vh - 44px); min-height:calc(100dvh - 44px); display:flex; flex-direction:column; justify-content:center; gap:18px; padding:16px 0 32px; animation:in .35s ease; }
  body.bare .screen { min-height:100vh; min-height:100dvh; }
  body.bare header, body.bare footer, body.mid footer { display:none; }
  @keyframes in { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce) { .screen { animation:none; } }
  h1, .hand { font-family:var(--hand); font-weight:600; }
  h1 { font-size:44px; line-height:1.02; white-space:pre-line; }
  html:lang(zh) h1, html:lang(zh-Hant) h1 { font-size:34px; line-height:1.3; font-weight:700; }
  .lede { font-size:20px; color:var(--soft); }
  .center { text-align:center; align-items:center; }
  .scene { width:100%; height:auto; display:block; }
  label { font-family:var(--hand); font-weight:600; font-size:27px; display:block; margin-bottom:6px; }
  html:lang(zh) label, html:lang(zh-Hant) label { font-size:20px; font-weight:700; }
  .times { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .days { display:grid; grid-template-columns:repeat(10,1fr); gap:8px; }
  .days .chip { grid-column:span 2; }
  .days .chip[data-d="0"], .days .chip[data-d="1"] { grid-column:span 5; }
  .days .chip { font-size:22px; padding:7px 0; }

  .chip:disabled { opacity:.35; box-shadow:none; cursor:default; }
  .chip, .btn, input { font:inherit; color:var(--ink); background:var(--field); border:2.5px solid var(--ink); border-radius:255px 14px 225px 14px/14px 225px 14px 255px; }
  .chip { font-family:var(--hand); font-weight:600; font-size:31px; padding:8px 0; cursor:pointer; box-shadow:2px 2px 0 var(--ink); }
  .chip[aria-pressed=true] { background:var(--sun); color:#3b2a20; box-shadow:none; transform:translate(2px,2px); }
  input { width:100%; font-size:20px; padding:13px 14px; outline:none; }
  input:focus { box-shadow:0 0 0 3px rgba(231,181,74,.55); }
  input::placeholder { color:var(--soft); opacity:.7; }
  .btn { display:block; width:100%; font-family:var(--hand); font-weight:600; font-size:33px; padding:12px 10px; cursor:pointer; background:var(--clay); color:#fffaf2; box-shadow:3px 3px 0 var(--ink); transition:transform .08s, box-shadow .08s; }
  html:lang(zh) .btn, html:lang(zh-Hant) .btn, html:lang(zh) .chip, html:lang(zh-Hant) .chip { font-size:23px; font-weight:700; }
  .btn:active { transform:translate(3px,3px); box-shadow:none; }
  .btn.quiet { background:var(--field); color:var(--ink); }
  .btn.sage { background:var(--sage); color:#3b2a20; }
  .row { display:flex; gap:12px; width:100%; } .row .btn { flex:1; }
  .link { background:none; border:0; font:inherit; font-size:16px; color:var(--soft); text-decoration:underline; text-underline-offset:3px; cursor:pointer; padding:8px; }
  .faint { opacity:.5; }
  .code { font-family:var(--hand); font-weight:600; font-size:80px; letter-spacing:.12em; line-height:1; text-align:center; padding:14px 0 6px; border:2.5px dashed var(--ink); border-radius:18px 6px 20px 8px; background:var(--field); width:100%; }
  .big { font-family:var(--hand); font-weight:600; font-size:72px; line-height:1; }
  .clock { font-family:var(--hand); font-weight:600; font-size:min(80px,20vw); line-height:1; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .clock small { display:block; font-size:.5em; margin-bottom:6px; color:var(--soft); }
  .corner { font-family:var(--hand); font-weight:600; font-size:35px; line-height:1.1; word-break:break-word; }
  html:lang(zh) .corner, html:lang(zh-Hant) .corner { font-size:26px; line-height:1.35; }
  .mins { font-size:160px; font-weight:300; line-height:1; color:var(--soft); font-variant-numeric:tabular-nums; }
  .note { font-size:16px; color:var(--soft); min-height:1.4em; }
  .err { color:#b14a24; }
  .spacer { flex:1; }
  #langBtn { font:600 15px var(--body); color:var(--soft); background:none; border:1.5px solid currentColor; border-radius:999px; padding:4px 11px; cursor:pointer; }
  .langmenu { position:absolute; right:16px; top:42px; z-index:5; background:var(--field); border:2px solid var(--ink); border-radius:12px; padding:6px; display:flex; flex-direction:column; box-shadow:3px 3px 0 var(--ink); }

/* ---------- screens ---------- */

  '<p class="note" id="note" aria-live="polite"></p>' +
  '<button type="button" class="btn quiet" id="sent">' + esc(T(W.sent)) + '</button></section>'; },
invite: function () { return '<section class="screen center">' +
  '<p class="lede">' + esc(s.n ? F(W.inviteFrom, { n: s.n }) : T(W.inviteAnon)) + '</p>' +
  '<div class="big">' + esc(s.t) + '</div>' +
  '<p class="hand" style="font-size:28px">' + esc(dayLabel(s.at)) + '</p>' +
  '<p class="corner">' + esc(F(W.at, { c: s.c })) + '</p>' +
  '<p class="lede">' + esc(T(W.inviteSub)) + '</p>' +
  '<div class="spacer"></div><button type="button" class="btn sage" id="yes">' + esc(T(W.illBeThere)) + '</button></section>'; },
countdown: function () { return '<section class="screen center"><div class="spacer"></div>' +
  '<div class="clock" id="clock" role="timer" aria-label="' + esc(T(W.untilWalk)) + '"></div>' +
  '<p class="corner">' + esc(s.c) + '</p><div class="spacer"></div>' +
  '<button type="button" class="link faint" id="cancel">' + esc(T(W.notGoing)) + '</button></section>'; },
go: function () { return '<section class="screen center">' + WALKING() +
  '<h1>' + esc(T(W.goTitle)) + '</h1><button type="button" class="btn quiet" id="start">' + esc(T(W.startTimer)) + '</button></section>'; },
timer: function () { return '<section class="screen center"><div class="mins" id="mins" role="timer" aria-label="' + esc(T(W.minsLeft)) + '"></div></section>'; },
done: function () { return '<section class="screen center"><h1>' + esc(T(W.doneTitle)) + '</h1>' +
  '<p class="corner" style="font-size:30px">' + esc(T(W.again)) + '</p>' +
  '<div class="row"><button type="button" class="btn sage" id="again">' + esc(T(W.yes)) + '</button><button type="button" class="btn quiet" id="nope">' + esc(T(W.no)) + '</button></div></section>'; },

  '<h1>' + esc(T(W.byeTitle)) + '</h1><p class="lede">' + esc(T(W.byeSub)) + '</p>' +

function on(id, fn) { var e = $(id); if (e) e.onclick = fn; }
function share(text, onCopied) {
  if (navigator.share) return navigator.share({ text: text }).catch(function () {});
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text).then(function () { if (onCopied) onCopied(); }, function () { window.prompt("", text); });
  window.prompt("", text);
}
var B = {
  home: function () { var pick = null, day = TIMES.some(function (t) { return ok(0, t); }) ? 0 : 1;
    var days = document.querySelectorAll(".chip.day"), tms = document.querySelectorAll(".chip.tm");
    function paint() {
      Array.prototype.forEach.call(days, function (b) { var o = +b.getAttribute("data-d"); b.setAttribute("aria-pressed", String(o === day)); b.disabled = !TIMES.some(function (t) { return ok(o, t); }); });
      Array.prototype.forEach.call(tms, function (b) { var t = b.getAttribute("data-t"); b.disabled = !ok(day, t); if (b.disabled && pick === t) pick = null; b.setAttribute("aria-pressed", String(pick === t)); });
    }
    Array.prototype.forEach.call(days, function (b) { b.onclick = function () { day = +b.getAttribute("data-d"); paint(); }; });
    Array.prototype.forEach.call(tms, function (b) { b.onclick = function () { pick = b.getAttribute("data-t"); paint(); }; });
    paint();
    on("make", function () { var c = $("corner").value.trim(), n = $("name").value.trim();
      if (!pick || !c || !ok(day, pick)) { paint(); $("err").textContent = T(W.needCorner); return; }
      put(NAMEKEY, n || null); s = { id: newCode(), t: pick, c: c, n: n, at: atFor(day, pick), role: "host", sent: false }; save(); render(true); }); },
  send: function () { on("share", function () { share(F(W.shareText, { t: when(s), c: s.c, link: linkFor(s) }), function () { $("note").textContent = T(W.copied); }); });
    on("sent", function () { s.sent = true; save(); render(true); }); },
  invite: function () { on("yes", function () { var txt = F(W.replyText, { t: when(s), c: s.c }); s.joined = true; save(); render(true); share(txt); }); },
  countdown: function () { on("cancel", function () { if (confirm(T(W.confirmCancel))) reset(); }); },
  go: function () { on("start", function () { s.walkStart = Date.now(); save(); render(true); }); },
  done: function () { on("again", function () { while (s.at <= Date.now()) s.at += 7 * DAY; s.walkStart = null; save(); render(true); });
    on("nope", function () { s.bye = true; save(); render(true); }); },
  bye: function () { on("fresh", reset); }
};

/* ---------- the loop: one tick a second ---------- */
var app = $("app"), cur = null;
function pad(n) { return String(n).padStart(2, "0"); }
function tick() { var now = Date.now(), c = $("clock"), m = $("mins");
  if (c && s) { var sec = Math.ceil(Math.max(0, s.at - now) / 1000), d = Math.floor(sec / 86400); sec %= 86400;
    c.innerHTML = (d ? "<small>" + d + esc(T(W.d)) + "</small>" : "") + pad(Math.floor(sec / 3600)) + ":" + pad(Math.floor(sec % 3600 / 60)) + ":" + pad(sec % 60); }
  if (m && s) m.textContent = Math.ceil(Math.max(0, s.walkStart + walkMs() - now) / walkMs() * 20);
}
function render(force) { var sc = screenOf();
  if (sc !== cur || force) {
    if (sc === "go" && cur === "countdown") { try { if (navigator.vibrate) navigator.vibrate(200); } catch (e) {} }   /* the one nudge: a single buzz when it's time */
    cur = sc; document.body.className = CHROME[sc]; app.innerHTML = V[sc](); if (B[sc]) B[sc](); scrollTo(0, 0); chrome();
  }
  tick(); testbar();
}

    b.addEventListener("click", function () { if (window.FBL) FBL.set(l); closeLang(); render(true); }); });
  $("langBtn").setAttribute("aria-expanded", "true"); menu.querySelector("[aria-checked=true]").focus();
});
document.addEventListener("click", function (e) { if (menu && !menu.contains(e.target)) closeLang(); });

  else $("foot").innerHTML = _x;
}

/* ---------- testing: ?test shows both roles and fast-forwards; window.WW for scripts ---------- */
function testbar() { if (!TEST) return; var bar = $("testbar"); bar.hidden = false; document.body.style.paddingBottom = "60px";
  var role = s && s.role;
  bar.innerHTML = "<span>" + cur + '</span><button data-a="host" class="' + (role === "host" ? "on" : "") + '">Host</button><button data-a="guest" class="' + (role === "guest" ? "on" : "") + '">Invitee</button>' +
    '<button data-a="soon">Start in 10s</button><button data-a="short">20s walk</button><button data-a="link">Open invite</button><button data-a="reset">Reset</button>';
  Array.prototype.forEach.call(bar.querySelectorAll("button"), function (b) { b.onclick = function () { var a = b.getAttribute("data-a"); if (!s && a !== "reset") return;
    if (a === "host") s.role = "host";
    if (a === "guest") { s.role = "guest"; s.joined = !!s.joined; }
    if (a === "soon") { s.at = Date.now() + 10000; s.walkStart = null; s.bye = false; }
    if (a === "short") s.walkMs = s.walkMs ? null : 20000;
    if (a === "link") { s.role = "guest"; s.joined = false; history.replaceState(null, "", linkFor(s) + "&test"); }
    if (a === "reset") return reset();
    save(); render(true); }; });
}
