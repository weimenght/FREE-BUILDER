<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="referrer" content="same-origin" data-fbr><script data-fbl data-mode="game" src="/fbkit/fb.js?v=e8452902b7"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Borrowed Pages · real books, lent by hand</title>
<meta name="description" content="Real books, lent by hand between neighbours. Browse a house of books people actually own, ask for one, meet and hand it over. No account.">
<meta name="theme-color" content="#f4ecdc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15100c" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Borrowed Pages">
<link rel="stylesheet" href="/fonts/g/fonts.css">
<style>
:root{
  --bg:#f4ecdc;--bg2:#ebe0ca;--card:#fffaf0;--ink:#2a1d14;--ink2:#6b5a48;--line:#d9c9ab;--accent:#7c2513;--accent2:#a1381f;--brass:#b8862e;--ok:#2f5a3a;
  --wood:#7a4f2c;--wood2:#5b3a1f;--back:#4a3121;--plank:#8a5a33;--plankHi:#a8734a;--shadow:0 1px 0 rgba(255,255,255,.6) inset,0 18px 40px -24px rgba(42,29,20,.45);
  --serif:"Fraunces","Iowan Old Style","Palatino Linotype",Georgia,"Songti SC","Noto Serif SC","Noto Serif TC",serif;
  --sans:"Figtree",system-ui,-apple-system,"Segoe UI","PingFang SC","PingFang TC","Microsoft YaHei",sans-serif;
  --hand:"Caveat","Bradley Hand","Kaiti SC","STKaiti","KaiTi","Kaiti TC",cursive;
  --row:186px;--rowIn:170px;--plankH:16px;--r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#15100c;--bg2:#1d1610;--card:#241b14;--ink:#f1e6d2;--ink2:#b9a78e;--line:#3d2f22;--accent:#e0805f;--accent2:#f09a78;--brass:#d9a94e;--ok:#8fc49b;
  --wood:#4a301b;--wood2:#382413;--back:#24170f;--plank:#5e3c22;--plankHi:#7a5030;--shadow:0 18px 40px -24px #000;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;background-image:radial-gradient(rgba(120,90,50,.08) 1px,transparent 1.2px);background-size:5px 5px;z-index:0}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px;border-radius:6px}
.wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left)) 0 max(16px,env(safe-area-inset-right))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:8px;min-height:60px;padding-top:env(safe-area-inset-top)}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-decoration:none;color:inherit}
.brand svg{flex:none;width:34px;height:34px}
.brand b{font:600 clamp(19px,4.6vw,24px)/1.1 var(--serif);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;min-width:44px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font:600 14px var(--sans);white-space:nowrap}
.ib:hover{border-color:var(--brass)}
.ib .dot{position:absolute;top:6px;right:6px;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--card)}
.ib svg{width:18px;height:18px;flex:none}
@media (max-width:560px){.ib .lbl{display:none}.ib{padding:0}}

/* hero */
.hero{padding:26px 0 8px;display:grid;gap:16px}
.hero h1{margin:0;font:500 clamp(26px,6vw,44px)/1.08 var(--serif);letter-spacing:-.02em;max-width:18em}
.hero h1 em{font-style:italic;color:var(--accent)}
.hrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;min-height:48px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card)}
.search svg{width:18px;height:18px;flex:none;color:var(--ink2)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:16px}
.search button{border:0;background:none;color:var(--ink2);padding:6px;min-height:36px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:999px;border:1px solid var(--line);background:var(--card);font:600 15px var(--sans);text-decoration:none;color:var(--ink);transition:transform .12s}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff8ee}
@media (prefers-color-scheme:dark){.btn.pri{color:#1b120c}}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px}
.btn.ghosty{background:none}
.btn.warn{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.btn[disabled]{opacity:.5;cursor:default}
.btn svg{width:18px;height:18px}

/* rooms */
.rooms{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:14px 0 4px;margin:0 -16px;padding-left:16px;padding-right:16px;scroll-snap-type:x proximity}
.rooms::-webkit-scrollbar{display:none}
.rooms button{flex:none;display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:none;font:600 14px var(--sans);color:var(--ink2);scroll-snap-align:start}
.rooms button svg{width:18px;height:18px}
.rooms button[aria-selected=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tools{display:flex;align-items:center;gap:8px;padding:10px 0 6px}
.tools .chip{flex:none}
@media (max-width:560px){.seg button span{display:none}.seg button{padding:0 10px}.tools .chip{padding:0 10px}}
.tools .chip{min-height:38px;padding:0 12px;border-radius:999px;border:1px dashed var(--line);background:none;font:500 13px var(--sans);color:var(--ink2)}
.tools .chip[aria-pressed=true]{border-style:solid;border-color:var(--brass);color:var(--ink);background:color-mix(in srgb,var(--brass) 14%,transparent)}
.seg{margin-left:auto;display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--card)}
.seg button{min-height:34px;padding:0 12px;border:0;border-radius:999px;background:none;font:600 13px var(--sans);color:var(--ink2);display:inline-flex;gap:6px;align-items:center}
.seg button svg{width:16px;height:16px}
.seg button[aria-pressed=true]{background:var(--bg2);color:var(--ink)}

/* the house */
.house{padding:6px 0 30px;display:grid;gap:30px}
@media (min-width:1000px){.house.two{grid-template-columns:1fr 1fr;gap:34px 28px}}
.rm h2{margin:0 0 2px;font:600 22px/1.2 var(--serif);display:flex;align-items:center;gap:10px}
.rm h2 svg{width:26px;height:26px}
.rm .line{margin:0 0 12px;color:var(--ink2);font:italic 400 15px/1.4 var(--serif)}
.rmh{position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.case{position:relative;border-radius:10px;padding:14px 12px 0;background:linear-gradient(var(--wood),var(--wood2));box-shadow:var(--shadow)}
.shelf{position:relative;display:flex;flex-wrap:wrap;align-items:flex-end;gap:0 3px;padding:0 6px;border-radius:4px;
  background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,0) 26px) 0 0/100% var(--row) repeat-y,
    repeating-linear-gradient(180deg,var(--back) 0 var(--rowIn),var(--plankHi) var(--rowIn) calc(var(--rowIn) + 3px),var(--plank) calc(var(--rowIn) + 3px) calc(var(--row) - 3px),var(--wood2) calc(var(--row) - 3px) var(--row))}
.slot{height:var(--rowIn);margin-bottom:var(--plankH);display:flex;align-items:flex-end}
.bk{position:relative;display:block;height:var(--h);width:var(--w);padding:0;border:0;border-radius:3px 3px 1px 1px;transform-origin:50% 100%;
  background:linear-gradient(90deg,var(--c2) 0 8%,var(--c) 22% 70%,var(--c2) 100%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25),2px 0 3px -1px rgba(0,0,0,.45);transition:transform .18s ease}
.bk::before,.bk::after{content:"";position:absolute;left:3px;right:3px;height:2px;background:var(--gild);opacity:.8}
.bk::before{top:9%}.bk::after{bottom:7%}
.bk .t{position:absolute;top:16%;bottom:14%;left:0;right:0;writing-mode:vertical-rl;text-align:center;font:600 12px/var(--w) var(--serif);color:var(--tc);letter-spacing:.02em;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bk.wide .t{font-size:13px}
.bk:hover,.bk:focus-visible{transform:translateY(-10px) rotate(0deg)!important;z-index:2}
.bk .rib{position:absolute;top:-2px;right:3px;width:6px;height:28px;background:var(--accent2);clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%)}
.bk .mk{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:12px;height:12px;border-radius:50%;background:var(--brass);box-shadow:0 0 0 2px rgba(0,0,0,.25)}
.bk .mk.req{background:#f4d7d0;width:9px;height:9px;box-shadow:0 0 0 2px var(--accent2)}
.bk.new{animation:glow 2.4s ease 2}
@keyframes glow{50%{box-shadow:0 0 0 3px var(--brass),0 0 22px var(--brass)}}
.bk.add{--c:transparent;--c2:transparent;background:none;border:2px dashed rgba(255,240,210,.45);color:rgba(255,240,210,.85);font:400 26px/1 var(--serif);display:grid;place-items:center;box-shadow:none}
.bk.add::before,.bk.add::after{display:none}
.cat{position:absolute;right:16px;top:-30px;width:46px;height:34px;border:0;background:none;padding:0;z-index:3}
.cat svg{width:100%;height:100%;image-rendering:pixelated}
.empty{display:grid;place-items:center;gap:14px;text-align:center;padding:36px 16px;color:var(--ink2);font:italic 17px/1.5 var(--serif)}
.empty svg{width:120px;height:auto;opacity:.85}

/* list */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:start;text-align:left;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);width:100%}
.card:hover{border-color:var(--brass)}
.card b{display:block;font:600 17px/1.25 var(--serif)}
.card .by{color:var(--ink2);font-size:14px}
.card .nt{margin-top:6px;font:500 19px/1.2 var(--hand);color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font:600 12px var(--sans);background:var(--bg2);color:var(--ink2)}
.tag.a{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.tag.m{background:color-mix(in srgb,var(--brass) 20%,transparent);color:var(--ink)}

/* drawn covers */
.cover{position:relative;aspect-ratio:2/3;width:100%;border-radius:3px 6px 6px 3px;overflow:hidden;color:var(--tc);background:linear-gradient(90deg,var(--c2) 0 7%,var(--c) 12%);background-size:cover;background-position:center;box-shadow:inset 3px 0 0 rgba(0,0,0,.18),0 10px 22px -12px rgba(0,0,0,.6);display:flex;flex-direction:column;justify-content:center;padding:12% 10% 12% 16%;text-align:center}
.cover::before{content:"";position:absolute;inset:7% 7% 7% 12%;border:1px solid var(--gild);opacity:.6;border-radius:2px}
.cover .ct{position:relative;font:600 clamp(10px,2.6vw,20px)/1.15 var(--serif);overflow:hidden;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;word-break:break-word}
.cover .ca{position:relative;margin-top:8%;font:italic 400 clamp(8px,1.8vw,13px)/1.2 var(--serif);opacity:.85}
.cover.img::before,.cover.img .ct,.cover.img .ca{display:none}
.card .cover .ct{font-size:10px}.card .cover .ca{display:none}
.item .cover{padding:10% 8% 10% 16%}.item .cover::before{inset:6% 6% 6% 12%}.item .cover .ct{font-size:7px;-webkit-line-clamp:4}.item .cover .ca{display:none}

/* dialogs */
.scrim{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(20,14,10,.5);animation:fade .2s ease}
@media (min-width:760px){.scrim{align-items:center;padding:24px}}
@keyframes fade{from{opacity:0}}
.sheet{position:relative;width:100%;max-width:720px;max-height:min(92vh,900px);overflow:auto;overscroll-behavior:contain;background:var(--bg);border-radius:22px 22px 0 0;padding:26px 20px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -20px 60px -20px rgba(0,0,0,.5);animation:up .28s cubic-bezier(.2,.8,.2,1)}
@media (min-width:760px){.sheet{border-radius:22px;padding:30px 30px 28px}.sheet.narrow{max-width:520px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet .x{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:22px;line-height:1}
.sheet h3{margin:0 0 6px;padding-right:44px;font:600 25px/1.2 var(--serif);letter-spacing:-.01em}
.sheet .sub{margin:0 0 16px;color:var(--ink2)}
.grab{position:absolute;top:8px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:var(--line)}
@media (min-width:760px){.grab{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.book{display:grid;grid-template-columns:minmax(110px,190px) 1fr;grid-template-areas:"c i" "n n";gap:4px 20px;align-items:start}
.book .bc{grid-area:c}.book .bi{grid-area:i}.book .bn{grid-area:n;min-width:0}
@media (min-width:760px){.book{grid-template-areas:"c i" "c n"}.book .bc{position:sticky;top:0}}
@media (max-width:480px){.book{grid-template-columns:104px 1fr;gap:4px 14px}}
.book .meta{color:var(--ink2);margin:2px 0 10px}
.book .roomline{display:inline-flex;align-items:center;gap:6px;color:var(--ink2);font-size:14px}
.book .roomline svg{width:18px;height:18px}
.note{position:relative;margin:16px 0;padding:16px 18px 14px;background:#fff6d9;color:#3a2a14;border-radius:3px;box-shadow:0 8px 18px -12px rgba(0,0,0,.5);transform:rotate(-.6deg);font:500 23px/1.25 var(--hand)}
.note::before{content:"";position:absolute;top:-9px;left:50%;width:70px;height:18px;margin-left:-35px;background:rgba(220,200,150,.6);transform:rotate(2deg)}
.note .sig{display:block;text-align:right;font-size:20px;opacity:.8;margin-top:6px}
.note.blank{font-style:normal;opacity:.75}
.lcard{margin:16px 0 0;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.lcard ol{background-image:repeating-linear-gradient(180deg,transparent 0 27px,color-mix(in srgb,var(--line) 70%,transparent) 27px 28px)}
.lcard h4{margin:0 0 6px;font:600 12px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.lcard ol{list-style:none;margin:0;padding:0}
.lcard li{line-height:28px;font:500 21px/28px var(--hand)}
.lcard li small{font:400 13px var(--sans);color:var(--ink2);margin-left:6px}
.lcard li.cur{color:var(--accent)}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.acts .btn{flex:1 1 auto}
.quiet{display:inline-flex;align-items:center;gap:6px;margin-top:12px;border:0;background:none;padding:6px 0;color:var(--ink2);font:500 14px var(--sans);text-decoration:underline;text-underline-offset:3px}

/* forms */
.f{display:grid;gap:14px}
.fld{display:grid;gap:6px}
.fld>span{font:600 14px var(--sans)}
.fld small{color:var(--ink2);font-size:13px}
.fld input,.fld textarea{width:100%;min-height:48px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:16px;outline:none}
.fld textarea{min-height:96px;resize:vertical}
.fld input:focus,.fld textarea:focus{border-color:var(--brass);box-shadow:0 0 0 3px color-mix(in srgb,var(--brass) 25%,transparent)}
.fld [aria-invalid=true]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.fld textarea.paper{background:#fff6d9;color:#3a2a14;font:500 22px/1.25 var(--hand)}
.ir{display:flex;gap:8px}.ir input{flex:1;min-width:0}
.lock{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--ok) 10%,transparent);color:var(--ink);font-size:14px}
.lock svg{width:18px;height:18px;flex:none;margin-top:2px;color:var(--ok)}
.warnl{color:var(--accent);font-size:14px;min-height:0}
.lendg{display:grid;grid-template-columns:120px 1fr;gap:18px;align-items:start}
@media (max-width:480px){.lendg{grid-template-columns:86px 1fr;gap:12px}}
.found{display:flex;gap:8px;flex-wrap:wrap}
.found button{padding:0;border:2px solid transparent;border-radius:4px;background:none;width:46px;height:68px;overflow:hidden}
.found button img{width:100%;height:100%;object-fit:cover;display:block}
.found button[aria-pressed=true]{border-color:var(--brass)}
.found .hint{color:var(--ink2);font-size:13px}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:34px;height:34px;border-radius:50%;border:2px solid var(--bg);box-shadow:0 0 0 1px var(--line)}
.sw button[aria-pressed=true]{box-shadow:0 0 0 3px var(--brass)}
.four{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:420px){.four{grid-template-columns:repeat(2,1fr)}}
.four button{display:grid;justify-items:center;gap:4px;padding:10px 6px;min-height:64px;border-radius:12px;border:1px solid var(--line);background:var(--card);font:600 13px var(--sans)}
.four button svg{width:24px;height:24px}
.four button[aria-pressed=true]{border-color:var(--brass);box-shadow:0 0 0 2px var(--brass) inset}

/* welcome */
.steps{list-style:none;margin:18px 0;padding:0;display:grid;gap:12px}
.steps li{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:center;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.steps li svg{width:56px;height:56px}
.steps b{display:block;font:600 18px/1.2 var(--serif)}
.steps span{color:var(--ink2);font-size:15px}
.small{color:var(--ink2);font-size:14px;display:flex;gap:8px;align-items:center}
.small svg{width:16px;height:16px;flex:none}

/* my shelf */
.sec{margin:22px 0 0}
.sec h4{margin:0 0 10px;font:600 13px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);display:flex;align-items:center;gap:8px}
.item{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item b{font:600 16px/1.25 var(--serif)}
.item .s{color:var(--ink2);font-size:14px}
.ask{margin-top:10px;padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--brass)}
.ask .who{font-weight:600}
.ask .c{display:block;margin:4px 0;font:600 15px var(--sans);word-break:break-word;user-select:all}
.ask q{display:block;font:500 20px/1.25 var(--hand);quotes:none}
.ask .acts{margin-top:10px}
.keybox{padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--card)}
.keybox p{margin:0 0 10px;font-size:14px;color:var(--ink2)}
.qr{display:grid;place-items:center;padding:12px;background:#fff;border-radius:10px;margin-top:10px}
.qr svg{max-width:100%;height:auto}
details summary{cursor:pointer;color:var(--ink2);font-size:14px;padding:8px 0;min-height:40px}

/* Nearby + footer */
.town{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;margin:10px 0 30px;padding:16px 18px;border-radius:var(--r);background:#1d1526;color:#f3e7cf;box-shadow:var(--shadow)}
.town svg{width:56px;height:56px;image-rendering:pixelated}
.town b{display:block;font:600 16px/1.3 var(--serif)}
.town span{font-size:14px;opacity:.8}
.town a{color:#1d1526;background:#f6b73c;border-color:#f6b73c}
