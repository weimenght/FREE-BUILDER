: "live", "href": "/tools/showme"}, {"id": "diagnose", "name": "Training or not?", "st": "live", "href": "/tools/diagnose"}]}, {"n": 10, "title": "“Reps pitch too early and freeze on objections.”", "story": "Jordi stays curious a little longer.", "end": "two more questions asked on the next real call before anything is suggested.", "under": "The stated request is rarely the real need, and knowing a technique in a workshop isn't recalling it under pressure.", "build": "Discovery Duet (a client with a hidden need, a pitch bell, no score), and the Sales Academy rebuilt as a pair drill: spaced cards with honest evidence ratings, then a colleague reads the objection and judges whether the reply would land.", "epT": "Curiosity Before the Pitch", "src": "", "still": "https://www.wei-meng.org/portfolio/drama/ep-10.webp?v=024d8aa5a1", "tools": [{"id": "discovery", "name": "Discovery Duet", "st": "live", "href": "/tools/discovery"}, {"id": "sales", "name": "Sales Psychology Academy", "st": "lab", "href": "/labs/sales/"}]}, {"n": 11, "title": "“We ran innovation training. Nothing left the room.”", "story": "Tomás's team interviews a real colleague.", "end": "one real interview, one \"how might we\", one colleague who felt listened to.", "under": "The method was taught, not done; nobody interviewed a real person.", "build": "Design Thinking Odyssey, five worlds where every mechanic is a method, the Crazy 8s clock for the room, and Phase 06 Field: no game, ten minutes with one colleague about a real frustration, an empathy map filled together, their co-signature on the card.", "epT": "Design Thinking, Then a Real Interview", "src": "", "still": "https://www.wei-meng.org/portfolio/drama/ep-11.webp?v=401a6b6c05", "tools": [{"id": "design", "name": "Design Thinking Odyssey", "st": "live", "href": "/tools/design/"}]}, {"n": 12, "title": "“Handover errors keep showing up in incident reports.”", "story": "The same move, on a hospital ward.", "end": "a shift change that starts with the worry.", "under": "A listening problem dressed as a documentation problem: the incoming shift hears a list and can't tell what the outgoing one is worried about.", "build": "Handover Duet, the first 90 seconds of the handover that already happens: say the worry before the list, play it back, \"did they get the worry?\". Nothing recorded. A sister episode takes the same move to a hospital ward.", "epT": "The Worry First", "src": "", "still": "https://www.wei-meng.org/portfolio/drama/ep-12.webp?v=a6710ee85a", "tools": [{"id": "handover", "name": "Handover Duet", "st": "live", "href": "/tools/handover"}, {"id": "listen", "name": "Listening Duet", "st": "live", "href": "/tools/listen"}]}], "coda": null, "others": [{"num": "I", "name": "The ask", "href": "/programmes/the-ask/"}, {"num": "II", "name": "The room goes quiet", "href": "/programmes/the-room-goes-quiet/"}, {"num": "IV", "name": "After the cut", "href": "/programmes/after-the-cut/"}], "trailerSrc": "https://media.wei-meng.org/corporate-survival-drama-trailer.mp4"}, "zh": {"kicker": "项目 · 第 {n} 幕 · {m}", "story": "故事到这里", "howK": "怎么进行", "how": [["一起看", "一集短片，在同一个房间里，手机放下。然后争论一下。"], ["两人一组", "两个人，一部手机，每个工具两分钟，用你们自己的情境。"], ["带到周一", "每个工具都以一件周一要试的事和一种传下去的方式收尾。"]], "epK": "一起看", "epLead": "每个案例一集，为在同一个房间里看、然后争论而做。第一批样片正在制作中。", "ep": "第 {n} 集", "soon": "制作中", "watch": "一起看", "trailer": "先看预告片", "casesK": "案例和它们的工具", "case": "案例 {n}", "read": "读这个案例", "ends": "结束于", "tagLive": "已上线", "tagLab": "实验室", "tagConcept": "下一个", "tagDrama": "一起看", "conceptHint": "正在做的下一个；在客户项目中会先为你的团队构建", "monday": "周一试试这个", "codaK": "然后是十二月", "otherK": "其他几幕", "ctaK": "你的人，你的案例", "ctaH": "和你的团队一起走这一幕。", "ctaT": "三十分钟，不用幻灯片。带一次开得不好的会来，我们从那里开始。", "ctaGo": "开始对话", "runK": "作为一次课程来带", "runT": "大约一小时，一个房间：带课页面负责计时，把每个工具送到大家手机上，再把全场的约定收进一张可打印的纸。", "runGo": "打开带课页面", "runMin": "大约 {m} 分钟", "ctaAll": "全部十三个案例", "title": "新人，新工具 — FREE//BUILDER", "num": "III", "name": "新人，新工具", "months": "七月到十月", "arc": "Mei 的第一天是玩出来的，不是听出来的；她和 Ana 的第三十天谈话，在库房里完成。AI 许可证到了，Leo 给 Mei 看了一个真实的用法。Jordi 不再过早推销。Tomás 的产品团队去采访了一位真实的同事。", "who": "给新人和新工具：玩出来的第一天，一次一个同事地展示 AI，先好奇再推销，一次真实采访，以及先说担心的交接。", "mondayTxt": "这周，坐到一位新同事旁边，给 TA 看一个你真实的工作方式，哪怕做得不好。", "run": "/programmes/new-people-new-tools/run/", "cases": [{"n": 8, "title": "“入职就是一本手册加一套幻灯片。”", "story": "Mei 的第一天，是玩出来的。", "end": "一位见过六个真人、被用自己的语言问过一个真实问题的新人。", "under": "第一天是被讲出来的，不是玩出来的；第一个月里没有一次对话。", "build": "用启航台过第一天（路线卡、站点工具、通往真人的同事小径、一面没有领奖台的墙），第五周每位经理做“第三十天”，用教回去链条让每个新人教下一个。", "epT": "最初的九十天", "src": "", "still": "https://www.wei-meng.org/portfolio/drama/ep-08.webp?v=da80522f68", "tools": [{"id": "launchpad", "name": "启航台", "st": "lab", "href": "/labs/launchpad/"}, {"id": "day30", "name": "第三十天", "st": "live", "href": "/tools/day30"}, {"id": "teachback", "name": "教回去链条", "st": "live", "href": "/tools/teachback"}]}, {"n": 9, "title": "“AI 许可证买了，使用率 20%。”", "story": "Leo 给 Mei 看了一个真实用法。", "end": "一位先示范、示范得不好的经理，和一份调查问卷从未得到的真实用例清单。", "under": "障碍是社交性的：人们怕显得慢、怕被替代。工具的好坏取决于怎么提问，而提问是一项人的能力。", "build": "提示搭档（同事扮演 AI，里面没有 AI）、“给我看看你的”（每人展示一个真实用法，或一件放弃了的事；链条把它传给第三个人），以及在任何人订课之前先做诊断。", "epT": "AI，一次一个同事", "src": "", "still": "https://www.wei-meng.org/portfolio/drama/ep-09.webp?v=a42b55e759", "tools": [{"id": "prompt", "name": "提示搭档", "st": "live", "href": "/tools/prompt"}, {"id": "showme", "name": "给我看看你的", "st": "live", "href": "/tools/showme"}, {"id": "diagnose", "name": "要不要培训？", "st": "live", "href": "/tools/diagnose"}]}, {"n": 10, "title": "“销售推销得太早，遇到异议就卡住。”", "story": "Jordi 多保持了一会儿好奇。", "end": "下一次真实通话里，在提任何建议之前多问的两个问题。", "under": "说出口的需求很少是真正的需要；在工作坊里懂一个技巧，不等于压力下想得起来。", "build": "探询二重奏（一位藏着真实需要的客户、一只推销铃、没有分数），以及重建为双人演练的销售训练营：带诚实证据评级的间隔卡片，然后由同事念出异议，判断这句回答能不能落地。", "epT": "先好奇，再推销", "src": "", "still": "https://www.wei-meng.org/portfolio/drama/ep-10.webp?v=024d8aa5a1", "tools": [{"id": "discovery", "name": "探询二重奏", "st": "live", "href": "/tools/discovery"}, {"id": "sales", "name": "销售心理学训练营", "st": "lab", "href": "/labs/sales/"}]}, {"n": 11, "title": "“我们办了创新培训。什么都没走出那间屋子。”", "
