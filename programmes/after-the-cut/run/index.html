function clockHtml(i) {
  const s = p(), c = clk(i), l = left(c);
  return `<div class="clock${l <= 60 ? " low" : ""}" id="clock" aria-live="off">${mmss(l)}</div><p class="over" id="over" aria-live="polite">${l === 0 ? esc(s.over) : ""}</p>
    <div class="btns"><button type="button" class="b pri" data-a="run">${esc(c.end ? s.pause : (c.left < steps()[i].min * 60 ? s.resumeT : s.go))}</button><button type="button" class="b ghost" data-a="plus">${esc(s.plus)}</button></div>`;
}
function nav(i) {
  const s = p(), n = steps().length;
  const nextLabel = i === n - 2 ? s.toClose : i === n - 1 ? s.finish : s.next;
  return `<div class="btns" style="margin-top:26px"><button type="button" class="b ghost" data-a="prev">‹ ${esc(s.prev)}</button><button type="button" class="b pri" data-a="next">${esc(nextLabel)} ›</button></div>`;
}
function head(i, title) {
  const s = p(), st = steps()[i];
  return `<a class="crumb" href="${s.prog}">${esc(s.back)}</a>${bar()}<span class="kicker">${esc(s.step.replace("{i}", i + 1).replace("{n}", steps().length))} · ${esc(s.min.replace("{m}", st.min))}${st.b ? " · " + esc(fmtName(st.b.fmt)) : ""}</span><h1>${esc(title)}</h1>`;
}

function start() {
  const s = p(), b = s.blocks, began = S.step >= 0;
  const row = (m, t, f, w) => `<li><span class="m">${esc(s.min.replace("{m}", m))}</span><b>${esc(t)}</b><i>${esc(f)}</i>${w ? `<span class="w">${esc(w)}</span>` : ""}</li>`;
  return `<a class="crumb" href="${s.prog}">${esc(s.back)}</a>
    <span class="kicker" style="display:block;margin-top:14px">${esc(s.kicker.replace("{n}", s.num).replace("{p}", s.name))}</span>
    <h1>${esc(s.name)}</h1><p class="lead2">${esc(s.lead)}</p>
    <span class="kicker">${esc(s.agenda)}</span>
    <ol class="ag">${row(s.openMin, s.openT, s.fmt.room, s.openQ)}${b.map(x => row(x.min, x.name, fmtName(x.fmt), x.why)).join("")}${row(s.closeMin, s.closeT, s.fmt.room, "")}<li class="tot">${esc(s.total.replace("{m}", total()))}</li></ol>
    <div class="row2"><label class="field"><span>${esc(s.team)}</span><input id="team" maxlength="60" value="${esc(S.team)}" placeholder="${esc(s.teamPh)}"></label>
      <label class="field"><span>${esc(s.who)}</span><input id="who" maxlength="40" value="${esc(S.who)}" placeholder="${esc(s.whoPh)}"></label></div>
    <div class="btns">${began ? `<button type="button" class="b pri" data-a="resume">${esc(s.resume)} ›</button><button type="button" class="b ghost" data-a="fresh">${esc(s.fresh)}</button>` : `<button type="button" class="b pri" data-a="begin">${esc(s.start)} ›</button>`}
      <button type="button" class="b ghost" data-a="printAgenda">${esc(s.printAgenda)}</button></div>
    <p class="note" style="margin-top:14px">${esc(s.device)}</p>`;
}
function openStep(i) {
  const s = p();
  return head(i, s.openT) + `<div class="stage"><div><p class="why">${esc(s.openQ)}</p>${clockHtml(i)}</div>
    <div><div class="card2"><span class="kicker">${esc(s.setup)}</span><p>${esc(s.openSet)}</p></div>
    <div class="card2"><span class="kicker">${esc(s.notes)}</span><ul>${s.openNotes.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div></div></div>` + nav(i);
}
function toolStep(i) {
  const s = p(), b = steps()[i].b, qr = typeof qrSvg === "function" ? qrSvg(url(b), b.name) : null;
  return head(i, b.name) + `<div class="stage"><div><p class="why">${esc(b.why)}</p>${clockHtml(i)}
      <div class="card2" style="margin-top:18px"><span class="kicker">${esc(s.setup)}</span><p>${esc(b.setup)}</p></div>
      <div class="card2"><span class="kicker">${esc(s.notes)}</span><ul>${b.notes.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
      <div class="card2"><span class="kicker">${esc(s.debrief)}</span><ul>${b.debrief.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div></div>
    <div class="card2 qr"><span class="kicker">${esc(s.open)}</span>${qr || ""}<a href="${esc(url(b))}" target="_blank" rel="noopener">${esc(short(b))}</a></div></div>` + nav(i);
}
function closeStep(i) {
  const s = p();
  const li = (a, j) => `<li><input data-f="w" data-j="${j}" maxlength="140" value="${esc(a.w)}" placeholder="${esc(s.what)}" aria-label="${esc(s.what)}"><input data-f="who" data-j="${j}" maxlength="40" value="${esc(a.who)}" placeholder="${esc(s.whoD)}" aria-label="${esc(s.whoD)}"><input type="date" data-f="by" data-j="${j}" value="${esc(a.by)}" aria-label="${esc(s.by)}">${S.agr.length > 1 ? `<button type="button" class="x" data-a="rm" data-j="${j}">${esc(s.remove)}</button>` : ""}</li>`;
  return head(i, s.closeT) + `<p class="lead2">${esc(s.closeLead)}</p>${clockHtml(i)}
    <ol class="agr" id="agr">${S.agr.map(li).join("")}</ol>
    <div class="btns"><button type="button" class="b ghost" data-a="add" ${S.agr.length >= 12 ? "disabled" : ""}>${esc(s.add)}</button></div>
    <div class="monday" style="margin-top:22px"><b>${esc(s.mondayK)}</b>${esc(s.monday)}</div>
    <div class="btns"><button type="button" class="b" data-a="print">${esc(s.print)}</button><button type="button" class="b ghost" data-a="copy">${esc(s.copy)}</button><button type="button" class="b ghost" data-a="ics" ${S.agr.some(a => a.by && a.w) ? "" : "disabled"}>${esc(s.cal)}</button></div>
    <p class="msg" id="msg" aria-live="polite"></p>` + nav(i);
}
function endStep() {
  const s = p();
  return `<div class="done"><span class="kicker">${esc(s.name)}</span><h1>${esc(s.endT)}</h1><p class="lead2" style="margin:0 auto 18px">${esc(s.endLead)}</p>
    <div class="btns" style="justify-content:center"><button type="button" class="b" data-a="print">${esc(s.print)}</button><button type="button" class="b ghost" data-a="back">‹ ${esc(s.prev)}</button><a class="b ghost" href="${s.prog}">${esc(s.back)}</a></div></div>`;
}

function sheet(agenda) {
  const s = p(), n = steps(), rows = S.agr.filter(a => a.w.trim());
  const meta = [S.team, S.who, S.date].filter(Boolean).map(esc).join(" · ");
  const tools = s.blocks.map(b => `<tr><td>${esc(b.name)}</td><td>${esc(short(b))}</td></tr>`).join("");
  if (agenda) return `<h1>${esc(s.name)}</h1><div class="meta">${meta}</div><h2>${esc(s.agenda)}</h2><table>${n.map(x => `<tr><td style="width:70px">${esc(s.min.replace("{m}", x.min))}</td><td><b>${esc(x.k === "open" ? s.openT : x.k === "close" ? s.closeT : x.b.name)}</b><br>${esc(x.k === "open" ? s.openQ : x.k === "close" ? s.closeLead : x.b.why)}</td><td style="width:110px">${esc(x.b ? fmtName(x.b.fmt) : s.fmt.room)}</td></tr>`).join("")}</table><p class="meta">${esc(s.total.replace("{m}", total()))}</p><div class="foot">FREE//BUILDER · freebuilder.net</div>`;
  const blanks = Math.max(0, 5 - rows.length);
  return `<h1>${esc(s.sheetT)}</h1><div class="meta">${esc(s.name)}${meta ? " · " + meta : ""}</div>
    <table><tr><th>${esc(s.what)}</th><th style="width:26%">${esc(s.whoD)}</th><th style="width:18%">${esc(s.by)}</th></tr>${rows.map(a => `<tr><td>${esc(a.w)}</td><td>${esc(a.who)}</td><td>${esc(a.by)}</td></tr>`).join("")}${"<tr class=blank><td></td><td></td><td></td></tr>".repeat(blanks)}</table>
    <div class="mon"><b>${esc(s.mondayK)}.</b> ${esc(s.monday)}</div>
    <h2>${esc(s.sheetTools)}</h2><table>${tools}</table><div class="foot">FREE//BUILDER · freebuilder.net</div>`;
}
function doPrint(agenda) { $("#print").innerHTML = sheet(agenda); window.print(); }
function text() {
  const s = p(), rows = S.agr.filter(a => a.w.trim());
  return [s.sheetT + " · " + s.name + (S.team ? " · " + S.team : "") + " · " + S.date, ""].concat(rows.map(a => "• " + a.w + (a.who ? " (" + a.who + ")" : "") + (a.by ? " · " + a.by : "")), ["", s.mondayK + ": " + s.monday]).join("\n");
}
function ics() {
  const z = n => String(n).padStart(2, "0"), d = new Date(), stamp = d.getUTCFullYear() + z(d.getUTCMonth() + 1) + z(d.getUTCDate()) + "T" + z(d.getUTCHours()) + z(d.getUTCMinutes()) + "00Z";
  const fold = t => String(t).replace(/[\\;,]/g, m => "\\" + m).replace(/\n/g, "\\n");
  const ev = S.agr.filter(a => a.w.trim() && /^\d{4}-\d\d-\d\d$/.test(a.by)).map((a, j) => {
    const day = a.by.replace(/-/g, ""), nx = new Date(a.by + "T12:00:00"); nx.setDate(nx.getDate() + 1);
    const sum = a.who ? p().calEv.replace("{w}", a.w).replace("{who}", a.who) : a.w;
    return ["BEGIN:VEVENT", "UID:" + SLUG + "-" + Date.now() + "-" + j + "@freebuilder.net", "DTSTAMP:" + stamp, "DTSTART;VALUE=DATE:" + day, "DTEND;VALUE=DATE:" + nx.getFullYear() + z(nx.getMonth() + 1) + z(nx.getDate()), "SUMMARY:" + fold(sum), "DESCRIPTION:" + fold(p().name), "END:VEVENT"].join("\r\n");
  });
  if (!ev.length) return;
  const blob = new Blob(["BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//FREE//BUILDER//session//EN\r\n" + ev.join("\r\n") + "\r\nEND:VCALENDAR\r\n"], { type: "text/calendar" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = SLUG + "-" + S.date + ".ics"; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  say(p().calMade);
}
function say(t) { const m = $("#msg"); if (m) { m.textContent = t; clearTimeout(say.t); say.t = setTimeout(() => { m.textContent = ""; }, 4000); } }

function render(keepFocus) {
  const s = p(); const n = steps().length;
  document.documentElement.lang = (/*i18n*/lang === "zh" ? "zh-CN" : (lang === "zh-Hant" ? "zh-TW" : lang));
  document.title = s.title;
  const i = S.step;
  $("#main").innerHTML = i < 0 ? start() : i >= n ? endStep() : i === 0 ? openStep(i) : i === n - 1 ? closeStep(i) : toolStep(i);
  try { localStorage.setItem("wm_preferred_lang", lang); } catch (e) {}
  if (!keepFocus) { const h = $("#main h1"); if (h && i >= 0) { h.tabIndex = -1; h.focus({ preventScroll: true }); } }
}
function upd() {
  const i = S.step; if (i < 0 || i >= steps().length) return;
  const c = clk(i), l = left(c), el = $("#clock"); if (!el) return;
  el.textContent = mmss(l); el.classList.toggle("low", l <= 60);
  if (c.end && l === 0) { c.left = 0; c.end = 0; save(); $("#over").textContent = p().over; if (navigator.vibrate) try { navigator.vibrate([200, 100, 200]); } catch (e) {} chime(); const r = $('[data-a="run"]'); if (r) r.textContent = p().resumeT; }
}
let AC = null;
function chime() { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const t = AC.currentTime; [660, 880].forEach((f, k) => { const o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = f; g.gain.setValueAtTime(0.0001, t + k * .25); g.gain.exponentialRampToValueAtTime(.18, t + k * .25 + .02); g.gain.exponentialRampToValueAtTime(.0001, t + k * .25 + .9); o.connect(g).connect(AC.destination); o.start(t + k * .25); o.stop(t + k * .25 + 1); }); } catch (e) {} }
function go(i) {
  const c = S.clocks[S.step]; if (c && c.end) { c.left = left(c); c.end = 0; }   // a step left behind stops its clock
  S.step = Math.max(-1, Math.min(steps().length, i)); save(); render(); window.scrollTo(0, 0);
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-a]"); if (!t) return; const a = t.dataset.a, i = S.step;
  if (a === "begin") { S.team = ($("#team") || {}).value || ""; S.who = ($("#who") || {}).value || ""; S.clocks = {}; S.date = new Date().toISOString().slice(0, 10); go(0); }
  else if (a === "resume") { S.team = $("#team").value; S.who = $("#who").value; go(S.step < 0 ? 0 : S.step); }
  else if (a === "fresh") { const team = $("#team").value, who = $("#who").value; S = fresh(); S.team = team; S.who = who; go(0); }
  else if (a === "printAgenda") { S.team = $("#team").value; S.who = $("#who").value; save(); doPrint(true); }
  else if (a === "next") go(i + 1);
  else if (a === "prev") go(i - 1);
  else if (a === "back") go(steps().length - 1);
  else if (a === "run") { const c = clk(i); if (c.end) { c.left = left(c); c.end = 0; } else { if (c.left === 0) c.left = 60; c.end = Date.now() + c.left * 1000; $("#over").textContent = ""; chime.ok = 1; } save(); t.textContent = c.end ? p().pause : p().resumeT; upd(); }
  else if (a === "plus") { const c = clk(i); if (c.end) c.end += 120000; else c.left += 120; $("#over").textContent = ""; save(); upd(); }
  else if (a === "add") { if (S.agr.length < 12) { S.agr.push({ w: "", who: "", by: "" }); save(); render(true); const l = document.querySelectorAll('#agr [data-f="w"]'); l[l.length - 1].focus(); } }
  else if (a === "rm") { S.agr.splice(+t.dataset.j, 1); save(); render(true); }
  else if (a === "print") doPrint(false);
  else if (a === "copy") { const tx = text(); (navigator.clipboard ? navigator.clipboard.writeText(tx) : Promise.reject()).then(() => say(p().copied), () => { const ta = document.createElement("textarea"); ta.value = tx; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); say(p().copied); } catch (e) {} ta.remove(); }); }
  else if (a === "ics") ics();
});
document.addEventListener("input", e => {
  const f = e.target.dataset && e.target.dataset.f; if (!f) { if (e.target.id === "team" || e.target.id === "who") { S[e.target.id] = e.target.value; save(); } return; }
  const j = +e.target.dataset.j; if (S.agr[j]) { S.agr[j][f] = e.target.value; save(); const b = $('[data-a="ics"]'); if (b) b.disabled = !S.agr.some(a => a.by && a.w.trim()); }
});
document.addEventListener("keydown", e => {
  if (e.target.closest("input, textarea") || S.step < 0) return;
  if (e.key === " " && S.step < steps().length) { e.preventDefault(); const r = $('[data-a="run"]'); if (r) r.click(); }
  else if (e.key === "ArrowRight") go(S.step + 1); else if (e.key === "ArrowLeft") go(S.step - 1);
});
tick = setInterval(upd, 250);
document.addEventListener("visibilitychange", upd);
window.FBL_SET = l => { lang = l; render(true); }; window.FBL_GET = () => lang;
let saved = null; try { saved = localStorage.getItem("wm_preferred_lang"); } catch (e) {}
const nv = (navigator.language || "").toLowerCase();
lang = ["en", "zh", "zh-Hant", "es", "ca"].includes(saved) ? saved : nv.startsWith("zh") ? "zh" : nv.startsWith("es") ? "es" : "en";
render(true);
window.FBRun = { get S() { return S; }, go, steps, ff(sec) { const c = clk(S.step); if (c.end) c.end -= sec * 1000; else c.left = Math.max(0, c.left - sec); upd(); } };
})();
</script>
