    .between { justify-content:space-between; }
    .wrap { flex-wrap:wrap; }
    .grow { flex:1; min-width:0; }
    .stack { display:flex; flex-direction:column; gap:8px; }
    .narrow { max-width:600px; width:100%; margin:0 auto; }
    .meta { font-size:12px; color:var(--muted); }
    .label { font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
    .h2 { font-family:var(--serif); font-weight:700; font-size:20px; margin:0; }
    .empty { padding:28px 16px; text-align:center; color:var(--muted); font-size:14px; }

    /* Buttons */
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:46px; padding:0 16px; border-radius:14px;
      font-weight:700; font-size:14px; border:1px solid var(--border); background:var(--card); color:var(--text); transition:transform .08s, background .15s; }
    .btn:active { transform:scale(.97); }
    .btn.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
    .btn.ghost { background:transparent; }
    .btn.sm { min-height:36px; padding:0 12px; font-size:13px; border-radius:11px; }
    .btn.block { width:100%; }
    .btn.square { width:46px; padding:0; flex:none; }
    .btn.ok { background:var(--ok-soft); color:var(--ok); border-color:var(--ok-line); }
    .btn.warn { background:var(--warn-soft); color:var(--warn); border-color:var(--warn-line); }
    .btn.bad { background:var(--bad-soft); color:var(--bad); border-color:var(--bad-line); }
    .seg { display:flex; padding:3px; gap:3px; background:var(--surface); border:1px solid var(--border); border-radius:12px; }
    .seg button { flex:1; height:32px; padding:0 10px; border-radius:9px; font-size:12px; font-weight:700; color:var(--muted); white-space:nowrap; }
    .seg button.on { background:var(--card); color:var(--text); box-shadow:var(--shadow); }
    .tag { display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; background:var(--surface); color:var(--muted); white-space:nowrap; }
    .tag.accent { background:var(--accent-soft); color:var(--accent); }
    .tag.ok { background:var(--ok-soft); color:var(--ok); } .tag.warn { background:var(--warn-soft); color:var(--warn); } .tag.bad { background:var(--bad-soft); color:var(--bad); }

    /* Inputs (16px minimum: prevents iOS zoom) */
    .field { display:flex; flex-direction:column; gap:6px; }
    .input, .select, .textarea { width:100%; font-size:16px; padding:12px 14px; border-radius:12px; border:1px solid var(--border); background:var(--surface);
      color:var(--text); outline:none; -webkit-appearance:none; appearance:none; transition:border-color .15s, box-shadow .15s; }
    .input:focus, .select:focus, .textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
    .select { background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
      background-position:calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size:5px 5px; background-repeat:no-repeat; padding-right:36px; }
    .textarea { resize:vertical; min-height:72px; line-height:1.4; }
    .answer { text-align:center; font-size:22px; font-weight:700; padding:14px 48px; background:var(--card); }
    .answer.ok { border-color:var(--ok); background:var(--ok-soft); }
    .answer.warn { border-color:var(--warn); background:var(--warn-soft); }
    .answer.bad { border-color:var(--bad); background:var(--bad-soft); }
    .search { position:relative; flex:1; }
    .search .ic { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none; }
    .search .input { padding-left:38px; }
    .keys { display:grid; grid-template-columns:repeat(9, minmax(0, 44px)); justify-content:center; gap:5px; }
    .key { width:100%; height:42px; border-radius:10px; background:var(--surface); border:1px solid var(--border); font-weight:700; font-size:16px; }
    .key:active { background:var(--border); }
    .switch { position:relative; width:46px; height:28px; flex:none; }
    .switch input { opacity:0; width:100%; height:100%; margin:0; position:absolute; z-index:1; cursor:pointer; }
    .switch span { position:absolute; inset:0; border-radius:999px; background:var(--border); transition:background .2s; }
    .switch span::after { content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:transform .2s; }
    .switch input:checked + span { background:var(--accent); }
    .switch input:checked + span::after { transform:translateX(18px); }
    .setting { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0; border-bottom:1px solid var(--border); }
    .setting:last-child { border-bottom:0; }
    .setting .t { font-weight:600; font-size:14px; } .setting .d { font-size:12px; color:var(--muted); }

    /* Feedback */
    .fb { padding:12px 14px; border-radius:14px; border:1px solid; font-size:14px; font-weight:600; text-align:center; }
    .fb.ok { background:var(--ok-soft); color:var(--ok); border-color:var(--ok-line); }
    .fb.warn { background:var(--warn-soft); color:var(--warn); border-color:var(--warn-line); }
    .fb.bad { background:var(--bad-soft); color:var(--bad); border-color:var(--bad-line); }
    .fb .big { font-size:18px; font-weight:800; display:block; margin-top:2px; }
    .shake { animation:shake .25s ease-in-out; }
    @keyframes shake { 25% { transform:translateX(-5px);} 75% { transform:translateX(5px);} }
    .pop { animation:pop .3s ease; }
    @keyframes pop { 50% { transform:scale(1.04);} }

    /* ============ FLASHCARD ============ */
    .progress { height:4px; border-radius:999px; background:var(--surface); overflow:hidden; }
    .progress > i { display:block; height:100%; width:0; background:var(--accent); border-radius:inherit; transition:width .25s; }
    .scene { -webkit-perspective:1200px; perspective:1200px; height:clamp(250px, calc(100vh - 400px), 440px); height:clamp(250px, calc(100dvh - 400px), 440px); touch-action:pan-y; user-select:none; -webkit-user-select:none; cursor:pointer; }
    .flip { position:relative; width:100%; height:100%; -webkit-transform-style:preserve-3d; transform-style:preserve-3d; transition:transform .45s cubic-bezier(.2,.7,.2,1); }
    .flip.on { -webkit-transform:rotateY(180deg); transform:rotateY(180deg); }
    .flip.swipe { transition:transform .45s cubic-bezier(.2,.7,.2,1), opacity .2s; }
    .face { position:absolute; inset:0; -webkit-backface-visibility:hidden; backface-visibility:hidden; display:flex; flex-direction:column; padding:16px; border-radius:20px;
      background:var(--card); border:1px solid var(--border); box-shadow:var(--shadow); overflow:hidden; }
    .face.back { -webkit-transform:rotateY(180deg); transform:rotateY(180deg); border-top:3px solid var(--accent); }
    .face-mid { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:8px; min-height:0; padding:4px 6px; }
    .term { font-family:var(--serif); font-weight:700; font-size:clamp(28px, 8.5vw, 44px); line-height:1.12; margin:0; word-break:break-word; hyphens:auto; }
    .meaning { font-family:var(--serif); font-weight:700; font-size:clamp(22px, 6vw, 30px); margin:0; line-height:1.2; }
    .example { font-size:15px; color:var(--muted); font-style:italic; margin:0; max-width:34em; }
    .back-scroll { overflow-y:auto; -webkit-overflow-scrolling:touch; width:100%; }
    .note-box { width:100%; margin-top:8px; text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:8px 10px; }
    .note-box textarea { width:100%; border:0; outline:0; background:transparent; resize:none; font-size:16px; line-height:1.35; color:var(--text); padding:0; }
    .hint-line { font-size:12px; color:var(--muted); text-align:center; display:flex; align-items:center; justify-content:center; gap:6px; }
    .rate { display:grid; grid-template-columns:46px 1fr 1fr 1fr 46px; gap:6px; }
    .rate .btn { padding:0 6px; font-size:13px; flex-direction:column; gap:0; line-height:1.1; }
    .rate .btn small { font-size:10px; font-weight:600; opacity:.7; }
    .kbd { display:none; }
    @media (hover:hover) and (pointer:fine) { .kbd { display:inline; font-family:var(--mono); font-size:10px; opacity:.6; } }

    /* ============ LISTS ============ */
    .list { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
    .li { display:flex; align-items:center; gap:8px; padding:12px 12px 12px 14px; border-bottom:1px solid var(--border); }
    .li:last-child { border-bottom:0; }
    .li .w { font-weight:700; }
    .li .s { font-size:13px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; }
    .li .x { font-size:12px; color:var(--muted); font-style:italic; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .li .n { font-size:12px; color:var(--warn); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .li-acts { display:flex; flex:none; }
    .li-acts .icon-btn { width:38px; height:38px; }

    /* ============ VERBS ============ */
    .prompt { text-align:center; padding:18px 16px; }
    .prompt .inf { font-family:var(--serif); font-size:clamp(30px, 9vw, 42px); font-weight:700; margin:4px 0 0; line-height:1.1; }
    .badges { display:flex; justify-content:center; gap:6px; flex-wrap:wrap; }
    .pron { font-size:20px; font-weight:800; color:var(--accent); margin-top:6px; }
    .mini-table { display:grid; grid-template-columns:auto 1fr; gap:2px 12px; font-size:14px; text-align:left; max-width:320px; margin:8px auto 0; }
    .mini-table .p { color:var(--muted); font-size:12px; align-self:center; }
    .mini-table .hl { color:var(--accent); font-weight:800; }
    .choices { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .choice { min-height:60px; padding:10px; border-radius:14px; border:1px solid var(--border); background:var(--card); font-weight:700; font-size:16px; line-height:1.2; }
    .choice:disabled { opacity:1; cursor:default; }
    .choice.ok { border-color:var(--ok); background:var(--ok-soft); color:var(--ok); }
    .choice.bad { border-color:var(--bad); background:var(--bad-soft); color:var(--bad); }
    .choice .k { display:none; }
    @media (hover:hover) and (pointer:fine) { .choice .k { display:inline; font-family:var(--mono); font-size:10px; color:var(--muted); margin-right:6px; } }
    .tgrid { display:grid; grid-template-columns:1fr; gap:10px; }
    @media (min-width:640px) { .tgrid { grid-template-columns:1fr 1fr; } }
    @media (min-width:900px) { .tgrid { grid-template-columns:1fr 1fr 1fr; } }
    .tcard { padding:12px 14px; }
    .tcard h3 { margin:0 0 6px; font-size:13px; font-weight:800; display:flex; justify-content:space-between; align-items:center; gap:6px; }
    .trow { display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-top:1px dashed var(--border); font-size:14px; cursor:pointer; }
    .trow .p { color:var(--muted); font-size:12px; white-space:nowrap; }
    .trow .f { font-weight:700; text-align:right; }
    .trow .alt { color:var(--muted); font-weight:500; font-size:12px; }
    .streak-pill { display:inline-flex; align-items:center; gap:4px; font-weight:800; font-size:13px; color:var(--warn); }

    /* ============ DICTATION ============ */
    .diff { font-size:18px; line-height:1.8; text-align:center; }
    .diff span { padding:1px 4px; border-radius:6px; margin:0 1px; }
    .diff .ok { color:var(--ok); background:var(--ok-soft); }
    .diff .warn { color:var(--warn); background:var(--warn-soft); }
    .diff .miss { color:var(--bad); background:var(--bad-soft); text-decoration:underline wavy; }
    .gq { font-size:clamp(20px, 5.5vw, 26px); font-family:var(--serif); font-weight:700; text-align:center; line-height:1.35; margin:6px 0; }
    .gq .blank { display:inline-block; min-width:64px; border-bottom:3px solid var(--accent); color:var(--accent); }

    /* ============ STATS ============ */
    .kpis { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    @media (min-width:640px) { .kpis { grid-template-columns:repeat(4,1fr); } }
    .kpi { padding:14px; }
    .kpi .v { font-size:24px; font-weight:800; line-height:1.1; font-variant-numeric:tabular-nums; }
    .kpi .l { font-size:12px; color:var(--muted); margin-top:2px; }
    .hero { display:flex; align-items:center; gap:16px; padding:16px; }
    .ring { width:92px; height:92px; flex:none; position:relative; }
    .ring svg { width:100%; height:100%; transform:rotate(-90deg); }
    .ring .c { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.1; }
    .ring .c b { font-size:20px; } .ring .c small { font-size:11px; color:var(--muted); }
    .heat-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:4px; }
    .heat { display:grid; grid-auto-flow:column; grid-template-rows:repeat(7, 13px); grid-auto-columns:13px; gap:3px; }
    .heat i { border-radius:3px; background:var(--h0); }
    .heat i.l1 { background:var(--h1);} .heat i.l2 { background:var(--h2);} .heat i.l3 { background:var(--h3);} .heat i.l4 { background:var(--h4);}
    .heat i.fut { background:transparent; }
    .heat i.today { box-shadow:inset 0 0 0 1.5px var(--text); }
    .legend { display:flex; align-items:center; gap:3px; font-size:11px; color:var(--muted); }
    .legend i { width:11px; height:11px; border-radius:3px; display:inline-block; }
    .bars7 { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; align-items:end; height:130px; padding-top:18px; }
    .b7 { display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:4px; font-size:11px; color:var(--muted); }
    .b7 .bar { width:100%; max-width:34px; background:var(--accent); border-radius:4px 4px 0 0; min-height:2px; position:relative; }
    .b7 .bar.zero { background:var(--border); }
    .b7 .val { font-size:11px; font-weight:700; color:var(--text); font-variant-numeric:tabular-nums; }
    .b7.today .d { color:var(--text); font-weight:800; }
    .hbar { display:grid; grid-template-columns:minmax(90px, 38%) 1fr 64px; gap:8px; align-items:center; font-size:13px; padding:5px 0; }
    .hbar .track { height:10px; background:var(--surface); border-radius:999px; overflow:hidden; }
    .hbar .track i { display:block; height:100%; background:var(--accent); border-radius:999px; }
    .hbar .pct { text-align:right; font-variant-numeric:tabular-nums; font-weight:700; }
    .hbar .pct small { display:block; font-weight:500; color:var(--muted); font-size:10px; }
    .stackbar { display:flex; height:12px; border-radius:999px; overflow:hidden; background:var(--surface); gap:2px; }
    .stackbar i { display:block; height:100%; }
    .st-m { background:var(--ok); } .st-r { background:var(--warn); } .st-n { background:var(--border); }
    .sess { display:grid; grid-template-columns:1fr auto auto; gap:8px; align-items:center; padding:10px 14px; border-bottom:1px solid var(--border); font-size:13px; }
    .sess:last-child { border-bottom:0; }

    /* ============ SHEET / TOAST ============ */
    .backdrop { position:fixed; inset:0; z-index:80; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; justify-content:center; animation:fadeIn .15s; }
    @keyframes fadeIn { from { opacity:0; } }
    .sheet { width:100%; max-width:560px; max-height:88vh; max-height:88dvh; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
      background:var(--card); border-radius:22px 22px 0 0; padding:8px 16px calc(16px + var(--safe-b)); animation:up .22s cubic-bezier(.2,.7,.2,1); }
    @keyframes up { from { transform:translateY(40px); opacity:.6; } }
    .sheet .grab { width:40px; height:5px; border-radius:99px; background:var(--border); margin:4px auto 10px; }
    .sheet-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
    @media (min-width:640px) { .backdrop { align-items:center; } .sheet { border-radius:22px; padding-bottom:16px; } .sheet .grab { display:none; } }
    .lv-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
    .lv-btn { padding:10px 4px; border-radius:12px; border:1px solid var(--border); background:var(--surface); text-align:center; }
    .lv-btn b { display:block; font-size:16px; } .lv-btn small { font-size:10px; color:var(--muted); }
    .lv-btn.on { border-color:var(--accent); background:var(--accent-soft); color:var(--accent); }
    .tense-pick { display:flex; flex-wrap:wrap; gap:6px; }
    .tense-pick label { display:inline-flex; align-items:center; gap:6px; padding:8px 10px; border-radius:10px; border:1px solid var(--border); font-size:13px; cursor:pointer; background:var(--surface); }
    .tense-pick input { width:16px; height:16px; accent-color:var(--accent); margin:0; }
    .tense-pick label.on { border-color:var(--accent); }
    .toast { position:fixed; left:50%; bottom:calc(var(--tab-h) + var(--safe-b) + 14px); z-index:90; transform:translate(-50%, 10px); opacity:0; pointer-events:none;
      background:var(--text); color:var(--bg); padding:10px 16px; border-radius:999px; font-size:13px; font-weight:600; box-shadow:0 6px 24px rgba(0,0,0,.25);
      transition:opacity .2s, transform .2s; max-width:calc(100vw - 32px); text-align:center; }
    .toast.show { opacity:1; transform:translate(-50%,0); }
    body.kb .toast { bottom:16px; }

    @media (min-width:640px) { main { padding:20px 20px 32px; } .pad { padding:20px; } }
    @media (orientation:landscape) and (max-height:520px) { .scene { height:240px; } .term { font-size:30px; } :root { --tab-h:54px; } .tab span { display:none; } }
    @media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }

    /* ============ CANTONESE ============ */
    body { background-image:var(--lattice); background-attachment:fixed; }
    .flagbar { background:linear-gradient(90deg,#B3261E,#E9C46A 50%,#1C1917) !important; }
    .logo { background:#B3261E !important; color:#fff !important; font:700 17px/1 var(--han) !important; border-radius:9px 9px 9px 2px !important; }
    .brand-title { font-family:var(--han) !important; font-weight:800 !important; letter-spacing:.02em; min-width:0; overflow:hidden; text-overflow:ellipsis; }
    .brand-title i { font-style:normal; color:var(--accent); }
    .top-row > button { flex:none; }
    @media (max-width:400px) { .top-row { gap:4px; padding:0 8px; } .brand-title { font-size:17px; } .logo { width:26px !important; height:26px !important; font-size:15px !important; } .top-row .icon-btn { width:36px; height:36px; } }
    .han { font-family:var(--han); }
    .term.han { font-family:var(--han); font-weight:800; font-size:clamp(40px, 13vw, 64px); letter-spacing:.04em; }
    .jp { font-family:var(--mono); font-size:15px; color:var(--jade); letter-spacing:.02em; }
    .jp.big { font-size:18px; }
    .mando { font-size:13px; color:var(--muted); }
    .mando b { font-family:var(--han); color:var(--text); font-weight:600; }
    .ex-han { font-family:var(--han); font-size:18px; font-weight:600; margin:0; }
    .ex-en { font-size:14px; color:var(--muted); margin:0; font-style:italic; }
    .sp { display:inline-grid; place-items:center; width:36px; height:36px; border-radius:50%; background:var(--accent-soft); color:var(--accent); flex:none; }
    .sp.big { width:64px; height:64px; } .sp.big .ic { width:28px; height:28px; }
    .tone-btns { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .tone-btn { display:flex; flex-direction:column; align-items:center; gap:2px; padding:10px 6px; border-radius:14px; border:1px solid var(--border); background:var(--card); font-weight:800; font-size:18px; }
    .tone-btn svg { width:44px; height:22px; } .tone-btn small { font-size:11px; color:var(--muted); font-weight:600; }
    .tone-btn.ok { border-color:var(--ok); background:var(--ok-soft); color:var(--ok); } .tone-btn.bad { border-color:var(--bad); background:var(--bad-soft); color:var(--bad); }
    .tone-grid { display:grid; grid-template-columns:repeat(6,1fr); gap:6px; }
    .tone-cell { display:flex; flex-direction:column; align-items:center; gap:2px; padding:10px 2px; border-radius:12px; border:1px solid var(--border); background:var(--card); }
    .tone-cell b { font-family:var(--han); font-size:26px; } .tone-cell span { font-family:var(--mono); font-size:11px; color:var(--jade); } .tone-cell small { font-size:10px; color:var(--muted); text-align:center; line-height:1.15; }
    .tone-head { display:grid; grid-template-columns:repeat(6,1fr); gap:6px; text-align:center; font-size:11px; color:var(--muted); }
    .tone-head svg { width:40px; height:20px; display:block; margin:0 auto 2px; }
    .contour { fill:none; stroke:var(--accent); stroke-width:3; stroke-linecap:round; }
    .contour-grid { stroke:var(--border); stroke-width:1; }
    .choices .choice.han { font-family:var(--han); font-size:22px; }
    .gq.han { font-family:var(--han); font-size:clamp(24px, 7vw, 32px); }
    .numpad { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .numpad button { height:52px; border-radius:14px; background:var(--surface); border:1px solid var(--border); font-weight:800; font-size:20px; }
    .lv-grid.three { grid-template-columns:repeat(3,1fr); }
    .noVoice { display:none; }
    body.mute-voice .noVoice { display:block; }
    .idiom { font-family:"Songti SC","STSong","Noto Serif SC","Noto Serif TC","Songti TC","PMingLiU","SimSun",serif; font-weight:900; letter-spacing:.12em; }
    .term.idiom { font-size:clamp(40px, 12vw, 64px); }
    .py { font-size:15px; color:var(--jade); letter-spacing:.02em; }
    .story { text-align:left; font-size:15px; line-height:1.6; margin:0; }
    .seal { align-self:flex-start; display:inline-grid; place-items:center; padding:2px 6px; border:2px solid var(--accent); color:var(--accent); border-radius:4px; font:800 12px/1.2 var(--han); }
    .script-btn { min-width:44px; height:36px; padding:0 10px; border-radius:999px; border:1px solid var(--border); font:800 14px/1 var(--han); color:var(--text); }
    .choice.long { font-size:15px; font-weight:600; text-align:left; }
    .choices.one { grid-template-columns:1fr; }
  </style>
</head>

const SRS_DAYS = [0, 1, 3, 7, 16, 35, 80], DAY = 86400000;

/* ---------- store ---------- */
const STORE_KEY = 'chengyu_v1';
const DEF = () => ({ script: null, py: true, lv: 'L1', meta: {}, days: {}, scores: {} });
let S = DEF();
try { const r = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); if (r) S = Object.assign(DEF(), r); } catch (e) {}
if (!S.script) { let l = ''; try { l = (window.FBL && FBL.get()) || ''; } catch (e) {} S.script = l === 'zh-Hant' || /^zh-(TW|HK|MO)/i.test(navigator.language || '') ? 't' : 's'; }
let saveT; function save() { clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) {} }, 200); }
const T = () => S.script === 't';
const u = s => T() ? (U_T[s] || s) : s;

/* ---------- idioms: the same list in both scripts, keyed by position ---------- */
function parse(src) { const out = []; LEVELS.forEach(lv => src[lv].trim().split('\n').forEach((line, i) => { const p = line.split('|'); out.push({ key: lv + ':' + i, lv, w: p[0], py: p[1], mean: p[2], en: p[3], story: p[4] || '', ex: p[5] || '' }); })); return out; }
const LIST_S = parse(IDIOMS), LIST_T = parse(IDIOMS_T);
const list = () => T() ? LIST_T : LIST_S;
const byKey = k => list().find(x => x.key === k);
const meta = k => S.meta[k] || (S.meta[k] = { box: 0, due: 0 });
const peek = k => S.meta[k] || {};
function today() { const k = dayKey(); return S.days[k] || (S.days[k] = { n: 0, ok: 0, ms: 0 }); }
function tally(ok) { const d = today(); d.n++; if (ok) d.ok++; save(); }
function score(k, ok) { const s = S.scores[k] || (S.scores[k] = [0, 0]); if (ok) s[0]++; s[1]++; tally(ok); }
let lastAct = Date.now();
document.addEventListener('pointerdown', () => { const n = Date.now(), g = n - lastAct; lastAct = n; if (g < 120000) { today().ms += g; save(); } }, true);

/* ---------- voice: Mandarin, mainland or Taiwan ---------- */
const Voice = {
  say(text) {
    if (!window.speechSynthesis) return; const vs = speechSynthesis.getVoices() || [];
    const v = (T() ? vs.find(x => /^zh[-_]TW/i.test(x.lang)) : null) || vs.find(x => /^zh[-_]CN/i.test(x.lang)) || vs.find(x => /^zh[-_](Hans|SG)/i.test(x.lang)) || vs.find(x => /^cmn/i.test(x.lang));
    if (!v) { if (!Voice.warned) { Voice.warned = true; toast(u('这台设备没有普通话语音')); } return; }
    try { speechSynthesis.cancel(); const m = new SpeechSynthesisUtterance(text); m.voice = v; m.lang = v.lang; m.rate = 0.85; speechSynthesis.speak(m); } catch (e) {}
  }
};
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => {};

/* ---------- navigation ---------- */
const SUBS = { cards: [['study', '学成语', 'sparkles'], ['list', '成语库', 'book-open']], prac: [['fill', '填空', 'pencil'], ['mean', '释义', 'lightbulb'], ['story', '听故事', 'book-a'], ['en', '英文', 'languages']], stats: [] };
const App = { tab: 'cards', sub: { cards: 'study', prac: 'fill', stats: '' }, deck: [], idx: 0, flipped: false };
function renderSubnav() { $('subnav').innerHTML = SUBS[App.tab].map(([k, l, i]) => `<button class="chip ${App.sub[App.tab] === k ? 'on' : ''}" data-act="sub" data-arg="${k}">${ico(i)}${u(l)}</button>`).join(''); $('subnav').hidden = !SUBS[App.tab].length; }
function go(tab, sub) {
  App.tab = tab; if (sub) App.sub[tab] = sub;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.arg === tab));
  document.querySelectorAll('main > .view').forEach(v => v.hidden = true);
  $(tab === 'stats' ? 'v-stats' : `v-${tab}-${App.sub[tab]}`).hidden = false; renderSubnav(); window.scrollTo(0, 0);
  ({ 'cards-study': renderCard, 'cards-list': renderList, 'prac-fill': fillNew, 'prac-mean': meanNew, 'prac-story': storyNew, 'prac-en': enNew, stats: renderStats })[tab === 'stats' ? 'stats' : `${tab}-${App.sub[tab]}`]();
}
function words() {
  document.querySelectorAll('[data-u]').forEach(e => { if (e._s == null) e._s = e.innerHTML; e.innerHTML = u(e._s); });
  $('scriptBtn').textContent = T() ? '简' : '繁'; $('listQ').placeholder = u('搜成语、拼音或意思');
  document.documentElement.lang = T() ? 'zh-Hant' : 'zh-Hans'; document.title = T() ? '成語一點通' : '成语一点通';
}

/* ---------- cards ---------- */
function deckSource() { return list().filter(x => x.lv === S.lv); }
function buildDeck() {
  const now = Date.now(); let items = deckSource().filter(x => peek(x.key).status !== 'mastered');
  const due = items.filter(x => (peek(x.key).due || 0) <= now); items = due.length ? due : items;
  items.sort((a, b) => (peek(a.key).due || 0) - (peek(b.key).due || 0)); App.deck = items.map(x => x.key); App.idx = 0;
}
function lvTag(it) { return u(LV_NAME[it.lv]); }
function renderCard() {
  $('lvSeg').innerHTML = LEVELS.map(l => `<button class="${S.lv === l ? 'on' : ''}" data-act="setLv" data-arg="${l}">${u(LV_NAME[l])}</button>`).join('');
  if (!App.deck.length) buildDeck();
  const src = deckSource(), mastered = src.filter(x => peek(x.key).status === 'mastered').length;
  $('deckStats').innerHTML = `<b style="color:var(--ok)">${mastered}</b> / ${src.length}`; $('deckBar').style.width = (src.length ? mastered / src.length * 100 : 0) + '%';
  $('flip').classList.remove('on'); App.flipped = false;
  const it = byKey(App.deck[App.idx]), empty = !it;
  $('scene').hidden = empty; document.querySelector('.rate').hidden = empty; $('fcEmpty').hidden = !empty;
  if (empty) { $('fcEmpty').textContent = u('这一组全都烂熟于心了！换一组吧。'); $('deckMeta').textContent = ''; return; }
  $('deckMeta').textContent = `${App.idx + 1} / ${App.deck.length}`; $('fcTag').textContent = lvTag(it); $('fcTag2').textContent = lvTag(it);
  $('fcStar').style.color = peek(it.key).saved ? '#F59E0B' : '';
  $('fcFront').innerHTML = `<p class="term idiom">${esc(it.w)}</p>${S.py ? `<div class="py">${esc(it.py)}</div>` : ''}`;
  $('fcBack').innerHTML = `<p class="idiom" style="font-size:28px;margin:4px 0 0">${esc(it.w)}</p><div class="py">${esc(it.py)}</div>
    <p class="meaning" style="font-family:var(--han);font-size:20px">${esc(it.mean)}</p><p class="ex-en">${esc(it.en)}</p>
    ${it.story ? `<div class="note-box stack" style="gap:4px"><span class="seal">${u('典故')}</span><p class="story">${esc(it.story)}</p></div>` : ''}
    ${it.ex ? `<div class="note-box stack" style="gap:4px"><span class="seal">${u('例句')}</span><p class="story">${esc(it.ex).replace(esc(it.w), `<b style="color:var(--accent)">${esc(it.w)}</b>`)}</p></div>` : ''}`;
  const m = peek(it.key); $('goodDays').textContent = '+' + SRS_DAYS[Math.min((m.box || 0) + 1, SRS_DAYS.length - 1)] + u('天');
}
function flip() { App.flipped = !App.flipped; $('flip').classList.toggle('on', App.flipped); if (App.flipped) { const it = byKey(App.deck[App.idx]); if (it) Voice.say(it.w); } }
function step(d) { if (!App.deck.length) return; App.idx = (App.idx + d + App.deck.length) % App.deck.length; renderCard(); }
function rate(g) {
  const k = App.deck[App.idx]; if (!k) return; const m = meta(k);
  if (g === 'again') { m.box = 0; m.due = Date.now() + 60000; m.status = 'review'; tally(false); }
  else if (g === 'good') { m.box = Math.min(m.box + 1, SRS_DAYS.length - 1); m.due = Date.now() + SRS_DAYS[m.box] * DAY; m.status = 'review'; tally(true); }
  else { m.status = 'mastered'; m.due = Date.now() + 365 * DAY; tally(true); }
  save(); App.deck.splice(App.idx, 1); if (!App.deck.length) buildDeck(); if (App.idx >= App.deck.length) App.idx = 0; renderCard();
}
function setupSwipe() { const sc = $('scene'); let x0 = 0, y0 = 0; sc.addEventListener('pointerdown', e => { x0 = e.clientX; y0 = e.clientY; }); sc.addEventListener('pointerup', e => { const dx = e.clientX - x0, dy = e.clientY - y0; if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) { sc.dataset.swiped = '1'; step(dx < 0 ? 1 : -1); setTimeout(() => sc.dataset.swiped = '', 50); } }); }
function renderList() {
  const q = $('listQ').value.trim().toLowerCase(), norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const rows = list().filter(x => !q || x.w.includes(q) || norm(x.py).replace(/ /g, '').includes(norm(q).replace(/ /g, '')) || x.mean.includes(q) || x.en.toLowerCase().includes(q));
  $('wordList').innerHTML = rows.map(x => { const m = peek(x.key); return `<div class="li"><button class="sp" data-act="sayW" data-arg="${esc(x.w)}">${ico('volume-2')}</button><div class="grow"><div class="row" style="gap:8px"><span class="w idiom" style="font-size:19px">${esc(x.w)}</span><span class="py" style="font-size:12px">${esc(x.py)}</span>${m.status === 'mastered' ? `<span class="tag ok">${u('熟')}</span>` : ''}</div><div class="s">${esc(x.mean)} · ${esc(x.en)}</div></div><div class="li-acts"><button class="icon-btn" data-act="starKey" data-arg="${x.key}" style="${m.saved ? 'color:#F59E0B' : ''}">${ico('star')}</button></div></div>`; }).join('') || `<div class="empty">${u('没有找到。')}</div>`;
}

/* ---------- practice ---------- */
let MC = null;
function mc(viewId, key, q) {
  $(viewId).innerHTML = `<div class="card pad stack" style="text-align:center">${q.head}</div><div class="choices ${q.long ? 'one' : ''}">${shuffle(q.opts).map(o => `<button class="choice ${q.long ? 'long' : 'idiom'}" data-act="mcAns" data-arg="${esc(o)}">${esc(o)}</button>`).join('')}</div><div id="${viewId}-fb"></div>
    <div class="row between"><span class="meta">${(() => { const s = S.scores[key]; return s && s[1] ? u('答对') + ` ${s[0]} / ${s[1]}` : ''; })()}</span><button class="btn sm" data-act="mcNext">${u('下一题')} ${ico('arrow-right')}</button></div>`;
  MC = { viewId, key, q, done: false };
}
function mcAns(a) {
  if (!MC || MC.done) return; MC.done = true; const ok = a === MC.q.ans;
  document.querySelectorAll(`#${MC.viewId} .choice`).forEach(b => { if (b.dataset.arg === MC.q.ans) b.classList.add('ok'); else if (b.dataset.arg === a && !ok) b.classList.add('bad'); });
  $(MC.viewId + '-fb').innerHTML = `<div class="fb ${ok ? 'ok' : 'bad'}">${ok ? u('答对了！') : u('差一点')}<span class="big">${MC.q.after}</span></div>`;
  score(MC.key, ok); if (MC.q.say) Voice.say(MC.q.say);
  if (ok) setTimeout(() => { if (MC && MC.done && !$(MC.viewId).hidden) mcNext(); }, 1800);
}
function mcNext() { ({ 'v-prac-fill': fillNew, 'v-prac-mean': meanNew, 'v-prac-story': storyNew, 'v-prac-en': enNew })[MC.viewId](); }
const pool = () => list().filter(x => LEVELS.indexOf(x.lv) <= LEVELS.indexOf(S.lv) || true);
const after = it => `<span class="idiom" style="font-size:22px">${esc(it.w)}</span><br><small class="py">${esc(it.py)}</small><br><small>${esc(it.mean)}</small>`;
function fillNew() {
  const it = pick(pool()), chars = [...it.w], i = Math.floor(Math.random() * chars.length), ans = chars[i];
  const others = shuffle([...new Set(pool().flatMap(x => [...x.w]))].filter(c => c !== ans && !chars.includes(c))).slice(0, 3);
  mc('v-prac-fill', 'fill', { head: `<span class="label">${u('补上缺的字')}</span><div class="gq idiom" style="font-size:clamp(36px,11vw,52px)">${chars.map((c, k) => k === i ? '<span class="blank">　</span>' : esc(c)).join('')}</div><div class="meta">${esc(it.mean)}</div>`, opts: [ans].concat(others), ans, after: after(it), say: it.w });
}
function meanNew() {
  const it = pick(pool()), others = shuffle(pool().filter(x => x.key !== it.key)).slice(0, 3).map(x => x.mean);
  mc('v-prac-mean', 'mean', { head: `<span class="label">${u('这个成语是什么意思？')}</span><div class="gq idiom" style="font-size:clamp(34px,10vw,48px)">${esc(it.w)}</div>${S.py ? `<div class="py">${esc(it.py)}</div>` : ''}`, opts: [it.mean].concat(others), ans: it.mean, long: true, after: after(it), say: it.w });
}
function storyNew() {
  const withStory = pool().filter(x => x.story), it = pick(withStory), others = shuffle(pool().filter(x => x.key !== it.key)).slice(0, 3).map(x => x.w);
  mc('v-prac-story', 'story', { head: `<span class="label">${u('这个故事说的是哪个成语？')}</span><p class="story" style="font-size:16px">${esc(it.story)}</p><div><button class="btn sm" data-act="sayStory" data-arg="${it.key}">${ico('volume-2')} ${u('听故事')}</button></div>`, opts: [it.w].concat(others), ans: it.w, after: after(it), say: it.w });
}
function enNew() {
  const it = pick(pool()), others = shuffle(pool().filter(x => x.key !== it.key)).slice(0, 3).map(x => x.w);
  mc('v-prac-en', 'en', { head: `<span class="label">${u('哪个成语最接近？')}</span><div class="gq" style="font-family:var(--serif)">${esc(it.en)}</div>`, opts: [it.w].concat(others), ans: it.w, after: after(it), say: it.w });
}

/* ---------- progress ---------- */
function renderStats() {
  const all = list(), mastered = all.filter(x => peek(x.key).status === 'mastered').length, review = all.filter(x => peek(x.key).status === 'review').length;
  let streak = 0; for (let d = new Date(); streak < 999; d.setDate(d.getDate() - 1)) { const x = S.days[dayKey(d)]; if (x && x.n) streak++; else if (dayKey(d) !== dayKey()) break; }
  const wd = T() ? '日一二三四五六' : '日一二三四五六';
  const week = [...Array(7)].map((_, i) => { const d = new Date(); d.setDate(d.getDate() - 6 + i); const x = S.days[dayKey(d)] || { n: 0 }; return { d: wd[d.getDay()], n: x.n, today: i === 6 }; });
  const max = Math.max(1, ...week.map(w => w.n)), mins = Object.values(S.days).reduce((a, x) => a + (x.ms || 0), 0);
  const pct = k => { const s = S.scores[k]; return s && s[1] ? Math.round(s[0] / s[1] * 100) : 0; };
  $('v-stats').innerHTML = `<div class="kpis"><div class="card kpi"><div class="v">${mastered}</div><div class="l">${u('烂熟于心')}</div></div><div class="card kpi"><div class="v">${review}</div><div class="l">${u('复习中')}</div></div><div class="card kpi"><div class="v">🔥 ${streak}</div><div class="l">${u('连续天数')}</div></div><div class="card kpi"><div class="v">${Math.round(mins / 60000)}</div><div class="l">${u('分钟')}</div></div></div>
    <div class="card pad"><div class="label">${u('这一周')}</div><div class="bars7">${week.map(w => `<div class="b7 ${w.today ? 'today' : ''}"><span class="val">${w.n || ''}</span><div class="bar ${w.n ? '' : 'zero'}" style="height:${w.n / max * 100}%"></div><span class="d">${w.d}</span></div>`).join('')}</div></div>
    <div class="card pad stack">${LEVELS.map(l => { const a = all.filter(x => x.lv === l), m = a.filter(x => peek(x.key).status === 'mastered').length, r = a.filter(x => peek(x.key).status === 'review').length; return `<div><div class="row between"><b>${u(LV_NAME[l])}</b><span class="meta">${m} / ${a.length}</span></div><div class="stackbar"><i class="st-m" style="width:${m / a.length * 100}%"></i><i class="st-r" style="width:${r / a.length * 100}%"></i></div></div>`; }).join('')}</div>
    <div class="card pad">${[['fill', '填空'], ['mean', '释义'], ['story', '听故事'], ['en', '英文']].map(([k, l]) => `<div class="hbar"><span>${u(l)}</span><div class="track"><i style="width:${pct(k)}%"></i></div><span class="pct">${pct(k)}%<small>${(S.scores[k] || [0, 0])[1]} ${u('题')}</small></span></div>`).join('')}</div>`;
}

function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 2200); }
function applyTheme() { const t = S.theme; if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); const dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; $('themeUse').setAttribute('href', dark ? '#i-sun' : '#i-moon'); }

const ACT = {
  tab: a => go(a), sub: a => go(App.tab, a), flip: () => { if (!$('scene').dataset.swiped) flip(); }, next: () => step(1), prev: () => step(-1), rate,
  setLv: a => { S.lv = a; save(); App.deck = []; renderCard(); }, shuffle: () => { App.deck = shuffle(App.deck); App.idx = 0; renderCard(); },
  star: () => { const k = App.deck[App.idx]; if (!k) return; const m = meta(k); m.saved = !m.saved; save(); $('fcStar').style.color = m.saved ? '#F59E0B' : ''; },
  starKey: k => { const m = meta(k); m.saved = !m.saved; save(); renderList(); },
  say: () => { const it = byKey(App.deck[App.idx]); if (it) Voice.say(it.w + '。' + it.mean); }, sayW: w => Voice.say(w), sayStory: k => { const it = byKey(k); if (it) Voice.say(it.story); },
  mcAns, mcNext,
  toggleScript: () => { S.script = T() ? 's' : 't'; save(); try { if (window.FBL) FBL.set(T() ? 'zh-Hant' : 'zh'); } catch (e) {} words(); go(App.tab); },
  togglePy: () => { S.py = !S.py; save(); go(App.tab); toast(S.py ? u('显示拼音') : u('隐藏拼音')); },
  toggleTheme: () => { const dark = document.documentElement.getAttribute('data-theme') ? S.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; S.theme = dark ? 'light' : 'dark'; save(); applyTheme(); }
};
document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (!b) return; const f = ACT[b.dataset.act]; if (f) { e.stopPropagation(); f(b.dataset.arg); } });
document.addEventListener('keydown', e => { if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return; if (App.tab === 'cards' && App.sub.cards === 'study') { if (e.key === ' ') { e.preventDefault(); flip(); } else if (e.key === 'ArrowRight') step(1); else if (e.key === 'ArrowLeft') step(-1); else if (e.key === '1') rate('again'); else if (e.key === '2') rate('good'); else if (e.key === '3') rate('mastered'); } });
$('listQ').addEventListener('input', renderList);
window.FBL_GET = () => T() ? 'zh-Hant' : 'zh';
window.FBL_SET = l => { S.script = l === 'zh-Hant' ? 't' : 's'; save(); words(); go(App.tab); };
setupSwipe(); applyTheme(); words(); go('cards');

</script>
</body>
