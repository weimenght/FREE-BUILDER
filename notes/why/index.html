vg viewBox="0 0 24 24" aria-hidden="true"><path class="h-b" d="M12 20.4s-7.8-4.7-7.8-10.3A4.4 4.4 0 0 1 12 7.5a4.4 4.4 0 0 1 7.8 2.6c0 5.6-7.8 10.3-7.8 10.3z" fill="currentColor"/><path class="h-s" d="M7.6 9.6a2.2 2.2 0 0 1 2.1-1.7" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.3" stroke-linecap="round"/></svg></a></span></nav></div></div></footer>
<script>
(() => {
"use strict";
const P = {"en": {"title": "Why I Do This — FREE//BUILDER", "blocks": [{"type": "lead", "kicker": "Notes", "title": "Why I do <span class=\"acc\">this<\/span>", "text": "For eight years I watched what training does to people at work. Plot twist: it isn't the money that matters.", "meta": ["Wei Meng", "7 Nov 2026"]}, {"type": "prose", "kicker": "What I saw", "items": ["At a publishing house I burned out: day after day of reading, editing, working, because back then I thought that was my only purpose.", "At ByteDance I moved from content moderation to the training team. Glamorous global programmes, huge budgets. An Excel programme I led showed me what does matter. Instead of a trainer at the front, colleagues at the same level as everyone else showed their own work: what they made, how it saved them time, which functions they used. Teams in different regions started talking to each other. Good habits travelled. Nobody needed a bigger budget. They needed each other.", "At Deloitte I ran the orientation for new graduates many times. By the end they might not remember what they were told. They remembered how those days felt, and the friends they made working and competing in teams. So every day I said the same things. Say thank you. Give feedback. See each other as a full human, not only a professional.", "Then AI gave me the power to build what I imagined. The first thing I built was an escape room for corporate training. With it, a small team with no technical skills could run a whole business simulation: people working together, outdoors, excited, having fun."]}, {"type": "steps", "kicker": "So this is how I work", "items": [{"n": "01", "t": "The screen sets it up.", "d": "A short tool frames one real problem: a 1:1 that's turned into a stand-up, feedback nobody gives, a meeting where nobody speaks."}, {"n": "02", "t": "Phones go down.", "d": "The tool stops before the hard part. It never does the conversation for you."}, {"n": "03", "t": "People talk.", "d": "Two colleagues, ten minutes, one real thing. That's where the change happens."}]}, {"type": "quote", "text": "We don't work for companies; we work with people.", "by": "— Wei Meng"}, {"type": "cta", "kicker": "Start small", "text": "Thirty minutes, no deck. Bring one meeting that went badly, and we'll start there.", "links": [{"l": "Start a project", "href": "/#contact"}, {"l": "See the thirteen cases", "href": "/cases/"}, {"l": "The whole story", "href": "https://www.wei-meng.org/story/"}]}]}, "zh": {"title": "我为什么做这个 — FREE//BUILDER", "blocks": [{"type": "lead", "kicker": "笔记", "title": "我为什么<span class=\"acc\">做这个<\/span>", "text": "八年里，我一直在看培训对职场里的人做了什么。超出预料的是：重要的也许不是钱。", "meta": ["孟玮", "2026年11月7日"]}, {"type": "prose", "kicker": "我看到的", "items": ["在出版公司，我耗尽了自己：日复一日地读稿、编辑、工作，因为那时我以为那就是我唯一的意义。", "在字节跳动，我从内容审核转到了培训团队。光鲜的全球项目，大把的预算。一个由我主导的 Excel 培训项目让我看清了什么才重要。台上站的不是讲师，而是和大家同一个级别的同事。他们分享自己做的东西：怎么让工作更高效，是怎么搭出来的，用了哪些函数。不同地区的团队开始互相交流，好的做法传开了。没有人需要更多的预算。大家需要的是彼此。", "在德勤，我带过很多次应届毕业生的入职培训。结束的时候，他们也许不记得听到了什么。他们记得的是那几天的感受，是在团队协作和比赛里交到的朋友。所以每一天我都在讲同样的事：要表达感谢。要给反馈。要把彼此看作一个完整的人，而不只是一个职场人。", "后来，AI 给了我把想象变成现实的能力。我用它做的第一件东西，是一个企业培训用的密室逃脱游戏。有了它，一个不懂技术的小团队也能办起一整场商业模拟：团队协作，户外活动，紧张又好玩。"]}, {"type": "steps", "kicker": "所以我这样工作", "items": [{"n": "01", "t": "屏幕把场子搭好。", "d": "一个简短的工具框出一个真实的问题：变成了站会的一对一、没人给的反馈、没人开口的会议。"}, {"n": "02", "t": "手机放下。", "d": "工具在最难的那一步之前停下。它从不替你完成那场对话。"}, {"n": "03", "t": "人开始交谈。", "d": "两个同事，十分钟，一件真事。改变就发生在那里。"}]}, {"type": "quote", "text": "我们不是为公司工作；我们是和人一起工作。", "by": "— 孟玮"}, {"type": "cta", "kicker": "从小处开始", "text": "三十分钟，不用幻灯片。带来一场没开好的会，我们就从那里开始。", "links": [{"l": "开启项目", "href": "/#contact"}, {"l": "看看那十三个案例", "href": "/cases/"}, {"l": "完整的故事", "href": "https://www.wei-meng.org/story/"}]}]}, "es": {"title": "Por qué hago esto — FREE//BUILDER", "blocks": [{"type": "lead", "kicker": "Notas", "title": "Por qué hago <span class=\"acc\">esto<\/span>", "text": "Durante ocho años vi lo que la formación hace a la gente en el trabajo. Giro de guion: no es el dinero lo que importa.", "meta": ["Wei Meng", "7 nov 2026"]}, {"type": "prose", "kicker": "Lo que vi", "items": ["En una editorial me quemé: día tras día leyendo, editando, trabajando, porque entonces creía que ese era mi único propósito.", "En ByteDance pasé de la moderación de contenidos al equipo de formación. Programas globales y vistosos, presupuestos enormes. Un programa de Excel que dirigí me enseñó lo que sí importa. En lugar de un formador al frente, compañeros del mismo nivel que los demás enseñaron su propio trabajo: qué habían hecho, cuánto tiempo les ahorraba, qué funciones usaban. Equipos de distintas regiones empezaron a hablar entre sí. Las buenas prácticas viajaron. Nadie necesitaba más presupuesto. Se necesitaban unos a otros.", "En Deloitte llevé muchas veces la bienvenida de los recién graduados. Al final quizá no recordaban lo que se les había contado. Recordaban cómo se habían sentido esos días, y los amigos que hicieron colaborando y compitiendo en equipo. Así que cada día repetía lo mismo. Da las gracias. Da feedback. Mira al otro como una persona completa, no solo como un profesional.", "Después, la IA me dio el poder de construir lo que imaginaba. Lo primero que construí fue un escape room para formación en empresas. Con él, un equipo pequeño y sin conocimientos técnicos podía montar toda una simulación de negocio: gente colaborando, al aire libre, con emoción y diversión."]}, {"type": "steps", "kicker": "Así que trabajo así", "items": [{"n": "01", "t": "La pantalla lo prepara.", "d": "Una herramienta corta enmarca un problema real: un 1:1 que se ha vuelto una reunión de pie, el feedback que nadie da, una reunión en la que nadie habla."}, {"n": "02", "t": "Los móviles, abajo.", "d": "La herramienta se detiene antes de la parte difícil. Nunca tiene la conversación por ti."}, {"n": "03", "t": "La gente habla.", "d": "Dos compañeros, diez minutos, una cosa real. Ahí es donde ocurre el cambio."}]}, {"type": "quote", "text": "No trabajamos para empresas; trabajamos con personas.", "by": "— Wei Meng"}, {"type": "cta", "kicker": "Empieza por algo pequeño", "text": "Treinta minutos, sin diapositivas. Trae una reunión que salió mal y empezamos por ahí.", "links": [{"l": "Iniciar un proyecto", "href": "/#contact"}, {"l": "Ver los trece casos", "href": "/cases/"}, {"l": "La historia completa", "href": "https://www.wei-meng.org/story/"}]}]}, "zh-Hant": {"title": "我為什麼做這個 — FREE//BUILDER", "blocks": [{"type": "lead", "kicker": "筆記", "title": "我為什麼<span class=\"acc\">做這個</span>", "text": "八年裡，我一直在看培訓對職場裡的人做了什麼。超出預料的是：重要的也許不是錢。", "meta": ["孟瑋", "2026年11月7日"]}, {"type": "prose", "kicker": "我看到的", "items": ["在出版公司，我耗盡了自己：日復一日地讀稿、編輯、工作，因為那時我以為那就是我唯一的意義。", "在字節跳動，我從內容稽核轉到了培訓團隊。光鮮的全球專案，大把的預算。一個由我主導的 Excel 培訓專案讓我看清了什麼才重要。臺上站的不是講師，而是和大家同一個級別的同事。他們分享自己做的東西：怎麼讓工作更高效，是怎麼搭出來的，用了哪些函式。不同地區的團隊開始互相交流，好的做法傳開了。沒有人需要更多的預算。大家需要的是彼此。", "在德勤，我帶過很多次應屆畢業生的入職培訓。結束的時候，他們也許不記得聽到了什麼。他們記得的是那幾天的感受，是在團隊協作和比賽裡交到的朋友。所以每一天我都在講同樣的事：要表達感謝。要給反饋。要把彼此看作一個完整的人，而不只是一個職場人。", "後來，AI 給了我把想像變成現實的能力。我用它做的第一件東西，是一個企業培訓用的密室逃脫遊戲。有了它，一個不懂技術的小團隊也能辦起一整場商業模擬：團隊協作，戶外活動，緊張又好玩。"]}, {"type": "steps", "kicker": "所以我這樣工作", "items": [{"n": "01", "t": "螢幕把場子搭好。", "d": "一個簡短的工具框出一個真實的問題：變成了站會的一對一、沒人給的反饋、沒人開口的會議。"}, {"n": "02", "t": "手機放下。", "d": "工具在最難的那一步之前停下。它從不替你完成那場對話。"}, {"n": "03", "t": "人開始交談。", "d": "兩個同事，十分鐘，一件真事。改變就發生在那裡。"}]}, {"type": "quote", "text": "我們不是為公司工作；我們是和人一起工作。", "by": "— 孟瑋"}, {"type": "cta", "kicker": "從小處開始", "text": "三十分鐘，不用幻燈片。帶來一場沒開好的會，我們就從那裡開始。", "links": [{"l": "開啟專案", "href": "/#contact"}, {"l": "看看那十三個案例", "href": "/cases/"}, {"l": "完整的故事", "href": "https://www.wei-meng.org/story/"}]}]}, "ca": {"title": "Per què faig això — FREE//BUILDER", "blocks": [{"type": "lead", "kicker": "Notes", "title": "Per què faig <span class=\"acc\">això</span>", "text": "Durant vuit anys vaig veure què fa la formació a la gent a la feina. Gir de guió: no són els diners el que importa.", "meta": ["Wei Meng", "7 nov. 2026"]}, {"type": "prose", "kicker": "El que vaig veure", "items": ["En una editorial em vaig cremar: dia rere dia llegint, editant, treballant, perquè aleshores creia que aquell era el meu únic propòsit.", "A ByteDance vaig passar de la moderació de continguts a l'equip de formació. Programes globals i lluents, pressupostos enormes. Un programa d'Excel que vaig dirigir em va ensenyar el que sí que importa. En lloc d'un formador al davant, companys del mateix nivell que els altres van ensenyar la seva pròpia feina: què havien fet, quant temps els estalviava, quines funcions feien servir. Equips de regions diferents van començar a parlar entre ells. Les bones pràctiques van viatjar. Ningú no necessitava més pressupost. Es necessitaven els uns als altres.", "A Deloitte vaig portar moltes vegades la benvinguda dels acabats de graduar. Al final potser no recordaven el que se'ls havia explicat. Recordaven com s'havien sentit aquells dies, i els amics que van fer col·laborant i competint en equip. Així que cada dia repetia el mateix. Dona les gràcies. Dona feedback. Mira l'altre com una persona completa, no només com un professional.", "Després, la IA em va donar el poder de construir el que imaginava. El primer que vaig construir va ser un escape room per a formació a empreses. Amb ell, un equip petit i sense coneixements tècnics podia muntar tota una simulació de negoci: gent col·laborant, a l'aire lliure, amb emoció i diversió."]}, {"type": "steps", "kicker": "Així que treballo així", "items": [{"n": "01", "t": "La pantalla ho prepara.", "d": "Una eina curta emmarca un problema real: un 1:1 que s'ha tornat una reunió dempeus, el feedback que ningú no dona, una reunió on ningú no parla."}, {"n": "02", "t": "Els mòbils, avall.", "d": "L'eina s'atura abans de la part difícil. Mai no té la conversa per tu."}, {"n": "03", "t": "La gent parla.", "d": "Dos companys, deu minuts, una cosa real. Allà és on passa el canvi."}]}, {"type": "quote", "text": "No treballem per a empreses; treballem amb persones.", "by": "— Wei Meng"}, {"type": "cta", "kicker": "Comença per alguna cosa petita", "text": "Trenta minuts, sense diapositives. Porta una reunió que va sortir malament i comencem per aquí.", "links": [{"l": "Començar un projecte", "href": "/#contact"}, {"l": "Veure els tretze casos", "href": "/cases/"}, {"l": "La història completa", "href": "https://www.wei-meng.org/story/"}]}]}};
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let lang = "en";
const B = {
  lead: b => `<span class="kicker">${esc(b.kicker)}</span><h1>${b.title}</h1><p class="lead">${esc(b.text)}</p>${b.flag ? `<div class="flag">◌ ${esc(b.flag)}</div>` : ""}${b.meta ? `<div class="meta">${b.meta.map(m => `<span class="pill">${esc(m)}</span>`).join("")}</div>` : ""}`,
  head: b => `${b.kicker ? `<span class="kicker">${esc(b.kicker)}</span>` : ""}${b.title ? `<h2>${b.title}</h2>` : ""}${b.text ? `<p class="sub">${esc(b.text)}</p>` : ""}`,
  cards: b => B.head(b) + `<div class="cards">${b.items.map(c => `<div class="card${c.bad ? " bad" : ""}">${c.k ? `<span class="k">${esc(c.k)}</span>` : ""}${c.t ? `<h3>${esc(c.t)}</h3>` : ""}${c.d ? `<p>${esc(c.d)}</p>` : ""}${c.x ? `<div class="x"><b>${esc(c.xk || "")}</b>${esc(c.x)}</div>` : ""}${c.href ? `<p style="margin-top:10px"><a href="${c.href}" style="font-family:var(--mono);font-size:12px">${esc(c.link || "↗")}</a></p>` : ""}</div>`).join("")}</div>`,
  steps: b => B.head(b) + `<ol class="steps">${b.items.map(s => `<li><span class="n">${esc(s.n)}${s.when ? `<small class="when" data-week="${s.week != null ? s.week : ""}">${esc(s.when)}</small>` : ""}</span><div><h3>${esc(s.t)}</h3>${s.d ? `<p>${esc(s.d)}</p>` : ""}${s.tags ? `<div class="tags">${s.tags.map(t => t.href ? `<a href="${t.href}">${esc(t.l)} ↗</a>` : `<span>${esc(t.l)}</span>`).join("")}</div>` : ""}</div></li>`).join("")}</ol>`,
  table: b => B.head(b) + `<div class="tw" tabindex="0" role="region" aria-label="${esc(b.aria || b.kicker || "")}"><table><thead><tr>${b.cols.map(c => `<th scope="col">${esc(c)}</th>`).join("")}</tr></thead><tbody>${b.rows.map(r => `<tr>${r.map((c, i) => `<td class="${i === r.length - 1 && b.noteCol ? "note" : ""}">${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`,
  list: b => B.head(b) + `<ul class="list">${b.items.map(i => `<li>${esc(i)}</li>`).join("")}</ul>`,
  dark: b => `<div class="dark"><span class="kicker">${esc(b.kicker)}</span>${b.title ? `<h2 style="color:#fff">${b.title}</h2>` : ""}${b.text ? `<p style="margin:6px 0 0;color:rgba(255,255,255,.8)">${esc(b.text)}</p>` : ""}${b.items ? `<${b.ordered ? "ol" : "ul"}>${b.items.map(i => `<li>${esc(i)}</li>`).join("")}</${b.ordered ? "ol" : "ul"}>` : ""}</div>`,
  prose: b => B.head(b) + b.items.map(p => `<p class="lead" style="margin-top:12px">${esc(p)}</p>`).join(""),
  quote: b => `<p class="quote">${esc(b.text)}</p>${b.by ? `<p class="note" style="margin-top:8px">${esc(b.by)}</p>` : ""}`,
  note: b => `<p class="note">${esc(b.text)}</p>`,
  html: b => b.html,
  cta: b => B.head(b) + `<div class="cta">${b.links.map((l, i) => `<a class="${i === 0 ? "pri" : ""}" href="${l.href}"${l.download ? " download" : ""}>${esc(l.l)} ${l.download ? "↓" : "↗"}</a>`).join("")}</div>`
};
function render() {
  const s = P[lang];
  document.documentElement.lang = (/*i18n*/lang === "zh" ? "zh-CN" : (lang === "zh-Hant" ? "zh-TW" : lang));
  document.title = s.title;
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  document.getElementById("main").innerHTML = s.blocks.map((b, i) => i === 0 ? B[b.type](b) : `<section${b.id ? ` id="${b.id}"` : ""}${b.noprint ? ' class="noprint"' : ""}>${B[b.type](b)}</section>`).join("");
  if (window.__after) window.__after(lang, s);
  try { localStorage.setItem("wm_preferred_lang", lang); localStorage.setItem("wm_cases_lang", lang); } catch (e) {}
}
document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => { lang = b.dataset.lang; render(); }));
window.FBL_SET = l => { lang = l; render(); }; window.FBL_GET = () => lang;
let saved = null; try { saved = localStorage.getItem("wm_preferred_lang") || localStorage.getItem("wm_cases_lang"); } catch (e) {}
const nav = (navigator.language || "").toLowerCase();
lang = ["en", "zh", "zh-Hant", "es", "ca"].includes(saved) ? saved : nav.startsWith("zh") ? "zh" : nav.startsWith("es") ? "es" : "en";

render();
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("/sw.js", { scope: "/" }).catch(() => {});
})();
</script>
