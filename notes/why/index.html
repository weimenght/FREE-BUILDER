dback que nadie da, una reunión en la que nadie habla."}, {"n": "02", "t": "Los móviles, abajo.", "d": "La herramienta se detiene antes de la parte difícil. Nunca tiene la conversación por ti."}, {"n": "03", "t": "La gente habla.", "d": "Dos compañeros, diez minutos, una cosa real. Ahí es donde ocurre el cambio."}]}, {"type": "quote", "text": "No trabajamos para empresas; trabajamos con personas.", "by": "— Wei"}, {"type": "cta", "kicker": "Empieza por algo pequeño", "text": "Treinta minutos, sin diapositivas. Trae una reunión que salió mal y empezamos por ahí.", "links": [{"l": "Iniciar un proyecto", "href": "/#contact"}, {"l": "Ver los trece casos", "href": "/cases/"}, {"l": "La historia completa", "href": "https://www.wei-meng.org/story/"}]}]}, "zh-Hant": {"title": "我為什麼做這個 — FREE//BUILDER", "blocks": [{"type": "lead", "kicker": "筆記", "title": "我為什麼<span class=\"acc\">做這個</span>", "text": "八年裡，我一直在看培訓對職場裡的人做了什麼。超出預料的是：重要的也許不是錢。", "meta": ["孟瑋", "2026年11月7日"]}, {"type": "prose", "kicker": "我看到的", "items": ["在出版公司，我耗盡了自己：日復一日地讀稿、編輯、工作，因為那時我以為那就是我唯一的意義。", "在字節跳動，我從內容稽核轉到了培訓團隊。光鮮的全球專案，大把的預算。真正改變人們工作方式的，很少是最貴的那些。而是那些讓兩個同事坐下來，聊一件真事的專案。", "在德勤，我做線下的、多天的專案，也把教練當作一種方法來學習。我學到，一個好問題加上一點時間，能做到幻燈片做不到的事。"]}, {"type": "steps", "kicker": "所以我這樣工作", "items": [{"n": "01", "t": "螢幕把場子搭好。", "d": "一個簡短的工具框出一個真實的問題：變成了站會的一對一、沒人給的反饋、沒人開口的會議。"}, {"n": "02", "t": "手機放下。", "d": "工具在最難的那一步之前停下。它從不替你完成那場對話。"}, {"n": "03", "t": "人開始交談。", "d": "兩個同事，十分鐘，一件真事。改變就發生在那裡。"}]}, {"type": "quote", "text": "我們不是為公司工作；我們是和人一起工作。", "by": "— 孟瑋"}, {"type": "cta", "kicker": "從小處開始", "text": "三十分鐘，不用幻燈片。帶來一場沒開好的會，我們就從那裡開始。", "links": [{"l": "開啟專案", "href": "/#contact"}, {"l": "看看那十三個案例", "href": "/cases/"}, {"l": "完整的故事", "href": "https://www.wei-meng.org/story/"}]}]}, "ca": {"title": "Per què faig això — FREE//BUILDER", "blocks": [{"type": "lead", "kicker": "Notes", "title": "Per què faig <span class=\"acc\">això</span>", "text": "Durant vuit anys vaig veure què fa la formació a la gent a la feina. Gir de guió: no són els diners el que importa.", "meta": ["Wei Meng", "7 nov. 2026"]}, {"type": "prose", "kicker": "El que vaig veure", "items": ["En una editorial em vaig cremar: dia rere dia llegint, editant, treballant, perquè aleshores creia que aquell era el meu únic propòsit.", "A ByteDance vaig passar de la moderació de continguts a l'equip de formació. Programes globals i lluents, pressupostos enormes. Els que canviaven com treballava la gent rarament eren els més cars. Eren els que feien que dos companys parlessin d'alguna cosa real.", "A Deloitte vaig portar programes presencials de diversos dies i vaig estudiar el coaching com a mètode. Vaig aprendre quant poden fer una bona pregunta i una mica de temps que una diapositiva no pot."]}, {"type": "steps", "kicker": "Així que treballo així", "items": [{"n": "01", "t": "La pantalla ho prepara.", "d": "Una eina curta emmarca un problema real: un 1:1 que s'ha tornat una reunió dempeus, el feedback que ningú no dona, una reunió on ningú no parla."}, {"n": "02", "t": "Els mòbils, avall.", "d": "L'eina s'atura abans de la part difícil. Mai no té la conversa per tu."}, {"n": "03", "t": "La gent parla.", "d": "Dos companys, deu minuts, una cosa real. Allà és on passa el canvi."}]}, {"type": "quote", "text": "No treballem per a empreses; treballem amb persones.", "by": "— Wei"}, {"type": "cta", "kicker": "Comença per alguna cosa petita", "text": "Trenta minuts, sense diapositives. Porta una reunió que va sortir malament i comencem per aquí.", "links": [{"l": "Començar un projecte", "href": "/#contact"}, {"l": "Veure els tretze casos", "href": "/cases/"}, {"l": "La història completa", "href": "https://www.wei-meng.org/story/"}]}]}};
