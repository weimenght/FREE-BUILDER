<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Come Over · have people round</title>
<meta name="description" content="Have people over: write the invitation, send the link, see who's coming and what they'll bring. No account; deleted a week after the day.">
<meta name="theme-color" content="#FBF4E8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1418" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-180.png">

<style>
:root{
  --bg:#FBF4E8;--bg2:#F3E8D6;--card:#FFFDF8;--ink:#2B1E18;--ink2:#76645A;--line:#E6D7C2;--accent:#C8442E;--accent2:#A8341F;--green:#4E6B3A;--amber:#F2B24A;--paper:#FFF7E4;
  --onAccent:#FFF8EE;--shadow:0 1px 0 rgba(255,255,255,.7) inset,0 22px 44px -28px rgba(60,30,15,.45);
  --display:"Instrument Serif","Iowan Old Style",Georgia,"Songti SC","Noto Serif SC","Noto Serif TC",serif;
  --sans:"Figtree",system-ui,-apple-system,"Segoe UI","PingFang SC","PingFang TC","Microsoft YaHei",sans-serif;
  --hand:"Caveat","Bradley Hand","Kaiti SC","STKaiti","KaiTi","Kaiti TC",cursive;
  --r:18px;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1A1418;--bg2:#231B21;--card:#2A2027;--ink:#F6EBDD;--ink2:#BCA99A;--line:#3E3038;--accent:#F08A6A;--accent2:#F6A487;--green:#A8CC86;--amber:#F2B65A;--paper:#33272C;
  --onAccent:#22150F;--shadow:0 22px 44px -26px #000;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 60% at 50% -10%,color-mix(in srgb,var(--amber) 16%,transparent),transparent 70%);z-index:0}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:8px}
.wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:8px;min-height:58px;padding-top:env(safe-area-inset-top)}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-decoration:none;color:inherit}
.brand svg{flex:none;width:34px;height:34px;border-radius:9px}
.brand b{font:400 clamp(22px,5vw,27px)/1 var(--display);letter-spacing:.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;min-width:44px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font:600 14px var(--sans);white-space:nowrap}
.ib:hover{border-color:var(--amber)}
.ib svg{width:18px;height:18px;flex:none}
@media (max-width:560px){.ib .lbl{display:none}.ib{padding:0}}
.rel{position:relative}
.langm{position:absolute;right:0;top:calc(100% + 6px);display:grid;min-width:160px;padding:6px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);z-index:30}
.langm button{text-align:left;min-height:42px;padding:0 12px;border:0;border-radius:10px;background:none;font:500 15px var(--sans)}
.langm button[aria-current=true]{background:var(--bg2);font-weight:700}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:999px;border:1px solid var(--line);background:var(--card);font:600 15px var(--sans);text-decoration:none;color:var(--ink);transition:transform .12s,border-color .12s}
.btn:hover{border-color:var(--amber)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--onAccent)}
.btn.sm{min-height:42px;padding:0 15px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:default}
.btn svg{width:18px;height:18px;flex:none}
.quiet{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:8px 0;color:var(--ink2);font:500 14px var(--sans);text-decoration:underline;text-underline-offset:3px;min-height:40px}
.quiet.warn{color:var(--accent)}
.k{margin:0 0 6px;font:700 12px/1.3 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}

/* home */
.hero{padding:30px 0 6px;display:grid;gap:14px;max-width:640px}
.hero h1{margin:0;font:400 clamp(44px,11vw,76px)/.98 var(--display);letter-spacing:-.01em}
.hero h1 em{font-style:italic;color:var(--accent)}
.hero p{margin:0;color:var(--ink2);font-size:17px;max-width:34em}
.hero .btn{justify-self:start;margin-top:6px}
.popo{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:end;margin:26px 0 8px;max-width:560px}
.popo canvas{width:78px;height:96px;image-rendering:pixelated;image-rendering:crisp-edges}
.popo blockquote{position:relative;margin:0 0 16px;padding:12px 16px;border-radius:16px 16px 16px 4px;background:var(--paper);border:1px solid var(--line);font:600 22px/1.25 var(--hand)}
.popo blockquote:lang(zh),.popo blockquote:lang(zh-Hant){font-size:18px}
.popo cite{display:block;margin-top:4px;font:500 13px var(--sans);color:var(--ink2);font-style:normal}
.popo.sleep blockquote{font:italic 400 17px/1.4 var(--display);color:var(--ink2)}
.sec{margin:26px 0 0}
.sec>h2{margin:0 0 12px;font:400 30px/1.1 var(--display)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.g{display:grid;grid-template-columns:58px 1fr;gap:14px;align-items:center;padding:12px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);text-decoration:none;color:inherit}
.g:hover{border-color:var(--amber)}
.g .dt{display:grid;place-items:center;height:58px;border-radius:12px;background:var(--bg2);text-align:center;line-height:1}
.g .dt b{display:block;font:400 28px var(--display)}
.g .dt span{display:block;font:700 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.g h3{margin:0;font:400 22px/1.15 var(--display);overflow-wrap:anywhere}
.g p{margin:2px 0 0;color:var(--ink2);font-size:14px}
.g.past{opacity:.62}
.empty{padding:22px 18px;border-radius:var(--r);border:1px dashed var(--line);color:var(--ink2);font:italic 400 19px/1.4 var(--display)}
.town{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;margin:30px 0 26px;padding:16px 18px;border-radius:var(--r);background:#1d1526;color:#f3e7cf;box-shadow:var(--shadow)}
.town svg{width:56px;height:56px;image-rendering:pixelated}
.town b{display:block;font:600 16px/1.3 var(--sans)}
.town span{font-size:14px;opacity:.8}
.town .btn{color:#1d1526;background:#f6b73c;border-color:#f6b73c}
@media (max-width:520px){.town{grid-template-columns:auto 1fr}.town .btn{grid-column:1/-1}}

/* the invitation */
.iv{display:grid;gap:18px;padding:32px 0 10px}
@media (min-width:900px){.iv{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;align-items:start}.iv .inv{position:sticky;top:76px}}
@media (orientation:landscape) and (max-height:500px){.iv .inv{position:static}}
.inv{position:relative;padding:34px 26px 24px;border-radius:6px;background:var(--card);box-shadow:var(--shadow);border:1px solid var(--line);text-align:center;isolation:isolate}
.inv::before{content:"";position:absolute;inset:9px;border:1.5px solid color-mix(in srgb,var(--accent) 55%,transparent);border-radius:3px;pointer-events:none}
.inv::after{content:"";position:absolute;inset:13px;border:.75px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:2px;pointer-events:none}
.seal{position:absolute;left:50%;top:-22px;width:46px;height:46px;margin-left:-23px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--bg),0 6px 14px -6px rgba(0,0,0,.5);display:grid;place-items:center;color:var(--onAccent)}
.seal svg{width:24px;height:24px}
.inv .k{margin-top:6px;color:var(--accent)}
.inv h1{margin:6px auto 4px;max-width:14em;font:400 clamp(38px,9vw,58px)/1.02 var(--display);letter-spacing:-.01em;overflow-wrap:anywhere}
.inv .about{margin:10px auto 0;max-width:28em;font:italic 400 20px/1.35 var(--display);color:var(--ink2);overflow-wrap:anywhere}
.rows{margin:20px auto 4px;max-width:26em;display:grid;gap:12px;text-align:left}
.row{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
.row svg{width:24px;height:24px;margin:3px 0 0 5px;color:var(--accent)}
.row .l{display:block;font:700 11px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.row .v{display:block;font:500 18px/1.35 var(--sans);overflow-wrap:anywhere}
.row .s{display:block;color:var(--ink2);font-size:14px}
.row .tag{display:inline-block;margin-right:4px;padding:1px 8px;color:var(--ink);border-radius:999px;background:color-mix(in srgb,var(--amber) 28%,transparent);font:600 12px var(--sans);vertical-align:2px}
.row a.find{display:inline-flex;align-items:center;gap:4px;margin-top:4px;font:600 14px var(--sans)}
.acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:20px}
.inv.past h1,.inv.past .about,.inv.past .rows{opacity:.55}
.band{margin:16px auto 0;max-width:24em;padding:14px 16px;border-radius:12px;background:var(--paper);font:600 24px/1.25 var(--hand);color:var(--ink)}
.band small{display:block;margin-bottom:2px;font:italic 400 16px var(--display);color:var(--ink2)}
.skel{height:420px;border-radius:6px;background:linear-gradient(90deg,var(--bg2),var(--card),var(--bg2));background-size:200% 100%;animation:sh 1.4s linear infinite;display:grid;place-items:center;color:var(--ink2);font:italic 400 20px var(--display)}
@keyframes sh{to{background-position:-200% 0}}

.panel{padding:20px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.panel+.panel{margin-top:14px}
.panel h2{margin:0 0 12px;font:400 28px/1.1 var(--display)}
.side{min-width:0}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.yn button{min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--bg);font:600 16px var(--sans)}
.yn button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-grid;text-align:left;gap:0;min-height:44px;padding:6px 14px;border-radius:14px;border:1px dashed var(--line);background:none;font:600 14px/1.25 var(--sans)}
.chip small{font:500 12px var(--sans);color:var(--ink2)}
.chip small.open{color:var(--accent)}
.chip[aria-pressed=true] small.open{display:none}
.chip[aria-pressed=true]{border-style:solid;border-color:var(--green);background:color-mix(in srgb,var(--green) 14%,transparent)}
.chip .cl{display:block}
.chip[aria-pressed=true] .cl::before{content:"✓ "}
.f{display:grid;gap:14px}
.fld{display:grid;gap:6px}
.fld>span{font:600 14px var(--sans)}
.fld small{color:var(--ink2);font-size:13px}
.fld input,.fld textarea{width:100%;min-height:48px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:16px;outline:none}
.fld textarea{min-height:84px;resize:vertical}
.fld textarea.hand{font:600 21px/1.3 var(--hand)}
.fld input:focus,.fld textarea:focus{border-color:var(--amber);box-shadow:0 0 0 3px color-mix(in srgb,var(--amber) 28%,transparent)}
.fld [aria-invalid=true]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ir{display:flex;gap:8px}.ir input{flex:1;min-width:0}
.lock{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--green) 11%,transparent);font-size:14px}
.lock svg{width:18px;height:18px;flex:none;margin-top:2px;color:var(--green)}
.said{font:600 22px/1.3 var(--hand)}
.alt{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);display:grid;gap:10px}
.alt a,.alt button{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center;text-align:left;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-decoration:none;width:100%}
.alt a:hover,.alt button:hover{border-color:var(--amber)}
.alt b{display:block;font:600 15px var(--sans)}
.alt span{display:block;color:var(--ink2);font-size:13px}
.alt i{font-style:normal;font-size:26px;text-align:center}
.who{display:grid;gap:12px}
.guest{display:grid;gap:2px}
.guest b{font:400 22px/1.15 var(--display)}
.guest span{color:var(--ink2);font-size:14px}
.guest q{font:600 20px/1.25 var(--hand);quotes:"“" "”"}
.love{margin:14px 0 0;color:var(--ink2);font:italic 400 17px/1.4 var(--display)}
.bring{list-style:none;margin:0;padding:0}
.bring li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.bring li:first-child{border-top:0}
.bring li b{font-weight:600}
.bring li span{color:var(--ink2);text-align:right}
.bring li.open span{font-style:italic}
.sumline{margin:0 0 10px;font:italic 400 18px/1.35 var(--display);color:var(--accent)}
.sumline.ok{color:var(--green)}

/* sheets */
.scrim{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(26,16,12,.5);animation:fade .2s ease}
@media (min-width:760px){.scrim{align-items:center;padding:24px}}
@keyframes fade{from{opacity:0}}
.sheet{position:relative;width:100%;max-width:620px;max-height:min(92vh,900px);overflow:auto;overscroll-behavior:contain;background:var(--bg);border-radius:22px 22px 0 0;padding:26px 20px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -20px 60px -20px rgba(0,0,0,.5);animation:up .28s cubic-bezier(.2,.8,.2,1)}
@media (min-width:760px){.sheet{border-radius:22px;padding:30px}}
@media (orientation:landscape) and (max-height:500px){.sheet{max-height:96vh;padding-top:18px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet .x{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:20px;line-height:1}
.sheet h3{margin:0 0 6px;padding-right:44px;font:400 32px/1.1 var(--display)}
.sheet .sub{margin:0 0 16px;color:var(--ink2)}
.grab{position:absolute;top:8px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:var(--line)}
@media (min-width:760px){.grab{display:none}}
.steps{list-style:none;margin:18px 0;padding:0;display:grid;gap:12px}
.steps li{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:center;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.steps li i{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--onAccent);font:400 24px var(--display);font-style:normal}
.steps b{display:block;font:400 22px/1.15 var(--display)}
.steps span{color:var(--ink2);font-size:15px}
.pv{list-style:none;margin:16px 0;padding:0;display:grid;gap:10px}
.pv li{padding:10px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:15px}
.bqs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bqs button{display:grid;justify-items:center;gap:4px;padding:10px 6px;border-radius:14px;border:1px solid var(--line);background:var(--card);font:600 14px var(--sans)}
.bqs button[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.bqs svg{width:72px;height:88px}

/* footer */
.foot{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center;padding:22px 0 calc(28px + env(safe-area-inset-bottom));border-top:1px solid var(--line);color:var(--ink2);font-size:14px}
.foot a,.foot button{color:var(--ink2);background:none;border:0;padding:6px 2px;text-decoration:underline;text-underline-offset:3px;font-size:14px}
.foot .ah{color:var(--accent)}
.foot.fbf-k{gap:2px 0;padding-top:16px}.foot.fbf-k a{font-size:inherit;padding:3px 0;text-decoration:none}.foot.fbf-k .fbf-x a{text-decoration:underline}   /* the suite's one footer row sets the size (Nov 6); ♥ only in the row */
.pvq{display:block;margin:14px auto 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));z-index:80;max-width:min(92vw,460px);transform:translate(-50%,20px);opacity:0;pointer-events:none;padding:12px 18px;border-radius:14px;background:var(--ink);color:var(--bg);font:500 15px/1.4 var(--sans);box-shadow:0 12px 30px -10px rgba(0,0,0,.5);transition:.25s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.hop{animation:hop .35s}
@keyframes hop{30%{transform:translateX(-5px)}60%{transform:translateX(5px)}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="./" id="brandA"><svg viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#C8442E"/><path d="M96 252 256 118l160 134" fill="none" stroke="#FBF1E0" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/><path d="M136 230v168h240V230" fill="#FBF1E0"/><rect x="166" y="262" width="64" height="58" rx="8" fill="#F2B24A"/><path d="M268 398V280a38 38 0 0 1 76 0v118z" fill="#F2B24A"/><path d="M268 398V280a38 38 0 0 1 22-34.5L312 262v136z" fill="#4E6B3A"/></svg><b data-i="name">Come Over</b></a>
  <button class="ib" id="howB" type="button" data-ia="how"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5V14"/><circle cx="12" cy="17.5" r=".6" fill="currentColor"/></svg></button>
  <div class="rel"><button class="ib" id="langB" type="button" data-ia="lang" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg><span class="lbl" id="langL">EN</span></button></div>
  <button class="ib" id="mineB" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span class="lbl" data-i="mine">My gatherings</span></button>
</div></header>

<main class="wrap" id="main" aria-live="polite"></main>

<footer class="foot wrap" id="foot"><a href="/nearby/" data-i="nearbyLink">Nearby</a> <a class="ah" id="ahA" href="https://www.wei-meng.org/after-hours/" target="_blank" rel="noopener"><span data-i="ah">After hours</span> ↗</a></footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* Come Over, the app: the same invitations as Nearby's Come Over (town_party_* on Nearby's server through party_create /
   edit / get / rsvp / forget, plus party_tz once its migration is in), the same #p=CODE links and the same fb_party list
   on the device. The key that proves you wrote something is sha256("party:" + fb_device_key), made here, never sent. */

      '<div class="two"><label class="fld"><span>' + esc(t("f_date")) + '</span><input id="fD" type="date" value="' + esc(e.date || "") + '"' + (edit ? "" : ' min="' + today() + '"') + '></label><label class="fld"><span>' + esc(t("f_time")) + '</span><input id="fTm" type="' + timeType + '" maxlength="20" value="' + esc(timeVal) + '"></label></div>' +
      '<label class="fld"><span>' + esc(t("f_place")) + '</span><input id="fP" maxlength="120" autocomplete="off" placeholder="' + esc(t("f_placeP")) + '" value="' + esc(e.place || "") + '"><small>' + esc(t("f_placeS")) + "</small></label>" +
      '<div class="fld"><span>' + esc(t("f_items")) + '</span><div class="chips" id="fI">' + chipsHtml() + '</div><div class="ir" style="margin-top:4px"><input id="fN" maxlength="30" autocomplete="off" placeholder="' + esc(t("f_new")) + '" aria-label="' + esc(t("f_new")) + '"><button class="btn sm" type="button" id="fAdd">' + esc(t("f_add")) + "</button></div><small>" + esc(t("f_itemsS")) + "</small></div>" +
      '<div class="lock">' + IC.lock + "<span>" + esc(t("f_send")) + "</span></div>" +
      '<button class="btn pri" type="button" id="fGo">' + esc(t(edit ? "f_save" : "f_go")) + "</button></div>");
    var box = $("#fI", s);
    box.onclick = function (x) { var b = x.target.closest("[data-pick]"); if (!b) return; var i = b.dataset.pick, k = items.indexOf(i); if (k >= 0) items.splice(k, 1); else if (items.length < 12) items.push(i); else return hop(box); b.setAttribute("aria-pressed", String(k < 0)); };
    function add() { var v = $("#fN", s).value.trim().slice(0, 30); if (!v) return; if (pre.indexOf(v) < 0 && extra.indexOf(v) < 0) extra.push(v); if (items.indexOf(v) < 0 && items.length < 12) items.push(v); $("#fN", s).value = ""; box.innerHTML = chipsHtml(); }
    $("#fAdd", s).onclick = add; $("#fN", s).addEventListener("keydown", function (x) { if (x.key === "Enter") { x.preventDefault(); add(); } });
    $("#fGo", s).onclick = function () {
      var ti = $("#fT", s), title = ti.value.trim(); if (!title) { ti.setAttribute("aria-invalid", "true"); hop(ti); ti.focus(); return; }
      var btn = this; btn.disabled = true;
      var body = { p_hosts: $("#fH", s).value.trim(), p_title: title, p_about: $("#fA", s).value.trim(), p_date: $("#fD", s).value || null, p_time: $("#fTm", s).value.trim(), p_place: $("#fP", s).value.trim(), p_items: items };
      if (body.p_hosts && !lsGet("fb_nick")) lsSet("fb_nick", body.p_hosts.slice(0, 24));
      secret(true).then(function (k) { body.p_secret = k; if (edit) { body.p_code = code; return rpc("party_edit", body).then(function () { return code; }); } return rpc("party_create", body); })
        .then(function (c) { if (!c) throw new Error("offline"); return setTz(c).then(function () { return c; }); })
        .then(function (c) {
          closeSheet();
          if (edit) return load();
          remember(c, { title: title, date: body.p_date }, true); location.hash = "#p=" + c;   /* route() loads it */
          var wait = setInterval(function () { if (ev && ev.host && code === c) { clearInterval(wait); sendSheet(); } }, 150); setTimeout(function () { clearInterval(wait); }, 8000);
        })
        .catch(function (x) { btn.disabled = false; toast(friendly(x)); });
    };
  }

  /* ---------- ↗ sending it, with a line for whoever it's for ---------- */
  function lineFor(who) { var d = ev.date ? fmtDate(ev.date, true) : t("soon"); return t("l_" + who, { t: ev.title, d: d }); }
  function sendSheet() {
    var who = lsGet("co_to") || "friend"; if (TO.indexOf(who) < 0) who = "friend";
    var s = sheet("<h3>" + esc(t("s_h")) + '</h3><p class="sub">' + esc(t("s_sub")) + '</p><div class="f"><div class="chips" id="sTo">' + TO.map(function (k) { return '<button type="button" class="chip" data-to="' + k + '" aria-pressed="' + (k === who) + '"><span class="cl">' + esc(t("to_" + k)) + "</span></button>"; }).join("") + "</div>" +
      '<label class="fld"><span class="sr">' + esc(t("s_h")) + '</span><textarea id="sL" class="hand" rows="4" maxlength="400">' + esc(lineFor(who)) + '</textarea><small style="overflow-wrap:anywhere">' + esc(link()) + "</small></label>" +
      '<div class="acts" style="justify-content:flex-start;margin-top:0"><button class="btn pri" type="button" id="sGo">' + IC.send + esc(t("shareIt")) + '</button><button class="btn" type="button" id="sCp">' + esc(t("copy")) + "</button></div></div>", sendSheet);
    $("#sTo", s).onclick = function (x) { var b = x.target.closest("[data-to]"); if (!b) return; who = b.dataset.to; lsSet("co_to", who); $$("[data-to]", s).forEach(function (c) { c.setAttribute("aria-pressed", String(c === b)); }); $("#sL", s).value = lineFor(who); };
    $("#sGo", s).onclick = function () { var text = $("#sL", s).value.trim(); if (navigator.share) navigator.share({ title: ev.title, text: text, url: link() }).then(closeSheet).catch(function () {}); else copy(text + " " + link()); };
    $("#sCp", s).onclick = function () { copy(link()); };
  }
  function copy(text) { if (navigator.clipboard) navigator.clipboard.writeText(text).then(function () { toast(t("copied")); }).catch(function () { prompt("", text); }); else prompt("", text); }

  /* ---------- 💐 flowers instead: a bouquet in the Plaza's own #bq= link, nothing stored ---------- */
  function bqSvg(b) {
    var n = b.f.length, out = "", wr = WRAPS[b.w % WRAPS.length];
    var pos = b.f.map(function (k, i) { var a = n === 1 ? 0 : (i / (n - 1) - .5) * 1.7, r = 22 + (i % 2) * 5; return { k: k, x: 24 + Math.sin(a) * r * .75, y: 30 - Math.cos(a) * r * .8 }; });
    pos.forEach(function (p) { out += '<line x1="24" y1="44" x2="' + p.x.toFixed(1) + '" y2="' + p.y.toFixed(1) + '" stroke="#3f7a3a" stroke-width="1.2"/>'; });
    pos.slice().sort(function (a, c) { return c.y - a.y; }).forEach(function (p) { var c = FLC[p.k]; out += '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="' + (p.k === 6 ? 2.6 : 3.6) + '" fill="' + c[0] + '"/><circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="1.3" fill="' + c[1] + '"/>'; });
    out += '<path d="M11 38h26l-8 22h-10z" fill="' + wr[0] + '"/><path d="M24 38v22" stroke="' + wr[1] + '" stroke-dasharray="2 2"/><path d="M19 45h10" stroke="#c8303a" stroke-width="2.2"/>';
    return '<svg viewBox="0 0 48 64" aria-hidden="true">' + out + "</svg>";
  }
  function flowers() {
    var pick = "sunny", h = hostName(ev);
    var s = sheet("<h3>" + esc(t("fl_h", { h: h })) + '</h3><div class="f"><div class="fld"><span>' + esc(t("fl_pick")) + '</span><div class="bqs" id="bqP">' + Object.keys(BQ).map(function (k) { return '<button type="button" data-bq="' + k + '" aria-pressed="' + (k === pick) + '">' + bqSvg(BQ[k]) + esc(t("fl_" + k)) + "</button>"; }).join("") + "</div></div>" +
      '<label class="fld"><span>' + esc(t("fl_line")) + '</span><textarea id="bqM" class="hand" maxlength="80" rows="2" placeholder="' + esc(t("fl_lineP")) + '"></textarea></label><div class="lock">' + IC.lock + "<span>" + esc(t("pv7")) + '</span></div><button class="btn pri" type="button" id="bqGo">' + esc(t("fl_send")) + "</button></div>", flowers);
    $("#bqP", s).onclick = function (x) { var b = x.target.closest("[data-bq]"); if (!b) return; pick = b.dataset.bq; $$("[data-bq]", s).forEach(function (c) { c.setAttribute("aria-pressed", String(c === b)); }); };
    $("#bqGo", s).onclick = function () {
      var b = BQ[pick], o = { f: b.f.join(""), w: b.w, t: h.slice(0, 24), m: ($("#bqM", s).value.trim() || t("fl_lineP")).slice(0, 80), n: ((ans && ans.name) || lsGet("fb_nick") || "").slice(0, 24) };
      var bq = "#bq=" + btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""), text = t("fl_share");
      var url = window.FBApps ? FBApps.link("flowers", bq) : location.origin + "/nearby/plaza/" + bq;   /* the flower app once it's out, the Plaza's stall till then */
      if (navigator.share) navigator.share({ title: t("fl_h", { h: h }), text: text, url: url }).then(closeSheet).catch(function () {}); else { copy(text + " " + url); closeSheet(); }
    };
  }

  /* ---------- taps ---------- */
  var armed = null;
  function confirmTwice(btn, label) { if (armed === btn) { armed = null; return true; } armed = btn; btn._was = btn.textContent; btn.textContent = label; setTimeout(function () { if (armed === btn) { armed = null; btn.textContent = btn._was; } }, 4000); return false; }
  $("#main").addEventListener("click", function (e) {
    var a = e.target.closest("[data-act]"), g = e.target.closest("[data-going]"), it = e.target.closest("[data-item]");
    if (g) { ans.name = ($("#aName") || {}).value || ans.name; ans.note = ($("#aNote") || {}).value || ans.note; ans.going = g.dataset.going === "1"; invite(); var p = $("#ansP"); if (p) { var b = p.querySelector('[data-going="' + g.dataset.going + '"]'); if (b) b.focus({ preventScroll: true }); } return; }
    if (it) { var i = it.dataset.item, k = ans.items.indexOf(i); if (k >= 0) ans.items.splice(k, 1); else ans.items.push(i); it.setAttribute("aria-pressed", String(k < 0)); return; }
    if (!a) return;
    var act = a.dataset.act;
    if (act === "plan") planForm(false);
    else if (act === "send") sendSheet();
    else if (act === "edit") planForm(true);
    else if (act === "cal") ics();
    else if (act === "retry") load();
    else if (act === "answer") sendAnswer(a);
    else if (act === "reanswer") { editingAnswer = true; invite(); var n = $("#aName"); if (n) n.focus(); }
    else if (act === "flowers") flowers();
    else if (act === "unanswer") { if (!confirmTwice(a, t("takeBack") + " ?")) return; secret(true).then(function (s) { return rpc("party_forget", { p_secret: s, p_code: code }); }).then(function () { ans = null; return load(); }).catch(function (x) { toast(friendly(x)); }); }
    else if (act === "del") { if (!confirmTwice(a, t("delSure"))) return; secret(true).then(function (s) { return rpc("party_forget", { p_secret: s, p_code: code }); }).then(function () { forgetLocal(code); toast(t("delDone"), 4200); location.hash = ""; }).catch(function (x) { toast(friendly(x)); }); }
  });
  document.addEventListener("click", function (e) { if (e.target.closest("[data-pv]")) { e.preventDefault(); privacy(); } if (!e.target.closest(".langm,#langB")) closeLang(); });

  /* language menu */
  function closeLang() { var m = $(".langm"); if (m) m.remove(); $("#langB").setAttribute("aria-expanded", "false"); }
  $("#langB").onclick = function (e) {
    e.stopPropagation(); if ($(".langm")) return closeLang();
    var m = document.createElement("div"); m.className = "langm"; m.setAttribute("role", "menu");
    m.innerHTML = LANGS.map(function (l, i) { return '<button type="button" role="menuitem" data-l="' + l + '" aria-current="' + (l === lang()) + '" lang="' + l + '">' + NAMES[i] + "</button>"; }).join("");
    this.parentNode.appendChild(m); this.setAttribute("aria-expanded", "true"); m.querySelector("[aria-current=true]").focus();
    m.onclick = function (ev2) { var b = ev2.target.closest("[data-l]"); if (b) { closeLang(); setLang(b.dataset.l); } };
  };
  $("#howB").onclick = welcome;
  $("#mineB").onclick = function () { if (code) location.hash = ""; setTimeout(function () { var y = $("#yours"); if (y) y.scrollIntoView({ behavior: "smooth", block: "start" }); }, 60); };
  $("#brandA").onclick = function (e) { if (code) { e.preventDefault(); location.hash = ""; } };

  paintWords(); route();
  if (!code && !lsGet("co_seen")) setTimeout(function () { if (!code && !$(".scrim")) welcome(); }, 600);
  window.CO = { when: when, parseTime: parseTime, instant: instant, ics: function () { return ics; } };   /* test hook */
})();
</script>
