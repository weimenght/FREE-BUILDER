<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Dog-Eared Corner — second-hand books next to Wei's Bar</title>
<meta name="description" content="A four-room book house next door to Wei's Bar. Wander the attic, parlour, garden and basement, read the notes tucked into books, ask for one, and pass it on by hand.">
<meta name="theme-color" content="#1b130e">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<style>
:root{
  --ink:#2a1d14;--paper:#f6eedd;--wood:#6b4426;--wood2:#4a2d18;--wood3:#8a5a33;--brass:#c8a050;--night:#17110d;--glow:#ffcf7a;
  --row:196px;--k:1;--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Songti SC","Noto Serif SC",serif;
  --hand:"Bradley Hand","Segoe Print","Comic Sans MS","Kaiti SC","STKaiti","KaiTi",cursive;--sans:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--night);color:var(--paper);font:16px/1.55 var(--serif);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--glow);outline-offset:3px}

/* ---------- the sign over the door ---------- */
.sign{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:8px max(12px,env(safe-area-inset-left));background:linear-gradient(#24180f,#1b130e);border-bottom:1px solid #3a2a1c;box-shadow:0 8px 24px -16px #000}
.board{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.board svg{flex:none;width:30px;height:30px}
.sign h1{margin:0;font-size:clamp(18px,4.4vw,25px);font-weight:400;letter-spacing:.01em;line-height:1.1;color:#f3dfb8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;gap:6px;align-items:center}
.pill{position:relative;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid #6b5137;background:#2a1d14;color:#f3dfb8;font:600 14px var(--sans);white-space:nowrap}
.pill.pri{background:var(--brass);border-color:var(--brass);color:#2a1d14}
.pill.round{width:40px;padding:0;justify-content:center;font-size:16px}
.pill.lg{width:auto;padding:0 11px;font-size:12px}
.pill[aria-pressed="true"]{border-color:var(--glow);color:var(--glow)}
.pill .n{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:#c2412d;color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}
@media (max-width:600px){.pill .lbl{display:none}.pill{padding:0 12px}}

/* ---------- floor dial ---------- */
.floors{position:fixed;z-index:25;right:max(10px,env(safe-area-inset-right));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px}
.floors a{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:rgba(27,19,14,.82);border:1px solid #5a4330;text-decoration:none;font-size:18px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);position:relative}
.floors a span{position:absolute;right:54px;white-space:nowrap;font:600 12px var(--sans);background:#1b130e;border:1px solid #5a4330;padding:4px 8px;border-radius:8px;opacity:0;transform:translateX(6px);transition:.2s;pointer-events:none}
.floors a:hover span,.floors a:focus-visible span{opacity:1;transform:none}
.floors a.on{border-color:var(--glow);box-shadow:0 0 0 2px rgba(255,207,122,.25)}
@media (max-width:760px){.floors{top:auto;bottom:max(10px,env(safe-area-inset-bottom));right:50%;transform:translateX(50%);flex-direction:row;background:rgba(27,19,14,.9);padding:6px;border-radius:999px;border:1px solid #5a4330}.floors a{width:44px;height:44px;border:0;background:none}.floors a.on{background:#3a2a1c;box-shadow:none}.floors a span{display:none}}

/* ---------- the house ---------- */
.house{max-width:1180px;margin:0 auto;padding:18px 14px 110px;display:grid;grid-template-columns:1fr;grid-template-areas:"attic" "parlor" "garden" "basement"}
@media (min-width:980px){.house{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);grid-template-areas:"attic garden" "parlor garden" "basement basement";padding:28px 80px 60px 24px}}
.room{position:relative;overflow:hidden;padding:22px 18px 26px;border-left:10px solid var(--wood2);border-right:10px solid var(--wood2)}
/* the room's name: a small brass plaque on the wall */
.plaque{position:relative;z-index:2;display:inline-block;margin:0 0 16px;padding:4px 14px;font:400 clamp(17px,3.4vw,21px)/1.2 var(--serif);letter-spacing:.04em;color:#2a1d14;background:linear-gradient(#e6c47a,#b8893a);border-radius:3px;box-shadow:0 2px 0 #7a5420,0 6px 14px -6px #000}
.plaque::before,.plaque::after{content:"";position:absolute;top:50%;width:4px;height:4px;margin-top:-2px;border-radius:50%;background:#6b4a1c}.plaque::before{left:5px}.plaque::after{right:5px}

#attic{grid-area:attic;background:linear-gradient(180deg,#3a2818,#2b1d12 60%,#24180f);padding-top:72px;clip-path:polygon(50% 0,100% 54px,100% 100%,0 100%,0 54px)}
#attic::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 120px,rgba(0,0,0,.18) 120px 132px),repeating-linear-gradient(65deg,transparent 0 120px,rgba(0,0,0,.12) 120px 132px);pointer-events:none}
.skylight{position:absolute;top:30px;right:12%;width:110px;height:70px;border:6px solid #5a3c22;border-radius:4px;background:linear-gradient(#0e1726,#1f3150);box-shadow:inset 0 0 20px rgba(150,180,255,.25)}
.skylight::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(100deg,transparent 0 9px,rgba(190,210,255,.25) 9px 10px);animation:rain 1s linear infinite}
@keyframes rain{to{background-position:0 30px}}
#parlor{grid-area:parlor;background:linear-gradient(180deg,#3d2a1a,#2e2014);border-top:12px solid var(--wood2)}
#parlor::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 8%,rgba(255,200,110,.18),transparent 45%);pointer-events:none}
#basement{grid-area:basement;background:#241914;border-top:12px solid var(--wood2);border-bottom:12px solid var(--wood2)}
#basement::before{content:"";position:absolute;inset:0;opacity:.35;background-image:linear-gradient(#3a241a 2px,transparent 2px),linear-gradient(90deg,#3a241a 2px,transparent 2px),linear-gradient(90deg,#3a241a 2px,transparent 2px);background-size:64px 28px,64px 56px,64px 56px;background-position:0 0,0 0,32px 28px;pointer-events:none}
.bulb{position:absolute;top:0;left:50%;width:2px;height:46px;background:#5a4330}
.bulb::after{content:"";position:absolute;left:-7px;top:44px;width:16px;height:20px;border-radius:50% 50% 45% 45%;background:radial-gradient(circle at 50% 40%,#fff3c4,#ffcf7a 60%,#b07a2a);box-shadow:0 0 40px 18px rgba(255,200,110,.22);animation:sway 7s ease-in-out infinite;transform-origin:50% -44px}
@keyframes sway{50%{transform:rotate(3deg)}}
#garden{grid-area:garden;padding:22px 18px 26px;background:linear-gradient(180deg,#141c2b 0,#1d2a33 46%,#24331f 46.2%,#1f2b1a)}
@media (min-width:980px){#garden{margin-left:18px}}
.stars{position:absolute;inset:0 0 54% 0;background-image:radial-gradient(1px 1px at 20% 30%,#fff9,transparent),radial-gradient(1px 1px at 70% 20%,#fff8,transparent),radial-gradient(1.5px 1.5px at 45% 12%,#fffa,transparent),radial-gradient(1px 1px at 88% 40%,#fff7,transparent);pointer-events:none}
.lights{position:absolute;left:0;right:0;top:44%;height:30px;pointer-events:none;background:radial-gradient(circle,#ffd68a 0 3px,transparent 4px) 0 8px/38px 30px repeat-x;filter:drop-shadow(0 0 6px #ffcf7a);opacity:.9}

/* the bar next door, over the fence */
.nextdoor{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:16px;height:150px;margin:0 0 14px;padding:0 12px 12px;border-radius:6px 6px 0 0;background:linear-gradient(#2a1810,#1d110b);border:1px solid #4a2d18;text-decoration:none}
.nextdoor .win{width:58px;height:70px;border-radius:30px 30px 4px 4px;background:radial-gradient(circle at 50% 70%,#ffcf7a,#e08a2e 60%,#7a3d10);box-shadow:0 0 30px rgba(255,180,90,.55);border:4px solid #4a2d18;transition:box-shadow .3s}
.nextdoor:hover .win{box-shadow:0 0 44px rgba(255,180,90,.85)}
.nextdoor .neon{position:absolute;top:14px;left:50%;transform:translateX(-50%);font:italic 600 18px var(--serif);color:#ffd9a8;text-shadow:0 0 6px #ff9b4a,0 0 14px #ff6a2a;white-space:nowrap;animation:flick 6s infinite}
@keyframes flick{0%,92%,100%{opacity:1}93%,95%{opacity:.4}}
.nextdoor .door{position:absolute;right:12px;bottom:0;width:34px;height:56px;border-radius:16px 16px 0 0;background:#3a2214;border:3px solid #4a2d18;box-shadow:inset 0 0 0 3px #2a180e}
.nextdoor .door::after{content:"→";position:absolute;inset:0;display:grid;place-items:center;color:#ffd9a8;font:600 14px var(--sans)}
.fence{height:26px;margin:-14px -18px 14px;background:repeating-linear-gradient(90deg,#5b4430 0 14px,transparent 14px 20px);border-top:4px solid #5b4430}

/* ---------- furniture ---------- */
.case{position:relative;border:10px solid var(--wood);border-bottom-width:14px;background:linear-gradient(#22160d,#2c1d12);box-shadow:inset 0 0 30px #000a;padding:0 8px}
.case .rows{display:flex;flex-wrap:wrap;align-items:flex-end;min-height:var(--row);background:repeating-linear-gradient(180deg,transparent 0 calc(var(--row) - 12px),var(--wood3) calc(var(--row) - 12px) calc(var(--row) - 8px),var(--wood2) calc(var(--row) - 8px) var(--row))}
.slot{height:var(--row);display:flex;align-items:flex-end;padding-bottom:12px}
.pile{display:flex;flex-direction:column-reverse;align-items:center;gap:1px;padding:6px 8px 0;min-height:60px}
.split{display:grid;gap:18px;margin-top:18px}
@media (min-width:700px){.split{grid-template-columns:1fr 1fr}}
.surface{position:relative;display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px;padding:10px 10px 0;min-height:96px;border-bottom:16px solid var(--wood)}
.surface .obj{position:absolute;right:6px;bottom:2px;font-size:24px;line-height:1;pointer-events:none;filter:drop-shadow(0 2px 4px #000)}
/* steamer trunk: leather, two straps */
.surface.trunk{border-bottom:0;padding-bottom:58px}
.surface.trunk::after{content:"";position:absolute;left:4px;right:4px;bottom:0;height:56px;border-radius:8px 8px 3px 3px;background:linear-gradient(90deg,transparent 18%,#3a2414 18% 22%,transparent 22% 78%,#3a2414 78% 82%,transparent 82%),linear-gradient(#6b3f22,#4a2a16);box-shadow:inset 0 3px 0 #8a5a33,0 6px 12px -6px #000}
/* window seat: a window behind the cushion */
.surface.window{border-bottom-color:#7d3c2a}
.surface.window::before{content:"";position:absolute;left:12%;right:12%;bottom:0;top:-34px;z-index:-1;border:6px solid #5a3c22;border-bottom:0;border-radius:60px 60px 0 0;background:linear-gradient(#24324a,#3a4a5f);opacity:.75}
.surface.window{z-index:0}
/* the counter */
.surface.counter{border-bottom:22px solid #5a3820;box-shadow:0 6px 0 #3a2414}
/* garden */
.surface.bench{border-bottom:10px solid #5d6b44;box-shadow:0 6px 0 -2px #3f4a2e,0 12px 0 -4px #5d6b44}
.surface.potting{border-bottom:14px solid #7a5a3a}
.ivy{position:absolute;inset:-10px -10px auto -10px;height:40px;pointer-events:none;background:radial-gradient(circle at 10px 8px,#3f6b34 0 6px,transparent 7px) 0 0/22px 18px,radial-gradient(circle at 4px 14px,#2f5426 0 5px,transparent 6px) 8px 4px/26px 22px;z-index:2}
/* basement */
.surface.crate{border-bottom:0;padding-bottom:50px}
.surface.crate::after{content:"";position:absolute;left:4px;right:4px;bottom:0;height:48px;background:repeating-linear-gradient(90deg,#7a5a3a 0 4px,transparent 4px 50%),repeating-linear-gradient(#8a6a44 0 12px,#6b4e30 12px 14px);border:4px solid #5a4030;box-shadow:0 6px 12px -6px #000}
.surface.steps{border-bottom:0;padding-bottom:40px}
.surface.steps::after{content:"";position:absolute;left:0;right:0;bottom:0;height:40px;background:linear-gradient(90deg,#4a4a48 0 34%,transparent 34%) 0 0/100% 14px no-repeat,linear-gradient(90deg,#3f3f3d 0 67%,transparent 67%) 0 14px/100% 13px no-repeat,#353533}

/* ---------- books ---------- */
.bk{position:relative;flex:none;margin:0 1px;border-radius:2px 3px 3px 2px;transform-origin:bottom center;transition:transform .25s ease,filter .25s;border:0;padding:0;display:block;box-shadow:inset -3px 0 6px rgba(0,0,0,.35),inset 2px 0 2px rgba(255,255,255,.12),1px 0 2px rgba(0,0,0,.4)}
.bk::before,.bk::after{content:"";position:absolute;left:3px;right:3px;height:2px;background:rgba(255,235,190,.35)}
.bk::before{top:12px}.bk::after{bottom:14px}
.bk .t{position:absolute;inset:22px 2px 22px;writing-mode:vertical-rl;transform:rotate(180deg);font:600 11.5px/1.05 var(--serif);color:rgba(255,245,225,.92);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;letter-spacing:.02em}
.bk:hover,.bk:focus-visible{transform:translateY(-10px) rotate(0deg)!important;filter:brightness(1.15);z-index:3}
.bk.lie{height:var(--th,26px)!important;width:var(--tw,150px)!important;border-radius:2px}
.bk.lie .t{writing-mode:horizontal-tb;transform:none;inset:4px 10px;line-height:calc(var(--th,26px) - 8px);font-size:11px}
.bk.lie::before,.bk.lie::after{width:2px;height:auto;top:3px;bottom:3px;left:10px;right:auto}.bk.lie::after{left:auto;right:10px}
.bk.lie:hover,.bk.lie:focus-visible{transform:translateX(8px) rotate(var(--r,0deg))!important}
.bk .rib{position:absolute;top:-6px;right:4px;width:7px;height:26px;background:#c2412d;clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%)}
.bk.lie .rib{top:-4px;right:18px;height:18px}
.bk .hc{position:absolute;bottom:3px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--brass);opacity:.8}
.bk .mk{position:absolute;top:-12px;left:50%;margin-left:-8px;font-size:13px;line-height:1;filter:drop-shadow(0 1px 2px #000)}
.bk.lie .mk{left:auto;right:-4px;top:-10px}
.bk.new{animation:arrive 1.6s ease}
@keyframes arrive{0%{transform:translateY(-60px);opacity:0}60%{transform:translateY(4px)}100%{opacity:1}}
.bk.peek{animation:peek 1.4s ease}
@keyframes peek{30%{transform:translateY(-16px) rotate(-3deg)}55%{transform:translateY(-12px) rotate(2deg)}100%{transform:none}}
.bk.lie.peek{animation:peekx 1.4s ease}
@keyframes peekx{35%{transform:translateX(14px)}100%{transform:none}}
.bk:not(.lie){height:calc(var(--h) * var(--k))!important;width:calc(var(--w) * var(--k))!important}
.bk.decor{pointer-events:none;filter:saturate(.35) brightness(.62)}.bk.decor::before,.bk.decor::after{opacity:.4}
/* an empty place for your book */
.ghost{flex:none;align-self:flex-end;margin:0 3px;width:calc(30px * var(--k));height:calc(150px * var(--k));border:2px dashed rgba(255,215,150,.38);border-radius:3px;background:rgba(255,215,150,.04);color:rgba(255,215,150,.7);font:300 26px/1 var(--sans);display:grid;place-items:center;transition:.2s}
.ghost:hover,.ghost:focus-visible{border-color:var(--glow);color:var(--glow);background:rgba(255,215,150,.1)}
.pile .ghost,.surface>.ghost{width:calc(120px * var(--k));height:26px;font-size:18px}

/* the cats from next door */
.cat{position:absolute;bottom:14px;left:-80px;z-index:4;width:64px;height:40px;cursor:pointer;background:none;border:0;padding:0;animation:walk 16s linear forwards}
.cat svg{width:100%;height:100%;overflow:visible}
.cat .legs{animation:step .4s steps(2) infinite}
.cat.rev{animation-name:walkback}.cat.rev svg{transform:scaleX(-1)}
.cat.sit{animation:none}
@keyframes walk{to{left:calc(100% + 80px)}}
@keyframes walkback{from{left:calc(100% + 80px)}to{left:-80px}}
@keyframes step{50%{transform:translateY(-1px)}}
.bubble{position:absolute;z-index:6;bottom:64px;transform:translateX(-30%);max-width:240px;background:var(--paper);color:var(--ink);border-radius:14px;padding:10px 12px;font:14px/1.4 var(--serif);box-shadow:0 10px 30px -10px #000}
.bubble a{font:600 13px var(--sans);color:#8a3d10}

/* ---------- sheets ---------- */
.scrim{position:fixed;inset:0;z-index:70;background:rgba(10,7,5,.66);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@media (min-width:760px){.scrim{align-items:center;padding:24px}}
@keyframes fade{from{opacity:0}}
.sheet{position:relative;width:min(860px,100%);max-height:92dvh;overflow:auto;background:var(--paper);color:var(--ink);border-radius:20px 20px 0 0;box-shadow:0 30px 90px -20px #000;animation:up .28s ease}
.sheet.narrow{width:min(520px,100%)}
@media (min-width:760px){.sheet{border-radius:16px}}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.x{position:sticky;top:0;float:right;margin:10px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(42,29,20,.08);font-size:20px;z-index:2}
.open{display:grid;grid-template-columns:1fr}
@media (min-width:760px){.open{grid-template-columns:1fr 1fr}.open>.pg+.pg{border-left:1px solid #d9c9a8;box-shadow:inset 14px 0 18px -16px rgba(0,0,0,.35)}}
.pg{padding:24px 24px 28px}
.cover{width:132px;aspect-ratio:2/3;border-radius:3px 6px 6px 3px;box-shadow:6px 8px 18px -8px rgba(0,0,0,.55);display:grid;place-items:center;text-align:center;padding:12px;font:600 14px/1.2 var(--serif);color:#fff6e4;overflow:hidden;background-size:cover;background-position:center;float:left;margin:0 18px 10px 0;position:relative}
.cover .hc{position:absolute;bottom:8px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--brass);box-shadow:0 0 0 2px rgba(0,0,0,.2)}
.pg h3{margin:0;font:400 26px/1.15 var(--serif)}
.meta{font:13px/1.5 var(--sans);color:#6b5137;margin-top:4px}
.wear{margin-top:10px;font:italic 15px/1.4 var(--serif);color:#6b4426}
.wear::before{content:"✦ ";color:var(--brass)}
/* the library card: who has had it */
.lcard{clear:both;margin-top:14px;background:#fbf3df;border:1px solid #e0cda6;border-radius:3px;padding:8px 12px 6px;box-shadow:0 6px 14px -10px rgba(0,0,0,.5);background-image:repeating-linear-gradient(transparent 0 25px,#e7d6b2 25px 26px);background-position:0 30px}
.lcard .lh{display:flex;justify-content:space-between;font:700 10px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:#a33a26;padding-bottom:8px;border-bottom:2px solid #a33a26}
.lcard ol{list-style:none;margin:0;padding:0}
.lcard li{display:flex;justify-content:space-between;gap:10px;height:26px;align-items:center;font:16px/1 var(--hand);color:#2c3e6b}
.lcard li small{font:12px var(--sans);color:#8a6a48;white-space:nowrap}
.lcard li.cur{font-weight:700}
.lcard li.cur small{color:#a33a26}
.card{position:relative;margin:6px 0 16px;padding:18px 18px 20px;background:#fffaf0;border:1px solid #e3d3b2;border-radius:4px;transform:rotate(-1.2deg);box-shadow:0 8px 20px -14px rgba(0,0,0,.6);font:19px/1.45 var(--hand);color:#2c3e6b;white-space:pre-wrap}
.card::before{content:"";position:absolute;top:-10px;left:28px;width:60px;height:18px;background:rgba(200,160,80,.45);transform:rotate(-4deg)}
.card .by{display:block;margin-top:10px;font:13px var(--sans);color:#6b5137;font-style:normal}
.card.blank{color:#a08a6a;font-style:italic;font-size:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font:600 15px var(--sans)}
.btn.pri{background:var(--ink);color:var(--paper)}
.btn.sm{min-height:38px;padding:0 14px;font-size:13.5px}
.btn.warn{border-color:#a12a1a;color:#a12a1a}
.btn:disabled{opacity:.5}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.note{font:13px/1.5 var(--sans);color:#6b5137}
.stamp{display:inline-block;border:2px solid #8a3d10;color:#8a3d10;font:700 12px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;padding:7px 9px;border-radius:4px;transform:rotate(-4deg)}
.ribbon{display:inline-flex;align-items:center;gap:4px;font:600 13px var(--sans);color:#a12a1a}
/* forms */
form.f,.ledger{padding:24px}
.f h3,.ledger h3{margin:0 40px 14px 0;font:400 24px/1.2 var(--serif)}
.head{display:flex;gap:12px;align-items:center;margin:0 40px 16px 0}
.mini{flex:none;width:34px;height:50px;border-radius:2px 3px 3px 2px;background-size:cover;background-position:center;box-shadow:2px 3px 8px -3px rgba(0,0,0,.5)}
.head b{display:block;font:400 20px/1.2 var(--serif)}
.head span{font:13px var(--sans);color:#6b5137}
.fld{display:block;margin:12px 0 0}
.fld>span{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px;font:600 13px var(--sans);color:#4a3626}
.fld>span i{font-style:normal;font-weight:400;color:#8a6a48}
.f input,.f textarea{width:100%;font:16px/1.4 var(--serif);color:var(--ink);background:#fffaf0;border:1px solid #d9c9a8;border-radius:10px;padding:11px 12px}
.f input[aria-invalid="true"],.f textarea[aria-invalid="true"]{border-color:#a12a1a;animation:nudge .3s}
@keyframes nudge{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.f textarea.paper{min-height:120px;resize:vertical;font:19px/1.45 var(--hand);color:#2c3e6b;background:#fffaf0 repeating-linear-gradient(transparent 0 26px,#ecdcbc 26px 27px);background-attachment:local;line-height:27px;padding-top:8px}
.lock{display:inline-flex;align-items:center;gap:4px;font:600 12px var(--sans);color:#6b4426;background:#efe3cb;border-radius:999px;padding:2px 9px}
.warn{color:#a12a1a;font:600 13px var(--sans);margin-top:6px}
.tuckgrid{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:640px){.tuckgrid{grid-template-columns:120px 1fr}}
.preview{display:flex;justify-content:center;align-items:flex-end;height:180px;padding-bottom:6px;border-bottom:10px solid var(--wood);background:linear-gradient(#efe3cb,#e6d6b6)}
.preview .pv{width:34px;height:150px;border-radius:2px 3px 3px 2px;position:relative;box-shadow:inset -3px 0 6px rgba(0,0,0,.35),2px 2px 6px rgba(0,0,0,.3);transition:background .3s}
.preview .pv.cov{width:100px;height:150px;background-size:cover!important;background-position:center!important}
.preview .pv span{position:absolute;inset:16px 2px;writing-mode:vertical-rl;transform:rotate(180deg);font:600 12px/1 var(--serif);color:#fff6e4;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-align:center}
.preview .pv.cov span{display:none}
.titlerow{display:flex;gap:8px}
.found{display:flex;gap:8px;overflow-x:auto;margin-top:8px;padding-bottom:4px}
.found button{flex:none;width:64px;padding:0;border:2px solid transparent;border-radius:4px;background:none}
.found button[aria-pressed="true"]{border-color:var(--ink)}
.found img{display:block;width:60px;height:90px;object-fit:cover;border-radius:2px;background:#ddd}
.found .note{align-self:center}
.rooms4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rooms4 button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:12px;border:1px solid #d9c9a8;background:#fffaf0;font:600 12px var(--sans)}
.rooms4 button b{font-size:22px;line-height:1.1}
.rooms4 button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
/* my shelf */
.ledger h4{margin:22px 0 8px;font:600 12px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:#8a6a48}
.item{display:flex;gap:12px;border:1px solid #e3d3b2;background:#fffaf0;border-radius:12px;padding:10px 12px;margin:8px 0}
.item .mini{width:26px;height:40px}
.item>div{flex:1;min-width:0}
.item b{font-weight:600}
.ask{margin-top:10px;padding:10px 12px;border-radius:10px;background:#f6ead2;font:14px/1.45 var(--sans)}
.ask .c{font-weight:700;color:#8a3d10;word-break:break-word}
.ask q{display:block;margin-top:4px;font:16px/1.4 var(--hand);color:#2c3e6b}
.chip{display:inline-block;font:600 12px var(--sans);padding:2px 9px;border-radius:999px;background:#efe3cb;color:#6b4426}
.keybox{display:flex;align-items:center;gap:10px;background:#efe3cb;border-radius:12px;padding:10px 12px}
.keybox svg{flex:none;width:34px;height:34px}
.keybox code{flex:1;min-width:0;font:11px/1.4 ui-monospace,Menlo,monospace;word-break:break-all;color:#6b4426;filter:blur(3px);transition:filter .2s;cursor:pointer}
.keybox code.show{filter:none}
.emptyshelf{height:120px;margin:10px 0;border:10px solid var(--wood);border-bottom-width:14px;background:linear-gradient(#22160d,#2c1d12);display:flex;align-items:flex-end;padding:0 12px 6px}
.emptyshelf .ghost{height:90px;width:28px}
details{margin-top:16px}summary{cursor:pointer;font:600 13px var(--sans);color:#6b5137}
.foot{max-width:1180px;margin:0 auto;padding:0 18px 120px;display:flex;justify-content:center;gap:18px;font:13px/1.6 var(--sans);color:#bfa27a}
.foot button{background:none;border:0;padding:0;color:inherit;text-decoration:underline}
.ps{list-style:none;margin:0;padding:0}
.ps li{display:flex;gap:12px;margin:12px 0;font:14px/1.5 var(--sans);color:#4a3626}
.ps li b{flex:none;width:26px;font-size:18px;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:90;background:var(--paper);color:var(--ink);padding:10px 16px;border-radius:999px;font:600 14px var(--sans);box-shadow:0 10px 30px -10px #000;opacity:0;transition:opacity .3s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1}
@media (max-width:560px){:root{--row:160px;--k:.8}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="sign">
  <div class="board">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 6h16l6 6v14H5z" fill="#c8a050"/><path d="M21 6v6h6" fill="#8a6a2a"/><path d="M9 14h12M9 18h12M9 22h8" stroke="#2a1d14" stroke-width="1.6" stroke-linecap="round"/></svg>
    <h1 data-i="name">The Dog-Eared Corner</h1>
  </div>
  <div class="acts">

</header>

<nav class="floors" data-ia="rooms">

  <a href="#parlor" data-r="parlor"><b aria-hidden="true">🛋️</b><span data-i="parlor">The parlour</span></a>
  <a href="#garden" data-r="garden"><b aria-hidden="true">🌿</b><span data-i="garden">The garden</span></a>
  <a href="#basement" data-r="basement"><b aria-hidden="true">🧱</b><span data-i="basement">The basement</span></a>

<main class="house" id="house">
  <section class="room" id="attic" aria-labelledby="h-attic">
    <div class="skylight" aria-hidden="true"></div>
    <h2 class="plaque" id="h-attic" data-i="attic">The attic</h2>
    <div class="case"><div class="rows" data-spot="attic-eaves"></div></div>
    <div class="split">
      <div class="surface trunk" data-spot="attic-trunk" data-pile></div>
      <div class="surface" data-spot="attic-skylight" data-pile><span class="obj" aria-hidden="true">🕯️</span></div>
    </div>
  </section>

  <section class="room" id="parlor" aria-labelledby="h-parlor">

  /* ---------- the cats from next door ---------- */
  var CATS = { Yuzu: { body: "#e8913a", belly: "#f8dcae", eye: "#4f9a62", stripe: "#b5611d" }, Miso: { body: "#231b17", belly: "#3a2f29", eye: "#f2c94c", stripe: "#231b17" } };
  function catSvg(c) {

    return '<svg viewBox="0 0 64 40" aria-hidden="true"><path d="M8 26c0-9 10-14 24-14s20 4 22 10l-2 6H10z" fill="' + k.body + '"/><path d="M14 28h34" stroke="' + k.belly + '" stroke-width="4" stroke-linecap="round"/>' +
      '<path d="M8 22c-6-2-8-8-4-12" fill="none" stroke="' + k.body + '" stroke-width="4" stroke-linecap="round"/><circle cx="52" cy="17" r="9" fill="' + k.body + '"/><path d="M45 11l2-8 5 6zM59 11l-2-8-5 6z" fill="' + k.body + '"/>' +
      '<circle cx="49" cy="16" r="1.6" fill="' + k.eye + '"/><circle cx="55" cy="16" r="1.6" fill="' + k.eye + '"/><path d="M20 16l2 6M28 14l1 6" stroke="' + k.stripe + '" stroke-width="2" opacity=".6"/>' +
      '<g class="legs" fill="' + k.body + '"><rect x="14" y="28" width="4" height="10" rx="2"/><rect x="22" y="28" width="4" height="10" rx="2"/><rect x="40" y="28" width="4" height="10" rx="2"/><rect x="47" y="28" width="4" height="10" rx="2"/></g></svg>';

      var b = document.createElement("div"); b.className = "bubble"; b.style.left = (r.left - rr.left) + "px";
      b.innerHTML = esc(t("c" + (1 + Math.floor(Math.random() * 5)), { c: t(name) })) + '<br><a href="../bar/">' + esc(t("next")) + "</a>";
      room.appendChild(b); setTimeout(function () { b.remove(); c.remove(); }, 6000);

    room.appendChild(c); c.addEventListener("animationend", function () { c.remove(); });

  /* ---------- sound: rain on the skylight and a needle on vinyl ---------- */
  var ac = null, on = false, gain;
  function sound() {
    on = !on; $("#snd").setAttribute("aria-pressed", String(on));
    if (!ac) {
      ac = new (window.AudioContext || window.webkitAudioContext)(); gain = ac.createGain(); gain.gain.value = 0; gain.connect(ac.destination);
      var len = ac.sampleRate * 2, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0), last = 0;
      for (var i = 0; i < len; i++) { var w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; d[i] = last * 3.2 + (Math.random() < 0.0004 ? (Math.random() - 0.5) * 0.9 : 0); }
      var src = ac.createBufferSource(); src.buffer = buf; src.loop = true; var lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1400; src.connect(lp); lp.connect(gain); src.start();
    }
    ac.resume(); gain.gain.setTargetAtTime(on ? 0.35 : 0, ac.currentTime, 0.4);
  }

  function floors() {
    var links = $$(".floors a");
    var io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) links.forEach(function (a) { a.classList.toggle("on", a.dataset.r === e.target.id); }); }); }, { rootMargin: "-45% 0px -45% 0px" });
    ["attic", "parlor", "garden", "basement"].forEach(function (id) { io.observe($("#" + id)); });
  }

  paintWords();

  $("#mine").onclick = ledger; $("#privacyBtn").onclick = privacy; $("#snd").onclick = sound;
  floors(); later(); setTimeout(catWalk, 6000); setTimeout(peek, 2500); setInterval(peek, 14000);
  (function keys() {
