html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:500 15px/1.4 'Plus Jakarta Sans',system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(1200px 700px at 70% -10%,rgba(246,183,60,.18),transparent 60%),radial-gradient(900px 600px at -10% 110%,rgba(155,111,216,.16),transparent 60%),repeating-linear-gradient(90deg,rgba(255,255,255,.015) 0 2px,transparent 2px 44px),var(--bg);min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:max(14px,env(safe-area-inset-top)) 16px 4px;max-width:1180px;margin:0 auto}
.sign{font:700 26px/1 'Fraunces',Georgia,serif;letter-spacing:.06em;color:#fff3d6;text-shadow:0 0 6px var(--glow),0 0 18px var(--glow),0 0 40px rgba(246,183,60,.6);animation:flick 7s infinite}
.sign span{color:#ff8fa0;text-shadow:0 0 6px #ff5f6d,0 0 18px #ff5f6d}
@keyframes flick{0%,92%,100%{opacity:1}93%{opacity:.55}94%{opacity:1}96%{opacity:.7}}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;height:44px;padding:0 12px;border-radius:999px;border:1px solid rgba(251,238,221,.25);background:rgba(255,255,255,.05);cursor:pointer}
.pill:hover{background:rgba(255,255,255,.1)}
main{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;max-width:1180px;margin:0 auto;padding:10px 16px 90px}
@media (min-width:900px){main{grid-template-columns:minmax(0,1.25fr) minmax(320px,.9fr);align-items:start}.room{position:sticky;top:12px}}

/* ---------- the desk ---------- */
.desk{--a:#f6b73c;border-radius:22px;padding:14px;background:linear-gradient(180deg,#2a1810,#1f120b);box-shadow:inset 0 1px 0 rgba(255,220,180,.12),0 30px 60px -30px #000;border:1px solid rgba(201,164,106,.25)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:6px}
.chip{width:46px;height:46px;border-radius:14px;border:1px solid rgba(251,238,221,.16);background:rgba(255,255,255,.04);font-size:22px;cursor:pointer;display:grid;place-items:center;transition:transform .15s,background .2s,box-shadow .2s}
.chip:active{transform:scale(.92)}
.chip[aria-pressed="true"]{background:color-mix(in srgb,var(--a) 28%,transparent);border-color:var(--a);box-shadow:0 0 0 1px var(--a),0 0 16px -2px var(--a)}
.sep{flex:1}
.tempo{display:flex;align-items:center;gap:6px;font-size:18px}
.tempo input{width:110px;accent-color:var(--a)}

.roll{position:relative;margin:14px 0 12px;padding:10px;border-radius:16px;background:#120a06;box-shadow:inset 0 0 0 1px rgba(201,164,106,.2),inset 0 8px 24px rgba(0,0,0,.6);touch-action:none;user-select:none;-webkit-user-select:none}
.grid{display:grid;gap:4px;grid-template-columns:repeat(16,minmax(0,1fr))}
.cell{position:relative;aspect-ratio:1;border:0;padding:0;border-radius:50%;background:radial-gradient(circle at 40% 35%,rgba(255,255,255,.08),rgba(255,255,255,.03));box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);cursor:pointer;transition:background .12s,box-shadow .12s,transform .1s}
.cell.q{box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),-3px 0 0 -1px rgba(201,164,106,.18)}
.cell.on{background:radial-gradient(circle at 40% 35%,#fff,hsl(var(--c),95%,66%) 45%,hsl(var(--c),85%,45%));box-shadow:0 0 10px 1px hsl(var(--c),95%,60%),inset 0 0 0 1px rgba(255,255,255,.4)}
.cell.d{border-radius:7px}
.cell.d.on{background:linear-gradient(#fff6e0,#e8c48a);box-shadow:0 0 10px rgba(255,220,150,.7)}
.cell.ph{transform:scale(1.12)}
.cell.on.ph{filter:brightness(1.35)}
.col-hit{background-color:rgba(255,255,255,.06)}
.lane{display:grid;place-items:center;font-size:15px;opacity:.85}
.gap{height:8px}
/* phones: the paper strip feeds downward, like a music box */
.v .grid{grid-template-columns:repeat(8,minmax(0,1fr)) 6px repeat(3,minmax(0,1fr))}

.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.play{width:62px;height:62px;border-radius:50%;border:0;cursor:pointer;font-size:24px;background:radial-gradient(circle at 35% 30%,#fff2cc,var(--a) 55%,color-mix(in srgb,var(--a) 60%,#000));color:#2a1205;box-shadow:0 8px 20px -8px var(--a);transition:transform .15s}
.play:active{transform:scale(.94)}
.press{margin-left:auto;display:inline-flex;align-items:center;gap:10px;height:56px;padding:0 20px 0 10px;border-radius:999px;border:0;cursor:pointer;background:linear-gradient(135deg,#ffd27a,#f08a5d);color:#2a1205;font:800 16px 'Plus Jakarta Sans',system-ui,sans-serif;box-shadow:0 10px 24px -10px rgba(240,138,93,.9)}
.press .v1{width:40px;height:40px;border-radius:50%;background:repeating-radial-gradient(circle,#111 0 2px,#2a2a2a 2px 3px);position:relative;animation:spin 3s linear infinite}
.press .v1:after{content:'';position:absolute;inset:34%;border-radius:50%;background:var(--a)}
.press:disabled{opacity:.5;cursor:default}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- pressing ---------- */
.scrim{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:rgba(10,5,3,.86);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);animation:fade .25s}
@keyframes fade{from{opacity:0}}
.vinyl{position:relative;width:min(84vw,380px);aspect-ratio:1;border-radius:50%;background:repeating-radial-gradient(circle,#0e0e0e 0 2px,#1d1d1d 2px 3px);box-shadow:0 30px 60px -20px #000,inset 0 0 0 3px #000;display:grid;place-items:center}
.vinyl:before{content:'';position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 30deg,transparent 0 40deg,rgba(255,255,255,.12) 55deg,transparent 70deg 210deg,rgba(255,255,255,.08) 225deg,transparent 240deg);pointer-events:none}
.label{position:relative;width:58%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#1a1a1a 0 5%,transparent 5.5%),radial-gradient(circle at 50% 50%,hsl(var(--lh),70%,62%),hsl(var(--lh),60%,46%));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12%;color:#22120a;box-shadow:inset 0 0 0 4px rgba(0,0,0,.15)}
.label input{width:100%;border:0;border-bottom:1.5px dashed rgba(34,18,10,.45);background:transparent;text-align:center;color:#22120a;padding:4px 2px;border-radius:0}
.label input:focus{outline:none;border-bottom-color:#22120a}
.label #ttl{font:700 clamp(16px,4.6vw,21px)/1.1 'Fraunces',Georgia,'Songti SC',serif}
.label #who{font:600 13px 'Plus Jakarta Sans',system-ui,sans-serif}
.label input::placeholder{color:rgba(34,18,10,.5)}
.label .hole{width:12px;height:12px;border-radius:50%;background:#0e0e0e;margin:2px 0}
.go{position:absolute;right:-6px;bottom:4%;width:74px;height:74px;border-radius:50%;border:0;cursor:pointer;background:radial-gradient(circle at 35% 30%,#fff6c8,#e6b43a 45%,#a8751a);box-shadow:0 10px 24px -6px rgba(0,0,0,.7);font-size:30px;display:grid;place-items:center}
.go:disabled{filter:grayscale(.7);opacity:.7}
.x{position:absolute;top:-4px;left:-4px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(251,238,221,.3);background:#2a1a10;font-size:20px;cursor:pointer}
.vinyl.away{transition:transform .9s cubic-bezier(.6,0,.4,1),opacity .9s;transform:translateY(60vh) scale(.2) rotate(540deg);opacity:0}
.say{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:10px 16px;border-radius:999px;background:#fbeedd;color:#2a1205;font-weight:700;box-shadow:0 10px 24px rgba(0,0,0,.5);z-index:90;opacity:0;transition:opacity .3s;pointer-events:none;max-width:92vw;text-align:center}
.say.show{opacity:1}
.err{animation:shake .4s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.room h2{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:420px){.chip{width:42px;height:42px;font-size:20px}.tempo input{width:84px}.press{height:52px;padding-right:16px}}
@media (prefers-reduced-motion:reduce){.sign,.press .v1{animation:none}}
</style>
</head>
<body>
<header class="top">
  <div class="sign" aria-label="Jukebox">JUKE<span>BOX</span></div>
  <button class="pill" type="button" data-fbl-btn aria-label="Language"><span aria-hidden="true">🌐</span><span data-fbl-label>EN</span></button>
</header>

<main>
  <section class="desk" aria-label="Make a tune">
    <div class="row">
      <div class="chips" role="group" id="moods"></div>
      <span class="sep"></span>
      <div class="chips" role="group" id="insts"></div>
    </div>
    <div class="roll" id="roll"><div class="grid" id="grid"></div></div>
    <div class="bar">
      <button class="play" id="play" type="button" aria-label="Play">▶</button>
      <div class="tempo"><span aria-hidden="true">🐢</span><input id="bpm" type="range" min="72" max="132" step="4" value="100" aria-label="Tempo"><span aria-hidden="true">🐇</span></div>
      <button class="pill" id="dice" type="button" aria-label="Surprise me">🎲</button>
      <button class="pill" id="wipe" type="button" aria-label="Clear">🧽</button>
      <button class="press" id="press" type="button"><span class="v1" aria-hidden="true"></span><span data-t="press">Press it</span></button>
    </div>
  </section>

  <section class="room" aria-label="The jukebox">
    <h2>Jukebox</h2>
    <div id="machine"></div>
  </section>
</main>
<div class="say" id="say" role="status"></div>

<script src="./core.js"></script>
<script src="./widget.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (s, r) { return (r || document).querySelector(s); };
  function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

  /* ---------- words ---------- */
  var T = {
    press: ["Press it", "压成唱片", "壓成唱片", "Grábalo", "Grava'l"],
    untitled: ["Untitled", "无题", "無題", "Sin título", "Sense títol"],
    yourName: ["Your name", "你的名字", "你的名字", "Tu nombre", "El teu nom"],
    titleA: ["Song title", "歌名", "歌名", "Título", "Títol"],
    inBox: ["In the jukebox ✓ — drop a coin to play it everywhere", "已放进点唱机 ✓ 投一枚硬币，所有地方都会播放", "已放進點唱機 ✓ 投一枚硬幣，所有地方都會播放", "En la gramola ✓ — echa una moneda y sonará en todas partes", "A la gramola ✓ — tira una moneda i sonarà a tot arreu"],
    empty: ["Light up a few notes first", "先点亮几个音符", "先點亮幾個音符", "Enciende unas notas primero", "Encén unes notes primer"],
    away: ["The jukebox is out of reach right now — your tune is kept here", "点唱机暂时连不上，你的曲子保存在这台设备上", "點唱機暫時連不上，你的曲子保存在這台裝置上", "La gramola no responde ahora: tu melodía queda guardada aquí", "La gramola no respon ara: la teva melodia queda desada aquí"],
    rest: ["The press needs a short rest — try again in a moment", "压片机要歇一会儿，稍后再试", "壓片機要歇一會兒，稍後再試", "La prensa necesita un respiro: prueba en un momento", "La premsa necessita un respir: prova-ho d'aquí a un moment"],
    play: ["Play", "播放", "播放", "Reproducir", "Reprodueix"], stop: ["Stop", "停止", "停止", "Parar", "Atura"],
    dice: ["Surprise me", "随机来一首", "隨機來一首", "Sorpréndeme", "Sorprèn-me"], wipe: ["Clear", "清空", "清空", "Borrar", "Esborra"],
    tempo: ["Tempo", "速度", "速度", "Tempo", "Tempo"], lang: ["Language", "语言", "語言", "Idioma", "Idioma"],
    moods: [["Sunny", "晴天", "晴天", "Soleado", "Assolellat"], ["Rainy", "雨天", "雨天", "Lluvioso", "Plujós"], ["Lantern", "灯笼", "燈籠", "Farol", "Fanal"], ["Midnight", "午夜", "午夜", "Medianoche", "Mitjanit"]],
    insts: [["Music box", "八音盒", "音樂盒", "Caja de música", "Capsa de música"], ["Piano", "钢琴", "鋼琴", "Piano", "Piano"], ["Arcade", "街机", "街機", "Arcade", "Arcade"], ["Strings", "拨弦", "撥弦", "Cuerdas", "Cordes"]],
    drums: [["Kick", "底鼓", "大鼓", "Bombo", "Bombo"], ["Clap", "拍手", "拍手", "Palmas", "Picament"], ["Hi-hat", "踩镲", "腳踏鈸", "Charles", "Charles"]]
  };
  var LI = { en: 0, zh: 1, "zh-Hant": 2, es: 3, ca: 4 };
  function lang() { return LI[(window.FBL && FBL.get()) || "en"] || 0; }
  function t(k) { var v = T[k]; return (v && (v[lang()] || v[0])) || k; }
  function words() {
    var L = lang(); document.documentElement.lang = ["en", "zh-Hans", "zh-Hant", "es", "ca"][L];
    document.querySelectorAll("[data-t]").forEach(function (e) { e.textContent = t(e.getAttribute("data-t")); });
    $("#dice").setAttribute("aria-label", t("dice")); $("#dice").title = t("dice");
    $("#wipe").setAttribute("aria-label", t("wipe")); $("#wipe").title = t("wipe");
    $("#bpm").setAttribute("aria-label", t("tempo")); $("[data-fbl-btn]").setAttribute("aria-label", t("lang"));
    $("#play").setAttribute("aria-label", t(prev.playing() ? "stop" : "play"));
    moodBtns.forEach(function (b, i) { b.setAttribute("aria-label", T.moods[i][L]); b.title = T.moods[i][L]; });
    instBtns.forEach(function (b, i) { b.setAttribute("aria-label", T.insts[i][L]); b.title = T.insts[i][L]; });
    var lab = $("[data-fbl-label]"); if (lab && window.FBL) lab.textContent = FBL.SHORT[FBL.get() || "en"];
    if (window.JBW) JBW.paint();
  }
  window.FBL_GET = function () { return (window.FBL && FBL.get()) || "en"; };
  window.FBL_SET = function (l) { if (window.FBL) FBL.set(l); words(); };

  /* ---------- the tune on the desk ---------- */
  var song = null;
  try { song = JB.decode(ls("jb_draft")); } catch (e) {}
  if (!song) song = JB.random();
  function save() { ls("jb_draft", JB.encode(song)); }
  var prev = new JB.Player(), resumeJukebox = false;

  var MOOD_ICON = ["☀️", "🌧️", "🏮", "🌙"], INST_ICON = ["🎐", "🎹", "👾", "🪕"], DRUM_ICON = ["🥁", "👏", "✨"];
  var moodBtns = MOOD_ICON.map(function (ic, i) { var b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = ic; b.onclick = function () { song.mood = i; paintChips(); save(); audition(); }; $("#moods").appendChild(b); return b; });
  var instBtns = INST_ICON.map(function (ic, i) { var b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = ic; b.onclick = function () { song.inst = i; paintChips(); save(); audition(); }; $("#insts").appendChild(b); return b; });
  function paintChips() {
    moodBtns.forEach(function (b, i) { b.setAttribute("aria-pressed", i === song.mood ? "true" : "false"); });
    instBtns.forEach(function (b, i) { b.setAttribute("aria-pressed", i === song.inst ? "true" : "false"); });
    var a = JB.MOODS[song.mood].col; $(".desk").style.setProperty("--a", a); document.body.style.setProperty("--a", a);
    $("#bpm").value = song.bpm; prev.set(song);
    cells.forEach(function (c) { if (c.r < 8) c.el.style.setProperty("--c", rowHue(c.r)); });
  }
  function rowHue(r) { var base = { 0: 38, 1: 215, 2: 8, 3: 270 }[song.mood]; return (base + (7 - r) * 14) % 360; }
  function audition() { if (!prev.playing()) { JB.unlock(); var top = -1; for (var r = 0; r < 8 && top < 0; r++) for (var c = 0; c < 16; c++) if (song.mel[r][c]) { top = r; break; } JB.note(song.inst, JB.rowNote(song.mood, top < 0 ? 4 : top), 0.7); } }

  /* the grid: 8 notes + 3 drums, time left→right (or top→bottom on a phone) */
  var cells = [], vert = false;
  function build() {
    vert = window.matchMedia("(max-width:640px)").matches;
    var g = $("#grid"); g.innerHTML = ""; cells = [];
    $("#roll").classList.toggle("v", vert);
    for (var r = 0; r < 11; r++) for (var c = 0; c < 16; c++) {
      var drum = r >= 8, b = document.createElement("button"); b.type = "button";
      b.className = "cell" + (drum ? " d" : "") + (c % 4 === 0 && c ? " q" : "");
      var rr = drum ? r - 8 : r;
      b.setAttribute("aria-label", (drum ? T.drums[rr][lang()] : "♪" + (8 - r)) + " · " + (c + 1));
      if (vert) { b.style.gridRow = String(c + 1); b.style.gridColumn = String(drum ? 10 + rr : 8 - r); }
      else { b.style.gridColumn = String(c + 1); b.style.gridRow = String(drum ? 10 + rr : r + 1); }
      b.dataset.r = r; b.dataset.c = c;
      g.appendChild(b); cells.push({ el: b, r: r, c: c });
    }
    if (!vert) { var sp = document.createElement("div"); sp.className = "gap"; sp.style.gridRow = "9"; sp.style.gridColumn = "1 / -1"; g.appendChild(sp); }
    paintCells(); paintChips();
  }
  function on(r, c) { return r < 8 ? song.mel[r][c] : song.drum[r - 8][c]; }
  function setCell(r, c, v) { if (r < 8) song.mel[r][c] = v; else song.drum[r - 8][c] = v; }
  function paintCells() { cells.forEach(function (x) { x.el.classList.toggle("on", !!on(x.r, x.c)); x.el.setAttribute("aria-pressed", on(x.r, x.c) ? "true" : "false"); }); }
  function cellAt(x, y) { var e = document.elementFromPoint(x, y); return e && e.classList && e.classList.contains("cell") ? e : null; }

  /* paint with a finger: the first cell decides whether you are lighting or putting out */
  var painting = null, lastCell = null;
  $("#roll").addEventListener("pointerdown", function (e) {
    var el = e.target.closest(".cell"); if (!el) return;
    e.preventDefault(); JB.unlock();
    var r = +el.dataset.r, c = +el.dataset.c; painting = !on(r, c); lastCell = el; apply(el);
    try { $("#roll").setPointerCapture(e.pointerId); } catch (x) {}
  });
  $("#roll").addEventListener("pointermove", function (e) { if (painting === null) return; var el = cellAt(e.clientX, e.clientY); if (el && el !== lastCell) { lastCell = el; apply(el); } });
  ["pointerup", "pointercancel", "lostpointercapture"].forEach(function (k) { $("#roll").addEventListener(k, function () { if (painting !== null) { painting = null; save(); if (!prev.playing()) startPreview(); } }); });
  $("#grid").addEventListener("keydown", function (e) { var el = e.target.closest(".cell"); if (el && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); painting = !on(+el.dataset.r, +el.dataset.c); apply(el); painting = null; save(); } });
  function apply(el) {
    var r = +el.dataset.r, c = +el.dataset.c; if (on(r, c) === painting) return;
    setCell(r, c, painting); el.classList.toggle("on", painting); el.setAttribute("aria-pressed", painting ? "true" : "false");
    if (painting && !prev.playing()) { if (r < 8) JB.note(song.inst, JB.rowNote(song.mood, r), 0.8); else JB.drum(r - 8); }
    prev.set(song);
  }

  /* ---------- hearing it ---------- */
  var ph = -1;
  function stepLight(st) {
    if (ph >= 0) cells.forEach(function (x) { if (x.c === ph) x.el.classList.remove("ph"); });
    ph = st; cells.forEach(function (x) { if (x.c === st) x.el.classList.add("ph"); });
  }
  function startPreview() {
    JB.unlock(); if (JB.listening()) { resumeJukebox = true; JB.listen(false); JBW.fire(); JBW.paint(); }
    prev.play(song, { loop: true, onStep: stepLight }); $("#play").textContent = "■"; $("#play").setAttribute("aria-label", t("stop"));
  }
  function stopPreview() {
    prev.stop(); $("#play").textContent = "▶"; $("#play").setAttribute("aria-label", t("play"));
    cells.forEach(function (x) { x.el.classList.remove("ph"); }); ph = -1;
  }
  $("#play").onclick = function () { if (prev.playing()) { stopPreview(); if (resumeJukebox) { resumeJukebox = false; JB.listen(true); JBW.fire(); JBW.paint(); } } else startPreview(); };
  $("#bpm").addEventListener("input", function () { song.bpm = +this.value; prev.set(song); if (prev.playing()) { prev.stop(); prev.play(song, { loop: true, onStep: stepLight }); } save(); });
  $("#dice").onclick = function () { var keepI = song.inst; song = JB.random(); if (Math.random() < .5) song.inst = keepI; paintCells(); paintChips(); save(); if (prev.playing()) { prev.stop(); prev.play(song, { loop: true, onStep: stepLight }); } else startPreview(); };
  $("#wipe").onclick = function () { var b = JB.blank(); b.mood = song.mood; b.inst = song.inst; b.bpm = song.bpm; song = b; paintCells(); prev.set(song); save(); };
  window.addEventListener("jukebox", function (e) { if (e.detail && e.detail.on && prev.playing()) { resumeJukebox = false; stopPreview(); } });

  /* ---------- pressing a record ---------- */
  function say(msg) { var s = $("#say"); s.textContent = msg; s.classList.add("show"); clearTimeout(say.t); say.t = setTimeout(function () { s.classList.remove("show"); }, 3800); }
  function hasNotes() { return song.mel.some(function (r) { return r.indexOf(true) >= 0; }); }
  $("#press").onclick = function () {
    if (!hasNotes()) { say(t("empty")); $("#roll").classList.remove("err"); void $("#roll").offsetWidth; $("#roll").classList.add("err"); return; }
    var code = JB.encode(song), sc = document.createElement("div"); sc.className = "scrim"; sc.setAttribute("role", "dialog");
    sc.innerHTML = '<div class="vinyl" style="--lh:' + JB.hue(code) + '"><button class="x" type="button" aria-label="Close">×</button>' +
      '<div class="label"><input id="ttl" maxlength="40" autocomplete="off"><span class="hole"></span><input id="who" maxlength="32" autocomplete="nickname"></div>' +
      '<button class="go" type="button" aria-label="Into the jukebox">💿</button></div>';
    document.body.appendChild(sc);
    var ttl = $("#ttl", sc), who = $("#who", sc), go = $(".go", sc);
    ttl.placeholder = t("untitled"); ttl.setAttribute("aria-label", t("titleA")); who.placeholder = t("yourName"); who.setAttribute("aria-label", t("yourName"));
    who.value = JB.nick(); ttl.value = ls("jb_title") || "";
    setTimeout(function () { ttl.focus(); }, 50);
    function close() { sc.remove(); }
    $(".x", sc).onclick = close; sc.addEventListener("click", function (e) { if (e.target === sc) close(); });
    sc.addEventListener("keydown", function (e) { if (e.key === "Escape") close(); if (e.key === "Enter") go.click(); });
    go.onclick = function () {
      var name = who.value.trim(), title = ttl.value.trim() || t("untitled");
      if (!name) { who.focus(); who.parentNode.classList.remove("err"); void who.offsetWidth; who.parentNode.classList.add("err"); return; }
      go.disabled = true; ls("jb_title", "");
      JB.press(name, title, code).then(function (id) {
        $(".vinyl", sc).classList.add("away");
        setTimeout(function () { close(); JBW.refresh(id); var m = $("#machine"); if (window.innerWidth < 900) m.scrollIntoView({ behavior: "smooth", block: "start" }); say(t("inBox")); }, 850);
      }).catch(function (e) {
        go.disabled = false; ls("jb_title", title);
        say(/rest|fast/.test(String(e && e.message)) ? t("rest") : t("away"));
      });
    };
  };

  /* ---------- the jukebox: music on from the first touch ---------- */
  JBW.mount($("#machine"), { venue: "studio" });
  JB.watch();
  function first(e) {
    document.removeEventListener("pointerdown", first, true); document.removeEventListener("keydown", first, true); JB.unlock();
    var mine = e && e.target && e.target.closest && e.target.closest("#roll,#play,.chip,#dice,#wipe,#press,.jbm-spk,.jbm-sl,[data-fbl-btn],.scrim");
    if (!mine && !prev.playing() && !JB.listening()) { JB.listen(true); JBW.fire(); JBW.paint(); }
  }
  document.addEventListener("pointerdown", first, true); document.addEventListener("keydown", first, true);

  build(); words();
  var mq = window.matchMedia("(max-width:640px)"); (mq.addEventListener ? mq.addEventListener("change", build) : mq.addListener(build));
  document.addEventListener("visibilitychange", function () { if (document.hidden && prev.playing()) stopPreview(); });
})();
</script>
</body>
</html>
