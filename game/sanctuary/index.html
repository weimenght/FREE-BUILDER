<style>
:root{--bg:#1c2a18;--ink:#f6f1e2;--dim:rgba(246,241,226,.65);--a:#f6b73c;--g:#7ab45a;--card:#f6f1e2;--cink:#2a2418;--line:#000;--px:'Press Start 2P',ui-monospace,monospace;--vt:'VT323',ui-monospace,'PingFang SC','Microsoft YaHei',monospace;--ui:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 20px/1.15 var(--vt);-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:repeating-conic-gradient(rgba(0,0,0,.18) 0 25%,transparent 0 50%) 0 0/4px 4px,radial-gradient(120% 60% at 50% 0,#2e4426,#1c2a18 70%)}
button,input,textarea,select{font:inherit;color:inherit}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:max(12px,env(safe-area-inset-top)) 16px 8px;max-width:760px;margin:0 auto}
.sign{font:400 12px/1.3 var(--px);letter-spacing:.05em;color:#fff3c0;text-shadow:2px 2px 0 #2f6a3a;padding:7px 9px;border:3px solid #ffd27a;box-shadow:inset 0 0 0 2px #2f6a3a,3px 3px 0 #000;background:#1e3a1e}
.tools{display:flex;gap:8px}
.pill{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;height:44px;padding:0 10px;border:3px solid #000;background:#2f4a2a;box-shadow:inset -3px -3px 0 rgba(0,0,0,.4),inset 3px 3px 0 rgba(255,255,255,.12),3px 3px 0 #000;cursor:pointer;font:400 18px/1 var(--vt);color:var(--ink);text-decoration:none}
.pill .n{position:absolute;top:-8px;right:-8px;min-width:20px;height:20px;padding:0 4px;background:var(--a);color:#000;border:2px solid #000;font-size:15px;line-height:16px;text-align:center}
main{max-width:760px;margin:0 auto;padding:4px 16px 110px}
.yard{position:relative;border:4px solid #000;box-shadow:6px 6px 0 #000;background:#000;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.yard canvas{display:block;width:100%;height:auto;aspect-ratio:160/90;image-rendering:-moz-crisp-edges;image-rendering:crisp-edges;image-rendering:pixelated;cursor:pointer}
.hint{text-align:center;color:var(--dim);font-size:19px;min-height:24px;margin:8px 0 0}
h2{font:400 12px/1.4 var(--px);color:var(--a);margin:28px 0 12px;letter-spacing:.06em}
.me{display:flex;gap:14px;align-items:flex-start;padding:14px;background:#2a3a24;border:3px solid #000;box-shadow:4px 4px 0 #000}
.me canvas{flex:none;width:88px;height:64px;image-rendering:pixelated}
.me b{font:400 13px/1.4 var(--px)}.me p{margin:6px 0 0;color:#e8e2cc;font-size:19px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{min-width:48px;height:44px;padding:0 10px;border:3px solid #000;background:#2f4a2a;font-size:20px;cursor:pointer;box-shadow:3px 3px 0 #000}
.chip[aria-pressed="true"]{background:var(--a);color:#14101e}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.pet{display:flex;flex-direction:column;background:var(--card);color:var(--cink);border:3px solid #000;box-shadow:4px 4px 0 #000;font:15px/1.4 var(--ui)}
.pet .ph{position:relative;aspect-ratio:4/3;background:#e8dfc4;display:grid;place-items:center;overflow:hidden}
.pet .ph img{width:100%;height:100%;object-fit:cover}
.pet .ph canvas{width:30%;height:auto;image-rendering:pixelated;opacity:.55}
.pet .badge{position:absolute;left:8px;top:8px;padding:3px 8px;background:#2f6a3a;color:#fff;border:2px solid #000;font:700 12px/1.2 var(--ui)}
.pet .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.pet h3{margin:0;font:700 18px/1.2 var(--ui)}
.pet .meta{color:#6a6250;font-size:13px}
.pet .story{margin:2px 0 0;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.pet .row{display:flex;gap:8px;align-items:center;margin-top:auto;padding-top:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 14px;border:3px solid #000;background:var(--a);color:#1d130d;font:700 15px/1.1 var(--ui);cursor:pointer;box-shadow:3px 3px 0 #000;text-decoration:none}
.btn.ghost{background:#fff8e8}.btn.green{background:var(--g)}.btn.red{background:#e8a0a0}
.btn:active{transform:translate(2px,2px)}
.flag{margin-left:auto;border:0;background:none;color:#8a8270;font:13px var(--ui);cursor:pointer;text-decoration:underline dotted}
.empty{grid-column:1/-1;padding:20px;text-align:center;color:var(--dim);font-size:20px;border:3px dashed rgba(255,255,255,.2)}
.add{margin-top:16px;width:100%}
.scrim{position:fixed;top:0;right:0;bottom:0;left:0;z-index:10000;background:rgba(10,14,8,.78);display:flex;align-items:flex-end;justify-content:center;padding:12px}
@media (min-width:640px){.scrim{align-items:center}}
.sheet{position:relative;width:100%;max-width:520px;max-height:88vh;overflow:auto;background:var(--card);color:var(--cink);border:4px solid #000;box-shadow:6px 6px 0 #000;padding:18px 16px 16px;font:15px/1.45 var(--ui)}
.sheet h3{margin:0 0 10px;font:400 13px/1.4 var(--px);color:#2f6a3a;padding-right:36px}
.sheet label{display:block;margin:10px 0 4px;font-weight:700;font-size:14px}
.sheet input,.sheet textarea,.sheet select{width:100%;padding:10px;border:2px solid #000;background:#fff;color:#1d130d;font:15px var(--ui)}
.sheet textarea{min-height:84px;resize:vertical}
.sheet .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet .check{display:flex;gap:8px;align-items:flex-start;font-weight:400;margin-top:10px}.sheet .check input{width:auto;margin-top:3px}
.sheet .note{color:#6a6250;font-size:13px;margin:8px 0 0}
.sheet .tips{margin:10px 0 0;padding:10px 12px 10px 28px;background:#efe6cc;border:2px solid #000;font-size:13px}
.sheet .x{position:absolute;top:10px;right:10px;width:32px;height:32px;padding:0;border:2px solid #000;background:#fff8e8;cursor:pointer;color:transparent;overflow:hidden}
.sheet .x::before,.sheet .x::after{content:"";position:absolute;left:50%;top:50%;width:16px;height:3px;margin:-1.5px 0 0 -8px;background:#2a1d14;transform:rotate(45deg)}.sheet .x::after{transform:rotate(-45deg)}
.sheet .go{margin-top:14px;width:100%}
.prev{display:block;width:100%;max-height:220px;object-fit:cover;margin-top:8px;border:2px solid #000}
.mine{border:2px solid #000;padding:10px;margin-top:10px;background:#fff}
.mine b{font-size:16px}.mine .st{float:right;font-size:12px;padding:2px 6px;border:2px solid #000;background:#efe6cc}
.ask{border-top:1px dashed #b8ae94;padding-top:8px;margin-top:8px}.ask small{color:#6a6250}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);opacity:0;transition:.25s;z-index:60;background:#000;color:#fff3c0;border:3px solid var(--a);padding:8px 14px;font-size:19px;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
