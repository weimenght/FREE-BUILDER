const P = {"en": {"title": "Cases — FREE//BUILDER", "kicker": "Cases · Season one", "h1": "Thirteen problems. One year. <span class=\"acc\">One</span> invented company.", "lead": "Every case starts with a problem a buyer said, is built from the team's own situations, is played between two people with one phone, ends with a real conversation, and counts conversations, never people.", "cast": "Ana, an engineer promoted to manager in January · Leo, her most senior report · Mei, the graduate who joins in September · Sam, the MD who is always sure · Priya, who leads the Bengaluru team on the Monday call · Jordi, in sales · Nadia, in HR, who gets every request for training · Tomás, in product.", "trailer": "Play the trailer", "trailerMeta": "Corporate Survival Drama · Episode 01 · 1 minute · made to be watched together", "actLbl": "Act", "ep": "Episode {n}", "under": "Underneath", "build": "We build", "ends": "Ends with", "expect": "What to expect", "proves": "Proves", "tagLive": "Live", "tagLab": "Lab", "tagConcept": "Concept", "tagDrama": "Watch together", "conceptHint": "Built for your team in a client engagement", "try": "Try it in two minutes", "codaK": "Coda · December", "ctaK": "Your people, your cases", "ctaH": "Which of these is yours?", "ctaT": "Tell me where it hurts. A client build starts from your own situations, not these.", "ctaGo": "Start the conversation", "ctaPf": "See the story on the portfolio", "acts": [{"id": "a1", "num": "I", "name": "The ask", "months": "January to March", "arc": "Nadia in HR gets a request: \"the team leads need feedback training\". The diagnosis points somewhere else: Ana, promoted in January, is running her first 1:1s like stand-ups."}, {"id": "a2", "num": "II", "name": "The room goes quiet", "months": "April to June", "arc": "A near-miss nobody reports. Priya's team listens on the Monday call. A decision made in the meeting and remade in the car park. Three functions blame each other for one delay. Then Sam, the MD who is always sure, goes first with a mistake."}, {"id": "a3", "num": "III", "name": "New people, new tools", "months": "July to October", "arc": "Mei's first day is played, not presented; her day-30 with Ana happens in the stockroom. The AI licences arrive and Leo shows Mei one real use. Jordi stops pitching early. Tomás's product team interviews a real colleague."}, {"id": "a4", "num": "IV", "name": "After the cut", "months": "November", "arc": "A restructure. The people who stay go quiet. Ana answers only \"true\", \"not true\", or \"I don't know yet, and I'll tell you by a date\"."}], "cases": [{"n": 1, "act": "a1", "lead": "/tools/diagnose", "title": "“Someone has asked for a training.”", "under": "Most requests are about expectations, feedback, tools or incentives, not skill. The cheapest diagnosis is three conversations.", "build": "We open the two-minute diagnosis with the requester, put their own numbers through the cost calculator, and keep Room Mode and the teach-back for the day a programme is right.", "end": "a programme not run, or one run as practice between people.", "result": "Requests redirected to a conditions fix · hours moved from courses to practice · behaviour seen at 30 days.", "story": "Nadia reads the request aloud.", "tools": [{"id": "diagnose", "name": "Training or not?", "st": "live", "href": "/tools/diagnose"}, {"id": "cost", "name": "Cost calculator", "st": "live", "href": "/tools/cost"}, {"id": "room", "name": "Room Mode", "st": "lab", "href": "/tools/room"}, {"id": "teachback", "name": "Teach-Back Chain", "st": "live", "href": "/tools/teachback"}], "belief": "Diagnose first", "prove": "Listen first. The workshop people ask for is rarely the problem underneath."}, {"n": 2, "act": "a1", "lead": "/labs/coach/", "title": "“We promoted our best engineers; now they run 1:1s like stand-ups.”", "under": "Nobody showed them a 1:1 that wasn't one. They know \"ask, don't tell\" from a slide and lose it under pressure.", "build": "A private warm-up on the Co-Pilot, then First 1:1 with one real report before the first real meeting, then Delegation Dial and My User Manual in month two, each agreement living in a link the pair can reopen.", "end": "one agreed opening question in both calendars.", "result": "Ask-to-tell in rehearsal · \"my manager listens\" pulse · regretted attrition under first-year managers.", "story": "Ana rehearses, then meets Leo for real.", "tools": [{"id": "coach", "name": "Coaching Co-Pilot", "st": "lab", "href": "/labs/coach/"}, {"id": "dial", "name": "Delegation Dial", "st": "live", "href": "/tools/dial"}, {"id": "manual", "name": "My User Manual", "st": "live", "href": "/tools/manual"}, {"id": "first11", "name": "First 1:1", "st": "concept", "href": ""}], "belief": "Human capabilities first", "prove": "The screen is the warm-up; the goal is the real conversation with your team."}, {"n": 3, "act": "a1", "lead": "/tools/listen", "title": "“Feedback happens once a year, in a form.”", "under": "People don't give feedback because they never practised saying it; people don't hear it because they're waiting to defend.", "build": "Listening Duet first, then Specific Thanks, Repair Kit, and Hallway Feedback in the minute after any small meeting. Partners go first for a month.", "end": "a thank-you said in person today, and a repair owed and started.", "result": "Feedback given per week · \"I know how I'm doing\" · surprises at review time, down.", "story": "The first thank-you is said out loud.", "tools": [{"id": "listen", "name": "Listening Duet", "st": "live", "href": "/tools/listen"}, {"id": "thanks", "name": "Specific Thanks", "st": "live", "href": "/tools/thanks"}, {"id": "repair", "name": "Repair Kit", "st": "live", "href": "/tools/repair"}, {"id": "hallway", "name": "Hallway Feedback", "st": "concept", "href": ""}], "belief": "Learning is mutual", "prove": "Everyone teaches, everyone learns; the receiver becomes the next teacher."}, {"n": 4, "act": "a2", "lead": "/tools/museum", "title": "“Nobody says anything in the meeting, then everything in the corridor.”", "under": "Silence is a learned reading of consequences. It unlearns the same way: the senior person goes first, and it costs nothing.", "build": "Mistake Museum, Question Deck as a weekly ritual, and the sector versions: Near-Miss Wall for the toolbox talk, Second Opinion for the dealing desk.", "end": "a manager who showed a mistake first, in front of the team.", "result": "Questions and near-misses raised per session · speak-up survey items · incidents and audit findings.", "story": "Sam hangs the first exhibit.", "tools": [{"id": "museum", "name": "Mistake Museum", "st": "live", "href": "/tools/museum"}, {"id": "questions", "name": "Question Deck", "st": "live", "href": "/tools/questions"}, {"id": "nearmiss", "name": "Near-Miss Wall", "st": "concept", "href": ""}, {"id": "second", "name": "Second Opinion", "st": "concept", "href": ""}, {"id": "drama", "name": "Corporate Survival Drama", "st": "drama", "href": ""}], "belief": "People are the end, never the means", "prove": "No exhibit is scored, counted or compared; \"me too\" is solidarity."}, {"n": 5, "act": "a2", "lead": "/labs/cq/", "title": "“Our offices misread each other.”", "under": "Culture training swapped one stereotype for a politer one. Most friction is two reasonable people with half the story each, plus who can afford to speak.", "build": "Most friction is two reasonable people with half the story each, plus who can afford to speak. The Atlas solo, Perspective Swap in pairs across offices, then Who Spoke inside the Monday call itself: airtime by office, never by name.", "end": "a call that opens with the office that spoke least.", "result": "Managers reaching past the culture lens · \"I can speak up\" by site · decisions reopened after the call.", "story": "Priya's team opens the next call.", "tools": [{"id": "cq", "name": "Intercultural Atlas", "st": "lab", "href": "/labs/cq/"}, {"id": "swap", "name": "Perspective Swap", "st": "live", "href": "/tools/swap"}, {"id": "whospoke", "name": "Who Spoke", "st": "concept", "href": ""}], "belief": "Human capabilities first", "prove": "Curiosity over the right answer; tendencies, never rules about a person."}, {"n": 6, "act": "a2", "lead": "/tools/decide", "title": "“Decisions get made in the meeting and remade in the car park.”", "under": "Nobody said out loud who decides, and consensus was mistaken for consent.", "build": "Decision Room (present, clarify, react, consent: good enough for now, safe enough to try), Delegation Dial per task, Two Truths when the argument is about what happened.", "end": "one real, reversible decision made in fifteen minutes, with a review date.", "result": "Decisions reopened within a month · \"decisions stick\" pulse · cycle time on team-owned decisions.", "story": "Sam's voice counts once, like everyone's.", "tools": [{"id": "decide", "name": "Decision Room", "st": "live", "href": "/tools/decide"}, {"id": "dial", "name": "Delegation Dial", "st": "live", "href": "/tools/dial"}, {"id": "twotruths", "name": "Two Truths", "st": "live", "href": "/tools/twotruths"}, {"id": "drama", "name": "Corporate Survival Drama", "st": "drama", "href": ""}], "belief": "Learning is mutual", "prove": "The manager's voice counts once, like everyone else's."}, {"n": 7, "act": "a2", "lead": "/tools/twotruths", "title": "“Every function thinks the other one is the blocker.”", "under": "Facts and stories mixed, across desks; nobody knows what the others were waiting for.", "build": "Two Truths on a real delay, Three Desks for three functions at once (private briefs, a shared timeline, the fact-or-story sort, one handoff rewritten as \"[function] needs [thing] by [when] because [reason]\").", "end": "one handoff sentence that becomes the team's request format.", "result": "Requests written with a \"because\" · cycle time at one handoff · programme timeline.", "story": "Tomás, Priya and Nadia rebuild one delay.", "tools": [{"id": "twotruths", "name": "Two Truths", "st": "live", "href": "/tools/twotruths"}, {"id": "threedesks", "name": "Three Desks", "st": "concept", "href": ""}, {"id": "cg", "name": "Common Ground", "st": "live", "href": "/labs/common-ground/"}], "belief": "Learn by doing — and have fun", "prove": "The case is the team's own delay, not a textbook one."}, {"n": 8, "act": "a3", "lead": "/labs/launchpad/", "title": "“Onboarding is a handbook and a deck.”", "under": "The first day was presented, not played, and the first month had no conversation in it.", "build": "Launchpad for the day itself (route cards, station tools, a colleague trail to real people, a wall with no podium), Day Thirty for every manager in week five, Teach-Back Chain so every joiner teaches the next.", "end": "a new joiner who met six real people and was asked one real question, in their own language.", "result": "Day-30 conversations held · 60-day pulse · 90-day retention by site.", "story": "Mei's first day, played.", "tools": [{"id": "launchpad", "name": "Launchpad", "st": "lab", "href": "/labs/launchpad/"}, {"id": "day30", "name": "Day Thirty", "st": "concept", "href": ""}, {"id": "teachback", "name": "Teach-Back Chain", "st": "live", "href": "/tools/teachback"}], "belief": "People are the end, never the means", "prove": "The colleague trail sends joiners to people, not handbooks, and the wall has no places."}, {"n": 9, "act": "a3", "lead": "/tools/prompt", "title": "“We bought the AI licences; usage is 20%.”", "under": "The barrier is social: people are afraid of looking slow or replaceable. A tool is only as good as the asking, and asking is a human skill.", "build": "Prompt Partner (your colleague plays the AI, no AI inside), Show Me Yours (each person shows one real use or one thing they gave up on; the chain carries it to a third person), and the diagnosis before anyone books a course.", "end": "a manager who showed first, badly, and a list of real use cases no survey ever produced.", "result": "Teach-back chain length by team · active licences · time saved as the team reports it.", "story": "Leo shows Mei one real use.", "tools": [{"id": "prompt", "name": "Prompt Partner", "st": "live", "href": "/tools/prompt"}, {"id": "showme", "name": "Show Me Yours", "st": "concept", "href": ""}, {"id": "diagnose", "name": "Training or not?", "st": "live", "href": "/tools/diagnose"}], "belief": "People are the end, never the means", "prove": "AI and web apps are tools. What matters is what people do with each other afterwards."}, {"n": 10, "act": "a3", "lead": "/tools/discovery", "title": "“Reps pitch too early and freeze on objections.”", "under": "The stated request is rarely the real need, and knowing a technique in a workshop isn't recalling it under pressure.", "build": "Discovery Duet (a client with a hidden need, a pitch bell, no score), and the Sales Academy rebuilt as a pair drill: spaced cards with honest evidence ratings, then a colleague reads the objection and judges whether the reply would land.", "end": "two more questions asked on the next real call before anything is suggested.", "result": "Pitches caught per drill, falling · techniques spotted in recorded calls · win rate where discovery ran.", "story": "Jordi stays curious a little longer.", "tools": [{"id": "discovery", "name": "Discovery Duet", "st": "live", "href": "/tools/discovery"}, {"id": "sales", "name": "Sales Psychology Academy", "st": "lab", "href": "/labs/sales/"}], "belief": "Learn by doing — and have fun", "prove": "The bell makes a bad habit a shared joke, not a judgment."}, {"n": 11, "act": "a3", "lead": "/tools/design/", "title": "“We ran innovation training. Nothing left the room.”", "under": "The method was taught, not done; nobody interviewed a real person.", "build": "Design Thinking Odyssey, five worlds where every mechanic is a method, the Crazy 8s clock for the room, and Phase 06 Field: no game, ten minutes with one colleague about a real frustration, an empathy map filled together, their co-signature on the card.", "end": "one real interview, one \"how might we\", one colleague who felt listened to.", "result": "Field interviews co-signed · ideas that reached a prototype · projects that began with a user interview.", "story": "Tomás's team interviews a real colleague.", "tools": [{"id": "design", "name": "Design Thinking Odyssey", "st": "live", "href": "/tools/design/"}], "belief": "Learning is mutual", "prove": "The co-signature is the evidence; the five quizzes are not."}, {"n": 12, "act": "a3", "lead": "/tools/listen", "title": "“Handover errors keep showing up in incident reports.”", "under": "A listening problem dressed as a documentation problem: the incoming shift hears a list and can't tell what the outgoing one is worried about.", "build": "Handover Duet, the first 90 seconds of the handover that already happens: say the worry before the list, play it back, \"did they get the worry?\". Nothing recorded. A sister episode on a ward, the same shape.", "end": "a ward that says the worry first.", "result": "Recall of the stated concern · handover-related incidents · handover length, usually down.", "story": "The same shape, a different ward.", "tools": [{"id": "handover", "name": "Handover Duet", "st": "concept", "href": ""}, {"id": "listen", "name": "Listening Duet", "st": "live", "href": "/tools/listen"}], "belief": "Learn by doing — and have fun", "prove": "The drill is the real handover, inside the shift, nothing recorded."}, {"n": 13, "act": "a4", "lead": "/labs/coach/", "title": "“The team has gone quiet since the restructure.”", "under": "Trust is rebuilt one honest exchange at a time; reassurance nobody asked for makes it worse.", "build": "What's True Now for every team lead in the week after (anonymous questions; the manager may answer only \"true\", \"not true\", or \"I don't know yet, and I'll tell you by a date\"), the Co-Pilot to rehearse the hardest one, Question Deck to keep the weekly five minutes.", "end": "dated promises delivered first in the next team meeting.", "result": "Questions raised per session · trust-in-leadership pulse · regretted attrition in the six months after.", "story": "Ana answers only three ways.", "tools": [{"id": "truenow", "name": "What's True Now", "st": "concept", "href": ""}, {"id": "coach", "name": "Coaching Co-Pilot", "st": "lab", "href": "/labs/coach/"}, {"id": "questions", "name": "Question Deck", "st": "live", "href": "/tools/questions"}, {"id": "drama", "name": "Corporate Survival Drama", "st": "drama", "href": ""}], "belief": "People are the end, never the means", "prove": "No sentiment analytics, no surveillance; the manager reports their own kept promises."}], "coda": {"name": "Coda", "months": "December", "arc": "Everyone teaches one thing to someone outside the team. The team builds its town and takes one question to the last meeting of the year. The last shot is off the screen.", "tools": [{"id": "teachback", "name": "Teach-Back Chain", "st": "live", "href": "/tools/teachback"}, {"id": "cg", "name": "Common Ground", "st": "live", "href": "/labs/common-ground/"}]}}, "zh": {"title": "案例 — FREE//BUILDER", "kicker": "案例 · 第一季", "h1": "十三个难题。一年。<span class=\"acc\">一家</span>虚构的公司。", "lead": "每个案例都从买方说出的一个问题开始，由团队自己的情境构建，由两个人用一部手机来练，以一场真实对话收尾；只数对话，从不数人。", "cast": "Ana，一月升任经理的工程师 · Leo，她最资深的下属 · Mei，九月入职的毕业生 · Sam，永远笃定的总监 · Priya，周一电话会上班加罗尔团队的负责人 · Jordi，做销售 · Nadia，人力资源，收下每一个培训需求 · Tomás，做产品。", "trailer": "播放预告片", "trailerMeta": "职场生存剧 · 第 1 集 · 1 分钟 · 为一起看而做", "actLbl": "第", "ep": "第 {n} 集", "under": "底下是什么", "build": "我们构建", "ends": "结束于", "expect": "可以期待什么", "proves": "证明", "tagLive": "已上线", "tagLab": "实验室", "tagConcept": "概念", "tagDrama": "一起看", "conceptHint": "在客户项目中为你的团队构建", "try": "两分钟试一下", "codaK": "尾声 · 十二月", "ctaK": "你的人，你的案例", "ctaH": "哪一个是你们的？", "ctaT": "告诉我哪里疼。客户版本从你们自己的情境出发，而不是这些。", "ctaGo": "开始对话", "ctaPf": "在作品集里看这个故事", "acts": [{"id": "a1", "num": "I", "name": "提出需求", "months": "一月到三月", "arc": "人力资源部的 Nadia 收到一个需求：“团队负责人需要一次反馈培训。”诊断却指向别处：一月刚升任经理的 Ana，正把她的第一批一对一开成站会。"}, {"id": "a2", "num": "II", "name": "会议室安静下来", "months": "四月到六月", "arc": "一次没人上报的险情。周一的电话会上，Priya 的团队只是在听。会上做的决定，在停车场被推翻。三个部门为同一次延误互相指责。然后，那位永远笃定的总监 Sam，第一个说出了自己的失误。"}, {"id": "a3", "num": "III", "name": "新人，新工具", "months": "七月到十月", "arc": "Mei 的第一天是玩出来的，不是听出来的；她和 Ana 的第三十天谈话，在库房里完成。AI 许可证到了，Leo 给 Mei 看了一个真实的用法。Jordi 不再过早推销。Tomás 的产品团队去采访了一位真实的同事。"}, {"id": "a4", "num": "IV", "name": "裁员之后", "months": "十一月", "arc": "一次重组。留下来的人沉默了。Ana 只回答三种话：“是真的”“不是真的”，或者“我还不知道，某天之前我会告诉你”。"}], "cases": [{"n": 1, "act": "a1", "lead": "/tools/diagnose", "title": "“有人提了一个培训需求。”", "under": "大多数培训需求关乎期望、反馈、工具或激励，而不是技能。最便宜的诊断，是三场对话。", "build": "我们和提需求的人一起做两分钟诊断，用他们自己的数字算一遍成本，把 Room Mode 和教回去留给真正该办培训的那一天。", "end": "一个没办的培训，或一个办成了人与人练习的培训。", "result": "需求转为改善条件 · 课时转为练习 · 30 天后看到的行为变化。", "story": "Nadia 把需求念了出来。", "tools": [{"id": "diagnose", "name": "要不要培训？", "st": "live", "href": "/tools/diagnose"}, {"id": "cost", "name": "成本计算器", "st": "live", "href": "/tools/cost"}, {"id": "room", "name": "Room Mode", "st": "lab", "href": "/tools/room"}, {"id": "teachback", "name": "教回去链条", "st": "live", "href": "/tools/teachback"}], "belief": "先诊断", "prove": "先听。大家要的工作坊，很少是底下真正的问题。"}, {"n": 2, "act": "a1", "lead": "/labs/coach/", "title": "“我们把最好的工程师提成了经理，现在一对一开得像站会。”", "under": "没人给他们看过一场不是站会的一对一。“多问少说”他们在幻灯片上学过，一有压力就忘了。", "build": "先在教练副驾上私下热身，再和一位真实下属做“第一次一对一”，第二个月用授权刻度盘和使用说明书，每份约定都住在一个两人可以重新打开的链接里。", "end": "一个双方都写进日历的开场问题。", "result": "排练中的问答比 · “我的经理在听”脉搏调查 · 新经理团队的惋惜离职率。", "story": "Ana 先排练，再和 Leo 真正坐下来。", "tools": [{"id": "coach", "name": "教练副驾", "st": "lab", "href": "/labs/coach/"}, {"id": "dial", "name": "授权刻度盘", "st": "live", "href": "/tools/dial"}, {"id": "manual", "name": "我的使用说明书", "st": "live", "href": "/tools/manual"}, {"id": "first11", "name": "第一次一对一", "st": "concept", "href": ""}], "belief": "人的能力优先", "prove": "屏幕只是热身；目标是和你团队的真实对话。"}, {"n": 3, "act": "a1", "lead": "/tools/listen", "title": "“反馈一年一次，填在表格里。”", "under": "不给反馈，是因为从没练过怎么说；听不进反馈，是因为正准备辩解。", "build": "先是倾听二重奏，再是具体的感谢、修复工具包，以及任何小会议结束后那一分钟的走廊反馈。合伙人先做一个月。", "end": "今天当面说出的一句感谢，和一段欠着、开始了的修复。", "result": "每周给出的反馈 · “我知道自己做得怎样” · 绩效评估时的意外减少。", "story": "第一句感谢被说出了口。", "tools": [{"id": "listen", "name": "倾听二重奏", "st": "live", "href": "/tools/listen"}, {"id": "thanks", "name": "具体的感谢", "st": "live", "href": "/tools/thanks"}, {"id": "repair", "name": "修复工具包", "st": "live", "href": "/tools/repair"}, {"id": "hallway", "name": "走廊反馈", "st": "concept", "href": ""}], "belief": "学习是相互的", "prove": "每个人都在教，每个人都在学；接受反馈的人成为下一个教的人。"}, {"n": 4, "act": "a2", "lead": "/tools/museum", "title": "“会上没人说话，走廊里什么都说。”", "under": "沉默是对后果的习得判断。它的消解也一样：资深的人先开口，而且不付出代价。", "build": "错误博物馆、每周仪式的问题卡组，以及行业版本：班前会的险情墙，交易台的“再确认一下”。", "end": "一位在团队面前先说出自己失误的经理。", "result": "每次活动提出的问题与险情 · 敢言调查项 · 事故与审计发现。", "story": "Sam 挂上了第一件展品。", "tools": [{"id": "museum", "name": "错误博物馆", "st": "live", "href": "/tools/museum"}, {"id": "questions", "name": "问题卡组", "st": "live", "href": "/tools/questions"}, {"id": "nearmiss", "name": "险情墙", "st": "concept", "href": ""}, {"id": "second", "name": "再确认一下", "st": "concept", "href": ""}, {"id": "drama", "name": "职场生存剧", "st": "drama", "href": ""}], "belief": "人是目的，从不是手段", "prove": "没有展品被打分、计数或比较；“我也是”就是团结。"}, {"n": 5, "act": "a2", "lead": "/labs/cq/", "title": "“我们的各地办公室老是误读彼此。”", "under": "文化培训只是把一种刻板印象换成更礼貌的一种。大多数摩擦，是两个讲理的人各握着半个故事，再加上谁说得起话。", "build": "大多数摩擦，是两个讲理的人各握着半个故事，再加上谁说得起话。先一个人走跨文化地图，再跨办公室两人做视角互换，然后把“谁在说话”放进周一的电话会本身：按办公室统计发言，从不按名字。", "end": "一次由发言最少的办公室开场的电话会。", "result": "越过文化视角的经理比例 · 各地“我敢发言” · 会后被重新打开的决定。", "story": "下一次电话会由 Priya 的团队开场。", "tools": [{"id": "cq", "name": "跨文化地图", "st": "lab", "href": "/labs/cq/"}, {"id": "swap", "name": "视角互换", "st": "live", "href": "/tools/swap"}, {"id": "whospoke", "name": "谁在说话", "st": "concept", "href": ""}], "belief": "人的能力优先", "prove": "好奇心胜过正确答案；是倾向，从不是对某个人的定论。"}, {"n": 6, "act": "a2", "lead": "/tools/decide", "title": "“决定在会上做，在停车场里重做。”", "under": "没人大声说过谁来决定，把共识错当成了同意。", "build": "决策室（陈述、澄清、反应、同意：暂时够好，安全可试）、按任务设定的授权刻度盘、当争论的是“到底发生了什么”时用两个真相。", "end": "一个十五分钟内做出的、可逆的真实决定，附带复盘日期。", "result": "一个月内被重开的决定 · “决定能落地”脉搏调查 · 团队自主决定的周期。", "story": "Sam 的声音只算一票，和所有人一样。", "tools": [{"id": "decide", "name": "决策室", "st": "live", "href": "/tools/decide"}, {"id": "dial", "name": "授权刻度盘", "st": "live", "href": "/tools/dial"}, {"id": "twotruths", "name": "两个真相", "st": "live", "href": "/tools/twotruths"}, {"id": "drama", "name": "职场生存剧", "st": "drama", "href": ""}], "belief": "学习是相互的", "prove": "经理的声音只算一票，和所有人一样。"}, {"n": 7, "act": "a2", "lead": "/tools/twotruths", "title": "“每个部门都觉得另一个部门在拖后腿。”", "under": "事实和故事混在一起，跨越几张桌子；谁也不知道别人在等什么。", "build": "用一次真实延误做两个真相，三个部门同时做“三张桌子”（各自的私密说明、一条共同时间线、事实还是故事的分拣、一句改写的交接：“某部门需要某物，某时之前，因为某原因”）。", "end": "一句成为团队请求格式的交接句。", "result": "带“因为”的请求 · 某个交接点的周期 · 项目时间线。", "story": "Tomás、Priya 和 Nadia 一起重建一次延误。", "tools": [{"id": "twotruths", "name": "两个真相", "st": "live", "href": "/tools/twotruths"}, {"id": "threedesks", "name": "三张桌子", "st": "concept", "href": ""}, {"id": "cg", "name": "共同之地", "st": "live", "href": "/labs/common-ground/"}], "belief": "边做边学，乐在其中", "prove": "案例是团队自己的那次延误，不是教科书里的。"}, {"n": 8, "act": "a3", "lead": "/labs/launchpad/", "title": "“入职就是一本手册加一套幻灯片。”", "under": "第一天是被讲出来的，不是玩出来的；第一个月里没有一次对话。", "build": "用启航台过第一天（路线卡、站点工具、通往真人的同事小径、一面没有领奖台的墙），第五周每位经理做“第三十天”，用教回去链条让每个新人教下一个。", "end": "一位见过六个真人、被用自己的语言问过一个真实问题的新人。", "result": "完成的第三十天谈话 · 60 天脉搏调查 · 各地 90 天留任率。", "story": "Mei 的第一天，是玩出来的。", "tools": [{"id": "launchpad", "name": "启航台", "st": "lab", "href": "/labs/launchpad/"}, {"id": "day30", "name": "第三十天", "st": "concept", "href": ""}, {"id": "teachback", "name": "教回去链条", "st": "live", "href": "/tools/teachback"}], "belief": "人是目的，从不是手段", "prove": "同事小径把新人送到人那里，而不是手册；那面墙上没有名次。"}, {"n": 9, "act": "a3", "lead": "/tools/prompt", "title": "“AI 许可证买了，使用率 20%。”", "under": "障碍是社交性的：人们怕显得慢、怕被替代。工具的好坏取决于怎么提问，而提问是一项人的能力。", "build": "提示搭档（同事扮演 AI，里面没有 AI）、“给我看看你的”（每人展示一个真实用法，或一件放弃了的事；链条把它传给第三个人），以及在任何人订课之前先做诊断。", "end": "一位先示范、示范得不好的经理，和一份调查问卷从未得到的真实用例清单。", "result": "各团队教回去链条长度 · 活跃许可证 · 团队自己报告的省下时间。", "story": "Leo 给 Mei 看了一个真实用法。", "tools": [{"id": "prompt", "name": "提示搭档", "st": "live", "href": "/tools/prompt"}, {"id": "showme", "name": "给我看看你的", "st": "concept", "href": ""}, {"id": "diagnose", "name": "要不要培训？", "st": "live", "href": "/tools/diagnose"}], "belief": "人是目的，从不是手段", "prove": "AI 和网页应用都是工具。重要的是之后人们彼此做了什么。"}, {"n": 10, "act": "a3", "lead": "/tools/discovery", "title": "“销售推销得太早，遇到异议就卡住。”", "under": "说出口的需求很少是真正的需要；在工作坊里懂一个技巧，不等于压力下想得起来。", "build": "探询二重奏（一位藏着真实需要的客户、一只推销铃、没有分数），以及重建为双人演练的销售训练营：带诚实证据评级的间隔卡片，然后由同事念出异议，判断这句回答能不能落地。", "end": "下一次真实通话里，在提任何建议之前多问的两个问题。", "result": "每次演练被抓到的推销次数下降 · 通话录音中识别出的技巧 · 做过探询的成交率。", "story": "Jordi 多保持了一会儿好奇。", "tools": [{"id": "discovery", "name": "探询二重奏", "st": "live", "href": "/tools/discovery"}, {"id": "sales", "name": "销售心理学训练营", "st": "lab", "href": "/labs/sales/"}], "belief": "边做边学，乐在其中", "prove": "那只铃把坏习惯变成共同的玩笑，而不是评判。"}, {"n": 11, "act": "a3", "lead": "/tools/design/", "title": "“我们办了创新培训。什么都没走出那间屋子。”", "under": "方法被讲了，没被做；没人采访过一个真人。", "build": "设计思维奥德赛：五个世界，每条规则都是一个方法；给会议室用的疯狂八分钟计时器；以及第六阶段“实地”：没有游戏，和一位同事花十分钟聊一个真实的困扰，一起填共情地图，由对方在卡片上联署。", "end": "一次真实采访、一句“我们能否……”、一位感到被倾听的同事。", "result": "联署的实地采访 · 做到原型的想法 · 以用户采访开头的项目。", "story": "Tomás 的团队采访了一位真实的同事。", "tools": [{"id": "design", "name": "设计思维奥德赛", "st": "live", "href": "/tools/design/"}], "belief": "学习是相互的", "prove": "联署才是证据；五个小测验不是。"}, {"n": 12, "act": "a3", "lead": "/tools/listen", "title": "“交接错误不断出现在事故报告里。”", "under": "一个被包装成记录问题的倾听问题：接班的人听到一张清单，却听不出交班的人在担心什么。", "build": "交接二重奏，就是现有交接的头 90 秒：先说担心，再说清单，对方复述，“TA 听到你的担心了吗？”。不记录任何东西。同样的形状，一集病房里的姊妹篇。", "end": "一个先说担心的病房。", "result": "对所述担忧的记忆 · 与交接相关的事故 · 交接时长，通常缩短。", "story": "同样的形状，另一间病房。", "tools": [{"id": "handover", "name": "交接二重奏", "st": "concept", "href": ""}, {"id": "listen", "name": "倾听二重奏", "st": "live", "href": "/tools/listen"}], "belief": "边做边学，乐在其中", "prove": "演练就是真实的交接，在班次之内，不记录任何东西。"}, {"n": 13, "act": "a4", "lead": "/labs/coach/", "title": "“重组之后，团队安静了。”", "under": "信任要靠一次次诚实的交流重建；没人要的安慰只会更糟。", "build": "重组后一周内，每位团队负责人做“现在什么是真的”（匿名提问；经理只能回答“是真的”“不是真的”，或“我还不知道，某天之前告诉你”），用教练副驾排练最难的那一个，用问题卡组守住每周五分钟。", "end": "下一次团队会议上，第一项就是兑现那些有日期的承诺。", "result": "每次活动提出的问题 · 对领导层信任的脉搏调查 · 之后六个月的惋惜离职率。", "story": "Ana 只用三种方式回答。", "tools": [{"id": "truenow", "name": "现在什么是真的", "st": "concept", "href": ""}, {"id": "coach", "name": "教练副驾", "st": "lab", "href": "/labs/coach/"}, {"id": "questions", "name": "问题卡组", "st": "live", "href": "/tools/questions"}, {"id": "drama", "name": "职场生存剧", "st": "drama", "href": ""}], "belief": "人是目的，从不是手段", "prove": "没有情绪分析，没有监控；经理自己报告兑现了的承诺。"}], "coda": {"name": "尾声", "months": "十二月", "arc": "每个人把一件事教给团队之外的一个人。团队一起盖起自己的小镇，把一个问题带进年底最后一次会议。最后一个镜头，在屏幕之外。", "tools": [{"id": "teachback", "name": "教回去链条", "st": "live", "href": "/tools/teachback"}, {"id": "cg", "name": "共同之地", "st": "live", "href": "/labs/common-ground/"}]}}, "es": {"title": "Casos — FREE//BUILDER", "kicker": "Casos · Primera temporada", "h1": "Trece problemas. Un año. <span class=\"acc\">Una</span> empresa inventada.", "lead": "Cada caso empieza con un problema que dijo un cliente, se construye con las situaciones del propio equipo, se juega entre dos personas con un móvil, termina en una conversación real, y cuenta conversaciones, nunca personas.", "cast": "Ana, ingeniera ascendida a jefa en enero · Leo, su colaborador más veterano · Mei, la graduada que entra en septiembre · Sam, el director que siempre está seguro · Priya, que lleva el equipo de Bengaluru en la llamada del lunes · Jordi, en ventas · Nadia, en RR. HH., a quien llega cada petición de formación · Tomás, en producto.", "trailer": "Ver el tráiler", "trailerMeta": "Drama de Supervivencia Corporativa · Episodio 01 · 1 minuto · hecho para verse juntos", "actLbl": "Acto", "ep": "Episodio {n}", "under": "Debajo", "build": "Construimos", "ends": "Termina con", "expect": "Qué esperar", "proves": "Demuestra", "tagLive": "En vivo", "tagLab": "Lab", "tagConcept": "Concepto", "tagDrama": "Ver juntos", "conceptHint": "Se construye para tu equipo en un proyecto con cliente", "try": "Pruébalo en dos minutos", "codaK": "Coda · Diciembre", "ctaK": "Tu gente, tus casos", "ctaH": "¿Cuál de estos es el tuyo?", "ctaT": "Dime dónde duele. Un proyecto con cliente parte de vuestras situaciones, no de estas.", "ctaGo": "Empezar la conversación", "ctaPf": "Ver la historia en el portfolio", "acts": [{"id": "a1", "num": "I", "name": "La petición", "months": "De enero a marzo", "arc": "Nadia, de RR. HH., recibe una petición: \"los jefes de equipo necesitan formación en feedback\". El diagnóstico apunta a otro sitio: Ana, ascendida en enero, lleva sus primeros 1:1 como si fueran reuniones de estado."}, {"id": "a2", "num": "II", "name": "La sala se calla", "months": "De abril a junio", "arc": "Un casi-accidente que nadie reporta. El equipo de Priya solo escucha en la llamada del lunes. Una decisión tomada en la reunión y deshecha en el aparcamiento. Tres funciones se culpan por el mismo retraso. Entonces Sam, el director que siempre está seguro, cuenta primero un error suyo."}, {"id": "a3", "num": "III", "name": "Gente nueva, herramientas nuevas", "months": "De julio a octubre", "arc": "El primer día de Mei se juega, no se presenta; su día treinta con Ana ocurre en el almacén. Llegan las licencias de IA y Leo le enseña a Mei un uso real. Jordi deja de vender antes de tiempo. El equipo de producto de Tomás entrevista a un colega de verdad."}, {"id": "a4", "num": "IV", "name": "Después del recorte", "months": "Noviembre", "arc": "Una reestructuración. Los que se quedan se callan. Ana solo responde \"es verdad\", \"no es verdad\" o \"aún no lo sé, y te lo diré antes de tal día\"."}], "cases": [{"n": 1, "act": "a1", "lead": "/tools/diagnose", "title": "«Alguien ha pedido una formación.»", "under": "La mayoría de las peticiones van de expectativas, feedback, herramientas o incentivos, no de habilidad. El diagnóstico más barato son tres conversaciones.", "build": "Abrimos el diagnóstico de dos minutos con quien lo pide, pasamos sus propios números por la calculadora y dejamos Room Mode y el enseñar-de-vuelta para el día en que un programa sí toca.", "end": "un programa que no se hace, o uno hecho como práctica entre personas.", "result": "Peticiones convertidas en arreglos de condiciones · horas pasadas de cursos a práctica · conducta visible a los 30 días.", "story": "Nadia lee la petición en voz alta.", "tools": [{"id": "diagnose", "name": "¿Formación o no?", "st": "live", "href": "/tools/diagnose"}, {"id": "cost", "name": "Calculadora de coste", "st": "live", "href": "/tools/cost"}, {"id": "room", "name": "Room Mode", "st": "lab", "href": "/tools/room"}, {"id": "teachback", "name": "Cadena de Enseñar de Vuelta", "st": "live", "href": "/tools/teachback"}], "belief": "Primero, diagnosticar", "prove": "Escuchar primero. El taller que se pide casi nunca es el problema de fondo."}, {"n": 2, "act": "a1", "lead": "/labs/coach/", "title": "«Ascendimos a nuestros mejores ingenieros; ahora llevan los 1:1 como reuniones de estado.»", "under": "Nadie les enseñó un 1:1 que no lo fuera. Saben lo de \"pregunta, no digas\" por una diapositiva y lo pierden bajo presión.", "build": "Un calentamiento privado en el Copiloto, luego Primer 1:1 con una persona real antes de la primera reunión de verdad, y en el segundo mes el Dial y el Manual de Uso, cada acuerdo en un enlace que los dos pueden reabrir.", "end": "una pregunta de apertura acordada en las dos agendas.", "result": "Preguntar/decir en el ensayo · pulso \"mi jefe escucha\" · bajas lamentadas con jefes de primer año.", "story": "Ana ensaya y luego se sienta con Leo de verdad.", "tools": [{"id": "coach", "name": "Copiloto de Coaching", "st": "lab", "href": "/labs/coach/"}, {"id": "dial", "name": "Dial de Delegación", "st": "live", "href": "/tools/dial"}, {"id": "manual", "name": "Mi Manual de Uso", "st": "live", "href": "/tools/manual"}, {"id": "first11", "name": "Primer 1:1", "st": "concept", "href": ""}], "belief": "Primero las capacidades humanas", "prove": "La pantalla es el calentamiento; la meta es la conversación real con tu equipo."}, {"n": 3, "act": "a1", "lead": "/tools/listen", "title": "«El feedback ocurre una vez al año, en un formulario.»", "under": "No se da feedback porque nadie practicó decirlo; no se escucha porque uno espera para defenderse.", "build": "Primero el Dúo de escucha, luego Gracias Concretas, el Kit de Reparación y el Feedback de Pasillo en el minuto después de cualquier reunión pequeña. Los socios van primero durante un mes.", "end": "un gracias dicho en persona hoy, y una reparación pendiente que ya empezó.", "result": "Feedback dado por semana · \"sé cómo lo estoy haciendo\" · sorpresas en la evaluación, a la baja.", "story": "El primer gracias se dice en voz alta.", "tools": [{"id": "listen", "name": "Dúo de escucha", "st": "live", "href": "/tools/listen"}, {"id": "thanks", "name": "Gracias Concretas", "st": "live", "href": "/tools/thanks"}, {"id": "repair", "name": "Kit de Reparación", "st": "live", "href": "/tools/repair"}, {"id": "hallway", "name": "Feedback de Pasillo", "st": "concept", "href": ""}], "belief": "El aprendizaje es mutuo", "prove": "Todos enseñan, todos aprenden; quien recibe se convierte en quien enseña."}, {"n": 4, "act": "a2", "lead": "/tools/museum", "title": "«Nadie dice nada en la reunión, y luego todo en el pasillo.»", "under": "El silencio es una lectura aprendida de las consecuencias. Se desaprende igual: la persona senior va primero, y no cuesta nada.", "build": "Museo de Errores, Mazo de Preguntas como ritual semanal, y las versiones por sector: Muro de Casi-Accidentes para la charla de seguridad, Segunda Opinión para la mesa de operaciones.", "end": "un jefe que contó primero un error, delante del equipo.", "result": "Preguntas y casi-accidentes por sesión · ítems de encuesta sobre hablar claro · incidentes y hallazgos de auditoría.", "story": "Sam cuelga la primera pieza.", "tools": [{"id": "museum", "name": "Museo de Errores", "st": "live", "href": "/tools/museum"}, {"id": "questions", "name": "Mazo de Preguntas", "st": "live", "href": "/tools/questions"}, {"id": "nearmiss", "name": "Muro de Casi-Accidentes", "st": "concept", "href": ""}, {"id": "second", "name": "Segunda Opinión", "st": "concept", "href": ""}, {"id": "drama", "name": "Drama de Supervivencia Corporativa", "st": "drama", "href": ""}], "belief": "Las personas son el fin, nunca el medio", "prove": "Ninguna pieza se puntúa, se cuenta ni se compara; \"yo también\" es solidaridad."}, {"n": 5, "act": "a2", "lead": "/labs/cq/", "title": "«Nuestras oficinas se malinterpretan.»", "under": "La formación cultural cambió un estereotipo por otro más educado. Casi toda la fricción son dos personas razonables con media historia cada una, más quién puede permitirse hablar.", "build": "Casi toda la fricción son dos personas razonables con media historia cada una, más quién puede permitirse hablar. El Atlas a solas, el Cambio de Perspectiva en parejas entre oficinas, y luego Quién Habló dentro de la propia llamada del lunes: tiempo de palabra por oficina, nunca por nombre.", "end": "una llamada que abre la oficina que menos habló.", "result": "Jefes que van más allá de la lente cultural · \"puedo hablar\" por sede · decisiones reabiertas tras la llamada.", "story": "El equipo de Priya abre la siguiente llamada.", "tools": [{"id": "cq", "name": "Atlas Intercultural", "st": "lab", "href": "/labs/cq/"}, {"id": "swap", "name": "Cambio de Perspectiva", "st": "live", "href": "/tools/swap"}, {"id": "whospoke", "name": "Quién Habló", "st": "concept", "href": ""}], "belief": "Primero las capacidades humanas", "prove": "Curiosidad antes que la respuesta correcta; tendencias, nunca reglas sobre una persona."}, {"n": 6, "act": "a2", "lead": "/tools/decide", "title": "«Las decisiones se toman en la reunión y se rehacen en el aparcamiento.»", "under": "Nadie dijo en voz alta quién decide, y se confundió consenso con consentimiento.", "build": "Sala de Decisiones (presentar, aclarar, reaccionar, consentir: suficiente por ahora, seguro para probar), el Dial por tarea, Dos Verdades cuando se discute lo que pasó.", "end": "una decisión real y reversible tomada en quince minutos, con fecha de revisión.", "result": "Decisiones reabiertas en un mes · pulso \"las decisiones se mantienen\" · tiempo de ciclo en decisiones del equipo.", "story": "La voz de Sam cuenta una vez, como la de todos.", "tools": [{"id": "decide", "name": "Sala de Decisiones", "st": "live", "href": "/tools/decide"}, {"id": "dial", "name": "Dial de Delegación", "st": "live", "href": "/tools/dial"}, {"id": "twotruths", "name": "Dos Verdades", "st": "live", "href": "/tools/twotruths"}, {"id": "drama", "name": "Drama de Supervivencia Corporativa", "st": "drama", "href": ""}], "belief": "El aprendizaje es mutuo", "prove": "La voz del jefe cuenta una vez, como la de todos."}, {"n": 7, "act": "a2", "lead": "/tools/twotruths", "title": "«Cada función cree que la otra es el bloqueo.»", "under": "Hechos e historias mezclados, entre mesas; nadie sabe qué esperaban los demás.", "build": "Dos Verdades sobre un retraso real, Tres Mesas para tres funciones a la vez (informes privados, una línea de tiempo común, la criba hecho-o-historia, un traspaso reescrito como \"[función] necesita [cosa] para [cuándo] porque [razón]\").", "end": "una frase de traspaso que se vuelve el formato de peticiones del equipo.", "result": "Peticiones escritas con un \"porque\" · tiempo de ciclo en un traspaso · calendario del programa.", "story": "Tomás, Priya y Nadia reconstruyen un retraso.", "tools": [{"id": "twotruths", "name": "Dos Verdades", "st": "live", "href": "/tools/twotruths"}, {"id": "threedesks", "name": "Tres Mesas", "st": "concept", "href": ""}, {"id": "cg", "name": "Terreno Común", "st": "live", "href": "/labs/common-ground/"}], "belief": "Aprender haciendo, y disfrutar", "prove": "El caso es el retraso del propio equipo, no uno de manual."}, {"n": 8, "act": "a3", "lead": "/labs/launchpad/", "title": "«La incorporación es un manual y una presentación.»", "under": "El primer día se presentó, no se jugó, y el primer mes no tuvo ninguna conversación.", "build": "Launchpad para el día en sí (tarjetas de ruta, herramientas por estación, un recorrido hacia personas reales, un muro sin podio), Día Treinta para cada jefe en la semana cinco, la Cadena para que cada nuevo enseñe al siguiente.", "end": "una persona nueva que conoció a seis personas reales y recibió una pregunta real, en su propio idioma.", "result": "Conversaciones de día 30 hechas · pulso a 60 días · retención a 90 días por sede.", "story": "El primer día de Mei, jugado.", "tools": [{"id": "launchpad", "name": "Launchpad", "st": "lab", "href": "/labs/launchpad/"}, {"id": "day30", "name": "Día Treinta", "st": "concept", "href": ""}, {"id": "teachback", "name": "Cadena de Enseñar de Vuelta", "st": "live", "href": "/tools/teachback"}], "belief": "Las personas son el fin, nunca el medio", "prove": "El recorrido manda a los nuevos a personas, no a manuales, y el muro no tiene puestos."}, {"n": 9, "act": "a3", "lead": "/tools/prompt", "title": "«Compramos las licencias de IA; el uso es del 20 %.»", "under": "La barrera es social: la gente teme parecer lenta o prescindible. Una herramienta vale lo que vale la pregunta, y preguntar es una habilidad humana.", "build": "Pareja de Prompts (tu colega hace de IA, sin IA dentro), Enséñame el Tuyo (cada uno muestra un uso real o algo que abandonó; la cadena lo lleva a una tercera persona), y el diagnóstico antes de que nadie reserve un curso.", "end": "un jefe que enseñó primero, y mal, y una lista de usos reales que ninguna encuesta dio.", "result": "Longitud de la cadena por equipo · licencias activas · tiempo ahorrado según el equipo.", "story": "Leo le enseña a Mei un uso real.", "tools": [{"id": "prompt", "name": "Pareja de Prompts", "st": "live", "href": "/tools/prompt"}, {"id": "showme", "name": "Enséñame el Tuyo", "st": "concept", "href": ""}, {"id": "diagnose", "name": "¿Formación o no?", "st": "live", "href": "/tools/diagnose"}], "belief": "Las personas son el fin, nunca el medio", "prove": "La IA y las apps son herramientas. Lo que importa es lo que la gente hace después, entre sí."}, {"n": 10, "act": "a3", "lead": "/tools/discovery", "title": "«Los comerciales venden demasiado pronto y se bloquean ante las objeciones.»", "under": "La petición dicha rara vez es la necesidad real, y saber una técnica en un taller no es recordarla bajo presión.", "build": "Dúo de Descubrimiento (un cliente con una necesidad oculta, una campana anti-pitch, sin puntuación), y la Academia rehecha como ejercicio en pareja: tarjetas espaciadas con evidencia honesta, y un colega que lee la objeción y juzga si la respuesta funcionaría.", "end": "dos preguntas más en la próxima llamada real antes de proponer nada.", "result": "Pitches cazados por ejercicio, a la baja · técnicas vistas en llamadas grabadas · tasa de cierre donde hubo descubrimiento.", "story": "Jordi se queda curioso un poco más.", "tools": [{"id": "discovery", "name": "Dúo de Descubrimiento", "st": "live", "href": "/tools/discovery"}, {"id": "sales", "name": "Academia de Psicología de Ventas", "st": "lab", "href": "/labs/sales/"}], "belief": "Aprender haciendo, y disfrutar", "prove": "La campana convierte un mal hábito en una broma compartida, no en un juicio."}, {"n": 11, "act": "a3", "lead": "/tools/design/", "title": "«Hicimos formación en innovación. Nada salió de la sala.»", "under": "El método se enseñó, no se hizo; nadie entrevistó a una persona real.", "build": "La Odisea del Design Thinking, cinco mundos donde cada mecánica es un método, el reloj de Crazy 8s para la sala, y la Fase 06 Campo: sin juego, diez minutos con un colega sobre una frustración real, un mapa de empatía rellenado juntos, su firma en la tarjeta.", "end": "una entrevista real, un \"cómo podríamos\", un colega que se sintió escuchado.", "result": "Entrevistas de campo firmadas · ideas que llegaron a prototipo · proyectos que empezaron con una entrevista.", "story": "El equipo de Tomás entrevista a un colega real.", "tools": [{"id": "design", "name": "Odisea del Design Thinking", "st": "live", "href": "/tools/design/"}], "belief": "El aprendizaje es mutuo", "prove": "La firma es la prueba; los cinco tests no."}, {"n": 12, "act": "a3", "lead": "/tools/listen", "title": "«Los errores de relevo siguen apareciendo en los informes de incidentes.»", "under": "Un problema de escucha disfrazado de documentación: el turno entrante oye una lista y no sabe qué preocupa al saliente.", "build": "El Dúo de Relevo son los primeros 90 segundos del relevo que ya existe: la preocupación antes de la lista, repetirla, \"¿captó la preocupación?\". Nada se graba. Un episodio hermano en una planta de hospital, la misma forma.", "end": "una planta que dice primero la preocupación.", "result": "Recuerdo de la preocupación dicha · incidentes ligados al relevo · duración del relevo, normalmente menor.", "story": "La misma forma, otra planta.", "tools": [{"id": "handover", "name": "Dúo de Relevo", "st": "concept", "href": ""}, {"id": "listen", "name": "Dúo de escucha", "st": "live", "href": "/tools/listen"}], "belief": "Aprender haciendo, y disfrutar", "prove": "El ejercicio es el relevo real, dentro del turno, sin grabar nada."}, {"n": 13, "act": "a4", "lead": "/labs/coach/", "title": "«El equipo se ha callado desde la reestructuración.»", "under": "La confianza se reconstruye con un intercambio honesto cada vez; la tranquilidad que nadie pidió lo empeora.", "build": "Qué Es Verdad Ahora para cada jefe de equipo la semana después (preguntas anónimas; el jefe solo puede responder \"es verdad\", \"no es verdad\" o \"aún no lo sé, y te lo diré antes de tal día\"), el Copiloto para ensayar la más difícil, el Mazo para mantener los cinco minutos semanales.", "end": "promesas con fecha cumplidas como primer punto de la siguiente reunión.", "result": "Preguntas por sesión · pulso de confianza en el liderazgo · bajas lamentadas en los seis meses siguientes.", "story": "Ana solo responde de tres maneras.", "tools": [{"id": "truenow", "name": "Qué Es Verdad Ahora", "st": "concept", "href": ""}, {"id": "coach", "name": "Copiloto de Coaching", "st": "lab", "href": "/labs/coach/"}, {"id": "questions", "name": "Mazo de Preguntas", "st": "live", "href": "/tools/questions"}, {"id": "drama", "name": "Drama de Supervivencia Corporativa", "st": "drama", "href": ""}], "belief": "Las personas son el fin, nunca el medio", "prove": "Sin analítica de sentimiento, sin vigilancia; el jefe informa de sus propias promesas cumplidas."}], "coda": {"name": "Coda", "months": "Diciembre", "arc": "Cada persona enseña una cosa a alguien de fuera del equipo. El equipo construye su pueblo y lleva una pregunta a la última reunión del año. El último plano es fuera de la pantalla.", "tools": [{"id": "teachback", "name": "Cadena de Enseñar de Vuelta", "st": "live", "href": "/tools/teachback"}, {"id": "cg", "name": "Terreno Común", "st": "live", "href": "/labs/common-ground/"}]}}, "zh-Hant": {"title": "案例 — FREE//BUILDER", "kicker": "案例 · 第一季", "h1": "十三個難題。一年。<span class=\"acc\">一家</span>虛構的公司。", "lead": "每個案例都從買方說出的一個問題開始，由團隊自己的情境構建，由兩個人用一部手機來練，以一場真實對話收尾；只數對話，從不數人。", "cast": "Ana，一月升任經理的工程師 · Leo，她最資深的下屬 · Mei，九月入職的畢業生 · Sam，永遠篤定的總監 · Priya，週一電話會上班加羅爾團隊的負責人 · Jordi，做銷售 · Nadia，人力資源，收下每一個培訓需求 · Tomás，做產品。", "trailer": "播放預告片", "trailerMeta": "職場生存劇 · 第 1 集 · 1 分鐘 · 為一起看而做", "actLbl": "第", "ep": "第 {n} 集", "under": "底下是什麼", "build": "我們構建", "ends": "結束於", "expect": "可以期待什麼", "proves": "證明", "tagLive": "已上線", "tagLab": "實驗室", "tagConcept": "概念", "tagDrama": "一起看", "conceptHint": "在客戶專案中為你的團隊構建", "try": "兩分鐘試一下", "codaK": "尾聲 · 十二月", "ctaK": "你的人，你的案例", "ctaH": "哪一個是你們的？", "ctaT": "告訴我哪裡疼。客戶版本從你們自己的情境出發，而不是這些。", "ctaGo": "開始對話", "ctaPf": "在作品集裡看這個故事", "acts": [{"id": "a1", "num": "I", "name": "提出需求", "months": "一月到三月", "arc": "人力資源部的 Nadia 收到一個需求：“團隊負責人需要一次反饋培訓。”診斷卻指向別處：一月剛升任經理的 Ana，正把她的第一批一對一開成站會。"}, {"id": "a2", "num": "II", "name": "會議室安靜下來", "months": "四月到六月", "arc": "一次沒人上報的險情。週一的電話會上，Priya 的團隊只是在聽。會上做的決定，在停車場被推翻。三個部門為同一次延誤互相指責。然後，那位永遠篤定的總監 Sam，第一個說出了自己的失誤。"}, {"id": "a3", "num": "III", "name": "新人，新工具", "months": "七月到十月", "arc": "Mei 的第一天是玩出來的，不是聽出來的；她和 Ana 的第三十天談話，在庫房裡完成。AI 許可證到了，Leo 給 Mei 看了一個真實的用法。Jordi 不再過早推銷。Tomás 的產品團隊去採訪了一位真實的同事。"}, {"id": "a4", "num": "IV", "name": "裁員之後", "months": "十一月", "arc": "一次重組。留下來的人沉默了。Ana 只回答三種話：“是真的”“不是真的”，或者“我還不知道，某天之前我會告訴你”。"}], "cases": [{"n": 1, "act": "a1", "lead": "/tools/diagnose", "title": "“有人提了一個培訓需求。”", "under": "大多數培訓需求關乎期望、反饋、工具或激勵，而不是技能。最便宜的診斷，是三場對話。", "build": "我們和提需求的人一起做兩分鐘診斷，用他們自己的數字算一遍成本，把 Room Mode 和教回去留給真正該辦培訓的那一天。", "end": "一個沒辦的培訓，或一個辦成了人與人練習的培訓。", "result": "需求轉為改善條件 · 課時轉為練習 · 30 天后看到的行為變化。", "story": "Nadia 把需求唸了出來。", "tools": [{"id": "diagnose", "name": "要不要培訓？", "st": "live", "href": "/tools/diagnose"}, {"id": "cost", "name": "成本計算器", "st": "live", "href": "/tools/cost"}, {"id": "room", "name": "Room Mode", "st": "lab", "href": "/tools/room"}, {"id": "teachback", "name": "教回去鏈條", "st": "live", "href": "/tools/teachback"}], "belief": "先診斷", "prove": "先聽。大家要的工作坊，很少是底下真正的問題。"}, {"n": 2, "act": "a1", "lead": "/labs/coach/", "title": "“我們把最好的工程師提成了經理，現在一對一開得像站會。”", "under": "沒人給他們看過一場不是站會的一對一。“多問少說”他們在幻燈片上學過，一有壓力就忘了。", "build": "先在教練副駕上私下熱身，再和一位真實下屬做“第一次一對一”，第二個月用授權刻度盤和使用說明書，每份約定都住在一個兩人可以重新開啟的連結裡。", "end": "一個雙方都寫進日曆的開場問題。", "result": "排練中的問答比 · “我的經理在聽”脈搏調查 · 新經理團隊的惋惜離職率。", "story": "Ana 先排練，再和 Leo 真正坐下來。", "tools": [{"id": "coach", "name": "教練副駕", "st": "lab", "href": "/labs/coach/"}, {"id": "dial", "name": "授權刻度盤", "st": "live", "href": "/tools/dial"}, {"id": "manual", "name": "我的使用說明書", "st": "live", "href": "/tools/manual"}, {"id": "first11", "name": "第一次一對一", "st": "concept", "href": ""}], "belief": "人的能力優先", "prove": "螢幕只是熱身；目標是和你團隊的真實對話。"}, {"n": 3, "act": "a1", "lead": "/tools/listen", "title": "“反饋一年一次，填在表格裡。”", "under": "不給反饋，是因為從沒練過怎麼說；聽不進反饋，是因為正準備辯解。", "build": "先是傾聽二重奏，再是具體的感謝、修復工具包，以及任何小會議結束後那一分鐘的走廊反饋。合夥人先做一個月。", "end": "今天當面說出的一句感謝，和一段欠著、開始了的修復。", "result": "每週給出的反饋 · “我知道自己做得怎樣” · 績效評估時的意外減少。", "story": "第一句感謝被說出了口。", "tools": [{"id": "listen", "name": "傾聽二重奏", "st": "live", "href": "/tools/listen"}, {"id": "thanks", "name": "具體的感謝", "st": "live", "href": "/tools/thanks"}, {"id": "repair", "name": "修復工具包", "st": "live", "href": "/tools/repair"}, {"id": "hallway", "name": "走廊反饋", "st": "concept", "href": ""}], "belief": "學習是相互的", "prove": "每個人都在教，每個人都在學；接受反饋的人成為下一個教的人。"}, {"n": 4, "act": "a2", "lead": "/tools/museum", "title": "“會上沒人說話，走廊裡什麼都說。”", "under": "沉默是對後果的習得判斷。它的消解也一樣：資深的人先開口，而且不付出代價。", "build": "錯誤博物館、每週儀式的問題卡組，以及行業版本：班前會的險情牆，交易臺的“再確認一下”。", "end": "一位在團隊面前先說出自己失誤的經理。", "result": "每次活動提出的問題與險情 · 敢言調查項 · 事故與審計發現。", "story": "Sam 掛上了第一件展品。", "tools": [{"id": "museum", "name": "錯誤博物館", "st": "live", "href": "/tools/museum"}, {"id": "questions", "name": "問題卡組", "st": "live", "href": "/tools/questions"}, {"id": "nearmiss", "name": "險情牆", "st": "concept", "href": ""}, {"id": "second", "name": "再確認一下", "st": "concept", "href": ""}, {"id": "drama", "name": "職場生存劇", "st": "drama", "href": ""}], "belief": "人是目的，從不是手段", "prove": "沒有展品被打分、計數或比較；“我也是”就是團結。"}, {"n": 5, "act": "a2", "lead": "/labs/cq/", "title": "“我們的各地辦公室老是誤讀彼此。”", "under": "文化培訓只是把一種刻板印象換成更禮貌的一種。大多數摩擦，是兩個講理的人各握著半個故事，再加上誰說得起話。", "build": "大多數摩擦，是兩個講理的人各握著半個故事，再加上誰說得起話。先一個人走跨文化地圖，再跨辦公室兩人做視角互換，然後把“誰在說話”放進週一的電話會本身：按辦公室統計發言，從不按名字。", "end": "一次由發言最少的辦公室開場的電話會。", "result": "越過文化視角的經理比例 · 各地“我敢發言” · 會後被重新開啟的決定。", "story": "下一次電話會由 Priya 的團隊開場。", "tools": [{"id": "cq", "name": "跨文化地圖", "st": "lab", "href": "/labs/cq/"}, {"id": "swap", "name": "視角互換", "st": "live", "href": "/tools/swap"}, {"id": "whospoke", "name": "誰在說話", "st": "concept", "href": ""}], "belief": "人的能力優先", "prove": "好奇心勝過正確答案；是傾向，從不是對某個人的定論。"}, {"n": 6, "act": "a2", "lead": "/tools/decide", "title": "“決定在會上做，在停車場裡重做。”", "under": "沒人大聲說過誰來決定，把共識錯當成了同意。", "build": "決策室（陳述、澄清、反應、同意：暫時夠好，安全可試）、按任務設定的授權刻度盤、當爭論的是“到底發生了什麼”時用兩個真相。", "end": "一個十五分鐘內做出的、可逆的真實決定，附帶復盤日期。", "result": "一個月內被重開的決定 · “決定能落地”脈搏調查 · 團隊自主決定的週期。", "story": "Sam 的聲音只算一票，和所有人一樣。", "tools": [{"id": "decide", "name": "決策室", "st": "live", "href": "/tools/decide"}, {"id": "dial", "name": "授權刻度盤", "st": "live", "href": "/tools/dial"}, {"id": "twotruths", "name": "兩個真相", "st": "live", "href": "/tools/twotruths"}, {"id": "drama", "name": "職場生存劇", "st": "drama", "href": ""}], "belief": "學習是相互的", "prove": "經理的聲音只算一票，和所有人一樣。"}, {"n": 7, "act": "a2", "lead": "/tools/twotruths", "title": "“每個部門都覺得另一個部門在拖後腿。”", "under": "事實和故事混在一起，跨越幾張桌子；誰也不知道別人在等什麼。", "build": "用一次真實延誤做兩個真相，三個部門同時做“三張桌子”（各自的私密說明、一條共同時間線、事實還是故事的分揀、一句改寫的交接：“某部門需要某物，某時之前，因為某原因”）。", "end": "一句成為團隊請求格式的交接句。", "result": "帶“因為”的請求 · 某個交接點的週期 · 專案時間線。", "story": "Tomás、Priya 和 Nadia 一起重建一次延誤。", "tools": [{"id": "twotruths", "name": "兩個真相", "st": "live", "href": "/tools/twotruths"}, {"id": "threedesks", "name": "三張桌子", "st": "concept", "href": ""}, {"id": "cg", "name": "共同之地", "st": "live", "href": "/labs/common-ground/"}], "belief": "邊做邊學，樂在其中", "prove": "案例是團隊自己的那次延誤，不是教科書裡的。"}, {"n": 8, "act": "a3", "lead": "/labs/launchpad/", "title": "“入職就是一本手冊加一套幻燈片。”", "under": "第一天是被講出來的，不是玩出來的；第一個月裡沒有一次對話。", "build": "用啟航臺過第一天（路線卡、站點工具、通往真人的同事小徑、一面沒有領獎臺的牆），第五週每位經理做“第三十天”，用教回去鏈條讓每個新人教下一個。", "end": "一位見過六個真人、被用自己的語言問過一個真實問題的新人。", "result": "完成的第三十天談話 · 60 天脈搏調查 · 各地 90 天留任率。", "story": "Mei 的第一天，是玩出來的。", "tools": [{"id": "launchpad", "name": "啟航臺", "st": "lab", "href": "/labs/launchpad/"}, {"id": "day30", "name": "第三十天", "st": "concept", "href": ""}, {"id": "teachback", "name": "教回去鏈條", "st": "live", "href": "/tools/teachback"}], "belief": "人是目的，從不是手段", "prove": "同事小徑把新人送到人那裡，而不是手冊；那面牆上沒有名次。"}, {"n": 9, "act": "a3", "lead": "/tools/prompt", "title": "“AI 許可證買了，使用率 20%。”", "under": "障礙是社交性的：人們怕顯得慢、怕被替代。工具的好壞取決於怎麼提問，而提問是一項人的能力。", "build": "提示搭檔（同事扮演 AI，裡面沒有 AI）、“給我看看你的”（每人展示一個真實用法，或一件放棄了的事；鏈條把它傳給第三個人），以及在任何人訂課之前先做診斷。", "end": "一位先示範、示範得不好的經理，和一份調查問卷從未得到的真實用例清單。", "result": "各團隊教回去鏈條長度 · 活躍許可證 · 團隊自己報告的省下時間。", "story": "Leo 給 Mei 看了一個真實用法。", "tools": [{"id": "prompt", "name": "提示搭檔", "st": "live", "href": "/tools/prompt"}, {"id": "showme", "name": "給我看看你的", "st": "concept", "href": ""}, {"id": "diagnose", "name": "要不要培訓？", "st": "live", "href": "/tools/diagnose"}], "belief": "人是目的，從不是手段", "prove": "AI 和網頁應用都是工具。重要的是之後人們彼此做了什麼。"}, {"n": 10, "act": "a3", "lead": "/tools/discovery", "title": "“銷售推銷得太早，遇到異議就卡住。”", "under": "說出口的需求很少是真正的需要；在工作坊裡懂一個技巧，不等於壓力下想得起來。", "build": "探詢二重奏（一位藏著真實需要的客戶、一隻推銷鈴、沒有分數），以及重建為雙人演練的銷售訓練營：帶誠實證據評級的間隔卡片，然後由同事念出異議，判斷這句回答能不能落地。", "end": "下一次真實通話裡，在提任何建議之前多問的兩個問題。", "result": "每次演練被抓到的推銷次數下降 · 通話錄音中識別出的技巧 · 做過探詢的成交率。", "story": "Jordi 多保持了一會兒好奇。", "tools": [{"id": "discovery", "name": "探詢二重奏", "st": "live", "href": "/tools/discovery"}, {"id": "sales", "name": "銷售心理學訓練營", "st": "lab", "href": "/labs/sales/"}], "belief": "邊做邊學，樂在其中", "prove": "那隻鈴把壞習慣變成共同的玩笑，而不是評判。"}, {"n": 11, "act": "a3", "lead": "/tools/design/", "title": "“我們辦了創新培訓。什麼都沒走出那間屋子。”", "under": "方法被講了，沒被做；沒人採訪過一個真人。", "build": "設計思維奧德賽：五個世界，每條規則都是一個方法；給會議室用的瘋狂八分鐘計時器；以及第六階段“實地”：沒有遊戲，和一位同事花十分鐘聊一個真實的困擾，一起填共情地圖，由對方在卡片上聯署。", "end": "一次真實採訪、一句“我們能否……”、一位感到被傾聽的同事。", "result": "聯署的實地採訪 · 做到原型的想法 · 以使用者採訪開頭的專案。", "story": "Tomás 的團隊採訪了一位真實的同事。", "tools": [{"id": "design", "name": "設計思維奧德賽", "st": "live", "href": "/tools/design/"}], "belief": "學習是相互的", "prove": "聯署才是證據；五個小測驗不是。"}, {"n": 12, "act": "a3", "lead": "/tools/listen", "title": "“交接錯誤不斷出現在事故報告裡。”", "under": "一個被包裝成記錄問題的傾聽問題：接班的人聽到一張清單，卻聽不出交班的人在擔心什麼。", "build": "交接二重奏，就是現有交接的頭 90 秒：先說擔心，再說清單，對方複述，“TA 聽到你的擔心了嗎？”。不記錄任何東西。同樣的形狀，一集病房裡的姊妹篇。", "end": "一個先說擔心的病房。", "result": "對所述擔憂的記憶 · 與交接相關的事故 · 交接時長，通常縮短。", "story": "同樣的形狀，另一間病房。", "tools": [{"id": "handover", "name": "交接二重奏", "st": "concept", "href": ""}, {"id": "listen", "name": "傾聽二重奏", "st": "live", "href": "/tools/listen"}], "belief": "邊做邊學，樂在其中", "prove": "演練就是真實的交接，在班次之內，不記錄任何東西。"}, {"n": 13, "act": "a4", "lead": "/labs/coach/", "title": "“重組之後，團隊安靜了。”", "under": "信任要靠一次次誠實的交流重建；沒人要的安慰只會更糟。", "build": "重組後一週內，每位團隊負責人做“現在什麼是真的”（匿名提問；經理只能回答“是真的”“不是真的”，或“我還不知道，某天之前告訴你”），用教練副駕排練最難的那一個，用問題卡組守住每週五分鐘。", "end": "下一次團隊會議上，第一項就是兌現那些有日期的承諾。", "result": "每次活動提出的問題 · 對領導層信任的脈搏調查 · 之後六個月的惋惜離職率。", "story": "Ana 只用三種方式回答。", "tools": [{"id": "truenow", "name": "現在什麼是真的", "st": "concept", "href": ""}, {"id": "coach", "name": "教練副駕", "st": "lab", "href": "/labs/coach/"}, {"id": "questions", "name": "問題卡組", "st": "live", "href": "/tools/questions"}, {"id": "drama", "name": "職場生存劇", "st": "drama", "href": ""}], "belief": "人是目的，從不是手段", "prove": "沒有情緒分析，沒有監控；經理自己報告兌現了的承諾。"}], "coda": {"name": "尾聲", "months": "十二月", "arc": "每個人把一件事教給團隊之外的一個人。團隊一起蓋起自己的小鎮，把一個問題帶進年底最後一次會議。最後一個鏡頭，在螢幕之外。", "tools": [{"id": "teachback", "name": "教回去鏈條", "st": "live", "href": "/tools/teachback"}, {"id": "cg", "name": "共同之地", "st": "live", "href": "/labs/common-ground/"}]}}, "ca": {"title": "Casos — FREE//BUILDER", "kicker": "Casos · Primera temporada", "h1": "Tretze problemes. Un any. <span class=\"acc\">Una</span> empresa inventada.", "lead": "Cada cas comença amb un problema que va dir un client, es construeix amb les situacions del mateix equip, es juga entre dues persones amb un mòbil, acaba en una conversa real, i compta converses, mai persones.", "cast": "L'Ana, enginyera ascendida a cap al gener · en Leo, el seu col·laborador més veterà · la Mei, la graduada que entra al setembre · en Sam, el director que sempre n'està segur · la Priya, que porta l'equip de Bengaluru a la trucada del dilluns · en Jordi, a vendes · la Nadia, a RR. HH., a qui arriba cada petició de formació · en Tomás, a producte.", "trailer": "Veure el tràiler", "trailerMeta": "Drama de Supervivència Corporativa · Episodi 01 · 1 minut · fet per veure's junts", "actLbl": "Acte", "ep": "Episodi {n}", "under": "A sota", "build": "Construïm", "ends": "Acaba amb", "expect": "Què esperar", "proves": "Demostra", "tagLive": "En directe", "tagLab": "Lab", "tagConcept": "Concepte", "tagDrama": "Veure junts", "conceptHint": "Es construeix per al teu equip en un projecte amb client", "try": "Prova-ho en dos minuts", "codaK": "Coda · Desembre", "ctaK": "La teva gent, els teus casos", "ctaH": "Quin d'aquests és el teu?", "ctaT": "Digue'm on fa mal. Un projecte amb client parteix de les vostres situacions, no d'aquestes.", "ctaGo": "Començar la conversa", "ctaPf": "Veure la història al portfoli", "acts": [{"id": "a1", "num": "I", "name": "La petició", "months": "De gener a març", "arc": "La Nadia, de RR. HH., rep una petició: «els caps d'equip necessiten formació en feedback». El diagnòstic apunta a un altre lloc: l'Ana, ascendida al gener, porta els seus primers 1:1 com si fossin reunions d'estat."}, {"id": "a2", "num": "II", "name": "La sala calla", "months": "D'abril a juny", "arc": "Un gairebé-accident que ningú no reporta. L'equip de la Priya només escolta a la trucada del dilluns. Una decisió presa a la reunió i desfeta a l'aparcament. Tres funcions es culpen pel mateix retard. Llavors en Sam, el director que sempre n'està segur, explica primer un error seu."}, {"id": "a3", "num": "III", "name": "Gent nova, eines noves", "months": "De juliol a octubre", "arc": "El primer dia de la Mei es juga, no es presenta; el seu dia trenta amb l'Ana passa al magatzem. Arriben les llicències d'IA i en Leo ensenya a la Mei un ús real. En Jordi deixa de vendre abans d'hora. L'equip de producte d'en Tomás entrevista un company de veritat."}, {"id": "a4", "num": "IV", "name": "Després de la retallada", "months": "Novembre", "arc": "Una reestructuració. Els que es queden callen. L'Ana només respon «és veritat», «no és veritat» o «encara no ho sé, i t'ho diré abans de tal dia»."}], "cases": [{"n": 1, "act": "a1", "lead": "/tools/diagnose", "title": "«Algú ha demanat una formació.»", "under": "La majoria de peticions van d'expectatives, feedback, eines o incentius, no d'habilitat. El diagnòstic més barat són tres converses.", "build": "Abrimos el diagnóstico de dos minutos con quien lo pide, pasamos sus propios números por la calculadora y dejamos Room Mode y el enseñar-de-vuelta para el día en que un programa sí toca.", "end": "un programa que no es fa, o un de fet com a pràctica entre persones.", "result": "Peticions convertides en arranjaments de condicions · hores passades de cursos a pràctica · conducta visible als 30 dies.", "story": "La Nadia llegeix la petició en veu alta.", "tools": [{"id": "diagnose", "name": "Formació o no?", "st": "live", "href": "/tools/diagnose"}, {"id": "cost", "name": "Calculadora de cost", "st": "live", "href": "/tools/cost"}, {"id": "room", "name": "Room Mode", "st": "lab", "href": "/tools/room"}, {"id": "teachback", "name": "Cadena d'Ensenyar de Tornada", "st": "live", "href": "/tools/teachback"}], "belief": "Primer, diagnosticar", "prove": "Escoltar primer. El taller que es demana gairebé mai no és el problema de fons."}, {"n": 2, "act": "a1", "lead": "/labs/coach/", "title": "«Vam ascendir els nostres millors enginyers; ara porten els 1:1 com reunions d'estat.»", "under": "Ningú no els va ensenyar un 1:1 que no ho fos. Saben allò de «pregunta, no diguis» per una diapositiva i ho perden sota pressió.", "build": "Un calentamiento privado en el Copiloto, luego Primer 1:1 con una persona real antes de la primera reunión de verdad, y en el segundo mes el Dial y el Manual de Uso, cada acuerdo en un enlace que los dos pueden reabrir.", "end": "una pregunta d'obertura acordada a les dues agendes.", "result": "Preguntar/dir a l'assaig · pols «el meu cap escolta» · baixes lamentades amb caps de primer any.", "story": "L'Ana assaja i després s'asseu amb en Leo de veritat.", "tools": [{"id": "coach", "name": "Copilot de Coaching", "st": "lab", "href": "/labs/coach/"}, {"id": "dial", "name": "Dial de Delegació", "st": "live", "href": "/tools/dial"}, {"id": "manual", "name": "El Meu Manual d'Ús", "st": "live", "href": "/tools/manual"}, {"id": "first11", "name": "Primer 1:1", "st": "concept", "href": ""}], "belief": "Primer les capacitats humanes", "prove": "La pantalla és l'escalfament; la meta és la conversa real amb el teu equip."}, {"n": 3, "act": "a1", "lead": "/tools/listen", "title": "«El feedback passa un cop l'any, en un formulari.»", "under": "No es dona feedback perquè ningú no va practicar dir-ho; no s'escolta perquè un espera per defensar-se.", "build": "Primero el Dúo de escucha, luego Gracias Concretas, el Kit de Reparación y el Feedback de Pasillo en el minuto después de cualquier reunión pequeña. Los socios van primero durante un mes.", "end": "un gràcies dit en persona avui, i una reparació pendent que ja ha començat.", "result": "Feedback donat per setmana · «sé com ho estic fent» · sorpreses a l'avaluació, a la baixa.", "story": "El primer gràcies es diu en veu alta.", "tools": [{"id": "listen", "name": "Duo d'escolta", "st": "live", "href": "/tools/listen"}, {"id": "thanks", "name": "Gràcies Concretes", "st": "live", "href": "/tools/thanks"}, {"id": "repair", "name": "Kit de Reparació", "st": "live", "href": "/tools/repair"}, {"id": "hallway", "name": "Feedback de Passadís", "st": "concept", "href": ""}], "belief": "L'aprenentatge és mutu", "prove": "Tothom ensenya, tothom aprèn; qui rep es converteix en qui ensenya."}, {"n": 4, "act": "a2", "lead": "/tools/museum", "title": "«Ningú no diu res a la reunió, i després tot al passadís.»", "under": "El silenci és una lectura apresa de les conseqüències. Es desaprèn igual: la persona sènior va primer, i no costa res.", "build": "Museo de Errores, Mazo de Preguntas como ritual semanal, y las versiones por sector: Muro de Casi-Accidentes para la charla de seguridad, Segunda Opinión para la mesa de operaciones.", "end": "un cap que va explicar primer un error, davant de l'equip.", "result": "Preguntes i gairebé-accidents per sessió · ítems d'enquesta sobre parlar clar · incidents i troballes d'auditoria.", "story": "En Sam penja la primera peça.", t": "concept", "href": ""}, {"id": "diagnose", "name": "Formació o no?", "st": "live", "href": "/tools/diagnose"}], "belief": "Les persones són el fi, mai el mitjà", "prove": "La IA i les apps són eines. El que importa és el que la gent fa després, entre si."}, {"n": 10, "act": "a3", "lead": "/tools/discovery", "title": "«Els comercials venen massa aviat i es bloquegen davant les objeccions.»", "under": "La petició dita rarament és la necessitat real, i saber una tècnica en un taller no és recordar-la sota pressió.", "build": "Dúo de Descubrimiento (un cliente con una necesidad oculta, una campana anti-pitch, sin puntuación), y la Academia rehecha como ejercicio en pareja: tarjetas espaciadas con evidencia honesta, y un colega que lee la objeción y juzga si la respuesta funcionaría.", "end": "dues preguntes més a la propera trucada real abans de proposar res.", "result": "Pitches caçats per exercici, a la baixa · tècniques vistes en trucades gravades · taxa de tancament on hi va haver descobriment.", "story": "En Jordi es queda curiós una mica més.", "tools": [{"id": "discovery", "name": "Duo de Descobriment", "st": "live", "href": "/tools/discovery"}, {"id": "sales", "name": "Acadèmia de Psicologia de Vendes", "st": "lab", "href": "/labs/sales/"}], "belief": "Aprendre fent, i gaudir", "prove": "La campana converteix un mal hàbit en una broma compartida, no en un judici."}, {"n": 11, "act": "a3", "lead": "/tools/design/", "title": "«Vam fer formació en innovació. Res no va sortir de la sala.»", "under": "El mètode es va ensenyar, no es va fer; ningú no va entrevistar una persona real.", "build": "La Odisea del Design Thinking, cinco mundos donde cada mecánica es un método, el reloj de Crazy 8s para la sala, y la Fase 06 Campo: sin juego, diez minutos con un colega sobre una frustración real, un mapa de empatía rellenado juntos, su firma en la tarjeta.", "end": "una entrevista real, un «com podríem», un company que es va sentir escoltat.", "result": "Entrevistes de camp signades · idees que van arribar a prototip · projectes que van començar amb una entrevista.", "story": "L'equip d'en Tomás entrevista un company real.", "tools": [{"id": "design", "name": "Odissea del Design Thinking", "st": "live", "href": "/tools/design/"}], "belief": "L'aprenentatge és mutu", "prove": "La signatura és la prova; els cinc tests no."}, {"n": 12, "act": "a3", "lead": "/tools/listen", "title": "«Els errors de relleu continuen apareixent als informes d'incidents.»", "under": "Un problema d'escolta disfressat de documentació: el torn entrant sent una llista i no sap què preocupa el sortint.", "build": "El Dúo de Relevo son los primeros 90 segundos del relevo que ya existe: la preocupación antes de la lista, repetirla, \"¿captó la preocupación?\". Nada se graba. Un episodio hermano en una planta de hospital, la misma forma.", "end": "una planta que diu primer la preocupació.", "result": "Record de la preocupació dita · incidents lligats al relleu · durada del relleu, normalment menor.", "story": "La mateixa forma, una altra planta.", "tools": [{"id": "handover", "name": "Duet de Relleu", "st": "concept", "href": ""}, {"id": "listen", "name": "Duo d'escolta", "st": "live", "href": "/tools/listen"}], "belief": "Aprendre fent, i gaudir", "prove": "L'exercici és el relleu real, dins del torn, sense gravar res."}, {"n": 13, "act": "a4", "lead": "/labs/coach/", "title": "«L'equip ha callat des de la reestructuració.»", "under": "La confiança es reconstrueix amb un intercanvi honest cada cop; la tranquil·litat que ningú no va demanar ho empitjora.", "build": "Qué Es Verdad Ahora para cada jefe de equipo la semana después (preguntas anónimas; el jefe solo puede responder \"es verdad\", \"no es verdad\" o \"aún no lo sé, y te lo diré antes de tal día\"), el Copiloto para ensayar la más difícil, el Mazo para mantener los cinco minutos semanales.", "end": "promeses amb data complertes com a primer punt de la reunió següent.", "result": "Preguntes per sessió · pols de confiança en el lideratge · baixes lamentades en els sis mesos següents.", "story": "L'Ana només respon de tres maneres.", "tools": [{"id": "truenow", "name": "Què És Veritat Ara", "st": "concept", "href": ""}, {"id": "coach", "name": "Copilot de Coaching", "st": "lab", "href": "/labs/coach/"}, {"id": "questions", "name": "Baralla de Preguntes", "st": "live", "href": "/tools/questions"}, {"id": "drama", "name": "Drama de Supervivència Corporativa", "st": "drama", "href": ""}], "belief": "Les persones són el fi, mai el mitjà", "prove": "Sense analítica de sentiment, sense vigilància; el cap informa de les seves pròpies promeses complertes."}], "coda": {"name": "Coda", "months": "Desembre", "arc": "Cada persona ensenya una cosa a algú de fora de l'equip. L'equip construeix el seu poble i porta una pregunta a l'última reunió de l'any. L'últim pla és fora de la pantalla.", "tools": [{"id": "teachback", "name": "Cadena d'Ensenyar de Tornada", "st": "live", "href": "/tools/teachback"}, {"id": "cg", "name": "Terreny Comú", "st": "live", "href": "/labs/common-ground/"}]}}};
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

};

    <section class="dark" style="margin-top:44px"><span class="kicker">${esc(s.ctaK)}</span><h2 style="color:#fff">${esc(s.ctaH)}</h2><p style="margin:6px 0 0;color:rgba(255,255,255,.8)">${esc(s.ctaT)}</p>
