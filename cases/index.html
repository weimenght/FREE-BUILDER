  <link rel="stylesheet" href="/fonts/fonts.css">
  <style>
    :root { --paper:#F7F6F2; --ink:#17171A; --muted:#6B6A70; --line:#E5E2DA; --grid:#ECE9E2; --accent:#E2553F; --accent-ink:#C2412D; --white:#fff; --good:#2F7A55;
      --sans:"Plus Jakarta Sans",system-ui,-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
      --mono:"Space Mono",ui-monospace,Menlo,monospace; --syne:Syne,"Plus Jakarta Sans","PingFang SC","Noto Sans SC",sans-serif; --serif:"Instrument Serif",Georgia,"Songti SC",serif; }

    /* cases (Nov 12 a plain list by problem; Nov 13, the owner: a visual timeline and a stronger story): the year at a glance, whom to follow, then the year told along a rail */
    #main { max-width:46rem; margin-left:auto; margin-right:auto; }

    /* the year at a glance */

    .yr-act { display:flex; align-items:center; gap:6px; min-width:0; height:30px; padding:0 8px; text-decoration:none; color:var(--ink); background:color-mix(in srgb,var(--ink) 9%,transparent); border-top:3px solid var(--ink); font-size:12.5px; font-weight:600; line-height:1.1; transform-origin:left; }

    /* whom to follow */

    .who-l { width:100%; font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:2px; }

    .who-b:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    html.following .yr-d:not(.on) { opacity:.22; } html.following .yr-d.on { background:var(--accent); border-color:var(--accent); color:#fff; }
    html.following .cs:not(.on) { opacity:.35; } html.following .cs.on .row::before { background:var(--accent); border-color:var(--accent); }
    .cs { transition:opacity .25s; }
    /* the year, told along a rail */
    .grp { margin-top:52px; scroll-margin-top:84px; }
    .grp h2 { margin:0; padding-bottom:8px; border-bottom:2px solid var(--ink); font-size:clamp(1.15rem,2.6vw,1.4rem); line-height:1.2; display:flex; align-items:baseline; gap:10px; }
    .grp h2 .rn { font-family:var(--mono); font-size:12px; color:var(--accent-ink); font-weight:700; }
    .grp h2 a { text-decoration:none; color:inherit; flex:1; } .grp h2 a:hover { color:var(--accent-ink); }
    .grp h2 small { font-family:var(--mono); font-size:11px; font-weight:400; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); white-space:nowrap; }
    .arc { margin:14px 0 4px; font-size:clamp(15.5px,1.9vw,17px); line-height:1.6; max-width:40rem; }
    .tl { list-style:none; margin:10px 0 0; padding:0 0 0 30px; position:relative; }
    .tl::before { content:""; position:absolute; left:8px; top:0; bottom:0; width:2px; background:var(--inkbg,var(--ink)); }
    .grp.a4 .tl::before { background:linear-gradient(var(--ink),var(--accent)); }
    .tl li { position:relative; }
    .cs { border-bottom:1px solid var(--line); }
    .row { display:grid; grid-template-columns:5.6rem 1fr; gap:4px 14px; padding:16px 2px; text-decoration:none; color:inherit; scroll-margin-top:84px; }
    .row::before { content:""; position:absolute; left:-27px; top:20px; width:12px; height:12px; box-sizing:border-box; border:2px solid var(--ink); background:var(--paper); transition:background .2s; }
    .row:hover::before, .row:focus-visible::before { background:var(--inkbg,var(--ink)); }
    .row .n { grid-row:span 3; font-family:var(--mono); font-size:12px; color:var(--muted); padding-top:.25em; white-space:nowrap; }
    .row .n b { color:var(--accent-ink); font-weight:700; }
    .row .q { font-size:clamp(16px,2vw,18px); line-height:1.35; font-weight:600; }

    .row .e i { display:block; font-style:normal; font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent-ink); margin-bottom:2px; }
    .row:hover .q, .row:focus-visible .q { color:var(--accent-ink); }
    .row:hover .q::after { content:" →"; }
    .ev { padding:12px 0 10px; font-family:var(--mono); font-size:12px; letter-spacing:.04em; text-transform:uppercase; color:var(--accent-ink); font-weight:700; border-bottom:1px dashed var(--line); }
    .ev::before { content:""; position:absolute; left:-26px; top:15px; width:10px; height:10px; background:var(--accent); transform:rotate(45deg); }
    .ev span { color:var(--muted); font-weight:400; margin-right:8px; }
    .end { margin:56px 0 0; padding-top:18px; border-top:2px solid var(--ink); font-size:clamp(1.2rem,3vw,1.6rem); line-height:1.3; }
    .end a { color:inherit; text-decoration:underline; text-decoration-color:var(--accent-ink); text-underline-offset:5px; text-decoration-thickness:2px; } .end a:hover { color:var(--accent-ink); }
    dialog.vid { border:0; padding:0; background:transparent; max-width:min(92vw,960px); width:100%; }
    dialog.vid::backdrop { background:rgba(23,23,26,.85); backdrop-filter:blur(6px); }
    dialog.vid video { width:100%; border-radius:4px; background:#000; display:block; }
    dialog.vid .x { position:absolute; top:-12px; right:-6px; width:36px; height:36px; border-radius:50%; border:0; background:var(--white,#fff); font:700 16px/1 var(--mono); cursor:pointer; }
    @media (max-width:640px) { .yr-act span { display:none; } .yr-act { justify-content:center; padding:0; } .who-b span { display:none; } }
    @media (max-width:520px) { .yr { padding:14px 8px 10px; } .yr-mi { font-size:9px; } .row { grid-template-columns:1fr; } .row .n { grid-row:auto; padding:0; } .grp h2 { flex-wrap:wrap; } .tl { padding-left:24px; } .tl::before { left:5px; } .row::before { left:-24px; } .ev::before { left:-23px; } }
    @media (prefers-reduced-motion:reduce) { .yr .yr-act, .yr .yr-d { animation:none!important; transform:none; opacity:1; } }

<meta name="theme-color" content="#F7F6F2" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#141416" media="(prefers-color-scheme: dark)"><style id="fb-dark">
:root{color-scheme:light dark}
@media (prefers-color-scheme: dark){
:root{--paper:#141416;--ink:#ECEBE6;--muted:#A8A7AD;--line:#303036;--grid:#26262B;--white:#1D1D21;--inkbg:#2B2B31;--inkbd:#3B3B42;--accent-ink:#F28C76;--good:#62C48F;--paper-rgb:20,20,22;--dot-rgb:255,255,255;--ink-rgb:236,235,230;--white-rgb:29,29,33;--accent-text:#F2806A;--warn-ink:#E3B25C}
html,body{background-color:var(--paper)}
/* primary actions read as light on dark */
.btn.pri,.cta a.pri,.chip.pri{background:#ECEBE6!important;border-color:#ECEBE6!important;color:#141416!important}
.btn.pri:hover,.cta a.pri:hover,.chip.pri:hover{background:#fff!important;border-color:#fff!important}
.btn[disabled]{opacity:.45}
.seg button[aria-pressed="true"],.chip[aria-pressed="true"]{background:#ECEBE6!important;border-color:#ECEBE6!important;color:#141416!important}
.steps span.done{background:#ECEBE6}
.curtain{border:1px solid #3B3B42}
/* light mock-ups (the Frontline chat phone) keep their light look: restore the light tokens inside */
.phone{--ink:#17171A;--muted:#6B6A70;--line:#E5E2DA;--grid:#ECEAE4;--white:#fff;--paper:#F7F6F2;--white-rgb:255,255,255;--paper-rgb:247,246,242;--ink-rgb:23,23,26;color:#17171A}
/* reversed (near-white) buttons and selected chips: everything inside takes their dark text, so nothing can turn white on white */
.btn.pri *,.cta a.pri *,.chip.pri *,.seg button[aria-pressed="true"] *,.chip[aria-pressed="true"] *{color:inherit!important}
/* illustrations keep their light look on a plate */
.screen>svg,.plate,.card-art{background:#EFECE4;border-radius:18px}
.plate{background:#fff!important}
.card-art~.text-ink\/60,.card-art~span .text-ink\/60{color:rgba(23,23,26,.62)!important}
.text-accent{color:#F2806A!important}
.bg-white\/90.text-ink,.bg-white\/90 .text-ink{color:#ECEBE6}
img{filter:none}

ything in the corridor.”", "s": "Sam hangs the first exhibit.", "e": "A manager showed a mistake first, in front of the team.", "p": ["Sam"], "href": "/programmes/the-room-goes-quiet/#c4"}, {"n": 5, "mo": 4, "m": "Apr", "q": "“Our offices misread each other.”", "s": "Priya's team opens the next call.", "e": "A call that opens with the office that spoke least.", "p": ["Priya"], "href": "/programmes/the-room-goes-quiet/#c5"}, {"n": 6, "mo": 5, "m": "May", "q": "“Decisions get made in the meeting and remade in the car park.”", "s": "Sam's voice counts once, like everyone's.", "e": "One reversible decision in fifteen minutes, with a review date.", "p": ["Sam"], "href": "/programmes/the-room-goes-quiet/#c6"}, {"n": 7, "mo": 6, "m": "Jun", "q": "“Every function thinks the other one is the blocker.”", "s": "Tomás, Priya and Nadia rebuild one delay.", "e": "One handoff sentence that became the team's request format.", "p": ["Nadia", "Priya", "Tomás"], "href": "/programmes/the-room-goes-quiet/#c7"}]}, {"key": "a3", "num": "III", "name": "New people, new tools", "months": "July to October", "arc": "Mei's first day is played, not presented; her day-30 with Ana happens in the stockroom. The AI licences arrive and Leo shows Mei one real use. Jordi stops pitching early. Tomás's product team interviews a real colleague.", "from": 7, "to": 10, "href": "/programmes/new-people-new-tools/", "cases": [{"n": 8, "mo": 7, "m": "Jul", "q": "“Onboarding is a handbook and a deck.”", "s": "Mei's first day, played.", "e": "A new joiner met six real people on day one.", "p": ["Ana", "Mei"], "href": "/programmes/new-people-new-tools/#c8"}, {"n": 9, "mo": 8, "m": "Aug", "q": "“We bought the AI licences; usage is 20%.”", "s": "Leo shows Mei one real use.", "e": "A manager showed first, badly, and real use cases followed.", "p": ["Mei", "Leo"], "href": "/programmes/new-people-new-tools/#c9"}, {"n": 10, "mo": 9, "m": "Sep", "q": "“Reps pitch too early and freeze on objections.”", "s": "Jordi stays curious a little longer.", "e": "Two more questions on the next real call before any pitch.", "p": ["Jordi"], "href": "/programmes/new-people-new-tools/#c10"}, {"n": 11, "mo": 10, "m": "Oct", "q": "“We ran innovation training. Nothing left the room.”", "s": "Tomás's team interviews a real colleague.", "e": "One real interview, and a colleague who felt listened to.", "p": ["Tomás"], "href": "/programmes/new-people-new-tools/#c11"}, {"n": 12, "mo": 10, "m": "Oct", "q": "“Handover errors keep showing up in incident reports.”", "s": "The same move, on a hospital ward.", "e": "A shift change that starts with the worry.", "p": [], "href": "/programmes/new-people-new-tools/#c12"}]}, {"key": "a4", "num": "IV", "name": "After the cut", "months": "November", "arc": "A restructure. The people who stay go quiet. Ana answers only \"true\", \"not true\", or \"I don't know yet, and I'll tell you by a date\".", "from": 11, "to": 12, "href": "/programmes/after-the-cut/", "cases": [{"n": 13, "mo": 11, "m": "Nov", "q": "“The team has gone quiet since the restructure.”", "s": "Ana answers only three ways.", "e": "Dated promises, kept first in the next team meeting.", "p": ["Ana"], "href": "/programmes/after-the-cut/#c13"}]}], "events": {"1": "Ana is promoted", "8": "The AI licences arrive", "11": "The restructure"}, "people": [{"n": "Ana", "r": "new team lead", "c": [2, 8, 13]}, {"n": "Nadia", "r": "HR", "c": [1, 7]}, {"n": "Sam", "r": "managing director", "c": [4, 6]}, {"n": "Priya", "r": "leads a team across offices", "c": [5, 7]}, {"n": "Mei", "r": "new joiner", "c": [8, 9]}, {"n": "Leo", "r": "engineer on Ana's team", "c": [2, 9]}, {"n": "Tomás", "r": "product", "c": [7, 11]}, {"n": "Jordi", "r": "sales", "c": [10]}]}, "zh": {"title": "案例 — FREE//BUILDER", "h1": "人们带给我们的十三个难题。一家虚构的公司，一年。", "trailer": "播放预告片", "trailerMeta": "1 分钟", "prog": "这个项目", "cta": "听起来很熟悉？30 分钟，不用幻灯片。", "year": "公司里的一年", "mi": "1月 2月 3月 4月 5月 6月 7月 8月 9月 10月 11月 12月", "follow": "跟着一个人走完这一年", "all": "所有人", "ended": "结果", "whatHappens": "发生了什么", "groups": [{"key": "a1", "num": "I", "name": "提出需求", "months": "一月到三月", "arc": "人力资源部的 Nadia 收到一个需求：“团队负责人需要一次反馈培训。”诊断却指向别处：一月刚升任经理的 Ana，正把她的第一批一对一开成站会。", "from": 1, "to": 3, "href": "/programmes/the-ask/", "cases": [{"n": 1, "mo": 1, "m": "1月", "q": "“有人提了一个培训需求。”", "s": "Nadia 把需求念了出来。", "e": "一个没有开的培训，或者变成人与人之间的练习。", "p": ["Nadia"], "href": "/programmes/the-ask/#c1"}, {"n": 2, "mo": 2, "m": "2月", "q": "“我们把最好的工程师提成了经理，现在一对一开得像站会。”", "s": "Ana 先排练，再和 Leo 真正坐下来。", "e": "两个人的日历里，都有同一个约好的开场问题。", "p": ["Ana", "Leo"], "href": "/programmes/the-ask/#c2"}, {"n": 3, "mo": 3, "m": "3月", "q": "“反馈一年一次，填在表格里。”", "s": "第一句感谢被说出了口。", "e": "一句当面说出的感谢，和一次开始的修复。", "p": [], "href": "/programmes/the-ask/#c3"}]}, {"key": "a2", "num": "II", "name": "会议室安静下来", "months": "四月到六月", "arc": "一次没人上报的险情。周一的电话会上，Priya 的团队只是在听。会上做的决定，在停车场被推翻。三个部门为同一次延误互相指责。然后，那位永远笃定的总监 Sam，第一个说出了自己的失误。", "from": 4, "to": 6, "href": "/programmes/the-room-goes-quiet/", "cases": [{"n": 4, "mo": 4, "m": "4月", "q": "“会上没人说话，走廊里什么都说。”", "s": "Sam 挂上了第一件展品。", "e": "一位经理当着团队的面，先说出了自己的一个失误。", "p": ["Sam"], "href": "/programmes/the-room-goes-quiet/#c4"}, {"n": 5, "mo": 4, "m": "4月", "q": "“我们的各地办公室老是误读彼此。”", "s": "下一次电话会由 Priya 的团队开场。", "e": "一场由发言最少的办公室开场的电话会。", "p": ["Priya"], "href": "/programmes/the-room-goes-quiet/#c5"}, {"n": 6, "mo": 5, "m": "5月", "q": "“决定在会上做，在停车场里重做。”", "s": "Sam 的声音只算一票，和所有人一样。", "e": "十五分钟内一个可以撤回的决定，附上复盘日期。", "p": ["Sam"], "href": "/programmes/the-room-goes-quiet/#c6"}, {"n": 7, "mo": 6, "m": "6月", "q": "“每个部门都觉得另一个部门在拖后腿。”", "s": "Tomás、Priya 和 Nadia 一起重建一次延误。", "e": "一句交接的话，成了团队提需求的格式。", "p": ["Nadia", "Priya", "Tomás"], "href": "/programmes/the-room-goes-quiet/#c7"}]}, {"key": "a3", "num": "III", "name": "新人，新工具", "months": "七月到十月", "arc": "Mei 的第一天是玩出来的，不是听出来的；她和 Ana 的第三十天谈话，在库房里完成。AI 许可证到了，Leo 给 Mei 看了一个真实的用法。Jordi 不再过早推销。Tomás 的产品团队去采访了一位真实的同事。", "from": 7, "to": 10, "href": "/programmes/new-people-new-tools/", "cases": [{"n": 8, "mo": 7, "m": "7月", "q": "“入职就是一本手册加一套幻灯片。”", "s": "Mei 的第一天，是玩出来的。", "e": "新人第一天就见了六个真实的人。", "p": ["Ana", "Mei"], "href": "/programmes/new-people-new-tools/#c8"}, {"n": 9, "mo": 8, "m": "8月", "q": "“AI 许可证买了，使用率 20%。”", "s": "Leo 给 Mei 看了一个真实用法。", "e": "一位经理先上手，做得不好，真实的用法随后而来。", "p": ["Mei", "Leo"], "href": "/programmes/new-people-new-tools/#c9"}, {"n": 10, "mo": 9, "m": "9月", "q": "“销售推销得太早，遇到异议就卡住。”", "s": "Jordi 多保持了一会儿好奇。", "e": "下一个真实电话里，推销之前多问了两个问题。", "p": ["Jordi"], "href": "/programmes/new-people-new-tools/#c10"}, {"n": 11, "mo": 10, "m": "10月", "q": "“我们办了创新培训。什么都没走出那间屋子。”", "s": "Tomás 的团队采访了一位真实的同事。", "e": "一次真实的采访，和一位觉得被倾听的同事。", "p": ["Tomás"], "href": "/programmes/new-people-new-tools/#c11"}, {"n": 12, "mo": 10, "m": "10月", "q": "“交接错误不断出现在事故报告里。”", "s": "同样的做法，搬到了医院病区。", "e": "一次从担心说起的换班。", "p": [], "href": "/programmes/new-people-new-tools/#c12"}]}, {"key": "a4", "num": "IV", "name": "裁员之后", "months": "十一月", "arc": "一次重组。留下来的人沉默了。Ana 只回答三种话：“是真的”“不是真的”，或者“我还不知道，某天之前我会告诉你”。", "from": 11, "to": 12, "href": "/programmes/after-the-cut/", "cases": [{"n": 13, "mo": 11, "m": "11月", "q": "“重组之后，团队安静了。”", "s": "Ana 只用三种方式回答。", "e": "有日期的承诺，在下一次团队会议上先兑现。", "p": ["Ana"], "href": "/programmes/after-the-cut/#c13"}]}], "events": {"1": "Ana 升职", "8": "AI 许可证到了", "11": "公司重组"}, "people": [{"n": "Ana", "r": "新任团队负责人", "c": [2, 8, 13]}, {"n": "Nadia", "r": "人力资源", "c": [1, 7]}, {"n": "Sam", "r": "总经理", "c": [4, 6]}, {"n": "Priya", "r": "带领跨办公室的团队", "c": [5, 7]}, {"n": "Mei", "r": "新人", "c": [8, 9]}, {"n": "Leo", "r": "Ana 团队的工程师", "c": [2, 9]}, {"n": "Tomás", "r": "产品", "c": [7, 11]}, {"n": "Jordi", "r": "销售", "c": [10]}]}, "es": {"title": "Casos — FREE//BUILDER", "h1": "Trece problemas que nos trae la gente. Una empresa inventada, un año.", "trailer": "Ver el tráiler", "trailerMeta": "1 minuto", "prog": "El programa", "cta": "¿Te suena? 30 minutos, sin presentación.", "year": "Un año en la empresa", "mi": "E F M A M J J A S O N D", "follow": "Sigue a alguien durante el año", "all": "Todos", "ended": "Cómo acabó", "whatHappens": "Qué pasa", "groups": [{"key": "a1", "num": "I", "name": "La petición", "months": "De enero a marzo", "arc": "Nadia, de RR. HH., recibe una petición: \"los jefes de equipo necesitan formación en feedback\". El diagnóstico apunta a otro sitio: Ana, ascendida en enero, lleva sus primeros 1:1 como si fueran reuniones de estado.", "from": 1, "to": 3, "href": "/programmes/the-ask/", "cases": [{"n": 1, "mo": 1, "m": "Enero", "q": "«Alguien ha pedido una formación.»", "s": "Nadia lee la petición en voz alta.", "e": "Un programa que no se hizo, o que se hizo como práctica entre personas.", "p": ["Nadia"], "href": "/programmes/the-ask/#c1"}, {"n": 2, "mo": 2, "m": "Febrero", "q": "«Ascendimos a nuestros mejores ingenieros; ahora llevan los 1:1 como reuniones de estado.»", "s": "Ana ensaya y luego se sienta con Leo de verdad.", "e": "Una pregunta de apertura acordada en los dos calendarios.", "p": ["Ana", "Leo"], "href": "/programmes/the-ask/#c2"}, {"n": 3, "mo": 3, "m": "Marzo", "q": "«El feedback ocurre una vez al año, en un formulario.»", "s": "El primer gracias se dice en voz alta.", "e": "Un gracias dicho en persona, y una reparación en marcha.", "p": [], "href": "/programmes/the-ask/#c3"}]}, {"key": "a2", "num": "II", "name": "La sala se calla", "months": "De abril a junio", "arc": "Un casi-accidente que nadie reporta. El equipo de Priya solo escucha en la llamada del lunes. Una decisión tomada en la reunión y deshecha en el aparcamiento. Tres funciones se culpan por el mismo retraso. Entonces Sam, el director que siempre está seguro, cuenta primero un error suyo.", "from": 4, "to": 6, "href": "/programmes/the-room-goes-quiet/", "cases": [{"n": 4, "mo": 4, "m": "Abril", "q": "«Nadie dice nada en la reunión, y luego todo en el pasillo.»", "s": "Sam cuelga la primera pieza.", "e": "Una responsable contó primero un error suyo, delante del equipo.", "p": ["Sam"], "href": "/programmes/the-room-goes-quiet/#c4"}, {"n": 5, "mo": 4, "m": function follow(n) {
  who = n;
  document.querySelectorAll(".who-b").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.who === n)));
  document.documentElement.classList.toggle("following", !!n);
  document.querySelectorAll("[data-p]").forEach(el => el.classList.toggle("on", !!n && el.dataset.p.split(" ").includes(n)));
}
function wire() {
  document.querySelectorAll(".who-b").forEach(b => b.addEventListener("click", () => {
    const n = b.dataset.who === who ? "" : b.dataset.who; follow(n);
    if (n) { const first = document.querySelector(".cs.on"); if (first && first.getBoundingClientRect().top > innerHeight) first.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center" }); }
  }));
  follow(who);
  const yr = document.querySelector(".yr");
  if (yr && "IntersectionObserver" in window && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
    yr.classList.add("pre");
    const io = new IntersectionObserver(es => { if (es[0].isIntersecting) { yr.classList.remove("pre"); yr.classList.add("go"); io.disconnect(); } }, { threshold: .3 });
    io.observe(yr);
  }
}
const dlg = document.getElementById("vid"), vid = dlg.querySelector("video");
function openVideo() { dlg.showModal(); vid.play().catch(() => {}); }
dlg.querySelector(".x").addEventListener("click", () => dlg.close());
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });
dlg.addEventListener("close", () => { vid.pause(); });
window.FBL_SET = l => { lang = l; render(); }; window.FBL_GET = () => lang;
let saved = null; try { saved = localStorage.getItem("wm_preferred_lang") || localStorage.getItem("wm_cases_lang"); } catch (e) {}
const nav = (navigator.language || "").toLowerCase();
lang = ["en", "zh", "zh-Hant", "es", "ca"].includes(saved) ? saved : nav.startsWith("zh") ? "zh" : nav.startsWith("es") ? "es" : "en";
render();
if (location.hash) { const el = document.querySelector(location.hash); if (el) el.scrollIntoView(); }
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("/sw.js", { scope: "/" }).catch(() => {});
})();
</script>
