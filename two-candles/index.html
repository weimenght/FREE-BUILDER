<!DOCTYPE html>

<head>
<meta charset="UTF-8"><meta name="referrer" content="same-origin" data-fbr><script data-fbl data-mode="game" src="/fbkit/fb.js?v=5900b20222"></script><meta name="referrer" content="same-origin">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Two Candles</title>
<meta name="description" content="Dinner for two people who live apart. Book a day you each see in your own time, shop for the same dinner, then light the candles, cook it step by step and eat together. It ends with the phone down.">
<meta name="theme-color" content="#f6eee2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#150d13" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">

<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  html, body { margin:0; height:100%; background:#f6eee2; overflow:hidden; overscroll-behavior:none; }
  @media (prefers-color-scheme: dark) { html, body, iframe { background:#150d13 !important; } }
  iframe { position:fixed; inset:0; width:100%; height:100%; border:0; display:block; background:#f6eee2; }
  noscript p { font:16px/1.5 Georgia, serif; text-align:center; padding:40vh 24px 0; margin:0; }
</style>

<body>
<!-- Two Candles on its own: the same table as in town (/nearby/two-candles/), here with what a dinner apart needs
     (app.js: book a day each of you sees in your own time, a .ics each, the same recipe with a shopping list you tick
     alone, the table, and after dinner the next one). The booking travels only in the link (?t=CODE#w=…), never to a server. -->
<iframe id="table" title="Two Candles" allow="autoplay; fullscreen; screen-wake-lock; clipboard-write; web-share"></iframe>
<noscript><p>Two Candles needs JavaScript to light.</p></noscript>
<script>
(function () {
  var NAME = { en: "Two Candles", zh: "双烛小馆", "zh-Hant": "雙燭小館", es: "Dos Velas", ca: "Dues Espelmes" };
  var qs = new URLSearchParams(location.search), lang = qs.get("fbl");
  try { if (lang && NAME[lang]) localStorage.setItem("wm_preferred_lang", lang); lang = lang || localStorage.getItem("wm_preferred_lang"); } catch (e) {}
  if (!NAME[lang]) { var n = (navigator.language || "en").toLowerCase(); lang = /^zh-(tw|hk|mo|hant)/.test(n) ? "zh-Hant" : /^zh/.test(n) ? "zh" : /^ca/.test(n) ? "ca" : /^es/.test(n) ? "es" : "en"; }
  document.documentElement.lang = lang === "zh" ? "zh-Hans" : lang; document.title = NAME[lang];
  /* the table itself; app.js reads ?t= and the booking after # from this page's address and keeps it up to date */
  var f = document.getElementById("table"); f.src = "/nearby/two-candles/?solo=1&app=1";
  f.addEventListener("load", function () { try { f.contentWindow.focus(); } catch (e) {} });
})();
</script>
</body>
</html>
